# ── Production Docker Compose ──────────────────────────────────
# Full stack: databases + backend (x2) + frontend + nginx load balancer
#
# Usage:
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# NOTE on env naming: backend config (backend/config.py) uses pydantic
# env_prefix="PLATFORM_" — service env vars below must carry that prefix.
# Unprefixed names (NEO4J_URI etc.) are silently ignored → localhost defaults.

services:
  # ── Databases ────────────────────────────────────────────────
  postgres:
    # Inlined (was extends docker-compose.yml) — extends inherited the dev
    # file's 0.0.0.0:5432 port binding (core-audit 2026-09-29). Internal
    # network only now; no host port.
    image: postgres:15-alpine
    container_name: dream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dream_app
      POSTGRES_USER: dream_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_user -d dream_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  # Defined fully (not `extends`) — extends merges port lists, so the
  # inherited 7474/7687 bindings would still collide with a local
  # neo4j-atlas instance. Internal traffic uses bolt://neo4j:7687.
  neo4j:
    image: neo4j:5.20-community
    container_name: dream-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dream_neo4j_2024}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  redis:
    # Inlined (was extends) — dev file carried an unauthenticated 0.0.0.0:6379
    # binding. Now: internal-only + requirepass (core-audit 2026-09-29).
    image: redis:7-alpine
    container_name: dream-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - dream-net

  qdrant:
    # Inlined (was extends) — dev file carried 0.0.0.0:6333-6334 bindings.
    # Internal network only; no host ports (core-audit 2026-09-29).
    image: qdrant/qdrant:latest
    container_name: dream-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  # ── One-shot DB init (creates tables + seeds) ────────────────
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dream-db-init
    environment: &backend-env
      PLATFORM_ENV: production
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET must be set}
      PLATFORM_DATABASE_URL: postgresql+asyncpg://dream_user:${POSTGRES_PASSWORD:-dream_secure_2024}@postgres:5432/dream_app
      DATABASE_URL: postgresql+asyncpg://dream_user:${POSTGRES_PASSWORD:-dream_secure_2024}@postgres:5432/dream_app
      PLATFORM_NEO4J_URI: bolt://neo4j:7687
      PLATFORM_NEO4J_USER: neo4j
      PLATFORM_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dream_neo4j_2024}
      PLATFORM_REDIS_URL: redis://:at_mj93IR9URGYEIPaXGikkewwxkUBBiFBW@redis:6379/0
      PLATFORM_QDRANT_URL: http://qdrant:6333
      PLATFORM_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:3001}
      # Deterministic truth-core default. Set to fallback only for an
      # explicitly approved experiment; it is never used by /v3/deterministic.
      SOLVER_LLM_MODE: ${SOLVER_LLM_MODE:-off}
      INTERACTIONS_PATH: /app/cbse_data/interactions.json
      ORGANIZED_CONTENT_DIR: /app/organized
      ENRICHMENT_JSONL: /app/parsed_output/enrichment.jsonl
      # CISCE content library + STEM knowledge graph (host corpora, read-only)
      CISCE_CONTENT_ROOT: /app/cisce
      CISCE_GRAPH_DIR: /app/cisce_stem
      # Non-prefixed duplicates for services that read bare env names
      # (graph_service reads NEO4J_URI, llm clients read FREELLM_*).
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dream_neo4j_2024}
      REDIS_URL: redis://:at_mj93IR9URGYEIPaXGikkewwxkUBBiFBW@redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dream_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dream_ch_2024}
      # LLM client → Gemini's OpenAI-compatible endpoint (tutor fallback
      # layer + hint generation). FREELLM_API_KEY falls back to GEMINI_API_KEY.
      # NOTE: do not trust FREELLM_* shell envs here -- the host has stale
      # values (FREELLM_API_URL=localhost:3001/v1, KEY=freellma..., MODEL=auto)
      # that shadow .env and silently break every LLM call.  Pin the real
      # endpoint/model; only the key stays env-driven.
      FREELLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai
      FREELLM_API_KEY: ${GEMINI_API_KEY:-}
      FREELLM_MODEL: ${FREELLM_GEMINI_MODEL:-gemma-4-31b-it,gemma-4-26b-a4b-it}
      # fast boot: file-count fingerprint instead of statting all 9,110
      # corpus files on the Windows bind mount (saves ~30s/worker/restart)
      ENHANCED_NODES_FAST_FINGERPRINT: "1"
      # Vision extraction (camera → problem text) — NIM OCR/vision models
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    volumes:
      - D:/cisce:/app/cisce:ro
      - D:/_KEEP/atomic_graph/cisce_stem:/app/cisce_stem:ro
    command: python -m backend.init_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dream-net

  # ── Backend instance 1 ──────────────────────────────────────
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dream-backend-1
    restart: unless-stopped
    volumes:
      - ./organized:/app/organized:ro
      - ./parsed_output/enrichment.jsonl:/app/parsed_output/enrichment.jsonl:ro
      - ./content:/app/content:ro
      - D:/platform/runtime_data:/app/cbse_data
      # Atlas data assets (host corpora under D:/platform, read-only):
      # diagnostics + misconceptions jsonl, study packs, diagram specs.
      - ../parsed_output/diagnostics.jsonl:/app/parsed_output/diagnostics.jsonl:ro
      - ../parsed_output/misconceptions.jsonl:/app/parsed_output/misconceptions.jsonl:ro
      - ../parsed_output/cbse_supporting_files_topicwise:/app/parsed_output/cbse_supporting_files_topicwise:ro
      # Study packs (English + legacy CBSE supporting files; hindi deferred).
      - ../parsed_output/english_supporting_files:/app/parsed_output/english_supporting_files:ro
      - ../parsed_output/english_c1_8_supporting_files:/app/parsed_output/english_c1_8_supporting_files:ro
      - ../parsed_output/cbse_supporting_files:/app/parsed_output/cbse_supporting_files:ro
      # Nested file bind inside the runtime_data mount (identical copy verified).
      - ../cbse_data/content/diagrams/diagrams_index.json:/app/cbse_data/content/diagrams/diagrams_index.json:ro
      - hf_cache:/app/hf_cache
    environment:
      <<: *backend-env
      # --preload warms indexes once in the master; forked workers inherit
      # them via COW, so 2 workers serve the full traffic shape. 4 workers
      # spike past available RAM during boot (exit-137 observed).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # MiniLM weights ship inside the hf_cache NAMED VOLUME (Linux-native
      # fs) -- the old cbse_data bind-mount path wedged boots on Windows
      # (flock/futex semantics don't translate) and made model loads slow.
      HF_HOME: /app/hf_cache
      ENHANCED_NODES_FAST_FINGERPRINT: "1"
      # warm once in the gunicorn master (--preload); workers inherit
      ATLAS_MASTER_WARM: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SOLVER_POOL_SIZE: ${SOLVER_POOL_SIZE:-8}
      SOLVER_TIMEOUT_S: ${SOLVER_TIMEOUT_S:-12}
      FREE_TEXT_TIMEOUT_S: ${FREE_TEXT_TIMEOUT_S:-10}
      IDENTIFY_TIMEOUT_S: ${IDENTIFY_TIMEOUT_S:-15}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      dream-net:
        aliases:
          - backends

  # ── Backend instance 2 (replica — nginx round-robins via the
  #    shared 'backends' DNS alias on dream-net) ────────────────
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dream-backend-2
    restart: unless-stopped
    volumes:
      - ./organized:/app/organized:ro
      - ./parsed_output/enrichment.jsonl:/app/parsed_output/enrichment.jsonl:ro
      - ./content:/app/content:ro
      - D:/platform/runtime_data:/app/cbse_data
      # Atlas data assets (host corpora under D:/platform, read-only):
      # diagnostics + misconceptions jsonl, study packs, diagram specs.
      - ../parsed_output/diagnostics.jsonl:/app/parsed_output/diagnostics.jsonl:ro
      - ../parsed_output/misconceptions.jsonl:/app/parsed_output/misconceptions.jsonl:ro
      - ../parsed_output/cbse_supporting_files_topicwise:/app/parsed_output/cbse_supporting_files_topicwise:ro
      # Study packs (English + legacy CBSE supporting files; hindi deferred).
      - ../parsed_output/english_supporting_files:/app/parsed_output/english_supporting_files:ro
      - ../parsed_output/english_c1_8_supporting_files:/app/parsed_output/english_c1_8_supporting_files:ro
      - ../parsed_output/cbse_supporting_files:/app/parsed_output/cbse_supporting_files:ro
      # Nested file bind inside the runtime_data mount (identical copy verified).
      - ../cbse_data/content/diagrams/diagrams_index.json:/app/cbse_data/content/diagrams/diagrams_index.json:ro
      - hf_cache:/app/hf_cache
    environment:
      <<: *backend-env
      # --preload warms indexes once in the master; forked workers inherit
      # them via COW, so 2 workers serve the full traffic shape. 4 workers
      # spike past available RAM during boot (exit-137 observed).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # MiniLM weights ship inside the hf_cache NAMED VOLUME (Linux-native
      # fs) -- the old cbse_data bind-mount path wedged boots on Windows
      # (flock/futex semantics don't translate) and made model loads slow.
      HF_HOME: /app/hf_cache
      ENHANCED_NODES_FAST_FINGERPRINT: "1"
      # warm once in the gunicorn master (--preload); workers inherit
      ATLAS_MASTER_WARM: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SOLVER_POOL_SIZE: ${SOLVER_POOL_SIZE:-8}
      SOLVER_TIMEOUT_S: ${SOLVER_TIMEOUT_S:-12}
      FREE_TEXT_TIMEOUT_S: ${FREE_TEXT_TIMEOUT_S:-10}
      IDENTIFY_TIMEOUT_S: ${IDENTIFY_TIMEOUT_S:-15}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      dream-net:
        aliases:
          - backends

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # browser-visible API origin — the public URL nginx listens on
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    container_name: dream-frontend
    restart: unless-stopped
    environment:
      # server-side /api/* rewrites target the backend pool, not localhost
      INTERNAL_API_URL: http://backends:8000
      NODE_ENV: production
    volumes:
      # 4.8GB of doodle-card art — mounted at runtime, not baked into the image
      - ./frontend/public/doodle_cards:/app/public/doodle_cards:ro
    depends_on:
      backend-1:
        condition: service_healthy
    ports:
      # Host 3001 — a local next-dev server commonly holds 3000.
      # Bound to loopback: nginx :80 is the public gateway; direct :3001
      # access bypasses nginx headers/rate-limits (core-audit 2026-09-29).
      - "127.0.0.1:3001:3000"
    networks:
      - dream-net

  # ── Nginx Load Balancer ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dream-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend-1:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - dream-net

  # ── ClickHouse analytics (IRT feedback loop + attempt analytics) ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dream-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: dream_analytics
      CLICKHOUSE_USER: dream_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dream_ch_2024}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

networks:
  dream-net:
    driver: bridge

volumes:
  hf_cache:
    external: true
    name: deploy_hf_cache
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
  cbse_data:
  clickhouse_data:
