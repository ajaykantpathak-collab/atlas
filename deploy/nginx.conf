# ── Nginx Load Balancer Config ─────────────────────────────────
# Distributes traffic across multiple backend uvicorn workers
# and serves the frontend. Single entry point on port 80.

# Rate-limit zone — MUST be defined at http level (conf.d files are
# included inside http). Without this the `limit_req zone=api` below
# crashes nginx at startup.
# TIER3: 10r/s tripped for real classrooms sharing one school NAT
# (a 30-student class collectively exceeds 10r/s at idle page loads).
# 50r/s sustained with burst 100 still caps abuse per client IP.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # Security headers (core-audit 2026-09-29): nosniff stops MIME
    # confusion, DENY blocks clickjacking framing, referrer policy keeps
    # full URLs out of third-party logs.  CSP is deliberately NOT set
    # yet — the app inlines styles/scripts extensively; a strict policy
    # needs a dedicated pass or it breaks pages.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Docker embedded DNS — resolves container names fresh on EVERY
    # request instead of once at startup. Without this, recreating
    # frontend/backend containers (new IPs) leaves nginx proxying to
    # dead addresses → site-wide 502s until a manual reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Client body size for file uploads (solver expressions, etc.)
    client_max_body_size 10m;

    # Timeout settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ── API routes → backend-1 (backend-2 kept as manual standby) ──
    # NOTE: proxy_pass uses a variable so DNS re-resolves per request.
    # Original request URI is preserved (no URI part in proxy_pass).
    location /api/ {
        set $backend_upstream http://backends:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (for real-time tutor sessions)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Rate limiting zone
        limit_req zone=api burst=100 nodelay;
    }

    # ── Health check endpoint ──────────────────────────────────
    location /health {
        set $backend_upstream http://backends:8000;
        proxy_pass $backend_upstream;
        access_log off;
    }

    # ── Metrics endpoint (internal only) ───────────────────────
    # LAUNCH-FIX-F4 (2026-10-15): was allow-listed for ALL RFC1918 ranges
    # — which includes the docker bridge 172.16.0.0/12, so ANY request
    # arriving through a tunnel/sidecar container read as "internal" and
    # /metrics (handler names + status counts) was effectively public on
    # :80 (audit laneB MEDIUM). Loopback-only now: host-side Prometheus
    # scrapes http://localhost/metrics (or the backend directly on
    # 127.0.0.1:8001/metrics, which never passes through nginx at all).
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        set $backend_upstream http://backends:8000;
        proxy_pass $backend_upstream;
        access_log off;
    }

    # ── API docs ───────────────────────────────────────────────
    # Internal only (matches /metrics, LAUNCH-FIX-F4): a full endpoint
    # map is free reconnaissance. Same loopback-only tightening — the
    # old RFC1918 allow-list passed docker-bridge sources, i.e. tunneled
    # traffic. Operators keep localhost access.
    location /docs {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        set $backend_upstream http://backends:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        set $backend_upstream http://backends:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # ── Frontend (catch-all) ───────────────────────────────────
    location / {
        # NATIVE frontend: next start on the host (fe_serve.cmd).
        # The frontend container is retired; host.docker.internal reaches it.
        set $frontend_upstream http://host.docker.internal:3001;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR (dev only, harmless in prod)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
