# ─────────────────────────────────────────────────────────────────────
# DEV/INFRA-ONLY compose: databases + caches, NO app services.
# `docker compose up` here gives you postgres/redis/qdrant/etc and
# NOTHING serving them — that is by design.
#
#   Full production stack:  docker compose -f docker-compose.prod.yml
#                           --env-file .env.production up -d --build
#   (build sources live under deploy/ — see AGENTS.md)
# ─────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:15-alpine
    container_name: dream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dream_app
      POSTGRES_USER: dream_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dream_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_user -d dream_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  neo4j:
    image: neo4j:5.20-community
    container_name: dream-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dream_neo4j_2024}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  redis:
    image: redis:7-alpine
    container_name: dream-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dream-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dream-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: dream_analytics
      CLICKHOUSE_USER: dream_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dream_ch_2024}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - dream-net

  langfuse:
    image: langfuse/langfuse:latest
    container_name: dream-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dream_user:${POSTGRES_PASSWORD:-dream_secure_2024}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse_secret_2024}
      SALT: ${LANGFUSE_SALT:-langfuse_salt_2024}
      NEXTAUTH_URL: http://localhost:3001
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dream-net

networks:
  dream-net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
  clickhouse_data:
