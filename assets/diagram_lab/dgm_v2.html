<!DOCTYPE html><html><head><style>
body{margin:0;background:#0b1220;display:flex;flex-direction:column;align-items:center;padding:20px;font-family:sans-serif}
h2{color:#fbbf24;font-size:15px;margin-bottom:6px}
p{color:#94a3b8;font-size:11px;max-width:640px;text-align:center}
canvas{cursor:pointer;border-radius:8px}
</style></head><body>
<h2>Diagram engine v2 — polished</h2>
<canvas id="c" width="720" height="440"></canvas>
<p>Hover rings = peek names · tap = callout + visit tracking · explore all parts = celebration</p>
<script>
const PARTS=[
 {id:"bowmans",label:"Bowman's capsule",x:0.605,y:0.190,r:0.038,fn:"the cup catching the blood filtrate"},
 {id:"glomerulus",label:"Glomerulus",x:0.615,y:0.160,r:0.020,fn:"the capillary ball being squeezed"},
 {id:"pct",label:"Proximal convoluted tubule",x:0.680,y:0.110,r:0.055,fn:"first winding tube — reabsorbs glucose and water"},
 {id:"descending",label:"Descending limb",x:0.270,y:0.550,r:0.042,fn:"the arm diving down — lets water out"},
 {id:"loop",label:"Loop of Henle",x:0.300,y:0.870,r:0.050,fn:"the U-bend concentrating the urine"},
 {id:"ascending",label:"Ascending limb",x:0.665,y:0.450,r:0.040,fn:"the arm climbing up — lets salt out"},
 {id:"dct",label:"Distal convoluted tubule",x:0.600,y:0.790,r:0.048,fn:"second winding tube — fine-tunes salt and pH"},
 {id:"collecting",label:"Collecting duct",x:0.530,y:0.700,r:0.050,fn:"the drainpipe carrying urine to the pelvis"},
 {id:"blood",label:"Blood supply",x:0.570,y:0.130,r:0.040,fn:"the red vessel feeding the capillary ball"}];
const c=document.getElementById('c'),ctx=c.getContext('2d');
const im=new Image(); im.src='/diagrams/c10_nephron.png';
const disp={_hover:-1,_selT:0}; const seen={};
let sel=-1;
function seenFn(i){return (seen['seen_'+i]??0)>=0.5}
function paint(t){
 const w=c.width,h=c.height;
 const bg=ctx.createLinearGradient(0,0,0,h);
 bg.addColorStop(0,'#1e293b');bg.addColorStop(1,'#0f172a');
 ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 if(im.complete&&im.naturalWidth){
  const s=Math.min((w-16)/im.width,(h-16)/im.height);
  const dw=im.width*s,dh=im.height*s,ix=(w-dw)/2,iy=(h-dh)/2;
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=3;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(ix,iy,dw,dh,6);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.roundRect(ix,iy,dw,dh,6);ctx.clip();
  ctx.drawImage(im,ix,iy,dw,dh);ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(ix,iy,dw,dh,6);ctx.stroke();
 }
 const spots=PARTS,nSeen=spots.reduce((n,_,i)=>n+(seenFn(i)?1:0),0);
 const hover=disp._hover,selAge=Math.min(1,(t-disp._selT)/450);
 for(let i=0;i<spots.length;i++){
  const p=spots[i],px=p.x*w,py=p.y*h,pr=p.r*w;
  const pulse=0.30+Math.sin(t/480+i*0.9)*0.14;
  const isHov=i===hover,isSel=i===sel,isSeen=seenFn(i);
  if(isSeen){
   ctx.strokeStyle='rgba(52,211,153,0.85)';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(px,py,pr+2,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='#34d399';
   ctx.beginPath();ctx.arc(px+pr*0.75,py-pr*0.75,5,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#064e3b';ctx.lineWidth=1.4;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(px+pr*0.75-2.2,py-pr*0.75);
   ctx.lineTo(px+pr*0.75-0.5,py-pr*0.75+2);
   ctx.lineTo(px+pr*0.75+2.4,py-pr*0.75-2);ctx.stroke();
  }else{
   ctx.strokeStyle=isHov?`rgba(251,191,36,${0.65+pulse*0.3})`:`rgba(96,165,250,${pulse})`;
   ctx.lineWidth=isHov?2.2:1.5;ctx.setLineDash([4,4]);
   ctx.beginPath();ctx.arc(px,py,isHov?pr+3:pr,0,Math.PI*2);ctx.stroke();
   ctx.setLineDash([]);
  }
  if(!isSel){
   ctx.fillStyle=isSeen?'rgba(52,211,153,0.9)':'rgba(96,165,250,0.75)';
   ctx.beginPath();ctx.arc(px,py,isHov?3:2.2,0,Math.PI*2);ctx.fill();
  }
 }
 if(sel>=0&&sel<spots.length){
  const p=spots[sel],px=p.x*w,py=p.y*h,pr=p.r*w;
  if(selAge<1){
   ctx.strokeStyle=`rgba(251,191,36,${1-selAge})`;ctx.lineWidth=2.5;
   ctx.beginPath();ctx.arc(px,py,pr+6+selAge*26,0,Math.PI*2);ctx.stroke();
  }
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=2.5;ctx.setLineDash([7,5]);
  ctx.beginPath();ctx.arc(px,py,pr+8,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  const pop=1-Math.pow(1-Math.min(1,selAge*1.6),3);
  const cardW=186,cardH=52,lx=Math.min(w-cardW-8,px+pr+12),ly=Math.max(30,py-18);
  ctx.save();ctx.globalAlpha=pop;
  ctx.translate(lx+cardW/2,ly+cardH/2);ctx.scale(0.85+pop*0.15,0.85+pop*0.15);
  ctx.translate(-lx-cardW/2,-ly-cardH/2);
  const g=ctx.createLinearGradient(lx,ly,lx,ly+cardH);
  g.addColorStop(0,'rgba(30,41,59,0.97)');g.addColorStop(1,'rgba(15,23,42,0.97)');
  ctx.fillStyle=g;ctx.strokeStyle='rgba(251,191,36,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(lx,ly,cardW,cardH,9);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.font='bold 10px sans-serif';ctx.textAlign='left';
  ctx.fillText(`${sel+1}/${spots.length}  ${p.label}`,lx+9,ly+15);
  ctx.fillStyle='#cbd5e1';ctx.font='8.5px sans-serif';
  ctx.fillText(p.fn.slice(0,46),lx+9,ly+28);
  if(p.fn.length>46)ctx.fillText(p.fn.slice(46,92),lx+9,ly+40);
  ctx.restore();
 }
 if(hover>=0&&hover<spots.length&&hover!==sel&&!seenFn(hover)){
  const p=spots[hover],px=p.x*w,py=p.y*h;
  ctx.font='bold 9.5px sans-serif';
  const tw=ctx.measureText(p.label).width+14;
  const tx=Math.min(w-tw-6,px+p.r*w+10),ty=py-6;
  ctx.fillStyle='rgba(251,191,36,0.92)';ctx.beginPath();ctx.roundRect(tx,ty,tw,15,7);ctx.fill();
  ctx.fillStyle='#0f172a';ctx.textAlign='left';ctx.fillText(p.label,tx+7,ty+10.5);
 }
 ctx.fillStyle='rgba(15,23,42,0.8)';ctx.beginPath();ctx.roundRect(8,8,92,20,10);ctx.fill();
 ctx.fillStyle=nSeen===spots.length&&spots.length?'#34d399':'#93c5fd';
 ctx.font='bold 9.5px sans-serif';ctx.textAlign='left';
 ctx.fillText(`🔍 ${nSeen}/${spots.length} explored`,15,21.5);
 requestAnimationFrame(paint);
}
c.onmousemove=e=>{
 const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;
 const sx=x*360/c.width,sy=y*200/c.height;
 disp._hover=PARTS.findIndex(s=>Math.hypot(sx-s.x*360,sy-s.y*200)<=s.r*360);
 c.style.cursor=disp._hover>=0?'pointer':'default';
};
c.onclick=e=>{
 const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;
 const sx=x*360/c.width,sy=y*200/c.height;
 const hit=PARTS.findIndex(s=>Math.hypot(sx-s.x*360,sy-s.y*200)<=s.r*360);
 sel=hit;
 if(hit>=0){seen['seen_'+hit]=1;disp._selT=performance.now();}
};
requestAnimationFrame(paint);
</script></body></html>
