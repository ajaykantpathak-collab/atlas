---
- formula_id: "CHM_KIN_001"
  name: "General Rate Law"
  latex: "rate = k [A]^m [B]^n"
  variables:
    - symbol: "rate"
      name: "reaction rate"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "k"
      name: "rate constant"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "[A], [B]"
      name: "concentrations of reactants"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "m, n"
      name: "reaction orders"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "order"
  preconditions: "Elementary reaction or determined experimentally"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["rate-law", "order-of-reaction", "rate-constant"]

- formula_id: "CHM_KIN_002"
  name: "Zero Order Integrated Rate Law"
  latex: "[A] = [A]_0 - kt"
  variables:
    - symbol: "[A]"
      name: "concentration at time t"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k"
      name: "zero order rate constant"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "t"
      name: "time"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
  preconditions: "Zero order reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["integrated-rate-law", "zero-order"]

- formula_id: "CHM_KIN_003"
  name: "First Order Integrated Rate Law"
  latex: "ln([A]) = ln([A]_0) - kt"
  variables:
    - symbol: "[A]"
      name: "concentration at time t"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k"
      name: "first order rate constant"
      unit: "s^{-1}"
      dimensional_formula: "T^{-1}"
      quantity_type: "rate"
    - symbol: "t"
      name: "time"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
  preconditions: "First order reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["integrated-rate-law", "first-order"]

- formula_id: "CHM_KIN_004"
  name: "Second Order Integrated Rate Law (Single Reactant)"
  latex: "\\frac{1}{[A]} = \\frac{1}{[A]_0} + kt"
  variables:
    - symbol: "[A]"
      name: "concentration at time t"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k"
      name: "second order rate constant"
      unit: "L mol^{-1} s^{-1}"
      dimensional_formula: "M^{-1} T^{-1}"
      quantity_type: "rate"
    - symbol: "t"
      name: "time"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
  preconditions: "Second order reaction with single reactant"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["integrated-rate-law", "second-order"]

- formula_id: "CHM_KIN_005"
  name: "Second Order Integrated Rate Law (Two Reactants)"
  latex: "\\frac{1}{[B]_0 - [A]_0} ln\\frac{[A][B]_0}{[B][A]_0} = kt"
  variables:
    - symbol: "[A], [B]"
      name: "concentrations at time t"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "[A]_0, [B]_0"
      name: "initial concentrations"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k"
      name: "second order rate constant"
      unit: "L mol^{-1} s^{-1}"
      dimensional_formula: "M^{-1} T^{-1}"
      quantity_type: "rate"
    - symbol: "t"
      name: "time"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
  preconditions: "Second order reaction with two reactants of different initial concentrations"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["integrated-rate-law", "second-order", "two-reactants"]

- formula_id: "CHM_KIN_006"
  name: "Half-Life (Zero Order)"
  latex: "t_{1/2} = \\frac{[A]_0}{2k}"
  variables:
    - symbol: "t_{1/2}"
      name: "half-life"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k"
      name: "zero order rate constant"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
  preconditions: "Zero order reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["half-life", "zero-order"]

- formula_id: "CHM_KIN_007"
  name: "Half-Life (First Order)"
  latex: "t_{1/2} = \\frac{ln(2)}{k} \\approx \\frac{0.693}{k}"
  variables:
    - symbol: "t_{1/2}"
      name: "half-life"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "k"
      name: "first order rate constant"
      unit: "s^{-1}"
      dimensional_formula: "T^{-1}"
      quantity_type: "rate"
    - symbol: "ln(2)"
      name: "natural logarithm of 2"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "constant"
  preconditions: "First order reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["half-life", "first-order"]

- formula_id: "CHM_KIN_008"
  name: "Half-Life (Second Order)"
  latex: "t_{1/2} = \\frac{1}{k [A]_0}"
  variables:
    - symbol: "t_{1/2}"
      name: "half-life"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "k"
      name: "second order rate constant"
      unit: "L mol^{-1} s^{-1}"
      dimensional_formula: "M^{-1} T^{-1}"
      quantity_type: "rate"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
  preconditions: "Second order reaction with single reactant"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["half-life", "second-order"]

- formula_id: "CHM_KIN_009"
  name: "Arrhenius Equation"
  latex: "k = A e^{-E_a/RT}"
  variables:
    - symbol: "k"
      name: "rate constant"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "A"
      name: "pre-exponential factor"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "E_a"
      name: "activation energy"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "R"
      name: "gas constant"
      unit: "J mol^{-1} K^{-1}"
      dimensional_formula: "M L^2 T^{-2} Θ^{-1}"
      quantity_type: "constant"
    - symbol: "T"
      name: "absolute temperature"
      unit: "K"
      dimensional_formula: "Θ"
      quantity_type: "temperature"
  preconditions: "Temperature range where Arrhenius behavior holds"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["arrhenius", "activation-energy", "temperature-dependence"]

- formula_id: "CHM_KIN_010"
  name: "Arrhenius Two-Point Form"
  latex: "ln\\frac{k_2}{k_1} = \\frac{E_a}{R}\\left(\\frac{1}{T_1} - \\frac{1}{T_2}\\right)"
  variables:
    - symbol: "k_1, k_2"
      name: "rate constants at temperatures T1 and T2"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "E_a"
      name: "activation energy"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "R"
      name: "gas constant"
      unit: "J mol^{-1} K^{-1}"
      dimensional_formula: "M L^2 T^{-2} Θ^{-1}"
      quantity_type: "constant"
    - symbol: "T_1, T_2"
      name: "absolute temperatures"
      unit: "K"
      dimensional_formula: "Θ"
      quantity_type: "temperature"
  preconditions: "Arrhenius behavior; T1 and T2 in Kelvin"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["arrhenius", "two-point", "activation-energy"]

- formula_id: "CHM_KIN_011"
  name: "Activation Energy from Arrhenius Plot"
  latex: "E_a = -R \\cdot slope"
  variables:
    - symbol: "E_a"
      name: "activation energy"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "R"
      name: "gas constant"
      unit: "J mol^{-1} K^{-1}"
      dimensional_formula: "M L^2 T^{-2} Θ^{-1}"
      quantity_type: "constant"
    - symbol: "slope"
      name: "slope of ln(k) vs 1/T plot"
      unit: "K"
      dimensional_formula: "Θ"
      quantity_type: "slope"
  preconditions: "Linear Arrhenius plot of ln(k) versus 1/T"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["arrhenius", "activation-energy", "graphical-method"]

- formula_id: "CHM_KIN_012"
  name: "Collision Frequency (A and B)"
  latex: "Z_{AB} = N_A N_B \\sigma_{AB} \\bar{v}_{AB}"
  variables:
    - symbol: "Z_{AB}"
      name: "collision frequency between A and B"
      unit: "collisions m^{-3} s^{-1}"
      dimensional_formula: "L^{-3} T^{-1}"
      quantity_type: "frequency"
    - symbol: "N_A, N_B"
      name: "number densities"
      unit: "m^{-3}"
      dimensional_formula: "L^{-3}"
      quantity_type: "number_density"
    - symbol: "\\sigma_{AB}"
      name: "collision cross-section"
      unit: "m^2"
      dimensional_formula: "L^2"
      quantity_type: "area"
    - symbol: "\\bar{v}_{AB}"
      name: "average relative speed"
      unit: "m s^{-1}"
      dimensional_formula: "L T^{-1}"
      quantity_type: "velocity"
  preconditions: "Ideal gas; hard-sphere collision model"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["collision-theory", "collision-frequency"]

- formula_id: "CHM_KIN_013"
  name: "Collision Theory Rate Constant"
  latex: "k = P Z_{AB} e^{-E_a/RT}"
  variables:
    - symbol: "k"
      name: "rate constant"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "P"
      name: "steric factor"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "probability"
    - symbol: "Z_{AB}"
      name: "collision frequency"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "frequency"
    - symbol: "E_a"
      name: "activation energy"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "R"
      name: "gas constant"
      unit: "J mol^{-1} K^{-1}"
      dimensional_formula: "M L^2 T^{-2} Θ^{-1}"
      quantity_type: "constant"
    - symbol: "T"
      name: "absolute temperature"
      unit: "K"
      dimensional_formula: "Θ"
      quantity_type: "temperature"
  preconditions: "Bimolecular gas-phase reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["collision-theory", "rate-constant", "steric-factor"]

- formula_id: "CHM_KIN_014"
  name: "Steric Factor (Collision Theory)"
  latex: "P = \\frac{A_{exp}}{A_{theory}}"
  variables:
    - symbol: "P"
      name: "steric factor"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "probability"
    - symbol: "A_{exp}"
      name: "experimental pre-exponential factor"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "A_{theory}"
      name: "theoretical collision frequency factor"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
  preconditions: "Comparison of experimental and theoretical Arrhenius A factors"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["collision-theory", "steric-factor", "pre-exponential-factor"]

- formula_id: "CHM_KIN_015"
  name: "Michaelis-Menten Equation"
  latex: "v = \\frac{V_{max}[S]}{K_m + [S]}"
  variables:
    - symbol: "v"
      name: "reaction velocity"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "V_{max}"
      name: "maximum velocity"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "[S]"
      name: "substrate concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "K_m"
      name: "Michaelis constant"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
  preconditions: "Enzyme-catalyzed reaction at steady state"
  grade_range: ["13", "14", "15", "16"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["michaelis-menten", "enzyme-kinetics", "vmax", "km"]

- formula_id: "CHM_KIN_016"
  name: "Lineweaver-Burk Equation"
  latex: "\\frac{1}{v} = \\frac{K_m}{V_{max}}\\frac{1}{[S]} + \\frac{1}{V_{max}}"
  variables:
    - symbol: "v"
      name: "reaction velocity"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "V_{max}"
      name: "maximum velocity"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "[S]"
      name: "substrate concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "K_m"
      name: "Michaelis constant"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
  preconditions: "Enzyme kinetics; linear transformation of Michaelis-Menten"
  grade_range: ["13", "14", "15", "16"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["lineweaver-burk", "enzyme-kinetics", "double-reciprocal"]

- formula_id: "CHM_KIN_017"
  name: "Catalytic Rate Enhancement"
  latex: "\\frac{k_{cat}}{k_{uncat}} = e^{-(E_{a,cat} - E_{a,uncat})/RT}"
  variables:
    - symbol: "k_{cat}"
      name: "rate constant with catalyst"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "k_{uncat}"
      name: "rate constant without catalyst"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "E_{a,cat}"
      name: "activation energy with catalyst"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "E_{a,uncat}"
      name: "activation energy without catalyst"
      unit: "J mol^{-1}"
      dimensional_formula: "M L^2 T^{-2}"
      quantity_type: "energy"
    - symbol: "R"
      name: "gas constant"
      unit: "J mol^{-1} K^{-1}"
      dimensional_formula: "M L^2 T^{-2} Θ^{-1}"
      quantity_type: "constant"
    - symbol: "T"
      name: "absolute temperature"
      unit: "K"
      dimensional_formula: "Θ"
      quantity_type: "temperature"
  preconditions: "Same reaction with and without catalyst"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["catalysis", "rate-enhancement", "activation-energy"]

- formula_id: "CHM_KIN_018"
  name: "Pseudo-First Order Rate Constant"
  latex: "k' = k [B]_0"
  variables:
    - symbol: "k'"
      name: "pseudo-first order rate constant"
      unit: "s^{-1}"
      dimensional_formula: "T^{-1}"
      quantity_type: "rate"
    - symbol: "k"
      name: "second order rate constant"
      unit: "L mol^{-1} s^{-1}"
      dimensional_formula: "M^{-1} T^{-1}"
      quantity_type: "rate"
    - symbol: "[B]_0"
      name: "initial concentration of excess reactant"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
  preconditions: "One reactant in large excess; [B] ≈ constant"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["pseudo-first-order", "rate-constant", "excess-reactant"]

- formula_id: "CHM_KIN_019"
  name: "Overall Reaction Order"
  latex: "n = \\sum_{i=1}^{N} m_i"
  variables:
    - symbol: "n"
      name: "overall reaction order"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "order"
    - symbol: "m_i"
      name: "order with respect to reactant i"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "order"
    - symbol: "N"
      name: "number of reactants"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "count"
  preconditions: "Rate law expressed as sum of orders"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["reaction-order", "overall-order"]

- formula_id: "CHM_KIN_020"
  name: "Temperature Coefficient (Q10)"
  latex: "Q_{10} = \\frac{k_{T+10}}{k_T}"
  variables:
    - symbol: "Q_{10}"
      name: "temperature coefficient"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "coefficient"
    - symbol: "k_{T+10}"
      name: "rate constant at T+10 K"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
    - symbol: "k_T"
      name: "rate constant at temperature T"
      unit: "varies"
      dimensional_formula: "varies"
      quantity_type: "constant"
  preconditions: "10 K temperature interval; biological systems"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["temperature-coefficient", "q10", "rate-constant"]

- formula_id: "CHM_KIN_021"
  name: "Fractional Life (First Order)"
  latex: "t_x = \\frac{t_{1/2}}{0.693} ln\\frac{100}{100-x}"
  variables:
    - symbol: "t_x"
      name: "time for x% completion"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "t_{1/2}"
      name: "half-life"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "x"
      name: "percentage completion"
      unit: "%"
      dimensional_formula: "1"
      quantity_type: "percentage"
  preconditions: "First order reaction"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["fractional-life", "first-order", "completion-time"]

- formula_id: "CHM_KIN_022"
  name: "Mean Lifetime (First Order)"
  latex: "\\tau = \\frac{1}{k}"
  variables:
    - symbol: "\\tau"
      name: "mean lifetime"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
    - symbol: "k"
      name: "first order rate constant"
      unit: "s^{-1}"
      dimensional_formula: "T^{-1}"
      quantity_type: "rate"
  preconditions: "First order decay process"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["mean-lifetime", "first-order", "decay"]

- formula_id: "CHM_KIN_023"
  name: "Third Order Integrated Rate Law"
  latex: "\\frac{1}{[A]^2} = \\frac{1}{[A]_0^2} + 2k_3 t"
  variables:
    - symbol: "[A]"
      name: "concentration at time t"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "[A]_0"
      name: "initial concentration"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "k_3"
      name: "third order rate constant"
      unit: "L^2 mol^{-2} s^{-1}"
      dimensional_formula: "M^{-2} T^{-1}"
      quantity_type: "rate"
    - symbol: "t"
      name: "time"
      unit: "s"
      dimensional_formula: "T"
      quantity_type: "time"
  preconditions: "Third order reaction with single reactant"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
  concept_tags: ["integrated-rate-law", "third-order"]

- formula_id: "CHM_KIN_024"
  name: "Fractional Order Rate Law"
  latex: "rate = k [A]^{3/2}"
  variables:
    - symbol: "rate"
      name: "reaction rate"
      unit: "mol L^{-1} s^{-1}"
      dimensional_formula: "M T^{-1}"
      quantity_type: "rate"
    - symbol: "k"
      name: "rate constant"
      unit: "mol^{-1/2} L^{1/2} s^{-1}"
      dimensional_formula: "M^{-1/2} T^{-1}"
      quantity_type: "constant"
    - symbol: "[A]"
      name: "concentration of reactant"
      unit: "mol L^{-1}"
      dimensional_formula: "M"
      quantity_type: "concentration"
    - symbol: "3/2"
      name: "fractional order"
      unit: "dimensionless"
      dimensional_formula: "1"
      quantity_type: "order"
  preconditions: "Reaction with fractional order"
  grade_range: ["11", "12", "13", "14"]
  chapter: "Chemical Kinetics"
  subject: "chemistry"
