  grade_range: ["class12","ug"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_FARADAY"]

- formula_id: "CHM_ELECTRO_004"
  name: "Electrochemical equivalent from molar mass"
  latex: "Z = \\frac{M}{nF}, \quad m = \\frac{M \\cdot I \\cdot t}{nF}"
  variables:
    - symbol: "Z"
      name: "electrochemical_equivalent"
      unit: "g/C"
    - symbol: "M"
      name: "molar_mass"
      unit: "g/mol"
    - symbol: "n"
      name: "number_of_electrons_transferred"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
  preconditions: ["electrolysis"]
  grade_range: ["class12","ug","pg"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_FARADAY"]

- formula_id: "CHM_ELECTRO_005"
  name: "Moles of substance from Faraday's laws"
  latex: "n_{substance} = \\frac{Q}{nF} = \\frac{It}{nF}"
  variables:
    - symbol: "n_substance"
      name: "moles_of_substance_deposited"
      unit: "mol"
    - symbol: "Q"
      name: "total_charge"
      unit: "C"
    - symbol: "n"
      name: "number_of_electrons"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
    - symbol: "I"
      name: "current"
      unit: "A"
    - symbol: "t"
      name: "time"
      unit: "s"
