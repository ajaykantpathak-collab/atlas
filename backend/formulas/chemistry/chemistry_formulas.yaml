  grade_range: ["class12","ug","pg"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_FARADAY"]

- formula_id: "CHM_ELECTRO_006"
  name: "Standard cell potential"
  latex: "E^\\circ_{cell} = E^\\circ_{cathode} - E^\\circ_{anode}"
  variables:
    - symbol: "E^\\circ_cell"
      name: "standard_cell_potential"
      unit: "V"
    - symbol: "E^\\circ_cathode"
      name: "standard_cathode_potential"
      unit: "V"
    - symbol: "E^\\circ_anode"
      name: "standard_anode_potential"
      unit: "V"
  preconditions: ["galvanic_cell"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_EMF"]

- formula_id: "CHM_ELECTRO_007"
  name: "Cell potential and Gibbs free energy"
  latex: "\\Delta_r G = -nFE_{cell}"
  variables:
    - symbol: "\\Delta_r G"
      name: "Gibbs_free_energy_change"
      unit: "J/mol"
    - symbol: "n"
      name: "moles_of_electrons"
      unit: "mol"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
    - symbol: "E_cell"
      name: "cell_potential"
      unit: "V"
  preconditions: ["galvanic_cell"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_EMF","CHM_GIBBS"]

- formula_id: "CHM_ELECTRO_008"
  name: "Nernst equation"
  latex: "E = E^\\circ - \\frac{RT}{nF}\\ln Q, \quad E = E^\\circ - \\frac{0.05916}{n}\\log_{10} Q \text{ at } 25°C"
  variables:
    - symbol: "E"
      name: "cell_potential"
      unit: "V"
    - symbol: "E^\\circ"
      name: "standard_cell_potential"
      unit: "V"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "n"
      name: "moles_of_electrons"
      unit: "mol"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
    - symbol: "Q"
      name: "reaction_quotient"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["galvanic_cell","nonstandard_conditions"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_NERNST"]

- formula_id: "CHM_ELECTRO_009"
  name: "Nernst equation for half-cell"
  latex: "E = E^\\circ - \\frac{RT}{nF}\\ln\\frac{[Red]}{[Ox]} = E^\\circ + \\frac{RT}{nF}\\ln\\frac{[Ox]}{[Red]}"
  variables:
    - symbol: "E"
      name: "half_cell_potential"
      unit: "V"
    - symbol: "E^\\circ"
      name: "standard_half_cell_potential"
      unit: "V"
    - symbol: "n"
      name: "number_of_electrons"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "[Ox]"
      name: "oxidized_species_concentration"
      unit: "mol/L"
    - symbol: "[Red]"
      name: "reduced_species_concentration"
      unit: "mol/L"
  preconditions: ["half_cell"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_NERNST"]

- formula_id: "CHM_ELECTRO_010"
  name: "Equilibrium constant from standard cell potential"
  latex: "\\ln K = \\frac{nFE^\\circ_{cell}}{RT}, \quad \\log K = \\frac{nE^\\circ_{cell}}{0.05916} \text{ at } 25°C"
  variables:
    - symbol: "K"
      name: "equilibrium_constant"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "n"
      name: "moles_of_electrons"
      unit: "mol"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
    - symbol: "E^\\circ_cell"
      name: "standard_cell_potential"
      unit: "V"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["galvanic_cell"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_NERNST","CHM_EMF"]

- formula_id: "CHM_ELECTRO_011"
  name: "Cell potential temperature dependence (Gibbs-Helmholtz)"
  latex: "\\left(\\frac{\\partial E^\\circ_{cell}}{\\partial T}\\right)_P = \\frac{\\Delta_r S^\\circ}{nF}"
  variables:
    - symbol: "E^\\circ_cell"
      name: "standard_cell_potential"
      unit: "V"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "\\Delta_r S^\\circ"
      name: "standard_entropy_change"
      unit: "J/(mol K)"
    - symbol: "n"
      name: "moles_of_electrons"
      unit: "mol"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
  preconditions: ["galvanic_cell"]
  grade_range: ["ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_NERNST","CHM_GIBBS"]

- formula_id: "CHM_ELECTRO_012"
  name: "Specific conductivity"
  latex: "\\kappa = \\frac{1}{\\rho} = \\frac{l}{A} \\cdot \\frac{1}{R}"
  variables:
    - symbol: "\\kappa"
      name: "specific_conductivity"
      unit: "S/m_or_S/cm"
    - symbol: "\\rho"
      name: "resistivity"
      unit: "Ω·m"
    - symbol: "l"
      name: "distance_between_electrodes"
      unit: "m_or_cm"
    - symbol: "A"
      name: "cross_sectional_area"
      unit: "m^2_or_cm^2"
    - symbol: "R"
      name: "resistance"
      unit: "Ω"
  preconditions: ["electrolyte_solution"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_CONDUCTIVITY"]

- formula_id: "CHM_ELECTRO_013"
  name: "Molar conductivity"
  latex: "\\Lambda_m = \\frac{\\kappa \\times 1000}{C} \text{ (C in mol/L)}, \quad \\Lambda_m = \\kappa V_m"
  variables:
    - symbol: "\\Lambda_m"
      name: "molar_conductivity"
      unit: "S cm^2 mol^-1"
    - symbol: "\\kappa"
      name: "specific_conductivity"
      unit: "S/cm"
    - symbol: "C"
      name: "concentration"
      unit: "mol/L"
    - symbol: "V_m"
      name: "molar_volume"
      unit: "cm^3/mol"
  preconditions: ["electrolyte_solution"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_CONDUCTIVITY"]

- formula_id: "CHM_ELECTRO_014"
  name: "Kohlrausch's Law"
  latex: "\\Lambda_m = \\Lambda_m^\\circ - K \\sqrt{C}, \quad \\Lambda_m^\\circ = \\lambda_+^\\circ + \\lambda_-^\\circ"
  variables:
    - symbol: "\\Lambda_m"
      name: "molar_conductivity"
      unit: "S cm^2 mol^-1"
    - symbol: "\\Lambda_m^\\circ"
      name: "molar_conductivity_at_infinite_dilution"
      unit: "S cm^2 mol^-1"
    - symbol: "K"
      name: "Kohlrausch_constant"
      unit: "S cm^2 mol^-2"
    - symbol: "C"
      name: "concentration"
      unit: "mol/L"
  preconditions: ["electrolyte_solution"]
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_CONDUCTIVITY","CHM_KOHLRAUSCH"]

- formula_id: "CHM_ELECTRO_015"
  name: "Degree of dissociation from conductivity"
  latex: "\\alpha = \\frac{\\Lambda_m}{\\Lambda_m^\\circ}, \quad K_a = \\frac{C\\alpha^2}{1-\\alpha}"
  variables:
    - symbol: "\\alpha"
      name: "degree_of_dissociation"
      unit: ""
      quantity_type: "dimensionless"
   