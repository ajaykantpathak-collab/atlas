  concept_tags: ["CHM_AB","CHM_PH"]

- formula_id: "CHM_AB_005"
  name: "pH of weak acid"
  latex: "pH = \\frac{1}{2}\\left(pK_a - \\log C\\right) = \\frac{1}{2}(pK_a - \\log C_{HA})"
