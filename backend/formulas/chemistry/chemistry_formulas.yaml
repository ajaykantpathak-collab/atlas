---
- formula_id: "CHM_STOICH_001"
  name: "Avogadro's number definition"
  latex: "N_A = 6.022 \times 10^{23} \text{ mol}^{-1}"
  variables: []
  preconditions: []
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet","ug","pg","phd"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_CONSTANT"]
  constants: true

- formula_id: "CHM_STOICH_002"
  name: "Mole definition"
  latex: "n = \frac{N}{N_A} = \frac{m}{M}"
  variables:
    - symbol: "n"
      name: "amount_of_substance"
      unit: "mol"
      quantity_type: "amount"
    - symbol: "N"
      name: "number_of_particles"
      unit: ""
      quantity_type: "count"
    - symbol: "NA"
      name: "Avogadro_number"
      unit: "mol^-1"
      quantity_type: "inverse_amount"
    - symbol: "m"
      name: "mass"
      unit: "g"
      quantity_type: "mass"
    - symbol: "M"
      name: "molar_mass"
      unit: "g/mol"
      quantity_type: "mass_per_amount"
  preconditions: ["pure_substance"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet","ug","pg"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_003"
  name: "Number of moles from volume at STP"
  latex: "n = \frac{V_{STP}}{22.4 \text{ L}}"
  variables:
    - symbol: "n"
      name: "moles"
      unit: "mol"
      quantity_type: "amount"
    - symbol: "V_STP"
      name: "volume_at_STP"
      unit: "L"
      quantity_type: "volume"
  preconditions: ["ideal_gas","STP_conditions"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_GAS"]

- formula_id: "CHM_STOICH_004"
  name: "Molarity definition"
  latex: "M = \frac{n}{V_{sol} \text{ (L)}} = \frac{\text{moles of solute}}{\text{liters of solution}}"
  variables:
    - symbol: "M"
      name: "molarity"
      unit: "mol/L"
      quantity_type: "concentration"
    - symbol: "n"
      name: "moles_of_solute"
      unit: "mol"
      quantity_type: "amount"
    - symbol: "V_sol"
      name: "volume_of_solution"
      unit: "L"
      quantity_type: "volume"
  preconditions: ["solution"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_CONC"]

- formula_id: "CHM_STOICH_005"
  name: "Molality definition"
  latex: "m = \frac{n}{m_{solvent} \text{ (kg)}} = \frac{\text{moles of solute}}{\text{kg of solvent}}"
  variables:
    - symbol: "m"
      name: "molality"
      unit: "mol/kg"
      quantity_type: "concentration"
    - symbol: "n"
      name: "moles_of_solute"
      unit: "mol"
      quantity_type: "amount"
    - symbol: "m_solvent"
      name: "mass_of_solvent"
      unit: "kg"
      quantity_type: "mass"
  preconditions: ["solution"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_CONC"]

- formula_id: "CHM_STOICH_006"
  name: "Molarity-Molality conversion"
  latex: "m = \frac{1000 M}{1000\rho - M M_w}"
  variables:
    - symbol: "m"
      name: "molality"
      unit: "mol/kg"
    - symbol: "M"
      name: "molarity"
      unit: "mol/L"
    - symbol: "\\rho"
      name: "density"
      unit: "g/L"
    - symbol: "M_w"
      name: "molar_mass_of_solute"
      unit: "g/mol"
  preconditions: ["aqueous_solution"]
  grade_range: ["class11","class12","jee_main","neet","ug"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_CONC"]

- formula_id: "CHM_STOICH_007"
  name: "Mole fraction"
  latex: "\chi_A = \frac{n_A}{n_A + n_B}, \quad \chi_A + \chi_B = 1"
  variables:
    - symbol: "\\chi_A"
      name: "mole_fraction_A"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "n_A"
      name: "moles_of_A"
      unit: "mol"
    - symbol: "n_B"
      name: "moles_of_B"
      unit: "mol"
  preconditions: ["mixture"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_008"
  name: "Stoichiometric coefficient ratio"
  latex: "\frac{n_A}{a} = \frac{n_B}{b} = \frac{n_C}{c} \quad (aA + bB \rightarrow cC)"
  variables:
    - symbol: "n_A"
      name: "moles_of_A"
      unit: "mol"
    - symbol: "a"
      name: "stoichiometric_coefficient_A"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "n_B"
      name: "moles_of_B"
      unit: "mol"
    - symbol: "b"
      name: "stoichiometric_coefficient_B"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["balanced_chemical_equation"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Stoichiometry"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_009"
  name: "Limiting reagent - moles method"
  latex: "n_{limiting} = \min\left(\frac{n_A}{a}, \frac{n_B}{b}, \dots\right)"
  variables:
    - symbol: "n_limiting"
      name: "moles_of_limiting_reagent"
      unit: "mol"
    - symbol: "n_A"
      name: "moles_of_reactant_A"
      unit: "mol"
    - symbol: "a"
      name: "stoichiometric_coefficient"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["multiple_reactants"]
  grade_range: ["class10","class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Stoichiometry"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_LIMREAGENT"]

- formula_id: "CHM_STOICH_010"
  name: "Percent yield"
  latex: "\\%\\text{Yield} = \\frac{\\text{actual yield}}{\\text{theoretical yield}} \\times 100"
  variables: []
  preconditions: ["chemical_reaction"]
  grade_range: ["class10","class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "Stoichiometry"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_YIELD"]

- formula_id: "CHM_STOICH_011"
  name: "Percent purity"
  latex: "\\%\\text{Purity} = \\frac{\\text{mass of pure substance}}{\\text{mass of impure sample}} \\times 100"
  variables: []
  preconditions: ["mixture"]
  grade_range: ["class11","class12","jee_main","neet","ug"]
  chapter: "Stoichiometry"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_012"
  name: "Mass percent composition"
  latex: "\\%\\text{mass of element} = \\frac{n_i \\times M_i}{M_{compound}} \\times 100"
  variables:
    - symbol: "n_i"
      name: "number_of_atoms_of_element_i"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "M_i"
      name: "atomic_mass_of_element_i"
      unit: "g/mol"
    - symbol: "M_compound"
      name: "molar_mass_of_compound"
      unit: "g/mol"
  preconditions: ["compound"]
  grade_range: ["class9","class10","class11","class12","jee_main","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_013"
  name: "Empirical formula mass"
  latex: "EFM = \sum_i (n_i \times A_i)"
  variables:
    - symbol: "EFM"
      name: "empirical_formula_mass"
      unit: "g/mol"
    - symbol: "n_i"
      name: "subscript_in_empirical_formula"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "A_i"
      name: "atomic_mass_of_element_i"
      unit: "g/mol"
  preconditions: ["compound"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_014"
  name: "Molecular formula from empirical formula"
  latex: "n = \frac{M_{molecular}}{EFM}, \quad MF = (EF)_n"
  variables:
    - symbol: "n"
      name: "multiplication_factor"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "M_molecular"
      name: "molar_mass_molecular"
      unit: "g/mol"
    - symbol: "EFM"
      name: "empirical_formula_mass"
      unit: "g/mol"
  preconditions: ["compound"]
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH"]

- formula_id: "CHM_STOICH_015"
  name: "Equivalent weight"
  latex: "E = \frac{M}{n\text{-factor}}"
  variables:
    - symbol: "E"
      name: "equivalent_weight"
      unit: "g/equiv"
    - symbol: "M"
      name: "molar_mass"
      unit: "g/mol"
    - symbol: "n-factor"
      name: "n_factor"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["acid_or_base_or_redox"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "Redox & Equivalent Concepts"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_EQWT"]

- formula_id: "CHM_STOICH_016"
  name: "Normality"
  latex: "N = \frac{\text{equivalents of solute}}{\text{volume (L)}} = \frac{n \times M}{1000}"
  variables:
    - symbol: "N"
      name: "normality"
      unit: "equiv/L"
    - symbol: "n"
      name: "n_factor"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "M"
      name: "molarity"
      unit: "mol/L"
  preconditions: ["solution"]
  grade_range: ["class11","class12","jee_main","neet","ug"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_NORMALITY"]

- formula_id: "CHM_STOICH_017"
  name: "Gas stoichiometry (moles from STP volume)"
  latex: "n_{gas} = \frac{V_{STP}}{22.4} = \frac{PV}{RT}"
  variables:
    - symbol: "n_gas"
      name: "moles_of_gas"
      unit: "mol"
    - symbol: "V_STP"
      name: "volume_at_STP"
      unit: "L"
    - symbol: "P"
      name: "pressure"
      unit: "atm"
    - symbol: "V"
      name: "volume"
      unit: "L"
    - symbol: "R"
      name: "gas_constant"
      unit: "L atm / (mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["gas","ideal_behavior"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_GAS"]

- formula_id: "CHM_STOICH_018"
  name: "Dilution law"
  latex: "M_1 V_1 = M_2 V_2"
  variables:
    - symbol: "M_1"
      name: "initial_molarity"
      unit: "mol/L"
    - symbol: "V_1"
      name: "initial_volume"
      unit: "L"
    - symbol: "M_2"
      name: "final_molarity"
      unit: "mol/L"
    - symbol: "V_2"
      name: "final_volume"
      unit: "L"
  preconditions: ["dilution_process"]
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Mole Concept"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_CONC"]

- formula_id: "CHM_STOICH_019"
  name: "Back titration formula"
  latex: "n_{analyte} = n_{excess} = n_{added} - n_{reacted_with_back_titrant}"
  variables: []
  preconditions: ["back_titration"]
  grade_range: ["class12","jee_main","neet","ug"]
  chapter: "Stoichiometry"
  subject: "chemistry"
  concept_tags: ["CHM_STOICH","CHM_TITRATION"]

- formula_id: "CHM_GAS_001"
  name: "Boyle's Law"
  latex: "P_1 V_1 = P_2 V_2 \quad (T = \text{constant})"
  variables:
    - symbol: "P_1"
      name: "initial_pressure"
      unit: "atm"
    - symbol: "V_1"
      name: "initial_volume"
      unit: "L"
    - symbol: "P_2"
      name: "final_pressure"
      unit: "atm"
    - symbol: "V_2"
      name: "final_volume"
      unit: "L"
  preconditions: ["isothermal_process"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_002"
  name: "Charles's Law"
  latex: "\\frac{V_1}{T_1} = \\frac{V_2}{T_2} \quad (P = \text{constant})"
  variables:
    - symbol: "V_1"
      name: "initial_volume"
      unit: "L"
    - symbol: "T_1"
      name: "initial_temperature"
      unit: "K"
    - symbol: "V_2"
      name: "final_volume"
      unit: "L"
    - symbol: "T_2"
      name: "final_temperature"
      unit: "K"
  preconditions: ["isobaric_process"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_003"
  name: "Avogadro's Law"
  latex: "\\frac{V_1}{n_1} = \\frac{V_2}{n_2} \quad (P, T = \text{constant})"
  variables:
    - symbol: "V_1"
      name: "initial_volume"
      unit: "L"
    - symbol: "n_1"
      name: "initial_moles"
      unit: "mol"
    - symbol: "V_2"
      name: "final_volume"
      unit: "L"
    - symbol: "n_2"
      name: "final_moles"
      unit: "mol"
  preconditions: ["constant_P_T"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_004"
  name: "Gay-Lussac's Law (Pressure-Temperature)"
  latex: "\\frac{P_1}{T_1} = \\frac{P_2}{T_2} \quad (V = \text{constant})"
  variables:
    - symbol: "P_1"
      name: "initial_pressure"
      unit: "atm"
    - symbol: "T_1"
      name: "initial_temperature"
      unit: "K"
    - symbol: "P_2"
      name: "final_pressure"
      unit: "atm"
    - symbol: "T_2"
      name: "final_temperature"
      unit: "K"
  preconditions: ["isochoric_process"]
  grade_range: ["class10","class11","class12","jee_main","neet"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_005"
  name: "Ideal Gas Law"
  latex: "PV = nRT"
  variables:
    - symbol: "P"
      name: "pressure"
      unit: "atm"
    - symbol: "V"
      name: "volume"
      unit: "L"
    - symbol: "n"
      name: "moles"
      unit: "mol"
    - symbol: "R"
      name: "gas_constant"
      unit: "L atm / (mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["ideal_gas"]
  grade_range: ["class9","class10","class11","class12","jee_main","jee_advanced","neet","ug","pg","phd"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_006"
  name: "Ideal Gas Law (number density form)"
  latex: "PV = Nk_BT"
  variables:
    - symbol: "P"
      name: "pressure"
      unit: "Pa"
    - symbol: "V"
      name: "volume"
      unit: "m^3"
    - symbol: "N"
      name: "number_of_molecules"
      unit: ""
      quantity_type: "count"
    - symbol: "k_B"
      name: "Boltzmann_constant"
      unit: "J/K"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["ideal_gas"]
  grade_range: ["ug","pg","phd"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_STAT_THERMO"]

- formula_id: "CHM_GAS_007"
  name: "Graham's Law of Effusion/Diffusion"
  latex: "\\frac{r_1}{r_2} = \\sqrt{\\frac{M_2}{M_1}}"
  variables:
    - symbol: "r_1"
      name: "rate_of_effusion_gas1"
      unit: "mol/s"
    - symbol: "r_2"
      name: "rate_of_effusion_gas2"
      unit: "mol/s"
    - symbol: "M_1"
      name: "molar_mass_gas1"
      unit: "g/mol"
    - symbol: "M_2"
      name: "molar_mass_gas2"
      unit: "g/mol"
  preconditions: ["gases","same_temperature"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_008"
  name: "Dalton's Law of Partial Pressures"
  latex: "P_{total} = \sum_i P_i, \quad P_i = \chi_i P_{total}"
  variables:
    - symbol: "P_total"
      name: "total_pressure"
      unit: "atm"
    - symbol: "P_i"
      name: "partial_pressure_of_i"
      unit: "atm"
    - symbol: "\\chi_i"
      name: "mole_fraction_of_i"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["nonreacting_gas_mixture"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_GAS_LAW"]

- formula_id: "CHM_GAS_009"
  name: "Kinetic energy of ideal gas molecule"
  latex: "KE_{avg} = \frac{3}{2}k_BT = \frac{3}{2}RT \text{ per mole}"
  variables:
    - symbol: "KE_avg"
      name: "average_kinetic_energy"
      unit: "J"
    - symbol: "k_B"
      name: "Boltzmann_constant"
      unit: "J/K"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["ideal_gas"]
  grade_range: ["class11","class12","ug","pg","phd"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_KINETIC_THEORY"]

- formula_id: "CHM_GAS_010"
  name: "RMS speed of gas molecules"
  latex: "u_{rms} = \sqrt{\\frac{3RT}{M}} = \sqrt{\\frac{3k_BT}{m}}"
  variables:
    - symbol: "u_rms"
      name: "rms_speed"
      unit: "m/s"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "M"
      name: "molar_mass"
      unit: "kg/mol"
    - symbol: "k_B"
      name: "Boltzmann_constant"
      unit: "J/K"
    - symbol: "m"
      name: "mass_of_one_molecule"
      unit: "kg"
  preconditions: ["ideal_gas"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_KINETIC_THEORY"]

- formula_id: "CHM_GAS_011"
  name: "Most probable speed"
  latex: "u_{mp} = \sqrt{\\frac{2RT}{M}} = \sqrt{\\frac{2k_BT}{m}}"
  variables:
    - symbol: "u_mp"
      name: "most_probable_speed"
      unit: "m/s"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "M"
      name: "molar_mass"
      unit: "kg/mol"
  preconditions: ["ideal_gas"]
  grade_range: ["class11","class12","ug","pg","phd"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_KINETIC_THEORY"]

- formula_id: "CHM_GAS_012"
  name: "Average speed of gas molecules"
  latex: "u_{avg} = \sqrt{\\frac{8RT}{\pi M}} = \sqrt{\\frac{8k_BT}{\pi m}}"
  variables:
    - symbol: "u_avg"
      name: "average_speed"
      unit: "m/s"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "M"
      name: "molar_mass"
      unit: "kg/mol"
  preconditions: ["ideal_gas"]
  grade_range: ["class11","class12","ug","pg"]
  chapter: "States of Matter"
  subject: "chemistry"
  concept_tags: ["CHM_GAS","CHM_KINETIC_THEORY"]

- formula_id: "CHM_GAS_013"
  name: "Van der Waals equation of state"
  latex: "\\left(P + \\frac{an^2}{V^2}\\right)(V - nb) = nRT"
  variables:
    - symbol: "P"
      name: "pressure"
      unit: "atm"
    - symbol: "V"
      name: "volume"
      unit: "L"
    - symbol: "n"
      name: "moles"
      unit: "mol"
    - symbol: "a"
      name: "van_der_Waals_a"
      unit: "L^2 atm / mol^2"
    - symbol: "b"
      name: "van_der_Waals_b"
      unit: "L/mol"
    - symbol: "R"
      name: "gas_constant"
      unit: "L atm / (mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
  preconditions: ["real_gas"]
