- formula_id: "CHM_AB_006"
  name: "pH of weak base"
  latex: "pOH = \\frac{1}{2}\\left(pK_b - \\log C\\right), \quad pH = 14 - pOH"
  variables:
    - symbol: "pOH"
      name: "pOH"
      unit: ""
