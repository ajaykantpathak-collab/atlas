      name: "molar_conductivity_at_infinite_dilution"
      unit: "S cm^2 mol^-1"
  preconditions: ["weak_electrolyte_solution"]
  grade_range: ["class12","ug","pg"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_OSTWALD"]

- formula_id: "CHM_AB_001"
  name: "pH definition"
  latex: "pH = -\\log_{10}[H^+] = -\\log_{10}(\\alpha C)"
