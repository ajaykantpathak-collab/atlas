- formula_id: "CHM_ELECTRO_001"
  name: "Faraday's constant"
  latex: "F = N_A \\cdot e = 96485 \text{ C mol}^{-1}"
  variables:
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
    - symbol: "N_A"
      name: "Avogadro_number"
      unit: "mol^-1"
    - symbol: "e"
      name: "elementary_charge"
      unit: "C"
  preconditions: []
  grade_range: ["class12","ug","pg","phd"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_CONSTANT"]
  constants: true

- formula_id: "CHM_ELECTRO_002"
  name: "Faraday's First Law of Electrolysis"
  latex: "m = Z \\cdot Q = Z \\cdot I \\cdot t"
  variables:
    - symbol: "m"
      name: "mass_deposited"
      unit: "g"
    - symbol: "Z"
      name: "electrochemical_equivalent"
      unit: "g/C"
    - symbol: "Q"
      name: "charge_passed"
      unit: "C"
    - symbol: "I"
      name: "current"
      unit: "A"
    - symbol: "t"
      name: "time"
      unit: "s"
  preconditions: ["electrolysis_cell"]
  grade_range: ["class12","ug","pg"]
  chapter: "Electrochemistry"
  subject: "chemistry"
  concept_tags: ["CHM_ELECTRO","CHM_FARADAY"]

- formula_id: "CHM_ELECTRO_003"
  name: "Faraday's Second Law of Electrolysis"
  latex: "\\frac{m_1}{m_2} = \\frac{E_1}{E_2} = \\frac{Z_1}{Z_2}"
  variables:
    - symbol: "m_1"
      name: "mass_deposited_substance_1"
      unit: "g"
    - symbol: "m_2"
      name: "mass_deposited_substance_2"
      unit: "g"
    - symbol: "E_1"
      name: "equivalent_weight_1"
      unit: "g/equiv"
    - symbol: "E_2"
      name: "equivalent_weight_2"
      unit: "g/equiv"
