  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_COMMON_ION","CHM_KSP"]

- formula_id: "CHM_EQM_010"
  name: "Molar solubility"
  latex: "s = [M^{n+}] = \\frac{[X^{m-}]}{n}, \\quad s_{AgCl} = \\sqrt{K_{sp}}, \\quad s_{CaF_2} = \\sqrt[3]{\\frac{K_{sp}}{4}}"
  variables:
    - symbol: "s"
      name: "molar_solubility"
      unit: "mol/L"
    - symbol: "K_sp"
      name: "solubility_product"
      unit: "(mol/L)^{m+n}"
  preconditions: ["sparingly_soluble_salt"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KSP"]

- formula_id: "CHM_EQM_011"
  name: "Ionic product and precipitation condition"
  latex: "IP = [M^{n+}]^m[X^{m-}]^n, \quad IP > K_{sp}: \text{precipitate}, \quad IP < K_{sp}: \text{unsaturated}"
  variables: []
  preconditions: ["ionic_solution"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KSP"]

- formula_id: "CHM_EQM_012"
  name: "Ostwald's dilution law"
  latex: "K_a = \\frac{\\alpha^2 C}{1-\\alpha}, \\quad \\alpha = \\sqrt{\\frac{K_a}{C}} \text{ (weak acid, } \\alpha \\ll 1)"
  variables:
    - symbol: "K_a"
      name: "acid_dissociation_constant"
      unit: "mol/L"
    - symbol: "\\alpha"
      name: "degree_of_dissociation"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "C"
      name: "initial_concentration"
      unit: "mol/L"
  preconditions: ["weak_electrolyte"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_OSTWALD","CHM_WEAK_ELECTROLYTE"]

- formula_id: "CHM_EQM_013"
  name: "Degree of dissociation from molar conductivity"
  latex: "\\alpha = \\frac{\\Lambda_m}{\\Lambda_m^\\circ}"
  variables:
    - symbol: "\\alpha"
      name: "degree_of_dissociation"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "\\Lambda_m"
      name: "molar_conductivity_at_concentration_c"
      unit: "S cm^2 mol^-1"
