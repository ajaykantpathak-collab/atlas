- formula_id: "CHM_EQM_001"
  name: "Concentration equilibrium constant"
  latex: "K_c = \\frac{\\prod_i [C_i]^{\\nu_i}}{\\prod_j [R_j]^{\\nu_j}}"
  variables:
    - symbol: "K_c"
      name: "equilibrium_constant_concentration"
      unit: "(mol/L)^{\\Delta\\nu}"
      quantity_type: "concentration^delta_nu"
    - symbol: "[C_i]"
      name: "equilibrium_concentration_product_i"
      unit: "mol/L"
    - symbol: "[R_j]"
      name: "equilibrium_concentration_reactant_j"
      unit: "mol/L"
  preconditions: ["chemical_equilibrium","homogeneous_phase"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug","pg"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KC"]

- formula_id: "CHM_EQM_002"
  name: "Pressure equilibrium constant"
  latex: "K_p = K_c(RT)^{\\Delta n}, \\quad K_p = \\frac{\\prod_i P_i^{\\nu_i}}{\\prod_j P_j^{\\nu_j}}"
  variables:
    - symbol: "K_p"
      name: "equilibrium_constant_pressure"
      unit: "atm^{\\Delta\\nu}"
      quantity_type: "pressure^delta_nu"
    - symbol: "K_c"
      name: "equilibrium_constant_concentration"
      unit: "(mol/L)^{\\Delta\\nu}"
    - symbol: "R"
      name: "gas_constant"
      unit: "L atm / (mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "\\Delta n"
      name: "change_in_moles_of_gas"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["gas_phase_equilibrium"]
  grade_range: ["class11","class12","ug","pg","phd"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KP"]

- formula_id: "CHM_EQM_003"
  name: "Relation between Kp and Kc"
  latex: "K_p = K_c(RT)^{\\Delta n}"
  variables:
    - symbol: "K_p"
      name: "pressure_equilibrium_constant"
      unit: "atm^{\\Delta n}"
    - symbol: "K_c"
      name: "concentration_equilibrium_constant"
      unit: "(mol/L)^{\\Delta n}"
    - symbol: "R"
      name: "gas_constant"
      unit: "L atm / (mol K)"
    - symbol: "T"
      name: "temperature"
      unit: "K"
    - symbol: "\\Delta n"
      name: "change_in_moles_of_gas"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["gas_phase_equilibrium"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KP","CHM_KC"]

- formula_id: "CHM_EQM_004"
  name: "Reaction quotient Q"
  latex: "Q_c = \\frac{\\prod_i [C_i]^{\\nu_i}}{\\prod_j [R_j]^{\\nu_j}} \\text{ (at any time)}, \\quad Q < K: \\rightarrow \\text{forward}, \\quad Q > K: \\rightarrow \\text{reverse}"
  variables: []
  preconditions: ["chemical_reaction"]
  grade_range: ["class11","class12","ug","pg","phd"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_Q"]

- formula_id: "CHM_EQM_005"
  name: "Le Chatelier's principle — concentration change"
  latex: "\\text{Adding reactant} \\rightarrow K_c = \\frac{[P]^c}{[R]^a [R]^{\\Delta}} > K_{eq} \\rightarrow \\text{forward shift}"
  variables: []
  preconditions: ["equilibrium_system"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_LE_CHATELIER"]

- formula_id: "CHM_EQM_006"
  name: "ICE Table: general expression"
  latex: "K_c = \\frac{(Cx)^c(Dx)^d}{(A-ax)^a(B-bx)^b}"
  variables:
    - symbol: "K_c"
      name: "equilibrium_constant"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "x"
      name: "change_in_concentration"
      unit: "mol/L"
    - symbol: "A,B"
      name: "initial_concentrations"
      unit: "mol/L"
    - symbol: "a,b,c,d"
      name: "stoichiometric_coefficients"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["equilibrium_system","initial_conditions_known"]
  grade_range: ["class11","class12","ug","pg"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_ICE_TABLE"]

- formula_id: "CHM_EQM_007"
  name: "ICE Table: degree of dissociation"
  latex: "K_c = \\frac{\\alpha^2}{(1-\\alpha)} \\cdot \\frac{C}{1 + (\\nu-1)\\alpha} \quad \\text{( Ostwald dilution)}"
  variables:
    - symbol: "K_c"
      name: "equilibrium_constant"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "\\alpha"
      name: "degree_of_dissociation"
      unit: ""
      quantity_type: "dimensionless"
    - symbol: "C"
      name: "initial_concentration"
      unit: "mol/L"
    - symbol: "\\nu"
      name: "number_of_ions_formed"
      unit: ""
      quantity_type: "dimensionless"
  preconditions: ["weak_acid_or_base_dissociation"]
  grade_range: ["class11","class12","ug"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_ICE_TABLE","CHM_OSTWALD"]

- formula_id: "CHM_EQM_008"
  name: "Solubility product"
  latex: "K_{sp} = [M^{n+}]^m [X^{m-}]^n"
  variables:
    - symbol: "K_sp"
      name: "solubility_product"
      unit: "(mol/L)^{m+n}"
    - symbol: "[M^{n+}]"
      name: "equilibrium_concentration_of_cation"
      unit: "mol/L"
    - symbol: "[X^{m-}]"
      name: "equilibrium_concentration_of_anion"
      unit: "mol/L"
  preconditions: ["sparingly_soluble_salt"]
  grade_range: ["class11","class12","jee_main","jee_advanced","neet","ug","pg"]
  chapter: "Equilibrium"
  subject: "chemistry"
  concept_tags: ["CHM_EQM","CHM_KSP"]

- formula_id: "CHM_EQM_009"
  name: "Common ion effect on solubility"
  latex: "s = \\sqrt{\\frac{K_{sp}}{[X^-]_{common}}}, \\quad s_{new} = \\frac{K_{sp}}{[common \\ ion]}"
  variables:
    - symbol: "s"
      name: "solubility"
      unit: "mol/L"
    - symbol: "K_sp"
      name: "solubility_product"
      unit: "(mol/L)^2"
    - symbol: "[X^-]_{common}"
      name: "common_ion_concentration"
      unit: "mol/L"
