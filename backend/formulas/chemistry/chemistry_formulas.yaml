  name: "Ion product relation for conjugate acid-base pair"
  latex: "K_a \\times K_b = K_w = 1.0 \\times 10^{-14} \text{ at } 25°C"
  variables:
    - symbol: "K_a"
      name: "acid_dissociation_constant"
