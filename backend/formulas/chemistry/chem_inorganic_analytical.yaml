---
- formula_id: "CHM_S_001"
  name: "Group 1 Atomic Radius Trend"
  formula: "Li < Na < K < Rb < Cs"
  unit: "pm"
  notes: "Increases down group due to additional electron shells"
- formula_id: "CHM_S_002"
  name: "Group 1 Ionization Energy Trend"
  formula: "Li > Na > K > Rb > Cs"
  unit: "kJ/mol"
  notes: "Decreases down group due to increased shielding and atomic size"
- formula_id: "CHM_S_003"
  name: "Group 1 Hydration Enthalpy Trend"
  formula: "Li+ > Na+ > K+ > Rb+ > Cs+"
  unit: "kJ/mol"
  notes: "Decreases with increasing ionic radius"
- formula_id: "CHM_S_004"
  name: "Group 2 Atomic Radius Trend"
  formula: "Be < Mg < Ca < Sr < Ba < Ra"
  unit: "pm"
- formula_id: "CHM_S_005"
  name: "Group 2 Ionization Energy Trend"
  formula: "Be > Mg > Ca > Sr > Ba > Ra"
  unit: "kJ/mol"
- formula_id: "CHM_S_006"
  name: "Anomalous Behavior of Lithium"
  formula: "Li shows properties similar to Mg due to small size and high charge density"
  notes: "Diagonal relationship"
- formula_id: "CHM_S_007"
  name: "Diagonal Relationship Li-Mg"
  formula: "Li ~ Mg"
  notes: "Similarities: both form nitrides, carbonates decompose on heating, chlorides soluble in ethanol"
- formula_id: "CHM_S_008"
  name: "Diagonal Relationship Be-Al"
  formula: "Be ~ Al"
  notes: "Both form amphoteric oxides, covalent chlorides, and carbides"
- formula_id: "CHM_S_009"
  name: "Lithium Reaction with Nitrogen"
  formula: "6Li + N2 -> 2Li3N"
  notes: "Only group 1 metal forming nitride directly"
- formula_id: "CHM_S_010"
  name: "Beryllium and Water"
  formula: "Be does not react with H2O even at high temperatures"
  notes: "Due to covalent character and protective oxide layer"
- formula_id: "CHM_S_011"
  name: "Group 1 Oxide Basicity Trend"
  formula: "Li2O < Na2O < K2O < Rb2O < Cs2O"
  notes: "Basicity increases down the group"
- formula_id: "CHM_S_012"
  name: "Beryllium Oxide Amphoteric Nature"
  formula: "BeO + 2H+ -> Be2+ + H2O; BeO + 2OH- -> [Be(OH)4]2-"
  notes: "Amphoteric, unlike other group 2 oxides"
- formula_id: "CHM_P_001"
  name: "Group 13 Oxidation States"
  formula: "+3 (B, Al, Ga, In), +1 (Tl)"
  notes: "Inert pair effect stabilizes +1 for Tl"
- formula_id: "CHM_P_002"
  name: "Group 14 Oxidation States"
  formula: "+4 (C, Si, Ge, Sn), +2 (Pb)"
  notes: "Inert pair effect stabilizes +2 for Pb"
- formula_id: "CHM_P_003"
  name: "Group 15 Oxidation States"
  formula: "-3, +3, +5"
  notes: "Nitrogen shows limited +5 due to lack of d-orbitals"
- formula_id: "CHM_P_004"
  name: "Group 16 Oxidation States"
  formula: "-2, +2, +4, +6"
  notes: "Oxygen mostly -2; S, Se, Te show positive states"
- formula_id: "CHM_P_005"
  name: "Group 17 Oxidation States"
  formula: "-1, +1, +3, +5, +7"
  notes: "Higher oxidation states with more electronegative elements"
- formula_id: "CHM_P_006"
  name: "Inert Pair Effect"
  formula: "ns2 electrons remain non-bonding"
  notes: "Observed in heavier p-block elements (Tl, Pb, Bi)"
- formula_id: "CHM_P_007"
  name: "Inert Pair Effect in Pb"
  formula: "Pb(II) more stable than Pb(IV)"
  notes: "Pb4+ is strong oxidizing agent"
- formula_id: "CHM_P_008"
  name: "Carbon Allotropes"
  formula: "C(diamond), C(graphite), C(fullerene), C(graphene)"
  notes: "Different structures of same element"
- formula_id: "CHM_P_009"
  name: "Phosphorus Allotropes"
  formula: "P4(white), P(red), P(black)"
  notes: "White P reactive, tetrahedral P4 molecule"
- formula_id: "CHM_P_010"
  name: "Sulfur Allotropes"
  formula: "S8(rhombic), S8(monoclinic)"
  notes: "Rhombic stable at room temperature"
- formula_id: "CHM_P_011"
  name: "Halogen Oxidizing Power Trend"
  formula: "F2 > Cl2 > Br2 > I2"
  notes: "Decreases down the group"
- formula_id: "CHM_P_012"
  name: "Interhalogen Compounds"
  formula: "XY, XY3, XY5, XY7 (X = heavier, Y = lighter)"
  notes: "Examples: ClF3, BrF3, IF7"
- formula_id: "CHM_D_001"
  name: "Variable Oxidation States of Mn"
  formula: "+2, +3, +4, +5, +6, +7"
  notes: "MnO, Mn2O3, MnO2, K3MnO4, K2MnO4, KMnO4"
- formula_id: "CHM_D_002"
  name: "Color of Transition Metal Complexes"
  formula: "d-d transitions in crystal field"
  notes: "Color depends on ligand field strength (spectrochemical series)"
- formula_id: "CHM_D_003"
  name: "Spin-Only Magnetic Moment"
  formula: "μ = √[n(n+2)] BM"
  unit: "Bohr Magnetons (BM)"
  notes: "n = number of unpaired electrons"
- formula_id: "CHM_D_004"
  name: "KMnO4 in Acidic Medium"
  formula: "MnO4- + 8H+ + 5e- -> Mn2+ + 4H2O"
  unit: "E° = +1.51 V"
  notes: "Purple to colorless"
- formula_id: "CHM_D_005"
  name: "KMnO4 in Alkaline Medium"
  formula: "MnO4- + 2H2O + 3e- -> MnO2 + 4OH-"
  unit: "E° = +0.59 V"
  notes: "Purple to brown precipitate"
- formula_id: "CHM_D_006"
  name: "K2Cr2O7 in Acidic Medium"
  formula: "Cr2O7 2- + 14H+ + 6e- -> 2Cr3+ + 7H2O"
  unit: "E° = +1.33 V"
  notes: "Orange to green"
- formula_id: "CHM_D_007"
  name: "K2Cr2O7 in Basic Medium"
  formula: "Cr2O7 2- + 2OH- -> 2CrO4 2- + H2O"
  notes: "Orange to yellow"
- formula_id: "CHM_D_008"
  name: "Iron Oxidation States"
  formula: "Fe2+ (d6), Fe3+ (d5)"
  notes: "Fe3+ more stable due to half-filled d5"
- formula_id: "CHM_D_009"
  name: "Cu2+ Properties"
  formula: "Cu2+ (d9)"
  notes: "Blue color, paramagnetic, Jahn-Teller distortion"
- formula_id: "CHM_D_010"
  name: "Zn2+ Electronic Configuration"
  formula: "Zn2+ (d10)"
  notes: "Diamagnetic, colorless complexes"
- formula_id: "CHM_D_011"
  name: "Complex Formation"
  formula: "Metal ion + Ligand -> Complex"
  notes: "Chelate effect, stability constants"
- formula_id: "CHM_D_012"
  name: "Catalytic Property of Transition Metals"
  formula: "Transition metals provide intermediate oxidation states"
  notes: "Haber process (Fe), Contact process (V2O5)"
- formula_id: "CHM_F_001"
  name: "Lanthanide Contraction"
  formula: "Gradual decrease in ionic radii across lanthanides"
  unit: "pm"
  notes: "Due to poor shielding of 4f electrons"
- formula_id: "CHM_F_002"
  name: "Actinide Contraction"
  formula: "Analogous to lanthanide contraction in actinides"
  notes: "Due to poor shielding of 5f electrons"
- formula_id: "CHM_F_003"
  name: "Lanthanide Oxidation States"
  formula: "+3 predominant; Ce(+4), Eu(+2), Yb(+2) stable"
  notes: "Eu2+ and Yb2+ stable due to half-filled and fully filled f-subshells"
- formula_id: "CHM_F_004"
  name: "Actinide Oxidation States"
  formula: "+3, +4, +5, +6 common"
  notes: "U shows +3, +4, +5, +6; Np, Pu show multiple states"
- formula_id: "CHM_F_005"
  name: "Cerium Electronic Configuration"
  formula: "Ce: [Xe] 4f1 5d1 6s2"
  notes: "Can lose 4f electron to form Ce4+"
- formula_id: "CHM_F_006"
  name: "Uranium Electronic Configuration"
  formula: "U: [Rn] 5f3 6d1 7s2"
  notes: "Can lose electrons from 5f, 6d, 7s"
- formula_id: "CHM_F_007"
  name: "Similarity of 4f and 5f Elements"
  formula: "4f and 5f series show similar chemical properties"
  notes: "Both have +3 as common oxidation state"
- formula_id: "CHM_F_008"
  name: "Magnetic Properties of Lanthanides"
  formula: "Paramagnetic due to unpaired f-electrons"
  notes: "Strong magnetic moments compared to transition metals"
- formula_id: "CHM_F_009"
  name: "Gadolinium Electronic Configuration"
  formula: "Gd: [Xe] 4f7 5d1 6s2"
  notes: "Half-filled f-subshell (4f7) confers extra stability"
- formula_id: "CHM_F_010"
  name: "Lutetium Electronic Configuration"
  formula: "Lu: [Xe] 4f14 5d1 6s2"
  notes: "Last lanthanide, fully filled 4f14 subshell"
- formula_id: "CHM_MET_001"
  name: "Ellingham Diagram Principle"
  formula: "ΔG° = -RT ln K"
  notes: "Plot of ΔG° vs T for formation of metal oxides"
- formula_id: "CHM_MET_002"
  name: "Ellingham Diagram for Metal Oxides"
  formula: "2M + O2 -> 2MO; ΔG° becomes less negative with T"
  notes: "C and CO lines cross metal lines at specific temperatures"
- formula_id: "CHM_MET_003"
  name: "Froth Flotation Process"
  formula: "Sulfide ores + collectors + frothers -> froth"
  notes: "Used for concentration of sulfide ores"
- formula_id: "CHM_MET_004"
  name: "Roasting vs Calcination"
  formula: "Roasting: 2MS + 3O2 -> 2MO + 2SO2 (excess air); Calcination: MCO3 -> MO + CO2 (limited air)"
  notes: "Roasting for sulfides, calcination for carbonates"
- formula_id: "CHM_MET_005"
  name: "Smelting of Iron"
  formula: "Fe2O3 + 3CO -> 2Fe + 3CO2"
  notes: "Occurs in blast furnace at ~2000°C"
- formula_id: "CHM_MET_006"
  name: "Blast Furnace Reactions"
  formula: "C + O2 -> CO2; CO2 + C -> 2CO; Fe2O3 + 3CO -> 2Fe + 3CO2"
  notes: "Multiple zones: combustion, reduction, melting"
- formula_id: "CHM_MET_007"
  name: "Refining of Copper (Electrolytic)"
  formula: "Anode: Cu -> Cu2+ + 2e-; Cathode: Cu2+ + 2e- -> Cu"
  notes: "Impurities fall as anode mud"
- formula_id: "CHM_MET_008"
  name: "Refining of Al (Hoope's Process)"
  formula: "Al3+ + 3e- -> Al (cathode)"
  notes: "Electrolytic refining using molten cryolite"
- formula_id: "CHM_MET_009"
  name: "Extraction of Au (Cyanide Process)"
  formula: "4Au + 8NaCN + O2 + 2H2O -> 4Na[Au(CN)2] + 4NaOH"
  notes: "Gold forms soluble complex with cyanide"
- formula_id: "CHM_MET_010"
  name: "Extraction of Ag (Cyanide Process)"
  formula: "4Ag + 8NaCN + O2 + 2H2O -> 4Na[Ag(CN)2] + 4NaOH"
  notes: "Similar to gold extraction"
- formula_id: "CHM_MET_011"
  name: "Zone Refining"
  formula: "Impurities concentrate in molten zone"
  notes: "Used for ultra-pure Si, Ge"
- formula_id: "CHM_MET_012"
  name: "Mond Process for Ni"
  formula: "Ni + 4CO -> [Ni(CO)4] (formation); [Ni(CO)4] -> Ni + 4CO (decomposition)"
  notes: "Volatile Ni(CO)4 decomposes at 250°C to pure Ni"
- formula_id: "CHM_QA_001"
  name: "Group I Cations"
  formula: "Ag+, Hg2 2+, Pb2+"
  notes: "Precipitated as chlorides in presence of dilute HNO3"
- formula_id: "CHM_QA_002"
  name: "Group II Cations"
  formula: "Pb2+, Cu2+, Bi3+, Cd2+, Hg2+, As3+, Sb3+, Sn2+"
  notes: "Precipitated as sulfides in presence of dilute HCl"
- formula_id: "CHM_QA_003"
  name: "Group III Cations"
  formula: "Fe3+, Al3+, Cr3+"
  notes: "Precipitated as hydroxides in presence of NH4OH"
- formula_id: "CHM_QA_004"
  name: "Group IV Cations"
  formula: "Zn2+, Mn2+, Ni2+, Co2+"
  notes: "Precipitated as sulfides in presence of H2S in alkaline medium"
- formula_id: "CHM_QA_005"
  name: "Group V Cations"
  formula: "Ba2+, Sr2+, Ca2+"
  notes: "Precipitated as carbonates in presence of (NH4)2CO3"
- formula_id: "CHM_QA_006"
  name: "Group VI Cations"
  formula: "Mg2+, Na+, K+"
  notes: "Remaining ions, identified by flame test"
- formula_id: "CHM_QA_007"
  name: "Flame Test Colors"
  formula: "Na: yellow; K: lilac; Ca: brick red; Ba: green; Sr: crimson; Cu: blue-green"
  notes: "Characteristic emission spectra"
- formula_id: "CHM_QA_008"
  name: "Test for Chloride"
  formula: "Cl- + Ag+ -> AgCl (white, soluble in NH3)"
  notes: "Confirmatory test using AgNO3"
- formula_id: "CHM_QA_009"
  name: "Test for Sulfate"
  formula: "SO4 2- + Ba2+ -> BaSO4 (white, insoluble in acids)"
  notes: "Confirmatory test using BaCl2"
- formula_id: "CHM_QA_010"
  name: "Test for Carbonate"
  formula: "CO3 2- + 2H+ -> CO2 + H2O; CO2 + Ca(OH)2 -> CaCO3 (milky)"
  notes: "Effervescence with acid, limewater test"
- formula_id: "CHM_QA_011"
  name: "Brown Ring Test for Nitrate"
  formula: "NO3- + 3Fe2+ + 4H+ -> NO + 3Fe3+ + 2H2O; [Fe(H2O)5(NO)]2+ brown ring"
  notes: "Brown ring at interface of FeSO4 and conc. H2SO4"
- formula_id: "CHM_QA_012"
  name: "Test for Ammonium"
  formula: "NH4+ + OH- -> NH3 + H2O; NH3 + HCl -> NH4Cl (white fumes)"
  notes: "NaOH added, heated; gas turns red litmus blue"
- formula_id: "CHM_SPEC_001"
  name: "Beer-Lambert Law"
  formula: "A = εbc"
  unit: "A: absorbance; ε: L mol-1 cm-1; b: cm; c: mol/L"
  notes: "Linear relationship between absorbance and concentration"
- formula_id: "CHM_SPEC_002"
  name: "UV-Vis Wavelength Ranges"
  formula: "UV: 10-400 nm; Visible: 400-700 nm"
  notes: "Electronic transitions in molecules"
- formula_id: "CHM_SPEC_003"
  name: "IR Stretching Frequencies"
  formula: "ν(C-H) ~3000 cm-1; ν(O-H) ~3300 cm-1; ν(C=O) ~1700 cm-1; ν(N-H) ~3300 cm-1"
  unit: "cm-1"
  notes: "Characteristic functional group frequencies"
- formula_id: "CHM_SPEC_004"
  name: "1H NMR Chemical Shift Ranges"
  formula: "δ: 0-12 ppm (TMS reference)"
  notes: "Shielding and deshielding effects"
- formula_id: "CHM_SPEC_005"
  name: "13C NMR Chemical Shift Ranges"
  formula: "δ: 0-220 ppm"
  notes: "Wider range due to lower natural abundance and gyromagnetic ratio"
- formula_id: "CHM_SPEC_006"
  name: "Mass Spectrometry Peaks"
  formula: "M+: molecular ion; M+1: 13C isotope (~1.1% per C); M+2: 2H, 34S, 37Cl"
  notes: "Isotopic patterns identify elements"
- formula_id: "CHM_SPEC_007"
  name: "Mass Spec Fragmentation Rules"
  formula: "Alpha cleavage, McLafferty rearrangement, retro-Diels-Alder"
  notes: "Structural elucidation from fragment ions"
- formula_id: "CHM_SPEC_008"
  name: "FT-IR Principle"
  formula: "Interferogram -> Fourier Transform -> Spectrum"
  notes: "Improved signal-to-noise and speed"
- formula_id: "CHM_SPEC_009"
  name: "ESI-MS Principle"
  formula: "[M+H]+ or [M-H]- in gas phase"
  notes: "Electrospray ionization for large biomolecules"
- formula_id: "CHM_SPEC_010"
  name: "NMR Spin-Spin Splitting (n+1 Rule)"
  formula: "n equivalent neighbors -> (n+1) peaks"
  notes: "Multiplicity indicates adjacent proton count"
- formula_id: "CHM_SPEC_011"
  name: "UV-Vis Chromophore"
  formula: "π -> π*; n -> π* transitions"
  notes: "Conjugated systems absorb visible light"
- formula_id: "CHM_SPEC_012"
  name: "IR Fingerprint Region"
  formula: "400-1500 cm-1"
  notes: "Unique pattern for each compound, like a fingerprint"
- formula_id: "CHM_QC_001"
  name: "Time-independent Schrödinger Equation"
  formula: "Ĥψ = Eψ where Ĥ = -(ħ²/2m)∇² + V"
  notes: "Fundamental equation of quantum mechanics for stationary states"
- formula_id: "CHM_QC_002"
  name: "Time-dependent Schrödinger Equation"
  formula: "ĤΨ = iħ ∂Ψ/∂t"
  notes: "Describes evolution of quantum states with time"
- formula_id: "CHM_QC_003"
  name: "Hydrogen Atom 1s Radial Function"
  formula: "R10(r) = 2(a0)^(-3/2) exp(-r/a0)"
  unit: "a0: Bohr radius"
  notes: "Radial part of 1s orbital"
- formula_id: "CHM_QC_004"
  name: "Hydrogen Atom 2p Radial Function"
  formula: "R21(r) = (1/(2√6 a0^(3/2))) (r/a0) exp(-r/2a0)"
  notes: "Radial part of 2p orbital"
- formula_id: "CHM_QC_005"
  name: "MO Energy Levels for H2"
  formula: "σ1s < σ*1s < σ2s < σ*2s"
  notes: "Bonding and antibonding combinations of atomic orbitals"
- formula_id: "CHM_QC_006"
  name: "MO Diagram for O2"
  formula: "Bond order = (8-4)/2 = 2; paramagnetic (2 unpaired e-)"
  notes: "Explains paramagnetism of O2"
- formula_id: "CHM_QC_007"
  name: "MO Diagram for N2"
  formula: "Bond order = (10-4)/2 = 3"
  notes: "Triple bond, diamagnetic"
- formula_id: "CHM_QC_008"
  name: "Aufbau Principle"
  formula: "Electrons fill orbitals from lower to higher energy (n+l rule)"
  notes: "Orbitals with lower n+l fill first"
- formula_id: "CHM_QC_009"
  name: "Pauli Exclusion Principle"
  formula: "No two electrons in an atom can have same set of four quantum numbers"
  notes: "Maximum 2 electrons per orbital with opposite spins"
- formula_id: "CHM_QC_010"
  name: "Hund's Rule of Maximum Multiplicity"
  formula: "Electrons occupy degenerate orbitals singly before pairing"
  notes: "Maximizes total spin, minimizes energy"
- formula_id: "CHM_QC_011"
  name: "Selection Rules for Electronic Transitions"
  formula: "Δl = ±1; Laporte rule: g -> g forbidden in centrosymmetric molecules"
  notes: "Determines allowed spectral lines"
- formula_id: "CHM_QC_012"
  name: "Born-Oppenheimer Approximation"
  formula: "Electronic and nuclear motions separated"
  notes: "Allows treating nuclei as stationary during electron calculations"
- formula_id: "CHM_ST_001"
  name: "Canonical Partition Function"
  formula: "Q = Σ exp(-Ei/kT)"
  unit: "Ei: energy levels, k: Boltzmann constant, T: temperature"
  notes: "Sum over all microstates for canonical ensemble"
- formula_id: "CHM_ST_002"
  name: "Molecular Partition Function"
  formula: "q = q_trans × q_rot × q_vib × q_elec"
  notes: "Product of translational, rotational, vibrational, electronic parts"
- formula_id: "CHM_ST_003"
  name: "Boltzmann Distribution"
  formula: "Ni/Nj = exp(-(Ei-Ej)/kT)"
  notes: "Population ratio of energy levels"
- formula_id: "CHM_ST_004"
  name: "Maxwell-Boltzmann Speed Distribution"
  formula: "f(v) = 4π (m/(2πkT))^(3/2) v² exp(-mv²/(2kT))"
  notes: "Distribution of molecular speeds in ideal gas"
- formula_id: "CHM_ST_005"
  name: "Most Probable Speed"
  formula: "v_mp = √(2kT/m) = √(2RT/M)"
  unit: "m/s"
  notes: "Peak of Maxwell-Boltzmann distribution"
- formula_id: "CHM_ST_006"
  name: "Average Speed"
  formula: "v_avg = √(8kT/(πm)) = √(8RT/(πM))"
  unit: "m/s"
  notes: "Mean of speed distribution"
- formula_id: "CHM_ST_007"
  name: "Root Mean Square Speed"
  formula: "v_rms = √(3kT/m) = √(3RT/M)"
  unit: "m/s"
  notes: "Square root of average of v²"
- formula_id: "CHM_ST_008"
  name: "Equipartition Theorem"
  formula: "<E> = (1/2)kT per quadratic degree of freedom"
  notes: "Each quadratic term contributes (1/2)kT to average energy"
- formula_id: "CHM_ST_009"
  name: "Internal Energy of Ideal Gas"
  formula: "U = (f/2)nRT"
  unit: "f = degrees of freedom"
  notes: "Depends on molecular structure (monatomic, diatomic, polyatomic)"
- formula_id: "CHM_ST_010"
  name: "Molar Heat Capacities"
  formula: "Cv = (f/2)R; Cp = (f/2 + 1)R"
  unit: "R: gas constant"
  notes: "Cp - Cv = R for ideal gas"