--- 
- reaction_id: "CHM_RXN_001"
  name: "Hydrolysis of tert-butyl chloride (SN1)"
  reactants: ["(CH3)3C-Cl", "H2O"]
  products: ["(CH3)3C-OH", "HCl"]
  conditions: "aqueous, warm"
  mechanism: "sn1"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Haloalkanes and Haloarenes"
  subject: "chemistry"
  concept_tags: ["sn1","carbocation","racemization","tertiary_halide","unimolecular"]
  notes: "Tertiary halide undergoes SN1 via carbocation intermediate. Rate depends only on [RX]."

- reaction_id: "CHM_RXN_002"
  name: "Hydrolysis of methyl bromide (SN2)"
  reactants: ["CH3-Br", "NaOH"]
  products: ["CH3-OH", "NaBr"]
  conditions: "aqueous NaOH"
  mechanism: "sn2"
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Haloalkanes and Haloarenes"
  subject: "chemistry"
  concept_tags: ["sn2","inversion","primary_halide","bimolecular","back_attack"]
  notes: "Primary halide undergoes SN2 with inversion of configuration. Rate depends on [RX][OH-]."

- reaction_id: "CHM_RXN_003"
  name: "Dehydrohalogenation of 2-bromobutane (E2)"
  reactants: ["CH3-CH(Br)-CH2-CH3", "KOH(alc)"]
  products: ["CH3-CH=CH-CH3", "KBr", "H2O"]
  conditions: "alc. KOH, heat"
  mechanism: "e2"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Haloalkanes and Haloarenes"
  subject: "chemistry"
  concept_tags: ["e2","anti_periplanar","saytzeff","alkene","secondary_halide"]
  notes: "E2 is bimolecular elimination. Major product follows Zaitsev (Saytzeff) rule: more substituted alkene."

- reaction_id: "CHM_RXN_004"
  name: "Dehydration of tert-butyl alcohol (E1)"
  reactants: ["(CH3)3C-OH", "H2SO4"]
  products: ["CH2=C(CH3)2", "H2O"]
  conditions: "conc. H2SO4, 85°C"
  mechanism: "e1"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["e1","carbocation","tertiary_alcohol","saytzeff","acid_catalyzed"]
  notes: "E1 elimination via carbocation. Tertiary alcohol dehydrates most easily. Forms 2-methylpropene."

- reaction_id: "CHM_RXN_005"
  name: "Addition of HBr to propene (Markovnikov)"
  reactants: ["CH3-CH=CH2", "HBr"]
  products: ["CH3-CH(Br)-CH3"]
  conditions: "room temperature"
  mechanism: "electrophilic_addition"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Alkenes"
  subject: "chemistry"
  concept_tags: ["electrophilic_addition","markovnikov","hbr","propene","alkyl_halide"]
  notes: "H adds to less substituted carbon (more H's). Br adds to more substituted carbon. Follows Markovnikov rule."

- reaction_id: "CHM_RXN_006"
  name: "Addition of H2O to ethene (acid-catalyzed hydration)"
  reactants: ["CH2=CH2", "H2O"]
  products: ["CH3-CH2-OH"]
  conditions: "H2SO4, 300°C, high pressure"
  mechanism: "electrophilic_addition"
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Alkenes"
  subject: "chemistry"
  concept_tags: ["electrophilic_addition","hydration","ethene","ethanol","markovnikov","industrial"]
  notes: "Industrial method for ethanol. H adds to less substituted carbon; OH adds to more substituted."

- reaction_id: "CHM_RXN_007"
  name: "Anti-Markovnikov addition of HBr to propene (peroxide effect)"
  reactants: ["CH3-CH=CH2", "HBr", "ROOR"]
  products: ["CH3-CH2-CH2-Br"]
  conditions: "peroxides (ROOR)"
  mechanism: "free_radical"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Alkenes"
  subject: "chemistry"
  concept_tags: ["anti_markovnikov","peroxide_effect","free_radical","hbr","n_bromo"]
  notes: "Only HBr shows peroxide (Kharasch) effect. H and Br add opposite to Markovnikov rule."

- reaction_id: "CHM_RXN_008"
  name: "Halogenation of ethene (bromine addition)"
  reactants: ["CH2=CH2", "Br2"]
  products: ["Br-CH2-CH2-Br"]
  conditions: "CCl4 solvent, room temperature"
  mechanism: "electrophilic_addition"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Alkenes"
  subject: "chemistry"
  concept_tags: ["electrophilic_addition","bromine_test","dihalide","alkene","decolorization"]
  notes: "Bromine water decolorizes; used as test for unsaturation. Forms 1,2-dibromoethane."

- reaction_id: "CHM_RXN_009"
  name: "Addition of HOCl to ethene"
  reactants: ["CH2=CH2", "HOCl"]
  products: ["HO-CH2-CH2-Cl"]
  conditions: "aqueous"
  mechanism: "electrophilic_addition"
  grade_range: ["class12","jee_main"]
  chapter: "Alkenes"
  subject: "chemistry"
  concept_tags: ["electrophilic_addition","halohydrin","ethene","chlorohydrin"]
  notes: "Cl adds to more substituted carbon; OH adds to less substituted (Markovnikov for halogen)."

- reaction_id: "CHM_RXN_010"
  name: "Oxymercuration-demercuration of cyclohexene"
  reactants: ["cyclohexene", "Hg(OAc)2", "H2O"]
  products: ["cyclohexanol"]
  conditions: "Hg(OAc)2, H2O; then NaBH4"
  mechanism: "electrophilic_addition"
  grade_range: ["class12","jee_advanced"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["oxymercuration","anti_markovnikov","hydration","alkene","alcohol"]
  notes: "Gives Markovnikov alcohol without rearrangement. Anti-Markovnikov hydration."

- reaction_id: "CHM_RXN_011"
  name: "Hydroboration-oxidation of propene"
  reactants: ["CH3-CH=CH2", "BH3", "H2O2", "NaOH"]
  products: ["CH3-CH2-CH2-OH"]
  conditions: "BH3·THF; then H2O2, NaOH"
  mechanism: "electrophilic_addition"
  grade_range: ["class12","jee_advanced"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["hydroboration","anti_markovnikov","alkene","primary_alcohol"]
  notes: "Anti-Markovnikov hydration. Gives primary alcohol from terminal alkene. Syn addition."

- reaction_id: "CHM_RXN_012"
  name: "Nitration of benzene"
  reactants: ["C6H6", "HNO3", "H2SO4"]
  products: ["C6H5-NO2", "H2O"]
  conditions: "conc. H2SO4, 50-55°C"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["nitration","electrophilic_aromatic_substitution","benzene","nitronium_ion","ortho_para"]
  notes: "NO2+ (nitronium ion) is the electrophile. Deactivating and meta-directing group. Yellow oil."

- reaction_id: "CHM_RXN_013"
  name: "Sulfonation of benzene"
  reactants: ["C6H6", "H2SO4"]
  products: ["C6H5-SO3H", "H2O"]
  conditions: "fuming H2SO4, 80°C"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["sulfonation","electrophilic_aromatic_substitution","benzene","so3h","reversible"]
  notes: "Reversible reaction. Used in synthesis of detergents and dyes."

- reaction_id: "CHM_RXN_014"
  name: "Halogenation of benzene (chlorination)"
  reactants: ["C6H6", "Cl2"]
  products: ["C6H5-Cl", "HCl"]
  conditions: "FeCl3 or AlCl3 catalyst, room temperature"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["halogenation","electrophilic_aromatic_substitution","benzene","chlorobenzene","lewis_acid"]
  notes: "FeCl3 polarizes Cl2 to generate Cl+. Chlorobenzene is the product."

- reaction_id: "CHM_RXN_015"
  name: "Friedel-Crafts alkylation of benzene"
  reactants: ["C6H6", "CH3-Cl"]
  products: ["C6H5-CH3", "HCl"]
  conditions: "anhydrous AlCl3"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["friedel_crafts_alkylation","electrophilic_aromatic_substitution","benzene","toluene","alcl3","polyalkylation"]
  notes: "Suffers from polyalkylation and carbocation rearrangement. Not effective with deactivated rings."

- reaction_id: "CHM_RXN_016"
  name: "Friedel-Crafts acylation of benzene"
  reactants: ["C6H6", "CH3-CO-Cl"]
  products: ["C6H5-CO-CH3", "HCl"]
  conditions: "anhydrous AlCl3"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["friedel_crafts_acylation","electrophilic_aromatic_substitution","benzene","acetophenone","alcl3"]
  notes: "No rearrangement; no polyacylation. Acyl group is deactivating and meta-directing."

- reaction_id: "CHM_RXN_017"
  name: "Nitration of toluene"
  reactants: ["C6H5-CH3", "HNO3", "H2SO4"]
  products: ["o-NO2-C6H4-CH3", "p-NO2-C6H4-CH3"]
  conditions: "conc. H2SO4, 50°C"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["nitration","ortho_para","activating","toluene","methyl_activates"]
  notes: "Methyl is ortho-para directing and activating. Mixture of ortho and para isomers."

- reaction_id: "CHM_RXN_018"
  name: "Sulfonation of benzene (fuming sulfuric acid)"
  reactants: ["C6H6", "H2SO4"]
  products: ["C6H5-SO3H", "H2O"]
  conditions: "fuming H2SO4 (oleum), 80°C"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["sulfonation","electrophilic_aromatic_substitution","benzenesulfonic_acid","oleum"]
  notes: "Benzenesulfonic acid formed. Sulfonic acid group is strongly deactivating and meta-directing."

- reaction_id: "CHM_RXN_019"
  name: "Halogenation of chlorobenzene (Friedel-Crafts)"
  reactants: ["C6H5-Cl", "Cl2"]
  products: ["o-Cl-C6H4-Cl", "p-Cl-C6H4-Cl"]
  conditions: "anhydrous FeCl3"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["halogenation","chlorination","chlorobenzene","ortho_para","deactivating","friedel_crafts_fails"]
  notes: "Cl is ortho-para directing but deactivating. ortho:para ratio ~30:70 due to steric hindrance."

- reaction_id: "CHM_RXN_020"
  name: "Friedel-Crafts alkylation of toluene"
  reactants: ["C6H5-CH3", "CH3-Cl"]
  products: ["o-CH3-C6H4-CH3", "p-CH3-C6H4-CH3"]
  conditions: "anhydrous AlCl3"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["friedel_crafts_alkylation","toluene","xylene","ortho_para","polyalkylation"]
  notes: "Produces xylene isomers (o-xylene + p-xylene). Polyalkylation is a problem."

- reaction_id: "CHM_RXN_021"
  name: "Friedel-Crafts acylation of chlorobenzene"
  reactants: ["C6H5-Cl", "CH3-CO-Cl"]
  products: ["o-CH3-CO-C6H4-Cl", "p-CH3-CO-C6H4-Cl"]
  conditions: "anhydrous AlCl3"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["friedel_crafts_acylation","chlorobenzene","ortho_para","acetanilide"]
  notes: "Acylation works even with deactivated rings. ortho:para ~30:70."

- reaction_id: "CHM_RXN_022"
  name: "Nitration of naphthalene"
  reactants: ["C10H8", "HNO3", "H2SO4"]
  products: ["1-NO2-C10H7", "2-NO2-C10H7"]
  conditions: "conc. H2SO4, 50°C"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["nitration","naphthalene","alpha_position","beta_position","kinetic_control"]
  notes: "Kinetic product is 1-nitronaphthalene (alpha). Thermodynamic product is 2-nitronaphthalene."

- reaction_id: "CHM_RXN_023"
  name: "Halogenation of phenol (without catalyst)"
  reactants: ["C6H5-OH", "Br2(aq)"]
  products: ["2,4,6-Br3-C6H2-OH"]
  conditions: "room temperature, aqueous Br2"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main","neet"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["halogenation","phenol","tribromophenol","activating","no_catalyst"]
  notes: "Phenol is highly activated. Forms 2,4,6-tribromophenol white precipitate; test for phenol."

- reaction_id: "CHM_RXN_024"
  name: "Nitration of aniline (mild conditions)"
  reactants: ["C6H5-NH2", "HNO3(dilute)"]
  products: ["p-NO2-C6H4-NH2", "o-NO2-C6H4-NH2"]
  conditions: "dilute HNO3, low temperature"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Amines"
  subject: "chemistry"
  concept_tags: ["nitration","aniline","ortho_para","activating","protonation_problem"]
  notes: "NH2 is strongly activating. Must protect amino group (acetylate to acetanilide) to avoid meta product."

- reaction_id: "CHM_RXN_025"
  name: "Sulfonation of benzene (reversible)"
  reactants: ["C6H6", "H2SO4"]
  products: ["C6H5-SO3H", "H2O"]
  conditions: "conc. H2SO4, reversible"
  mechanism: "electrophilic_aromatic_substitution"
  grade_range: ["class11","class12","jee_main"]
  chapter: "Benzene and Aromatic Compounds"
  subject: "chemistry"
  concept_tags: ["sulfonation","reversible","thermodynamic","meta_directing","benzenesulfonic_acid"]
  notes: "Reversible. SO3H is a strong deactivator and meta-director. Used in synthesis of detergents."

- reaction_id: "CHM_RXN_026"
  name: "Addition of HCN to formaldehyde"
  reactants: ["HCHO", "HCN"]
  products: ["HO-CH2-CN"]
  conditions: "aqueous KCN or NaCN, weak base"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["nucleophilic_addition","cyanohydrin","formaldehyde","hcn","aldol_precursor"]
  notes: "CN- adds to carbonyl carbon. Forms hydroxymethylacetonitrile (cyanohydrin)."

- reaction_id: "CHM_RXN_027"
  name: "Addition of NaBH4 to acetone"
  reactants: ["CH3-CO-CH3", "NaBH4"]
  products: ["CH3-CH(OH)-CH3"]
  conditions: "methanol or ethanol solvent"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["nucleophilic_addition","reduction","nabh4","secondary_alcohol","selective"]
  notes: "NaBH4 selectively reduces aldehydes and ketones to alcohols. Does not reduce esters or carboxylic acids."

- reaction_id: "CHM_RXN_028"
  name: "Addition of Grignard reagent to formaldehyde"
  reactants: ["HCHO", "CH3-MgBr"]
  products: ["CH3-CH2-OH(after hydrolysis)"]
  conditions: "dry ether, then H3O+ workup"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["grignard","formaldehyde","primary_alcohol","nucleophilic_addition","extended_carbon_chain"]
  notes: "Grignard adds to carbonyl. Gives primary alcohol (one C more than aldehyde)."

- reaction_id: "CHM_RXN_029"
  name: "Addition of Grignard reagent to acetaldehyde"
  reactants: ["CH3-CHO", "CH3-MgBr"]
  products: ["CH3-CH(OH)-CH3(after hydrolysis)"]
  conditions: "dry ether, then H3O+"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["grignard","acetaldehyde","secondary_alcohol","nucleophilic_addition"]
  notes: "Gives secondary alcohol after hydrolysis. Key method for alcohol synthesis."

- reaction_id: "CHM_RXN_030"
  name: "Addition of Grignard reagent to acetone"
  reactants: ["CH3-CO-CH3", "CH3-MgBr"]
  products: ["(CH3)3C-OH(after hydrolysis)"]
  conditions: "dry ether, then H3O+"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Alcohols, Phenols and Ethers"
  subject: "chemistry"
  concept_tags: ["grignard","acetone","tertiary_alcohol","nucleophilic_addition","t_butyl_alcohol"]
  notes: "Gives tertiary alcohol (2-methylpropan-2-ol). Two methyl groups from Grignard."

- reaction_id: "CHM_RXN_031"
  name: "Aldol addition of acetaldehyde"
  reactants: ["2 CH3-CHO"]
  products: ["CH3-CH(OH)-CH2-CHO"]
  conditions: "dilute NaOH, 20°C"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["aldol_condensation","beta_hydroxy_aldehyde","acetaldehyde","self_condensation"]
  notes: "Beta-hydroxy aldehyde (aldol). Forms via enolate addition to carbonyl. Reversible."

- reaction_id: "CHM_RXN_032"
  name: "Aldol condensation (dehydrated product)"
  reactants: ["2 CH3-CHO"]
  products: ["CH3-CH=CH-CHO", "H2O"]
  conditions: "conc. NaOH, heat"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["aldol_condensation","alpha_beta_unsaturated","crotonaldehyde","dehydration"]
  notes: "Elimination of water gives alpha,beta-unsaturated aldehyde (crotonaldehyde)."

- reaction_id: "CHM_RXN_033"
  name: "Crossed aldol condensation (acetaldehyde + benzaldehyde)"
  reactants: ["CH3-CHO", "C6H5-CHO"]
  products: ["C6H5-CH=CH-CHO", "H2O"]
  conditions: "dilute NaOH"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["crossed_aldol","benzaldehyde","cinnamaldehyde","no_alpha_h"]
  notes: "Only acetaldehyde has alpha-H; benzaldehyde cannot self-condense."

- reaction_id: "CHM_RXN_034"
  name: "Intramolecular aldol condensation (diethyl succinate)"
  reactants: ["CH3-CO-CH2-CO-OEt"]
  products: ["2-ethyl-3-methylbut-2-en-1-ol derivative"]
  conditions: "NaOEt, then acid"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["intramolecular_aldol","cyclic_product","diester","ring_formation"]
  notes: "Intramolecular aldol gives cyclic products when ring size is favorable."

- reaction_id: "CHM_RXN_035"
  name: "Cannizzaro reaction (formaldehyde disproportionation)"
  reactants: ["2 HCHO", "NaOH"]
  products: ["CH3-OH", "HCOONa"]
  conditions: "50% NaOH, warm"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["cannizzaro","disproportionation","formaldehyde","no_alpha_h","methanol","formate"]
  notes: "Aldehydes without alpha-H undergo disproportionation. One oxidized to acid salt, other reduced to alcohol."

- reaction_id: "CHM_RXN_036"
  name: "Cannizzaro reaction (benzaldehyde disproportionation)"
  reactants: ["2 C6H5-CHO", "NaOH"]
  products: ["C6H5-CH2-OH", "C6H5-COONa"]
  conditions: "conc. NaOH"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_main","jee_advanced","neet"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["cannizzaro","benzaldehyde","disproportionation","no_alpha_h","benzyl_alcohol","benzoate"]
  notes: "Benzaldehyde (no alpha-H) gives benzyl alcohol + sodium benzoate. Crossed Cannizzaro with formaldehyde is common."

- reaction_id: "CHM_RXN_037"
  name: "Crossed Cannizzaro reaction (benzaldehyde + formaldehyde)"
  reactants: ["C6H5-CHO", "HCHO", "NaOH"]
  products: ["C6H5-CH2-OH", "HCOONa"]
  conditions: "conc. NaOH"
  mechanism: "nucleophilic_addition"
  grade_range: ["class12","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["crossed_cannizzaro","formaldehyde","benzyl_alcohol","selective_reduction"]
  notes: "Formaldehyde is preferentially oxidized. Benzaldehyde is selectively reduced."

- reaction_id: "CHM_RXN_038"
  name: "Formation of acid chloride from acetic acid"
  reactants: ["CH3-COOH", "PCl5"]
  products: ["CH3-CO-Cl", "POCl3", "HCl"]
  conditions: "dry conditions"
  mechanism: "nucleophilic_substitution"
  grade_range: ["class12","jee_main","jee_advanced"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["acid_chloride","pcl5","acyl_chloride","carboxylic_acid_derivative","reagent"]
  notes: "PCl5, PCl3, or SOCl2 convert acids to acid chlorides. SOCl2 (thionyl chloride) is preferred (gaseous byproducts)."

- reaction_id: "CHM_RXN_039"
  name: "Esterification of acetic acid (Fischer esterification)"
  reactants: ["CH3-COOH", "C2H5-OH"]
  products: ["CH3-CO-O-C2H5", "H2O"]
  conditions: "conc. H2SO4, reflux"
  mechanism: "nucleophilic_substitution"
  grade_range: ["class11","class12","jee_main","jee_advanced","neet"]
  chapter: "Aldehydes, Ketones and Carboxylic Acids"
  subject: "chemistry"
  concept_tags: ["esterification","fischer","acetic_acid","ethyl_acetate","acid_catalyzed","reversible"]
  notes: "Acid-catalyzed equilibrium reaction. Removal of water or excess alcohol drives reaction forward."

- reaction_id: "CHM_RXN_040"
  name: "Hydrolysis of ethyl acetate (saponification)"
  reactants: ["CH3-CO-O-C2H5", "NaOH"]
  products: ["CH3-COONa", "C2H5-OH"]
  conditions: "aqueous NaOH, reflux"
  mechanism: "nucleophilic_substitution"
  grade_range: ["class11","class12","jee_main","neet"]
