- formula_id: CISCE_ENVI_c11_evs_formula_bank_085
  name: Key relationships
  latex: 'Food chain = linear sequence of organisms through which energy flows. Grazing
    food chain (GFC): producer → herbivore → carnivore → apex (e.g., grass → grasshopper
    → frog → snake → hawk). Detritus food chain (DFC): dead organic matter → detritivore
    → predator (e.g., leaf litter → earthworm → frog). Food web = interconnected network
    of food chains in an ecosystem. Trophic levels: producer (TL1), primary consumer
    (TL2), secondary (TL3), tertiary (TL4), apex (TL5).'
