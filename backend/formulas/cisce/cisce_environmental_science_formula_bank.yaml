  latex: 'state variables that, if pushed past a threshold, flip the ecosystem to
    an alternative stable state. Examples: phosphorus in lakes, herbivore biomass
    in savanna (grassland ↔ shrubland), sea-ice extent in Arctic, groundwater table
    in Punjab (rice-wheat zone — water table falling ~0.5 m/yr).'
