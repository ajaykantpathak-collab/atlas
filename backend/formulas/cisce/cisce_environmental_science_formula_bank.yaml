  latex: 'Environmental Science is the interdisciplinary study of interactions between
    physical, chemical, biological and social components of the environment. It draws
    on ecology, earth science, chemistry, physics, economics, sociology and law. Scope
    is captured by four functional domains: (i) natural resource management, (ii)
    pollution monitoring and control, (iii) biodiversity and ecosystem conservation,
    (iv) environmental policy and governance. Applications include Environmental Impact
    Assessment (EIA), life-cycle assessment (LCA), ecological footprint accounting,
    and sustainable development planning.'
