- formula_id: CISCE_ENVI_c11_evs_formula_bank_140
  name: Carbon cycle
  latex: 'reservoirs = ocean (≈ 38,000 Gt C), fossil fuels (≈ 5,000–10,000 Gt C),
    atmosphere (≈ 870 Gt C as CO₂, ~420 ppm in 2024), terrestrial biomass (≈ 550 Gt
    C), soils (≈ 1,500 Gt C). Processes: photosynthesis (uptake), res\piration (release),
    combustion (release), decomposition, ocean–atmosphere exchange, weathering, sedimentation
    (long-term sink as carbonate rock).'
  variables: []
  preconditions: []
  grade_range:
  - class11
  chapter: '='
  subject: environmental_science
