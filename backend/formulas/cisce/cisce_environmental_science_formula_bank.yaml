  source: cisce/c11_formula_bank.marker
  board: CISCE
- formula_id: CISCE_ENVI_c11_evs_formula_bank_141
  name: Nitrogen cycle
  latex: 'reservoir = atmosphere (N₂, 78% of air, ≈ 4 × 10⁹ Gt N). Steps: nitrogen
    fixation (N₂ → NH₃) by Rhizobium (legume root nodules), Azotobacter (free-living),
    Cyanobacteria (Anabaena in rice paddies), and industrial Haber–Bosch (N₂ + 3H₂
    → 2NH₃, ~450 °C, 200 atm); nitrification (NH₄⁺ → NO₂⁻ by Nitrosomonas; NO₂⁻ →
    NO₃⁻ by Nitrobacter); assimilation by plants; ammonification (organic N → NH₄⁺)
    by decomposers; denitrification (NO₃⁻ → N₂) by Pseudomonas denitrificans under
    anaerobic conditions.'
  variables: []
  preconditions: []
  grade_range:
  - class11
  chapter: '='
  subject: environmental_science
  concept_tags:
  - nitrogen-cycle
  - '='
  related_formulas: []
  source: cisce/c11_formula_bank.marker
  board: CISCE
