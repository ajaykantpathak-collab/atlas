- formula_id: CISCE_ENVI_c11_evs_formula_bank_319
  name: Key relationships
  latex: 'Ecosystems are complex adaptive systems with emergent properties (properties
    of the whole not predictable from parts), feedback loops (negative/stabilising
    and positive/amplifying), thresholds (tip\ping points), and non-linear dynamics.
    Examples of thresholds: lake eutrophication (clear → turbid at a critical P loading),
    coral bleaching (above DHW 4), forest dieback above a warming threshold.'
  variables: []
  preconditions: []
  grade_range:
