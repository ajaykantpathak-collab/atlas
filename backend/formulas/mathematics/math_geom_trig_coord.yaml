---
  - formula_id: "MATH_GEO_001"
    formula_name: "Heron's Formula"
    latex: "A = \\sqrt{s(s-a)(s-b)(s-c)}"
    description: "Area of a triangle given its three side lengths a, b, c. s is the semi-perimeter."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_002"
    formula_name: "Law of Sines"
    latex: "\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R"
    description: "Ratio of side length to sine of opposite angle equals twice the circumradius R."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_003"
    formula_name: "Law of Cosines"
    latex: "c^2 = a^2 + b^2 - 2ab\\cos C"
    description: "Relates three sides of a triangle to one of its angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_004"
    formula_name: "Triangle Area (base-height)"
    latex: "A = \\frac{1}{2}bh"
    description: "Area of a triangle given base b and corresponding altitude h."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_005"
    formula_name: "Triangle Area (sine formula)"
    latex: "A = \\frac{1}{2}ab\\sin C"
    description: "Area of a triangle using two sides a, b and the included angle C."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_006"
    formula_name: "Pythagorean Theorem"
    latex: "c^2 = a^2 + b^2"
    description: "In a right triangle, the square of hypotenuse equals sum of squares of legs."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_007"
    formula_name: "Angle Bisector Theorem"
    latex: "\\frac{BD}{DC} = \\frac{AB}{AC}"
    description: "Internal angle bisector divides the opposite side in the ratio of adjacent sides."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_008"
    formula_name: "Length of Angle Bisector"
    latex: "l = \\frac{2ab\\cos\\frac{C}{2}}{a+b}"
    description: "Length of internal bisector of angle C in triangle with adjacent sides a, b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_009"
    formula_name: "Length of Median"
    latex: "m_a = \\frac{1}{2}\\sqrt{2b^2 + 2c^2 - a^2}"
    description: "Length of median from vertex A to side a in a triangle with sides a, b, c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_010"
    formula_name: "Circumradius of Triangle"
    latex: "R = \\frac{abc}{4A}"
    description: "Circumradius in terms of sides a, b, c and area A."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_011"
    formula_name: "Inradius of Triangle"
    latex: "r = \\frac{A}{s}"
    description: "Inradius in terms of area A and semi-perimeter s."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_012"
    formula_name: "Relation between r and R"
    latex: "rR = \\frac{abc}{4(a+b+c)}"
    description: "Product of inradius and circumradius for a triangle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_013"
    formula_name: "Arc Length"
    latex: "L = r\\theta"
    description: "Arc length of a circle with radius r subtending angle theta in radians."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_014"
    formula_name: "Sector Area"
    latex: "A = \\frac{1}{2}r^2\\theta"
    description: "Area of a circular sector with radius r and central angle theta (radians)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_015"
    formula_name: "Segment Area (minor)"
    latex: "A = \\frac{1}{2}r^2(\\theta - \\sin\\theta)"
    description: "Area of a minor circular segment with radius r and central angle theta."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_016"
    formula_name: "Chord Length"
    latex: "c = 2r\\sin\\frac{\\theta}{2}"
    description: "Length of a chord subtending angle theta at the center of a circle of radius r."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_017"
    formula_name: "Area of Regular Polygon"
    latex: "A = \\frac{1}{4}na^2\\cot\\frac{\\pi}{n}"
    description: "Area of a regular n-sided polygon with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_018"
    formula_name: "Interior Angle of Regular Polygon"
    latex: "\\alpha = \\frac{(n-2)\\pi}{n}"
    description: "Each interior angle of a regular n-sided polygon in radians."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_019"
    formula_name: "Sum of Interior Angles"
    latex: "S = (n-2)\\pi"
    description: "Sum of all interior angles of an n-sided polygon in radians."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_020"
    formula_name: "Circumradius of Regular Polygon"
    latex: "R = \\frac{a}{2\\sin\\frac{\\pi}{n}}"
    description: "Circumradius of a regular n-sided polygon with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_021"
    formula_name: "Inradius of Regular Polygon"
    latex: "r = \\frac{a}{2\\tan\\frac{\\pi}{n}}"
    description: "Inradius (apothem) of a regular n-sided polygon with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_022"
    formula_name: "Distance between Circumcenter and Incenter"
    latex: "d^2 = R(R - 2r)"
    description: "Euler's formula relating circumradius R, inradius r, and their separation."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_023"
    formula_name: "Area of Rhombus"
    latex: "A = \\frac{1}{2}d_1d_2"
    description: "Area of a rhombus in terms of its diagonals d1 and d2."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_024"
    formula_name: "Area of Trapezium"
    latex: "A = \\frac{1}{2}(a+b)h"
    description: "Area of a trapezium with parallel sides a, b and height h."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_025"
    formula_name: "Length of Altitude in Right Triangle"
    latex: "h = \\frac{ab}{c}"
    description: "Altitude to the hypotenuse in a right triangle with legs a, b and hypotenuse c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_026"
    formula_name: "Area of Cyclic Quadrilateral"
    latex: "A = \\sqrt{(s-a)(s-b)(s-c)(s-d)}"
    description: "Brahmagupta's formula for area of a cyclic quadrilateral with semi-perimeter s."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_027"
    formula_name: "Ptolemy's Theorem"
    latex: "ac + bd = ef"
    description: "For a cyclic quadrilateral with sides a, b, c, d and diagonals e, f."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_028"
    formula_name: "Sine of Half-Angle (Triangle)"
    latex: "\\sin\\frac{A}{2} = \\sqrt{\\frac{(s-b)(s-c)}{bc}}"
    description: "Sine of half of angle A in a triangle in terms of sides and semi-perimeter."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_029"
    formula_name: "Cosine of Half-Angle (Triangle)"
    latex: "\\cos\\frac{A}{2} = \\sqrt{\\frac{s(s-a)}{bc}}"
    description: "Cosine of half of angle A in a triangle in terms of sides and semi-perimeter."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_030"
    formula_name: "Length of External Angle Bisector"
    latex: "l_e = \\frac{2ab\\sin\\frac{C}{2}}{|a-b|}"
    description: "Length of the external bisector of angle C in a triangle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_031"
    formula_name: "Area of Segment (degrees)"
    latex: "A = \\frac{1}{2}r^2\\left(\\frac{\\theta\\pi}{180} - \\sin\\theta\\right)"
    description: "Area of circular segment with central angle theta in degrees and radius r."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_032"
    formula_name: "Perimeter of Regular Polygon"
    latex: "P = na"
    description: "Perimeter of a regular n-sided polygon with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_033"
    formula_name: "Sum of Exterior Angles"
    latex: "S = 2\\pi"
    description: "Sum of exterior angles of any polygon is 360 degrees or 2*pi radians."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_034"
    formula_name: "Distance Between Circumcenter and Orthocenter"
    latex: "d^2 = 9R^2 - (a^2+b^2+c^2)"
    description: "Distance between circumcenter O and orthocenter H of a triangle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_035"
    formula_name: "Centroid Coordinate (Triangle)"
    latex: "G = \\left(\\frac{x_1+x_2+x_3}{3}, \\frac{y_1+y_2+y_3}{3}\\right)"
    description: "Coordinates of the centroid of a triangle with vertices (x1,y1), (x2,y2), (x3,y3)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_036"
    formula_name: "Orthocenter Property"
    latex: "OH^2 = 9R^2 - (a^2+b^2+c^2)"
    description: "Distance between circumcenter and orthocenter in terms of circumradius R and sides."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_037"
    formula_name: "Circumradius via Angles"
    latex: "R = \\frac{a}{2\\sin A}"
    description: "Circumradius R expressed using side a and opposite angle A."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_038"
    formula_name: "Inradius via Angles"
    latex: "r = 4R\\sin\\frac{A}{2}\\sin\\frac{B}{2}\\sin\\frac{C}{2}"
    description: "Inradius expressed in terms of circumradius R and half-angles of the triangle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_039"
    formula_name: "Area of Kite"
    latex: "A = \\frac{1}{2}d_1d_2"
    description: "Area of a kite in terms of its two diagonals d1 and d2."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_040"
    formula_name: "Exradius of Triangle"
    latex: "r_a = \\frac{A}{s-a}"
    description: "Exradius opposite vertex A in terms of area A and semi-perimeter s."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_001"
    formula_name: "Pythagorean Identity"
    latex: "\\sin^2\\theta + \\cos^2\\theta = 1"
    description: "Fundamental identity relating sine and cosine of the same angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_002"
    formula_name: "Reciprocal Identity - Cosecant"
    latex: "\\csc\\theta = \\frac{1}{\\sin\\theta}"
    description: "Definition of cosecant as the reciprocal of sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_003"
    formula_name: "Reciprocal Identity - Secant"
    latex: "\\sec\\theta = \\frac{1}{\\cos\\theta}"
    description: "Definition of secant as the reciprocal of cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_004"
    formula_name: "Reciprocal Identity - Cotangent"
    latex: "\\cot\\theta = \\frac{1}{\\tan\\theta}"
    description: "Definition of cotangent as the reciprocal of tangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_005"
    formula_name: "Quotient Identity - Tangent"
    latex: "\\tan\\theta = \\frac{\\sin\\theta}{\\cos\\theta}"
    description: "Tangent expressed as the ratio of sine to cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_006"
    formula_name: "Quotient Identity - Cotangent"
    latex: "\\cot\\theta = \\frac{\\cos\\theta}{\\sin\\theta}"
    description: "Cotangent expressed as the ratio of cosine to sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_007"
    formula_name: "Pythagorean Identity (secant)"
    latex: "\\sec^2\\theta = 1 + \\tan^2\\theta"
    description: "Derived Pythagorean identity using secant and tangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_008"
    formula_name: "Pythagorean Identity (cosecant)"
    latex: "\\csc^2\\theta = 1 + \\cot^2\\theta"
    description: "Derived Pythagorean identity using cosecant and cotangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_009"
    formula_name: "Even/Odd Identity - Cosine"
    latex: "\\cos(-\\theta) = \\cos\\theta"
    description: "Cosine is an even function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_010"
    formula_name: "Even/Odd Identity - Sine"
    latex: "\\sin(-\\theta) = -\\sin\\theta"
    description: "Sine is an odd function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_011"
    formula_name: "Even/Odd Identity - Tangent"
    latex: "\\tan(-\\theta) = -\\tan\\theta"
    description: "Tangent is an odd function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_012"
    formula_name: "Even/Odd Identity - Secant"
    latex: "\\sec(-\\theta) = \\sec\\theta"
    description: "Secant is an even function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_013"
    formula_name: "Even/Odd Identity - Cosecant"
    latex: "\\csc(-\\theta) = -\\csc\\theta"
    description: "Cosecant is an odd function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_014"
    formula_name: "Even/Odd Identity - Cotangent"
    latex: "\\cot(-\\theta) = -\\cot\\theta"
    description: "Cotangent is an odd function."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_015"
    formula_name: "Cofunction Identity - Sine-Cosine"
    latex: "\\sin\\left(\\frac{\\pi}{2} - \\theta\\right) = \\cos\\theta"
    description: "Sine of complementary angle equals cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_016"
    formula_name: "Cofunction Identity - Cosine-Sine"
    latex: "\\cos\\left(\\frac{\\pi}{2} - \\theta\\right) = \\sin\\theta"
    description: "Cosine of complementary angle equals sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_017"
    formula_name: "Cofunction Identity - Tangent-Cotangent"
    latex: "\\tan\\left(\\frac{\\pi}{2} - \\theta\\right) = \\cot\\theta"
    description: "Tangent of complementary angle equals cotangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_018"
    formula_name: "Cofunction Identity - Secant-Cosecant"
    latex: "\\sec\\left(\\frac{\\pi}{2} - \\theta\\right) = \\csc\\theta"
    description: "Secant of complementary angle equals cosecant."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_019"
    formula_name: "Sum Formula - Sine"
    latex: "\\sin(A+B) = \\sin A\\cos B + \\cos A\\sin B"
    description: "Sine of sum of two angles in terms of sines and cosines of individual angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_020"
    formula_name: "Sum Formula - Cosine"
    latex: "\\cos(A+B) = \\cos A\\cos B - \\sin A\\sin B"
    description: "Cosine of sum of two angles in terms of sines and cosines of individual angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_021"
    formula_name: "Sum Formula - Tangent"
    latex: "\\tan(A+B) = \\frac{\\tan A + \\tan B}{1 - \\tan A\\tan B}"
    description: "Tangent of sum of two angles in terms of individual tangents."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_022"
    formula_name: "Difference Formula - Sine"
    latex: "\\sin(A-B) = \\sin A\\cos B - \\cos A\\sin B"
    description: "Sine of difference of two angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_023"
    formula_name: "Difference Formula - Cosine"
    latex: "\\cos(A-B) = \\cos A\\cos B + \\sin A\\sin B"
    description: "Cosine of difference of two angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_024"
    formula_name: "Difference Formula - Tangent"
    latex: "\\tan(A-B) = \\frac{\\tan A - \\tan B}{1 + \\tan A\\tan B}"
    description: "Tangent of difference of two angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_025"
    formula_name: "Double Angle - Sine"
    latex: "\\sin(2\\theta) = 2\\sin\\theta\\cos\\theta"
    description: "Double angle formula for sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_026"
    formula_name: "Double Angle - Cosine (form 1)"
    latex: "\\cos(2\\theta) = \\cos^2\\theta - \\sin^2\\theta"
    description: "Double angle formula for cosine in terms of sine and cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_027"
    formula_name: "Double Angle - Cosine (form 2)"
    latex: "\\cos(2\\theta) = 2\\cos^2\\theta - 1"
    description: "Double angle formula for cosine in terms of cosine only."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_028"
    formula_name: "Double Angle - Cosine (form 3)"
    latex: "\\cos(2\\theta) = 1 - 2\\sin^2\\theta"
    description: "Double angle formula for cosine in terms of sine only."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_029"
    formula_name: "Double Angle - Tangent"
    latex: "\\tan(2\\theta) = \\frac{2\\tan\\theta}{1 - \\tan^2\\theta}"
    description: "Double angle formula for tangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_030"
    formula_name: "Half Angle - Sine"
    latex: "\\sin\\frac{\\theta}{2} = \\pm\\sqrt{\\frac{1 - \\cos\\theta}{2}}"
    description: "Half angle formula for sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_031"
    formula_name: "Half Angle - Cosine"
    latex: "\\cos\\frac{\\theta}{2} = \\pm\\sqrt{\\frac{1 + \\cos\\theta}{2}}"
    description: "Half angle formula for cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_032"
    formula_name: "Half Angle - Tangent"
    latex: "\\tan\\frac{\\theta}{2} = \\pm\\sqrt{\\frac{1 - \\cos\\theta}{1 + \\cos\\theta}}"
    description: "Half angle formula for tangent in terms of cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_033"
    formula_name: "Half Angle - Tangent (sine/cosine)"
    latex: "\\tan\\frac{\\theta}{2} = \\frac{\\sin\\theta}{1 + \\cos\\theta}"
    description: "Half angle formula for tangent expressed using sine and cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_034"
    formula_name: "Half Angle - Tangent (alt)"
    latex: "\\tan\\frac{\\theta}{2} = \\frac{1 - \\cos\\theta}{\\sin\\theta}"
    description: "Alternative half angle formula for tangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_035"
    formula_name: "Triple Angle - Sine"
    latex: "\\sin(3\\theta) = 3\\sin\\theta - 4\\sin^3\\theta"
    description: "Triple angle formula for sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_036"
    formula_name: "Triple Angle - Cosine"
    latex: "\\cos(3\\theta) = 4\\cos^3\\theta - 3\\cos\\theta"
    description: "Triple angle formula for cosine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_037"
    formula_name: "Sum-to-Product - Sine"
    latex: "\\sin A + \\sin B = 2\\sin\\frac{A+B}{2}\\cos\\frac{A-B}{2}"
    description: "Sum of two sines expressed as a product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_038"
    formula_name: "Sum-to-Product - Sine Difference"
    latex: "\\sin A - \\sin B = 2\\cos\\frac{A+B}{2}\\sin\\frac{A-B}{2}"
    description: "Difference of two sines expressed as a product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_039"
    formula_name: "Sum-to-Product - Cosine Sum"
    latex: "\\cos A + \\cos B = 2\\cos\\frac{A+B}{2}\\cos\\frac{A-B}{2}"
    description: "Sum of two cosines expressed as a product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_040"
    formula_name: "Sum-to-Product - Cosine Difference"
    latex: "\\cos A - \\cos B = -2\\sin\\frac{A+B}{2}\\sin\\frac{A-B}{2}"
    description: "Difference of two cosines expressed as a product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_041"
    formula_name: "Product-to-Sum - Sine Products"
    latex: "\\sin A\\sin B = \\frac{1}{2}[\\cos(A-B) - \\cos(A+B)]"
    description: "Product of two sines expressed as sum/difference of cosines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_042"
    formula_name: "Product-to-Sum - Cosine Products"
    latex: "\\cos A\\cos B = \\frac{1}{2}[\\cos(A-B) + \\cos(A+B)]"
    description: "Product of two cosines expressed as sum/difference of cosines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_043"
    formula_name: "Product-to-Sum - Sine-Cosine"
    latex: "\\sin A\\cos B = \\frac{1}{2}[\\sin(A+B) + \\sin(A-B)]"
    description: "Product of sine and cosine expressed as sum of sines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_044"
    formula_name: "Product-to-Sum - Cosine-Sine"
    latex: "\\cos A\\sin B = \\frac{1}{2}[\\sin(A+B) - \\sin(A-B)]"
    description: "Product of cosine and sine expressed as difference of sines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_045"
    formula_name: "Power Reduction - Sine"
    latex: "\\sin^2\\theta = \\frac{1 - \\cos(2\\theta)}{2}"
    description: "Square of sine expressed in terms of cosine of double angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_046"
    formula_name: "Power Reduction - Cosine"
    latex: "\\cos^2\\theta = \\frac{1 + \\cos(2\\theta)}{2}"
    description: "Square of cosine expressed in terms of cosine of double angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_047"
    formula_name: "Power Reduction - Tangent"
    latex: "\\tan^2\\theta = \\frac{1 - \\cos(2\\theta)}{1 + \\cos(2\\theta)}"
    description: "Square of tangent expressed in terms of cosine of double angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_048"
    formula_name: "Inverse Sine Sum"
    latex: "\\sin^{-1}x + \\sin^{-1}y = \\sin^{-1}\\left(x\\sqrt{1-y^2} + y\\sqrt{1-x^2}\\right)"
    description: "Sum of two inverse sine functions."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_049"
    formula_name: "Inverse Cosine Sum"
    latex: "\\cos^{-1}x + \\cos^{-1}y = \\cos^{-1}\\left(xy - \\sqrt{(1-x^2)(1-y^2)}\\right)"
    description: "Sum of two inverse cosine functions."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_050"
    formula_name: "Inverse Tangent Sum"
    latex: "\\tan^{-1}x + \\tan^{-1}y = \\tan^{-1}\\left(\\frac{x+y}{1-xy}\\right)"
    description: "Sum of two inverse tangent functions."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_051"
    formula_name: "Inverse Sine - Cosine Relationship"
    latex: "\\sin^{-1}x + \\cos^{-1}x = \\frac{\\pi}{2}"
