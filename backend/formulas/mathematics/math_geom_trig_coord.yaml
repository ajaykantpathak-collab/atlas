    description: "Direction cosines derived from direction ratios a, b, c of a line."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_003"
    formula_name: "Angle Between Two Lines (Direction Cosines)"
    latex: "\\cos\\theta = l_1l_2 + m_1m_2 + n_1n_2"
    description: "Cosine of angle between two lines given by their direction cosines (l1,m1,n1) and (l2,m2,n2)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_004"
    formula_name: "Angle Between Two Lines (Direction Ratios)"
    latex: "\\cos\\theta = \\frac{a_1a_2 + b_1b_2 + c_1c_2}{\\sqrt{a_1^2+b_1^2+c_1^2}\\sqrt{a_2^2+b_2^2+c_2^2}}"
    description: "Cosine of angle between two lines given by direction ratios."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_005"
    formula_name: "Condition for Parallel Lines (3D)"
    latex: "\\frac{a_1}{a_2} = \\frac{b_1}{b_2} = \\frac{c_1}{c_2}"
    description: "Two lines are parallel if their direction ratios are proportional."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_006"
    formula_name: "Condition for Perpendicular Lines (3D)"
    latex: "a_1a_2 + b_1b_2 + c_1c_2 = 0"
    description: "Two lines are perpendicular if the dot product of their direction ratios is zero."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_007"
    formula_name: "Equation of Line Through a Point (Vector)"
    latex: "\\mathbf{r} = \\mathbf{a} + t\\mathbf{b}"
    description: "Vector equation of a line passing through point with position vector a in direction b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_008"
    formula_name: "Equation of Line Through a Point (Cartesian)"
    latex: "\\frac{x-x_1}{a} = \\frac{y-y_1}{b} = \\frac{z-z_1}{c}"
    description: "Cartesian equation of a line passing through (x1, y1, z1) with direction ratios a, b, c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_009"
    formula_name: "Equation of Line Through Two Points"
    latex: "\\frac{x-x_1}{x_2-x_1} = \\frac{y-y_1}{y_2-y_1} = \\frac{z-z_1}{z_2-z_1}"
    description: "Cartesian equation of a line passing through two points (x1,y1,z1) and (x2,y2,z2)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_010"
    formula_name: "Shortest Distance Between Skew Lines"
    latex: "d = \\frac{|(\\mathbf{a}_2 - \\mathbf{a}_1) \\cdot (\\mathbf{b}_1 \\times \\mathbf{b}_2)|}{|\\mathbf{b}_1 \\times \\mathbf{b}_2|}"
    description: "Shortest distance between two skew lines with direction vectors b1, b2 and passing through a1, a2."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_011"
    formula_name: "Equation of Plane (General)"
    latex: "ax + by + cz + d = 0"
    description: "General equation of a plane in 3D space."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_012"
    formula_name: "Equation of Plane (Normal Form)"
    latex: "lx + my + nz = p"
    description: "Normal form of plane equation with direction cosines l, m, n and perpendicular distance p from origin."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_013"
    formula_name: "Equation of Plane Through Three Points"
    latex: "\\begin{vmatrix} x & y & z & 1 \\ x_1 & y_1 & z_1 & 1 \\ x_2 & y_2 & z_2 & 1 \\ x_3 & y_3 & z_3 & 1 \\end{vmatrix} = 0"
    description: "Equation of a plane passing through three non-collinear points using a 4x4 determinant."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_014"
    formula_name: "Equation of Plane Intercept Form"
    latex: "\\frac{x}{a} + \\frac{y}{b} + \\frac{z}{c} = 1"
    description: "Equation of a plane with x-intercept a, y-intercept b, and z-intercept c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_015"
    formula_name: "Equation of Plane Through Line of Intersection"
    latex: "(a_1x + b_1y + c_1z + d_1) + \\lambda(a_2x + b_2y + c_2z + d_2) = 0"
    description: "Family of planes passing through the line of intersection of two planes."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_016"
    formula_name: "Distance from Point to Plane"
    latex: "d = \\frac{|ax_1 + by_1 + cz_1 + d|}{\\sqrt{a^2 + b^2 + c^2}}"
    description: "Perpendicular distance from point (x1, y1, z1) to plane ax + by + cz + d = 0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_017"
    formula_name: "Distance from Origin to Plane"
    latex: "d = \\frac{|d|}{\\sqrt{a^2 + b^2 + c^2}}"
    description: "Perpendicular distance from origin to plane ax + by + cz + d = 0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_018"
    formula_name: "Angle Between Two Planes"
    latex: "\\cos\\theta = \\frac{a_1a_2 + b_1b_2 + c_1c_2}{\\sqrt{a_1^2+b_1^2+c_1^2}\\sqrt{a_2^2+b_2^2+c_2^2}}"
    description: "Cosine of angle between two planes given by their normal vectors."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_019"
    formula_name: "Angle Between Line and Plane"
    latex: "\\sin\\theta = \\frac{|al + bm + cn|}{\\sqrt{a^2+b^2+c^2}}"
    description: "Sine of angle between a line with direction cosines (l,m,n) and a plane with normal (a,b,c)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_020"
    formula_name: "Distance Between Parallel Planes"
    latex: "d = \\frac{|d_1 - d_2|}{\\sqrt{a^2 + b^2 + c^2}}"
    description: "Distance between two parallel planes ax + by + cz + d1 = 0 and ax + by + cz + d2 = 0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_021"
    formula_name: "Plane Through Line of Intersection"
    latex: "\\mathbf{r} \\cdot (\\mathbf{n}_1 + \\lambda\\mathbf{n}_2) = -(d_1 + \\lambda d_2)"
    description: "Vector equation of a plane through the line of intersection of two given planes."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_022"
    formula_name: "Distance Between Two Skew Lines"
    latex: "d = \\frac{|\\mathbf{c} \\cdot (\\mathbf{a} \\times \\mathbf{b})|}{|\\mathbf{a} \\times \\mathbf{b}|}"
    description: "Shortest distance between two skew lines with direction vectors a and b, and vector c between points on the lines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_023"
    formula_name: "Direction Cosines of Joined Lines"
    latex: "L = l_1l_2 + m_1m_2 + n_1n_2"
    description: "Direction cosine of a line joining the ends of two lines with direction cosines (l1,m1,n1) and (l2,m2,n2)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_024"
    formula_name: "Angle Between Diagonals of a Cube"
    latex: "\\cos\\theta = \\frac{1}{3}"
    description: "Cosine of angle between two diagonals of a cube."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_025"
    formula_name: "Angle Between Face Diagonals of a Cube"
    latex: "\\cos\\theta = \\frac{1}{2}"
    description: "Cosine of angle between two face diagonals of a cube."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_026"
    formula_name: "Image of Point in a Plane"
    latex: "\\frac{x - x_1}{a} = \\frac{y - y_1}{b} = \\frac{z - z_1}{c} = -\\frac{2(ax_1+by_1+cz_1+d)}{a^2+b^2+c^2}"
    description: "Image of point (x1,y1,z1) in plane ax+by+cz+d=0 using the symmetric line through the point perpendicular to the plane."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_027"
    formula_name: "Image of Origin in Plane"
    latex: "\\left(\\frac{-ad}{a^2+b^2+c^2}, \\frac{-bd}{a^2+b^2+c^2}, \\frac{-cd}{a^2+b^2+c^2}\\right)"
    description: "Coordinates of the image of origin in plane ax + by + cz + d = 0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_028"
    formula_name: "Equation of Plane Perpendicular to a Line"
    latex: "(x-x_1)l + (y-y_1)m + (z-z_1)n = 0"
    description: "Equation of plane through point (x1,y1,z1) perpendicular to line with direction cosines (l,m,n)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_029"
    formula_name: "Coplanarity of Two Lines"
    latex: "(\\mathbf{a}_2 - \\mathbf{a}_1) \\cdot (\\mathbf{b}_1 \\times \\mathbf{b}_2) = 0"
    description: "Condition for two lines to be coplanar (skew distance = 0)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_030"
    formula_name: "Volume of Tetrahedron"
    latex: "V = \\frac{1}{6}|\\mathbf{a} \\cdot (\\mathbf{b} \\times \\mathbf{c})|"
    description: "Volume of a tetrahedron formed by three vectors a, b, c from one vertex."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_001"
    formula_name: "Dot Product"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = |\\mathbf{a}||\\mathbf{b}|\\cos\\theta"
    description: "Dot product of vectors a and b in terms of magnitudes and the angle between them."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_002"
    formula_name: "Dot Product (Components)"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = a_xb_x + a_yb_y + a_zb_z"
    description: "Dot product of two 3D vectors using their components."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_003"
    formula_name: "Magnitude from Dot Product"
    latex: "|\\mathbf{a}| = \\sqrt{\\mathbf{a} \\cdot \\mathbf{a}}"
    description: "Magnitude of vector a as the square root of the dot product with itself."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_004"
    formula_name: "Projection of a on b"
    latex: "\\text{proj}_{\\mathbf{b}}\\mathbf{a} = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{|\\mathbf{b}|}"
    description: "Scalar projection of vector a onto vector b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_005"
    formula_name: "Vector Projection of a on b"
    latex: "\\text{proj}_{\\mathbf{b}}\\mathbf{a} = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{|\\mathbf{b}|^2}\\mathbf{b}"
    description: "Vector projection of vector a onto vector b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_006"
    formula_name: "Component of a Along b"
    latex: "\\text{comp}_{\\mathbf{b}}\\mathbf{a} = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{|\\mathbf{b}|}"
    description: "Scalar component of vector a in the direction of vector b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_007"
    formula_name: "Perpendicular Component"
    latex: "\\mathbf{a}_{\\perp} = \\mathbf{a} - \\text{proj}_{\\mathbf{b}}\\mathbf{a}"
    description: "Component of a perpendicular to b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_008"
    formula_name: "Cross Product (Magnitude)"
    latex: "|\\mathbf{a} \\times \\mathbf{b}| = |\\mathbf{a}||\\mathbf{b}|\\sin\\theta"
    description: "Magnitude of cross product of vectors a and b in terms of their magnitudes and the sine of the angle between them."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_009"
    formula_name: "Cross Product (Components)"
    latex: "\\mathbf{a} \\times \\mathbf{b} = \\begin{vmatrix} \\mathbf{i} & \\mathbf{j} & \\mathbf{k} \\ a_x & a_y & a_z \\ b_x & b_y & b_z \\end{vmatrix}"
    description: "Cross product of vectors a and b expressed as a 3x3 determinant."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_010"
    formula_name: "Cross Product (Explicit)"
    latex: "\\mathbf{a} \\times \\mathbf{b} = (a_yb_z - a_zb_y)\\mathbf{i} + (a_zb_x - a_xb_z)\\mathbf{j} + (a_xb_y - a_yb_x)\\mathbf{k}"
    description: "Explicit component form of the cross product of vectors a and b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_011"
    formula_name: "Area of Parallelogram"
    latex: "A = |\\mathbf{a} \\times \\mathbf{b}|"
    description: "Area of a parallelogram formed by vectors a and b as adjacent sides."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_012"
    formula_name: "Area of Triangle"
    latex: "A = \\frac{1}{2}|\\mathbf{a} \\times \\mathbf{b}|"
    description: "Area of a triangle formed by vectors a and b as two sides from a common vertex."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_013"
    formula_name: "Scalar Triple Product"
    latex: "[\\mathbf{a} \\quad \\mathbf{b} \\quad \\mathbf{c}] = \\mathbf{a} \\cdot (\\mathbf{b} \\times \\mathbf{c})"
    description: "Scalar triple product of vectors a, b, c, equal to the volume of the parallelepiped they span."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_014"
    formula_name: "Scalar Triple Product (Determinant)"
    latex: "\\begin{vmatrix} a_x & a_y & a_z \\ b_x & b_y & b_z \\ c_x & c_y & c_z \\end{vmatrix}"
    description: "Scalar triple product expressed as a 3x3 determinant of the vector components."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_015"
    formula_name: "Volume of Parallelepiped"
    latex: "V = |\\mathbf{a} \\cdot (\\mathbf{b} \\times \\mathbf{c})|"
    description: "Volume of the parallelepiped spanned by vectors a, b, c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_016"
    formula_name: "Volume of Tetrahedron"
    latex: "V = \\frac{1}{6}|\\mathbf{a} \\cdot (\\mathbf{b} \\times \\mathbf{c})|"
    description: "Volume of a tetrahedron formed by three vectors a, b, c from one vertex."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_017"
    formula_name: "Cyclic Property of Scalar Triple Product"
    latex: "\\mathbf{a} \\cdot (\\mathbf{b} \\times \\mathbf{c}) = \\mathbf{b} \\cdot (\\mathbf{c} \\times \\mathbf{a}) = \\mathbf{c} \\cdot (\\mathbf{a} \\times \\mathbf{b})"
    description: "Scalar triple product is invariant under cyclic permutation of the vectors."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_018"
    formula_name: "Scalar Triple Product (Two Equal Vectors)"
    latex: "\\mathbf{a} \\cdot (\\mathbf{a} \\times \\mathbf{b}) = 0"
    description: "Scalar triple product is zero if any two vectors are equal (or parallel)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_019"
    formula_name: "Vector Triple Product"
    latex: "\\mathbf{a} \\times (\\mathbf{b} \\times \\mathbf{c}) = (\\mathbf{a} \\cdot \\mathbf{c})\\mathbf{b} - (\\mathbf{a} \\cdot \\mathbf{b})\\mathbf{c}"
    description: "Vector triple product: cross product of a with the cross product of b and c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_020"
    formula_name: "Vector Triple Product (Alternative)"
    latex: "(\\mathbf{a} \\times \\mathbf{b}) \\times \\mathbf{c} = (\\mathbf{a} \\cdot \\mathbf{c})\\mathbf{b} - (\\mathbf{b} \\cdot \\mathbf{c})\\mathbf{a}"
    description: "Alternative form of the vector triple product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_021"
    formula_name: "BAC-CAB Identity"
    latex: "\\mathbf{a} \\times (\\mathbf{b} \\times \\mathbf{c}) = (\\mathbf{a} \\cdot \\mathbf{c})\\mathbf{b} - (\\mathbf{a} \\cdot \\mathbf{b})\\mathbf{c}"
    description: "The BAC-CAB identity for vector triple product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_022"
    formula_name: "Direction Cosines as Vector Components"
    latex: "\\mathbf{\\hat{u}} = l\\mathbf{i} + m\\mathbf{j} + n\\mathbf{k}"
    description: "Unit vector in terms of direction cosines l, m, n."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_023"
    formula_name: "Direction Cosines from Vector"
    latex: "l = \\cos\\alpha = \\frac{a}{|\\mathbf{a}|}, \\quad m = \\cos\\beta = \\frac{b}{|\\mathbf{a}|}, \\quad n = \\cos\\gamma = \\frac{c}{|\\mathbf{a}|}"
    description: "Direction cosines of a vector with components a, b, c and magnitude |a|."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_024"
    formula_name: "Angle Between Vectors via Dot Product"
    latex: "\\cos\\theta = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{|\\mathbf{a}||\\mathbf{b}|}"
    description: "Cosine of the angle between vectors a and b expressed using the dot product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_025"
    formula_name: "Orthogonality Condition"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = 0"
    description: "Vectors a and b are orthogonal (perpendicular) if their dot product is zero."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_026"
    formula_name: "Collinearity Condition (Vectors)"
    latex: "\\mathbf{a} \\times \\mathbf{b} = \\mathbf{0}"
    description: "Vectors a and b are collinear (parallel) if their cross product is the zero vector."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_027"
    formula_name: "Coplanarity of Three Vectors"
    latex: "[\\mathbf{a} \\quad \\mathbf{b} \\quad \\mathbf{c}] = 0"
    description: "Three vectors a, b, c are coplanar if their scalar triple product is zero."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_028"
    formula_name: "Dot Product Distributivity"
    latex: "\\mathbf{a} \\cdot (\\mathbf{b} + \\mathbf{c}) = \\mathbf{a} \\cdot \\mathbf{b} + \\mathbf{a} \\cdot \\mathbf{c}"
    description: "Dot product distributes over vector addition."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_029"
    formula_name: "Cross Product Anticommutativity"
    latex: "\\mathbf{a} \\times \\mathbf{b} = -\\mathbf{b} \\times \\mathbf{a}"
    description: "Cross product is anticommutative: reversing the order negates the result."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_030"
    formula_name: "Cross Product Distributivity"
    latex: "\\mathbf{a} \\times (\\mathbf{b} + \\mathbf{c}) = \\mathbf{a} \\times \\mathbf{b} + \\mathbf{a} \\times \\mathbf{c}"
    description: "Cross product distributes over vector addition."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_031"
    formula_name: "Cross Product of Parallel Vectors"
    latex: "\\mathbf{a} \\times \\mathbf{b} = \\mathbf{0} \\quad \\text{if} \\quad \\mathbf{a} \\parallel \\mathbf{b}"
    description: "Cross product of two parallel (or anti-parallel) vectors is the zero vector."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_032"
    formula_name: "Magnitude of Cross Product"
    latex: "|\\mathbf{a} \\times \\mathbf{b}|^2 = |\\mathbf{a}|^2|\\mathbf{b}|^2 - (\\mathbf{a} \\cdot \\mathbf{b})^2"
    description: "Square of the magnitude of cross product in terms of dot product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_033"
    formula_name: "Dot Product via Components"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = a_xb_x + a_yb_y + a_zb_z"
    description: "Dot product of 3D vectors using their Cartesian components."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_034"
    formula_name: "Area of Parallelogram (Cross Product)"
    latex: "|\\mathbf{a} \\times \\mathbf{b}| = |\\mathbf{a}||\\mathbf{b}|\\sin\\theta"
    description: "Area of parallelogram spanned by vectors a and b equals magnitude of their cross product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_035"
    formula_name: "Triple Product Expansion"
    latex: "\\mathbf{a} \\times (\\mathbf{b} \\times \\mathbf{c}) = (\\mathbf{a} \\cdot \\mathbf{c})\\mathbf{b} - (\\mathbf{a} \\cdot \\mathbf{b})\\mathbf{c}"
    description: "Expansion of the vector triple product (BAC-CAB rule)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_036"
    formula_name: "Lagrange's Identity"
    latex: "(\\mathbf{a} \\cdot \\mathbf{b})^2 + |\\mathbf{a} \\times \\mathbf{b}|^2 = |\\mathbf{a}|^2|\\mathbf{b}|^2"
    description: "Lagrange's identity relating dot and cross products to the product of magnitudes."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_037"
    formula_name: "Cross Product in 2D"
    latex: "\\mathbf{a} \\times \\mathbf{b} = a_xb_y - a_yb_x"
    description: "Z-component of cross product of two 2D vectors (a scalar representing signed area)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_038"
    formula_name: "Distance Between Two Points (Vectors)"
    latex: "|\\mathbf{b} - \\mathbf{a}| = \\sqrt{(\\mathbf{b} - \\mathbf{a}) \\cdot (\\mathbf{b} - \\mathbf{a})}"
    description: "Distance between two points given as position vectors a and b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_039"
    formula_name: "Midpoint via Position Vectors"
    latex: "\\mathbf{m} = \\frac{\\mathbf{a} + \\mathbf{b}}{2}"
    description: "Position vector of the midpoint of the segment joining points with position vectors a and b."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_040"
    formula_name: "Section Formula (Vectors)"
    latex: "\\mathbf{r} = \\frac{m\\mathbf{b} + n\\mathbf{a}}{m+n}"
    description: "Position vector of a point dividing the segment joining position vectors a and b in ratio m:n internally."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_041"
    formula_name: "Area of Equilateral Triangle"
    latex: "A = \\frac{\\sqrt{3}}{4}a^2"
    description: "Area of an equilateral triangle with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_042"
    formula_name: "Height of Equilateral Triangle"
    latex: "h = \\frac{\\sqrt{3}}{2}a"
    description: "Altitude of an equilateral triangle with side length a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_043"
    formula_name: "Area of Isosceles Triangle"
    latex: "A = \\frac{1}{4}a\\sqrt{4b^2 - a^2}"
    description: "Area of an isosceles triangle with equal sides b and base a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_066"
    formula_name: "Periodicity of Sine"
    latex: "\\sin(\\theta + 2n\\pi) = \\sin\\theta"
    description: "Sine function has period 2*pi."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_067"
    formula_name: "Periodicity of Cosine"
    latex: "\\cos(\\theta + 2n\\pi) = \\cos\\theta"
    description: "Cosine function has period 2*pi."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_068"
    formula_name: "Periodicity of Tangent"
    latex: "\\tan(\\theta + n\\pi) = \\tan\\theta"
    description: "Tangent function has period pi."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_069"
    formula_name: "Sum of Angles Inverse Tangent"
    latex: "\\tan^{-1}x + \\tan^{-1}y = \\tan^{-1}\\frac{x+y}{1-xy}"
    description: "Sum formula for inverse tangent when xy < 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_070"
    formula_name: "Inverse Tangent Difference with Pi"
    latex: "\\tan^{-1}x + \\tan^{-1}y = \\pi + \\tan^{-1}\\frac{x+y}{1-xy}"
    description: "Sum formula for inverse tangent when x > 0, y > 0, and xy > 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_071"
    formula_name: "3n Theta Triple Tangent"
    latex: "\\tan(3\\theta) = \\frac{3\\tan\\theta - \\tan^3\\theta}{1 - 3\\tan^2\\theta}"
    description: "Triple angle formula for tangent."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_072"
    formula_name: "Sum of Inverse Sines"
    latex: "\\sin^{-1}x + \\sin^{-1}y = \\sin^{-1}\\left(x\\sqrt{1-y^2} + y\\sqrt{1-x^2}\\right)"
    description: "Sum of two inverse sines for xy < sqrt((1-x^2)(1-y^2))."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_073"
    formula_name: "Sum of Inverse Cosines"
    latex: "\\cos^{-1}x + \\cos^{-1}y = \\cos^{-1}\\left(xy - \\sqrt{(1-x^2)(1-y^2)}\\right)"
    description: "Sum of two inverse cosines for x + y >= 0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_061"
    formula_name: "Equation of Circle"
    latex: "(x-h)^2 + (y-k)^2 = r^2"
    description: "Standard equation of a circle with center (h, k) and radius r."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_062"
    formula_name: "General Equation of Circle"
    latex: "x^2 + y^2 + 2gx + 2fy + c = 0"
    description: "General equation of a circle with center (-g, -f) and radius sqrt(g^2+f^2-c)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_063"
    formula_name: "Condition for Circle"
    latex: "g^2 + f^2 - c > 0"
    description: "Condition on the coefficients of the general circle equation for a real circle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_064"
    formula_name: "Two Circles Orthogonal"
    latex: "2(g_1g_2 + f_1f_2) = c_1 + c_2"
    description: "Condition for two circles to cut each other orthogonally."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_065"
    formula_name: "Equation of Pair of Straight Lines Through Origin"
    latex: "ax^2 + 2hxy + by^2 = 0"
    description: "Combined equation of a pair of straight lines passing through the origin."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_031"
    formula_name: "Angle Between Diagonals of a Rectangular Parallelepiped"
    latex: "\\cos\\theta = \\frac{a^2+b^2-c^2}{\\sqrt{(a^2+b^2+c^2)^2 - 4a^2c^2}}"
    description: "Cosine of angle between two diagonals of a rectangular parallelepiped with edges a, b, c."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_032"
    formula_name: "Angle Between Body Diagonals of a Cube"
    latex: "\\cos\\theta = \\frac{1}{3}"
    description: "Cosine of angle between two body diagonals of a cube."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_041"
    formula_name: "Unit Vector"
    latex: "\\mathbf{\\hat{a}} = \\frac{\\mathbf{a}}{|\\mathbf{a}|}"
    description: "Unit vector in the direction of vector a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_042"
    formula_name: "Position Vector of a Point"
    latex: "\\mathbf{r} = x\\mathbf{i} + y\\mathbf{j} + z\\mathbf{k}"
    description: "Position vector of point (x, y, z) from the origin."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_043"
    formula_name: "Vector Addition"
    latex: "\\mathbf{a} + \\mathbf{b} = (a_x+b_x)\\mathbf{i} + (a_y+b_y)\\mathbf{j} + (a_z+b_z)\\mathbf{k}"
    description: "Sum of two vectors using component-wise addition."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_044"
    formula_name: "Scalar Multiplication of Vector"
    latex: "k\\mathbf{a} = ka_x\\mathbf{i} + ka_y\\mathbf{j} + ka_z\\mathbf{k}"
    description: "Multiplication of a vector by a scalar k."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_045"
    formula_name: "Section Formula (Position Vector)"
    latex: "\\mathbf{r} = \\frac{m\\mathbf{b} + n\\mathbf{a}}{m+n}"
    description: "Position vector of point dividing the segment joining points with position vectors a and b in the ratio m:n."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_046"
    formula_name: "Scalar Product (Angle Form)"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = |\\mathbf{a}||\\mathbf{b}|\\cos\\theta"
    description: "Dot product expressed using magnitudes and the included angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_047"
    formula_name: "Cross Product (Angle Form)"
    latex: "|\\mathbf{a} \\times \\mathbf{b}| = |\\mathbf{a}||\\mathbf{b}|\\sin\\theta"
    description: "Magnitude of cross product expressed using magnitudes and sine of the included angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_048"
    formula_name: "Vector Triple Product (cyclic)"
    latex: "\\mathbf{a} \\times (\\mathbf{b} \\times \\mathbf{c}) = (\\mathbf{a} \\cdot \\mathbf{c})\\mathbf{b} - (\\mathbf{a} \\cdot \\mathbf{b})\\mathbf{c}"
    description: "Expansion of a x (b x c) using the BAC-CAB identity."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_044"
    formula_name: "Exterior Angle of Cyclic Quadrilateral"
    latex: "\\text{Ext. } \\angle A = \\text{Int. } \\angle C"
    description: "Exterior angle of a cyclic quadrilateral equals the interior opposite angle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_045"
    formula_name: "Ptolemy's Theorem (cyclic quadrilateral)"
    latex: "ac + bd = ef"
    description: "For a cyclic quadrilateral with sides a, b, c, d and diagonals e, f: product of diagonals equals sum of products of opposite sides."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_046"
    formula_name: "Area of Sector (degrees)"
    latex: "A = \\frac{\\theta}{360}\\pi r^2"
    description: "Area of a circular sector with central angle theta (in degrees) and radius r."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_047"
    formula_name: "Arc Length (degrees)"
    latex: "L = \\frac{\\theta}{360} \\times 2\\pi r"
    description: "Length of an arc with central angle theta (in degrees) in a circle of radius r."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_048"
    formula_name: "Sum of Angles in Triangle"
    latex: "A + B + C = \\pi"
    description: "Sum of interior angles of any triangle equals pi radians (180 degrees)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_049"
    formula_name: "Exterior Angle of Triangle"
    latex: "\\text{Ext. } \\angle = A + B"
    description: "Exterior angle of a triangle equals the sum of the two opposite interior angles."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_050"
    formula_name: "Median Concurrency"
    latex: "G = \\frac{A+B+C}{3}"
    description: "Centroid divides each median in ratio 2:1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_074"
    formula_name: "Componendo and Dividendo"
    latex: "\\frac{a}{b} = \\frac{c}{d} \\implies \\frac{a+b}{a-b} = \\frac{c+d}{c-d}"
    description: "Rule of componendo and dividendo for proportional quantities."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_075"
    formula_name: "Trigonometric Identity - tanA + tanB + tanC"
    latex: "\\tan A + \\tan B + \\tan C = \\tan A \\tan B \\tan C"
    description: "Sum of tangents of angles of a triangle equals their product."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_076"
    formula_name: "Trigonometric Identity - cotA * cotB + cotB * cotC + cotC * cotA"
    latex: "\\cot A\\cot B + \\cot B\\cot C + \\cot C\\cot A = 1"
    description: "Sum of products of cotangents of angles of a triangle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_077"
    formula_name: "sinA + sinB + sinC"
    latex: "\\sin A + \\sin B + \\sin C = 4\\cos\\frac{A}{2}\\cos\\frac{B}{2}\\cos\\frac{C}{2}"
    description: "Sum of sines of angles of a triangle expressed as a product of half-angle cosines."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_078"
    formula_name: "cosA + cosB + cosC"
    latex: "\\cos A + \\cos B + \\cos C = 1 + \\frac{r}{R}"
    description: "Sum of cosines of angles of a triangle in terms of inradius and circumradius."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_066"
    formula_name: "Area of Polygon (Shoelace Formula)"
    latex: "A = \\frac{1}{2}\\left|\\sum_{i=1}^{n}(x_iy_{i+1} - x_{i+1}y_i)\\right|"
    description: "Area of a polygon with vertices (x1,y1), (x2,y2), ... using the shoelace formula."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_067"
    formula_name: "Condition for Concurrency of Three Lines"
    latex: "\\begin{vmatrix} a_1 & b_1 & c_1 \\ a_2 & b_2 & c_2 \\ a_3 & b_3 & c_3 \\end{vmatrix} = 0"
    description: "Three lines are concurrent if this determinant is zero."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_068"
    formula_name: "Point of Intersection of Two Lines"
    latex: "x = \\frac{b_1c_2 - b_2c_1}{a_1b_2 - a_2b_1}, \\quad y = \\frac{c_1a_2 - c_2a_1}{a_1b_2 - a_2b_1}"
    description: "Coordinates of the intersection of two lines in general form."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_033"
    formula_name: "Direction Ratios from Direction Cosines"
    latex: "a = kl, \\quad b = km, \\quad c = kn"
    description: "Direction ratios are proportional to direction cosines with some constant k."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_034"
    formula_name: "Line Parallel to Given Line"
    latex: "\\frac{x-x_1}{a} = \\frac{y-y_1}{b} = \\frac{z-z_1}{c}"
    description: "Cartesian equation of line through (x1,y1,z1) parallel to line with direction ratios (a,b,c)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_035"
    formula_name: "Plane Perpendicular to Line at Origin"
    latex: "lx + my + nz = 0"
    description: "Equation of plane through origin perpendicular to line with direction cosines (l,m,n)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_049"
    formula_name: "Dot Product of Unit Vectors"
    latex: "\\mathbf{\\hat{a}} \\cdot \\mathbf{\\hat{b}} = \\cos\\theta"
    description: "Dot product of two unit vectors equals the cosine of the angle between them."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_050"
    formula_name: "Cross Product of Unit Vectors"
    latex: "\\mathbf{\\hat{a}} \\times \\mathbf{\\hat{b}} = \\sin\\theta\\mathbf{\\hat{n}}"
    description: "Cross product of two unit vectors equals sine of the angle times the unit normal vector."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_051"
    formula_name: "Projection Length Formula"
    latex: "|\\text{proj}_{\\mathbf{b}}\\mathbf{a}| = |\\mathbf{a}|\\cos\\theta"
    description: "Magnitude of the projection of a onto b equals |a| times cosine of the angle between them."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_051"
    formula_name: "Perpendicular from Circumcenter to Side"
    latex: "d = R\\cos A"
    description: "Distance from circumcenter to side BC equals R cos A, where R is circumradius."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_052"
    formula_name: "Area of Triangle via Inradius"
    latex: "A = rs"
    description: "Area of a triangle as the product of inradius r and semi-perimeter s."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_053"
    formula_name: "Area of Triangle via Circumradius"
    latex: "A = \\frac{abc}{4R}"
    description: "Area of a triangle expressed using its three sides and circumradius R."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_054"
    formula_name: "Orthocenter Reflection Property"
    latex: "H_A = 2O - A"
    description: "Reflection of orthocenter H about side BC lies on the circumcircle."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_GEO_055"
    formula_name: "Area via Medians"
    latex: "A = \\frac{4}{3}\\sqrt{s_m(s_m-m_a)(s_m-m_b)(s_m-m_c)}"
    description: "Area of a triangle expressed using the lengths of its three medians."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_079"
    formula_name: "De Moivre's Theorem"
    latex: "(\\cos\\theta + i\\sin\\theta)^n = \\cos(n\\theta) + i\\sin(n\\theta)"
    description: "Raising a complex number in trigonometric form to the power n using De Moivre's theorem."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_080"
    formula_name: "Euler's Formula"
    latex: "e^{i\\theta} = \\cos\\theta + i\\sin\\theta"
    description: "Euler's formula connecting exponential, trigonometric, and imaginary functions."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_081"
    formula_name: "cis Form"
    latex: "\\text{cis}\\theta = \\cos\\theta + i\\sin\\theta"
    description: "Compact notation for cosine plus i times sine."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_082"
    formula_name: "sin A in Terms of tan(A/2)"
    latex: "\\sin A = \\frac{2\\tan\\frac{A}{2}}{1 + \\tan^2\\frac{A}{2}}"
    description: "Sine of angle A expressed using tan(A/2) (Weierstrass substitution)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_083"
    formula_name: "cos A in Terms of tan(A/2)"
    latex: "\\cos A = \\frac{1 - \\tan^2\\frac{A}{2}}{1 + \\tan^2\\frac{A}{2}}"
    description: "Cosine of angle A expressed using tan(A/2) (Weierstrass substitution)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_084"
    formula_name: "tan A in Terms of tan(A/2)"
    latex: "\\tan A = \\frac{2\\tan\\frac{A}{2}}{1 - \\tan^2\\frac{A}{2}}"
    description: "Tangent of angle A expressed using tan(A/2) (Weierstrass substitution)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_069"
    formula_name: "Locus Definition of Parabola"
    latex: "PF = PM"
    description: "Parabola is the locus of points equidistant from focus F and directrix M."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_070"
    formula_name: "Locus Definition of Ellipse"
    latex: "PF_1 + PF_2 = 2a"
    description: "Ellipse is the locus of points where the sum of distances from two foci equals 2a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_071"
    formula_name: "Locus Definition of Hyperbola"
    latex: "|PF_1 - PF_2| = 2a"
    description: "Hyperbola is the locus of points where the absolute difference of distances from two foci equals 2a."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_072"
    formula_name: "Equation of Directrix of Ellipse"
    latex: "x = \\pm\\frac{a}{e}"
    description: "Equation of the directrix of an ellipse with semi-major axis a and eccentricity e."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_073"
    formula_name: "Equation of Directrix of Hyperbola"
    latex: "x = \\pm\\frac{a}{e}"
    description: "Equation of the directrix of a hyperbola with semi-transverse axis a and eccentricity e."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_074"
    formula_name: "Vertex of Ellipse"
    latex: "(\\pm a, 0)"
    description: "Vertices of ellipse x^2/a^2 + y^2/b^2 = 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_075"
    formula_name: "Vertex of Hyperbola"
    latex: "(\\pm a, 0)"
    description: "Vertices of hyperbola x^2/a^2 - y^2/b^2 = 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_076"
    formula_name: "Foci of Ellipse"
    latex: "(\\pm c, 0) \\quad \\text{where } c = ae"
    description: "Foci of the ellipse x^2/a^2 + y^2/b^2 = 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_077"
    formula_name: "Foci of Hyperbola"
    latex: "(\\pm c, 0) \\quad \\text{where } c = ae"
    description: "Foci of the hyperbola x^2/a^2 - y^2/b^2 = 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_078"
    formula_name: "Conjugate Axis of Hyperbola"
    latex: "x = 0, \\quad -b \\leq y \\leq b"
    description: "Conjugate axis of hyperbola x^2/a^2 - y^2/b^2 = 1."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_079"
    formula_name: "Eccentricity Range - Ellipse"
    latex: "0 < e < 1"
    description: "Eccentricity range for an ellipse."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_COORD_080"
    formula_name: "Eccentricity Range - Hyperbola"
    latex: "e > 1"
    description: "Eccentricity range for a hyperbola."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_036"
    formula_name: "Condition for Coplanar Vectors"
    latex: "[\\mathbf{a} \\quad \\mathbf{b} \\quad \\mathbf{c}] = 0"
    description: "Three vectors a, b, c are coplanar if their scalar triple product is zero."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_037"
    formula_name: "Angle Between Line and Plane"
    latex: "\\sin\\phi = \\frac{|al + bm + cn|}{\\sqrt{a^2+b^2+c^2}}"
    description: "Sine of the angle between a line with direction ratios (l,m,n) and a plane ax+by+cz+d=0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_038"
    formula_name: "Equation of Plane Through a Point and Parallel to Given Plane"
    latex: "a(x-x_1) + b(y-y_1) + c(z-z_1) = 0"
    description: "Equation of plane through (x1,y1,z1) and parallel to plane ax+by+cz+d=0."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_039"
    formula_name: "Equation of Plane Containing a Line and a Point"
    latex: "\\begin{vmatrix} x-x_1 & y-y_1 & z-z_1 \\ l & m & n \\ x_2-x_1 & y_2-y_1 & z_2-z_1 \\end{vmatrix} = 0"
    description: "Equation of plane containing the line through (x1,y1,z1) with direction ratios (l,m,n) and the point (x2,y2,z2)."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_3D_040"
    formula_name: "Skew Lines Condition"
    latex: "\\mathbf{a} \\times \\mathbf{b} \\neq \\mathbf{0} \\quad \\text{and} \\quad \\text{distance} > 0"
    description: "Two lines are skew if they are not parallel and do not intersect."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_052"
    formula_name: "Cross Product Self"
    latex: "\\mathbf{a} \\times \\mathbf{a} = \\mathbf{0}"
    description: "Cross product of a vector with itself is always the zero vector."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_053"
    formula_name: "Dot Product Commutativity"
    latex: "\\mathbf{a} \\cdot \\mathbf{b} = \\mathbf{b} \\cdot \\mathbf{a}"
    description: "Dot product is commutative."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_054"
    formula_name: "Cross Product of Standard Unit Vectors"
    latex: "\\mathbf{i} \\times \\mathbf{j} = \\mathbf{k}, \\quad \\mathbf{j} \\times \\mathbf{k} = \\mathbf{i}, \\quad \\mathbf{k} \\times \\mathbf{i} = \\mathbf{j}"
    description: "Cyclic cross products of standard 3D unit vectors."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_055"
    formula_name: "Dot Product of Standard Unit Vectors"
    latex: "\\mathbf{i} \\cdot \\mathbf{i} = 1, \\quad \\mathbf{i} \\cdot \\mathbf{j} = 0, \\quad \\mathbf{i} \\cdot \\mathbf{k} = 0"
    description: "Dot products of standard 3D unit vectors."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_056"
    formula_name: "Cross Product Anticommutativity (Standard)"
    latex: "\\mathbf{j} \\times \\mathbf{i} = -\\mathbf{k}, \\quad \\mathbf{k} \\times \\mathbf{j} = -\\mathbf{i}, \\quad \\mathbf{i} \\times \\mathbf{k} = -\\mathbf{j}"
    description: "Anticommutative cross products of standard 3D unit vectors."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_VEC_057"
    formula_name: "Identity for Cross Product of Cross Products"
    latex: "(\\mathbf{a} \\times \\mathbf{b}) \\times (\\mathbf{c} \\times \\mathbf{d}) = (\\mathbf{a} \\cdot \\mathbf{b} \\times \\mathbf{d})\\mathbf{c} - (\\mathbf{a} \\cdot \\mathbf{b} \\times \\mathbf{c})\\mathbf{d}"
    description: "Identity for the cross product of two cross products."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_085"
    formula_name: "Sum of Inverse Cotangents"
    latex: "\\cot^{-1}x + \\cot^{-1}y = \\cot^{-1}\\frac{xy-1}{x+y}"
    description: "Sum of two inverse cotangents."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_086"
    formula_name: "Inverse Sine of Inverse Sine"
    latex: "\\sin^{-1}(\\sin\\theta) = \\theta"
    description: "Inverse sine of sine equals the angle, within the principal range."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_087"
    formula_name: "Inverse Cosine of Inverse Cosine"
    latex: "\\cos^{-1}(\\cos\\theta) = \\theta"
    description: "Inverse cosine of cosine equals the angle, within the principal range."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_088"
    formula_name: "Inverse Tangent of Inverse Tangent"
    latex: "\\tan^{-1}(\\tan\\theta) = \\theta"
