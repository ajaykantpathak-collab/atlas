    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_052"
    formula_name: "Inverse Tangent - Cotangent Relationship"
    latex: "\\tan^{-1}x + \\cot^{-1}x = \\frac{\\pi}{2}"
    description: "Inverse tangent and inverse cotangent of the same value are complementary."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_053"
    formula_name: "Inverse Cosecant - Secant Relationship"
    latex: "\\csc^{-1}x + \\sec^{-1}x = \\frac{\\pi}{2}"
    description: "Inverse cosecant and inverse secant of the same value are complementary."
    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_054"
    formula_name: "Double Angle Inverse Sine"
    latex: "\\sin^{-1}(2x\\sqrt{1-x^2}) = 2\\sin^{-1}x"
