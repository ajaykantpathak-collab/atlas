    dimensional_formula: ""
  - formula_id: "MATH_TRIG_062"
    formula_name: "Trigonometric Ratios in Right Triangle"
    latex: "\\sin\\theta = \\frac{\\text{opposite}}{\\text{hypotenuse}}"
