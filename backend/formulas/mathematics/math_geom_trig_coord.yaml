    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_058"
    formula_name: "Law of Cosines (Solving Triangles)"
    latex: "\\cos A = \\frac{b^2 + c^2 - a^2}{2bc}"
