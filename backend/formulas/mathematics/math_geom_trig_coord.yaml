    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_057"
    formula_name: "Law of Sines (Solving Triangles)"
    latex: "\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C}"
