    unit: ""
    dimensional_formula: ""
  - formula_id: "MATH_TRIG_056"
    formula_name: "Double Angle Inverse Tangent"
    latex: "\\tan^{-1}\\left(\\frac{2x}{1-x^2}\\right) = 2\\tan^{-1}x"
