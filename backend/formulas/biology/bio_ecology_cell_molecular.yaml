  variables:
    k_inact: "Net inactivation rate"
    k_2: "Rate of EI formation"
    k_3: "Rate of EI* formation"
  description: "Maximum inactivation rate for mechanism-based inhibitor"

- formula_id: "BIO_EK_108"
  subdomain: "EK"
  name: "Michaelis-Menten at Low [S]"
