    V_max: "Forward Vmax"
    V_max_prime: "Reverse Vmax"
    S: "Substrate concentration"
    P: "Product concentration"
    K_eq: "Equilibrium constant"
    K_m: "Forward Michaelis constant"
    K_m_prime: "Reverse Michaelis constant"
  description: "Futile substrate cycling rate"

- formula_id: "BIO_EK_105"
  subdomain: "EK"
  name: "Allosteric Inhibition - MWC"
