  variables:
    y-intercept: "Y-intercept of Lineweaver-Burk plot"
    V_max: "Maximum velocity"
  description: "Y-intercept equals 1/Vmax"

- formula_id: "BIO_EK_112"
  subdomain: "EK"
  name: "Hanes-Woolf Intercept"
  formula: "y-intercept = \\frac{K_m}{V_{max}}"
  variables:
    y-intercept: "Y-intercept of Hanes-Woolf plot"
    K_m: "Michaelis constant"
    V_max: "Maximum velocity"
  description: "Y-intercept equals Km/Vmax"

- formula_id: "BIO_EK_113"
  subdomain: "EK"
  name: "Hill Coefficient - Sigmoidal"
  formula: "n_H > 1"
  variables:
    n_H: "Hill coefficient"
  description: "Positive cooperativity when n_H > 1"

- formula_id: "BIO_EK_114"
  subdomain: "EK"
  name: "Hill Coefficient - No Cooperativity"
  formula: "n_H = 1"
  variables:
    n_H: "Hill coefficient"
  description: "Non-cooperative binding when n_H = 1"

- formula_id: "BIO_EK_115"
  subdomain: "EK"
  name: "Hill Coefficient - Negative Cooperativity"
  formula: "n_H < 1"
  variables:
    n_H: "Hill coefficient"
  description: "Negative cooperativity when n_H < 1"

- formula_id: "BIO_EK_116"
  subdomain: "EK"
  name: "Hill Plot Slope at Half Saturation"
  formula: "\\frac{d\\log(Y/(1-Y))}{d\\log[S]}\\bigg|_{Y=0.5} = n_H"
  variables:
