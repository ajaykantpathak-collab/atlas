  variables:
    k_cat: "Catalyzed rate constant"
    k_uncat: "Uncatalyzed rate constant"
  description: "Rate enhancement provided by enzyme catalysis"

- formula_id: "BIO_EK_057"
  subdomain: "EK"
  name: "Diffusion-Limited Rate"
  formula: "k_{diff} = \\frac{8RT}{3\\eta}"
  variables:
    k_diff: "Diffusion-controlled rate constant"
    R: "Gas constant"
    T: "Temperature"
    eta: "Viscosity"
  description: "Maximum possible rate constant for bimolecular reaction"

- formula_id: "BIO_EK_058"
  subdomain: "EK"
  name: "Cryoscopic Enzyme Activity"
  formula: "k = k_0 e^{-\\Delta E_a/RT}"
  variables:
    k: "Rate at temperature T"
    k_0: "Pre-exponential factor"
    deltaE_a: "Activation energy"
    R: "Gas constant"
    T: "Temperature"
  description: "Temperature dependence of enzyme reaction rate"

- formula_id: "BIO_EK_059"
  subdomain: "EK"
  name: "Enzyme Thermolability"
  formula: "\\ln(k_{obs}) = \\ln(A) - \\frac{E_a}{RT}"
  variables:
    k_obs: "Observed rate constant"
    A: "Pre-exponential factor"
    E_a: "Activation energy"
    R: "Gas constant"
    T: "Temperature"
  description: "Arrhenius plot for enzyme inactivation"

- formula_id: "BIO_EK_060"
  subdomain: "EK"
  name: "Zymogen Activation"
  formula: "E_{active} = \\frac{E_{total} [A]}{K_a + [A]}"
  variables:
    E_active: "Active enzyme concentration"
    E_total: "Total zymogen concentration"
    A: "Activator concentration"
    K_a: "Activation constant"
  description: "Activation of zymogen by proteolytic cleavage"

- formula_id: "BIO_EK_061"
  subdomain: "EK"
  name: "Cooperative Binding - Adair Equation"
  formula: "Y = \\frac{\\sum_{i=1}^{n} i \\beta_i [L]^i}{n(1 + \\sum_{i=1}^{n} \\beta_i [L]^i)}"
  variables:
    Y: "Fractional saturation"
    n: "Number of binding sites"
    beta_i: "Adair binding constants"
    L: "Ligand concentration"
  description: "General binding polynomial for n sites"

- formula_id: "BIO_EK_062"
  subdomain: "EK"
  name: "Koshland Sequential Model Rate"
  formula: "v = \\frac{V_{max} [S]^n}{K_{0.5}^n + [S]^n}"
  variables:
    v: "Velocity"
    V_max: "Maximum velocity"
    S: "Substrate concentration"
    n: "Hill coefficient"
    K_0.5: "Substrate concentration at half V_max"
  description: "Sequential allosteric model"

- formula_id: "BIO_EK_063"
  subdomain: "EK"
  name: "Allosteric Effector Effect"
  formula: "K_{0.5}^{effector} = K_{0.5} \\left(1 + \\frac{[effector]}{K_{effector}}\\right)"
  variables:
    K_0.5_effector: "Half-saturation constant in presence of effector"
    K_0.5: "Half-saturation constant"
    effector: "Allosteric effector concentration"
    K_effector: "Effector dissociation constant"
  description: "Shift in K_0.5 due to allosteric effector"

- formula_id: "BIO_EK_064"
  subdomain: "EK"
  name: "Enzyme Inhibition - Mixed"
  formula: "K_m^{app} = \\frac{K_m(1 + [I]/K_i)}{1 + [I]/(\\alpha K_i)}"
  variables:
    K_m_app: "Apparent Michaelis constant"
    K_m: "Michaelis constant"
    I: "Inhibitor concentration"
    K_i: "Inhibition constant"
    alpha: "Alpha factor"
  description: "Apparent Km in mixed inhibition"

- formula_id: "BIO_EK_065"
  subdomain: "EK"
  name: "Enzyme Inhibition - Vmax Mixed"
  formula: "V_{max}^{app} = \\frac{V_{max}}{1 + [I]/(\\alpha K_i)}"
  variables:
    V_max_app: "Apparent Vmax"
    V_max: "Maximum velocity"
    I: "Inhibitor concentration"
    K_i: "Inhibition constant"
    alpha: "Alpha factor"
  description: "Apparent Vmax in mixed inhibition"

- formula_id: "BIO_EK_066"
  subdomain: "EK"
  name: "Covalent Enzyme Inhibition"
  formula: "[E]_{active} = [E]_{total} e^{-k_{inact}[I]t}"
  variables:
    E_active: "Active enzyme remaining"
    E_total: "Total enzyme"
    k_inact: "Inactivation rate constant"
    I: "Inhibitor concentration"
    t: "Time"
  description: "Time-dependent covalent inhibition"

- formula_id: "BIO_EK_067"
  subdomain: "EK"
  name: "Time-Dependent Inhibition"
  formula: "k_{obs} = \\frac{k_{inact}[I]}{K_I + [I]}"
  variables:
    k_obs: "Observed inactivation rate"
    k_inact: "Max inactivation rate"
    I: "Inhibitor concentration"
    K_I: "Inhibitor dissociation constant"
  description: "Observed rate for mechanism-based inhibition"

- formula_id: "BIO_EK_068"
  subdomain: "EK"
  name: "Progress Curve - Two-Step Inhibition"
  formula: "\\frac{[P]}{V_{max}} = t - \\frac{K_m}{V_{max}}\\ln\\left(\\frac{V_{max}t + K_m + [S]_0}{K_m + [S]_0}\\right)"
  variables:
    P: "Product concentration"
    V_max: "Maximum velocity"
    t: "Time"
    K_m: "Michaelis constant"
    S_0: "Initial substrate concentration"
  description: "Integrated rate law for two-step inhibition"

- formula_id: "BIO_EK_069"
  subdomain: "EK"
  name: "Burst Kinetics"
  formula: "[P]_{burst} = [E]_0 \\times n"
  variables:
    P_burst: "Product in initial burst"
    E_0: "Total enzyme concentration"
    n: "Number of active sites"
  description: "Initial rapid product formation in pre-steady state"

- formula_id: "BIO_EK_070"
  subdomain: "EK"
  name: "Pre-Steady-State Rate"
  formula: "v_{pre} = k_2 [E][S]_0"
  variables:
    v_pre: "Pre-steady-state velocity"
    k_2: "Rate constant for ES to EP"
    E: "Enzyme concentration"
    S_0: "Initial substrate concentration"
  description: "Rate before steady state is established"

- formula_id: "BIO_EK_071"
  subdomain: "EK"
  name: "Steady-State Approximation"
  formula: "\\frac{d[ES]}{dt} = 0 = k_1[E][S] - k_{-1}[ES] - k_2[ES]"
  variables:
    E: "Free enzyme"
    S: "Substrate"
    ES: "Enzyme-substrate complex"
    k_1: "Association rate"
    k_{-1}: "Dissociation rate"
    k_2: "Catalytic rate"
  description: "Steady-state assumption for enzyme kinetics"

- formula_id: "BIO_EK_072"
  subdomain: "EK"
  name: "Rapid Equilibrium Approximation"
  formula: "K_s = \\frac{[E][S]}{[ES]} \\approx K_d"
  variables:
    K_s: "Substrate dissociation constant"
    E: "Free enzyme"
    S: "Substrate"
    ES: "Enzyme-substrate complex"
    K_d: "Dissociation constant"
  description: "Assumption that substrate binding is fast"

- formula_id: "BIO_EK_073"
  subdomain: "EK"
  name: "Reaction Velocity - Briggs-Haldane"
  formula: "v = \\frac{k_{cat} [E]_0 [S]}{K_m + [S]}"
  variables:
    v: "Initial velocity"
    k_cat: "Catalytic rate constant"
    E_0: "Total enzyme"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
  description: "Briggs-Haldane steady-state equation"

- formula_id: "BIO_EK_074"
  subdomain: "EK"
  name: "Substrate Inhibition - High Substrate"
  formula: "v = \\frac{V_{max} [S]}{K_m + [S] + \\frac{[S]^2}{K_{si}}}"
  variables:
    v: "Velocity"
    V_max: "Maximum velocity"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
    K_si: "Substrate inhibition constant"
  description: "Inhibition at very high substrate concentration"

- formula_id: "BIO_EK_075"
  subdomain: "EK"
  name: "Allosteric Activation - MWC Fractional"
  formula: "Y = \\frac{L c [S]}{(1 + c[S])^n + L c [S]^n (1 + [S])^n / (1 + c[S])^n}"
  variables:
    Y: "Fractional saturation"
    L: "Allosteric constant"
    c: "Allosteric constant"
    S: "Substrate concentration"
    n: "Number of sites"
  description: "MWC model for allosteric activation"

- formula_id: "BIO_EK_076"
  subdomain: "EK"
  name: "Enzyme Inhibition - Time-Dependent"
  formula: "k_{obs} = \\frac{k_{inact}[I]}{K_I + [I]}"
  variables:
    k_obs: "Observed inactivation rate"
    k_inact: "Maximum inactivation rate"
    I: "Inhibitor concentration"
    K_I: "Inhibitor dissociation constant"
  description: "Time-dependent inhibition rate"

- formula_id: "BIO_EK_077"
  subdomain: "EK"
  name: "Burst Amplitude"
  formula: "A = [E]_0 \\times n_{burst}"
  variables:
    A: "Burst amplitude"
    E_0: "Total enzyme concentration"
    n_burst: "Active sites releasing product"
  description: "Product released during burst phase"

- formula_id: "BIO_EK_078"
  subdomain: "EK"
  name: "Pre-Steady-State Velocity"
  formula: "v(t) = V_{max} \\left(1 - e^{-k_{obs}t}\\right)"
  variables:
    v: "Velocity at time t"
    V_max: "Maximum velocity"
    k_obs: "Observed rate constant"
    t: "Time"
  description: "Exponential approach to steady state"

- formula_id: "BIO_EK_079"
  subdomain: "EK"
  name: "Steady-State Concentration"
  formula: "[ES]_{ss} = \\frac{[E]_0[S]}{K_m + [S]}"
  variables:
    ES_ss: "Steady-state ES concentration"
    E_0: "Total enzyme"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
  description: "ES complex concentration at steady state"

- formula_id: "BIO_EK_080"
  subdomain: "EK"
  name: "Enzyme Turnover - Burst"
  formula: "k_{cat} = \\frac{A}{[E]_0 \\times t_{burst}}"
  variables:
    k_cat: "Catalytic rate constant"
    A: "Burst amplitude"
    E_0: "Total enzyme concentration"
    t_burst: "Duration of burst phase"
  description: "k_cat from pre-steady-state burst"

- formula_id: "BIO_EK_081"
  subdomain: "EK"
  name: "Enzyme Activation Energy"
  formula: "E_a = -R \\frac{d\\ln k}{d(1/T)}"
  variables:
    E_a: "Activation energy"
    R: "Gas constant"
    k: "Rate constant"
    T: "Temperature"
  description: "Activation energy from Arrhenius slope"

- formula_id: "BIO_EK_082"
  subdomain: "EK"
  name: "Temperature Optimum"
  formula: "T_{opt} = \\frac{E_a}{R \\ln(A/k_{cat})}"
  variables:
    T_opt: "Optimal temperature"
    E_a: "Activation energy"
    R: "Gas constant"
    A: "Pre-exponential factor"
    k_cat: "Catalytic rate constant"
  description: "Temperature at which enzyme is most active"

- formula_id: "BIO_EK_083"
  subdomain: "EK"
  name: "Enzyme Denaturation - Two-State"
  formula: "K_{eq} = \\frac{[U]}{[N]} = e^{-\\Delta G_{unfold}/RT}"
  variables:
    K_eq: "Equilibrium constant for unfolding"
    U: "Unfolded enzyme"
    N: "Native enzyme"
    deltaG_unfold: "Gibbs free energy of unfolding"
    R: "Gas constant"
    T: "Temperature"
  description: "Equilibrium between folded and unfolded enzyme"

- formula_id: "BIO_EK_084"
  subdomain: "EK"
  name: "Protein Stability - Gibbs Free Energy"
  formula: "\\Delta G_{unfold} = \\Delta H_{unfold} - T\\Delta S_{unfold}"
  variables:
    deltaG_unfold: "Gibbs free energy of unfolding"
    deltaH_unfold: "Enthalpy of unfolding"
    T: "Temperature"
    deltaS_unfold: "Entropy of unfolding"
  description: "Thermodynamics of protein unfolding"

- formula_id: "BIO_EK_085"
  subdomain: "EK"
  name: "Enzyme Inhibition - IC50 Competitive"
  formula: "IC_{50} = K_i \\left(1 + \\frac{[S]}{K_m}\\right)"
  variables:
    IC_50: "Half maximal inhibitory concentration"
    K_i: "Inhibition constant"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
  description: "IC50 for competitive inhibitor"

- formula_id: "BIO_EK_086"
  subdomain: "EK"
  name: "Enzyme Inhibition - IC50 Noncompetitive"
  formula: "IC_{50} = K_i"
  variables:
    IC_50: "Half maximal inhibitory concentration"
    K_i: "Inhibition constant"
  description: "IC50 for non-competitive inhibitor"

- formula_id: "BIO_EK_087"
  subdomain: "EK"
  name: "Mixed Inhibition - alpha"
  formula: "\\alpha = \\frac{K_i}{K_i^{\\prime}}"
  variables:
    alpha: "Alpha factor"
    K_i: "Inhibition constant for free enzyme"
    K_i_prime: "Inhibition constant for ES complex"
  description: "Ratio of inhibition constants in mixed inhibition"

- formula_id: "BIO_EK_088"
  subdomain: "EK"
  name: "Haldane Equation - Equilibrium"
  formula: "K_{eq} = \\frac{V_{max,f} V_{max,r}}{K_m K_p}"
  variables:
    K_eq: "Equilibrium constant"
    V_max_f: "Forward maximum velocity"
    V_max_r: "Reverse maximum velocity"
    K_m: "Michaelis constant for substrate"
    K_p: "Michaelis constant for product"
  description: "Haldane relationship for reversible reactions"

- formula_id: "BIO_EK_089"
  subdomain: "EK"
  name: "Enzyme Catalysis - Delta G"
  formula: "\\Delta G^{\\ddagger} = -RT \\ln\\left(\\frac{k_B T}{h k_{cat}}\\right)"
  variables:
    deltaG_dd: "Activation free energy"
    R: "Gas constant"
    T: "Temperature"
    k_B: "Boltzmann constant"
    h: "Planck constant"
    k_cat: "Catalytic rate constant"
  description: "Activation free energy from k_cat"

- formula_id: "BIO_EK_090"
  subdomain: "EK"
  name: "Rate Enhancement - Enzyme"
  formula: "\\frac{k_{cat}}{k_{uncat}}"
  variables:
    k_cat: "Catalyzed rate constant"
    k_uncat: "Uncatalyzed rate constant"
  description: "Factor by which enzyme accelerates reaction"

- formula_id: "BIO_EK_091"
  subdomain: "EK"
  name: "Briggs-Haldane - Steady-State"
  formula: "\\frac{d[ES]}{dt} = k_1[E][S] - (k_{-1} + k_2)[ES] = 0"
  variables:
    E: "Free enzyme concentration"
    S: "Substrate concentration"
    ES: "Enzyme-substrate complex"
    k_1: "Association rate"
    k_{-1}: "Dissociation rate"
    k_2: "Catalytic rate"
  description: "Steady-state assumption for Briggs-Haldane"

- formula_id: "BIO_EK_092"
  subdomain: "EK"
  name: "Diffusion-Controlled Limit"
  formula: "k_{diff} = \\frac{8RT}{3\\eta}"
  variables:
    k_diff: "Diffusion-controlled rate constant"
    R: "Gas constant"
    T: "Temperature"
    eta: "Viscosity"
  description: "Maximum possible rate constant"

- formula_id: "BIO_EK_093"
  subdomain: "EK"
  name: "Substrate Channeling Efficiency"
  formula: "\\eta = \\frac{k_{cat}^{channel}}{k_{cat}^{free}}"
  variables:
    eta: "Channeling efficiency"
    k_cat_channel: "k_cat with channeling"
    k_cat_free: "k_cat without channeling"
  description: "Rate enhancement due to substrate channeling"

- formula_id: "BIO_EK_094"
  subdomain: "EK"
  name: "Enzyme Efficiency - kcat/Km"
  formula: "k_{cat}/K_m"
  variables:
    k_cat: "Turnover number"
    K_m: "Michaelis constant"
  description: "Second-order rate constant for enzyme catalysis at low [S]"

- formula_id: "BIO_EK_095"
  subdomain: "EK"
  name: "Enzyme Efficiency Comparison"
  formula: "\\frac{(k_{cat}/K_m)_1}{(k_{cat}/K_m)_2}"
  variables:
    k_cat_1: "Turnover of enzyme 1"
    K_m_1: "Michaelis constant of enzyme 1"
    k_cat_2: "Turnover of enzyme 2"
    K_m_2: "Michaelis constant of enzyme 2"
  description: "Relative efficiency of two enzymes"

- formula_id: "BIO_EK_096"
  subdomain: "EK"
  name: "Pre-Steady-State - Relaxation Time"
  formula: "\\tau = \\frac{1}{k_{-1} + k_2}"
  variables:
