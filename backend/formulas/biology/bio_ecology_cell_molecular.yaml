- formula_id: "BIO_EK_106"
  subdomain: "EK"
  name: "Koshland Sequential - Fractional"
  formula: "Y = \\frac{n[S]^{n}}{K_{0.5}^{n} + [S]^{n}}"
  variables:
    Y: "Fractional saturation"
    n: "Hill coefficient"
    S: "Substrate concentration"
    K_0.5: "Half-saturation constant"
  description: "Fractional saturation in sequential model"

- formula_id: "BIO_EK_107"
  subdomain: "EK"
  name: "Enzyme Inhibition - Mechanism-Based"
