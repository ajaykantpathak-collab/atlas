  description: "Hill coefficient as slope at Y=0.5"

- formula_id: "BIO_EK_117"
  subdomain: "EK"
  name: "Enzyme Inhibition - IC50"
  formula: "IC_{50} = \\frac{K_i}{1 - \\frac{[S]}{K_s}}"
  variables:
    IC_50: "Half maximal inhibitory concentration"
    K_i: "Inhibition constant"
    S: "Substrate concentration"
    K_s: "Substrate dissociation constant"
  description: "IC50 for tight-binding inhibitor"

- formula_id: "BIO_EK_118"
  subdomain: "EK"
  name: "Enzyme Inhibition - TPP"
  formula: "IC_{50} = K_i \\left(1 + \\frac{[S]}{K_m}\\right) \\left(1 + \\frac{[A]}{K_a}\\right)"
  variables:
    IC_50: "Half maximal inhibitory concentration"
    K_i: "Inhibition constant"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
    A: "Activator concentration"
    K_a: "Activation constant"
  description: "IC50 in presence of activator"

- formula_id: "BIO_EK_119"
  subdomain: "EK"
  name: "Pre-Steady-State - Relaxation"
  formula: "v(t) = V_s + (V_i - V_s) e^{-t/\\tau}"
  variables:
    v: "Velocity at time t"
    V_s: "Steady-state velocity"
    V_i: "Initial velocity"
    tau: "Relaxation time"
    t: "Time"
  description: "Exponential approach to steady-state"

- formula_id: "BIO_EK_120"
  subdomain: "EK"
  name: "Enzyme Catalysis - Eyring Equation"
  formula: "k = \\frac{k_B T}{h} e^{-\\Delta H^{\\ddagger}/RT} e^{\\Delta S^{\\ddagger}/R}"
