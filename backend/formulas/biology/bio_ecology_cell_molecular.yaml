---
- formula_id: "BIO_ECO_001"
  subdomain: "ECO"
  name: "Exponential Growth - Discrete"
  formula: "N_t = N_0 \\lambda^t"
  variables:
    N_t: "Population size at time t"
    N_0: "Initial population size"
    lambda: "Finite rate of increase"
    t: "Number of time intervals"
  description: "Population growth per generation"

- formula_id: "BIO_ECO_002"
  subdomain: "ECO"
  name: "Exponential Growth - Continuous"
  formula: "N_t = N_0 e^{rt}"
  variables:
    N_t: "Population size at time t"
    N_0: "Initial population size"
    r: "Intrinsic rate of increase"
    t: "Time"
    e: "Euler\\'s number"
  description: "Continuous population growth in unlimited environment"

- formula_id: "BIO_ECO_003"
  subdomain: "ECO"
  name: "Intrinsic Rate from Life Table"
  formula: "r = \\ln(R_0) / T"
  variables:
    r: "Intrinsic rate of increase"
    R_0: "Net reproductive rate"
    T: "Generation time"
  description: "Relationship between r and R_0"

- formula_id: "BIO_ECO_004"
  subdomain: "ECO"
  name: "Net Reproductive Rate"
  formula: "R_0 = \\sum l_x m_x"
  variables:
    R_0: "Net reproductive rate"
    l_x: "Survival to age x"
    m_x: "Fecundity at age x"
  description: "Average number of offspring produced by an individual over its lifetime"

- formula_id: "BIO_ECO_005"
  subdomain: "ECO"
  name: "Generation Time"
  formula: "T = \\sum x l_x m_x / \\sum l_x m_x"
  variables:
    T: "Mean generation time"
    x: "Age class"
    l_x: "Survival to age x"
    m_x: "Fecundity at age x"
  description: "Average age of parents in a population"

- formula_id: "BIO_ECO_006"
  subdomain: "ECO"
  name: "Logistic Growth Equation"
  formula: "\\frac{dN}{dt} = rN\\left(1 - \\frac{N}{K}\\right)"
  variables:
    N: "Population size"
    r: "Intrinsic growth rate"
    K: "Carrying capacity"
    t: "Time"
  description: "Growth with density-dependent limitation"

- formula_id: "BIO_ECO_007"
  subdomain: "ECO"
  name: "Logistic Growth - Analytical Solution"
  formula: "N_t = \\frac{K}{1 + \\left(\\frac{K - N_0}{N_0}\\right) e^{-rt}}"
  variables:
    N_t: "Population size at time t"
    K: "Carrying capacity"
    N_0: "Initial population size"
    r: "Intrinsic growth rate"
    t: "Time"
  description: "Explicit solution of logistic equation"

- formula_id: "BIO_ECO_008"
  subdomain: "ECO"
  name: "Intrinsic Rate Approximation"
  formula: "r \\approx \\frac{\\ln(R_0)}{T}"
  variables:
    r: "Intrinsic rate"
    R_0: "Net reproductive rate"
    T: "Generation time"
  description: "Approximation for iteroparous species"

- formula_id: "BIO_ECO_009"
  subdomain: "ECO"
  name: "Lotka-Volterra Prey Equation"
  formula: "\\frac{dN}{dt} = rN - \\alpha NP"
  variables:
    N: "Prey population"
    P: "Predator population"
    r: "Prey intrinsic growth rate"
    alpha: "Predation rate coefficient"
    t: "Time"
  description: "Prey population change from growth and predation"

- formula_id: "BIO_ECO_010"
  subdomain: "ECO"
  name: "Lotka-Volterra Predator Equation"
  formula: "\\frac{dP}{dt} = \\beta\\alpha NP - mP"
  variables:
    P: "Predator population"
    N: "Prey population"
    alpha: "Predation rate coefficient"
    beta: "Conversion efficiency"
    m: "Predator mortality rate"
    t: "Time"
  description: "Predator population change from consuming prey"

- formula_id: "BIO_ECO_011"
  subdomain: "ECO"
  name: "Competitive Exclusion - Zero-Growth Isocline"
  formula: "K_1 - \\frac{\\alpha_{12} N_2}{K_1}"
  variables:
    K_1: "Carrying capacity of species 1"
    alpha_12: "Competition coefficient"
    N_2: "Population of species 2"
  description: "Population size of species 1 when growth rate is zero"

- formula_id: "BIO_ECO_012"
  subdomain: "ECO"
  name: "Shannon Diversity Index"
  formula: "H\' = -\\sum_{i=1}^{S} p_i \\ln(p_i)"
  variables:
    H_prime: "Shannon diversity index"
    S: "Number of species"
    p_i: "Proportion of individuals belonging to species i"
  description: "Species diversity accounting for richness and evenness"

- formula_id: "BIO_ECO_013"
  subdomain: "ECO"
  name: "Simpson Diversity Index"
  formula: "D = \\frac{\\sum_{i=1}^{S} n_i(n_i - 1)}{N(N - 1)}"
  variables:
    D: "Simpson diversity index"
    S: "Number of species"
    n_i: "Number of individuals of species i"
    N: "Total number of individuals"
  description: "Probability that two randomly selected individuals are from different species"

- formula_id: "BIO_ECO_014"
  subdomain: "ECO"
  name: "Simpson Diversity Index - Alternative"
  formula: "D = 1 - \\sum_{i=1}^{S} p_i^2"
  variables:
    D: "Simpson index of dominance"
    S: "Number of species"
    p_i: "Proportion of individuals in species i"
  description: "Probability that two individuals are from different species"

- formula_id: "BIO_ECO_015"
  subdomain: "ECO"
  name: "Species Evenness"
  formula: "J = \\frac{H\'}{\\ln(S)}"
  variables:
    J: "Pielou\\'s evenness index"
    H_prime: "Shannon diversity index"
    S: "Number of species"
  description: "Measure of how evenly individuals are distributed across species"

- formula_id: "BIO_ECO_016"
  subdomain: "ECO"
  name: "Ten Percent Law"
  formula: "E = 10\\% \\times A"
  variables:
    E: "Energy transferred to next trophic level"
    A: "Energy available at current trophic level"
  description: "Approximately 10% of energy is transferred between trophic levels"

- formula_id: "BIO_ECO_017"
  subdomain: "ECO"
  name: "Trophic Efficiency"
  formula: "T_{eff} = \\frac{I_{n+1}}{I_n} \\times 100\\%"
  variables:
    T_eff: "Trophic efficiency"
    I_n: "Energy intake at trophic level n"
    I_{n+1}: "Energy intake at trophic level n+1"
  description: "Percentage of energy transferred between trophic levels"

- formula_id: "BIO_ECO_018"
  subdomain: "ECO"
  name: "Ecological Efficiency - Production Basis"
  formula: "E = \\frac{P_{n+1}}{P_n} \\times 100\\%"
  variables:
    E: "Ecological efficiency"
    P_n: "Production at trophic level n"
    P_{n+1}: "Production at trophic level n+1"
  description: "Efficiency based on net production"

- formula_id: "BIO_ECO_019"
  subdomain: "ECO"
  name: "Gross Primary Productivity"
  formula: "GPP = R + NPP"
  variables:
    GPP: "Gross primary productivity"
    R: "Respiration"
    NPP: "Net primary productivity"
  description: "Total carbon fixed minus autotrophic respiration"

- formula_id: "BIO_ECO_020"
  subdomain: "ECO"
  name: "Net Primary Productivity"
  formula: "NPP = GPP - R_a"
  variables:
    NPP: "Net primary productivity"
    GPP: "Gross primary productivity"
    R_a: "Autotrophic respiration"
  description: "Carbon available for growth and reproduction"

- formula_id: "BIO_ECO_021"
  subdomain: "ECO"
  name: "NPP from Biomass"
  formula: "NPP = \\Delta B / \\Delta t"
  variables:
    NPP: "Net primary productivity"
    B: "Biomass"
    t: "Time"
  description: "Rate of biomass accumulation"

- formula_id: "BIO_ECO_022"
  subdomain: "ECO"
  name: "Secondary Productivity"
  formula: "SP = C - FU - R"
  variables:
    SP: "Secondary productivity"
    C: "Consumption"
    FU: "Feces and egestion"
    R: "Respiration"
  description: "Growth of heterotrophs"

- formula_id: "BIO_ECO_023"
  subdomain: "ECO"
  name: "Carbon Sequestration Rate"
  formula: "S = \\frac{\\Delta C}{\\Delta t}"
  variables:
    S: "Sequestration rate"
    C: "Carbon stored"
    t: "Time"
  description: "Rate of carbon storage in ecosystem"

- formula_id: "BIO_ECO_024"
  subdomain: "ECO"
  name: "Biogeochemical Cycle - Turnover Time"
  formula: "\\tau = M / F"
  variables:
    tau: "Turnover time"
    M: "Mass of reservoir"
    F: "Flux rate"
  description: "Average residence time in a reservoir"

- formula_id: "BIO_ECO_025"
  subdomain: "ECO"
  name: "Nitrogen Cycle - Net Mineralization"
  formula: "N_{min} = N_{imm} + N_{net}"
  variables:
    N_min: "Total N mineralization"
    N_imm: "N immobilized"
    N_net: "Net N mineralization"
  description: "Balance of N cycling in soil"

- formula_id: "BIO_ECO_026"
  subdomain: "ECO"
  name: "Carbon Cycle - Net Ecosystem Exchange"
  formula: "NEE = R_{eco} - GPP"
  variables:
    NEE: "Net ecosystem exchange"
    R_eco: "Ecosystem respiration"
    GPP: "Gross primary productivity"
  description: "Net carbon flux between ecosystem and atmosphere"

- formula_id: "BIO_ECO_027"
  subdomain: "ECO"
  name: "Phosphorus Cycle - Input Rate"
  formula: "P_{in} = W + A + F"
  variables:
    P_in: "P input rate"
    W: "Weathering input"
    A: "Atmospheric deposition"
    F: "Fertilizer input"
  description: "Total phosphorus input to ecosystem"

- formula_id: "BIO_ECO_028"
  subdomain: "ECO"
  name: "Oxygen Demand - BOD"
  formula: "BOD = D_1 - D_5"
  variables:
    BOD: "Biochemical oxygen demand"
    D_1: "DO depletion after 1 day"
    D_5: "DO depletion after 5 days"
  description: "Oxygen consumed by microorganisms"

- formula_id: "BIO_ECO_029"
  subdomain: "ECO"
  name: "Lindeman Efficiency"
  formula: "E = \\frac{I_{n}}{I_{n-1}}"
  variables:
    E: "Energy transfer efficiency"
    I_n: "Energy ingested at level n"
    I_{n-1}: "Energy ingested at level n-1"
  description: "Ecological efficiency between trophic levels"

- formula_id: "BIO_ECO_030"
  subdomain: "ECO"
  name: "Population Doubling Time"
  formula: "T_d = \\frac{\\ln(2)}{r}"
  variables:
    T_d: "Doubling time"
    r: "Intrinsic growth rate"
    ln: "Natural logarithm"
  description: "Time for population to double at rate r"

- formula_id: "BIO_ECO_031"
  subdomain: "ECO"
  name: "Population Doubling Time - Discrete"
  formula: "T_d = \\frac{1}{\\log_2(\\lambda)}"
  variables:
    T_d: "Doubling time"
    lambda: "Finite rate of increase"
  description: "Doubling time for discrete growth"

- formula_id: "BIO_ECO_032"
  subdomain: "ECO"
  name: "Alpha Diversity"
  formula: "\\alpha = \\text{mean}(S_i)"
  variables:
    alpha: "Alpha diversity"
    S_i: "Species richness in sample i"
  description: "Average species richness within a habitat"

- formula_id: "BIO_ECO_033"
  subdomain: "ECO"
  name: "Beta Diversity - Whittaker"
  formula: "\\beta = \\frac{S_{total}}{\\bar{S}}"
  variables:
    beta: "Beta diversity"
    S_total: "Total species across all sites"
    S_bar: "Mean species per site"
  description: "Species turnover between habitats"

- formula_id: "BIO_ECO_034"
  subdomain: "ECO"
  name: "Gamma Diversity"
  formula: "\\gamma = \\sum_{i=1}^{N} p_i \\ln(p_i) \\times (-1)"
  variables:
    gamma: "Gamma diversity"
    p_i: "Proportion of species i"
    N: "Total species"
  description: "Total diversity across all ecosystems"

- formula_id: "BIO_ECO_035"
  subdomain: "ECO"
  name: "Community Similarity - Jaccard Index"
  formula: "J = \\frac{S_{AB}}{S_A + S_B - S_{AB}}"
  variables:
    J: "Jaccard similarity"
    S_AB: "Species shared by A and B"
    S_A: "Total species in A"
    S_B: "Total species in B"
  description: "Proportion of shared species"

- formula_id: "BIO_ECO_036"
  subdomain: "ECO"
  name: "Species-Area Relationship"
  formula: "S = cA^z"
  variables:
    S: "Number of species"
    A: "Area"
    c: "Scale constant"
    z: "Slope parameter"
  description: "Relationship between habitat area and species richness"

- formula_id: "BIO_ECO_037"
  subdomain: "ECO"
  name: "Species-Accumulation Curve"
  formula: "S_n = \\sum_{i=1}^{n} p_i"
  variables:
    S_n: "Expected species in n samples"
    p_i: "Probability of species i being sampled"
  description: "Expected number of species as sampling effort increases"

- formula_id: "BIO_ECO_038"
  subdomain: "ECO"
  name: "Neutral Theory - Species Abundance"
  formula: "\\phi(n) \\approx \\frac{\\theta}{n} e^{-n/J}"
  variables:
    phi: "Species abundance distribution"
    theta: "Fundamental biodiversity number"
    n: "Abundance class"
    J: "Community size"
  description: "Expected abundance of species in neutral theory"

- formula_id: "BIO_ECO_039"
  subdomain: "ECO"
  name: "Water Potential"
  formula: "\\Psi = \\Psi_s + \\Psi_p"
  variables:
    Psi: "Water potential"
    Psi_s: "Solute potential"
    Psi_p: "Pressure potential"
  description: "Potential energy of water"
  note: "Cross-referenced to BIO_PP"

- formula_id: "BIO_ECO_040"
  subdomain: "ECO"
  name: "Solute Potential"
  formula: "\\Psi_s = -iCRT"
  variables:
    Psi_s: "Solute potential"
    i: "Ionization constant"
    C: "Molar concentration"
    R: "Gas constant"
    T: "Absolute temperature"
  description: "Effect of solutes on water potential"
  note: "Cross-referenced to BIO_PP"

- formula_id: "BIO_CELL_001"
  subdomain: "CELL"
  name: "Cell Cycle Duration"
  formula: "T_{cycle} = T_{G1} + T_{S} + T_{G2} + T_{M}"
  variables:
    T_cycle: "Total cell cycle time"
    T_G1: "G1 phase duration"
    T_S: "S phase duration"
    T_G2: "G2 phase duration"
    T_M: "M phase duration"
  description: "Sum of all cell cycle phases"

- formula_id: "BIO_CELL_002"
  subdomain: "CELL"
  name: "Mitotic Index"
  formula: "MI = \\frac{N_{mitotic}}{N_{total}} \\times 100"
  variables:
    MI: "Mitotic index"
    N_mitotic: "Number of cells in mitosis"
    N_total: "Total number of cells"
  description: "Percentage of cells undergoing mitosis"

- formula_id: "BIO_CELL_003"
  subdomain: "CELL"
  name: "Cell Cycle Time from Mitotic Index"
  formula: "T_{cycle} = \\frac{T_M}{MI}"
  variables:
    T_cycle: "Total cell cycle time"
    T_M: "Duration of mitosis"
    MI: "Mitotic index"
  description: "Estimating cell cycle length from MI"

- formula_id: "BIO_CELL_004"
  subdomain: "CELL"
  name: "Cell Doubling Time"
  formula: "T_d = \\frac{T_{cycle} \\times \\ln(2)}{\\ln(F)}"
  variables:
    T_d: "Doubling time"
    T_cycle: "Cell cycle duration"
    F: "Growth fraction"
  description: "Population doubling time for cells"

- formula_id: "BIO_CELL_005"
  subdomain: "CELL"
  name: "Surface Area to Volume Ratio - Sphere"
  formula: "SA:V = \\frac{3}{r}"
  variables:
    SA:V: "Surface area to volume ratio"
    r: "Radius of cell"
  description: "SA:V ratio for spherical cell"

- formula_id: "BIO_CELL_006"
  subdomain: "CELL"
  name: "Surface Area to Volume Ratio - Cylinder"
  formula: "SA:V = \\frac{2(r + h)}{rh}"
  variables:
    SA:V: "Surface area to volume ratio"
    r: "Radius"
    h: "Height"
  description: "SA:V ratio for cylindrical cell"

- formula_id: "BIO_CELL_007"
  subdomain: "CELL"
  name: "Surface Area - Sphere"
  formula: "A = 4\\pi r^2"
  variables:
    A: "Surface area"
    r: "Radius"
    pi: "Mathematical constant"
  description: "Surface area of spherical cell"

- formula_id: "BIO_CELL_008"
  subdomain: "CELL"
  name: "Volume - Sphere"
  formula: "V = \\frac{4}{3}\\pi r^3"
  variables:
    V: "Volume"
    r: "Radius"
    pi: "Mathematical constant"
  description: "Volume of spherical cell"

- formula_id: "BIO_CELL_009"
  subdomain: "CELL"
  name: "Surface Area - Cube"
  formula: "A = 6s^2"
  variables:
    A: "Surface area"
    s: "Side length"
  description: "Surface area of cuboidal cell"

- formula_id: "BIO_CELL_010"
  subdomain: "CELL"
  name: "Volume - Cube"
  formula: "V = s^3"
  variables:
    V: "Volume"
    s: "Side length"
  description: "Volume of cuboidal cell"

- formula_id: "BIO_CELL_011"
  subdomain: "CELL"
  name: "Cube SA:V Ratio"
  formula: "SA:V = \\frac{6}{s}"
  variables:
    SA:V: "Surface area to volume ratio"
    s: "Side length"
  description: "SA:V ratio for cuboidal cell"

- formula_id: "BIO_CELL_012"
  subdomain: "CELL"
  name: "Osmotic Potential"
  formula: "\\Psi_s = -iCRT"
  variables:
    Psi_s: "Osmotic potential"
    i: "Ionization constant"
    C: "Molar concentration"
    R: "Gas constant"
    T: "Absolute temperature"
  description: "Effect of solute concentration on water potential"

- formula_id: "BIO_CELL_013"
  subdomain: "CELL"
  name: "Osmosis - Water Potential Gradient"
  formula: "\\Delta\\Psi = \\Psi_1 - \\Psi_2"
  variables:
    deltaPsi: "Water potential difference"
    Psi_1: "Water potential on side 1"
    Psi_2: "Water potential on side 2"
  description: "Driving force for water movement"

- formula_id: "BIO_CELL_014"
  subdomain: "CELL"
  name: "Osmotic Pressure - Van\\'t Hoff"
  formula: "\\Pi = iCRT"
  variables:
    Pi: "Osmotic pressure"
    i: "Ionization constant"
    C: "Molar concentration"
    R: "Gas constant"
    T: "Temperature in Kelvin"
  description: "Pressure exerted by solution across membrane"

- formula_id: "BIO_CELL_015"
  subdomain: "CELL"
  name: "Fick\\'s First Law of Diffusion"
  formula: "J = -D\\frac{\\Delta C}{\\Delta x}"
  variables:
    J: "Diffusive flux"
    D: "Diffusion coefficient"
    deltaC: "Concentration difference"
    deltax: "Distance"
  description: "Rate of diffusion across a concentration gradient"

- formula_id: "BIO_CELL_016"
  subdomain: "CELL"
  name: "Fick\\'s Second Law"
  formula: "\\frac{\\partial C}{\\partial t} = D\\frac{\\partial^2 C}{\\partial x^2}"
  variables:
    C: "Concentration"
    t: "Time"
    D: "Diffusion coefficient"
    x: "Position"
  description: "Change in concentration over time due to diffusion"

- formula_id: "BIO_CELL_017"
  subdomain: "CELL"
  name: "Effective Diffusion Distance"
  formula: "t \\propto x^2"
  variables:
    t: "Diffusion time"
    x: "Diffusion distance"
  description: "Diffusion time proportional to distance squared"

- formula_id: "BIO_CELL_018"
  subdomain: "CELL"
  name: "Stokes-Einstein Equation"
  formula: "D = \\frac{k_B T}{6\\pi\\eta r}"
  variables:
    D: "Diffusion coefficient"
    k_B: "Boltzmann constant"
    T: "Absolute temperature"
    eta: "Viscosity"
    r: "Molecular radius"
  description: "Diffusion coefficient for spherical particles"

- formula_id: "BIO_CELL_019"
  subdomain: "CELL"
  name: "Nernst Equation"
  formula: "E_{ion} = \\frac{RT}{zF}\\ln\\frac{[ion]_{out}}{[ion]_{in}}"
  variables:
    E_ion: "Equilibrium potential"
    R: "Gas constant"
    T: "Absolute temperature"
    z: "Charge of ion"
    F: "Faraday constant"
  description: "Membrane potential at equilibrium for an ion"

- formula_id: "BIO_CELL_020"
  subdomain: "CELL"
  name: "Goldman-Hodgkin-Katz Equation"
  formula: "V_m = \\frac{RT}{F}\\ln\\frac{P_K[K^+]_o + P_{Na}[Na^+]_o + P_{Cl}[Cl^-]_i}{P_K[K^+]_i + P_{Na}[Na^+]_i + P_{Cl}[Cl^-]_o}"
  variables:
    V_m: "Membrane potential"
    R: "Gas constant"
    T: "Absolute temperature"
    F: "Faraday constant"
    P: "Permeability"
  description: "Resting membrane potential considering multiple ions"

- formula_id: "BIO_CELL_021"
  subdomain: "CELL"
  name: "Membrane Permeability"
  formula: "P = \\frac{DK}{\\Delta x}"
  variables:
    P: "Permeability coefficient"
    D: "Diffusion coefficient"
    K: "Partition coefficient"
    deltax: "Membrane thickness"
  description: "Rate at which substances cross membrane"

- formula_id: "BIO_CELL_022"
  subdomain: "CELL"
  name: "Cellular Osmolarity"
  formula: "\\Pi = iMRT"
  variables:
    Pi: "Osmotic pressure"
    i: "Ionization constant"
    M: "Molarity"
    R: "Gas constant"
    T: "Temperature in Kelvin"
  description: "Osmotic pressure exerted by intracellular solution"

- formula_id: "BIO_CELL_023"
  subdomain: "CELL"
  name: "Tonicity Comparison"
  formula: "\\Delta\\Pi = \\Pi_{ext} - \\Pi_{int}"
  variables:
    deltaPi: "Osmotic pressure difference"
    Pi_ext: "External osmotic pressure"
    Pi_int: "Internal osmotic pressure"
  description: "Determines net water movement direction"

- formula_id: "BIO_CELL_024"
  subdomain: "CELL"
  name: "Cell Plasmolysis"
  formula: "\\Psi_{cell} = \\Psi_{ext}"
  variables:
    Psi_cell: "Cell water potential"
    Psi_ext: "External water potential"
  description: "Condition for plasmolysis (equilibrium)"

- formula_id: "BIO_CELL_025"
  subdomain: "CELL"
  name: "Flagellar Beat Frequency"
  formula: "f = \\frac{v}{\\lambda}"
  variables:
    f: "Beat frequency"
    v: "Wave propagation velocity"
    lambda: "Wavelength"
  description: "Frequency of flagellar or ciliary beating"

- formula_id: "BIO_CELL_026"
  subdomain: "CELL"
  name: "Chromosome Number - Diploid"
  formula: "2n = 46"
  variables:
    2n: "Diploid chromosome number"
  description: "Human diploid chromosome count"

- formula_id: "BIO_CELL_027"
  subdomain: "CELL"
  name: "Chromosome Number - Haploid"
  formula: "n = 23"
  variables:
    n: "Haploid chromosome number"
  description: "Human haploid chromosome count (gametes)"

- formula_id: "BIO_CELL_028"
  subdomain: "CELL"
  name: "Cell Volume from Spherical Geometry"
  formula: "V = \\frac{4}{3}\\pi r^3"
  variables:
    V: "Cell volume"
    r: "Cell radius"
  description: "Volume of spherical cell"

- formula_id: "BIO_CELL_029"
  subdomain: "CELL"
  name: "Membrane Time Constant"
  formula: "\\tau_m = R_m C_m"
  variables:
    tau_m: "Membrane time constant"
    R_m: "Membrane resistance"
    C_m: "Membrane capacitance"
  description: "Time for membrane potential to change"

- formula_id: "BIO_CELL_030"
  subdomain: "CELL"
  name: "Length Constant"
  formula: "\\lambda = \\sqrt{\\frac{R_m}{R_i}}"
  variables:
    lambda: "Length constant"
    R_m: "Membrane resistance per unit length"
    R_i: "Internal resistance per unit length"
  description: "Distance for voltage to decay to 37%"
  note: "Cross-referenced to BIO_EK"

- formula_id: "BIO_PP_001"
  subdomain: "PP"
  name: "Photosynthesis - Overall Equation"
  formula: "6CO_2 + 6H_2O \\rightarrow C_6H_{12}O_6 + 6O_2"
  variables:
    CO_2: "Carbon dioxide"
    H_2O: "Water"
    C_6H_{12}O_6: "Glucose"
    O_2: "Oxygen"
  description: "Simplified photosynthesis equation"

- formula_id: "BIO_PP_002"
  subdomain: "PP"
  name: "Photosynthetic Efficiency"
  formula: "\\eta = \\frac{GPP}{PAR} \\times 100\\%"
  variables:
    eta: "Photosynthetic efficiency"
    GPP: "Gross primary productivity"
    PAR: "Photosynthetically active radiation"
  description: "Percentage of light energy converted to biomass"

- formula_id: "BIO_PP_003"
  subdomain: "PP"
  name: "Light Use Efficiency"
  formula: "LUE = \\frac{NPP}{APAR}"
  variables:
    LUE: "Light use efficiency"
    NPP: "Net primary productivity"
    APAR: "Absorbed photosynthetically active radiation"
  description: "Biomass produced per unit of absorbed PAR"

- formula_id: "BIO_PP_004"
  subdomain: "PP"
  name: "Photosynthetic Rate - Light Response"
  formula: "P = \\frac{P_{max} I}{K_I + I} - R"
  variables:
    P: "Net photosynthetic rate"
    P_max: "Maximum photosynthetic rate"
    I: "Light intensity"
    K_I: "Half-saturation constant"
    R: "Dark respiration"
  description: "Rectangular hyperbola model of photosynthesis"

- formula_id: "BIO_PP_005"
  subdomain: "PP"
  name: "Maximum Quantum Yield"
  formula: "\\Phi_{max} = \\frac{P_{max}}{I_{sat}}"
  variables:
    Phi_max: "Maximum quantum yield"
    P_max: "Maximum photosynthetic rate"
    I_sat: "Saturating light intensity"
  description: "Initial slope of light response curve"

- formula_id: "BIO_PP_006"
  subdomain: "PP"
  name: "CO2 Compensation Point"
  formula: "\\Gamma = \\frac{R_d}{\\Phi}"
  variables:
    Gamma: "CO2 compensation point"
    R_d: "Dark respiration rate"
    Phi: "Quantum yield"
  description: "CO2 concentration where photosynthesis equals respiration"

- formula_id: "BIO_PP_007"
  subdomain: "PP"
  name: "Water Use Efficiency"
  formula: "WUE = \\frac{A}{E}"
  variables:
    WUE: "Water use efficiency"
    A: "Net CO2 assimilation rate"
    E: "Transpiration rate"
  description: "Carbon gained per unit water lost"

- formula_id: "BIO_PP_008"
  subdomain: "PP"
  name: "Transpiration Rate"
  formula: "E = g_s \\times (e_{in} - e_{out})"
  variables:
    E: "Transpiration rate"
    g_s: "Stomatal conductance"
    e_in: "Internal water vapor pressure"
    e_out: "External water vapor pressure"
  description: "Water loss through stomata"

- formula_id: "BIO_PP_009"
  subdomain: "PP"
  name: "Stomatal Conductance to Water Vapor"
  formula: "g_s = \\frac{1}{r_s}"
  variables:
    g_s: "Stomatal conductance"
    r_s: "Stomatal resistance"
  description: "Inverse of stomatal resistance"

- formula_id: "BIO_PP_010"
  subdomain: "PP"
  name: "Boundary Layer Conductance"
  formula: "g_b = \\frac{D}{\\delta}"
  variables:
    g_b: "Boundary layer conductance"
    D: "Diffusion coefficient"
    delta: "Boundary layer thickness"
  description: "Diffusive conductance of leaf boundary layer"

- formula_id: "BIO_PP_011"
  subdomain: "PP"
  name: "Penman-Monteith Equation"
  formula: "\\lambda E = \\frac{\\Delta(R_n - G) + \\rho_a c_p (e_s - e_a) / r_a}{\\Delta + \\gamma(1 + r_s / r_a)}"
  variables:
    lambdaE: "Latent heat flux"
    delta: "Slope of saturation vapor pressure curve"
    R_n: "Net radiation"
    G: "Soil heat flux"
    rho_a: "Air density"
    c_p: "Specific heat of air"
    e_s: "Saturation vapor pressure"
    e_a: "Actual vapor pressure"
    r_a: "Aerodynamic resistance"
    r_s: "Surface resistance"
    gamma: "Psychrometric constant"
  description: "Reference evapotranspiration calculation"

- formula_id: "BIO_PP_012"
  subdomain: "PP"
  name: "Water Potential"
  formula: "\\Psi = \\Psi_s + \\Psi_p + \\Psi_g"
  variables:
    Psi: "Water potential"
    Psi_s: "Solute potential"
    Psi_p: "Pressure potential"
    Psi_g: "Gravitational potential"
  description: "Total potential energy of water"

- formula_id: "BIO_PP_013"
  subdomain: "PP"
  name: "Solute Potential"
  formula: "\\Psi_s = -iCRT"
  variables:
    Psi_s: "Solute potential"
    i: "Ionization constant"
    C: "Molar concentration"
    R: "Gas constant"
    T: "Absolute temperature"
  description: "Effect of dissolved solutes on water potential"

- formula_id: "BIO_PP_014"
  subdomain: "PP"
  name: "Pressure Potential (Turgor)"
  formula: "\\Psi_p = \\frac{T}{A}"
  variables:
    Psi_p: "Pressure potential"
    T: "Turgor pressure"
    A: "Cell surface area"
  description: "Physical pressure exerted on cell wall"

- formula_id: "BIO_PP_015"
  subdomain: "PP"
  name: "Gravitational Potential"
  formula: "\\Psi_g = \\rho_w g h"
  variables:
    Psi_g: "Gravitational potential"
    rho_w: "Density of water"
    g: "Acceleration due to gravity"
    h: "Height above reference point"
  description: "Effect of gravity on water potential"

- formula_id: "BIO_PP_016"
  subdomain: "PP"
  name: "Pressure Flow Hypothesis"
  formula: "\\frac{dP}{dx} = -\\frac{R}{A}\\frac{dV}{dt}"
  variables:
    P: "Turgor pressure"
    x: "Distance along sieve tube"
    R: "Resistance to flow"
    A: "Cross-sectional area"
    V: "Volume flow rate"
    t: "Time"
  description: "Movement of phloem sap by pressure gradient"

- formula_id: "BIO_PP_017"
  subdomain: "PP"
  name: "Poiseuille\\'s Law - Phloem"
  formula: "Q = \\frac{\\pi r^4 \\Delta P}{8\\eta L}"
  variables:
    Q: "Volume flow rate"
    r: "Sieve tube radius"
    deltaP: "Pressure difference"
    eta: "Viscosity of sap"
    L: "Length of sieve tube"
  description: "Flow rate in phloem sap"

- formula_id: "BIO_PP_018"
  subdomain: "PP"
  name: "Munch Pressure Flow"
  formula: "\\Delta P = P_{source} - P_{sink}"
  variables:
    deltaP: "Turgor pressure gradient"
    P_source: "Turgor at source"
    P_sink: "Turgor at sink"
  description: "Driving force for phloem translocation"

- formula_id: "BIO_PP_019"
  subdomain: "PP"
  name: "Calvin Cycle - Carbon Fixation Rate"
  formula: "V_c = \\frac{V_{max} [CO_2]}{K_m + [CO_2]}"
  variables:
    V_c: "Carboxylation rate"
    V_max: "Maximum carboxylation rate"
    CO_2: "CO2 concentration"
    K_m: "Michaelis-Menten constant for Rubisco"
  description: "Rate of CO2 fixation by Rubisco"
  note: "Similar to Michaelis-Menten"

- formula_id: "BIO_PP_020"
  subdomain: "PP"
  name: "Triose Phosphate Utilization"
  formula: "TPU = \\frac{3 V_c}{2} - R_p"
  variables:
    TPU: "Triose phosphate utilization rate"
    V_c: "Carboxylation rate"
    R_p: "Rate of respiration in chloroplast"
  description: "Rate of sucrose export from chloroplast"

- formula_id: "BIO_PP_021"
  subdomain: "PP"
  name: "Quantum Yield"
  formula: "\\Phi = \\frac{A}{I}"
  variables:
    Phi: "Quantum yield"
    A: "Net CO2 assimilation rate"
    I: "Photosynthetic photon flux density"
  description: "CO2 fixed per photon absorbed"

- formula_id: "BIO_PP_022"
  subdomain: "PP"
  name: "ETR - Electron Transport Rate"
  formula: "ETR = \\Phi_{PSII} \\times I \\times 0.5 \\times \\alpha"
  variables:
    ETR: "Electron transport rate"
    Phi_PSII: "Effective PSII quantum yield"
    I: "Photosynthetic photon flux density"
    alpha: "Absorptivity"
  description: "Rate of electron transport through PSII"

- formula_id: "BIO_PP_023"
  subdomain: "PP"
  name: "Leaf Area Index"
  formula: "LAI = \\frac{A_{leaf}}{A_{ground}}"
  variables:
    LAI: "Leaf area index"
    A_leaf: "Total one-sided leaf area"
    A_ground: "Ground area"
  description: "One-sided leaf area per unit ground area"

- formula_id: "BIO_PP_024"
  subdomain: "PP"
  name: "Canopy Photosynthesis"
  formula: "P_c = \\int_0^{L} P(z) dz"
  variables:
    P_c: "Canopy photosynthesis"
    P(z): "Photosynthetic rate at canopy depth z"
    L: "Leaf area index"
  description: "Integration of photosynthesis through canopy"

- formula_id: "BIO_PP_025"
  subdomain: "PP"
  name: "Relative Growth Rate"
  formula: "RGR = \\frac{\\ln(W_2) - \\ln(W_1)}{t_2 - t_1}"
  variables:
    RGR: "Relative growth rate"
    W_1: "Initial dry weight"
    W_2: "Final dry weight"
    t_1: "Initial time"
    t_2: "Final time"
  description: "Exponential growth rate of plant biomass"

- formula_id: "BIO_PP_026"
  subdomain: "PP"
  name: "Net Assimilation Rate"
  formula: "NAR = \\frac{1}{A} \\frac{dW}{dt}"
  variables:
    NAR: "Net assimilation rate"
    A: "Leaf area"
    W: "Plant dry weight"
    t: "Time"
  description: "Rate of biomass increase per unit leaf area"

- formula_id: "BIO_PP_027"
  subdomain: "PP"
  name: "Leaf Area Ratio"
  formula: "LAR = \\frac{A}{W}"
  variables:
    LAR: "Leaf area ratio"
    A: "Leaf area"
    W: "Total plant dry weight"
  description: "Leaf area per unit plant biomass"

- formula_id: "BIO_PP_028"
  subdomain: "PP"
  name: "Specific Leaf Area"
  formula: "SLA = \\frac{A}{W_{leaf}}"
  variables:
    SLA: "Specific leaf area"
    A: "Leaf area"
    W_leaf: "Leaf dry weight"
  description: "Leaf area per unit leaf biomass"

- formula_id: "BIO_PP_029"
  subdomain: "PP"
  name: "Leaf Mass per Area"
  formula: "LMA = \\frac{1}{SLA}"
  variables:
    LMA: "Leaf mass per area"
    SLA: "Specific leaf area"
  description: "Inverse of specific leaf area"

- formula_id: "BIO_PP_030"
  subdomain: "PP"
  name: "Photosynthetic Parameters - FvCB"
  formula: "A = \\min\\{W_c, W_j\\} - R_d"
  variables:
    A: "Net CO2 assimilation rate"
    W_c: "Rubisco-limited rate"
    W_j: "RuBP regeneration-limited rate"
    R_d: "Day respiration"
  description: "Farquhar-von Caemmerer-Berry model"

- formula_id: "BIO_PP_031"
  subdomain: "PP"
  name: "Rubisco-Limited Rate"
  formula: "W_c = \\frac{V_{cmax} [CO_2]}{[CO_2] + K_c(1 + [O_2]/K_o)}"
  variables:
    W_c: "Rubisco-limited carboxylation"
    V_cmax: "Maximum Rubisco carboxylation rate"
    CO_2: "CO2 concentration at Rubisco"
    K_c: "Michaelis constant for CO2"
    O_2: "O2 concentration"
    K_o: "Michaelis constant for O2"
  description: "Rate limited by Rubisco activity"

- formula_id: "BIO_PP_032"
  subdomain: "PP"
  name: "RuBP Regeneration-Limited Rate"
  formula: "W_j = \\frac{J [CO_2]}{4[CO_2] + 8\\Gamma}"
  variables:
    W_j: "RuBP regeneration-limited rate"
    J: "Electron transport rate"
    CO_2: "CO2 concentration"
    Gamma: "CO2 compensation point"
  description: "Rate limited by RuBP regeneration"

- formula_id: "BIO_PP_033"
  subdomain: "PP"
  name: "Maximum Electron Transport"
  formula: "J = \\frac{J_{max} I}{I + 2\\Gamma}"
  variables:
    J: "Electron transport rate"
    J_max: "Maximum electron transport"
    I: "PPFD"
    Gamma: "CO2 compensation point"
  description: "Light-limited electron transport"

- formula_id: "BIO_MB_001"
  subdomain: "MB"
  name: "DNA Melting Temperature - Wallace Rule"
  formula: "T_m = 2(A + T) + 4(G + C)"
  variables:
    T_m: "Melting temperature"
    A: "Number of adenine bases"
    T: "Number of thymine bases"
    G: "Number of guanine bases"
    C: "Number of cytosine bases"
  description: "Approximate Tm for short primers"

- formula_id: "BIO_MB_002"
  subdomain: "MB"
  name: "GC Content"
  formula: "GC\\% = \\frac{G + C}{A + T + G + C} \\times 100\\%"
  variables:
    GC: "GC percentage"
    A: "Number of adenine bases"
    T: "Number of thymine bases"
    G: "Number of guanine bases"
    C: "Number of cytosine bases"
  description: "Proportion of G and C nucleotides"

- formula_id: "BIO_MB_003"
  subdomain: "MB"
  name: "Melting Temperature - Salt Adjusted"
  formula: "T_m = 81.5 + 16.6\\log_{10}([Na^+]) + 0.41(GC\\%) - 0.72(\\% formamide)"
  variables:
    T_m: "Melting temperature"
    Na: "Sodium ion concentration"
    GC: "GC percentage"
    formamide: "Formamide percentage"
  description: "Tm adjusted for salt concentration and formamide"

- formula_id: "BIO_MB_004"
  subdomain: "MB"
  name: "DNA Molecular Weight"
  formula: "MW = n_b \\times 330"
  variables:
    MW: "Molecular weight"
    n_b: "Number of base pairs"
    330: "Average MW of a base pair in Da"
  description: "Approximate molecular weight of dsDNA"

- formula_id: "BIO_MB_005"
  subdomain: "MB"
  name: "Oligonucleotide Molecular Weight"
  formula: "MW = n_A \\times 313.2 + n_T \\times 304.2 + n_G \\times 329.2 + n_C \\times 289.2 - 61.96"
  variables:
    MW: "Molecular weight of ssDNA"
    n_A: "Number of adenine"
    n_T: "Number of thymine"
    n_G: "Number of guanine"
    n_C: "Number of cytosine"
  description: "MW of single-stranded DNA oligonucleotide"

- formula_id: "BIO_MB_006"
  subdomain: "MB"
  name: "Protein Molecular Weight from Sequence"
  formula: "MW_{protein} = \\sum_{i=1}^{n} MW_{aa_i} - (n - 1) \\times 18"
  variables:
    MW_protein: "Protein molecular weight"
    n: "Number of amino acids"
    MW_aa: "Molecular weight of each amino acid residue"
    18: "Mass of water lost per peptide bond"
  description: "Sum of amino acid residue weights minus water"

- formula_id: "BIO_MB_007"
  subdomain: "MB"
  name: "Amino Acid Residue Weight"
  formula: "MW_{residue} = MW_{free} - 18"
  variables:
    MW_residue: "Residue molecular weight"
    MW_free: "Free amino acid molecular weight"
    18: "Water mass"
  description: "Weight of amino acid in a polypeptide chain"

- formula_id: "BIO_MB_008"
  subdomain: "MB"
  name: "PCR Efficiency"
  formula: "E = \\left(10^{-1/s} - 1\\right) \\times 100\\%"
  variables:
    E: "PCR efficiency"
    s: "Slope of standard curve (log C_t vs log input)"
  description: "Efficiency calculated from qPCR standard curve"

- formula_id: "BIO_MB_009"
  subdomain: "MB"
  name: "qPCR Efficiency - Alternative"
  formula: "E = 10^{-1/s} - 1"
  variables:
    E: "PCR efficiency (decimal)"
    s: "Slope of C_t vs log(input) curve"
  description: "PCR efficiency as a decimal"

- formula_id: "BIO_MB_010"
  subdomain: "MB"
  name: "Amplification Factor per Cycle"
  formula: "N = (1 + E)^n"
  variables:
    N: "Amplified DNA amount"
    E: "Efficiency per cycle"
    n: "Number of cycles"
  description: "Exponential amplification in PCR"

- formula_id: "BIO_MB_011"
  subdomain: "MB"
  name: "Standard Curve - Log Input"
  formula: "C_t = m \\log_{10}(N_0) + b"
  variables:
    C_t: "Cycle threshold"
    m: "Slope"
    N_0: "Initial template amount"
    b: "Y-intercept"
  description: "Relationship between C_t and initial template"

- formula_id: "BIO_MB_012"
  subdomain: "MB"
  name: "Delta C_t (Relative Quantification)"
  formula: "\\Delta C_t = C_{t,target} - C_{t,reference}"
  variables:
    deltaC_t: "Delta C_t"
    C_t_target: "C_t of target gene"
    C_t_reference: "C_t of reference gene"
  description: "Normalization of target gene expression"

- formula_id: "BIO_MB_013"
  subdomain: "MB"
  name: "Delta Delta C_t Method"
  formula: "\\Delta\\Delta C_t = \\Delta C_{t,sample} - \\Delta C_{t,control}"
  variables:
    deltaDeltaC_t: "Delta delta C_t"
    deltaC_t_sample: "Delta C_t of sample"
    deltaC_t_control: "Delta C_t of control"
  description: "Fold change calculation in qPCR"

- formula_id: "BIO_MB_014"
  subdomain: "MB"
  name: "Fold Change - ddC_t Method"
  formula: "FC = 2^{-\\Delta\\Delta C_t}"
  variables:
    FC: "Fold change"
    deltaDeltaC_t: "Delta delta C_t"
  description: "Relative gene expression (2^(-ddCt))"

- formula_id: "BIO_MB_015"
  subdomain: "MB"
  name: "Codon Adaptation Index"
  formula: "CAI = \\left(\\prod_{i=1}^{L} w_i\\right)^{1/L}"
  variables:
    CAI: "Codon adaptation index"
    w_i: "Relative adaptiveness of codon i"
    L: "Number of codons"
  description: "Measure of codon usage bias"

- formula_id: "BIO_MB_016"
  subdomain: "MB"
  name: "Relative Synonymous Codon Usage"
  formula: "RSCU = \\frac{O_{ij}}{E_{ij}}"
  variables:
    RSCU: "Relative synonymous codon usage"
    O_ij: "Observed frequency of codon j for amino acid i"
    E_ij: "Expected frequency (1 / n_i)"
  description: "Observed vs expected codon usage"

- formula_id: "BIO_MB_017"
  subdomain: "MB"
  name: "Effective Number of Codons"
  formula: "ENC = \\frac{2NC}{NC - 1}"
  variables:
    ENC: "Effective number of codons"
    NC: "Homoplasy"
  description: "Measure of codon usage bias independent of gene length"

- formula_id: "BIO_MB_018"
  subdomain: "MB"
  name: "Central Dogma - Transcription Rate"
  formula: "\\frac{d[mRNA]}{dt} = k_t [DNA] - k_d [mRNA]"
  variables:
    mRNA: "mRNA concentration"
    DNA: "Gene copy number"
    k_t: "Transcription rate constant"
    k_d: "mRNA degradation rate constant"
    t: "Time"
  description: "mRNA accumulation over time"

- formula_id: "BIO_MB_019"
  subdomain: "MB"
  name: "Central Dogma - Translation Rate"
  formula: "\\frac{d[Protein]}{dt} = k_{tl} [mRNA] - k_{dp} [Protein]"
  variables:
    Protein: "Protein concentration"
    mRNA: "mRNA concentration"
    k_tl: "Translation rate constant"
    k_dp: "Protein degradation rate constant"
    t: "Time"
  description: "Protein accumulation over time"

- formula_id: "BIO_MB_020"
  subdomain: "MB"
  name: "Gene Expression Steady State"
  formula: "[mRNA]_{ss} = \\frac{k_t [DNA]}{k_d}"
  variables:
    mRNA_ss: "Steady-state mRNA concentration"
    k_t: "Transcription rate constant"
    DNA: "Gene copy number"
    k_d: "mRNA degradation rate"
  description: "mRNA level at steady state"

- formula_id: "BIO_MB_021"
  subdomain: "MB"
  name: "Protein Synthesis Rate"
  formula: "\\frac{dP}{dt} = k_p [mRNA] - k_{deg} P"
  variables:
    P: "Protein concentration"
    k_p: "Translation rate constant"
    mRNA: "mRNA concentration"
    k_deg: "Protein degradation rate"
    t: "Time"
  description: "Rate of protein accumulation"

- formula_id: "BIO_MB_022"
  subdomain: "MB"
  name: "Adenine-Thymine Base Pair Energy"
  formula: "\\Delta G_{AT} \\approx -1.0 \\text{ kcal/mol}"
  variables:
    deltaG_AT: "Gibbs free energy of AT pair"
  description: "Free energy change for AT base pair formation"

- formula_id: "BIO_MB_023"
  subdomain: "MB"
  name: "Guanine-Cytosine Base Pair Energy"
  formula: "\\Delta G_{GC} \\approx -1.4 \\text{ kcal/mol}"
  variables:
    deltaG_GC: "Gibbs free energy of GC pair"
  description: "Free energy change for GC base pair formation (3 H-bonds)"

- formula_id: "BIO_MB_024"
  subdomain: "MB"
  name: "DNA Hybridization - Gibbs Free Energy"
  formula: "\\Delta G = \\Delta H - T\\Delta S"
  variables:
    deltaG: "Gibbs free energy"
    deltaH: "Enthalpy change"
    T: "Temperature in Kelvin"
    deltaS: "Entropy change"
  description: "Thermodynamics of DNA duplex formation"

- formula_id: "BIO_MB_025"
  subdomain: "MB"
  name: "Annealing Temperature"
  formula: "T_a = T_m - 5"
  variables:
    T_a: "Annealing temperature"
    T_m: "Melting temperature"
  description: "Practical annealing temperature for PCR"

- formula_id: "BIO_MB_026"
  subdomain: "MB"
  name: "Oligo Concentration"
  formula: "C = \\frac{A_{260} \\times 33}{1000}"
  variables:
    C: "Oligo concentration in uM"
    A_260: "Absorbance at 260 nm"
    33: "Conversion factor"
  description: "DNA oligonucleotide concentration from absorbance"

- formula_id: "BIO_MB_027"
  subdomain: "MB"
  name: "Nucleotide Molar Absorbance"
  formula: "\\epsilon_{260} = 33,000 \\text{ L mol}^{-1} \\text{ cm}^{-1}"
  variables:
    epsilon_260: "Molar extinction coefficient"
  description: "Extinction coefficient for single-stranded DNA"

- formula_id: "BIO_MB_028"
  subdomain: "MB"
  name: "Protein Concentration - Bradford"
  formula: "Protein = (A_{595} - A_{blank}) \\times slope^{-1}"
  variables:
    Protein: "Protein concentration"
    A_595: "Absorbance at 595 nm"
    A_blank: "Blank absorbance"
    slope: "Calibration slope"
  description: "Protein concentration from Bradford assay"

- formula_id: "BIO_MB_029"
  subdomain: "MB"
  name: "Bradford Assay - Protein Mass"
  formula: "m_{protein} = C_{protein} \\times V_{sample}"
  variables:
    m_protein: "Mass of protein"
    C_protein: "Protein concentration"
    V_sample: "Sample volume"
  description: "Total protein mass in sample"

- formula_id: "BIO_MB_030"
  subdomain: "MB"
  name: "Translation Initiation Rate"
  formula: "TIR = \\frac{k_{cat} [eIF]}{K_m + [eIF]}"
  variables:
    TIR: "Translation initiation rate"
    k_cat: "Catalytic rate constant"
    eIF: "Initiation factor concentration"
    K_m: "Michaelis constant"
  description: "Rate of translation initiation"

- formula_id: "BIO_MB_031"
  subdomain: "MB"
  name: "DNA Replication Rate"
  formula: "v = \\frac{N_{bp}}{T_{rep}}"
  variables:
    v: "Replication rate"
    N_bp: "Number of base pairs"
    T_rep: "Replication time"
  description: "Average DNA synthesis rate"

- formula_id: "BIO_MB_032"
  subdomain: "MB"
  name: "Replication Fork Speed"
  formula: "v_{fork} = \\frac{N_{bp}}{2 \\times T_{rep}}"
  variables:
    v_fork: "Replication fork speed"
    N_bp: "Genome size in base pairs"
    T_rep: "Total replication time"
  description: "Speed of individual replication fork"

- formula_id: "BIO_MB_033"
  subdomain: "MB"
  name: "Okazaki Fragment Length"
  formula: "L = v_{pol} \\times T_{ok}"
  variables:
    L: "Okazaki fragment length"
    v_pol: "DNA polymerase rate"
    T_ok: "Okazaki fragment synthesis time"
  description: "Length of Okazaki fragments"

- formula_id: "BIO_MB_034"
  subdomain: "MB"
  name: "Transcription Elongation Rate"
  formula: "v_{txn} = \\frac{L_{gene}}{T_{txn}}"
  variables:
    v_txn: "Transcription rate"
    L_gene: "Gene length in nucleotides"
