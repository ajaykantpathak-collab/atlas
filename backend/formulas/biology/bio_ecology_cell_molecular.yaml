    k_{-1}: "ES dissociation rate"
    k_2: "Catalytic rate"
  description: "Time constant for approach to steady state"

- formula_id: "BIO_EK_097"
  subdomain: "EK"
  name: "Enzyme Inhibition - Progress Curve"
  formula: "[P]_t = V_s t + \\frac{V_i - V_s}{k_{obs}} (1 - e^{-k_{obs}t})"
