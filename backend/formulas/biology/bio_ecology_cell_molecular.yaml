- formula_id: "BIO_EK_098"
  subdomain: "EK"
  name: "Enzyme Inhibition - Reversible"
  formula: "v = \\frac{V_{max}}{1 + \\frac{[I]}{K_i}} \\times \\frac{[S]}{K_m + [S]}"
  variables:
    v: "Velocity"
    V_max: "Maximum velocity"
    I: "Inhibitor concentration"
    K_i: "Inhibition constant"
    S: "Substrate concentration"
    K_m: "Michaelis constant"
  description: "Simple reversible inhibition"

- formula_id: "BIO_EK_099"
  subdomain: "EK"
  name: "Enzyme Inhibition - Progress Curve"
  formula: "\\frac{[P]_t}{V_s} = t + \\frac{V_i - V_s}{V_s k_{obs}}(1 - e^{-k_{obs}t})"
  variables:
    P_t: "Product at time t"
    V_s: "Steady-state velocity"
    V_i: "Initial velocity"
    k_obs: "Observed rate constant"
    t: "Time"
  description: "Progress curve for time-dependent inhibition"

- formula_id: "BIO_EK_100"
  subdomain: "EK"
  name: "Enzyme Inhibition - Linear Progress"
  formula: "[P]_t = V_{app} t + C"
  variables:
    P_t: "Product at time t"
    V_app: "Apparent velocity"
    C: "Intercept"
    t: "Time"
  description: "Linear product formation after burst"

- formula_id: "BIO_EK_101"
  subdomain: "EK"
  name: "Enzyme Inactivation - Time Course"
  formula: "\\frac{[E]_t}{[E]_0} = e^{-k_{inact} [I] t}"
  variables:
    E_t: "Active enzyme at time t"
    E_0: "Initial active enzyme"
    k_inact: "Inactivation rate constant"
    I: "Inhibitor concentration"
    t: "Time"
  description: "Exponential enzyme inactivation"

- formula_id: "BIO_EK_102"
  subdomain: "EK"
  name: "Kitz-Wilson Plot"
  formula: "\\frac{1}{k_{obs}} = \\frac{K_I}{k_{inact}} \\frac{1}{[I]} + \\frac{1}{k_{inact}}"
  variables:
    k_obs: "Observed inactivation rate"
    K_I: "Inhibitor dissociation constant"
    k_inact: "Maximum inactivation rate"
    I: "Inhibitor concentration"
  description: "Determining k_inact and K_I for time-dependent inhibitors"

- formula_id: "BIO_EK_103"
  subdomain: "EK"
  name: "Morrison Equation - Tight Binding"
  formula: "v = \\frac{V_{max}}{2[E]_0} \\left([I]_0 + [E]_0 + K_i - \\sqrt{([I]_0 + [E]_0 + K_i)^2 - 4[I]_0[E]_0}\\right)"
  variables:
    v: "Velocity"
    V_max: "Maximum velocity"
    E_0: "Enzyme concentration"
    I_0: "Inhibitor concentration"
    K_i: "Inhibition constant"
  description: "Velocity with tight-binding inhibitor"

- formula_id: "BIO_EK_104"
  subdomain: "EK"
  name: "Substrate Cycling - futile"
  formula: "J = \\frac{V_{max} V_{max}^{'} ([S] - [P]/K_{eq})}{V_{max} K_m + V_{max}^{'} [S] + V_{max} [S] + V_{max}^{'} K_m^{'}}"
