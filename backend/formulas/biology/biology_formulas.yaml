      name: "urine_PAH_concentration"
      unit: "mg/mL"
      dimensional_formula: "[M][L]^{-3}"
      quantity_type: "concentration"
    - symbol: "V"
      name: "urine_flow_rate"
      unit: "mL/min"
      dimensional_formula: "[L][T]^{-1}"
      quantity_type: "flow_rate"
    - symbol: "P_{PAH}"
      name: "plasma_PAH_concentration"
      unit: "mg/mL"
      dimensional_formula: "[M][L]^{-3}"
