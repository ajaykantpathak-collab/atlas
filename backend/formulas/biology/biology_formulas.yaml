  grade_range: ["class12", "undergraduate", "graduate"]
  chapter: "Renal System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RENAL", "BIO_CRCL"]

- formula_id: "BIO_PHYSIO_019"
  name: "Filtration Fraction (FF)"
  latex: "FF = \\frac{GFR}{RPF}"
  variables:
    - symbol: "FF"
      name: "filtration_fraction"
      unit: ""
      dimensional_formula: ""
      quantity_type: "ratio"
