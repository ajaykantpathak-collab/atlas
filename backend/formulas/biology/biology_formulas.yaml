      unit: ""
      dimensional_formula: ""
      quantity_type: "fraction"
  preconditions: ["RPF_known", "hematocrit_known"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Renal System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RENAL", "BIO_RBF"]

- formula_id: "BIO_PHYSIO_022"
