  concept_tags: ["BIO_GEN", "BIO_TESTCROSS"]

- formula_id: "BIO_GEN_004"
  name: "Trihybrid Cross Ratio (27:9:9:9:3:3:3:1)"
  latex: "P(AaBbCc \\times AaBbCc) = 27 A\_B\_C\_ : 9 A\_B\_cc : 9 A\_bbC\_ : 9 aaB\_C\_ : 3 A\_bbcc : 3 aaB\_cc : 3 aabbC\_ : 1 aabbcc"
  variables: []
  preconditions: ["three_independent_genes", "complete_dominance"]
