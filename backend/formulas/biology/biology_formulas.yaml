- formula_id: "BIO_PHYSIO_013"
  name: "Alveolar Gas Equation"
  latex: "P_{A\\text{O}_2} = F_{i\\text{O}_2}(P_B - P_{H\\text{2O}}) - \\frac{P_{a\\text{CO}_2}}{R}"
  variables:
    - symbol: "P_{A\\text{O}_2}"
      name: "alveolar_oxygen_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "F_{i\\text{O}_2}"
      name: "inspired_oxygen_fraction"
      unit: ""
      dimensional_formula: ""
      quantity_type: "fraction"
    - symbol: "P_B"
      name: "barometric_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "P_{H\\text{2O}}"
      name: "water_vapor_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "P_{a\\text{CO}_2}"
      name: "arterial_CO2_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "R"
      name: "respiratory_quotient"
      unit: ""
      dimensional_formula: ""
      quantity_type: "ratio"
  preconditions: ["barometric_pressure_known", "arterial_blood_gas_available"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Respiratory System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RESP", "BIO_ALVEOLAR_GAS"]

- formula_id: "BIO_PHYSIO_014"
  name: "Alveolar-Arterial Oxygen Gradient (A-a Gradient)"
  latex: "A-a \\text{ gradient} = P_{A\\text{O}_2} - P_{a\\text{O}_2}"
  variables:
    - symbol: "P_{A\\text{O}_2}"
      name: "alveolar_O2_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "P_{a\\text{O}_2}"
      name: "arterial_O2_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
  preconditions: ["ABG_results", "alveolar_calculation_done"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Respiratory System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RESP", "BIO_AA_GRADIENT"]

- formula_id: "BIO_PHYSIO_015"
  name: "Bohr Equation for Dead Space"
  latex: "\\frac{V_D}{V_T} = \\frac{P_{a\\text{CO}_2} - P_{E\\text{CO}_2}}{P_{a\\text{CO}_2}}"
  variables:
    - symbol: "V_D"
      name: "dead_space_volume"
      unit: "mL"
      dimensional_formula: "[L]"
      quantity_type: "volume"
    - symbol: "V_T"
      name: "tidal_volume"
      unit: "mL"
      dimensional_formula: "[L]"
      quantity_type: "volume"
    - symbol: "P_{a\\text{CO}_2}"
      name: "arterial_CO2_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "P_{E\\text{CO}_2}"
      name: "mixed_expired_CO2_partial_pressure"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
  preconditions: ["capnography_data", "arterial_blood_gas"]
  grade_range: ["graduate", "phd"]
  chapter: "Respiratory System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RESP", "BIO_BOHR"]

- formula_id: "BIO_PHYSIO_016"
  name: "Fick's Law for Pulmonary Diffusion"
  latex: "\\dot{V}_{gas} = \\frac{A \\cdot D \\cdot (P_1 - P_2)}{T}"
  variables:
    - symbol: "\\dot{V}_{gas}"
      name: "gas_transfer_rate"
      unit: "mL/min"
      dimensional_formula: "[L][T]^{-1}"
      quantity_type: "flow_rate"
    - symbol: "A"
      name: "surface_area"
      unit: "m^2"
      dimensional_formula: "[L]^2"
      quantity_type: "area"
    - symbol: "D"
      name: "diffusion_coefficient"
      unit: "mL/min/mmHg/m^2"
      dimensional_formula: ""
      quantity_type: "diffusion_coefficient"
    - symbol: "P_1"
      name: "partial_pressure_alveolar_side"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "P_2"
      name: "partial_pressure_capillary_side"
      unit: "mmHg"
      dimensional_formula: "[M][L]^{-1}[T]^{-2}"
      quantity_type: "pressure"
    - symbol: "T"
      name: "membrane_thickness"
      unit: "cm"
      dimensional_formula: "[L]"
      quantity_type: "length"
  preconditions: ["diffusion_conditions_known"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Respiratory System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RESP", "BIO_FICK_DIFF"]

- formula_id: "BIO_PHYSIO_017"
  name: "Glomerular Filtration Rate (GFR)"
  latex: "GFR = \\frac{U_{cr} \\times V}{P_{cr}}"
  variables:
    - symbol: "U_{cr}"
      name: "urine_creatinine_concentration"
      unit: "mg/dL"
      dimensional_formula: "[M][L]^{-3}"
      quantity_type: "concentration"
