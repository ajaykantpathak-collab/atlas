  chapter: "Nervous System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_NERNST", "BIO_MEMBRANE"]

- formula_id: "BIO_PHYSIO_027"
  name: "Goldman-Hodgkin-Katz (GHK) Voltage Equation"
  latex: "V_m = \\frac{RT}{F} \\ln\\frac{P_{K}[K^+]_o + P_{Na}[Na^+]_o + P_{Cl}[Cl^-]_i}{P_{K}[K^+]_i + P_{Na}[Na^+]_i + P_{Cl}[Cl^-]_o}"
  variables:
    - symbol: "V_m"
      name: "resting_membrane_potential"
      unit: "mV"
      dimensional_formula: "[M][L]^2[T]^{-3}[I]^{-1}"
      quantity_type: "potential"
    - symbol: "P_{K}"
      name: "potassium_permeability"
      unit: ""
      dimensional_formula: ""
      quantity_type: "permeability"
    - symbol: "P_{Na}"
      name: "sodium_permeability"
      unit: ""
      dimensional_formula: ""
      quantity_type: "permeability"
    - symbol: "P_{Cl}"
      name: "chloride_permeability"
      unit: ""
      dimensional_formula: ""
      quantity_type: "permeability"
  preconditions: ["ion_concentrations_and_permeabilities_known"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Nervous System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_GHK", "BIO_MEMBRANE"]

- formula_id: "BIO_PHYSIO_028"
  name: "Nernst Equation at 37C (Simplified)"
