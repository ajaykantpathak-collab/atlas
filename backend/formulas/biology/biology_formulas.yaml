      unit: "mV"
      dimensional_formula: "[M][L]^2[T]^{-3}[I]^{-1}"
      quantity_type: "potential"
    - symbol: "R"
      name: "gas_constant"
      unit: "J/(mol K)"
      dimensional_formula: "[M][L]^2[T]^{-2}[\\Theta]^{-1}[mol]^{-1}"
      quantity_type: "constant"
    - symbol: "T"
      name: "absolute_temperature"
      unit: "K"
      dimensional_formula: "[\\Theta]"
      quantity_type: "temperature"
    - symbol: "z"
      name: "ion_valence"
      unit: ""
      dimensional_formula: ""
      quantity_type: "dimensionless"
    - symbol: "F"
      name: "Faraday_constant"
      unit: "C/mol"
      dimensional_formula: "[I][T][mol]^{-1}"
      quantity_type: "constant"
    - symbol: "[ion]_{out}"
      name: "extracellular_ion_concentration"
      unit: "mol/L"
      dimensional_formula: "[mol][L]^{-3}"
      quantity_type: "concentration"
    - symbol: "[ion]_{in}"
      name: "intracellular_ion_concentration"
