- formula_id: "BIO_GEN_001"
  name: "Mendel's Law of Segregation (Monohybrid 3:1 ratio)"
  latex: "P(Gg \\times Gg) = \\frac{1}{4} GG + \\frac{1}{2} Gg + \\frac{1}{4} gg"
  variables:
    - symbol: "GG"
      name: "homozygous_dominant"
      unit: ""
      dimensional_formula: ""
      quantity_type: "probability"
    - symbol: "Gg"
      name: "heterozygous"
      unit: ""
      dimensional_formula: ""
      quantity_type: "probability"
    - symbol: "gg"
      name: "homozygous_recessive"
      unit: ""
      dimensional_formula: ""
      quantity_type: "probability"
  preconditions: ["single_gene", "complete_dominance", "heterozygous_parents"]
  grade_range: ["class8", "class10", "class12", "neet", "undergraduate"]
  chapter: "Mendelian Genetics"
  subject: "biology"
  concept_tags: ["BIO_GEN", "BIO_MENDEL"]

- formula_id: "BIO_GEN_002"
  name: "Dihybrid Cross Ratio (9:3:3:1)"
  latex: "P(RrYy \\times RrYy) = \\frac{9}{16} R\_Y\_ + \\frac{3}{16} R\_yy + \\frac{3}{16} rrY\_ + \\frac{1}{16} rryy"
  variables:
    - symbol: "R\_"
      name: "dominant_first_trait"
      unit: ""
      dimensional_formula: ""
      quantity_type: "probability"
    - symbol: "Y\_"
      name: "dominant_second_trait"
      unit: ""
      dimensional_formula: ""
      quantity_type: "probability"
  preconditions: ["two_independent_genes", "complete_dominance", "dihybrid_heterozygotes"]
  grade_range: ["class10", "class12", "neet", "undergraduate"]
  chapter: "Mendelian Genetics"
  subject: "biology"
  concept_tags: ["BIO_GEN", "BIO_MENDEL", "BIO_DIHYBRID"]

- formula_id: "BIO_GEN_003"
  name: "Testcross Ratio (Backcross 1:1)"
  latex: "P(Aa \\times aa) = \\frac{1}{2} Aa + \\frac{1}{2} aa"
  variables:
