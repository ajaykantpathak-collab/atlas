- formula_id: "BIO_PHYSIO_025"
  name: "Fick Principle for Cardiac Output"
  latex: "CO = \\frac{\\dot{V}_{O_2}}{C_{a\\text{O}_2} - C_{v\\text{O}_2}}"
  variables:
    - symbol: "CO"
