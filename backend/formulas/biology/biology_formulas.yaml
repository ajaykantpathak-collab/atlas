- formula_id: "BIO_PHYSIO_026"
  name: "Nernst Equation for Membrane Potential"
  latex: "E_{ion} = \\frac{RT}{zF} \\ln\\frac{[ion]_{out}}{[ion]_{in}}"
  variables:
