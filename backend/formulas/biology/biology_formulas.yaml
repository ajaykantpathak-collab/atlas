      unit: "mL/min"
      dimensional_formula: "[L][T]^{-1}"
      quantity_type: "flow_rate"
    - symbol: "P_{cr}"
      name: "plasma_creatinine_concentration"
      unit: "mg/dL"
      dimensional_formula: "[M][L]^{-3}"
      quantity_type: "concentration"
  preconditions: ["24h_urine_collection", "plasma_sample"]
  grade_range: ["undergraduate", "graduate"]
  chapter: "Renal System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RENAL", "BIO_GFR"]

- formula_id: "BIO_PHYSIO_018"
  name: "Creatinine Clearance (CrCl)"
  latex: "CrCl = \\frac{U_{cr} \\times V}{P_{cr}}"
  variables:
    - symbol: "U_{cr}"
      name: "urine_creatinine_concentration"
      unit: "mg/dL"
      dimensional_formula: "[M][L]^{-3}"
      quantity_type: "concentration"
    - symbol: "V"
      name: "urine_volume_per_time"
      unit: "mL/min"
      dimensional_formula: "[L][T]^{-1}"
      quantity_type: "flow_rate"
    - symbol: "P_{cr}"
      name: "plasma_creatinine_concentration"
      unit: "mg/dL"
      dimensional_formula: "[M][L]^{-3}"
      quantity_type: "concentration"
