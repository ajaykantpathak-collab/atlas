      quantity_type: "potential"
  preconditions: ["passive_electrotonic_spread"]
  grade_range: ["graduate", "phd"]
  chapter: "Nervous System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_NERVOUS", "BIO_CABLE_EQ"]

- formula_id: "BIO_PHYSIO_033"
