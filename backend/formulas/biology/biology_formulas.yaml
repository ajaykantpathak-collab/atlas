  grade_range: ["undergraduate", "graduate"]
  chapter: "Renal System"
  subject: "biology"
  concept_tags: ["BIO_PHYSIO", "BIO_RENAL", "BIO_FF"]

- formula_id: "BIO_PHYSIO_020"
  name: "Renal Plasma Flow (RPF) from PAH Clearance"
  latex: "RPF = \\frac{U_{PAH} \\times V}{P_{PAH}}"
  variables:
    - symbol: "RPF"
      name: "renal_plasma_flow"
      unit: "mL/min"
      dimensional_formula: "[L][T]^{-1}"
      quantity_type: "flow_rate"
