  formula: 'N_2(t) = \frac{\lambda_1 N_{10}}{\lambda_2 - \lambda_1} (e^{-\lambda_1 t} - e^{-\lambda_2 t})'
  variables:
    - name: 'N_2(t)'
      description: number of daughter nuclei
    - name: 'N_{10}'
      description: initial parent nuclei
    - name: '\lambda_1, \lambda_2'
      description: parent and daughter decay constants
    - name: 't'
      description: time
  grade_range:
    - graduate
  description: Number of daughter nuclei in a two-step radioactive decay chain.

- formula_id: PHY_NUC_013
