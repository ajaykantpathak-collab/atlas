- formula_id: PHY_NUC_017
  name: Carbon Dating
  domain: PHY_NUC
  formula: 't = \frac{1}{\lambda} \ln\frac{N_0}{N}'
  variables:
    - name: 't'
      description: age of sample
    - name: '\lambda'
      description: decay constant of C-14
    - name: 'N_0'
      description: initial C-14 activity
    - name: 'N'
      description: current C-14 activity
  grade_range:
    - undergraduate
  description: Age determination from ratio of remaining C-14 to initial amount.

- formula_id: PHY_NUC_018
  name: Nuclear Radius
  domain: PHY_NUC
  formula: 'R = r_0 A^{1/3}'
  variables:
    - name: 'R'
      description: nuclear radius
    - name: 'r_0'
      description: radius parameter (~1.2 fm)
    - name: 'A'
      description: mass number
  grade_range:
    - undergraduate
  description: Nuclear radius proportional to cube root of mass number.

- formula_id: PHY_NUC_019
  name: Nuclear Density
  domain: PHY_NUC
  formula: '\rho = \frac{3 m_n}{4\pi r_0^3}'
  variables:
    - name: '\rho'
      description: average nuclear density
    - name: 'm_n'
      description: nucleon mass
    - name: 'r_0'
      description: radius parameter
  grade_range:
    - undergraduate
  description: Approximately constant density for all nuclei.

- formula_id: PHY_NUC_020
  name: Magic Numbers (Empirical Formula)
  domain: PHY_NUC
  formula: 'Z,N = 2, 8, 20, 28, 50, 82, 126'
  variables:
    - name: 'Z, N'
      description: proton and neutron numbers
  grade_range:
    - graduate
  description: Numbers of nucleons that complete nuclear shells leading to extra stability.

- formula_id: PHY_NUC_021
  name: Alpha Decay Energy (Geiger-Nuttall)
  domain: PHY_NUC
  formula: 'E_{\alpha} \propto \frac{1}{(\ln\lambda)^2}'
  variables:
    - name: 'E_{\alpha}'
      description: alpha particle kinetic energy
    - name: '\lambda'
      description: decay constant
  grade_range:
    - graduate
  description: Inversely related energy and decay constant in alpha decay.

- formula_id: PHY_NUC_022
  name: Beta Decay (Fermi Allowed)
  domain: PHY_NUC
  formula: '\lambda = \frac{G_F^2 |M_{fi}|^2}{2\pi^3} f(Q,Z)'
