  domain: PHY_NUC
  formula: 'Q \approx 200 \text{ MeV}'
  variables:
    - name: 'Q'
      description: total energy released per fission
  grade_range:
    - undergraduate
  description: Typical energy released in thermal neutron-induced fission of U-235.

- formula_id: PHY_NUC_014
  name: Fusion Energy Release (D-T)
  domain: PHY_NUC
  formula: 'Q = 17.6 \text{ MeV}'
  variables:
    - name: 'Q'
      description: energy released per fusion reaction
  grade_range:
    - undergraduate
  description: Energy released in deuterium-tritium fusion reaction.

- formula_id: PHY_NUC_015
  name: Coulomb Barrier
  domain: PHY_NUC
  formula: 'V_B = \frac{k Z_1 Z_2 e^2}{r_0 (A_1^{1/3} + A_2^{1/3})}'
  variables:
    - name: 'V_B'
      description: Coulomb barrier height
    - name: 'Z_1, Z_2'
      description: atomic numbers
    - name: 'A_1, A_2'
      description: mass numbers
    - name: 'e'
      description: elementary charge
    - name: 'k'
      description: Coulomb constant
    - name: 'r_0'
      description: nuclear radius parameter
  grade_range:
    - graduate
  description: Electrostatic repulsion energy two nuclei must overcome to fuse.

- formula_id: PHY_NUC_016
  name: Geiger-Nuttall Law
  domain: PHY_NUC
  formula: '\log_{10} \lambda = a + \frac{b}{\sqrt{E_{\alpha}}}'
  variables:
    - name: '\lambda'
      description: alpha decay constant
    - name: 'E_{\alpha}'
      description: alpha particle kinetic energy
    - name: 'a, b'
      description: empirical constants
  grade_range:
    - graduate
