---
- formula_id: PHY_OPT_G_001
  name: Law of Reflection
  domain: PHY_OPT_G
  formula: '\theta_i = \theta_r'
  variables:
    - name: '\theta_i'
      description: angle of incidence
    - name: '\theta_r'
      description: angle of reflection
  grade_range:
    - undergraduate
  description: Angle of incidence equals angle of reflection for a plane mirror.

- formula_id: PHY_OPT_G_002
  name: Snell Law
  domain: PHY_OPT_G
  formula: 'n_1 \sin\theta_1 = n_2 \sin\theta_2'
  variables:
    - name: 'n_1'
      description: refractive index of medium 1
    - name: 'n_2'
      description: refractive index of medium 2
    - name: '\theta_1'
      description: angle of incidence
    - name: '\theta_2'
      description: angle of refraction
  grade_range:
    - undergraduate
  description: Relates refraction angles to refractive indices at an interface.

- formula_id: PHY_OPT_G_003
  name: Critical Angle
  domain: PHY_OPT_G
  formula: '\sin\theta_c = n_2 / n_1'
  variables:
    - name: '\theta_c'
      description: critical angle for total internal reflection
    - name: 'n_1'
      description: refractive index of denser medium
    - name: 'n_2'
      description: refractive index of rarer medium
  grade_range:
    - undergraduate
  description: Angle of incidence beyond which total internal reflection occurs.

- formula_id: PHY_OPT_G_004
  name: Thin Lens Equation
  domain: PHY_OPT_G
  formula: '\frac{1}{f} = \frac{1}{d_o} + \frac{1}{d_i}'
  variables:
    - name: 'f'
      description: focal length
    - name: 'd_o'
      description: object distance
    - name: 'd_i'
      description: image distance
  grade_range:
    - undergraduate
  description: Relates object distance, image distance, and focal length for a thin lens.

- formula_id: PHY_OPT_G_005
  name: Lensmaker Equation
  domain: PHY_OPT_G
  formula: '\frac{1}{f} = (n-1)\left(\frac{1}{R_1} - \frac{1}{R_2}\right)'
  variables:
    - name: 'f'
      description: focal length
    - name: 'n'
      description: refractive index of lens material
    - name: 'R_1'
      description: radius of curvature of first surface
    - name: 'R_2'
      description: radius of curvature of second surface
  grade_range:
    - undergraduate
  description: Calculates focal length from lens geometry and material.

- formula_id: PHY_OPT_G_006
  name: Mirror Equation
  domain: PHY_OPT_G
  formula: '\frac{1}{f} = \frac{1}{d_o} + \frac{1}{d_i}'
  variables:
    - name: 'f'
      description: focal length (R/2 for spherical mirror)
    - name: 'd_o'
      description: object distance
    - name: 'd_i'
      description: image distance
  grade_range:
    - undergraduate
  description: Relates object and image distances for a spherical mirror.

- formula_id: PHY_OPT_G_007
  name: Lateral Magnification (Lens)
  domain: PHY_OPT_G
  formula: 'm = -\frac{d_i}{d_o}'
  variables:
    - name: 'm'
      description: magnification
    - name: 'd_i'
      description: image distance
    - name: 'd_o'
      description: object distance
  grade_range:
    - undergraduate
  description: Ratio of image height to object height for a lens.

- formula_id: PHY_OPT_G_008
  name: Lateral Magnification (Mirror)
  domain: PHY_OPT_G
  formula: 'm = -\frac{d_i}{d_o}'
  variables:
    - name: 'm'
      description: magnification
    - name: 'd_i'
      description: image distance
    - name: 'd_o'
      description: object distance
  grade_range:
    - undergraduate
  description: Ratio of image height to object height for a spherical mirror.

- formula_id: PHY_OPT_G_009
  name: Refractive Index
  domain: PHY_OPT_G
  formula: 'n = \frac{c}{v}'
  variables:
    - name: 'n'
      description: refractive index
    - name: 'c'
      description: speed of light in vacuum
    - name: 'v'
      description: speed of light in medium
  grade_range:
    - undergraduate
  description: Ratio of speed of light in vacuum to that in a medium.

- formula_id: PHY_OPT_G_010
  name: Prism Minimum Deviation
  domain: PHY_OPT_G
  formula: 'n = \frac{\sin\left(\frac{A + \delta_m}{2}\right)}{\sin\left(\frac{A}{2}\right)}'
  variables:
    - name: 'n'
      description: refractive index
    - name: 'A'
      description: prism apex angle
    - name: '\delta_m'
      description: angle of minimum deviation
  grade_range:
    - undergraduate
  description: Relates refractive index to prism angle and minimum deviation.

- formula_id: PHY_OPT_G_011
  name: Prism Deviation Angle
  domain: PHY_OPT_G
  formula: '\delta = \theta_1 + \theta_2 - A'
  variables:
    - name: '\delta'
      description: angle of deviation
    - name: '\theta_1'
      description: angle of incidence at first face
    - name: '\theta_2'
      description: angle of emergence at second face
    - name: 'A'
      description: prism apex angle
  grade_range:
    - undergraduate
  description: Total deviation of a ray passing through a prism.

- formula_id: PHY_OPT_G_012
  name: Numerical Aperture
  domain: PHY_OPT_G
  formula: 'NA = n \sin\theta'
  variables:
    - name: 'NA'
      description: numerical aperture
    - name: 'n'
      description: refractive index of immersion medium
    - name: '\theta'
      description: half-angle of maximum cone of light
  grade_range:
    - undergraduate
  description: Characterizes light-gathering ability of an optical system.

- formula_id: PHY_OPT_G_013
  name: Focal Length (Spherical Mirror)
  domain: PHY_OPT_G
  formula: 'f = \frac{R}{2}'
  variables:
    - name: 'f'
      description: focal length
    - name: 'R'
      description: radius of curvature of mirror
  grade_range:
    - undergraduate
  description: Focal length is half the radius of curvature for a spherical mirror.

- formula_id: PHY_OPT_G_014
  name: Power of Lens
  domain: PHY_OPT_G
  formula: 'P = \frac{1}{f}'
  variables:
    - name: 'P'
      description: optical power in diopters
    - name: 'f'
      description: focal length in meters
  grade_range:
    - undergraduate
  description: Reciprocal of focal length; measures converging or diverging strength.

- formula_id: PHY_OPT_G_015
  name: Longitudinal Spherical Aberration
  domain: PHY_OPT_G
  formula: 'LSA \approx \frac{h^2}{2R}\left(\frac{n-1}{n}\right)'
  variables:
    - name: 'LSA'
      description: longitudinal spherical aberration
    - name: 'h'
      description: ray height at lens
    - name: 'R'
      description: radius of curvature
    - name: 'n'
      description: refractive index
  grade_range:
    - graduate
  description: Axial displacement between paraxial and marginal foci due to spherical shape.

- formula_id: PHY_OPT_G_016
  name: Lateral Chromatic Aberration
  domain: PHY_OPT_G
  formula: 'LCA \approx f \cdot \frac{\Delta n}{n}'
  variables:
    - name: 'LCA'
      description: lateral chromatic aberration
    - name: 'f'
      description: focal length
    - name: '\Delta n'
      description: dispersion (change in refractive index)
    - name: 'n'
      description: mean refractive index
  grade_range:
    - graduate
  description: Variation of image height with wavelength due to dispersion.

- formula_id: PHY_OPT_G_017
  name: Compound Microscope Magnification
  domain: PHY_OPT_G
  formula: 'M = M_o \cdot M_e = -\frac{L}{f_o} \cdot \frac{D}{f_e}'
  variables:
    - name: 'M'
      description: total magnification
    - name: 'M_o'
      description: objective magnification
    - name: 'M_e'
      description: eyepiece magnification
    - name: 'L'
      description: tube length
    - name: 'f_o'
      description: focal length of objective
    - name: 'f_e'
      description: focal length of eyepiece
    - name: 'D'
      description: near point distance (25 cm)
  grade_range:
    - undergraduate
  description: Total magnification of a compound microscope.

- formula_id: PHY_OPT_G_018
  name: Astronomical Telescope Magnification
  domain: PHY_OPT_G
  formula: 'M = -\frac{f_o}{f_e}'
  variables:
    - name: 'M'
      description: angular magnification
    - name: 'f_o'
      description: focal length of objective
    - name: 'f_e'
      description: focal length of eyepiece
  grade_range:
    - undergraduate
  description: Angular magnification of an astronomical (Keplerian) telescope.

- formula_id: PHY_OPT_G_019
  name: Galilean Telescope Magnification
  domain: PHY_OPT_G
  formula: 'M = -\frac{f_o}{f_e}'
  variables:
    - name: 'M'
      description: angular magnification
    - name: 'f_o'
      description: focal length of objective
    - name: 'f_e'
      description: focal length of eyepiece (negative for diverging lens)
  grade_range:
    - undergraduate
  description: Angular magnification of a Galilean telescope with diverging eyepiece.

- formula_id: PHY_OPT_G_020
  name: Resolving Power (Rayleigh Criterion)
  domain: PHY_OPT_G
  formula: '\theta_{min} = 1.22 \frac{\lambda}{D}'
  variables:
    - name: '\theta_{min}'
      description: minimum resolvable angular separation
    - name: '\lambda'
      description: wavelength of light
    - name: 'D'
      description: diameter of aperture
  grade_range:
    - undergraduate
  description: Minimum angular separation for resolving two point sources.

- formula_id: PHY_OPT_G_021
  name: Reflection Matrix (Paraxial)
  domain: PHY_OPT_G
  formula: 'M_R = \begin{pmatrix} 1 & 0 \\ -2/R & 1 \end{pmatrix}'
  variables:
    - name: 'R'
      description: radius of curvature of mirror
  grade_range:
    - graduate
  description: Ray transfer matrix for reflection from a spherical mirror.

- formula_id: PHY_OPT_G_022
  name: Refraction Matrix (Plane Interface)
  domain: PHY_OPT_G
  formula: 'M_{ref} = \begin{pmatrix} 1 & 0 \\ (n_1-n_2)/(R n_2) & n_1/n_2 \end{pmatrix}'
  variables:
    - name: 'n_1'
      description: refractive index before interface
    - name: 'n_2'
      description: refractive index after interface
    - name: 'R'
      description: radius of curvature
  grade_range:
    - graduate
  description: Ray transfer matrix for refraction at a spherical interface.

- formula_id: PHY_OPT_G_023
  name: Translation Matrix (Free Space)
  domain: PHY_OPT_G
  formula: 'M_T = \begin{pmatrix} 1 & d \\ 0 & 1 \end{pmatrix}'
  variables:
    - name: 'd'
      description: propagation distance
  grade_range:
    - graduate
  description: Ray transfer matrix for propagation through free space.

- formula_id: PHY_OPT_G_024
  name: Fresnel Equations (s-polarized reflectance)
  domain: PHY_OPT_G
  formula: 'r_s = \frac{n_1 \cos\theta_i - n_2 \cos\theta_t}{n_1 \cos\theta_i + n_2 \cos\theta_t}'
  variables:
    - name: 'r_s'
      description: s-polarized reflection coefficient
    - name: 'n_1, n_2'
      description: refractive indices
    - name: '\theta_i, \theta_t'
      description: incident and transmitted angles
  grade_range:
    - graduate
  description: Amplitude reflection coefficient for s-polarized light.

- formula_id: PHY_OPT_G_025
  name: Fresnel Equations (p-polarized reflectance)
  domain: PHY_OPT_G
  formula: 'r_p = \frac{n_2 \cos\theta_i - n_1 \cos\theta_t}{n_2 \cos\theta_i + n_1 \cos\theta_t}'
  variables:
    - name: 'r_p'
      description: p-polarized reflection coefficient
    - name: 'n_1, n_2'
      description: refractive indices
    - name: '\theta_i, \theta_t'
      description: incident and transmitted angles
  grade_range:
    - graduate
  description: Amplitude reflection coefficient for p-polarized light.

- formula_id: PHY_OPT_G_026
  name: Brewster Angle
  domain: PHY_OPT_G
  formula: '\tan\theta_B = \frac{n_2}{n_1}'
  variables:
    - name: '\theta_B'
      description: Brewster angle
    - name: 'n_1, n_2'
      description: refractive indices
  grade_range:
    - undergraduate
  description: Angle of incidence at which p-polarized light is fully transmitted.

- formula_id: PHY_OPT_G_027
  name: Thick Lens Equation
  domain: PHY_OPT_G
  formula: '\frac{1}{f} = (n-1)\left[\frac{1}{R_1} - \frac{1}{R_2} + \frac{(n-1)d}{n R_1 R_2}\right]'
  variables:
    - name: 'f'
      description: effective focal length
    - name: 'n'
      description: refractive index
    - name: 'R_1, R_2'
      description: radii of curvature
    - name: 'd'
      description: lens thickness
  grade_range:
    - graduate
  description: Focal length of a thick lens accounting for thickness.

- formula_id: PHY_OPT_G_028
  name: Cardinal Points (Front Focal Length)
  domain: PHY_OPT_G
  formula: 'f_F = -f \cdot \frac{n'}{n}'
  variables:
    - name: 'f_F'
      description: front focal length
    - name: 'f'
      description: effective focal length
    - name: 'n, n\''
      description: refractive indices of object and image spaces
  grade_range:
    - graduate
  description: Front focal length in terms of effective focal length and refractive indices.

- formula_id: PHY_OPT_G_029
  name: Spherical Aberration Coefficient
  domain: PHY_OPT_G
  formula: 'S_1 \approx \frac{h^4}{8 f^3}'
  variables:
    - name: 'S_1'
      description: primary spherical aberration coefficient
    - name: 'h'
      description: ray height
    - name: 'f'
      description: focal length
  grade_range:
    - phd
  description: Primary spherical aberration coefficient for a thin lens.

- formula_id: PHY_OPT_G_030
  name: System Matrix (Paraxial Optics)
  domain: PHY_OPT_G
  formula: 'M = M_N \cdots M_2 M_1 = \begin{pmatrix} A & B \\ C & D \end{pmatrix}'
  variables:
    - name: 'A, B, C, D'
      description: elements of the system matrix
  grade_range:
    - graduate
  description: Overall ray transfer matrix for a cascade of optical elements.

- formula_id: PHY_OPT_W_001
  name: Young Double Slit Interference
  domain: PHY_OPT_W
  formula: 'd \sin\theta = m\lambda'
  variables:
    - name: 'd'
      description: slit separation
    - name: '\theta'
      description: angle to m-th maximum
    - name: 'm'
      description: integer order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for constructive interference in Young double slit experiment.

- formula_id: PHY_OPT_W_002
  name: Single Slit Diffraction (First Minimum)
  domain: PHY_OPT_W
  formula: 'a \sin\theta = m\lambda'
  variables:
    - name: 'a'
      description: slit width
    - name: '\theta'
      description: angle to m-th minimum
    - name: 'm'
      description: nonzero integer order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for minima in single slit diffraction.

- formula_id: PHY_OPT_W_003
  name: Diffraction Grating Equation
  domain: PHY_OPT_W
  formula: 'd \sin\theta = m\lambda'
  variables:
    - name: 'd'
      description: grating spacing
    - name: '\theta'
      description: diffraction angle
    - name: 'm'
      description: diffraction order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for principal maxima in a diffraction grating.

- formula_id: PHY_OPT_W_004
  name: Grating Resolving Power
  domain: PHY_OPT_W
  formula: 'R = \frac{\lambda}{\Delta\lambda} = mN'
  variables:
    - name: 'R'
      description: resolving power
    - name: '\lambda'
      description: wavelength
    - name: '\Delta\lambda'
      description: minimum resolvable wavelength difference
    - name: 'm'
      description: diffraction order
    - name: 'N'
      description: total number of illuminated slits
  grade_range:
    - undergraduate
  description: Ability of a grating to separate close wavelengths.

- formula_id: PHY_OPT_W_005
  name: Bragg Law
  domain: PHY_OPT_W
  formula: '2d \sin\theta = m\lambda'
  variables:
    - name: 'd'
      description: interplanar spacing
    - name: '\theta'
      description: Bragg angle
    - name: 'm'
      description: integer order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for constructive interference from crystal planes.

- formula_id: PHY_OPT_W_006
  name: Phase Difference
  domain: PHY_OPT_W
  formula: '\Delta\phi = \frac{2\pi}{\lambda} \Delta x'
  variables:
    - name: '\Delta\phi'
      description: phase difference
    - name: '\lambda'
      description: wavelength
    - name: '\Delta x'
      description: path difference
  grade_range:
    - undergraduate
  description: Phase difference corresponding to a path difference.

- formula_id: PHY_OPT_W_007
  name: Path Difference
  domain: PHY_OPT_W
  formula: '\Delta x = d \sin\theta'
  variables:
    - name: '\Delta x'
      description: path difference between two slits
    - name: 'd'
      description: slit separation
    - name: '\theta'
      description: observation angle
  grade_range:
    - undergraduate
  description: Extra distance traveled by wave from one slit relative to another.

- formula_id: PHY_OPT_W_008
  name: Coherence Length
  domain: PHY_OPT_W
  formula: 'L_c = c \tau_c'
  variables:
    - name: 'L_c'
      description: coherence length
    - name: 'c'
      description: speed of light
    - name: '\tau_c'
      description: coherence time
  grade_range:
    - graduate
  description: Path difference over which interference fringes remain observable.

- formula_id: PHY_OPT_W_009
  name: Coherence Time
  domain: PHY_OPT_W
  formula: '\tau_c = \frac{1}{\Delta\nu}'
  variables:
    - name: '\tau_c'
      description: coherence time
    - name: '\Delta\nu'
      description: spectral linewidth (FWHM)
  grade_range:
    - graduate
  description: Time over which wave maintains predictable phase relationship.

- formula_id: PHY_OPT_W_010
  name: Michelson Interferometer Fringe Shift
  domain: PHY_OPT_W
  formula: 'N = \frac{2\Delta d}{\lambda}'
  variables:
    - name: 'N'
      description: number of fringes shifted
    - name: '\Delta d'
      description: mirror displacement
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Fringe count in Michelson interferometer when one mirror moves.

- formula_id: PHY_OPT_W_011
  name: Fabry-Perot Transmission (Airy Formula)
  domain: PHY_OPT_W
  formula: 'I_{trans} = \frac{I_0}{1 + F \sin^2(\delta/2)}'
  variables:
    - name: 'I_{trans}'
      description: transmitted intensity
    - name: 'I_0'
      description: incident intensity
    - name: 'F'
      description: coefficient of finesse
    - name: '\delta'
      description: phase difference per round trip
  grade_range:
    - graduate
  description: Transmission intensity of a Fabry-Perot etalon.

- formula_id: PHY_OPT_W_012
  name: Thin Film Interference (Constructive)
  domain: PHY_OPT_W
  formula: '2 n t \cos\theta_t = (m + \frac{1}{2})\lambda'
  variables:
    - name: 'n'
      description: film refractive index
    - name: 't'
      description: film thickness
    - name: '\theta_t'
      description: angle of transmission in film
    - name: 'm'
      description: integer order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for constructive interference in a thin film with phase reversal.

- formula_id: PHY_OPT_W_013
  name: Thin Film Interference (Destructive)
  domain: PHY_OPT_W
  formula: '2 n t \cos\theta_t = m\lambda'
  variables:
    - name: 'n'
      description: film refractive index
    - name: 't'
      description: film thickness
    - name: '\theta_t'
      description: angle of transmission in film
    - name: 'm'
      description: integer order
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Condition for destructive interference in a thin film with phase reversal.

- formula_id: PHY_OPT_W_014
  name: Newton Rings (Dark Ring Radius)
  domain: PHY_OPT_W
  formula: 'r_m = \sqrt{m\lambda R}'
  variables:
    - name: 'r_m'
      description: radius of m-th dark ring
    - name: 'm'
      description: integer order
    - name: '\lambda'
      description: wavelength
    - name: 'R'
      description: radius of curvature of lens
  grade_range:
    - undergraduate
  description: Radius of dark rings in Newton rings interference pattern.

- formula_id: PHY_OPT_W_015
  name: Fresnel Diffraction (Half-Period Zones)
  domain: PHY_OPT_W
  formula: 'A_m = \frac{\lambda}{2} \sqrt{m}'
  variables:
    - name: 'A_m'
      description: area of m-th half-period zone
    - name: '\lambda'
      description: wavelength
    - name: 'm'
      description: zone number
  grade_range:
    - graduate
  description: Area of successive half-period zones in Fresnel diffraction.

- formula_id: PHY_OPT_W_016
  name: Fraunhofer Diffraction (Single Slit Intensity)
  domain: PHY_OPT_W
  formula: 'I(\theta) = I_0 \left(\frac{\sin\beta}{\beta}\right)^2'
  variables:
    - name: 'I(\theta)'
      description: intensity at angle theta
    - name: 'I_0'
      description: central maximum intensity
    - name: '\beta'
      description: '(\pi a \sin\theta) / \lambda'
    - name: 'a'
      description: slit width
  grade_range:
    - undergraduate
  description: Angular intensity distribution for single slit Fraunhofer diffraction.

- formula_id: PHY_OPT_W_017
  name: Malus Law
  domain: PHY_OPT_W
  formula: 'I = I_0 \cos^2\theta'
  variables:
    - name: 'I'
      description: transmitted intensity
    - name: 'I_0'
      description: incident intensity
    - name: '\theta'
      description: angle between polarizer axes
  grade_range:
    - undergraduate
  description: Intensity of linearly polarized light after passing through a polarizer.

- formula_id: PHY_OPT_W_018
  name: Brewster Angle (Polarization)
  domain: PHY_OPT_W
  formula: '\tan\theta_B = \frac{n_2}{n_1}'
  variables:
    - name: '\theta_B'
      description: Brewster angle
    - name: 'n_1, n_2'
      description: refractive indices
  grade_range:
    - undergraduate
  description: Angle at which reflected light is perfectly polarized perpendicular to plane of incidence.

- formula_id: PHY_OPT_W_019
  name: Quarter Wave Plate Retardation
  domain: PHY_OPT_W
  formula: '\delta = \frac{2\pi}{\lambda} (n_e - n_o) t = \frac{\pi}{2}'
  variables:
    - name: '\delta'
      description: phase retardation
    - name: '\lambda'
      description: wavelength
    - name: 'n_e, n_o'
      description: extraordinary and ordinary refractive indices
    - name: 't'
      description: plate thickness
  grade_range:
    - graduate
  description: Thickness required to introduce a quarter wavelength phase shift.

- formula_id: PHY_OPT_W_020
  name: Birefringence
  domain: PHY_OPT_W
  formula: '\Delta n = n_e - n_o'
  variables:
    - name: '\Delta n'
      description: birefringence
    - name: 'n_e'
      description: extraordinary refractive index
    - name: 'n_o'
      description: ordinary refractive index
  grade_range:
    - undergraduate
  description: Difference between extraordinary and ordinary refractive indices in anisotropic media.

- formula_id: PHY_OPT_W_021
  name: Optical Activity (Specific Rotation)
  domain: PHY_OPT_W
  formula: '[\alpha] = \frac{\alpha}{l \cdot c}'
  variables:
    - name: '[\alpha]'
      description: specific rotation
    - name: '\alpha'
      description: observed rotation angle
    - name: 'l'
      description: path length
    - name: 'c'
      description: concentration
  grade_range:
    - graduate
  description: Rotation of plane of polarization by optically active substances.

- formula_id: PHY_OPT_W_022
  name: Polarization by Scattering
  domain: PHY_OPT_W
  formula: 'I_{\perp} = I_0 \sin^2\theta'
  variables:
    - name: 'I_{\perp}'
      description: intensity perpendicular to scattering plane
    - name: 'I_0'
      description: incident intensity
    - name: '\theta'
      description: scattering angle
  grade_range:
    - graduate
  description: Intensity of scattered light polarized perpendicular to scattering plane.

- formula_id: PHY_OPT_W_023
  name: Interference Fringe Spacing
  domain: PHY_OPT_W
  formula: '\Delta y = \frac{\lambda D}{d}'
  variables:
    - name: '\Delta y'
      description: fringe spacing on screen
    - name: '\lambda'
      description: wavelength
    - name: 'D'
      description: distance to screen
    - name: 'd'
      description: slit separation
  grade_range:
    - undergraduate
  description: Spacing between adjacent interference fringes on a distant screen.

- formula_id: PHY_OPT_W_024
  name: Coherence Area
  domain: PHY_OPT_W
  formula: 'A_c = \lambda^2 z^2 / A_{source}'
  variables:
    - name: 'A_c'
      description: coherence area
    - name: '\lambda'
      description: wavelength
    - name: 'z'
      description: propagation distance
    - name: 'A_{source}'
      description: source area
  grade_range:
    - phd
  description: Transverse area over which light maintains coherence.

- formula_id: PHY_OPT_W_025
  name: Degree of Coherence (Complex)
  domain: PHY_OPT_W
  formula: '\gamma_{12} = \frac{\langle E_1^* E_2 \rangle}{\sqrt{\langle |E_1|^2 \rangle \langle |E_2|^2 \rangle}}'
  variables:
    - name: '\gamma_{12}'
      description: complex degree of coherence
    - name: 'E_1, E_2'
      description: electric fields at two points
  grade_range:
    - phd
  description: Complex degree of coherence between two points in a wave field.

- formula_id: PHY_OPT_W_026
  name: Hanbury Brown-Twiss Correlation
  domain: PHY_OPT_W
  formula: 'G^{(2)}(\tau) = \langle I(t) I(t+\tau) \rangle'
  variables:
    - name: 'G^{(2)}(\tau)'
      description: second-order correlation function
    - name: 'I(t)'
      description: intensity at time t
    - name: '\tau'
      description: time delay
  grade_range:
    - phd
  description: Intensity correlation function used in photon statistics and astronomy.

- formula_id: PHY_MOD_001
  name: Photoelectric Effect
  domain: PHY_MOD
  formula: 'K_{max} = h\nu - \phi'
  variables:
    - name: 'K_{max}'
      description: maximum kinetic energy of ejected electron
    - name: 'h'
      description: Planck constant
    - name: '\nu'
      description: frequency of incident light
    - name: '\phi'
      description: work function
  grade_range:
    - undergraduate
  description: Einstein photoelectric equation relating photon energy to electron kinetic energy.

- formula_id: PHY_MOD_002
  name: Compton Scattering (Wavelength Shift)
  domain: PHY_MOD
  formula: '\Delta\lambda = \lambda' - \lambda = \frac{h}{m_e c}(1 - \cos\theta)'
  variables:
    - name: '\Delta\lambda'
      description: change in wavelength
    - name: '\lambda, \lambda\''
      description: incident and scattered wavelengths
    - name: 'h'
      description: Planck constant
    - name: 'm_e'
      description: electron rest mass
    - name: 'c'
      description: speed of light
    - name: '\theta'
      description: scattering angle
  grade_range:
    - undergraduate
  description: Wavelength increase of photon scattered by a free electron.

- formula_id: PHY_MOD_003
  name: Compton Scattering (Energy-Angle)
  domain: PHY_MOD
  formula: 'E_{\gamma}' = \frac{E_{\gamma}}{1 + \frac{E_{\gamma}}{m_e c^2}(1 - \cos\theta)}'
  variables:
    - name: 'E_{\gamma}, E_{\gamma}\''
      description: incident and scattered photon energies
    - name: 'm_e'
      description: electron rest mass
    - name: 'c'
      description: speed of light
    - name: '\theta'
      description: scattering angle
  grade_range:
    - graduate
  description: Energy of scattered photon in Compton effect expressed in terms of incident energy.

- formula_id: PHY_MOD_004
  name: de Broglie Wavelength
  domain: PHY_MOD
  formula: '\lambda = \frac{h}{p}'
  variables:
    - name: '\lambda'
      description: de Broglie wavelength
    - name: 'h'
      description: Planck constant
    - name: 'p'
      description: momentum
  grade_range:
    - undergraduate
  description: Wavelength associated with a moving particle.

- formula_id: PHY_MOD_005
  name: de Broglie Wavelength (Relativistic)
  domain: PHY_MOD
  formula: '\lambda = \frac{h}{\gamma m_0 v}'
  variables:
    - name: '\lambda'
      description: de Broglie wavelength
    - name: 'h'
      description: Planck constant
    - name: '\gamma'
      description: Lorentz factor
    - name: 'm_0'
      description: rest mass
    - name: 'v'
      description: velocity
  grade_range:
    - graduate
  description: de Broglie wavelength including relativistic momentum.

- formula_id: PHY_MOD_006
  name: Heisenberg Uncertainty (Position-Momentum)
  domain: PHY_MOD
  formula: '\Delta x \Delta p \geq \frac{\hbar}{2}'
  variables:
    - name: '\Delta x'
      description: position uncertainty
    - name: '\Delta p'
      description: momentum uncertainty
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - undergraduate
  description: Fundamental limit on simultaneous knowledge of position and momentum.

- formula_id: PHY_MOD_007
  name: Heisenberg Uncertainty (Energy-Time)
  domain: PHY_MOD
  formula: '\Delta E \Delta t \geq \frac{\hbar}{2}'
  variables:
    - name: '\Delta E'
      description: energy uncertainty
    - name: '\Delta t'
      description: time uncertainty
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - undergraduate
  description: Energy-time uncertainty relation governing virtual particles and linewidths.

- formula_id: PHY_MOD_008
  name: Bohr Model Energy Levels
  domain: PHY_MOD
  formula: 'E_n = -\frac{13.6 \text{ eV}}{n^2}'
  variables:
    - name: 'E_n'
      description: energy of nth orbit
    - name: 'n'
      description: principal quantum number
  grade_range:
    - undergraduate
  description: Quantized energy levels of hydrogen atom in Bohr model.

- formula_id: PHY_MOD_009
  name: Bohr Model Radius
  domain: PHY_MOD
  formula: 'r_n = a_0 n^2'
  variables:
    - name: 'r_n'
      description: radius of nth orbit
    - name: 'a_0'
      description: Bohr radius (0.529 Angstrom)
    - name: 'n'
      description: principal quantum number
  grade_range:
    - undergraduate
  description: Quantized orbital radii in Bohr model of hydrogen.

- formula_id: PHY_MOD_010
  name: Rydberg Formula
  domain: PHY_MOD
  formula: '\frac{1}{\lambda} = R_H \left(\frac{1}{n_1^2} - \frac{1}{n_2^2}\right)'
  variables:
    - name: '\lambda'
      description: emitted wavelength
    - name: 'R_H'
      description: Rydberg constant for hydrogen
    - name: 'n_1, n_2'
      description: principal quantum numbers
  grade_range:
    - undergraduate
  description: Wavelengths of spectral lines in hydrogen emission.

- formula_id: PHY_MOD_011
  name: Planck Law (Photon Energy)
  domain: PHY_MOD
  formula: 'E = h\nu'
  variables:
    - name: 'E'
      description: photon energy
    - name: 'h'
      description: Planck constant
    - name: '\nu'
      description: frequency
  grade_range:
    - undergraduate
  description: Energy of a photon proportional to its frequency.

- formula_id: PHY_MOD_012
  name: Stefan-Boltzmann Law
  domain: PHY_MOD
  formula: 'j^* = \sigma T^4'
  variables:
    - name: 'j^*'
      description: total radiant exitance
    - name: '\sigma'
      description: Stefan-Boltzmann constant
    - name: 'T'
      description: absolute temperature
  grade_range:
    - undergraduate
  description: Total energy radiated per unit area by a blackbody.

- formula_id: PHY_MOD_013
  name: Wien Displacement Law
  domain: PHY_MOD
  formula: '\lambda_{max} T = b'
  variables:
    - name: '\lambda_{max}'
      description: wavelength of peak emission
    - name: 'T'
      description: absolute temperature
    - name: 'b'
      description: Wien displacement constant
  grade_range:
    - undergraduate
  description: Wavelength of maximum emission is inversely proportional to temperature.

- formula_id: PHY_MOD_014
  name: Compton Wavelength
  domain: PHY_MOD
  formula: '\lambda_c = \frac{h}{m_e c}'
  variables:
    - name: '\lambda_c'
      description: Compton wavelength of electron
    - name: 'h'
      description: Planck constant
    - name: 'm_e'
      description: electron rest mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Characteristic wavelength scale for Compton scattering.

- formula_id: PHY_MOD_015
  name: Pair Production Threshold
  domain: PHY_MOD
  formula: 'E_{\gamma} \geq 2 m_e c^2'
  variables:
    - name: 'E_{\gamma}'
      description: photon energy
    - name: 'm_e'
      description: electron rest mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Minimum photon energy required to produce an electron-positron pair.

- formula_id: PHY_MOD_016
  name: Particle in a Box (1D Energy)
  domain: PHY_MOD
  formula: 'E_n = \frac{n^2 h^2}{8mL^2}'
  variables:
    - name: 'E_n'
      description: energy of nth level
    - name: 'n'
      description: positive integer quantum number
    - name: 'h'
      description: Planck constant
    - name: 'm'
      description: particle mass
    - name: 'L'
      description: box length
  grade_range:
    - undergraduate
  description: Quantized energy levels of a particle in a one-dimensional infinite potential well.

- formula_id: PHY_MOD_017
  name: Particle in a Box (3D Energy)
  domain: PHY_MOD
  formula: 'E_{n_x,n_y,n_z} = \frac{h^2}{8m}\left(\frac{n_x^2}{L_x^2} + \frac{n_y^2}{L_y^2} + \frac{n_z^2}{L_z^2}\right)'
  variables:
    - name: 'E_{n_x,n_y,n_z}'
      description: energy of quantum state
    - name: 'n_x, n_y, n_z'
      description: quantum numbers
    - name: 'L_x, L_y, L_z'
      description: box dimensions
  grade_range:
    - undergraduate
  description: Quantized energy levels of a particle in a three-dimensional box.

- formula_id: PHY_MOD_018
  name: Franck-Hertz Quantization
  domain: PHY_MOD
  formula: 'eV = E_{n+1} - E_n'
  variables:
    - name: 'V'
      description: accelerating voltage at current drop
    - name: 'E_n'
      description: atomic energy level
    - name: 'e'
      description: electron charge
  grade_range:
    - undergraduate
  description: Voltage difference corresponding to atomic excitation energy in Franck-Hertz experiment.

- formula_id: PHY_MOD_019
  name: Millikan Oil Drop (Charge Quantization)
  domain: PHY_MOD
  formula: 'q = n e = \frac{mg}{E}'
  variables:
    - name: 'q'
      description: charge on oil drop
    - name: 'n'
      description: integer number of electrons
    - name: 'e'
      description: elementary charge
    - name: 'm'
      description: mass of drop
    - name: 'g'
      description: gravitational acceleration
    - name: 'E'
      description: electric field
  grade_range:
    - undergraduate
  description: Charge on oil drop in Millikan experiment quantized in units of e.

- formula_id: PHY_MOD_020
  name: Rutherford Scattering (Impact Parameter)
  domain: PHY_MOD
  formula: 'b = \frac{k Z z e^2}{2 E} \cot\frac{\theta}{2}'
  variables:
    - name: 'b'
      description: impact parameter
    - name: 'k'
      description: Coulomb constant
    - name: 'Z, z'
      description: atomic numbers
    - name: 'e'
      description: elementary charge
    - name: 'E'
      description: kinetic energy of projectile
    - name: '\theta'
      description: scattering angle
  grade_range:
    - graduate
  description: Relationship between impact parameter and scattering angle in Coulomb scattering.

- formula_id: PHY_MOD_021
  name: Davisson-Germer Condition
  domain: PHY_MOD
  formula: '2d \sin\theta = n\lambda'
  variables:
    - name: 'd'
      description: crystal lattice spacing
    - name: '\theta'
      description: scattering angle
    - name: 'n'
      description: integer order
    - name: '\lambda'
      description: de Broglie wavelength
  grade_range:
    - undergraduate
  description: Condition for electron diffraction from crystal planes confirming wave nature.

- formula_id: PHY_MOD_022
  name: Blackbody Radiation (Wien Approximation)
  domain: PHY_MOD
  formula: 'u(\lambda, T) \approx \frac{8\pi hc}{\lambda^5} e^{-hc/(\lambda k_B T)}'
  variables:
    - name: 'u(\lambda, T)'
      description: spectral energy density
    - name: 'h'
      description: Planck constant
    - name: 'c'
      description: speed of light
    - name: 'k_B'
      description: Boltzmann constant
    - name: 'T'
      description: temperature
  grade_range:
    - graduate
  description: Short-wavelength approximation of Planck blackbody spectrum.

- formula_id: PHY_MOD_023
  name: Blackbody Radiation (Rayleigh-Jeans)
  domain: PHY_MOD
  formula: 'u(\lambda, T) \approx \frac{8\pi k_B T}{\lambda^4}'
  variables:
    - name: 'u(\lambda, T)'
      description: spectral energy density
    - name: 'k_B'
      description: Boltzmann constant
    - name: 'T'
      description: temperature
    - name: '\lambda'
      description: wavelength
  grade_range:
    - graduate
  description: Long-wavelength classical approximation of blackbody spectrum (ultraviolet catastrophe).

- formula_id: PHY_MOD_024
  name: Photon Energy
  domain: PHY_MOD
  formula: 'E = h\nu = \frac{hc}{\lambda}'
  variables:
    - name: 'E'
      description: photon energy
    - name: 'h'
      description: Planck constant
    - name: '\nu'
      description: frequency
    - name: 'c'
      description: speed of light
    - name: '\lambda'
      description: wavelength
  grade_range:
    - undergraduate
  description: Energy of a photon expressed in terms of frequency or wavelength.

- formula_id: PHY_MOD_025
  name: Photon Momentum
  domain: PHY_MOD
  formula: 'p = \frac{h}{\lambda} = \frac{E}{c}'
  variables:
    - name: 'p'
      description: photon momentum
    - name: 'h'
      description: Planck constant
    - name: '\lambda'
      description: wavelength
    - name: 'E'
      description: photon energy
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Momentum carried by a photon despite having zero rest mass.

- formula_id: PHY_MOD_026
  name: Bohr Correspondence Principle
  domain: PHY_MOD
  formula: '\lim_{n \to \infty} \frac{\Delta E}{E} \to 0'
  variables:
    - name: '\Delta E'
      description: energy level spacing
    - name: 'E'
      description: energy of level
    - name: 'n'
      description: principal quantum number
  grade_range:
    - graduate
  description: Quantum mechanical predictions approach classical results for large quantum numbers.

- formula_id: PHY_NUC_001
  name: Mass-Energy Equivalence
  domain: PHY_NUC
  formula: 'E = m c^2'
  variables:
    - name: 'E'
      description: rest energy
    - name: 'm'
      description: mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Rest mass equivalent to energy via speed of light squared.

- formula_id: PHY_NUC_002
  name: Nuclear Binding Energy
  domain: PHY_NUC
  formula: 'E_b = [Z m_p + N m_n - M(A,Z)] c^2'
  variables:
    - name: 'E_b'
      description: binding energy
    - name: 'Z'
      description: proton number
    - name: 'N'
      description: neutron number
    - name: 'm_p, m_n'
      description: proton and neutron masses
    - name: 'M(A,Z)'
      description: nuclear mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Energy required to disassemble a nucleus into its constituent nucleons.

- formula_id: PHY_NUC_003
  name: Semi-Empirical Mass Formula (Volume Term)
  domain: PHY_NUC
  formula: 'E_b = a_v A - a_s A^{2/3} - a_c \frac{Z(Z-1)}{A^{1/3}} - a_a \frac{(A-2Z)^2}{A} + \delta(A,Z)'
  variables:
    - name: 'E_b'
      description: binding energy
    - name: 'A'
      description: mass number
    - name: 'Z'
      description: atomic number
    - name: 'a_v, a_s, a_c, a_a'
      description: empirical coefficients
    - name: '\delta'
      description: pairing term
  grade_range:
    - graduate
  description: Weizsacker formula for nuclear binding energy with volume, surface, Coulomb, asymmetry, and pairing terms.

- formula_id: PHY_NUC_004
  name: Radioactive Decay Law
  domain: PHY_NUC
  formula: 'N(t) = N_0 e^{-\lambda t}'
  variables:
    - name: 'N(t)'
      description: number of undecayed nuclei at time t
    - name: 'N_0'
      description: initial number of nuclei
    - name: '\lambda'
      description: decay constant
    - name: 't'
      description: time
  grade_range:
    - undergraduate
  description: Exponential decrease of radioactive nuclei with time.

- formula_id: PHY_NUC_005
  name: Half-Life
  domain: PHY_NUC
  formula: 'T_{1/2} = \frac{\ln 2}{\lambda}'
  variables:
    - name: 'T_{1/2}'
      description: half-life
    - name: '\lambda'
      description: decay constant
  grade_range:
    - undergraduate
  description: Time required for half the radioactive nuclei to decay.

- formula_id: PHY_NUC_006
  name: Mean Lifetime
  domain: PHY_NUC
  formula: '\tau = \frac{1}{\lambda}'
  variables:
    - name: '\tau'
      description: mean lifetime
    - name: '\lambda'
      description: decay constant
  grade_range:
    - undergraduate
  description: Average time before a radioactive nucleus decays.

- formula_id: PHY_NUC_007
  name: Radioactive Activity
  domain: PHY_NUC
  formula: 'A = \lambda N'
  variables:
    - name: 'A'
      description: activity (decays per second)
    - name: '\lambda'
      description: decay constant
    - name: 'N'
      description: number of radioactive nuclei
  grade_range:
    - undergraduate
  description: Rate of radioactive decays proportional to number of nuclei.

- formula_id: PHY_NUC_008
  name: Q-value (General Nuclear Reaction)
  domain: PHY_NUC
  formula: 'Q = [M_{initial} - M_{final}] c^2'
  variables:
    - name: 'Q'
      description: energy released or absorbed
    - name: 'M_{initial}, M_{final}'
      description: total rest masses
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Net energy released in a nuclear reaction from mass defect.

- formula_id: PHY_NUC_009
  name: Q-value (Fission)
  domain: PHY_NUC
  formula: 'Q_{fission} = [M(A,Z) - M(A_1,Z_1) - M(A_2,Z_2)] c^2'
  variables:
    - name: 'Q_{fission}'
      description: energy released in fission
    - name: 'M'
      description: masses of parent and fission fragments
  grade_range:
    - undergraduate
  description: Energy released when a heavy nucleus splits into lighter fragments.

- formula_id: PHY_NUC_010
  name: Q-value (Fusion)
  domain: PHY_NUC
  formula: 'Q_{fusion} = [M_1 + M_2 - M_{final}] c^2'
  variables:
    - name: 'Q_{fusion}'
      description: energy released in fusion
    - name: 'M_1, M_2'
      description: masses of fusing nuclei
    - name: 'M_{final}'
      description: mass of product nucleus
  grade_range:
    - undergraduate
  description: Energy released when light nuclei fuse into a heavier nucleus.

- formula_id: PHY_NUC_011
  name: Decay Constant
  domain: PHY_NUC
  formula: '\lambda = \frac{\ln 2}{T_{1/2}}'
  variables:
    - name: '\lambda'
      description: decay constant
    - name: 'T_{1/2}'
      description: half-life
  grade_range:
    - undergraduate
  description: Probability per unit time that a nucleus will decay.

- formula_id: PHY_NUC_012
  name: Bateman Equation (Parent-Daughter)
