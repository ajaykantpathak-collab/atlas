- formula_id: PHY_NUC_023
  name: Gamma Ray Selection Rules
  domain: PHY_NUC
  formula: '\Delta J = L, \Delta\pi = (-1)^L'
  variables:
    - name: '\Delta J'
      description: change in total angular momentum
    - name: '\Delta\pi'
      description: change in parity
    - name: 'L'
      description: multipolarity (1=dipole, 2=quadrupole)
  grade_range:
    - graduate
  description: Angular momentum and parity changes for gamma ray emission.

- formula_id: PHY_NUC_024
  name: Neutron Diffusion Equation (Steady State)
  domain: PHY_NUC
  formula: 'D \nabla^2 \phi - \Sigma_a \phi + S = 0'
  variables:
    - name: 'D'
      description: diffusion coefficient
    - name: '\phi'
      description: neutron flux
    - name: '\Sigma_a'
      description: macroscopic absorption cross section
    - name: 'S'
      description: neutron source
  grade_range:
    - graduate
  description: Balance between diffusion, absorption, and source in a reactor.

- formula_id: PHY_NUC_025
  name: Fission Chain Reaction (Multiplication Factor)
  domain: PHY_NUC
  formula: 'k_{eff} = \eta f p \epsilon P_{NL}'
  variables:
    - name: 'k_{eff}'
      description: effective multiplication factor
    - name: '\eta'
      description: neutrons per absorption in fuel
    - name: 'f'
      description: thermal utilization factor
    - name: 'p'
      description: resonance escape probability
    - name: '\epsilon'
      description: fast fission factor
    - name: 'P_{NL}'
      description: non-leakage probability
  grade_range:
    - phd
  description: Six-factor formula for effective neutron multiplication in a reactor.

- formula_id: PHY_QM_001
  name: Schrödinger Equation (Time-Dependent)
  domain: PHY_QM
  formula: 'i\hbar \frac{\partial \Psi}{\partial t} = \hat{H} \Psi'
  variables:
    - name: '\Psi'
      description: wavefunction
    - name: '\hat{H}'
      description: Hamiltonian operator
    - name: '\hbar'
      description: reduced Planck constant
    - name: 't'
      description: time
  grade_range:
    - graduate
  description: Fundamental equation of quantum mechanics for time evolution of wavefunction.

- formula_id: PHY_QM_002
  name: Schrödinger Equation (Time-Independent)
  domain: PHY_QM
  formula: '\hat{H} \psi = E \psi'
  variables:
    - name: '\psi'
      description: stationary state wavefunction
    - name: '\hat{H}'
      description: Hamiltonian operator
    - name: 'E'
      description: energy eigenvalue
  grade_range:
    - graduate
  description: Time-independent form yielding energy eigenstates and eigenvalues.

- formula_id: PHY_QM_003
  name: Heisenberg Uncertainty Principle
  domain: PHY_QM
  formula: '\Delta x \Delta p \geq \frac{\hbar}{2}'
  variables:
    - name: '\Delta x'
      description: position uncertainty
    - name: '\Delta p'
      description: momentum uncertainty
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - graduate
  description: Fundamental limit on precision of simultaneous position and momentum measurements.

- formula_id: PHY_QM_004
  name: Commutator [x, p]
  domain: PHY_QM
  formula: '[\hat{x}, \hat{p}] = i\hbar'
  variables:
    - name: '[\hat{x}, \hat{p}]'
      description: commutator of position and momentum operators
    - name: 'i'
      description: imaginary unit
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - graduate
  description: Canonical commutation relation underlying Heisenberg uncertainty.

- formula_id: PHY_QM_005
  name: Harmonic Oscillator Energy
  domain: PHY_QM
  formula: 'E_n = \hbar\omega\left(n + \frac{1}{2}\right)'
  variables:
    - name: 'E_n'
      description: energy of nth level
    - name: '\hbar'
      description: reduced Planck constant
    - name: '\omega'
      description: angular frequency
    - name: 'n'
      description: quantum number (0,1,2,...)
  grade_range:
    - graduate
  description: Quantized energy levels of a quantum harmonic oscillator.

- formula_id: PHY_QM_006
  name: Harmonic Oscillator Ground State Wavefunction
  domain: PHY_QM
  formula: '\psi_0(x) = \left(\frac{m\omega}{\pi\hbar}\right)^{1/4} e^{-m\omega x^2/(2\hbar)}'
  variables:
    - name: '\psi_0(x)'
      description: ground state wavefunction
    - name: 'm'
      description: mass
    - name: '\omega'
      description: angular frequency
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - graduate
  description: Normalized ground state wavefunction for a harmonic oscillator.

- formula_id: PHY_QM_007
  name: Hydrogen Atom Energy Levels
  domain: PHY_QM
  formula: 'E_n = -\frac{m_e e^4}{8\varepsilon_0^2 h^2 n^2} = -\frac{13.6 \text{ eV}}{n^2}'
  variables:
    - name: 'E_n'
      description: energy of nth level
    - name: 'm_e'
      description: electron mass
    - name: 'e'
      description: elementary charge
    - name: '\varepsilon_0'
      description: vacuum permittivity
    - name: 'h'
      description: Planck constant
    - name: 'n'
      description: principal quantum number
  grade_range:
    - graduate
  description: Quantized energy levels of hydrogen atom from Schrödinger equation.

- formula_id: PHY_QM_008
  name: Hydrogen Atom Ground State Wavefunction
  domain: PHY_QM
  formula: '\psi_{100}(r) = \frac{1}{\sqrt{\pi a_0^3}} e^{-r/a_0}'
  variables:
    - name: '\psi_{100}(r)'
      description: ground state wavefunction
    - name: 'a_0'
      description: Bohr radius
    - name: 'r'
      description: radial distance
  grade_range:
    - graduate
  description: Normalized ground state wavefunction for hydrogen atom.

- formula_id: PHY_QM_009
  name: Angular Momentum Operator Magnitude
  domain: PHY_QM
  formula: '\hat{L}^2 Y_{lm} = \hbar^2 l(l+1) Y_{lm}'
  variables:
    - name: '\hat{L}^2'
      description: squared angular momentum operator
    - name: 'Y_{lm}'
      description: spherical harmonic
    - name: 'l'
      description: orbital angular momentum quantum number
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - graduate
  description: Eigenvalues of squared orbital angular momentum operator.

- formula_id: PHY_QM_010
  name: Spin Operator (S-squared)
  domain: PHY_QM
  formula: '\hat{S}^2 |s,m_s\rangle = \hbar^2 s(s+1) |s,m_s\rangle'
  variables:
    - name: '\hat{S}^2'
      description: squared spin operator
    - name: 's'
      description: spin quantum number
    - name: 'm_s'
      description: spin magnetic quantum number
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - graduate
  description: Eigenvalues of total spin angular momentum operator.

- formula_id: PHY_QM_011
  name: Pauli Matrix (sigma_x)
  domain: PHY_QM
  formula: '\sigma_x = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}'
  variables: []
  grade_range:
    - graduate
  description: Pauli matrix representing spin-x operator.

- formula_id: PHY_QM_012
  name: Pauli Matrix (sigma_y)
  domain: PHY_QM
  formula: '\sigma_y = \begin{pmatrix} 0 & -i \\ i & 0 \end{pmatrix}'
  variables: []
  grade_range:
    - graduate
  description: Pauli matrix representing spin-y operator.

- formula_id: PHY_QM_013
  name: Pauli Matrix (sigma_z)
  domain: PHY_QM
  formula: '\sigma_z = \begin{pmatrix} 1 & 0 \\ 0 & -1 \end{pmatrix}'
  variables: []
  grade_range:
    - graduate
  description: Pauli matrix representing spin-z operator.

- formula_id: PHY_QM_014
  name: Dirac Equation (Free Particle)
  domain: PHY_QM
  formula: '(i\gamma^\mu \partial_\mu - m) \psi = 0'
  variables:
    - name: '\gamma^\mu'
      description: Dirac gamma matrices
    - name: '\partial_\mu'
      description: four-gradient
    - name: 'm'
      description: mass
    - name: '\psi'
      description: Dirac spinor
  grade_range:
    - phd
  description: Relativistic wave equation for spin-1/2 particles.

- formula_id: PHY_QM_015
  name: Perturbation Theory (First Order Energy)
  domain: PHY_QM
  formula: 'E_n^{(1)} = \langle n^{(0)} | \hat{H}' | n^{(0)} \rangle'
  variables:
    - name: 'E_n^{(1)}'
      description: first-order energy correction
    - name: '\hat{H}''
      description: perturbation Hamiltonian
    - name: '| n^{(0)} \rangle'
      description: unperturbed eigenstate
  grade_range:
    - graduate
  description: First-order correction to energy from non-degenerate perturbation theory.

- formula_id: PHY_QM_016
  name: Perturbation Theory (Second Order Energy)
  domain: PHY_QM
  formula: 'E_n^{(2)} = \sum_{k \neq n} \frac{|\langle k^{(0)} | \hat{H}' | n^{(0)} \rangle|^2}{E_n^{(0)} - E_k^{(0)}}'
  variables:
    - name: 'E_n^{(2)}'
      description: second-order energy correction
    - name: '\hat{H}''
      description: perturbation Hamiltonian
    - name: 'E_n^{(0)}, E_k^{(0)}'
      description: unperturbed energies
  grade_range:
    - graduate
  description: Second-order correction to energy from non-degenerate perturbation theory.

- formula_id: PHY_QM_017
  name: Variational Principle
  domain: PHY_QM
  formula: 'E_0 \leq \frac{\langle \psi | \hat{H} | \psi \rangle}{\langle \psi | \psi \rangle}'
  variables:
    - name: 'E_0'
      description: true ground state energy
    - name: '\hat{H}'
      description: Hamiltonian
    - name: '|\psi\rangle'
      description: trial wavefunction
  grade_range:
    - graduate
  description: Ground state energy is less than or equal to expectation value for any trial state.

- formula_id: PHY_QM_018
  name: Particle in a Box (1D Energy)
  domain: PHY_QM
  formula: 'E_n = \frac{n^2 \pi^2 \hbar^2}{2mL^2}'
  variables:
    - name: 'E_n'
      description: energy of nth level
    - name: 'n'
      description: positive integer
    - name: '\hbar'
      description: reduced Planck constant
    - name: 'm'
      description: mass
    - name: 'L'
      description: box length
  grade_range:
    - graduate
  description: Energy levels of particle in one-dimensional infinite square well.

- formula_id: PHY_QM_019
  name: Finite Square Well (Transcendental Equation)
  domain: PHY_QM
  formula: 'k \cot(kL/2) = -\kappa'
  variables:
    - name: 'k'
      description: wavevector inside well
    - name: '\kappa'
      description: decay constant outside well
    - name: 'L'
      description: well width
  grade_range:
    - graduate
  description: Transcendental equation for even bound states in a finite square well.

- formula_id: PHY_QM_020
  name: Tunneling Probability (WKB)
  domain: PHY_QM
  formula: 'T \approx e^{-2 \int \kappa(x) dx}'
  variables:
    - name: 'T'
      description: transmission probability
    - name: '\kappa(x)'
      description: local decay constant under barrier
    - name: 'x'
      description: position coordinate
  grade_range:
    - graduate
  description: Exponential suppression of tunneling probability through a barrier.

- formula_id: PHY_QM_021
  name: WKB Approximation Condition
  domain: PHY_QM
  formula: '|\kappa(x)| \gg |k(x)|'
  variables:
    - name: '\kappa(x)'
      description: imaginary wavevector under barrier
    - name: 'k(x)'
      description: real wavevector under barrier
  grade_range:
    - phd
  description: Validity condition for WKB approximation in barrier penetration.

- formula_id: PHY_QM_022
  name: Density Matrix Definition
  domain: PHY_QM
  formula: '\hat{\rho} = \sum_i p_i |\psi_i\rangle\langle\psi_i|'
  variables:
    - name: '\hat{\rho}'
      description: density matrix
    - name: 'p_i'
      description: probability of state i
    - name: '|\psi_i\rangle'
      description: quantum state i
  grade_range:
    - graduate
  description: Statistical operator describing mixed quantum states.

- formula_id: PHY_QM_023
  name: Expectation Value
  domain: PHY_QM
  formula: '\langle \hat{A} \rangle = \langle \psi | \hat{A} | \psi \rangle'
  variables:
    - name: '\langle \hat{A} \rangle'
      description: expectation value of observable A
    - name: '\hat{A}'
      description: observable operator
    - name: '|\psi\rangle'
      description: quantum state
  grade_range:
    - graduate
  description: Average measured value of an observable in a given quantum state.

- formula_id: PHY_QM_024
  name: Probability Current
  domain: PHY_QM
  formula: 'j = \frac{\hbar}{2mi} \left(\psi^* \frac{\partial \psi}{\partial x} - \psi \frac{\partial \psi^*}{\partial x}\right)'
  variables:
    - name: 'j'
      description: probability current density
    - name: '\psi'
      description: wavefunction
    - name: '\hbar'
      description: reduced Planck constant
    - name: 'm'
      description: particle mass
  grade_range:
    - graduate
  description: Flux of probability density conserving continuity equation.

- formula_id: PHY_QM_025
  name: Ehrenfest Theorem
  domain: PHY_QM
  formula: '\frac{d}{dt}\langle \hat{x} \rangle = \frac{\langle \hat{p} \rangle}{m}'
  variables:
    - name: '\langle \hat{x} \rangle'
      description: expectation value of position
    - name: '\langle \hat{p} \rangle'
      description: expectation value of momentum
    - name: 'm'
      description: mass
  grade_range:
    - graduate
  description: Quantum expectation values follow classical equations of motion.

- formula_id: PHY_QM_026
  name: Virial Theorem (Quantum)
  domain: PHY_QM
  formula: '2\langle \hat{T} \rangle = n \langle \hat{V} \rangle'
  variables:
    - name: '\langle \hat{T} \rangle'
      description: expectation value of kinetic energy
    - name: '\langle \hat{V} \rangle'
      description: expectation value of potential energy
    - name: 'n'
      description: exponent in potential V proportional to r^n
  grade_range:
    - graduate
  description: Relation between average kinetic and potential energies for power-law potentials.

- formula_id: PHY_QM_027
  name: Perturbation Theory (First Order Wavefunction)
  domain: PHY_QM
  formula: '|n^{(1)}\rangle = \sum_{k \neq n} \frac{\langle k^{(0)} | \hat{H}' | n^{(0)} \rangle}{E_n^{(0)} - E_k^{(0)}} |k^{(0)}\rangle'
  variables:
    - name: '|n^{(1)}\rangle'
      description: first-order corrected state
    - name: '\hat{H}''
      description: perturbation Hamiltonian
    - name: 'E_n^{(0)}, E_k^{(0)}'
      description: unperturbed energies
  grade_range:
    - phd
  description: First-order correction to wavefunction in non-degenerate perturbation theory.

- formula_id: PHY_QM_028
  name: Time-Independent Perturbation (Non-degenerate)
  domain: PHY_QM
  formula: 'E_n = E_n^{(0)} + \langle n^{(0)} | \hat{H}' | n^{(0)} \rangle + \cdots'
  variables:
    - name: 'E_n'
      description: corrected energy
    - name: 'E_n^{(0)}'
      description: unperturbed energy
    - name: '\hat{H}''
      description: perturbation Hamiltonian
  grade_range:
    - graduate
  description: Energy expansion in powers of perturbation strength.

- formula_id: PHY_QM_029
  name: Time-Dependent Perturbation (Fermi Golden Rule)
  domain: PHY_QM
  formula: 'W_{i \to f} = \frac{2\pi}{\hbar} |\langle f | \hat{H}' | i \rangle|^2 \rho(E_f)'
  variables:
    - name: 'W_{i \to f}'
      description: transition rate
    - name: '\hat{H}''
      description: time-dependent perturbation
    - name: '|i\rangle, |f\rangle'
      description: initial and final states
    - name: '\rho(E_f)'
      description: density of final states
    - name: '\hbar'
      description: reduced Planck constant
  grade_range:
    - phd
  description: Transition rate from initial to final states under weak time-dependent perturbation.

- formula_id: PHY_QM_030
  name: Adiabatic Theorem
  domain: PHY_QM
  formula: 'P_{i \to n} = |\langle n(0) | n(T) \rangle|^2'
  variables:
    - name: 'P_{i \to n}'
      description: probability of remaining in nth state
    - name: '|n(0)\rangle'
      description: state at initial time
    - name: '|n(T)\rangle'
      description: state at final time
  grade_range:
    - phd
  description: System remains in instantaneous eigenstate if Hamiltonian changes slowly.

- formula_id: PHY_REL_001
  name: Lorentz Factor
  domain: PHY_REL
  formula: '\gamma = \frac{1}{\sqrt{1 - v^2/c^2}}'
  variables:
    - name: '\gamma'
      description: Lorentz factor
    - name: 'v'
      description: relative velocity
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Factor by which time, length, and mass change at relativistic speeds.

- formula_id: PHY_REL_002
  name: Time Dilation
  domain: PHY_REL
  formula: '\Delta t' = \gamma \Delta t'
  variables:
    - name: '\Delta t'
      description: dilated time interval
    - name: '\Delta t\''
      description: proper time interval
    - name: '\gamma'
      description: Lorentz factor
  grade_range:
    - undergraduate
  description: Moving clocks run slower as measured in a stationary frame.

- formula_id: PHY_REL_003
  name: Length Contraction
  domain: PHY_REL
  formula: 'L = \frac{L_0}{\gamma}'
  variables:
    - name: 'L'
      description: contracted length
    - name: 'L_0'
      description: proper length
    - name: '\gamma'
      description: Lorentz factor
  grade_range:
    - undergraduate
  description: Lengths parallel to motion appear contracted in a moving frame.

- formula_id: PHY_REL_004
  name: Relativistic Velocity Addition
  domain: PHY_REL
  formula: 'u' = \frac{u + v}{1 + uv/c^2}'
  variables:
    - name: 'u\''
      description: velocity in new frame
    - name: 'u'
      description: object velocity in original frame
    - name: 'v'
      description: relative frame velocity
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Addition of velocities ensuring result does not exceed c.

- formula_id: PHY_REL_005
  name: Relativistic Momentum
  domain: PHY_REL
  formula: 'p = \gamma m_0 v'
  variables:
    - name: 'p'
      description: relativistic momentum
    - name: '\gamma'
      description: Lorentz factor
    - name: 'm_0'
      description: rest mass
    - name: 'v'
      description: velocity
  grade_range:
    - undergraduate
  description: Momentum increases without bound as velocity approaches c.

- formula_id: PHY_REL_006
  name: Relativistic Energy (Total)
  domain: PHY_REL
  formula: 'E = \gamma m_0 c^2'
  variables:
    - name: 'E'
      description: total energy
    - name: '\gamma'
      description: Lorentz factor
    - name: 'm_0'
      description: rest mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Total energy including rest mass and kinetic contributions.

- formula_id: PHY_REL_007
  name: Mass-Energy Equivalence
  domain: PHY_REL
  formula: 'E = m c^2'
  variables:
    - name: 'E'
      description: rest energy
    - name: 'm'
      description: rest mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Mass and energy are equivalent and interconvertible.

- formula_id: PHY_REL_008
  name: Relativistic Kinetic Energy
  domain: PHY_REL
  formula: 'K = (\gamma - 1) m_0 c^2'
  variables:
    - name: 'K'
      description: kinetic energy
    - name: '\gamma'
      description: Lorentz factor
    - name: 'm_0'
      description: rest mass
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Kinetic energy accounting for relativistic effects at high speeds.

- formula_id: PHY_REL_009
  name: Relativistic Doppler Effect (Longitudinal)
  domain: PHY_REL
  formula: '\nu_{obs} = \nu_{source} \sqrt{\frac{1 \pm v/c}{1 \mp v/c}}'
  variables:
    - name: '\nu_{obs}'
      description: observed frequency
    - name: '\nu_{source}'
      description: source frequency
    - name: 'v'
      description: relative velocity
    - name: 'c'
      description: speed of light
  grade_range:
    - graduate
  description: Frequency shift for light from a moving source including time dilation.

- formula_id: PHY_REL_010
  name: Schwarzschild Radius
  domain: PHY_REL
  formula: 'r_s = \frac{2GM}{c^2}'
  variables:
    - name: 'r_s'
      description: Schwarzschild radius
    - name: 'G'
      description: gravitational constant
    - name: 'M'
      description: mass of compact object
    - name: 'c'
      description: speed of light
  grade_range:
    - undergraduate
  description: Radius of event horizon for a non-rotating black hole.

- formula_id: PHY_REL_011
  name: Escape Velocity
  domain: PHY_REL
  formula: 'v_{esc} = \sqrt{\frac{2GM}{r}}'
  variables:
    - name: 'v_{esc}'
      description: escape velocity
    - name: 'G'
      description: gravitational constant
    - name: 'M'
      description: mass of central body
    - name: 'r'
      description: distance from center
  grade_range:
    - undergraduate
  description: Minimum velocity to escape gravitational pull.

- formula_id: PHY_REL_012
  name: Gravitational Time Dilation
  domain: PHY_REL
  formula: '\Delta t_f = \Delta t_0 \sqrt{1 - \frac{2GM}{rc^2}}'
  variables:
    - name: '\Delta t_f'
      description: time interval at radius r
    - name: '\Delta t_0'
      description: proper time at infinity
    - name: 'G'
      description: gravitational constant
    - name: 'M'
      description: mass
    - name: 'r'
      description: radial coordinate
    - name: 'c'
      description: speed of light
  grade_range:
    - graduate
  description: Clocks run slower in stronger gravitational fields.

- formula_id: PHY_REL_013
  name: Lorentz Transformation (Time)
  domain: PHY_REL
  formula: 't' = \gamma \left(t - \frac{vx}{c^2}\right)'
  variables:
    - name: 't\''
      description: time in moving frame
    - name: 't'
      description: time in stationary frame
    - name: 'x'
      description: position in stationary frame
    - name: 'v'
      description: relative velocity
    - name: 'c'
      description: speed of light
    - name: '\gamma'
      description: Lorentz factor
  grade_range:
    - undergraduate
  description: Time coordinate transformation between inertial frames.

- formula_id: PHY_REL_014
  name: Lorentz Transformation (Position)
  domain: PHY_REL
  formula: 'x' = \gamma (x - vt)'
  variables:
    - name: 'x\''
      description: position in moving frame
    - name: 'x'
      description: position in stationary frame
    - name: 't'
      description: time in stationary frame
    - name: 'v'
      description: relative velocity
    - name: '\gamma'
      description: Lorentz factor
  grade_range:
    - undergraduate
  description: Position coordinate transformation between inertial frames.

- formula_id: PHY_REL_015
  name: Four-Momentum
  domain: PHY_REL
  formula: 'p^\mu = (E/c, \vec{p})'
  variables:
    - name: 'p^\mu'
      description: four-momentum vector
    - name: 'E'
      description: total energy
    - name: 'c'
      description: speed of light
    - name: '\vec{p}'
      description: three-momentum
  grade_range:
    - graduate
  description: Energy and momentum combined into a four-vector in special relativity.

- formula_id: PHY_REL_016
  name: Invariant Mass
  domain: PHY_REL
  formula: 'm^2 c^4 = E^2 - (pc)^2'
  variables:
    - name: 'm'
      description: invariant (rest) mass
    - name: 'E'
      description: total energy
    - name: 'p'
      description: momentum magnitude
    - name: 'c'
      description: speed of light
  grade_range:
    - graduate
  description: Mass computed from energy and momentum is invariant across frames.

- formula_id: PHY_REL_017
  name: Relativistic Doppler Effect (Transverse)
  domain: PHY_REL
  formula: '\nu_{obs} = \nu_{source} / \gamma'
  variables:
    - name: '\nu_{obs}'
      description: observed frequency
    - name: '\nu_{source}'
      description: source frequency
    - name: '\gamma'
      description: Lorentz factor
  grade_range:
    - graduate
  description: Frequency shift when source moves perpendicular to line of sight.

- formula_id: PHY_REL_018
  name: Aberration of Light
  domain: PHY_REL
  formula: '\cos\theta' = \frac{\cos\theta - v/c}{1 - (v/c)\cos\theta}'
  variables:
    - name: '\theta\''
      description: angle in moving frame
    - name: '\theta'
      description: angle in stationary frame
