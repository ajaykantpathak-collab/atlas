    step_sequence: [ST_GIVEN, ST_INFERENCE, ST_CRITICAL_ANALYSIS]
    solver_method: solve_replication_direction
    misconception_tags: [semiconservative, leading_vs_lagging, okazaki_fragments]

  - id: LAC_OPERON
    display_name: "Lac Operon Regulation"
    description: "Analyze the regulatory state of the lac operon under different conditions"
    topics: [gene_regulation, lac_operon]
