  - id: DNA_FINGERPRINTING
    display_name: "DNA Fingerprinting Analysis"
    description: "Analyze DNA fingerprint data for identification or paternity"
    topics: [dna_fingerprinting]
    bloom_levels: [Analyzing, Evaluating]
