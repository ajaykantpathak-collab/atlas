# ISC Class 12 Biology — Problem Type Definitions
# Each type: id, display_name, topics, bloom_level, competency, steps, difficulty, params

problem_types:

  # ── GENETICS & INHERITANCE ──────────────────────────────────────────────

  - id: MONOHYBRID_CROSS
    display_name: "Monohybrid Cross"
    description: "Predict offspring genotypes and phenotypes from a single-gene cross"
    topics: [genetics_mendel, genetics_dominance]
    bloom_levels: [Understanding, Applying]
    competency: standard
    difficulty: easy
    required_params: [parent1_gamete1, parent1_gamete2, parent2_gamete1, parent2_gamete2, allele_dominance, trait_name]
    step_sequence: [ST_GIVEN, ST_MENDEL_LAW, ST_PUNNETT_SQUARE, ST_RATIO, ST_VERIFY_GENETICS, ST_NUMERICAL_CHECK]
    solver_method: solve_monohybrid_cross
    misconception_tags: [dominance_vs_domination, homozygous_vs_heterozygous, genotypic_vs_phenotypic]

  - id: DIHYBRID_CROSS
    display_name: "Dihybrid Cross"
    description: "Predict offspring from a two-gene independent assortment cross"
    topics: [genetics_dihybrid, genetics_mendel]
    bloom_levels: [Applying, Analyzing]
    competency: standard
    difficulty: medium
    required_params: [parent1_gametes, parent2_gametes, trait1_dominance, trait2_dominance, trait1_name, trait2_name]
    step_sequence: [ST_GIVEN, ST_MENDEL_LAW, ST_PUNNETT_SQUARE, ST_RATIO, ST_PROBABILITY, ST_VERIFY_GENETICS]
    solver_method: solve_dihybrid_cross
    misconception_tags: [independent_assortment, dihybrid_ratio_9_3_3_1, gamete_formation]

  - id: SEX_LINKED_INHERITANCE
    display_name: "Sex-Linked Inheritance"
    description: "Predict inheritance patterns for X-linked traits (e.g., colour blindness, haemophilia)"
    topics: [genetics_sex_linked]
    bloom_levels: [Analyzing, Evaluating]
    competency: standard
    difficulty: medium
    required_params: [trait_name, affected_allele_on_X, parent1_genotype, parent2_genotype]
    step_sequence: [ST_GIVEN, ST_MENDEL_LAW, ST_PUNNETT_SQUARE, ST_RATIO, ST_VERIFY_GENETICS]
    solver_method: solve_sex_linked
    misconception_tags: [x_linked_males_affected, carrier_females, criss_cross_inheritance]
    indian_context_tags: [haemophilia_india, colour_blindness_india]

  - id: BLOOD_GROUP_INHERITANCE
    display_name: "Blood Group Inheritance"
    description: "Determine offspring blood groups using ABO and Rh systems"
    topics: [genetics_multiple_alleles]
    bloom_levels: [Applying, Analyzing]
    competency: standard
    difficulty: medium
    required_params: [parent1_blood_group, parent2_blood_group, parent1_rh, parent2_rh]
    step_sequence: [ST_GIVEN, ST_APPLY_FORMULA, ST_RATIO, ST_VERIFY_GENETICS]
    solver_method: solve_blood_group
    misconception_tags: [co_dominance_abo, universal_donor_recipient, ia_ib_icodominance]

  - id: LINKAGE_CALCULATION
    display_name: "Gene Linkage and Crossing Over"
    description: "Calculate recombination frequency and map distance between linked genes"
    topics: [genetics_linkage, genetics_crossing_over]
    bloom_levels: [Analyzing, Evaluating]
    competency: standard
    difficulty: hard
    required_params: [gene_A, gene_B, parental_phenotypes, recombinant_phenotypes, total_progeny]
    step_sequence: [ST_GIVEN, ST_APPLY_FORMULA, ST_LINKAGE, ST_NUMERICAL_CHECK]
    solver_method: solve_linkage
    misconception_tags: [linkage_vs_independent_assortment, recombination_frequency, map_units]

  - id: HARDY_WEINBERG
    display_name: "Hardy-Weinberg Equilibrium"
    description: "Compute allele and genotype frequencies; test if a population is in H-W equilibrium"
    topics: [population_genetics, hardy_weinberg]
    bloom_levels: [Applying, Analyzing]
    competency: standard
    difficulty: medium
    required_params: [dominant_phenotype_freq, population_size, trait_name]
    step_sequence: [ST_GIVEN, ST_HW_SETUP, ST_HW_CALC, ST_VERIFY_GENETICS, ST_NUMERICAL_CHECK]
    solver_method: solve_hardy_weinberg
    misconception_tags: [pq_equals_1, genotype_freq_formula, hw_assumptions]

  - id: PEDIGREE_ANALYSIS
    display_name: "Pedigree Analysis"
    description: "Determine mode of inheritance from a given pedigree chart"
    topics: [genetics_pedigree]
    bloom_levels: [Analyzing, Evaluating]
    competency: standard
    difficulty: hard
    required_params: [pattern_type, affected_generations, male_female_ratio, trait_name]
    step_sequence: [ST_GIVEN, ST_INFERENCE, ST_RATIO, ST_CRITICAL_ANALYSIS]
    solver_method: solve_pedigree
    misconception_tags: [autosomal_dominant_recessive, x_linked, y_linked]

  - id: CHROMOSOMAL_DISORDER
    display_name: "Chromosomal Disorder Analysis"
    description: "Identify chromosomal disorder from karyotype description (Down, Turner, Klinefelter)"
    topics: [genetics_chromosomal_disorders]
    bloom_levels: [Understanding, Applying]
    competency: standard
    difficulty: easy
    required_params: [karyotype_description, disorder_type, chromosome_count]
    step_sequence: [ST_GIVEN, ST_APPLY_FORMULA, ST_INFERENCE, ST_NUMERICAL_CHECK]
    solver_method: solve_chromosomal_disorder
    misconception_tags: [aneuploidy_vs_polyploidy, monosomy_vs_trisomy]

  - id: PUNNETT_PROBABILITY
    display_name: "Punnett Square with Probability"
    description: "Calculate the probability of a specific genotype or phenotype in offspring"
    topics: [genetics_probability]
    bloom_levels: [Applying]
    competency: standard
    difficulty: medium
    required_params: [parent_genotypes, target_genotype, cross_type]
    step_sequence: [ST_GIVEN, ST_PUNNETT_SQUARE, ST_PROBABILITY, ST_NUMERICAL_CHECK]
    solver_method: solve_punnett_probability
    misconception_tags: [probability_vs_ratio, conditional_probability]

  # ── MOLECULAR BIOLOGY ────────────────────────────────────────────────────

  - id: TRANSCRIPTION
