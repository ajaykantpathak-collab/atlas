# problem_types_maths_c12.yaml
# Problem type chains — each chains step types together into a complete problem.
# Each problem_type maps to a chain of solver step types and metadata.

# --- RELATIONS AND FUNCTIONS ---
relation_reflexive_symmetric_transitive:
  problem_type_id: pt_rel_001
  topic: "Relations and Functions"
  description: "Check whether a given relation on a set is reflexive, symmetric, and transitive; determine if it is an equivalence relation."
  chain:
    - step_type: relation_type
      required: true
  marks: 2
  difficulty: easy
  standard_probability: 0.5

relation_inverse:
  problem_type_id: pt_rel_002
  topic: "Relations and Functions"
  description: "Find the inverse of a given one-one onto function."
  chain:
    - step_type: inverse_function
      required: true
  marks: 2
  difficulty: easy
  standard_probability: 0.5

composite_function:
  problem_type_id: pt_rel_003
  topic: "Relations and Functions"
  description: "Find fog and gof; check commutativity; evaluate at a specific point."
  chain:
    - step_type: composite_function
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

function_type_check:
  problem_type_id: pt_rel_004
  topic: "Relations and Functions"
  description: "Determine if a function is one-one (injective) and/or onto (surjective)."
  chain:
    - step_type: function_type
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

# --- ALGEBRA: MATRICES ---
matrix_transpose:
  problem_type_id: pt_mat_001
  topic: "Matrices"
  description: "Find the transpose of a given matrix and verify (Aᵀ)ᵀ = A."
  chain:
    - step_type: matrix_operation
      params: {operation: transpose}
  marks: 1
  difficulty: easy
  standard_probability: 0.5

matrix_determinant:
  problem_type_id: pt_mat_002
  topic: "Matrices"
  description: "Compute the determinant of a 2×2 or 3×3 matrix using cofactor expansion."
  chain:
    - step_type: matrix_operation
      params: {operation: determinant}
  marks: 2
  difficulty: medium
  standard_probability: 0.5

matrix_inverse:
  problem_type_id: pt_mat_003
  topic: "Matrices"
  description: "Find the inverse of a non-singular square matrix using adjoint method. Verify A·A⁻¹ = I."
  chain:
    - step_type: matrix_operation
      params: {operation: inverse}
  marks: 4
  difficulty: hard
  standard_probability: 0.5

matrix_symmetric_skew:
  problem_type_id: pt_mat_004
  topic: "Matrices"
  description: "Determine whether a given matrix is symmetric, skew-symmetric, or neither."
  chain:
    - step_type: matrix_operation
      params: {operation: symmetric_skew}
  marks: 1
  difficulty: easy
  standard_probability: 0.5

matrix_rank:
  problem_type_id: pt_mat_005
  topic: "Matrices"
  description: "Find the rank of a matrix by reducing to echelon form."
  chain:
    - step_type: matrix_operation
      params: {operation: rank}
  marks: 2
  difficulty: medium
  standard_probability: 0.5

# --- ALGEBRA: DETERMINANTS ---
determinant_properties:
  problem_type_id: pt_det_001
  topic: "Determinants"
  description: "Apply determinant properties: row/column operations, sum property, factor property."
  chain:
    - step_type: matrix_operation
      params: {operation: determinant}
  marks: 2
  difficulty: medium
  standard_probability: 0.5

cramers_rule:
  problem_type_id: pt_det_002
  topic: "Determinants"
  description: "Solve a system of linear equations using Cramer's Rule."
  chain:
    - step_type: cramers_rule
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- CALCULUS: CONTINUITY & DIFFERENTIABILITY ---
continuity_check:
  problem_type_id: pt_cal_001
  topic: "Continuity and Differentiability"
  description: "Check if a function is continuous at a point using the 3-condition test."
  chain:
    - step_type: continuity
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

differentiation:
  problem_type_id: pt_cal_002
  topic: "Continuity and Differentiability"
  description: "Find first/second derivative using product rule, chain rule, quotient rule."
  chain:
    - step_type: differentiation
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

# --- CALCULUS: ROLLE'S & LMVT ---
rolles_theorem:
  problem_type_id: pt_cal_003
  topic: "Rolle's Theorem and LMVT"
  description: "Verify Rolle's Theorem conditions and find c where f'(c)=0."
  chain:
    - step_type: rolles_theorem
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

lagrange_mvt:
  problem_type_id: pt_cal_004
  topic: "Rolle's Theorem and LMVT"
  description: "Verify Lagrange Mean Value Theorem and find c where f'(c) = [f(b)-f(a)]/(b-a)."
  chain:
    - step_type: lagrange_mvt
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- CALCULUS: MAXIMA AND MINIMA ---
maxima_minima:
  problem_type_id: pt_cal_005
  topic: "Application of Derivatives"
  description: "Find local maxima, minima using first and second derivative tests."
  chain:
    - step_type: maxima_minima
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- CALCULUS: INTEGRATION ---
indefinite_integral:
  problem_type_id: pt_int_001
  topic: "Indefinite Integrals"
  description: "Evaluate an indefinite integral and verify by differentiation."
  chain:
    - step_type: indefinite_integral
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

definite_integral:
  problem_type_id: pt_int_002
  topic: "Definite Integrals"
  description: "Evaluate a definite integral using the Fundamental Theorem of Calculus."
  chain:
    - step_type: definite_integral
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

area_under_curve:
  problem_type_id: pt_int_003
  topic: "Application of Integrals"
  description: "Find the area bounded by a curve and the x-axis (accounting for sign changes)."
  chain:
    - step_type: area_under_curve
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- CALCULUS: DIFFERENTIAL EQUATIONS ---
de_separable:
  problem_type_id: pt_de_001
  topic: "Differential Equations"
  description: "Solve a variable separable differential equation."
  chain:
    - step_type: de_separable
      required: true
  marks: 4
  difficulty: medium
  standard_probability: 0.5

de_homogeneous:
  problem_type_id: pt_de_002
  topic: "Differential Equations"
  description: "Solve a homogeneous differential equation using substitution y = vx."
  chain:
    - step_type: de_homogeneous
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

de_linear:
  problem_type_id: pt_de_003
  topic: "Differential Equations"
  description: "Solve a linear first-order differential equation using integrating factor."
  chain:
    - step_type: de_linear
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- VECTORS ---
vector_dot_product:
  problem_type_id: pt_vec_001
  topic: "Vectors"
  description: "Compute dot product, find the angle between two vectors."
  chain:
    - step_type: vector_dot
      required: true
  marks: 2
  difficulty: easy
  standard_probability: 0.5

vector_cross_product:
  problem_type_id: pt_vec_002
  topic: "Vectors"
  description: "Compute cross product and magnitude using the determinant method."
  chain:
    - step_type: vector_cross
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

scalar_triple_product:
  problem_type_id: pt_vec_003
  topic: "Vectors"
  description: "Compute scalar triple product and test for coplanarity."
  chain:
    - step_type: vector_scalar_triple
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

direction_cosines:
  problem_type_id: pt_vec_004
  topic: "Vectors"
  description: "Find direction cosines and verify l²+m²+n²=1."
  chain:
    - step_type: direction_cosines
      required: true
  marks: 2
  difficulty: easy
  standard_probability: 0.5

# --- 3D GEOMETRY ---
line_in_space:
  problem_type_id: pt_3d_001
  topic: "Three Dimensional Geometry"
  description: "Find vector and Cartesian equations of a line in space."
  chain:
    - step_type: line_in_space
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

plane_equation:
  problem_type_id: pt_3d_002
  topic: "Three Dimensional Geometry"
  description: "Find vector and Cartesian equations of a plane."
  chain:
    - step_type: plane_equation
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

distance_point_plane:
  problem_type_id: pt_3d_003
  topic: "Three Dimensional Geometry"
  description: "Find the perpendicular distance from a point to a plane."
  chain:
    - step_type: distance_point_plane
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

angle_between_lines:
  problem_type_id: pt_3d_004
  topic: "Three Dimensional Geometry"
  description: "Find the angle between two lines given their direction ratios."
  chain: []
  marks: 3
  difficulty: medium
  standard_probability: 0.5

angle_line_plane:
  problem_type_id: pt_3d_005
  topic: "Three Dimensional Geometry"
  description: "Find the angle between a line and a plane."
  chain: []
  marks: 3
  difficulty: medium
  standard_probability: 0.5

coplanar_lines:
  problem_type_id: pt_3d_006
  topic: "Three Dimensional Geometry"
  description: "Determine if two lines are coplanar (skew or intersecting)."
  chain: []
  marks: 3
  difficulty: hard
  standard_probability: 0.5

shortest_distance_lines:
  problem_type_id: pt_3d_007
  topic: "Three Dimensional Geometry"
  description: "Find the shortest distance between two skew lines."
  chain: []
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- PROBABILITY ---
conditional_probability:
  problem_type_id: pt_prob_001
  topic: "Probability"
  description: "Compute P(A|B) and P(A∩B) from given P(A), P(B), P(B|A)."
  chain:
    - step_type: conditional_probability
      required: true
  marks: 2
  difficulty: medium
  standard_probability: 0.5

bayes_theorem:
  problem_type_id: pt_prob_002
  topic: "Probability"
  description: "Apply Bayes' Theorem to compute posterior probabilities."
  chain:
    - step_type: bayes_theorem
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

total_probability:
  problem_type_id: pt_prob_003
  topic: "Probability"
  description: "Apply the Total Probability Theorem with partitioning events."
  chain: []
  marks: 3
  difficulty: medium
  standard_probability: 0.5

binomial_distribution:
  problem_type_id: pt_prob_004
  topic: "Probability"
  description: "Compute binomial probability, mean, and variance."
  chain:
    - step_type: binomial_distribution
      required: true
  marks: 3
  difficulty: medium
  standard_probability: 0.5

mean_variance_binomial:
  problem_type_id: pt_prob_005
  topic: "Probability"
  description: "Find mean and variance of a binomial distribution."
  chain: []
  marks: 2
  difficulty: easy
  standard_probability: 0.5

# --- LINEAR PROGRAMMING ---
lpp_formulation:
  problem_type_id: pt_lpp_001
  topic: "Linear Programming"
  description: "Formulate a real-world problem as an LPP with objective function and constraints."
  chain: []
  marks: 3
  difficulty: medium
  standard_probability: 0.5

lpp_graphical:
  problem_type_id: pt_lpp_002
  topic: "Linear Programming"
  description: "Solve an LPP using the graphical method (corner point method)."
  chain:
    - step_type: linear_programming
      required: true
  marks: 4
  difficulty: hard
  standard_probability: 0.5

lpp_bounded:
  problem_type_id: pt_lpp_003
  topic: "Linear Programming"
  description: "Solve an LPP with a bounded feasible region (unique optimal solution at a corner point)."
  chain: []
  marks: 4
  difficulty: hard
  standard_probability: 0.5

lpp_unbounded:
  problem_type_id: pt_lpp_004
  topic: "Linear Programming"
  description: "Solve an LPP with an unbounded feasible region (identify if optimum exists)."
  chain: []
  marks: 4
  difficulty: hard
  standard_probability: 0.5

# --- COMPETENCY-BASED CHAINS (Multi-step) ---
# These chain multiple step types into a single competency-based problem

competency_business_profit:
  problem_type_id: pt_comp_001
  topic: "Application of Derivatives (Maxima & Minima)"
  description: "A factory owner wants to maximize profit given a demand function. Use calculus to find optimal price and quantity."
  chain:
    - step_type: maxima_minima
      required: true
    - step_type: definite_integral
      required: false
  marks: 6
  difficulty: hard
  is_competency: true
  standard_probability: 0.0

competency_cricket_stats:
  problem_type_id: pt_comp_002
  topic: "Probability"
  description: "A cricket batsman's scoring follows a binomial distribution. Compute probabilities of match outcomes."
  chain:
    - step_type: binomial_distribution
      required: true
  marks: 4
  difficulty: medium
  is_competency: true
  standard_probability: 0.0

competency_railway_distance:
  problem_type_id: pt_comp_003
  topic: "Application of Integrals (Area)"
  description: "A train's speed is given as a function of time. Find total distance using definite integration."
  chain:
    - step_type: definite_integral
      required: true
  marks: 4
  difficulty: medium
  is_competency: true
  standard_probability: 0.0

competency_population_growth:
  problem_type_id: pt_comp_004
  topic: "Differential Equations"
  description: "Model population growth using a differential equation with given growth rate."
  chain:
    - step_type: de_separable
      required: true
  marks: 4
  difficulty: hard
  is_competency: true
  standard_probability: 0.0

competency_school_marks:
  problem_type_id: pt_comp_005
  topic: "Probability (Bayes' Theorem)"
  description: "A student uses three sources for studying. Given pass rates and usage patterns, find probability a passing student used a particular source."
  chain:
    - step_type: bayes_theorem
      required: true
  marks: 4
  difficulty: medium
  is_competency: true
  standard_probability: 0.0

competency_lpp_factory:
  problem_type_id: pt_comp_006
  topic: "Linear Programming"
  description: "A furniture factory makes chairs and tables. Formulate and solve LPP for maximum profit."
  chain:
    - step_type: linear_programming
      required: true
  marks: 6
  difficulty: hard
  is_competency: true
  standard_probability: 0.0

competency_geometry_pollution:
  problem_type_id: pt_comp_007
  topic: "Application of Integrals (Area)"
  description: "A pollution concentration curve is given. Find the area of the affected zone."
  chain:
    - step_type: area_under_curve
      required: true
  marks: 4
  difficulty: medium
  is_competency: true
  standard_probability: 0.0

competency_vectors_displacement:
  problem_type_id: pt_comp_008
  topic: "Vectors"
  description: "A boat moves in a river with current. Find resultant displacement using vector addition."
  chain:
    - step_type: vector_dot
      required: false
    - step_type: vector_cross
      required: false
  marks: 4
  difficulty: medium
  is_competency: true
  standard_probability: 0.0

competency_mvt_physics:
  problem_type_id: pt_comp_009
  topic: "Rolle's Theorem and LMVT"
  description: "A particle's displacement is given. Verify LMVT and find the instant when velocity equals average velocity."
  chain:
    - step_type: lagrange_mvt
      required: true
  marks: 4
  difficulty: hard
  is_competency: true
  standard_probability: 0.0

competency_inverse_function_billing:
  problem_type_id: pt_comp_010
  topic: "Relations and Functions"
  description: "A billing system maps item codes to prices. Find the inverse function to get price from code."
  chain:
    - step_type: inverse_function
      required: true
  marks: 2
  difficulty: easy
  is_competency: true
  standard_probability: 0.0

