# node_mapping_econ_c11.yaml
# Maps CISCE node IDs to problem type IDs for ISC Economics Chapter 11
# Topics: Statistics, Demand, Supply

node_mappings:
  - node_id: "econ_c11_stat_001"
    description: "Measures of Central Tendency - Mean"
    problem_type_ids:
      - "stat_mean_direct"
      - "stat_mean_shortcut"
      - "stat_mean_weighted"

  - node_id: "econ_c11_stat_002"
    description: "Measures of Central Tendency - Median"
    problem_type_ids:
      - "stat_median_individual"
      - "stat_median_discrete"
      - "stat_median_continuous"

  - node_id: "econ_c11_stat_003"
    description: "Measures of Central Tendency - Mode"
    problem_type_ids:
      - "stat_mode_individual"
      - "stat_mode_discrete"
      - "stat_mode_continuous"
      - "stat_mode_grouped"

  - node_id: "econ_c11_stat_004"
    description: "Measures of Dispersion - Range & Quartile Deviation"
    problem_type_ids:
      - "stat_range_direct"
      - "stat_range_coefficient"
      - "stat_quartile_deviation"

  - node_id: "econ_c11_stat_005"
    description: "Measures of Dispersion - Mean Deviation"
    problem_type_ids:
      - "stat_mean_deviation_actual"
      - "stat_mean_deviation_assumed"

  - node_id: "econ_c11_stat_006"
    description: "Measures of Dispersion - Standard Deviation & Variance"
    problem_type_ids:
      - "stat_std_dev_actual"
      - "stat_std_dev_assumed"
      - "stat_std_dev_shortcut"
      - "stat_variance"

  - node_id: "econ_c11_stat_007"
    description: "Correlation - Pearson & Spearman"
    problem_type_ids:
      - "stat_correlation_pearson"
      - "stat_correlation_spearman_rank"
      - "stat_correlation_scattered"

  - node_id: "econ_c11_stat_008"
    description: "Index Numbers"
    problem_type_ids:
      - "stat_index_laspeyres"
      - "stat_index_paasche"
      - "stat_index_fisher"
      - "stat_index_cost_living"

  - node_id: "econ_c11_dem_001"
    description: "Law of Demand"
    problem_type_ids:
      - "dem_law_assumptions"
      - "dem_law_exceptions"
      - "dem_law_shifters"

  - node_id: "econ_c11_dem_002"
