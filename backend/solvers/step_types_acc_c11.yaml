# ISC Class 11 Accountancy – Step Types

step_types:
  - id: ACC11-01
    name: Journal Entry
    rule_description: "Every transaction recorded using Double Entry System. Debit the receiver/gainer/expense; Credit the giver/loser/income."
    formula_template: "Dr {Account1} Rs{amt}  Cr {Account2} Rs{amt}"

  - id: ACC11-02
    name: Ledger Posting
    rule_description: "From journal, post to ledger: Dr entries on left, Cr entries on right. Balance = difference between sides."
    formula_template: "{Account} A/c: Dr Total={dt}  Cr Total={ct}  Balance={bal}({side})"

  - id: ACC11-03
    name: Trial Balance Preparation
    rule_description: "List all accounts with Dr/Cr balances. Total Dr must equal Total Cr."
    formula_template: "Total Dr = Rs{tdr}  Total Cr = Rs{tcr}  Difference = Rs{diff}"

  - id: ACC11-04
    name: Suspense Account
    rule_description: "When TB doesn't balance, open Suspense Account for the difference. Close when errors are found and rectified."
    formula_template: "Suspense A/c: {'Dr' if diff>0 else 'Cr'} Rs{diff}"

  - id: ACC11-05
    name: Depreciation – SLM
    rule_description: "Depreciation = (Cost − Scrap Value) / Useful Life. Uniform amount each year."
    formula_template: "SLM Dep = ({cost} − {scrap}) / {life} = {dep}/year"

  - id: ACC11-06
    name: Depreciation – WDV Method
    rule_description: "Depreciation = WDV × Rate%. Declining balance. New WDV = Old WDV − Dep."
    formula_template: "Dep = {wdv} × {rate}% = {dep}; New WDV = {wdv} − {dep} = {new_wdv}"

  - id: ACC11-07
    name: Bank Reconciliation Statement
    rule_description: "Start from Cash Book balance. Add/Less items not in Cash Book to arrive at Pass Book balance (or vice versa)."
    formula_template: "PB = CB + {additions} − {deductions} = Rs{pb}"

  - id: ACC11-08
    name: Final Accounts – Trading Account
    rule_description: "GP = Sales + Opening Stock + Direct Expenses − Closing Stock − COGS items."
    formula_template: "GP = {sales} + {os} + {de} − {cs} − {cogs} = Rs{gp}"

  - id: ACC11-09
    name: Final Accounts – P&L Account
    rule_description: "NP = GP + Indirect Incomes − Indirect Expenses."
    formula_template: "NP = {gp}