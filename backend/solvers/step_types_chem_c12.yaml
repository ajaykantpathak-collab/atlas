      - name: reducing_agent
        label: "Reducing Agent"
        type: text
        placeholder: "e.g. C, CO, Al, Electrolysis"
        help_text: "Agent used for reduction"

  - name: chem_metallurgy_refining
    title: "Metallurgy: Refining of Metals"
    category: "Metallurgy"
    fields:
      - name: metal
        label: "Metal to be Refined"
        type: text
        placeholder: "e.g. Cr, Cu, Ni, Al"
