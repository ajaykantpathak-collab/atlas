    category: "Metallurgy"
    fields:
      - name: metal
        label: "Metal"
        type: text
        placeholder: "e.g. Fe, Al, Cu, Ag"
        help_text: "Metal being extracted"
      - name: ore
        label: "Principal Ore"
        type: text
