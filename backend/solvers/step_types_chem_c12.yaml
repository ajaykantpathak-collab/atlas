step_types_chem_c12:
  - name: chem_solid_state_abc_packing
    title: "Solid State: ABC Packing & Void Calculations"
    category: "Solid State"
    fields:
      - name: element
        label: "Element / Compound"
        type: text
        placeholder: "e.g. NaCl, ZnS"
        help_text: "Enter the element or compound name"
      - name: packing_type
        label: "Packing Type"
        type: select
        options: ["Simple Cubic", "Body Centered Cubic", "Face Centered Cubic", "Hexagonal Close Packed"]
        help_text: "Select the crystal packing arrangement"
      - name: radius_ratio
        label: "Radius Ratio (r+/r-)"
        type: text
        placeholder: "e.g. 0.414, 0.732"
        help_text: "Ratio of cation to anion radii"
      - name: coordination_no
        label: "Coordination Number"
        type: number
        placeholder: "6"
        help_text: "Coordination number of the structure"

  - name: chem_solid_state_density
    title: "Solid State: Density of Unit Cell"
    category: "Solid State"
    fields:
      - name: compound
        label: "Compound"
        type: text
        placeholder: "e.g. Cu, NaCl, Diamond"
        help_text: "Name of the crystalline solid"
      - name: molar_mass
        label: "Molar Mass (g/mol)"
        type: number
        placeholder: "58.44"
        help_text: "Molar mass of the compound in g/mol"
      - name: edge_length
        label: "Edge Length (pm)"
        type: number
        placeholder: "564"
        help_text: "Edge length of the unit cell in picometers"
      - name: z_value
        label: "Number of Formula Units per Cell (Z)"
        type: number
        placeholder: "4"
        help_text: "Number of formula units in one unit cell"

  - name: chem_solid_state_defects
    title: "Solid State: Point Defects & Conductivity"
    category: "Solid State"
    fields:
      - name: crystal
        label: "Crystal Type"
        type: select
        options: ["Stoichiometric", "Non-stoichiometric (Metal Excess)", "Non-stoichiometric (Metal Deficiency)", "Schottky", "Frenkel"]
        help_text: "Type of defect in the crystal"
      - name: example
        label: "Example Substance"
        type: text
        placeholder: "e.g. Fe0.93O, AgCl"
        help_text: "Substance exhibiting this defect"
      - name: conductivity_type
        label: "Conductivity Type"
        type: select
        options: ["Intrinsic", "Extrinsic (n-type)", "Extrinsic (p-type)"]
        help_text: "Type of electrical conductivity"

  - name: chem_solutions_molarity
    title: "Solutions: Molarity & Molality Calculations"
    category: "Solutions"
    fields:
      - name: solute
        label: "Solute"
        type: text
        placeholder: "e.g. Glucose, NaCl"
        help_text: "Name of the dissolved substance"
      - name: mass_solute
        label: "Mass of Solute (g)"
        type: number
        placeholder: "18.0"
        help_text: "Mass of solute in grams"
      - name: volume_solution
        label: "Volume of Solution (mL)"
        type: number
        placeholder: "500"
        help_text: "Volume of solution in milliliters"
      - name: molar_mass
        label: "Molar Mass of Solute (g/mol)"
        type: number
        placeholder: "180.16"
        help_text: "Molar mass of the solute"

  - name: chem_solutions_raoult
    title: "Solutions: Raoult's Law & Relative Lowering"
    category: "Solutions"
    fields:
      - name: solvent
        label: "Solvent"
        type: text
        placeholder: "e.g. Water, Benzene"
        help_text: "Name of the solvent"
      - name: vapor_pure
        label: "Vapour Pressure of Pure Solvent (mmHg)"
        type: number
        placeholder: "23.4"
        help_text: "Vapour pressure of the pure solvent"
      - name: vapor_solution
        label: "Vapour Pressure of Solution (mmHg)"
        type: number
        placeholder: "20.0"
        help_text: "Vapour pressure of the solution"
      - name: moles_solute
        label: "Moles of Non-volatile Solute"
        type: number
        placeholder: "0.5"
        help_text: "Amount of non-volatile solute added"

  - name: chem_solutions_colligative
    title: "Solutions: Colligative Properties"
    category: "Solutions"
    fields:
      - name: property_type
        label: "Property"
        type: select
        options: ["Relative Lowering of Vapour Pressure", "Elevation in Boiling Point", "Depression in Freezing Point", "Osmotic Pressure"]
        help_text: "Select the colligative property"
      - name: molality
        label: "Molality (m)"
        type: number
        placeholder: "0.5"
        help_text: "Molality of the solution"
      - name: ebullioscopic
        label: "Ebullioscopic Constant (K_b) K kg/mol"
        type: number
        placeholder: "0.512"
        help_text: "Ebullioscopic constant of the solvent"
      - name: cryoscopic
        label: "Cryoscopic Constant (K_f) K kg/mol"
        type: number
        placeholder: "1.86"
        help_text: "Cryoscopic constant of the solvent"

  - name: chem_solutions_abnormal
    title: "Solutions: Abnormal Molar Mass & van't Hoff Factor"
    category: "Solutions"
    fields:
      - name: solute
        label: "Solute (Electrolyte)"
        type: text
        placeholder: "e.g. NaCl, K2SO4"
        help_text: "The electrolyte dissolved"
      - name: observed_depression
        label: "Observed Freezing Point Depression (K)"
        type: number
        placeholder: "1.86"
        help_text: "Measured freezing point depression"
      - name: calculated_depression
        label: "Calculated Freezing Point Depression (K)"
        type: number
        placeholder: "3.72"
        help_text: "Freezing point depression assuming no dissociation"
      - name: dissociation_degree
        label: "Degree of Dissociation (alpha)"
        type: text
        placeholder: "0.5"
        help_text: "Fraction of solute molecules that dissociate"

  - name: chem_electrochemistry_cell
    title: "Electrochemistry: Galvanic Cell Representation"
    category: "Electrochemistry"
    fields:
      - name: anode_comp
        label: "Anode Compartment"
        type: text
        placeholder: "Zn(s) | Zn2+(aq)"
        help_text: "Oxidation half-cell representation"
      - name: cathode_comp
        label: "Cathode Compartment"
        type: text
        placeholder: "Cu2+(aq) | Cu(s)"
        help_text: "Reduction half-cell representation"
      - name: salt_bridge
        label: "Salt Bridge Electrolyte"
        type: text
        placeholder: "KCl or KNO3"
        help_text: "Electrolyte in the salt bridge"
      - name: direction
        label: "Electron Flow Direction"
        type: select
        options: ["Anode to Cathode", "Cathode to Anode"]
        help_text: "Direction of electron flow in external circuit"

  - name: chem_electrochemistry_nernst
    title: "Electrochemistry: Nernst Equation"
    category: "Electrochemistry"
    fields:
      - name: cell_reaction
        label: "Overall Cell Reaction"
        type: text
        placeholder: "Zn + Cu2+ -> Zn2+ + Cu"
        help_text: "Balanced overall cell reaction"
      - name: standard_emf
        label: "Standard EMF (E°)"
        type: number
        placeholder: "1.10"
        help_text: "Standard cell potential in volts"
      - name: temperature
        label: "Temperature (K)"
        type: number
        placeholder: "298"
        help_text: "Temperature in Kelvin"
      - name: concentrations
        label: "Ion Concentrations (mol/L)"
        type: text
        placeholder: "[Zn2+]=1.0, [Cu2+]=0.01"
        help_text: "Molar concentrations of ionic species"

  - name: chem_electrochemistry_faraday
    title: "Electrochemistry: Faraday's Laws"
    category: "Electrochemistry"
    fields:
      - name: current
        label: "Current (A)"
        type: number
        placeholder: "2.0"
        help_text: "Current passed in amperes"
      - name: time
        label: "Time (seconds)"
        type: number
        placeholder: "3600"
        help_text: "Time for which current flows in seconds"
      - name: equivalent_weight
        label: "Equivalent Weight (g/equivalent)"
        type: number
        placeholder: "31.75"
        help_text: "Equivalent weight of the substance"
      - name: metal
        label: "Metal for Electrolysis"
        type: text
        placeholder: "e.g. Cu, Ag, Al"
        help_text: "Metal being electrodeposited"

  - name: chem_electrochemistry_kohlrausch
    title: "Electrochemistry: Kohlrausch's Law & Conductance"
    category: "Electrochemistry"
    fields:
      - name: electrolyte
        label: "Electrolyte"
        type: text
        placeholder: "e.g. CH3COOH, NaCl"
        help_text: "Strong or weak electrolyte"
      - name: molar_cond
        label: "Molar Conductivity (S cm²/mol)"
        type: number
        placeholder: "390"
        help_text: "Molar conductivity at given concentration"
      - name: limiting_cond
        label: "Limiting Molar Conductivity (S cm²/mol)"
        type: number
        placeholder: "390.7"
        help_text: "Molar conductivity at infinite dilution"
      - name: concentration
        label: "Concentration (mol/L)"
        type: number
        placeholder: "0.1"
        help_text: "Concentration of the electrolyte"

  - name: chem_kinetics_rate_law
    title: "Chemical Kinetics: Rate Law & Order"
    category: "Chemical Kinetics"
    fields:
      - name: reaction
        label: "Reaction"
        type: text
        placeholder: "2NO + O2 -> 2NO2"
        help_text: "Balanced chemical equation"
      - name: order
        label: "Order of Reaction"
        type: select
        options: ["Zero", "First", "Second", "Third", "Fractional"]
        help_text: "Overall order of the reaction"
      - name: rate_constant
        label: "Rate Constant (k)"
        type: number
        placeholder: "2.5e-3"
        help_text: "Rate constant with appropriate units"
      - name: concentration
        label: "Reactant Concentration (mol/L)"
        type: number
        placeholder: "0.1"
        help_text: "Initial concentration of reactant"

  - name: chem_kinetics_half_life
    title: "Chemical Kinetics: Half-Life & Integrated Rate Equations"
    category: "Chemical Kinetics"
    fields:
      - name: order
        label: "Order of Reaction"
        type: select
        options: ["Zero", "First", "Second"]
        help_text: "Order of reaction for half-life calculation"
      - name: rate_constant
        label: "Rate Constant (k)"
        type: number
        placeholder: "2.0e-4"
        help_text: "Rate constant with units"
      - name: initial_conc
        label: "Initial Concentration (mol/L)"
        type: number
        placeholder: "0.8"
        help_text: "Initial concentration of reactant"
      - name: time_elapsed
        label: "Time Elapsed (seconds)"
        type: number
        placeholder: "1000"
        help_text: "Time elapsed for concentration change"

  - name: chem_kinetics_arrhenius
    title: "Chemical Kinetics: Arrhenius Equation"
    category: "Chemical Kinetics"
    fields:
      - name: activation_energy
        label: "Activation Energy (Ea) J/mol"
        type: number
        placeholder: "75000"
        help_text: "Activation energy in Joules per mole"
      - name: temperature1
        label: "Temperature T1 (K)"
        type: number
        placeholder: "300"
        help_text: "Initial temperature in Kelvin"
      - name: temperature2
        label: "Temperature T2 (K)"
        type: number
        placeholder: "310"
        help_text: "Final temperature in Kelvin"
      - name: rate_constant_t1
        label: "Rate Constant at T1 (s⁻¹)"
        type: number
        placeholder: "1.5e-3"
        help_text: "Rate constant at initial temperature"

  - name: chem_surface_adsorption
    title: "Surface Chemistry: Adsorption Isotherms"
    category: "Surface Chemistry"
    fields:
      - name: adsorbate
        label: "Adsorbate"
        type: text
        placeholder: "e.g. Gas on Charcoal"
        help_text: "Substance being adsorbed"
      - name: adsorbent
        label: "Adsorbent"
        type: text
        placeholder: "e.g. Activated Charcoal, Silica Gel"
        help_text: "Substance on which adsorption occurs"
      - name: isotherm
        label: "Adsorption Isotherm"
        type: select
        options: ["Freundlich Isotherm", "Langmuir Isotherm"]
        help_text: "Type of adsorption isotherm"
      - name: pressure
        label: "Pressure (atm)"
        type: number
        placeholder: "1.0"
        help_text: "Equilibrium pressure of adsorbate gas"

  - name: chem_surface_colloids
    title: "Surface Chemistry: Colloids & Tyndall Effect"
    category: "Surface Chemistry"
    fields:
      - name: colloid_type
        label: "Colloid Type"
        type: select
        options: ["Sols", "Gels", "Emulsions", "Foams", "Aerosols", "Solid Sols"]
        help_text: "Dispersion medium and dispersed phase type"
      - name: medium
        label: "Dispersion Medium"
        type: text
        placeholder: "e.g. Water, Air, Oil"
        help_text: "The continuous/dispersion phase"
      - name: dispersed_phase
        label: "Dispersed Phase"
        type: text
        placeholder: "e.g. Gold, Milk fat"
        help_text: "The discontinuous/dispersed phase"
      - name: preparation
        label: "Method of Preparation"
        type: text
        placeholder: "e.g. Bredig's Arc, Peptization"
        help_text: "Method used to prepare the colloid"

  - name: chem_surface_catalysis
    title: "Surface Chemistry: Catalysis & Enzymes"
    category: "Surface Chemistry"
    fields:
      - name: catalyst
        label: "Catalyst"
        type: text
        placeholder: "e.g. Fe (Haber), Ni (Hydrogenation)"
        help_text: "Catalyst involved in the reaction"
      - name: reaction
        label: "Catalyzed Reaction"
        type: text
        placeholder: "N2 + 3H2 -> 2NH3"
        help_text: "The reaction being catalyzed"
      - name: catalyst_type
        label: "Catalyst Type"
        type: select
        options: ["Homogeneous", "Heterogeneous", "Enzyme", "Poisoned", "Promoter/Activator"]
        help_text: "Type of catalyst"
      - name: enzyme
        label: "Enzyme Name (if applicable)"
        type: text
        placeholder: "e.g. Invertase, Pepsin"
        help_text: "Name of enzyme catalyst if applicable"

  - name: chem_metallurgy_extraction
