step_types:
  - title: "Number System Conversion"
    category: "Number Systems"
    fields:
      - name: "input_number"
        label: "Input Number"
        type: "text"
        placeholder: "e.g., 2A3F, 10110, 127"
        help_text: "Enter the number you want to convert"
      - name: "from_base"
        label: "From Base"
        type: "select"
        options: ["2", "8", "10", "16"]
        placeholder: "Select source base"
        help_text: "Select the base of the input number"
      - name: "to_base"
        label: "To Base"
        type: "select"
        options: ["2", "8", "10", "16"]
        placeholder: "Select target base"
        help_text: "Select the base to convert to"

  - title: "1's Complement"
    category: "Number Systems"
    fields:
      - name: "binary_number"
        label: "Binary Number"
        type: "text"
        placeholder: "e.g., 10110, 01101"
        help_text: "Enter the binary number"
      - name: "bits"
        label: "Number of Bits"
        type: "number"
        placeholder: "e.g., 8"
        help_text: "Total number of bits for the representation"

  - title: "2's Complement"
    category: "Number Systems"
    fields:
      - name: "binary_number"
        label: "Binary Number"
        type: "text"
        placeholder: "e.g., 10110, 01101"
        help_text: "Enter the binary number"
      - name: "bits"
        label: "Number of Bits"
        type: "number"
        placeholder: "e.g., 8"
        help_text: "Total number of bits for the representation"

  - title: "Subtraction Using Complement"
    category: "Number Systems"
    fields:
      - name: "minuend"
        label: "Minuend (M)"
        type: "text"
        placeholder: "e.g., 10101"
        help_text: "The number from which another is subtracted"
      - name: "subtrahend"
        label: "Subtrahend (N)"
        type: "text"
        placeholder: "e.g., 01110"
        help_text: "The number to be subtracted"
      - name: "complement_type"
        label: "Complement Method"
        type: "select"
        options: ["1's", "2's"]
        placeholder: "Select complement type"
        help_text: "Choose 1's or 2's complement method"
      - name: "bits"
        label: "Number of Bits"
        type: "number"
        placeholder: "e.g., 8"
        help_text: "Total number of bits for representation"

  - title: "Binary Addition"
    category: "Number Systems"
    fields:
      - name: "augend"
        label: "First Number"
        type: "text"
        placeholder: "e.g., 10101"
        help_text: "First binary number (augend)"
      - name: "addend"
        label: "Second Number"
        type: "text"
        placeholder: "e.g., 01110"
        help_text: "Second binary number (addend)"
      - name: "bits"
        label: "Number of Bits"
        type: "number"
        placeholder: "e.g., 8"
        help_text: "Total number of bits for carry handling"

  - title: "Boolean Function Simplification"
    category: "Boolean Algebra"
    fields:
      - name: "expression"
        label: "Boolean Expression"
        type: "textarea"
        placeholder: "e.g., A(B + C') + AB'C"
        help_text: "Enter the Boolean expression using A, B, C, +, ', ( )"
      - name: "method"
        label: "Simplification Method"
        type: "select"
        options: ["Algebraic", "K-Map (2 var)", "K-Map (3 var)", "K-Map (4 var)"]
        placeholder: "Select method"
        help_text: "Choose the method for simplification"

  - title: "Karnaugh Map (K-Map)"
    category: "Boolean Algebra"
    fields:
      - name: "variables"
        label: "Number of Variables"
        type: "select"
        options: ["2", "3", "4", "5", "6"]
        placeholder: "Select number of variables"
        help_text: "Select the number of variables in the function"
      - name: "minterms"
        label: "Minterms (comma separated)"
        type: "text"
        placeholder: "e.g., 0,1,2,5,6,7"
        help_text: "Enter the minterm numbers (Σ notation) separated by commas"
      - name: "dont_cares"
        label: "Don't Care Conditions"
        type: "text"
        placeholder: "e.g., 3,4"
        help_text: "Enter don't care terms if any (Φ notation)"

  - title: "Maxterms / Canonical POS"
    category: "Boolean Algebra"
    fields:
      - name: "variables"
        label: "Number of Variables"
        type: "select"
        options: ["2", "3", "4"]
        placeholder: "Select number of variables"
        help_text: "Select the number of variables"
      - name: "maxterms"
        label: "Maxterms (comma separated)"
        type: "text"
        placeholder: "e.g., 0,3,5,6"
        help_text: "Enter the maxterm numbers (Π notation) separated by commas"

  - title: "Logic Gate Identification"
    category: "Logic Gates"
    fields:
      - name: "gate_type"
        label: "Gate Type"
        type: "select"
        options: ["AND", "OR", "NOT", "NAND", "NOR", "XOR", "XNOR"]
        placeholder: "Select gate type"
        help_text: "Select the type of logic gate"
      - name: "input_count"
        label: "Number of Inputs"
        type: "select"
        options: ["1", "2", "3", "4"]
        placeholder: "Select input count"
        help_text: "Number of input pins for the gate"

  - title: "Truth Table Generator"
    category: "Logic Gates"
    fields:
      - name: "gate_type"
        label: "Gate Type"
        type: "select"
        options: ["AND", "OR", "NOT", "NAND", "NOR", "XOR", "XNOR"]
        placeholder: "Select gate type"
        help_text: "Select the type of logic gate"
      - name: "input_count"
        label: "Number of Inputs"
        type: "select"
        options: ["1", "2", "3", "4"]
        placeholder: "Select input count"
        help_text: "Number of input variables"

  - title: "Logic Gate Diagram / Expression"
    category: "Logic Gates"
    fields:
      - name: "description"
        label: "Gate Description / Expression"
        type: "textarea"
        placeholder: "e.g., Output = (A AND B) OR (NOT C)"
        help_text: "Describe the gate combination or Boolean expression"

  - title: "Java Class Definition"
    category: "Java Programming"
    fields:
      - name: "class_name"
        label: "Class Name"
        type: "text"
        placeholder: "e.g., Student, Complex, Matrix"
        help_text: "Name of the Java class (should start with uppercase)"
      - name: "data_members"
        label: "Data Members"
        type: "textarea"
        placeholder: "e.g., int rollNo; String name; float marks;"
        help_text: "Enter data members with types, one per line"
      - name: "member_functions"
        label: "Member Functions"
        type: "textarea"
        placeholder: "e.g., void input(), void display(), float average()"
        help_text: "Enter function signatures, one per line"

  - title: "Java Constructor Definition"
    category: "Java Programming"
    fields:
      - name: "class_name"
        label: "Class Name"
        type: "text"
        placeholder: "e.g., Book, Point"
        help_text: "Name of the class the constructor belongs to"
      - name: "constructor_type"
        label: "Constructor Type"
        type: "select"
        options: ["Default", "Parameterized"]
        placeholder: "Select constructor type"
        help_text: "Choose default or parameterized constructor"
      - name: "parameters"
        label: "Parameters"
        type: "text"
        placeholder: "e.g., int id, String title, float price"
        help_text: "Enter constructor parameters with types"

  - title: "Java Inheritance / extends"
    category: "Java Programming"
    fields:
      - name: "superclass"
        label: "Superclass Name"
        type: "text"
        placeholder: "e.g., Person, Shape"
        help_text: "Name of the parent/super class"
      - name: "subclass"
        label: "Subclass Name"
        type: "text"
        placeholder: "e.g., Student, Circle"
        help_text: "Name of the child/sub class"
      - name: "new_members"
        label: "New Members in Subclass"
        type: "textarea"
        placeholder: "New data members and functions added in subclass"
        help_text: "Additional members defined in the subclass"

  - title: "Java Interface / implements"
    category: "Java Programming"
    fields:
      - name: "interface_name"
        label: "Interface Name"
        type: "text"
        placeholder: "e.g., Comparable, Serializable"
        help_text: "Name of the interface"
      - name: "class_name"
        label: "Implementing Class"
        type: "text"
        placeholder: "e.g., Student, Product"
        help_text: "Name of the class implementing the interface"
      - name: "methods_to_implement"
        label: "Methods to Implement"
        type: "textarea"
        placeholder: "List of interface methods to override"
        help_text: "Enter the methods defined in the interface"

  - title: "Java Array Sorting"
    category: "Java Programming"
    fields:
      - name: "array_type"
        label: "Array Type"
        type: "select"
        options: ["int[]", "String[]", "float[]", "double[]"]
        placeholder: "Select array type"
        help_text: "Data type of the array elements"
      - name: "sort_algorithm"
        label: "Sort Algorithm"
        type: "select"
        options: ["Bubble Sort", "Selection Sort", "Insertion Sort", "Arrays.sort()"]
        placeholder: "Select sorting algorithm"
        help_text: "Choose the sorting technique to implement"
      - name: "sample_input"
        label: "Sample Input Array"
        type: "text"
        placeholder: "e.g., {64, 34, 25, 12, 22, 11, 90}"
        help_text: "Sample array values for demonstration"

  - title: "Java String Operations"
    category: "Java Programming"
    fields:
      - name: "operation"
        label: "String Operation"
        type: "select"
        options: ["length()", "charAt()", "substring()", "indexOf()", "compareTo()", "toUpperCase()", "toLowerCase()", "concat()", "equals()"]
        placeholder: "Select operation"
        help_text: "Select the String method to demonstrate"
      - name: "sample_string"
        label: "Sample String"
        type: "text"
        placeholder: "e.g., ComputerScience"
        help_text: "Sample string on which the operation is performed"
      - name: "parameters"
        label: "Operation Parameters"
        type: "text"
        placeholder: "e.g., 5, 0 5"
        help_text: "Parameters required for the selected operation"

  - title: "Single Dimensional Array Operations"
    category: "Arrays"
    fields:
      - name: "operation"
        label: "Array Operation"
        type: "select"
        options: ["Linear Search", "Binary Search", "Insert Element", "Delete Element", "Find Max/Min", "Array Sum", "Array Reverse", "Frequency Count"]
        placeholder: "Select operation"
        help_text: "Select the array operation to perform"
      - name: "array_size"
        label: "Array Size"
        type: "number"
        placeholder: "e.g., 10"
        help_text: "Size of the array"
      - name: "array_elements"
        label: "Array Elements"
        type: "text"
        placeholder: "e.g., 10, 20, 30, 40, 50"
        help_text: "Enter array elements separated by commas"

  - title: "Two Dimensional Array Operations"
    category: "Arrays"
    fields:
      - name: "operation"
        label: "Matrix Operation"
        type: "select"
        options: ["Matrix Addition", "Matrix Multiplication", "Matrix Transpose", "Sum of Diagonal", "Row Sum", "Column Sum", "Display Matrix"]
        placeholder: "Select operation"
        help_text: "Select the 2D array / matrix operation"
      - name: "rows"
        label: "Number of Rows"
        type: "number"
        placeholder: "e.g., 3"
        help_text: "Number of rows in the matrix"
      - name: "columns"
        label: "Number of Columns"
        type: "number"
        placeholder: "e.g., 3"
        help_text: "Number of columns in the matrix"
      - name: "matrix_a"
        label: "Matrix A Elements"
        type: "textarea"
        placeholder: "1 2 3\n4 5 6\n7 8 9"
        help_text: "Enter Matrix A values row-wise"
      - name: "matrix_b"
        label: "Matrix B Elements"
        type: "textarea"
        placeholder: "1 2 3\n4 5 6\n7 8 9"
        help_text: "Enter Matrix B values row-wise (for addition/multiplication)"

  - title: "String Manipulation Operations"
    category: "Strings"
    fields:
      - name: "operation"
        label: "String Operation"
        type: "select"
        options: ["Word Count", "Character Count", "Palindrome Check", "Case Conversion", "String Reversal", "Vowel Count", "Substring Search", "String Replace", "Anagram Check"]
        placeholder: "Select operation"
        help_text: "Select the string operation to perform"
      - name: "input_string"
        label: "Input String"
        type: "text"
        placeholder: "e.g., MADAM, COMPUTER, hello world"
        help_text: "Enter the string to process"
      - name: "search_string"
        label: "Search/Replace String"
        type: "text"
        placeholder: "e.g., abc, XYZ"
        help_text: "Secondary string for search or replace operations"
      - name: "ignore_case"
        label: "Ignore Case"
        type: "checkbox"
        placeholder: "Check to ignore case sensitivity"
        help_text: "Enable case-insensitive comparison"

  - title: "String Array Operations"
    category: "Strings"
    fields:
      - name: "operation"
        label: "String Array Operation"
        type: "select"
        options: ["Sort Strings", "Search String", "Concatenate All", "Longest String", "Shortest String", "String Frequency", "Reverse Each String"]
        placeholder: "Select operation"
        help_text: "Select the string array operation"
      - name: "string_count"
        label: "Number of Strings"
        type: "number"
        placeholder: "e.g., 5"
        help_text: "Number of strings in the array"
      - name: "string_elements"
        label: "String Elements"
        type: "textarea"
        placeholder: "APPLE\nBANANA\nCHERRY\nDATE\nELDERBERRY"
        help_text: "Enter strings, one per line"

  - title: "ALU / CPU Components"
    category: "Computer Architecture"
    fields:
      - name: "component"
        label: "Component"
        type: "select"
        options: ["ALU", "CU (Control Unit)", "Registers", "Cache Memory", "Primary Memory (RAM)", "Secondary Memory", "Buses (Data/Address/Control)"]
        placeholder: "Select component"
        help_text: "Select the architecture component"
      - name: "question_type"
        label: "Question Type"
        type: "select"
        options: ["Function", "Types", "Characteristics", "Difference"]
        placeholder: "Select question type"
        help_text: "Type of question about the component"

  - title: "Memory Organisation"
    category: "Computer Architecture"
    fields:
      - name: "memory_type"
        label: "Memory Type"
        type: "select"
        options: ["ROM", "PROM", "EPROM", "EEPROM", "Cache (L1/L2/L3)", "RAM (SRAM/DRAM)", "Virtual Memory"]
        placeholder: "Select memory type"
        help_text: "Select the type of memory"
      - name: "address_lines"
        label: "Number of Address Lines"
        type: "number"
        placeholder: "e.g., 16"
        help_text: "Number of address lines for memory size calculation"
      - name: "data_lines"
        label: "Data Lines per Chip"
        type: "number"
        placeholder: "e.g., 8"
        help_text: "Data lines per memory chip"

  - title: "Memory Size Calculation"
    category: "Computer Architecture"
    fields:
      - name: "capacity"
        label: "Memory Capacity"
        type: "text"
        placeholder: "e.g., 64 KB, 2 MB, 1 GB"
        help_text: "Total memory capacity to be organized"
      - name: "chip_capacity"
        label: "Memory Chip Capacity"
        type: "text"
        placeholder: "e.g., 4K x 8, 16K x 1"
        type: "text"
        placeholder: "e.g., 4K x 8, 16K x 1"
        help_text: "Capacity of individual memory chip (in KxM format)"

  - title: "Boolean to Logic Gate Conversion"
    category: "Logic Gates"
    fields:
      - name: "boolean_expression"
        label: "Boolean Expression"
        type: "textarea"
        placeholder: "e.g., F = A'B + AB' + AB"
        help_text: "Enter the Boolean expression"
      - name: "show_simplified"
        label: "Show Simplified Expression"
        type: "checkbox"
        placeholder: "Check to show simplified form"
        help_text: "Simplify the Boolean expression before drawing gates"

  - title: "Decoder / Encoder Design"
    category: "Logic Gates"
    fields:
      - name: "device_type"
        label: "Device Type"
        type: "select"
        options: ["Decoder (2:4)", "Decoder (3:8)", "Decoder (4:16)", "Encoder (4:2)", "Encoder (8:3)"]
        placeholder: "Select device"
        help_text: "Select the combinational logic device"
      - name: "enable_line"
        label: "Enable Line"
        type: "checkbox"
        placeholder: "Include enable line"
        help_text: "Check if the device has an enable line"