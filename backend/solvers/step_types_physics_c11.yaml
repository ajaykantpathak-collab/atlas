step_types:
  - id: physics_units_dimensional_analysis
    title: Dimensional Analysis
    category: Units & Measurements
    description: Verify dimensional homogeneity or derive dimensional formulas
    fields:
      - name: problem_statement
        label: Problem Statement
        type: textarea
        placeholder: e.g., Check the dimensional correctness of v = u + at
        help_text: Enter the equation or formula to analyze
      - name: physical_quantity
        label: Physical Quantity
        type: text
        placeholder: e.g., Force, Energy, Pressure
        help_text: The physical quantity whose formula needs derivation
      - name: given_dependencies
        label: Given Dependencies
        type: textarea
        placeholder: e.g., F depends on m, v, and r
        help_text: List the quantities the physical quantity depends on

  - id: physics_units_conversion
    title: Unit Conversion
    category: Units & Measurements
    description: Convert between different unit systems (SI, CGS, MKS)
    fields:
      - name: value
        label: Given Value
        type: number
        placeholder: e.g., 72
        help_text: The numerical value to convert
      - name: from_unit
        label: From Unit
        type: text
        placeholder: e.g., km/h
        help_text: The unit to convert from
      - name: to_unit
        label: To Unit
        type: text
        placeholder: e.g., m/s
        help_text: The unit to convert to

  - id: physics_units_significant_figures
    title: Significant Figures & Errors
    category: Units & Measurements
    description: Calculate absolute, relative errors and percentage errors
    fields:
      - name: measured_value
        label: Measured Value
        type: text
        placeholder: e.g., 9.8 m/s²
        help_text: The measured physical quantity
      - name: exact_value
        label: True / Exact Value
        type: text
        placeholder: e.g., 10 m/s²
        help_text: The accepted or exact value
      - name: operation
        label: Operation
        type: select
        options: [Subtraction, Addition, Multiplication, Division, Power]
        placeholder: Select the mathematical operation

  - id: physics_kinematics_motion_1d
    title: One-Dimensional Motion
    category: Kinematics
    description: Solve problems using equations of motion
    fields:
      - name: initial_velocity
        label: Initial Velocity (u)
        type: text
        placeholder: e.g., 0 or 20 m/s
        help_text: Initial velocity in m/s (leave blank if not given)
      - name: final_velocity
        label: Final Velocity (v)
        type: text
        placeholder: e.g., 30 m/s
        help_text: Final velocity in m/s (leave blank if unknown)
      - name: acceleration
        label: Acceleration (a)
        type: text
        placeholder: e.g., 5 m/s²
        help_text: Acceleration in m/s² (leave blank if unknown)
      - name: time
        label: Time (t)
        type: text
        placeholder: e.g., 4 s
        help_text: Time duration in seconds (leave blank if unknown)
      - name: displacement
        label: Displacement (s)
        type: text
        placeholder: e.g., 100 m
        help_text: Displacement in meters (leave blank if unknown)
      - name: unknown_quantity
        label: Find
        type: select
        options: [final_velocity, displacement, time, acceleration, initial_velocity]

  - id: physics_kinematics_free_fall
    title: Free Fall / Vertically Thrown Body
    category: Kinematics
    description: Motion under gravity — upward or downward
    fields:
      - name: initial_velocity
        label: Initial Velocity (u)
        type: text
        placeholder: e.g., 50 m/s (upward is positive)
        help_text: Positive if thrown upward, negative if thrown downward
      - name: height
        label: Height (h)
        type: text
        placeholder: e.g., 100 m
        help_text: Height from which body falls or maximum height
      - name: g_value
        label: Acceleration Due to Gravity (g)
        type: text
        placeholder: 9.8 or 10 m/s²
        help_text: Usually taken as positive for calculations
      - name: find_quantity
        label: Find
        type: select
        options: [time_to_reach_max_height, max_height, velocity_after_time, time_to_hit_ground, velocity_at_ground]

  - id: physics_kinematics_projectile
    title: Projectile Motion
    category: Kinematics
    description: Two-dimensional motion with horizontal and vertical components
    fields:
      - name: launch_speed
        label: Launch Speed (u)
        type: text
        placeholder: e.g., 50 m/s
        help_text: Initial speed of projectile
      - name: launch_angle
        label: Launch Angle (θ)
        type: text
        placeholder: e.g., 30 degrees
        help_text: Angle with the horizontal in degrees
      - name: g_value
        label: Gravity (g)
        type: text
        placeholder: 9.8 m/s²
        help_text: Acceleration due to gravity
      - name: launch_height
        label: Launch Height
        type: text
        placeholder: e.g., 20 m
        help_text: Initial height above ground (default: 0)
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [max_height, time_of_flight, horizontal_range, velocity_at_any_point, angle_of_projection]

  - id: physics_kinematics_graphs
    title: Motion Graphs
    category: Kinematics
    description: Analyze displacement-time, velocity-time, and acceleration-time graphs
    fields:
      - name: graph_type
        label: Graph Type
        type: select
        options: [Displacement-Time, Velocity-Time, Acceleration-Time]
        placeholder: Select the type of graph
      - name: description
        label: Graph Description
        type: textarea
        placeholder: e.g., Straight line with positive slope from origin
        help_text: Describe the shape of the graph (linear, curved, etc.)
      - name: time_interval
        label: Time Interval
        type: text
        placeholder: e.g., 0 to 10 s
        help_text: Time range of interest
      - name: find_quantity
        label: Find
        type: select
        options: [displacement, average_velocity, instantaneous_velocity, acceleration, total_distance]

  - id: physics_kinematics_relative_motion
    title: Relative Motion & River-Boat Problems
    category: Kinematics
    description: Relative velocity in one and two dimensions
    fields:
      - name: velocity_A
        label: Velocity of A (magnitude)
        type: text
        placeholder: e.g., 10 m/s
        help_text: Magnitude of first object's velocity
      - name: velocity_B
        label: Velocity of B (magnitude)
        type: text
        placeholder: e.g., 8 m/s
        help_text: Magnitude of second object's velocity
      - name: direction_angle
        label: Angle Between Velocities
        type: text
        placeholder: e.g., 60 degrees
        help_text: Angle between the two velocity vectors
      - name: problem_type
        label: Problem Type
        type: select
        options: [Linear relative velocity, River-boat, Rain-man, Aircraft-wind]

  - id: physics_newton_first_law
    title: Newton's First Law (Inertia)
    category: Laws of Motion
    description: Inertia and force required to change state of motion
    fields:
      - name: mass
        label: Mass of Object
        type: text
        placeholder: e.g., 10 kg
        help_text: Mass of the object
      - name: initial_velocity
        label: Initial Velocity
        type: text
        placeholder: e.g., 20 m/s
        help_text: Initial velocity of the object
      - name: force_applied
        label: Force Applied
        type: text
        placeholder: e.g., 50 N
        help_text: Net force acting on the object
        required: false
      - name: time_force_acts
        label: Time Force Acts
        type: text
        placeholder: e.g., 5 s
        help_text: Duration force acts
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [final_velocity, force_required, inertia_demonstration]

  - id: physics_newton_second_law
    title: Newton's Second Law
    category: Laws of Motion
    description: F = ma — force, mass, and acceleration relationships
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 5 kg
        help_text: Mass of the object in kg
      - name: force
        label: Force (F)
        type: text
        placeholder: e.g., 25 N
        help_text: Net force in Newtons (leave blank if unknown)
      - name: acceleration
        label: Acceleration (a)
        type: text
        placeholder: e.g., 5 m/s²
        help_text: Acceleration in m/s² (leave blank if unknown)
      - name: friction_coefficient
        label: Coefficient of Friction (μ)
        type: text
        placeholder: e.g., 0.3
        help_text: Coefficient of friction (if applicable)
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [acceleration, force, mass, frictional_force, net_acceleration]

  - id: physics_newton_third_law
    title: Newton's Third Law (Action-Reaction)
    category: Laws of Motion
    description: Action-reaction pairs and their implications
    fields:
      - name: action_force
        label: Action Force
        type: text
        placeholder: e.g., 100 N
        help_text: The action force in Newtons
      - name: mass_A
        label: Mass of Object A
        type: text
        placeholder: e.g., 10 kg
        help_text: Mass of object exerting action
        required: false
      - name: mass_B
        label: Mass of Object B
        type: text
        placeholder: e.g., 5 kg
        help_text: Mass of object receiving action
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [reaction_force, acceleration_A, acceleration_B]

  - id: physics_friction
    title: Friction & Limiting Friction
    category: Laws of Motion
    description: Static, kinetic, and rolling friction problems
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 20 kg
        help_text: Mass of the body
      - name: coefficient_static
        label: Coefficient of Static Friction (μₛ)
        type: text
        placeholder: e.g., 0.4
        help_text: Coefficient of static friction
      - name: coefficient_kinetic
        label: Coefficient of Kinetic Friction (μₖ)
        type: text
        placeholder: e.g., 0.3
        help_text: Coefficient of kinetic friction
      - name: applied_force
        label: Applied Force (F)
        type: text
        placeholder: e.g., 50 N
        help_text: Horizontal force applied
      - name: angle_incline
        label: Incline Angle (θ)
        type: text
        placeholder: e.g., 30 degrees
        help_text: Angle of inclined plane (0 for horizontal)
      - name: find_quantity
        label: Find
        type: select
        options: [limiting_friction, frictional_force, acceleration, angle_of_repose, force_to_move]

  - id: physics_circular_motion
    title: Circular Motion & Centripetal Force
    category: Laws of Motion
    description: Uniform and non-uniform circular motion
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 2 kg
        help_text: Mass of the object
      - name: velocity
        label: Velocity (v)
        type: text
        placeholder: e.g., 10 m/s
        help_text: Linear speed
      - name: radius
        label: Radius (r)
        type: text
        placeholder: e.g., 5 m
        help_text: Radius of the circular path
      - name: angular_velocity
        label: Angular Velocity (ω)
        type: text
        placeholder: e.g., 2 rad/s
        help_text: Angular speed (leave blank if not given)
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [centripetal_force, centripetal_acceleration, angular_velocity, frequency, time_period, tension]

  - id: physics_conservation_momentum
    title: Conservation of Linear Momentum
    category: Laws of Motion
    description: Collision problems — elastic and inelastic
    fields:
      - name: mass_1
        label: Mass of Object 1 (m₁)
        type: text
        placeholder: e.g., 2 kg
        help_text: Mass of first object
      - name: mass_2
        label: Mass of Object 2 (m₂)
        type: text
        placeholder: e.g., 3 kg
        help_text: Mass of second object
      - name: velocity_1_initial
        label: Initial Velocity of Object 1 (u₁)
        type: text
        placeholder: e.g., 10 m/s
        help_text: Initial velocity of first object
      - name: velocity_2_initial
        label: Initial Velocity of Object 2 (u₂)
        type: text
        placeholder: e.g., 0 m/s
        help_text: Initial velocity of second object
      - name: velocity_1_final
        label: Final Velocity of Object 1 (v₁)
        type: text
        placeholder: e.g., 2 m/s
        help_text: Final velocity of first object (leave blank if unknown)
        required: false
      - name: velocity_2_final
        label: Final Velocity of Object 2 (v₂)
        type: text
        placeholder: e.g., ?
        help_text: Final velocity of second object (leave blank if unknown)
        required: false
      - name: collision_type
        label: Collision Type
        type: select
        options: [Elastic, Inelastic, Perfectly Inelastic]
      - name: find_quantity
        label: Find
        type: select
        options: [velocity_1_final, velocity_2_final, kinetic_energy_lost, recoil_velocity]

  - id: physics_impulse
    title: Impulse & Impulsive Force
    category: Laws of Motion
    description: Impulse-momentum theorem applications
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 0.5 kg
        help_text: Mass of the object
      - name: initial_velocity
        label: Initial Velocity (u)
        type: text
        placeholder: e.g., 20 m/s
        help_text: Initial velocity
      - name: final_velocity
        label: Final Velocity (v)
        type: text
        placeholder: e.g., -10 m/s
        help_text: Final velocity after impact
      - name: contact_time
        label: Contact Time (Δt)
        type: text
        placeholder: e.g., 0.01 s
        help_text: Time of contact/impact
      - name: find_quantity
        label: Find
        type: select
        options: [impulse, average_force, change_in_momentum, final_velocity, contact_time]

  - id: physics_work_energy
    title: Work & Work-Energy Theorem
    category: Work, Energy & Power
    description: Calculate work done by constant and variable forces
    fields:
      - name: force
        label: Force (F)
        type: text
        placeholder: e.g., 10 N
        help_text: Magnitude of force applied
      - name: displacement
        label: Displacement (s)
        type: text
        placeholder: e.g., 20 m
        help_text: Displacement in the direction of force
      - name: angle
        label: Angle Between F and s (θ)
        type: text
        placeholder: e.g., 60 degrees
        help_text: Angle between force and displacement
      - name: initial_velocity
        label: Initial Velocity (u)
        type: text
        placeholder: e.g., 5 m/s
        help_text: Initial velocity of the object
        required: false
      - name: final_velocity
        label: Final Velocity (v)
        type: text
        placeholder: e.g., 15 m/s
        help_text: Final velocity of the object
        required: false
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 2 kg
        help_text: Mass of the object
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [work_done, kinetic_energy_change, velocity]

  - id: physics_power
    title: Power
    category: Work, Energy & Power
    description: Average and instantaneous power calculations
    fields:
      - name: force
        label: Force (F)
        type: text
        placeholder: e.g., 50 N
        help_text: Applied force
      - name: velocity
        label: Velocity (v)
        type: text
        placeholder: e.g., 10 m/s
        help_text: Velocity of the object
      - name: work_done
        label: Work Done (W)
        type: text
        placeholder: e.g., 1000 J
        help_text: Total work done
        required: false
      - name: time
        label: Time (t)
        type: text
        placeholder: e.g., 20 s
        help_text: Time interval
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [power, work_done, time, efficiency]

  - id: physics_kinetic_energy
    title: Kinetic Energy
    category: Work, Energy & Power
    description: Translational and rotational kinetic energy
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 5 kg
        help_text: Mass of the object
      - name: velocity
        label: Velocity (v)
        type: text
        placeholder: e.g., 10 m/s
        help_text: Speed of the object
      - name: find_quantity
        label: Find
        type: select
        options: [kinetic_energy, velocity_from_KE, mass_from_KE]

  - id: physics_potential_energy
    title: Gravitational Potential Energy
    category: Work, Energy & Power
    description: Gravitational potential energy and elastic potential energy
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 10 kg
        help_text: Mass of the object
      - name: height
        label: Height (h)
        type: text
        placeholder: e.g., 50 m
        help_text: Height above reference level
      - name: spring_constant
        label: Spring Constant (k)
        type: text
        placeholder: e.g., 100 N/m
        help_text: For elastic PE problems
        required: false
      - name: extension
        label: Extension/Compression (x)
        type: text
        placeholder: e.g., 0.2 m
        help_text: Displacement from natural length
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [gravitational_PE, elastic_PE, height, spring_constant, extension]

  - id: physics_conservation_energy
    title: Conservation of Mechanical Energy
    category: Work, Energy & Power
    description: Apply conservation of energy to solve problems
    fields:
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 5 kg
        help_text: Mass of the object
      - name: initial_height
        label: Initial Height (h₁)
        type: text
        placeholder: e.g., 20 m
        help_text: Starting height
      - name: final_height
        label: Final Height (h₂)
        type: text
        placeholder: e.g., 5 m
        help_text: Ending height
      - name: initial_velocity
        label: Initial Velocity (u)
        type: text
        placeholder: e.g., 0 m/s
        help_text: Initial velocity (default: 0)
      - name: friction_coefficient
        label: Coefficient of Friction (μ)
        type: text
        placeholder: e.g., 0.1
        help_text: For rough surfaces
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [velocity_at_bottom, height_reached, energy_lost_to_friction]

  - id: physics_rotational_motion_kinematics
    title: Rotational Kinematics
    category: Rotational Motion
    description: Angular displacement, velocity, acceleration and their relationships
    fields:
      - name: initial_angular_velocity
        label: Initial Angular Velocity (ω₀)
        type: text
        placeholder: e.g., 0 rad/s
        help_text: Initial angular velocity
      - name: angular_acceleration
        label: Angular Acceleration (α)
        type: text
        placeholder: e.g., 2 rad/s²
        help_text: Angular acceleration
      - name: time
        label: Time (t)
        type: text
        placeholder: e.g., 5 s
        help_text: Time elapsed
      - name: angular_displacement
        label: Angular Displacement (θ)
        type: text
        placeholder: e.g., 25 rad
        help_text: Angular displacement in radians
      - name: find_quantity
        label: Find
        type: select
        options: [final_angular_velocity, angular_displacement, angular_acceleration, time, number_of_revolutions]

  - id: physics_moment_of_inertia
    title: Moment of Inertia
    category: Rotational Motion
    description: Calculate moment of inertia for various geometries
    fields:
      - name: mass
        label: Mass (M)
        type: text
        placeholder: e.g., 5 kg
        help_text: Total mass of the body
      - name: geometry
        label: Geometry / Shape
        type: select
        options: [Solid_Cylinder_about_axis, Hollow_Cylinder_about_axis, Solid_Sphere_about_diameter, Hollow_Sphere_about_diameter, Thin_Rod_about_end, Thin_Rod_about_center, Disc_about_axis, Rectangular_Plate_about_edge, Disc_about_diameter]
        help_text: Shape of the object and axis of rotation
      - name: radius
        label: Radius / Length Parameter
        type: text
        placeholder: e.g., 0.3 m
        help_text: Radius for spheres/cylinders, length for rods
      - name: parallel_distance
        label: Distance for Parallel Axis (d)
        type: text
        placeholder: e.g., 0.5 m
        help_text: Distance between parallel axes
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [moment_of_inertia, radius_of_gyration, new_I_by_parallel_axis]

  - id: physics_torque
    title: Torque & Angular Momentum
    category: Rotational Motion
    description: Torque, angular momentum, and their conservation
    fields:
      - name: force
        label: Force (F)
        type: text
        placeholder: e.g., 20 N
        help_text: Applied force
      - name: lever_arm
        label: Lever Arm / Radius (r)
        type: text
        placeholder: e.g., 0.5 m
        help_text: Perpendicular distance from axis
      - name: angle_force
        label: Angle Between r and F (θ)
        type: text
        placeholder: e.g., 90 degrees
        help_text: Angle between radius vector and force
      - name: moment_of_inertia
        label: Moment of Inertia (I)
        type: text
        placeholder: e.g., 2 kg·m²
        help_text: Moment of inertia about axis
      - name: angular_velocity
        label: Angular Velocity (ω)
        type: text
        placeholder: e.g., 3 rad/s
        help_text: Angular velocity
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [torque, angular_momentum, angular_acceleration, radius_of_gyration]

  - id: physics_rotational_dynamics
    title: Rotational Dynamics
    category: Rotational Motion
    description: τ = Iα and related dynamic problems
    fields:
      - name: torque
        label: Torque (τ)
        type: text
        placeholder: e.g., 10 N·m
        help_text: Applied torque
      - name: moment_of_inertia
        label: Moment of Inertia (I)
        type: text
        placeholder: e.g., 5 kg·m²
        help_text: Moment of inertia of the body
      - name: mass
        label: Mass (m)
        type: text
        placeholder: e.g., 4 kg
        help_text: Mass for pulley/cylinder problems
        required: false
      - name: radius
        label: Radius (R)
        type: text
        placeholder: e.g., 0.2 m
        help_text: Radius of pulley or cylinder
        required: false
      - name: hanging_mass
        label: Hanging Mass (m₂)
        type: text
        placeholder: e.g., 3 kg
        help_text: Mass hanging from pulley
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [angular_acceleration, tension_in_string, linear_acceleration, torque_required]

  - id: physics_rolling_motion
    title: Rolling Motion
    category: Rotational Motion
    description: Rolling without slipping — kinetic energy and velocity relations
    fields:
      - name: mass
        label: Mass (M)
        type: text
        placeholder: e.g., 10 kg
        help_text: Mass of the rolling body
      - name: radius
        label: Radius (R)
        type: text
        placeholder: e.g., 0.3 m
        help_text: Radius of the body
      - name: geometry
        label: Body Type
        type: select
        options: [Solid_Cylinder, Hollow_Cylinder, Solid_Sphere, Hollow_Sphere, Ring]
      - name: linear_velocity
        label: Linear Velocity (v)
        type: text
        placeholder: e.g., 5 m/s
        help_text: Linear speed of the center
      - name: height_incline
        label: Height of Incline (h)
        type: text
        placeholder: e.g., 10 m
        help_text: Height of inclined plane
      - name: find_quantity
        label: Find
        type: select
        options: [angular_velocity, total_KE, translational_KE, rotational_KE, velocity_at_bottom]

  - id: physics_gravitation_kepler
    title: Kepler's Laws & Gravitation
    category: Gravitation
    description: Universal law of gravitation and Kepler's laws
    fields:
      - name: mass1
        label: Mass of Body 1 (M)
        type: text
        placeholder: e.g., 6 × 10²⁴ kg
        help_text: Mass of first body (e.g., Earth)
      - name: mass2
        label: Mass of Body 2 (m)
        type: text
        placeholder: e.g., 1000 kg
        help_text: Mass of second body (e.g., satellite)
      - name: distance
        label: Separation Distance (r)
        type: text
        placeholder: e.g., 6.4 × 10⁶ m
        help_text: Distance between the two bodies
      - name: orbital_radius
        label: Orbital Radius (R)
        type: text
        placeholder: e.g., 1.5 × 10¹¹ m
        help_text: Radius of orbit (for Kepler's third law)
        required: false
      - name: orbital_period
        label: Orbital Period (T)
        type: text
        placeholder: e.g., 365 days
        help_text: Time period of revolution
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [gravitational_force, acceleration_due_to_gravity, orbital_period, orbital_velocity, escape_velocity]

  - id: physics_gravitation_field
    title: Gravitational Field & Potential
    category: Gravitation
    description: Gravitational field strength and potential energy
    fields:
      - name: mass_body
        label: Mass of Central Body (M)
        type: text
        placeholder: e.g., 6 × 10²⁴ kg
        help_text: Mass of the body creating the field
      - name: distance
        label: Distance from Center (r)
        type: text
        placeholder: e.g., 4 × 10⁶ m
        help_text: Distance from center of body
      - name: height_above_surface
        label: Height Above Surface (h)
        type: text
