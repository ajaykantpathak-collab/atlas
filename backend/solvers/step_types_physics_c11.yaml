    category: Waves
    description: Nodes, antinodes, harmonics, resonance in strings and pipes
    fields:
      - name: string_length
        label: Length (L)
        type: text
        placeholder: e.g., 1 m
        help_text: Length of string or air column
      - name: wave_speed
        label: Wave Speed (v)
        type: text
        placeholder: e.g., 300 m/s
        help_text: Speed of wave in the medium
      - name: harmonic_number
        label: Harmonic / Mode Number (n)
        type: text
        placeholder: e.g., 3
        help_text: Harmonic number
      - name: pipe_type
        label: Pipe Type
        type: select
        options: [Open_at_both_ends, Closed_at_one_end]
        required: false
      - name: tension
        label: Tension (T)
        type: text
        placeholder: e.g., 100 N
        help_text: Tension in string (if calculating wave speed)
        required: false
      - name: linear_density
        label: Linear Density (μ)
        type: text
        placeholder: e.g., 0.01 kg/m
        help_text: Linear mass density
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [resonant_frequency, wavelength, number_of_nodes, number_of_antinodes, wave_speed, frequencies_of_harmonics]

  - id: physics_beats
    title: Beats & Beat Frequency
    category: Waves
    description: Superposition of two waves with close frequencies
    fields:
      - name: frequency_1
        label: Frequency of First Source (f₁)
        type: text
        placeholder: e.g., 256 Hz
        help_text: Frequency of first wave
      - name: frequency_2
        label: Frequency of Second Source (f₂)
        type: text
        placeholder: e.g., 260 Hz
        help_text: Frequency of second wave
      - name: time
        label: Time Interval
        type: text
        placeholder: e.g., 5 s
        help_text: Time over which beats are counted
        required: false
      - name: beat_count
        label: Number of Beats
        type: text
        placeholder: e.g., 20
        help_text: Number of beats heard
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [beat_frequency, frequency_of_source, unknown_frequency]

  - id: physics_doppler_effect
    title: Doppler Effect
    category: Waves
    description: Frequency shift due to relative motion
    fields:
      - name: source_frequency
        label: Source Frequency (f₀)
        type: text
        placeholder: e.g., 500 Hz
        help_text: Frequency emitted by the source
      - name: source_velocity
        label: Source Velocity (vₛ)
        type: text
        placeholder: e.g., 20 m/s
        help_text: Velocity of source (positive toward observer)
      - name: observer_velocity
        label: Observer Velocity (vₒ)
        type: text
        placeholder: e.g., 0 m/s
        help_text: Velocity of observer (positive toward source)
      - name: wave_speed
        label: Wave Speed (v)
        type: text
        placeholder: e.g., 340 m/s (sound)
        help_text: Speed of wave in the medium
      - name: medium_moving
        label: Is Medium Moving?
        type: select
        options: [No, Yes — Wind toward Observer, Yes — Wind toward Source]
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [observed_frequency, wavelength, source_velocity, observer_velocity]

  - id: physics_wave_superposition
    title: Superposition & Interference
    category: Waves
    description: Interference of two waves — constructive and destructive
    fields:
      - name: wavelength_1
        label: Wavelength λ₁
        type: text
        placeholder: e.g., 0.5 m
        help_text: Wavelength of first wave
      - name: wavelength_2
        label: Wavelength λ₂
        type: text
        placeholder: e.g., 0.5 m
        help_text: Wavelength of second wave
      - name: path_difference
        label: Path Difference (Δx)
        type: text
        placeholder: e.g., 0.25 m
        help_text: Difference in path lengths
      - name: frequency
        label: Frequency (f)
        type: text
        placeholder: e.g., 340 Hz
        help_text: Common frequency of both waves
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [resultant_wavelength, condition_for_constructive, condition_for_destructive, resultant_amplitude, phase_difference]

  - id: physics_wave_reflection
    title: Reflection & Refraction of Waves
    category: Waves
    description: Laws of reflection and refraction of waves
    fields:
      - name: incident_angle
        label: Angle of Incidence (i)
        type: text
        placeholder: e.g., 30 degrees
        help_text: Angle of incidence with normal
      - name: refracted_angle
        label: Angle of Refraction (r)
        type: text
        placeholder: e.g., 20 degrees
        help_text: Angle of refraction
        required: false
      - name: velocity_1
        label: Velocity in Medium 1 (v₁)
        type: text
        placeholder: e.g., 340 m/s
        help_text: Wave speed in first medium
        required: false
      - name: velocity_2
        label: Velocity in Medium 2 (v₂)
        type: text
        placeholder: e.g., 1500 m/s
        help_text: Wave speed in second medium
        required: false
      - name: incident_wavelength
        label: Incident Wavelength (λ₁)
        type: text
        placeholder: e.g., 0.68 m
        help_text: Wavelength in first medium
        required: false
      - name: find_quantity
        label: Find
        type: select
        options: [angle_of_reflection, angle_of_refraction, snells_law_verification, refracted_wavelength, critical_angle]