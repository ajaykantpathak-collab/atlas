# ISC Class 12 Accountancy – Problem Type Definitions
# Each problem_type: id, solver_key, topic_node, description, difficulty, parameters, bloom_level, context_template, competency_flags

problem_types:
  # ── Partnership ──────────────────────────────────────────────────────────
  - id: PT-ACC-001
    solver_key: partnership_sacrifice_ratio
    topic_node: "1.1 – Admission of Partner"
    description: "Calculate sacrifice/gaining ratio when a partner is admitted with a new profit-sharing ratio."
    difficulty: "easy"
    parameters:
      required: [old_A, old_B, old_C, new_A, new_B, new_C]
      ranges:
        old_A: [0.1, 0.7]
        old_B: [0.1, 0.7]
        old_C: [0.05, 0.5]
        new_A: [0.05, 0.7]
        new_B: [0.05, 0.7]
        new_C: [0.05, 0.5]
      constraints: "old_A+old_B+old_C=1.0; new_A+new_B+new_C=1.0"
    bloom_level: "Apply"
    context_template: |
      {partner_A}, {partner_B} and {partner_C} share profits in the ratio {old_ratio}.
      {partner_D} is admitted and the new ratio becomes {new_ratio}. Find the sacrifice ratio.
    competency_flags: [standard, formula_application]
    misconception_tags: [confuses_sacrifice_with_old_ratio, forgets_sign_convention, sums_sacrifices_to_wrong_total]

  - id: PT-ACC-002
    solver_key: goodwill_super_profit
    topic_node: "1.2 – Valuation of Goodwill"
    description: "Calculate goodwill using the Super Profit method."
    difficulty: "medium"
    parameters:
      required: [capital_employed, normal_rate, average_profit, years_purchase]
      ranges:
        capital_employed: [100000, 5000000]
        normal_rate: [8, 15]
        average_profit: [50000, 2000000]
        years_purchase: [2, 5]
      constraints: "average_profit > capital_employed × normal_rate/100 (positive super profit)"
    bloom_level: "Apply"
    context_template: |
      {company_name}, a partnership firm in {city}, has a capital employed of Rs {capital_employed}.
      The normal rate of return is {normal_rate}%. Average profits are Rs {average_profit}.
      Goodwill is valued at {years_purchase} years' purchase of super profit. Calculate goodwill.
    competency_flags: [standard, formula_application]
    misconception_tags: [uses_avg_profit_directly, forgets_normal_profit, multiplies_by_wrong_years]

  - id: PT-ACC-003
    solver_key: revaluation_account
    topic_node: "1.3 – Revaluation on Admission"
    description: "Prepare a Revaluation Account and distribute gain/loss according to the old ratio."
    difficulty: "medium"
    parameters:
      required: [items, old_ratio]
      ranges:
        items_count: [3, 6]
        old_ratio: ["1:1:1", "3:2:1", "5:3:2", "4:3:3", "2:1:1"]
      item_types: [asset_up, asset_down, liability_up, liability_down, provision]
    bloom_level: "Analyse"
    context_template: |
      {partner_A}, {partner_B} and {partner_C} share profits as {old_ratio}.
      On admission of {partner_D}, the following assets and liabilities are revalued:
      {item_list}. Prepare Revaluation Account and show distribution.
    competency_flags: [standard, multi_step]
    misconception_tags: [credits_asset_increase, shares_in_new_ratio, forgets_provision]

  - id: PT-ACC-004
    solver_key: share_issue
    topic_node: "2.1 – Issue of Shares"
    description: "Pass journal entries for issue of shares at par, premium, or discount with underwriting."
    difficulty: "medium"
    parameters:
      required: [face_value, shares_issued, premium, application_money, allotment_money, first_call, underwriting_pct]
      ranges:
        face_value: [10, 100]
        shares_issued: [1000, 50000]
        premium: [0, 50]
        underwriting_pct: [0, 5]
    bloom_level: "Apply"
    context_template: |
      {company_name} Ltd. in {city} issues {shares_issued} equity shares of Rs {face_value} each at a
      premium of Rs {premium}. Underwriting commission is {underwriting_pct}%. Applications are received
      for {shares_applied} shares. Pass journal entries.
    competency_flags: [standard, journal_entries]
    misconception_tags: [credits_premium_to_share_cap, forgets_underwriting_commission, wrong_app_ratio]

  - id: PT-ACC-005
    solver_key: forfeiture_reissue
    topic_node: "2.2 – Forfeiture and Reissue of Shares"
    description: "Pass journal entries on forfeiture and reissue of shares."
    difficulty: "hard"
    parameters:
      required: [shares_forfeited, face_value, paid_up_amount, reissue_shares, reissue_price]
      ranges:
        shares_forfeited: [100, 5000]
        reissue_shares: [50, 3000]
    bloom_level: "Analyse"
    context_template: |
      {member_name} failed to pay calls on {shares_forfeited} shares of Rs {face_value} each (paid up: Rs {paid_up_amount}).
      {reissue_shares} shares were reissued at Rs {reissue_price}. Pass journal entries for forfeiture and reissue.
    competency_flags: [standard, journal_entries]
    misconception_tags: [uses_face_value_not_paid_up, forgets_capital_reserve, wrong_reissue_entry]

  - id: PT-ACC-006
    solver_key: financial_statements
    topic_node: "3.1 – Final Accounts (Company)"
    description: "Prepare Trading Account, Profit & Loss Account and Balance Sheet with adjustments."
    difficulty: "hard"
    parameters:
      required: [trial_balance, adjustments]
      ranges:
        trial_balance_items: [15, 30]
        adjustments_count: [5, 10]
    bloom_level: "Evaluate"
    context_template: |
      From the Trial Balance of {company_name} Ltd. as on {date}, prepare Trading A/c, P&L A/c and Balance Sheet
      after giving effect to the following adjustments: {adjustments_list}.
    competency_flags: [competency, real_world, multi_step, data_interpretation]
    misconception_tags: [misses_adjustment, wrong_debit_credit, mixes_trading_and_pl, forgets_closing_stock]

  - id: PT-ACC-007
    solver_key: cash_flow_statement
    topic_node: "4.1 – Cash Flow Statement"
    description: "Prepare Cash Flow Statement using indirect method with two balance sheets."
    difficulty: "hard"
    parameters:
      required: [net_profit, balance_sheets, non_cash_items, investing_activities, financing_activities]
    bloom_level: "Analyse"
    context_template: |
      From the Balance Sheets of {company_name} Ltd. as at March 31, 2024 and March 31, 2025, and additional
      information, prepare Cash Flow Statement using indirect method.
    competency_flags: [competency, real_world, multi_step, data_interpretation]
    misconception_tags: [treats_wrong_activity, forgets_non_cash_items, wrong_wc_sign]

  - id: PT-ACC-008
    solver_key: ratio_analysis
    topic_node: "5.1 – Ratio Analysis"
    description: "Calculate and interpret a specific financial ratio from given data."
    difficulty: "easy"
    parameters:
      required: [ratio_type, data]
      ratio_types: [current_ratio, quick_ratio, debt_equity, debt, inventory_turnover, debtor_turnover,
                    gross_profit_ratio, net_profit_ratio, return_on_capital, return_on_equity]
    bloom_level: "Apply"
    context_template: |
      From the Balance Sheet and P&L A/c of {company_name} Ltd., calculate {ratio_display_name}
      and comment on the financial position.
    competency_flags: [standard, formula_application, interpretation]
    misconception_tags: [wrong_formula, uses_wrong_values, wrong_interpretation]