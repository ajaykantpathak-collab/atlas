# ISC Class 11 Biology — Step Types for Pedagogy

step_types:

  - id: ST_GIVEN
    name: "Given Data Extraction"
    description: "Extract and restate known quantities from the problem"
    display_name: "Given"
    validate: "non_empty_list"
    bloom_level: "Remembering"

  - id: ST_APPLY_FORMULA
    name: "Apply Formula"
    description: "State and apply the relevant biological formula"
    display_name: "Apply Formula"
    validate: "expression_valid"
    bloom_level: "Applying"

  - id: ST_CLASSIFY
    name: "Taxonomic Classification"
    description: "Use dichotomous key to identify organism at correct taxonomic rank"
    display_name: "Classification"
    validate: "rank_consistent"
    bloom_level: "Analyzing"

  - id: ST_COMPLEMENT
    name: "Base Complement"
    description: "Find complementary strand using base pairing rules"
    display_name: "Complement"
    validate: "complement_valid"
    bloom_level: "Understanding"

  - id: ST_TRANSCRIPTION
    name: "Transcription Step"
    description: "Write mRNA sequence from DNA template strand"
    display_name: "Transcription"
    validate: "transcription_valid"
    bloom_level: "Applying"

  - id: ST_TRANSLATION
    name: "Translation Step"
    description: "Convert mRNA codons to amino acid sequence"
    display_name: "Translation"
    validate: "translation_valid"
    bloom_level: "Applying"

  - id: ST_METABOLIC_EQN
    name: "Balance Metabolic Equation"
    description: "Write balanced equation for photosynthesis or respiration"
    display_name: "Metabolic Equation"
    validate: "atoms_balanced"
    bloom_level: "Applying"

  - id: ST_ENERGY_CALC
    name: "ATP / Energy Calculation"
    description: "Calculate ATP yield or energy released"
    display_name: "Energy Calculation"
    validate: "positive_integer_or_float"
    bloom_level: "Applying"

  - id: ST_POPULATION_MODEL
    name: "Population Growth Model"
    description: "Apply exponential/logistic growth equation"
    display_name: "Population Model"
    validate: "population_positive"
    bloom_level: "Applying"

  - id: ST_ECOLOGY_CALC
    name: "Ecology Calculation"
    description: "Compute energy transfer or species richness"
    display_name: "Ecology Calculation"
    validate: "efficiency_0_to_100"
    bloom_level: "Applying"

  - id: ST_HW_SETUP
    name: "Hardy-Weinberg Setup"
    description: "Identify alleles and write p + q = 1"
    display_name: "H-W Setup"
    validate: "pq_equals_one"
    bloom_level: "Understanding"

  - id: ST_HW_CALC
    name: "Hardy-Weinberg Calculation"
    description: "Compute p, q, and genotype frequencies"
    display_name: "H-W Calculation"
    validate: "freq_sum_equals_one"
    bloom_level: "Applying"

  - id: ST_NUMERICAL_CHECK
    name: "Numerical Verification"
    description: "Back-substitute to verify the answer"
    display_name: "Numerical Check"
    validate: "check_pass"
    bloom_level: "Evaluating"

  - id: ST_EVIDENCE
    name: "State Evidence"
    description: "Provide biological evidence for a claim"
    display_name: "Evidence"
    validate: "non_empty"
    bloom_level: "Remembering"

  - id: ST_INFERENCE
    name: "Draw Inference"
    description: "Draw a biological inference from data"
    display_name: "Inference"
    validate: "logical_inference"
    bloom_level: "Analyzing"

  - id: ST_CRITICAL_ANALYSIS
    name: "Critical Analysis"
    description: "Analyze data and draw evidence-based conclusions"
    display_name: "Critical Analysis"
    validate: "analysis_supported"
    bloom_level: "Analyzing"

  - id: ST_INDIAN_APPLY
    name: "Indian Context Application"
    description: "Apply principle to Indian scenario"
    display_name: "Indian Context"
    validate: "indian_context_present"
    bloom_level: "Applying"

  - id: ST_INNOVATION
    name: "Innovation/Design Thinking"
    description: "Propose a biotech solution to a real-world problem"
    display_name: "Innovation"
    validate: "proposal_viable"
    bloom_level: "Creating"

  - id: ST_VERIFY_GENETICS
    name: "Verify Genetic Cross"
    description: "Back-substitute to confirm ratios"
    display_name: "Verify Cross"
    validate: "ratio_verified"
    bloom_level: "Evaluating"

  - id: ST_PUNNETT_SQUARE
    name: "Construct Punnett Square"
    description: "Draw Punnett square and list offspring genotypes"
    display_name: "Punnett Square"
    validate: "punnett_valid"
    bloom_level: "Applying"

  - id: ST_RATIO
    name: "Compute Ratio"
    description: "Express genotype/phenotype counts as ratio"
    display_name: "Ratio"
    validate: "ratio_sum_correct"
    bloom_level: "Analyzing"

  - id: ST_PROBABILITY
    name: "Probability Calculation"
    description: "Use product/sum rules for cross outcomes"
    display_name: "Probability"
    validate: "probability_in_0_1"
    bloom_level: "Applying"

  - id: ST_PHOTOSYNTHESIS_ANALYSIS
    name: "Photosynthesis Analysis"
    description: "Analyze factors affecting photosynthetic rate"
    display_name: "Photosynthesis Analysis"
    validate: "factor_consistent"
    bloom_level: "Analyzing"

  - id: ST_RESPIRATION_ANALYSIS
    name: "Respiration Analysis"
    description: "Compare aerobic and anaerobic respiration pathways"
    display_name: "Respiration Analysis"
    validate: "pathway_consistent"
    bloom_level: "Analyzing"

  - id: ST_HORMONE_ANALYSIS
    name: "Phytohormone Analysis"
    description: "Analyze the effect of a plant hormone on growth"
    display_name: "Hormone Analysis"
    validate: "hormone_effect_consistent"
    bloom_level: "Analyzing"

  - id: ST_DIGESTION_CALC
    name: "Digestive System Calculation"
    description: "Calculate enzyme activity or digestive product quantities"
    display_name: "Digestion Calculation"
    validate: "enzyme_calculation_valid"
    bloom_level: "Applying"

  - id: ST_RESPIRATORY_CALC
    name: "Respiratory System Calculation"
    description: "Calculate lung capacity, breathing rate, or O2/CO2 exchange"
    display_name: "Respiratory Calculation"
    validate: "lung_capacity_valid"
    bloom_level: "Applying"

  - id: ST_NEURAL_ANALYSIS
    name: "Neural Control Analysis"
    description: "Analyze neural pathways and reflex arcs"
    display_name: "Neural Analysis"
    validate: "pathway_complete"
    bloom_level: "Analyzing"

  - id: ST_ETHICS
    name: "Bioethics Analysis"
    description: "Analyze ethical implications of a biological practice"
    display_name: "Ethics Analysis"
    validate: "argument_coherent"
    bloom_level: "Evaluating"