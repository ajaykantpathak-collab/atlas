    difficulty: easy
    thinking_question:
      question: According to Malus's law, when plane polarized light passes through an analyser at angle θ to the polarizer axis, the intensity is:
      options:
        - I₀ cos θ
        - I₀ cos² θ
        - I₀ sin θ
        - I₀ sin² θ
      correct_answer: I₀ cos² θ
