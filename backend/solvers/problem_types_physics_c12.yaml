      - DETERMINE_RESONANCE_CONDITION
      - CALCULATE_RESONANT_FREQUENCY
      - CALCULATE_Q_FACTOR
    marks: 8
    difficulty: hard
    thinking_question:
      question: In a series LCR circuit at resonance, the impedance is:
      options:
        - Maximum
        - Zero
        - Equal to R
        - Indeterminate
