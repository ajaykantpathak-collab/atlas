    title: Power in AC Circuits — Wattless Current
    steps:
      - CALCULATE_AVERAGE_POWER
      - IDENTIFY_REACTIVE_COMPONENTS
      - CALCULATE_POWER_FACTOR
    marks: 5
    difficulty: medium
    thinking_question:
