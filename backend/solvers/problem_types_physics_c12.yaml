      - DETERMINE_NATURE_OF_IMAGE
    marks: 5
    difficulty: medium
    thinking_question:
      question: A convex lens produces a real image three times the size of the object. If the object distance is 20 cm, the focal length is:
      options:
        - 10 cm
        - 15 cm
        - 20 cm
        - 30 cm
      correct_answer: 15 cm
    subtopic: Ray Optics

  - id: OPTICS_RAY_C12_03
