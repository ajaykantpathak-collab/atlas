      options:
        - Maximum
        - Zero
        - VI
        - VI cos φ
      correct_answer: Zero
    subtopic: AC Circuits

  - id: OPTICS_RAY_C12_01
    title: Reflection at Spherical Surfaces — Mirror Formula
