      - CALCULATE_MAGNIFICATION
      - DETERMINE_NATURE_OF_IMAGE
    marks: 5
    difficulty: medium
    thinking_question:
      question: For a concave mirror, if the object is placed at the center of curvature, the image is:
      options:
        - Virtual, erect, and enlarged
        - Real, inverted, and same size
        - Real, inverted, and diminished
        - Virtual, erect, and same size
      correct_answer: Real, inverted, and same size
    subtopic: Ray Optics

  - id: OPTICS_RAY_C12_02
    title: Refraction at Spherical Surfaces — Lens Formula
