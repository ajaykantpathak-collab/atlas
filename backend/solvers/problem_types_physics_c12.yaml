      - CALCULATE_FINAL_IMAGE
    marks: 6
    difficulty: medium
    thinking_question:
      question: Two thin lenses of focal lengths +10 cm and -15 cm are placed in contact. The equivalent focal length is:
      options:
        - -30 cm
        - +30 cm
        - +6 cm
        - -6 cm
      correct_answer: +30 cm
    subtopic: Ray Optics

  - id: OPTICS_RAY_C12_04
    title: Prism — Minimum Deviation and Dispersion
    steps:
      - APPLY_PRISM_FORMULA
