# ISC Class 11 Chemistry – Problem Type Definitions
# Each type links to step_types, specifies Indian context, Bloom's level, and node coverage
problem_types:
  # ─── Topic 1: Basic Concepts ───────────────────────────────────────────────
  - id: mole_concept
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "standard"
    blooms_level: "Understanding"
    description: "Calculate moles, mass, or number of particles from given data"
    indian_context:
      chemicals: ["copper_wire", "iron_nail", "sodium_chloride", "sugar", "calcium_carbonate"]
      scenarios: ["jeweller measuring gold", "salt merchant", "baking ingredients", "school lab copper"]
      units: ["g", "kg", "mg", "mol", "moles"]
      places: ["Delhi", "Kolkata", "Chennai", "Mumbai"]
    steps: ["MOL_CALC", "UNIT_CONVERSION"]
    parameters:
      mass_range: [1, 500]
      molar_mass_range: [10, 300]
    misconceptions: ["confusing mass with moles", "wrong molar mass lookup"]

  - id: empirical_formula
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "standard"
    blooms_level: "Applying"
    description: "Determine empirical formula from % composition"
    indian_context:
      compounds: ["hydrocarbon_fuel", "organic_fertilizer", "pesticide_sample", "coal_sample"]
      scenarios: ["agricultural testing lab", "petroleum refinery", "quality control lab"]
    steps: ["EMPIRICAL_FORMULA", "UNIT_CONVERSION"]
    parameters:
      elements_pool: [["C","H"], ["C","H","O"], ["N","H"], ["Fe","O"], ["Mg","O"]]
    misconceptions: ["rounding too early", "wrong order of division", "confusing % with mass"]

  - id: molecular_formula
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "competency"
    blooms_level: "Applying"
    description: "Find molecular formula from empirical formula and molar mass"
    indian_context:
      compounds: ["aspirin", "benzene", "naphthalene", "glucose", "vitamin_C"]
      scenarios: ["pharmaceutical lab in Hyderabad", "food testing in Pune", "quality control"]
    steps: ["EMPIRICAL_FORMULA", "MOLECULAR_FORMULA"]
    parameters:
      n_range: [1, 6]
    misconceptions: ["n not integer", "wrong empirical formula input"]

  - id: stoichiometry
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "competency"
    blooms_level: "Applying"
    description: "Calculate mass of product from mass of reactant in a balanced reaction"
    indian_context:
      reactions:
        - "Mg + ½O₂ → MgO (fireworks in Mumbai)"
        - "Fe₂O₃ + 3CO → 2Fe + 3CO₂ (iron making in Bhilai)"
        - "2Al + Fe₂O₃ → Al₂O₃ + 2Fe (thermite)"
        - "CaCO₃ → CaO + CO₂ (lime kiln in Rajasthan)"
        - "2H₂ + O₂ → 2H₂O (hydrogen fuel)"
      scenarios: ["fireworks industry in Sivakasi", "steel plant in Bhilai", "cement factory in Gujarat"]
    steps: ["STOICHIOMETRY_CHAIN", "UNIT_CONVERSION"]
    parameters:
      reactant_mass_range: [5, 200]
    misconceptions: ["wrong molar ratio", "unbalanced equation", "wrong molar mass"]

  - id: limiting_reagent
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "standard"
    blooms_level: "Analyzing"
    description: "Identify limiting reagent and calculate product mass"
    indian_context:
      reactions:
        - "2H₂ + O₂ → 2H₂O (hydrogen-oxygen rocket fuel)"
        - "N₂ + 3H₂ → 2NH₃ (Haber process in Gujarat)"
        - "Fe + S → FeS (matchbox composition)"
      scenarios: ["rocket fuel calculation", "ammonia plant", "match factory"]
    steps: ["LIMITING_REAGENT", "STOICHIOMETRY_CHAIN"]
    parameters:
      mass_A_range: [5, 100]
      mass_B_range: [5, 100]
    misconceptions: ["not dividing by coefficient", "choosing heavier mass as limiting"]

  - id: percent_yield
    topic: "Basic Concepts of Chemistry"
    topic_id: 1
    type_class: "competency"
    blooms_level: "Evaluating"
    description: "Calculate percentage yield of a reaction"
    indian_context:
      reactions:
        - "N₂ + 3H₂ → 2NH₃ (Haber process)"
        - "SO₂ + ½O₂ → SO₃ (contact process for H₂SO₄)"
        - "CaCO₃ → CaO + CO₂"
      scenarios: ["fertilizer plant in Namrup", "sulfuric acid plant in Haldia", "cement plant"]
    steps: ["LIMITING_REAGENT", "PERCENT_YIELD"]
    parameters:
      theoretical_range: [50, 500]
      percent_range: [40, 95]
    misconceptions: ["swapping actual/theoretical", "not identifying limiting reagent first"]

  # ─── Topic 2: Atomic Structure ──────────────────────────────────────────────
  - id: debroglie_wavelength
    topic: "Atomic Structure"
    topic_id: 2
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate de Broglie wavelength of an electron given energy/velocity"
    indian_context:
      scenarios: ["electron microscope in IISc Bangalore", "cathode ray tube experiment"]
    steps: ["DEBROGLIE", "UNIT_CONVERSION"]
    parameters:
      energy_ev_range: [10, 20000]
    misconceptions: ["wrong Planck constant", "eV to J conversion error", "using wavelength formula instead"]

  - id: bohr_energy_levels
    topic: "Atomic Structure"
    topic_id: 2
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate Bohr energy and transition energy for hydrogen"
    indian_context:
      scenarios: ["spectroscopy lab at PRL Ahmedabad", "hydrogen discharge tube experiment"]
    steps: ["BOHR_ENERGY", "RADIATION_FREQ"]
    parameters:
      n1_range: [1, 4]
      n2_range: [2, 6]
      ensure_n2_gt_n1: true
    misconceptions: ["forgetting negative sign", "wrong Z value for hydrogen", "n starting from 0"]

  - id: electronic_configuration
    topic: "Atomic Structure"
    topic_id: 2
    type_class: "standard"
    blooms_level: "Applying"
    description: "Write electronic configuration of given element, identify quantum numbers"
    indian_context:
      elements: ["Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar", "K", "Ca", "Cr", "Cu", "Zn", "Fe"]
      scenarios: ["atomic spectroscopy at TIFR Mumbai"]
    steps: ["QUANTUM_NUMBERS", "ELECTRONIC_CONFIG"]
    parameters:
      z_range: [1, 30]
    misconceptions: ["wrong (n+l) order", "forgetting Cr/Cu exception", "wrong Aufbau sequence"]

  # ─── Topic 3: Classification of Elements ───────────────────────────────────
  - id: ionization_enthalpy_trend
    topic: "Classification of Elements and Periodicity"
    topic_id: 3
    type_class: "competency"
    blooms_level: "Analyzing"
    description: "Compare IE values and explain anomalies (Group 13, 15, 16)"
    indian_context:
      scenarios: ["Comparing Na and Mg in classroom", "alkali metal reactivity in fireworks"]
    steps: ["IONIZATION_ENTHALPY"]
    parameters:
      pairs_pool: [["Na","Mg"], ["Mg","Al"], ["P","S"], ["N","O"], ["F","Ne"], ["Cl","Ar"]]
    misconceptions: ["confusing IE with EN", "wrong anomaly explanation", "confusing first and second IE"]

  - id: electron_gain_enthalpy
    topic: "Classification of Elements and Periodicity"
    topic_id: 3
    type_class: "standard"
    blooms_level: "Remembering"
    description: "Predict and compare electron gain enthalpies"
    indian_context:
      scenarios: ["halogen reactivity in water treatment", "chlorine disinfection in Delhi Jal Board"]
    steps: ["ELECTRON_GAIN_ENTHALPY"]
    parameters:
      element_pairs: [["Cl","F"], ["O","S"], ["N","O"], ["Cl","Br"]]
    misconceptions: ["sign convention confusion", "wrong periodic trend direction"]

  - id: electronegativity_calculation
    topic: "Classification of Elements and Periodicity"
    topic_id: 3
    type_class: "competency"
    blooms_level: "Evaluating"
    description: "Calculate bond polarity and % ionic character from electronegativity values"
    indian_context:
      bonds: [["H-Cl"], ["H-F"], ["Na-Cl"], ["C-H"], ["O-H"]]
      scenarios: ["water purification chemistry", "table salt production in Gujarat"]
    steps: ["ELECTRONEGATIVITY", "BOND_ENERGY"]
    parameters:
      electronegativity_table: {H: 2.20, C: 2.55, N: 3.04, O: 3.44, F: 3.98, Na: 0.93, Mg: 1.31, Cl: 3.16, S: 2.58}
    misconceptions: ["wrong electronegativity values", "confusing bond energy with ionic character"]

  # ─── Topic 4: Chemical Bonding ──────────────────────────────────────────────
  - id: lewis_structure
    topic: "Chemical Bonding and Molecular Structure"
    topic_id: 4
    type_class: "standard"
    blooms_level: "Applying"
    description: "Draw Lewis structure of given molecule/ion"
    indian_context:
      molecules: [["CO₂"], ["NH₃"], ["H₂O"], ["BF₃"], ["CH₄"], ["CO"], ["NO₃⁻"], ["SO₄²⁻"], ["PCl₅"], ["SF₆"]]
      scenarios: ["carbon dioxide in atmosphere", "ammonia in fertilizers", "sulfuric acid in industry"]
    steps: ["LEWIS_STRUCTURE"]
    parameters:
      pool: ["CO2", "NH3", "H2O", "BF3", "CH4", "CO", "NO3-", "SO4--", "PCl5", "SF6", "N2O", "C2H2", "HCOOH"]
    misconceptions: ["wrong valence electron count", "not completing octet", "wrong formal charge"]

  - id: vsepr_geometry
    topic: "Chemical Bonding and Molecular Structure"
    topic_id: 4
    type_class: "standard"
    blooms_level: "Applying"
    description: "Predict molecular geometry and bond angles using VSEPR"
    indian_context:
      molecules: [["NH₃", "trigonal pyramidal", 107], ["H₂O", "bent", 104.5], ["BF₃", "trigonal planar", 120], ["CH₄", "tetrahedral", 109.5], ["PCl₅", "trigonal bipyramidal", 90]]
      scenarios: ["water molecule shape", "ammonia geometry"]
    steps: ["VSEPR_GEOMETRY", "LEWIS_STRUCTURE"]
    parameters:
      pool: ["NH3", "H2O", "BF3", "CH4", "PCl5", "SF4", "XeF2", "XeF4", "ClF3", "IF7"]
    misconceptions: ["ignoring lone pairs", "wrong steric number", "confusing geometry with hybridization"]

  - id: hybridization
    topic: "Chemical Bonding and Molecular Structure"
    topic_id: 4
    type_class: "standard"
    blooms_level: "Understanding"
    description: "Determine hybridization of central atom and predict geometry"
    indian_context:
      molecules: [["ethene", "sp2"], ["ethyne", "sp"], ["ethane", "sp3"], ["BF3", "sp2"], ["PCl5", "sp3d"], ["SF6", "sp3d2"]]
      scenarios: ["plastic polymer ethene monomer", "acetylene in oxy-acetylene torch", "fertilizer PCl5 production"]
    steps: ["HYBRIDIZATION", "VSEPR_GEOMETRY"]
    parameters:
      pool: ["ethane", "ethene", "ethyne", "BF3", "BeCl2", "PCl5", "SF6", "NH3", "H2O"]
    misconceptions: ["counting double bonds incorrectly", "confusing geometry with hybridization type"]

  - id: molecular_orbital_theory
    topic: "Chemical Bonding and Molecular Structure"
    topic_id: 4
    type_class: "standard"
    blooms_level: "Analyzing"
    description: "Calculate bond order and predict magnetic properties from MO diagram"
    indian_context:
      molecules: [["N2"], ["O2"], ["F2"], ["NO"], ["C2"]]
      scenarios: ["diatomic gas properties", "oxygen paramagnetism demonstration"]
    steps: ["BOND_ORDER"]
    parameters:
      pool: ["N2", "O2", "F2", "NO", "C2", "B2"]
    misconceptions: ["wrong MO filling order", "forgetting π2p > σ2p for B₂,C₂,N₂", "confusing bond order with bond strength"]

  # ─── Topic 5: Thermodynamics ────────────────────────────────────────────────
  - id: hess_law
    topic: "Thermodynamics"
    topic_id: 5
    type_class: "competency"
    blooms_level: "Applying"
    description: "Apply Hess's law to find enthalpy of a target reaction"
    indian_context:
      reactions:
        - "C + O₂ → CO₂; CO + ½O₂ → CO₂ → find C + ½O₂ → CO"
        - "H₂ + ½O₂ → H₂O(l); H₂ + ½O₂ → H₂O(g) → find H₂O(g) → H₂O(l) (condensation at Diwali)"
        - "N₂ + O₂ → 2NO; N₂ + 2O₂ → 2NO₂ → find 2NO + O₂ → 2NO₂"
      scenarios: ["Haber process energy in Gujarat", "energy balance in steel plant", "diwali firecracker energetics"]
    steps: ["HESS_LAW", "ENTHALPY_STATE"]
    parameters:
      target_reactions: ["formation", "combustion", "phase_change", "combination"]
    misconceptions: ["not reversing ΔH when reversing equation", "forgetting to multiply ΔH by coefficient"]

  - id: bond_enthalpy
    topic: "Thermodynamics"
    topic_id: 5
    type_class: "competency"
    blooms_level: "Applying"
    description: "Estimate ΔH of reaction using average bond enthalpies"
    indian_context:
      reactions:
        - "CH₄ + 2O₂ → CO₂ + 2H₂O (natural gas combustion in Delhi kitchens)"
        - "C₂H₆ + 3.5O₂ → 2CO₂ + 3H₂O (LPG cooking)"
      scenarios: ["natural gas in Delhi households", "LPG cylinder in Chennai", "firecracker combustion in Sivakasi"]
    steps: ["BOND_ENTHALPY_CALC", "UNIT_CONVERSION"]
    parameters:
      bonds: ["C-H", "O=O", "C=O", "O-H", "C-C", "C=C"]
    misconceptions: ["wrong sign convention", "counting bonds incorrectly in reactants/products", "not converting J to kJ"]

  - id: gibbs_free_energy
    topic: "Thermodynamics"
    topic_id: 5
    type_class: "competency"
    blooms_level: "Analyzing"
    description: "Calculate ΔG and determine spontaneity at given temperature"
    indian_context:
      scenarios:
        - "Ice melting in Shimla (ΔH > 0, ΔS > 0, spontaneous above 273 K)"
        - "Water freezing in Ladakh (spontaneous below 273 K)"
        - "Rusting of iron bridges in Mumbai (spontaneous at all T, ΔH < 0, ΔS < 0)"
        - "Decomposition of CaCO₃ in lime kiln (ΔH > 0, ΔS > 0)"
    steps: ["GIBBS_ENERGY", "ENTROPY", "UNIT_CONVERSION"]
    parameters:
      dh_range_kJ: [-200, 200]
      ds_range_J: [-100, 100]
      temp_range_K: [200, 800]
    misconceptions: ["°C vs K confusion", "wrong sign for ΔS", "not converting units"]

  # ─── Topic 6: Equilibrium ───────────────────────────────────────────────────
  - id: kp_kc_relation
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate Kp from Kc and vice versa for gaseous equilibria"
    indian_context:
      reactions:
        - "N₂ + 3H₂ ⇌ 2NH₃ (Δn = -2)"
        - "2SO₂ + O₂ ⇌ 2SO₃ (Δn = -1)"
        - "N₂O₄ ⇌ 2NO₂ (Δn = +1)"
        - "PCl₅ ⇌ PCl₃ + Cl₂ (Δn = +1)"
      scenarios: ["Haber process ammonia synthesis", "contact process sulfuric acid", "NO₂ brown ring experiment"]
    steps: ["KP_KC_RELATION"]
    parameters:
      T_range_C: [25, 500]
    misconceptions: ["wrong Δn calculation", "mixing R values for different pressure units", "forgetting Δn=0 case"]

  - id: ph_calculation_strong
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate pH of strong acid/base solutions"
    indian_context:
      acids: ["HCl (stomach acid)", "H₂SO₄ (battery acid)", "HNO₃"]
      bases: ["NaOH (caustic soda)", "KOH", "Ca(OH)₂ (lime water)"]
      scenarios: ["stomach acidity", "battery acid", "caustic soda solution", "lime water test for CO₂"]
    steps: ["PH_CALC"]
    parameters:
      concentration_M_range: [0.0001, 2.0]
    misconceptions: ["forgetting dilution", "taking log of concentration instead of -log", "pH + pOH ≠ 14"]

  - id: buffer_solution
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "competency"
    blooms_level: "Applying"
    description: "Calculate pH of buffer solutions using Henderson-Hasselbalch equation"
    indian_context:
      buffers:
        - "CH₃COOH/CH₃COONa (vinegar + baking soda buffer)"
        - "NH₃/NH₄Cl (ammonia buffer in fertilizers)"
        - "NaHCO₃/Na₂CO₃ (baking soda buffer)"
      scenarios: ["blood pH regulation (carbonic acid/bicarbonate)", "buffer in swimming pool", "fertilizer soil pH buffering"]
    steps: ["BUFFER_HH"]
    parameters:
      pKa_values: [4.76, 9.25, 10.33]  # acetic, ammonium, bicarbonate
      ratio_range: [0.1, 10]
    misconceptions: ["wrong pKa lookup", "swapping acid/base in log", "using concentration instead of ratio"]

  - id: solubility_product
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate solubility from Ksp and vice versa; determine precipitation"
    indian_context:
      salts: ["AgCl (photographic film)", "PbI₂ (golden rain demo)", "BaSO₄ (barium meal X-ray)", "CaSO₄ (scale in boilers)", "AgBr"]
      scenarios: ["photographic industry in Mumbai", "X-ray contrast agent", "boiler scale in power plant"]
    steps: ["SOLUBILITY_PRODUCT"]
    parameters:
      ksp_range: [1e-12, 1e-6]
    misconceptions: ["wrong stoichiometric coefficients in Ksp expression", "s² vs 4s³ confusion", "unit errors"]

  - id: common_ion_effect
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "competency"
    blooms_level: "Analyzing"
    description: "Calculate solubility in presence of common ion (e.g., AgCl in NaCl)"
    indian_context:
      salts: ["AgCl in seawater (high Cl⁻)", "CaSO₄ in hard water", "Mg(OH)₂ in seawater"]
      scenarios: ["salt water chemistry", "milk of magnesia solubility", "seawater desalination chemistry"]
    steps: ["COMMON_ION", "SOLUBILITY_PRODUCT"]
    parameters:
      common_ion_conc_range: [0.01, 1.0]
    misconceptions: ["not adjusting Ksp expression for common ion", "wrong approximation"]

  - id: hydrolysis_of_salts
    topic: "Chemical Equilibrium"
    topic_id: 6
    type_class: "standard"
    blooms_level: "Applying"
    description: "Calculate pH of salt solutions considering hydrolysis"
    indian_context:
      salts: ["CH₃COONa (soap solution)", "NH₄Cl (fertilizer solution)", "Na₂CO₃ (washing soda)", "NaCl (neutral)"]
      scenarios: ["soap solution pH", "fertilizer solution acidity", "washing soda as cleaning agent"]
    steps: ["HYDROLYSIS", "PH_CALC"]
    parameters:
      salt_conc_range: [0.01, 0.5]
    misconceptions: ["wrong Ka/Kb pairing", "confusing Kh formula", "forgetting pKw = 14"]

  # ─── Topic 7: Redox Reactions ───────────────────────────────────────────────
  - id: oxidation_number
    topic: "Redox Reactions"
    topic_id: 7
    type_class: "standard"
    blooms_level: "Understanding"
    description: "Assign oxidation numbers and identify oxidizing/reducing agents"
    indian_context:
      compounds: ["KMnO₄ (water purification)", "K₂Cr₂O₇ (chrome tanning)", "H₂O₂ (hair bleach)", "Fe₂O₃ (rust)", "CuSO₄ (blue vitriol)"]
      scenarios: ["water treatment in Delhi", "leather tanning in Kanpur", "rust removal in Mumbai"]
    steps: ["OXIDATION_NUMBER"]
    parameters:
      compounds: ["KMnO4", "K2Cr2O7", "H2O2", "Fe2O3", "Na2SO4", "Cr2O3", "MnO2", "NO3-"]
    misconceptions: ["wrong oxidation number for O in peroxides", "ignoring ionic compound rules", "wrong sign for transition metals"]

  - id: redox_balancing_ion_electron
    topic: "Redox Reactions"
    topic_id: 7
    type_class: "competency"
    blooms_level: "Applying"
    description: "Balance redox equations using ion-electron method"
    indian_context:
      reactions:
        - "MnO₄⁻ + Fe²⁺ → Mn²⁺ + Fe³⁺ (permanganate titration of iron)"
        - "Cr₂O₇²⁻ + I⁻ → Cr³⁺ + I₂ (dichromate titration of iodide)"
        - "MnO₄⁻ + SO₃²⁻ → Mn²⁺ + SO₄²⁻"
      scenarios: ["iron ore analysis in Bhilai", "iodine clock reaction", "water quality testing"]
    steps: ["ION_ELECTRON"]
    parameters:
      half_reactions: ["MnO4", "Cr2O7", "NO3", "Cl2", "Fe"]
      mediums: ["acidic", "basic"]
    misconceptions: ["forgetting to balance O with H₂O", "wrong electron count", "not balancing charge"]

  - id: redox_titration
    topic: "Redox Reactions"
    topic_id: 7
    type_class: "competency"
    blooms_level: "Applying"
    description: "Calculate concentration using redox titration data"
    indian_context:
      scenarios:
        - "Determination of iron in river water (KMnO₄ titration, PRL Ahmedabad)"
        - "Determination of H₂O₂ in hair bleach (KMnO₄ titration)"
        - "Determination of Cu in brass (K₂Cr₂O₇ titration)"
        - "Determination of dissolved oxygen in Ganga water (Winkler method)"
    steps: ["REDOX_TITRATION"]
    parameters:
      titrants: ["KMnO4", "K2Cr2O7"]
      analytes: ["Fe2+", "H2O2", "I-", "Sn2+"]
    misconceptions: ["wrong n-factor for titrant/analyte", "M₁V₁ = M₂V₂ without n-factors", "wrong medium indicator"]

  # ─── Topic 8: Hydrogen ──────────────────────────────────────────────────────
  - id: hydrogen_preparation
    topic: "Hydrogen"
    topic_id: 8
    type_class: "standard"
    blooms_level: "Remembering"
    description: "Identify laboratory and industrial methods of hydrogen preparation"
    indian_context:
      methods:
        - "Zn + H₂SO₄ → H₂ (lab preparation)"
        - "2Na + 2H₂O → 2NaOH + H₂ (sodium metal)"
        - "Coal gasification (industrial: C + H₂O → CO + H₂ at Bokaro)"
        - "Electrolysis of water (green hydrogen in Gujarat)"
      scenarios: ["school laboratory preparation", "industrial hydrogen at Bokaro steel plant", "green hydrogen initiative"]
    steps: ["STOICHIOMETRY_CHAIN"]
    parameters:
      metal_pool: ["Zn", "Fe", "Mg", "Al"]
      acid_pool: ["HCl", "H2SO4"]
    misconceptions: ["wrong product gases", "confusing lab and industrial methods"]

  - id: hydride_classification
    topic: "Hydrogen"
    topic_id: 8
    type_class: "standard"
    blooms_level: "Understanding"
    description: "Classify hydrides (ionic, covalent, metallic) and state properties"
    indian_context:
      hydrides:
        - "NaH (sodium hydride, reducing agent)"
        - "NH₃ (ammonia, fertilizer precursor)"
        - "CH₄ (methane, natural gas)"
        - "CaH₂ (calcium hydride, drying agent)"
      scenarios: ["ammonia production at ONGC plant", "natural gas in households", "rocket fuel hydrides"]
    steps: ["HYDRIDE_CLASSIFICATION"]
    parameters:
      pool: ["NaH", "CaH2", "NH3", "CH4", "B2H6", "TiH2"]
    misconceptions: ["confusing ionic and covalent", "wrong classification criteria"]

  - id: water_hardness
    topic: "Hydrogen"
    topic_id: 8
    type_class: "competency"
    blooms_level: "Applying"
    description: "Calculate temporary and permanent hardness of water"
    indian_context:
      scenarios:
        - "Hard water in borewell of Noida (Ca(HCO₃)₂ + CaSO₄)"
        - "Water softening at Delhi Jal Board treatment plant"
        - "Boiler scale formation in thermal power plant at Neyveli"
      methods: ["boiling", "lime-soda", "ion-exchange resin", "reverse osmosis"]
    steps: ["WATER_HARDNESS", "UNIT_CONVERSION"]
    parameters:
      hardness_ppm_range: [50, 500]
    misconceptions: ["confusing temporary and permanent hardness", "wrong softening method for each type"]

  # ─── Topic 9: s-Block Elements ──────────────────────────────────────────────
  - id: alkali_metal_properties
    topic: "s-Block Elements"
    topic_id: 9
    type_class: "standard"
    blooms_level: "Understanding"
    description: "Compare and explain trends in properties of alkali metals"
    indian_context:
      elements: ["Sodium", "Potassium", "Lithium", "Cesium"]
      scenarios:
        - "Sodium-vapor lamps in Mumbai streets (yellow light, Na D-line)"
        - "Potassium in fertilizers applied in Punjab farms"
        - "Lithium-ion batteries in smartphones used in India"
        - "Caesium in atomic clocks"
    steps: ["ALKALI_METAL_PROP"]
