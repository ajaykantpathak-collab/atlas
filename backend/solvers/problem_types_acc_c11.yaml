problem_types_acc_c11:
  - id: ACC-C11-JRN-001
    title: "Journal Entries – Basic Transactions with Rectification"
    steps:
      - step: 1
        instruction: "Record the journal entry for: Started business with cash ₹50,000, furniture ₹10,000, and machinery ₹40,000."
        expected_type: journal_entry
        marks: 2
      - step: 2
        instruction: "Pass the journal entry for: Purchased goods from Mohan ₹30,000 (trade discount 10%, cash discount 5%)."
        expected_type: journal_entry
        marks: 2
      - step: 3
        instruction: "Paid ₹15,000 to Mohan in full settlement of his account."
        expected_type: journal_entry
        marks: 1
      - step: 4
        instruction: "A transaction of ₹8,000 received from a debtor was credited to Sales Account. Pass the rectification entry."
        expected_type: rectification_entry
        marks: 2
      - step: 5
        instruction: "Compute the total debit and credit sides of the journal and verify they balance."
        expected_type: verification
        marks: 1
    total_marks: 8
    difficulty: easy
    thinking_question: "Why does every transaction affect at least two accounts, and how does this dual-aspect concept ensure that the accounting equation always stays in balance?"

  - id: ACC-C11-JRN-002
    title: "Journal Entries – Transactions with Discount and Returns"
    steps:
      - step: 1
        instruction: "Sold goods to Ramesh ₹20,000 at a trade discount of 15% and allowed a cash discount of 5%."
        expected_type: journal_entry
        marks: 2
      - step: 2
        instruction: "Ramesh returned defective goods worth ₹2,000 (list price)."
        expected_type: journal_entry
        marks: 1
      - step: 3
        instruction: "Ramesh paid the balance by cheque."
        expected_type: journal_entry
        marks: 2
      - step: 4
        instruction: "Goods worth ₹1,500 were distributed as free samples for publicity."
        expected_type: journal_entry
        marks: 1
      - step: 5
        instruction: "Calculate the net amount received from Ramesh after all adjustments."
        expected_type: calculation
        marks: 1
    total_marks: 7
    difficulty: medium
    thinking_question: "How does recording sales returns separately rather than merely reducing the Sales Account help in providing more meaningful financial information to stakeholders?"

  - id: ACC-C11-LDG-001
    title: "Ledger Posting – Cash, Purchases, and Sales"
    steps:
      - step: 1
        instruction: "Post the following journal entries to the Cash Account:\n(1) Capital introduced ₹50,000\n(2) Purchased furniture for cash ₹8,000\n(3) Paid rent ₹2,000\n(4) Received from debtor ₹5,000\n(5) Paid to creditor ₹3,000"
        expected_type: ledger_posting
        marks: 3
      - step: 2
        instruction: "Post to Purchases Account: Bought goods from R ₹12,000 and S ₹18,000."
        expected_type: ledger_posting
        marks: 2
      - step: 3
        instruction: "Post to Sales Account: Sold goods to K ₹15,000 and M ₹10,000."
        expected_type: ledger_posting
        marks: 2
      - step: 4
        instruction: "Balance the Cash Account and state whether it is a debit or credit balance."
        expected_type: balancing
        marks: 1
      - step: 5
        instruction: "What is the total of the Purchase Returns Account if returns to R were ₹2,000 and to S were ₹3,000?"
        expected_type: calculation
        marks: 1
    total_marks: 9
    difficulty: easy
    thinking_question: "How does the process of balancing a ledger account reveal the financial position of a specific entity, and why is it important to know the nature of the balance (debit or credit)?"

  - id: ACC-C11-LDG-002
    title: "Ledger Posting with Returns, Discounts, and Bad Debts"
    steps:
      - step: 1
        instruction: "Post to the Debtors Account: Sales to A ₹10,000, B ₹15,000, C ₹8,000. Returns from A ₹2,000, B ₹1,000. Discount allowed to C ₹500."
        expected_type: ledger_posting
        marks: 3
      - step: 2
        instruction: "Post to the Creditors Account: Purchases from X ₹20,000, Y ₹12,000. Returns to X ₹3,000. Discount received from Y ₹800."
        expected_type: ledger_posting
        marks: 3
      - step: 3
        instruction: "Balance both the Debtors and Creditors Accounts."
        expected_type: balancing
        marks: 2
      - step: 4
        instruction: "A bad debt of ₹2,000 from A was written off. Pass the entry and show its effect on the Debtors Account."
        expected_type: bad_debt_entry
        marks: 1
      - step: 5
        instruction: "Calculate the net amount to be received from and paid to debtors and creditors respectively."
        expected_type: calculation
        marks: 1
    total_marks: 10
    difficulty: medium
    thinking_question: "What is the difference between a cash discount and a trade discount, and why are they treated differently in the ledger accounts?"

  - id: ACC-C11-TB-001
    title: "Trial Balance – Preparation and Error Detection"
    steps:
      - step: 1
        instruction: "From the following balances, prepare the Trial Balance:\nCapital ₹80,000 | Drawings ₹5,000 | Furniture ₹15,000 | Stock ₹12,000 | Debtors ₹18,000 | Creditors ₹10,000 | Purchases ₹25,000 | Sales ₹50,000 | Rent ₹3,000 | Salary ₹6,000 | Bills Receivable ₹4,000 | Bills Payable ₹2,000"
        expected_type: trial_balance
        marks: 4
      - step: 2
        instruction: "If the Trial Balance shows a difference of ₹1,200 (debit side excess), list four possible reasons for this difference."
        expected_type: error_identification
        marks: 2
      - step: 3
        instruction: "A purchase of ₹3,000 was posted to the Purchases Account as ₹300. Identify the type of error and state its effect on the Trial Balance."
        expected_type: error_analysis
        marks: 2
      - step: 4
        instruction: "Salary of ₹1,500 paid was debited to the Personal Account of the employee. Classify this error."
        expected_type: error_classification
        marks: 1
      - step: 5
        instruction: "Compute the total of the debit side and credit side after correcting all errors identified."
        expected_type: calculation
        marks: 1
    total_marks: 10
    difficulty: medium
    thinking_question: "Why does a Trial Balance not guarantee that the accounts are entirely free from errors? Discuss the types of errors that do not affect its agreement."

  - id: ACC-C11-DEP-001
    title: "Depreciation – Straight Line and Written Down Value Methods"
    steps:
      - step: 1
        instruction: "A machine was purchased for ₹60,000 with installation costs of ₹4,000. Its scrap value is ₹6,000 and useful life is 5 years. Calculate annual depreciation under the Straight Line Method."
        expected_type: depreciation_calculation
        marks: 2
      - step: 2
        instruction: "Pass the journal entry to record depreciation for the first year under SLM."
        expected_type: journal_entry
        marks: 1
      - step: 3
        instruction: "Calculate depreciation for the second year under the Written Down Value Method at 20% per annum."
        expected_type: depreciation_calculation
        marks: 2
      - step: 4
        instruction: "Compare the total depreciation charged over 5 years under both methods and explain the difference."
        expected_type: comparison
        marks: 2
      - step: 5
        instruction: "State two advantages and one disadvantage of the SLM method."
        expected_type: conceptual_analysis
        marks: 1
    total_marks: 8
    difficulty: medium
    thinking_question: "Why is depreciation considered an application of the matching principle in accounting? Explain with reference to both the Straight Line and Written Down Value methods."

  - id: ACC-C11-DEP-002
    title: "Provisions and Reserves – Distinction and Treatment"
    steps:
      - step: 1
        instruction: "Distinguish between Provision and Reserve on the basis of: (i) Purpose, (ii) Creation, (iii) Availability for distribution of dividend."
        expected_type: comparison
        marks: 3
      - step: 2
        instruction: "A provision for doubtful debts at 5% on debtors of ₹40,000 is required. Calculate the provision amount."
        expected_type: calculation
        marks: 1
      - step: 3
        instruction: "Pass the journal entry to create a General Reserve of ₹10,000 out of profits."
        expected_type: journal_entry
        marks: 2
      - step: 4
        instruction: "Show how the Provision for Doubtful Debts appears in the Balance Sheet (before and after the provision)."
        expected_type: balance_sheet_treatment
        marks: 2
      - step: 5
        instruction: "Give two examples each of Provisions and Reserves."
        expected_type: classification
        marks: 1
    total_marks: 9
    difficulty: medium
    thinking_question: "A reserve created out of capital profits cannot be used for distribution of dividends. Explain the reasoning behind this restriction and its implications for financial reporting."

  - id: ACC-C11-BRS-001
    title: "Bank Reconciliation Statement – Favourable Balance"
    steps:
      - step: 1
        instruction: "Given the following, prepare a Bank Reconciliation Statement as at 31st March 2024:\n(1) Balance as per Pass Book: ₹25,000\n(2) Cheques issued but not presented: ₹4,500\n(3) Cheques deposited but not cleared: ₹3,200\n(4) Bank charges debited in Pass Book: ₹300\n(5) Interest credited by bank: ₹800"
        expected_type: brs
        marks: 5
      - step: 2
        instruction: "If the balance as per Cash Book was ₹28,000, verify the correctness of the BRS."
        expected_type: verification
        marks: 2
      - step: 3
        instruction: "Explain why cheques issued but not presented do not immediately reduce the bank balance in the Pass Book."
        expected_type: conceptual_analysis
        marks: 1
      - step: 4
        instruction: "A payment of ₹1,500 was recorded twice in the Cash Book. Show how this error will be reflected in the BRS."
        expected_type: error_adjustment
        marks: 1
      - step: 5
        instruction: "What will be the balance as per Cash Book if the above error is rectified?"
        expected_type: calculation
        marks: 1
    total_marks: 10
    difficulty: medium
    thinking_question: "Why is the Bank Reconciliation Statement prepared even when books are meticulously maintained? What key information does it provide to a business that internal records alone cannot?"

  - id: ACC-C11-BRS-002
    title: "Bank Reconciliation Statement – Overdraft"
    steps:
      - step: 1
        instruction: "From the following particulars, prepare BRS as at 31st December 2024:\nOverdraft as per Pass Book: ₹20,000\nCheques issued but not presented: ₹8,000\nCheques deposited but not cleared: ₹5,500\nInterest on overdraft debited by bank: ₹1,200\nDirect deposit by customer: ₹3,000"
        expected_type: brs
        marks: 4
      - step: 2
        instruction: "If overdraft as per Cash Book was ₹12,000, reconcile the two balances."
        expected_type: reconciliation
        marks: 2
      - step: 3
        instruction: "A cheque of ₹2,000 was dishonoured but no entry was passed in the Cash Book. Explain its treatment in BRS."
        expected_type: conceptual_analysis
        marks: 1
      - step: 4
        instruction: "Bank collected a bill of ₹4,500 on our behalf but it was not recorded in the Cash Book. Show its effect."
        expected_type: error_adjustment
        marks: 1
      - step: 5
        instruction: "Classify the following as additions or deductions while preparing a BRS: (a) Interest credited by bank, (b) Direct payment by bank, (c) Cheques in hand."
        expected_type: classification
        marks: 1
    total_marks: 9
    difficulty: hard
    thinking_question: "An overdraft as per Pass Book is a credit balance from the bank's perspective. Discuss how the conceptual treatment of additions and deductions reverses when preparing a BRS for an overdraft compared to a favourable balance."

  - id: ACC-C11-BOE-001
    title: "Bills of Exchange – Honour, Dishonour, and Retiring"
    steps:
      - step: 1
        instruction: "A drew a bill for ₹10,000 on B for 3 months. B accepted it. A discounted the bill with his bank at 12% per annum. Calculate discount and net proceeds."
        expected_type: calculation
        marks: 2
      - step: 2
        instruction: "Pass the journal entry in A's books when the bill was drawn and accepted."
        expected_type: journal_entry
        marks: 2
      - step: 3
        instruction: "Pass the journal entry when the bill was discounted with the bank."
        expected_type: journal_entry
        marks: 1
      - step: 4
        instruction: "On maturity, the bill was dishonoured and B became insolvent, paying 40 paise in a rupee. Calculate bad debt recovered and pass the necessary entries."
        expected_type: dishonour_entry
        marks: 2
      - step: 5
        instruction: "Distinguish between 'discounting a bill' and 'honouring a bill'."
        expected_type: comparison
        marks: 1
    total_marks: 8
    difficulty: medium
    thinking_question: "When a bill is dishonoured, why does the drawer still remain liable to the bank even after discounting the bill? Trace the complete chain of liability in this scenario."

  - id: ACC-C11-BOE-002
    title: "Bills of Exchange – Accommodation and Renewal"
    steps:
      - step: 1
        instruction: "A and B drew bills on each other for ₹5,000 each for 3 months. A's bill was discounted at 10% p.a. Calculate discount and net cash received."
        expected_type: calculation
        marks: 2
      - step: 2
        instruction: "Pass journal entries in A's books for drawing the bill on B and for discounting A's own bill."
        expected_type: journal_entry
        marks: 3
      - step: 3
        instruction: "On maturity, B's bill was renewed for 2 months. A cheque for ₹1,000 was received as part payment along with interest at 12% p.a. on the remaining amount. Calculate interest."
        expected_type: calculation
        marks: 2
      - step: 4
        instruction: "Pass the journal entry for the renewal of the bill including interest."
        expected_type: journal_entry
        marks: 1
      - step: 5
        instruction: "Explain the term 'accommodation bill' and state why it is not considered a valid trade transaction."
        expected_type: conceptual_analysis
        marks: 1
    total_marks: 9
    difficulty: hard
    thinking_question: "In an accommodation bill transaction between two parties, both parties are both drawers and drawees. How does this circular arrangement affect the ultimate cash flow, and what risks does each party face?"

  - id: ACC-C11-FA-001
    title: "Final Accounts – Trading Account and Profit & Loss Account"
    steps:
      - step: 1
        instruction: "Prepare the Trading Account from the following:\nOpening Stock ₹15,000 | Purchases ₹80,000 | Purchase Returns ₹5,000 | Wages ₹10,000 | Freight Inward ₹3,000 | Closing Stock ₹12,000 | Sales ₹1,20,000 | Sales Returns ₹8,000"
        expected_type: trading_account
        marks: 3
      - step: 2
        instruction: "From the following, prepare the Profit & Loss Account:\nGross Profit (from Step 1) | Salary ₹12,000 | Rent ₹6,000 | Commission ₹3,000 | Interest ₹2,000 | Bad Debts ₹1,500 | Discount Received ₹800 | Depreciation on Machinery ₹4,000 | Advertising ₹2,500"
        expected_type: profit_loss_account
        marks: 3
      - step: 3
        instruction: "Calculate the Gross Profit Ratio and Net Profit Ratio."
        expected_type: ratio_calculation
        marks: 2
      - step: 4
        instruction: "Explain why Closing Stock appears on the debit side of the Trading Account but as a current asset in the Balance Sheet."
        expected_type: conceptual_analysis
        marks: 1
      - step: 5
        instruction: "If the Gross Profit is overstated by ₹2,000, what will be the effect on the Balance Sheet?"
        expected_type: impact_analysis
        marks: 1
    total_marks: 10
    difficulty: medium
    thinking_question: "Gross Profit is the primary indicator of a trading business's operational efficiency. Why is it not the final measure of profitability, and how does the Profit & Loss Account extend the analysis beyond mere trading activities?"

  - id: ACC-C11-FA-002
    title: "Final Accounts – Balance Sheet with Adjustments"
    steps:
      - step: 1
        instruction: "Prepare the Balance Sheet from the following Trial Balance:\nCapital ₹60,000 | Drawings ₹4,000 | Machinery ₹30,000 | Furniture ₹8,000 | Stock ₹15,000 | Debtors ₹12,000 | Cash ₹3,000 | Creditors ₹10,000 | Bills Payable ₹5,000 | Bank Overdraft ₹7,000"
        expected_type: balance_sheet
        marks: 4
      - step: 2
        instruction: "Adjustment: Outstanding salary ₹2,000. Pass the adjustment entry and show its effect on the Balance Sheet."
        expected_type: adjustment_entry
        marks: 2
      - step: 3
        instruction: "Adjustment: Depreciation on machinery at 10% p.a. and on furniture at 5% p.a. Calculate depreciation and adjust the Balance Sheet."
        expected_type: depreciation_adjustment
        marks: 2
      - step: 4
        instruction: "Calculate the new Capital after considering drawings, net profit of ₹8,000, and fresh capital introduced of ₹5,000."
        expected_type: calculation
        marks: 1
      - step: 5
        instruction: "Verify that the Balance Sheet tallies after all adjustments."
        expected_type: verification
        marks: 1
    total_marks: 10
    difficulty: hard
    thinking_question: "Why do we prepare Final Accounts at the end of an accounting period rather than continuously? Discuss the role of 'adjustments' in ensuring that the Final Accounts present a true and fair view of the enterprise."

  - id: ACC-C11-THE-001
    title: "Theory Base of Accounting – GAAP and Qualitative Characteristics"
    steps:
      - step: 1
        instruction: "State and briefly explain any four Fundamental Accounting Assumptions."
        expected_type: conceptual_analysis
        marks: 2
      - step: 2
        instruction: "Explain the Going Concern Assumption and discuss what happens when it does not hold true."
        expected_type: conceptual_analysis
        marks: 2
      - step: 3
        instruction: "Match the following qualitative characteristics with their descriptions:\n(A) Relevance — (i) Free from error\n(B) Reliability — (ii) Capable of influencing decisions\n(C) Comparability — (iii) Can be compared over periods\n(D) Understandability — (iv) Presented clearly"
        expected_type: matching
        marks: 2
      - step: 4
        instruction: "Why is the Accrual Basis of Accounting considered superior to the Cash Basis? Give two reasons."
        expected_type: conceptual_analysis
        marks: 2
      - step: 5
        instruction: "State how the Prudence (Conservatism) concept affects the valuation of closing stock and provisions."
        expected_type: conceptual_analysis
        marks: 1
    total_marks: 9
    difficulty: medium
    thinking_question: "Accounting concepts form the foundation of all financial reporting. If one were to abandon the Accrual Concept and follow only the Cash Concept, what fundamental distortions would appear in the financial statements of a modern business enterprise?"

  - id: ACC-C11-DEP-003
    title: "Depreciation – Change in Method and Partial Depreciation"
    steps:
      - step: 1
        instruction: "A machine was purchased on 1st April 2022 for ₹50,000. Depreciation is charged at 10% SLM. Calculate depreciation for the years 2022-23 and 2023-24."
        expected_type: depreciation_calculation
        marks: 2
      - step: 2
        instruction: "From 1st April 2024, it was decided to change the method to WDV @ 15%. Calculate depreciation for 2024-25."
        expected_type: depreciation_calculation
        marks: 3
      - step: 3
        instruction: "Explain why the change in method of depreciation is permitted and how it should be disclosed."
        expected_type: conceptual_analysis
        marks: 1
      - step: 4
        instruction: "A machine costing ₹30,000 was sold on 1st October 2023 for ₹18,000. Depreciation is charged at 10% SLM. Pass journal entries for the sale."
        expected_type: journal_entry
        marks: 2
      - step: 5
        instruction: "Calculate the profit or loss on sale of the machine."
        expected_type: calculation
        marks: 1
    total_marks: 9
    difficulty: hard
    thinking_question: "A change in depreciation method is treated as a change in accounting estimate, not a change in accounting policy. Explain the conceptual distinction and why this matters for financial statement users."

  - id: ACC-C11-FA-003
    title: "Final Accounts with All Standard Adjustments"
    steps:
      - step: 1
        instruction: "Prepare the Trading Account for the year ended 31st March 2024:\nOpening Stock ₹20,000 | Purchases ₹1,00,000 | Returns Outward ₹5,000 | Carriage Inward ₹4,000 | Wages ₹15,000 | Closing Stock ₹18,000 | Sales ₹1,80,000 | Returns Inward ₹10,000"
        expected_type: trading_account
        marks: 3
      - step: 2
        instruction: "Prepare the Profit & Loss Account:\nGross Profit (b/d) | Salary ₹24,000 | Office Rent ₹12,000 | Bad Debts ₹2,000 | Provision for Doubtful Debts (create at 5% on Debtors ₹40,000) | Depreciation on Furniture ₹3,000 | Discount Received ₹1,500 | Interest on Loan ₹4,000 | Outstanding Salary ₹3,000 | Prepaid Insurance ₹800"
        expected_type: profit_loss_account
        marks: 4
      - step: 3
        instruction: "Prepare the Balance Sheet incorporating all above adjustments and the following:\nCapital ₹1,00,000 | Drawings ₹8,000 | Machinery ₹60,000 | Furniture ₹12,000 | Debtors ₹40,000 | Stock ₹18,000 | Cash ₹5,000 | Creditors ₹35,000 | Bills Payable ₹10,000 | Outstanding Salary ₹3,000 | Prepaid Insurance ₹800 | 10% Loan ₹20,000"
        expected_type: balance_sheet
        marks: 3
    total_marks: 10
    difficulty: hard
    thinking_question: "In preparing Final Accounts with multiple adjustments, errors in the sequence of adjustments (e.g., calculating depreciation on a gross figure instead of a net figure) can cascade through the statements. Discuss how a systematic approach prevents such cascading errors."

  - id: ACC-C11-INT-001
    title: "Introduction to Accounting – Scope, Objectives, and Users"
    steps:
      - step: 1
        instruction: "List any five objectives of accounting."
        expected_type: conceptual_analysis
        marks: 2
      - step: 2
        instruction: "Distinguish between 'Bookkeeping' and 'Accounting' on any three bases."
        expected_type: comparison
        marks: 2
      - step: 3
        instruction: "Identify four users of accounting information and state one specific information need for each."
        expected_type: classification
        marks: 2
      - step: 4
        instruction: "Explain why accounting is called the 'language of business'."
        expected_type: conceptual_analysis
        marks: 1
      - step: 5
        instruction: "State three limitations of accounting."
        expected_type: conceptual_analysis
        marks: 1
    total_marks: 8
    difficulty: easy
    thinking_question: "If accounting is meant to serve multiple stakeholders with diverse interests, how does it reconcile the potentially conflicting information needs of, say, management and tax authorities?"

  - id: ACC-C11-INT-002
    title: "Accounting Equation – Effect of Transactions"
    steps:
      - step: 1
        instruction: "Given Assets = ₹1,00,000 and Liabilities = ₹40,000. What is the value of Capital?"
        expected_type: calculation
        marks: 1
      - step: 2
        instruction: "Analyse the effect of the following transactions on the Accounting Equation:\n(a) Purchased goods for cash ₹5,000\n(b) Sold goods costing ₹3,000 for ₹4,000 cash\n(c) Paid rent ₹1,000 in cash\n(d) Received ₹2,000 from a debtor"
        expected_type: equation_analysis
        marks: 4
      - step: 3
        instruction: "Show the final position of Assets, Liabilities, and Capital after all the above transactions."
        expected_type: calculation
        marks: 1
      - step: 4
        instruction: "Verify that the Accounting Equation still holds after all transactions."
        expected_type: verification
        marks: 1
      - step: 5
        instruction: "A transaction can increase one asset and decrease another asset while leaving the equation in balance. Give an example of such a transaction."
        expected_type: conceptual_analysis
        marks: 1
    total_marks: 8
    difficulty: easy
    thinking_question: "The Accounting Equation is the bedrock of double-entry bookkeeping. Explain why it is impossible for a single transaction to disrupt the equality between Assets and the sum of Liabilities and Capital."