syllabus_nodes:
  - id: "AM-C12-01"
    title: "Numbers, Quantification, Numerical Applications"
    subtopics:
      - "Prime numbers and divisibility"
      - "Modular arithmetic"
      - "Ratios and proportions"
      - "Percentages and applications"
      - "Averages: AM, GM, HM, weighted mean"
    problem_types: []
    prerequisite: []

  - id: "AM-C12-02"
    title: "Algebra — Matrices and Determinants"
    subtopics:
      - "Order and types of matrices"
      - "Matrix addition, subtraction, scalar multiplication"
      - "Matrix multiplication"
      - "Properties of matrix multiplication"
      - "Transpose of a matrix"
      - "Symmetric and skew-symmetric matrices"
      - "Inverse of a matrix (2×2 and elementary)"
      - "Solving systems of linear equations using matrices"
    problem_types:
      - "matrix_addition"
      - "matrix_multiplication"
      - "matrix_inverse_2x2"
      - "matrix_inverse_elementary"
      - "determinant_2x2"
      - "determinant_3x3"
      - "determinant_properties"
      - "linear_system_solve"
    prerequisite: ["AM-C12-01"]

  - id: "AM-C12-03"
    title: "Calculus — Differentiation"
    subtopics:
      - "Derivative of composite functions (Chain Rule)"
      - "Derivatives of inverse trigonometric functions"
      - "Derivatives of implicit functions"
      - "Derivatives of parametric functions"
      - "Second order derivatives"
      - "Applications: rate of change, increasing/decreasing functions"
      - "Tangents and normals"
      - "Maxima and minima (first and second derivative tests)"
    problem_types:
      - "diff_power_rule"
      - "diff_product_rule"
      - "diff_quotient_rule"
      - "diff_chain_rule"
      - "diff_trig"
      - "diff_log_exp"
      - "implicit_diff"
      - "diff_parametric"
      - "second_derivative"
      - "rate_of_change"
      - "tangent_normal"
      - "maxima_minima"
    prerequisite: ["AM-C12-01"]

  - id: "AM-C12-04"
    title: "Calculus — Integration and Applications"
    subtopics:
      - "Integration as inverse of differentiation"
      - "Integration by substitution"
      - "Integration by parts"
      - "Integration using partial fractions"
      - "Definite integrals"
      - "Properties of definite integrals"
      - "Area under a curve"
    problem_types:
      - "integrand_power"
      - "integrand_trig"
      - "integrand_by_substitution"
      - "integrand_by_parts"
      - "integrand_definite"
      - "integrand_area"
    prerequisite: ["AM-C12-03"]

  - id: "AM-C12-05"
    title: "Probability Distributions"
    subtopics:
      - "Conditional probability"
      - "Multiplication theorem on probability"
      - "Bayes' theorem"
      - "Binomial distribution: mean and variance"
      - "Poisson distribution: mean and variance"
      - "Normal distribution: standard normal variate"
    problem_types:
      - "bayes_basic"
      - "bayes_medical"
      - "binomial_dist"
      - "poisson_dist"
      - "normal_dist"
    prerequisite: ["AM-C12-01"]

  - id: "AM-C12-06"
    title: "Linear Programming Problems"
    subtopics:
      - "Formulation of LPP"
      - "Graphical method for LPP (maximization and minimization)"
      - "Feasible and infeasible regions"
      - "Special cases: multiple solutions, no solution, unbounded"
    problem_types:
      - "lpp_formulation"
      - "lpp_graphical"
      - "lpp_special_cases"
    prerequisite: ["AM-C12-02"]

  - id: "AM-C12-07"
    title: "Financial Mathematics"
    subtopics:
      - "Perpetuity: concept, formula, applications"
      - "Annuities: immediate and due"
      - "Sinking fund"
      - "EMI calculation"
      - "Loan amortization (amortization schedule)"
      - "Depreciation: WDV and SLM methods"
      - "GST computations"
      - "Income Tax basics"
      - "Bill Discounting"
    problem_types:
      - "perpetuity"
      - "annuity_immediate"
      - "annuity_due"
      - "sinking_fund"
      - "emi_calculation"
      - "loan_amortization"
      - "depreciation_wdv"
      - "depreciation_slm"
    prerequisite: ["AM-C12-04"]

  - id: "AM-C12-08"
    title: "Statistics — Measures of Dispersion, Correlation, Regression"
    subtopics:
      - "Range, Quartile Deviation, Mean Deviation, Standard Deviation"
      - "Coefficient of Variation"
      - "Analysis of frequency distributions"
      - "Correlation: Karl Pearson's coefficient"
      - "Spearman's rank correlation"
      - "Regression lines (y on x and x on y)"
      - "Regression coefficients and their properties"
    problem_types:
      - "measures_dispersion"
      - "correlation_pearson"
      - "regression_lines"
    prerequisite: ["AM-C12-01"]

  - id: "AM-C12-09"
    title: "Index Numbers and Time Series"
    subtopics:
      - "Definition and uses of index numbers"
      - "Laspeyres', Paasche's, and Fisher's Ideal index"
      - "Cost of living index"
      - "Time series: components (trend, seasonal, cyclical, irregular)"
      - "Methods of measuring trend"
      - "Method of moving averages"
      - "Method of least squares"
      - "Seasonal indices (additive and multiplicative)"
    problem_types:
      - "index_number_laaspeyres"
      - "index_number_paasche"
      - "index_number_fisher"
      - "time_series_trend"
      - "time_series_moving_avg"
      - "time_series_seasonal"
    prerequisite: ["AM-C12-08"]