# step_types_maths_c12.yaml
# Input form definitions for each ISC Class 12 Mathematics problem type.
# Each entry defines fields that compose the user-facing form for a given step.

relation_type:
  title: "Check Relation Type (Reflexive/Symmetric/Transitive)"
  category: "Relations and Functions"
  fields:
    - name: set_s
      label: "Set S (comma-separated)"
      type: text
      placeholder: "1, 2, 3, 4"
      help_text: "Enter the elements of set S as comma-separated integers."
    - name: relation_r
      label: "Relation R (comma-separated pairs)"
      type: text
      placeholder: "(1,1), (2,2), (3,3), (1,2), (2,1)"
      help_text: "Enter ordered pairs as (a,b) separated by commas."

function_type:
  title: "Check Function Type (One-One/Into/Onto)"
  category: "Relations and Functions"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**2 + 1"
      help_text: "Enter a SymPy-compatible expression in x (e.g. x**2+1, sin(x), 1/x)."
    - name: domain_start
      label: "Domain start"
      type: number
      placeholder: "0"
      help_text: "Start of the domain interval."
    - name: domain_end
      label: "Domain end"
      type: number
      placeholder: "10"
      help_text: "End of the domain interval."

composite_function:
  title: "Composite Function (f∘g and g∘f)"
  category: "Relations and Functions"
  fields:
    - name: f_expr
      label: "f(x)"
      type: text
      placeholder: "x**2 + 1"
    - name: g_expr
      label: "g(x)"
      type: text
      placeholder: "2*x + 3"
    - name: evaluate_at
      label: "Evaluate at x ="
      type: number
      placeholder: "2"

inverse_function:
  title: "Inverse of a Function"
  category: "Relations and Functions"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "2*x + 3"

matrix_operation:
  title: "Matrix Operations"
  category: "Algebra"
  fields:
    - name: matrix_data
      label: "Matrix (rows separated by ;, elements by ,)"
      type: text
      placeholder: "1,2,3;4,5,6;7,8,9"
      help_text: "Enter matrix rows separated by semicolons, elements by commas."
    - name: operation
      label: "Operation"
      type: select
      options: ["transpose", "determinant", "inverse", "rank", "symmetric_skew"]
      placeholder: "Select operation"

cramers_rule:
  title: "Solve Linear System (Cramer's Rule)"
  category: "Algebra"
  fields:
    - name: augmented_matrix
      label: "Augmented Matrix (rows; elements by ,)"
      type: text
      placeholder: "2,3,5;1,-1,1"
      help_text: "For 2×2: a,b,c;d,e,f represents ax+by=c, dx+ey=f."

continuity:
  title: "Check Continuity at a Point"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**2 - 4 / (x - 2)"
    - name: point
      label: "Point a"
      type: number
      placeholder: "2"
    - name: variable
      label: "Variable"
      type: text
      placeholder: "x"
      default: "x"

differentiation:
  title: "Differentiation"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**3 * sin(x)"
    - name: order
      label: "Order"
      type: select
      options: ["1", "2"]
      default: "1"
    - name: variable
      label: "Variable"
      type: text
      default: "x"

rolles_theorem:
  title: "Rolle's Theorem"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**3 - 3*x"
    - name: a
      label: "a (interval start)"
      type: number
      placeholder: "0"
    - name: b
      label: "b (interval end)"
      type: number
      placeholder: "2"

lagrange_mvt:
  title: "Lagrange Mean Value Theorem"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**2"
    - name: a
      label: "a"
      type: number
      placeholder: "0"
    - name: b
      label: "b"
      type: number
      placeholder: "3"

maxima_minima:
  title: "Maxima and Minima"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "x**3 - 3*x**2 + 2"
    - name: interval
      label: "Interval (optional)"
      type: text
      placeholder: "[0, 4]"
      help_text: "Enter interval like [a,b] or leave blank for local extrema only."

indefinite_integral:
  title: "Indefinite Integral"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function to integrate"
      type: text
      placeholder: "x**2 * exp(x)"
    - name: variable
      label: "Variable"
      type: text
      default: "x"

definite_integral:
  title: "Definite Integral"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function to integrate"
      type: text
      placeholder: "x**2"
    - name: lower_limit
      label: "Lower limit (a)"
      type: number
      placeholder: "0"
    - name: upper_limit
      label: "Upper limit (b)"
      type: number
      placeholder: "3"
    - name: variable
      label: "Variable"
      type: text
      default: "x"

area_under_curve:
  title: "Area Under/Between Curves"
  category: "Calculus"
  fields:
    - name: expression
      label: "Function f(x)"
      type: text
      placeholder: "sin(x)"
    - name: a
      label: "From x ="
      type: number
      placeholder: "0"
    - name: b
      label: "To x ="
      type: number
      placeholder: "pi"

de_separable:
  title: "Differential Equation - Variable Separable"
  category: "Calculus"
  fields:
    - name: expression
      label: "DE: dy/dx = ..."
      type: text
      placeholder: "y / (1 + x**2)"
      help_text: "Enter the RHS of dy/dx = f(x,y)."

de_homogeneous:
  title: "Differential Equation - Homogeneous"
  category: "Calculus"
  fields:
    - name: expression
      label: "DE: dy/dx = ..."
      type: text
      placeholder: "(x + y) / x"

de_linear:
  title: "Differential Equation - Linear"
  category: "Calculus"
  fields:
    - name: expression
      label: "dy/dx + P(x)·y = Q(x)"
      type: text
      placeholder: "1 - y/x"
      help_text: "Enter the full equation or the P(x) and Q(x) separately."
    - name: p_coeff
      label: "P(x)"
      type: text
      placeholder: "1/x"
    - name: q_coeff
      label: "Q(x)"
      type: text
      placeholder: "1"

vector_dot:
  title: "Vector Dot Product"
  category: "Vectors and 3D"
  fields:
    - name: v1
      label: "Vector a (comma-separated)"
      type: text
      placeholder: "1, 2, 3"
    - name: v2
      label: "Vector b (comma-separated)"
      type: text
      placeholder: "4, 5, 6"

vector_cross:
  title: "Vector Cross Product"
  category: "Vectors and 3D"
  fields:
    - name: v1
      label: "Vector a (3D)"
      type: text
      placeholder: "1, 2, 3"
    - name: v2
      label: "Vector b (3D)"
      type: text
      placeholder: "4, 5, 6"

vector_scalar_triple:
  title: "Scalar Triple Product"
  category: "Vectors and 3D"
  fields:
    - name: v1
      label: "Vector a"
      type: text
      placeholder: "1, 2, 3"
    - name: v2
      label: "Vector b"
      type: text
      placeholder: "4, 5, 6"
    - name: v3
      label: "Vector c"
      type: text
      placeholder: "7, 8, 9"

direction_cosines:
  title: "Direction Cosines"
  category: "Vectors and 3D"
  fields:
    - name: vector
      label: "Vector (comma-separated)"
      type: text
      placeholder: "3, 4, 0"

line_in_space:
  title: "Line in 3D Space"
  category: "Vectors and 3D"
  fields:
    - name: point
      label: "Point on line (x,y,z)"
      type: text
      placeholder: "1, 2, 3"
    - name: direction
      label: "Direction ratios (l,m,n)"
      type: text
      placeholder: "1, -1, 2"

plane_equation:
  title: "Equation of a Plane"
  category: "Vectors and 3D"
  fields:
    - name: normal
      label: "Normal vector (a,b,c)"
      type: text
      placeholder: "1, 2, -1"
    - name: point
      label: "Point on plane (x,y,z)"
      type: text
      placeholder: "1, 1, 1"

distance_point_plane:
  title: "Distance from Point to Plane"
  category: "Vectors and 3D"
  fields:
    - name: plane_normal
      label: "Plane normal (a,b,c)"
      type: text
      placeholder: "1, 2, -2"
    - name: plane_point
      label: "Point on plane (x,y,z)"
      type: text
      placeholder: "1, 1, 1"
    - name: query_point
      label: "Query point (x,y,z)"
      type: text
      placeholder: "3, 4, 5"

conditional_probability:
  title: "Conditional Probability"
  category: "Probability"
  fields:
    - name: PA
      label: "P(A)"
      type: number
      placeholder: "0.4"
    - name: PB
      label: "P(B)"
      type: number
      placeholder: "0.5"
    - name: PB_given_A
      label: "P(B|A)"
      type: number
      placeholder: "0.6"

bayes_theorem:
  title: "Bayes' Theorem"
  category: "Probability"
  fields:
    - name: prior_probs
      label: "Prior probabilities P(Aᵢ) (comma-separated)"
      type: text
      placeholder: "0.5, 0.3, 0.2"
    - name: likelihoods
      label: "Likelihoods P(B|Aᵢ) (comma-separated)"
      type: text
      placeholder: "0.01, 0.05, 0.1"

binomial_distribution:
  title: "Binomial Distribution"
  category: "Probability"
  fields:
    - name: n
      label: "Number of trials (n)"
      type: number
      placeholder: "10"
    - name: p
      label: "Probability of success (p)"
      type: number
      placeholder: "0.3"
    - name: k
      label: "Find P(X = k)"
      type: number
      placeholder: "3"

linear_programming:
  title: "Linear Programming Problem"
  category: "Linear Programming"
  fields:
    - name: objective
      label: "Objective function (in terms of x, y)"
      type: text
      placeholder: "3*x + 5*y"
      help_text: "Maximize/Minimize Z = ..."
    - name: constraints
      label: "Constraints (one per line, use <= or >=)"
      type: textarea
      placeholder: "x + y <= 6\n2*x + y <= 10\nx >= 0\ny >= 0"
    - name: sense
      label: "Objective sense"
      type: select
      options: ["max", "min"]
      default: "max"