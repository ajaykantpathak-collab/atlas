step_types:
  - title: "Boolean Expression Simplifier"
    category: Boolean Algebra
    fields:
      - name: expression
        label: "Boolean Expression"
        type: text
        placeholder: "e.g., A·B + A·(B+C)"
        help_text: "Enter the Boolean expression using operators +, ·, ' and parentheses."

      - name: variables
        label: "Variables"
        type: text
        placeholder: "e.g., A, B, C"
        help_text: "Comma-separated list of variables used in the expression."

      - name: num_variables
        label: "Number of Variables"
        type: number
        placeholder: "2"
        help_text: "Total number of distinct Boolean variables (n)."

  - title: "Truth Table Generator"
    category: Boolean Algebra
    fields:
      - name: expression
        label: "Boolean Expression / Function"
        type: text
        placeholder: "e.g., (A+B)·(A'+C)"
        help_text: "The Boolean function for which the truth table is to be generated."

      - name: variables
        label: "Variables"
        type: text
        placeholder: "A, B"
        help_text: "Comma-separated list of input variables."

  - title: "Karnaugh Map Solver"
    category: Boolean Algebra
    fields:
      - name: minterms
        label: "Minterms"
        type: text
        placeholder: "e.g., 0, 1, 2, 5, 6, 7"
        help_text: "Comma-separated list of minterm indices (for sum-of-products)."

      - name: maxterms
        label: "Maxterms"
        type: text
        placeholder: "e.g., 3, 4"
        help_text: "Comma-separated list of maxterm indices (for product-of-sums). Leave blank if using minterms."

      - name: num_vars
        label: "Number of Variables"
        type: number
        placeholder: "4"
        help_text: "Number of variables for the K-map (2, 3, or 4)."

      - name: dont_care
        label: "Don't Care Conditions"
        type: text
        placeholder: "e.g., 8, 10"
        help_text: "Optional comma-separated list of don't-care minterm indices."

  - title: "Logic Gate Circuit Designer"
    category: Logic Circuits
    fields:
      - name: gates
        label: "Gate Sequence"
        type: textarea
        placeholder: "NOT(A) → AND(B, C) → OR(X, Y)"
        help_text: "Describe the gate sequence with inputs, e.g., AND(A, B) then OR(C, D)."

      - name: inputs
        label: "Input Values"
        type: text
        placeholder: "A=1, B=0, C=1"
        help_text: "Binary values for each input variable."

      - name: circuit_type
        label: "Circuit Type"
        type: select
        options:
          - "Combinational"
          - "Sequential"
        placeholder: "Select circuit type"
        help_text: "Type of logic circuit."

  - title: "Half Adder / Full Adder"
    category: Logic Circuits
    fields:
      - name: adder_type
        label: "Adder Type"
        type: select
        options:
          - "Half Adder"
          - "Full Adder"
        placeholder: "Select adder type"
        help_text: "Choose between Half Adder (2 inputs) or Full Adder (3 inputs)."

      - name: input_a
        label: "Input A"
        type: number
        placeholder: "0 or 1"
        help_text: "First binary input."

      - name: input_b
        label: "Input B"
        type: number
        placeholder: "0 or 1"
        help_text: "Second binary input."

      - name: input_cin
        label: "Carry In (Cin)"
        type: number
        placeholder: "0 or 1"
        help_text: "Carry-in bit (only for Full Adder)."

  - title: "Flip-Flop Simulator"
    category: Logic Circuits
    fields:
      - name: ff_type
        label: "Flip-Flop Type"
        type: select
        options:
          - "SR"
          - "JK"
          - "D"
          - "T"
        placeholder: "Select flip-flop type"
        help_text: "Type of flip-flop."

      - name: inputs
        label: "Input Sequence"
        type: textarea
        placeholder: "S=1, R=0, then S=0, R=1..."
        help_text: "Describe the input changes over clock cycles."

      - name: clock_cycles
        label: "Number of Clock Cycles"
        type: number
        placeholder: "4"
        help_text: "Number of clock cycles to simulate."

  - title: "Linked List Operations"
    category: Data Structures
    fields:
      - name: operation
        label: "Operation"
        type: select
        options:
          - "Create"
          - "Insert (Beginning)"
          - "Insert (End)"
          - "Insert (Position)"
          - "Delete"
          - "Search"
          - "Reverse"
          - "Display"
        placeholder: "Select operation"
        help_text: "The linked list operation to perform."

      - name: list_type
        label: "List Type"
        type: select
        options:
          - "Singly Linked"
          - "Doubly Linked"
          - "Circular"
        placeholder: "Select list type"
        help_text: "Type of linked list."

      - name: elements
        label: "Initial Elements"
        type: text
        placeholder: "e.g., 10, 20, 30, 40"
        help_text: "Comma-separated initial elements of the list."

      - name: value
        label: "Value to Insert/Delete/Search"
        type: text
        placeholder: "25"
        help_text: "The value involved in the operation."

      - name: position
        label: "Position"
        type: number
        placeholder: "3"
        help_text: "Position (1-based) for insertion or deletion."

  - title: "Stack Operations"
    category: Data Structures
    fields:
      - name: operation
        label: "Operation"
        type: select
        options:
          - "Push"
          - "Pop"
          - "Peek"
          - "Is Empty"
          - "Display"
        placeholder: "Select operation"
        help_text: "The stack operation to perform."

      - name: implementation
        label: "Implementation"
        type: select
        options:
          - "Array"
          - "Linked List"
        placeholder: "Select implementation"
        help_text: "Implementation method for the stack."

      - name: elements
        label: "Initial Elements"
        type: text
        placeholder: "e.g., 10, 20, 30"
        help_text: "Comma-separated initial stack elements (bottom to top)."

      - name: value
        label: "Value"
        type: text
        placeholder: "40"
        help_text: "Value for push/pop/peek operation."

      - name: max_size
        label: "Maximum Size"
        type: number
        placeholder: "10"
        help_text: "Maximum capacity of the array-based stack."

  - title: "Queue Operations"
    category: Data Structures
    fields:
      - name: operation
        label: "Operation"
        type: select
        options:
          - "Enqueue"
          - "Dequeue"
          - "Front"
          - "Is Empty"
          - "Display"
        placeholder: "Select operation"
        help_text: "The queue operation to perform."

      - name: queue_type
        label: "Queue Type"
        type: select
        options:
          - "Simple Queue"
          - "Circular Queue"
          - "Double-Ended Queue (Deque)"
          - "Priority Queue"
        placeholder: "Select queue type"
        help_text: "Type of queue."

      - name: elements
        label: "Initial Elements"
        type: text
        placeholder: "e.g., 10, 20, 30"
        help_text: "Comma-separated initial queue elements (front to rear)."

      - name: value
        label: "Value"
        type: text
        placeholder: "40"
        help_text: "Value for enqueue operation."

      - name: max_size
        label: "Maximum Size"
        type: number
        placeholder: "5"
        help_text: "Maximum capacity (for circular queue)."

  - title: "Binary Tree Operations"
    category: Data Structures
    fields:
      - name: operation
        label: "Operation"
        type: select
        options:
          - "Create Tree"
          - "Inorder Traversal"
          - "Preorder Traversal"
          - "Postorder Traversal"
          - "Level Order Traversal"
          - "Height"
          - "Search"
          - "Insert"
        placeholder: "Select operation"
        help_text: "The tree operation to perform."

      - name: tree_type
        label: "Tree Type"
        type: select
        options:
          - "Binary Tree"
          - "Binary Search Tree"
          - "AVL Tree"
        placeholder: "Select tree type"
        help_text: "Type of binary tree."

      - name: elements
        label: "Elements (Insertion Order)"
        type: text
        placeholder: "e.g., 50, 30, 70, 20, 40"
        help_text: "Comma-separated elements in insertion order."

      - name: value
        label: "Value to Search/Insert"
        type: text
        placeholder: "25"
        help_text: "Value for search or insert operation."

  - title: "Sorting Algorithm Visualizer"
    category: Algorithms
    fields:
      - name: algorithm
        label: "Algorithm"
        type: select
        options:
          - "Bubble Sort"
          - "Selection Sort"
          - "Insertion Sort"
          - "Merge Sort"
          - "Quick Sort"
          - "Heap Sort"
          - "Radix Sort"
        placeholder: "Select sorting algorithm"
        help_text: "The sorting algorithm to apply."

      - name: array_input
        label: "Array Elements"
        type: text
        placeholder: "e.g., 64, 34, 25, 12, 22, 11, 90"
        help_text: "Comma-separated array elements to sort."

      - name: order
        label: "Sort Order"
        type: select
        options:
          - "Ascending"
          - "Descending"
        placeholder: "Select sort order"
        help_text: "Sorting order."

  - title: "Searching Algorithm Solver"
    category: Algorithms
    fields:
      - name: algorithm
        label: "Search Algorithm"
        type: select
        options:
          - "Linear Search"
          - "Binary Search"
          - "Binary Search (Recursive)"
        placeholder: "Select search algorithm"
        help_text: "The searching algorithm to use."

      - name: array_input
        label: "Array Elements (Sorted for Binary)"
        type: text
        placeholder: "e.g., 2, 3, 4, 10, 40"
        help_text: "Comma-separated sorted array elements."

      - name: target
        label: "Target Element"
        type: text
        placeholder: "10"
        help_text: "Element to search for."

  - title: "Time Complexity Analyzer"
    category: Algorithms
    fields:
      - name: code_snippet
        label: "Algorithm / Code Snippet"
        type: textarea
        placeholder: "for i = 1 to n:\n    for j = 1 to n:\n        print(i*j)"
        help_text: "Paste the algorithm or pseudo-code for complexity analysis."

      - name: input_size
        label: "Input Size (n)"
        type: number
        placeholder: "100"
        help_text: "Size of the input for empirical complexity estimation."

      - name: analyze_type
        label: "Analysis Type"
        type: select
        options:
          - "Best Case"
          - "Average Case"
          - "Worst Case"
        placeholder: "Select analysis type"
        help_text: "Type of time complexity analysis."

  - title: "Recursion Solver"
    category: Algorithms
    fields:
      - name: recurrence
        label: "Recurrence Relation"
        type: text
        placeholder: "T(n) = 2T(n/2) + n"
        help_text: "The recurrence relation T(n) = ..."

      - name: base_condition
        label: "Base Condition"
        type: text
        placeholder: "T(1) = 1"
        help_text: "The base case of the recurrence."

      - name: n_value
        label: "Value of n"
        type: number
        placeholder: "8"
        help_text: "The value of n for which T(n) is to be computed."

      - name: method
        label: "Solution Method"
        type: select
        options:
          - "Substitution"
          - "Recursion Tree"
          - "Master Theorem"
        placeholder: "Select method"
        help_text: "Method to solve the recurrence."

  - title: "Class & Object Designer"
    category: OOP Concepts
    fields:
      - name: class_name
        label: "Class Name"
        type: text
        placeholder: "e.g., Student"
        help_text: "Name of the class."

      - name: data_members
        label: "Data Members"
        type: textarea
        placeholder: "int rollNo\nString name\nfloat marks"
        help_text: "Data members with their types, one per line."

      - name: member_functions
        label: "Member Functions"
        type: textarea
        placeholder: "void display()\nvoid setMarks(float m)"
        help_text: "Member functions with return types and parameters."

      - name: access_specifiers
        label: "Access Specifiers Used"
        type: text
        placeholder: "private, public"
        help_text: "Access specifiers used (private, public, protected)."

  - title: "Inheritance Hierarchy"
    category: OOP Concepts
    fields:
      - name: base_class
        label: "Base Class"
        type: text
        placeholder: "e.g., Person"
        help_text: "Name of the base (parent) class."

      - name: derived_class
        label: "Derived Class"
        type: text
        placeholder: "e.g., Student extends Person"
        help_text: "Name of the derived (child) class with inheritance type."

      - name: inheritance_type
        label: "Inheritance Type"
        type: select
        options:
          - "Single"
          - "Multilevel"
          - "Hierarchical"
          - "Multiple (via Interface)"
        placeholder: "Select inheritance type"
        help_text: "Type of inheritance relationship."

      - name: members_inherited
        label: "Members Inherited / Overridden"
        type: textarea
        placeholder: "Inherited: name\nOverridden: display()"
        help_text: "List of inherited and overridden members."

  - title: "Polymorphism Explorer"
    category: OOP Concepts
    fields:
      - name: poly_type
        label: "Polymorphism Type"
        type: select
        options:
          - "Compile-time (Overloading)"
          - "Runtime (Overriding)"
        placeholder: "Select polymorphism type"
        help_text: "Type of polymorphism to demonstrate."

      - name: function_signatures
        label: "Function Signatures"
        type: textarea
        placeholder: "add(int, int)\nadd(int, int, int)\nadd(float, float)"
        help_text: "Overloaded function signatures or overridden method signatures."

      - name: sample_inputs
        label: "Sample Inputs"
        type: text
        placeholder: "e.g., add(5, 3), add(2, 3, 4)"
        help_text: "Sample inputs demonstrating polymorphism."

  - title: "Encapsulation & Abstraction"
    category: OOP Concepts
    fields:
      - name: class_name
        label: "Class Name"
        type: text
        placeholder: "e.g., BankAccount"
        help_text: "Name of the class demonstrating encapsulation."

      - name: private_members
        label: "Private Members"
        type: textarea
        placeholder: "double balance\nString accountNumber"
        help_text: "Private data members (hidden from outside)."

      - name: public_methods
        label: "Public Methods (Interface)"
        type: textarea
        placeholder: "deposit(double)\nwithdraw(double)\ngetBalance()"
        help_text: "Public methods providing controlled access."

      - name: abstract_elements
        label: "Abstract Elements"
        type: textarea
        placeholder: "abstract class Account\nabstract double calculateInterest()"
        help_text: "Abstract classes or methods if using abstraction."

  - title: "ER Diagram Designer"
    category: Database Design
    fields:
      - name: entities
        label: "Entities"
        type: textarea
        placeholder: "Student (RollNo, Name, Class)\nSubject (SubCode, SubName)"
        help_text: "List entities with their attributes, one per line. Use (PK) for primary key."

      - name: relationships
        label: "Relationships"
        type: textarea
        placeholder: "Student — Studies — Subject (1:M)\nStudent — Belongs to — Class (M:1)"
        help_text: "Relationships between entities with cardinality (1:1, 1:M, M:N)."

      - name: cardinality
        label: "Cardinality Notation"
        type: select
        options:
          - "Chen Notation"
          - "Crow's Foot Notation"
        placeholder: "Select notation"
        help_text: "Notation style for ER diagram."

  - title: "Schema Designer"
    category: Database Design
    fields:
      - name: table_name
        label: "Table Name"
        type: text
        placeholder: "e.g., EMPLOYEE"
        help_text: "Name of the table/relation."

      - name: attributes
        label: "Attributes with Types"
        type: textarea
        placeholder: "EmpNo INT (PK)\nEname VARCHAR(30)\nSalary DECIMAL(10,2)\nDeptNo INT (FK)"
        help_text: "Attributes with data types. Mark (PK) for primary key, (FK) for foreign key."

      - name: constraints
        label: "Constraints"
        type: textarea
        placeholder: "EmpNo NOT NULL UNIQUE\nSalary > 0\nDeptNo REFERENCES Department"
        help_text: "Additional constraints on the table."

  - title: "Normalization Analyzer"
    category: Database Design
    fields:
      - name: table_name
        label: "Table Name"
        type: text
        placeholder: "e.g., ORDER"
        help_text: "Name of the table to normalize."

      - name: functional_dependencies
        label: "Functional Dependencies"
        type: textarea
        placeholder: "OrderID → CustomerName, ProductName, Qty\nOrderID, ProductName → Qty"
        help_text: "Functional dependencies in the form A → B."

      - name: current_normal_form
        label: "Current Normal Form"
        type: select
        options:
          - "Unnormalized (UNF)"
          - "1NF"
          - "2NF"
          - "3NF"
          - "BCNF"
        placeholder: "Select current normal form"
        help_text: "The highest normal form the current table satisfies."

      - name: target_normal_form
        label: "Target Normal Form"
        type: select
        options:
          - "1NF"
          - "2NF"
          - "3NF"
          - "BCNF"
        - "4NF"
        placeholder: "Select target normal form"
        help_text: "The desired normal form to reach."

  - title: "SQL Query Composer"
    category: SQL Queries
    fields:
      - name: query_type
        label: "Query Type"
        type: select
        options:
          - "SELECT"
          - "INSERT"
          - "UPDATE"
          - "DELETE"
          - "CREATE TABLE"
          - "ALTER TABLE"
        placeholder: "Select query type"
        help_text: "Type of SQL statement to compose."

      - name: table_name
        label: "Table Name"
        type: text
        placeholder: "e.g., STUDENT"
        help_text: "Name of the table to query."

      - name: columns
        label: "Columns"
        type: text
        placeholder: "RollNo, Name, Marks"
        help_text: "Columns to select, insert, or update (use * for all)."

      - name: conditions
        label: "WHERE Conditions"
        type: textarea
        placeholder: "Marks > 40 AND Class = 'XII'"
        help_text: "Conditions for WHERE clause."

      - name: order_by
        label: "ORDER BY"
        type: text
        placeholder: "Marks DESC"
        help_text: "Columns and order for sorting results."

      - name: group_by
        label: "GROUP BY"
        type: text
        placeholder: "Class"
        help_text: "Column(s) to group by for aggregate queries."

      - name: having
        label: "HAVING"
        type: text
        placeholder: "AVG(Marks) > 60"
        help_text: "Condition on grouped results (used with GROUP BY)."

  - title: "SQL JOIN Visualizer"
    category: SQL Queries
    fields:
      - name: join_type
        label: "Join Type"
        type: select
        options:
          - "INNER JOIN"
          - "LEFT JOIN"
          - "RIGHT JOIN"
          - "FULL JOIN"
          - "CROSS JOIN"
          - "SELF JOIN"
        placeholder: "Select join type"
        help_text: "Type of SQL JOIN."

      - name: table1
        label: "Table 1"
        type: text
        placeholder: "e.g., EMPLOYEE"
        help_text: "First table name."

      - name: table2
        label: "Table 2"
        type: text
        placeholder: "e.g., DEPARTMENT"
        help_text: "Second table name."

      - name: join_condition
        label: "Join Condition"
        type: text
        placeholder: "EMPLOYEE.DeptNo = DEPARTMENT.DeptNo"
        help_text: "ON condition for the join."

      - name: table1_data
        label: "Table 1 Data"
        type: textarea
        placeholder: "EmpNo | Ename | DeptNo\n1 | Alice | 10\n2 | Bob | 20"
        help_text: "Sample data for table 1 in pipe-separated format."

      - name: table2_data
        label: "Table 2 Data"
        type: textarea
        placeholder: "DeptNo | DeptName\n10 | HR\n20 | IT"
        help_text: "Sample data for table 2 in pipe-separated format."

  - title: "Subquery & Nested Query"
    category: SQL Queries
    fields:
      - name: outer_query
        label: "Outer Query"
        type: text
        placeholder: "SELECT Name FROM Student WHERE Marks > ("
        help_text: "The outer SQL query."

      - name: inner_query
        label: "Inner Query (Subquery)"
        type: text
        placeholder: "SELECT AVG(Marks) FROM Student"
        help_text: "The inner (nested) subquery."

      - name: subquery_type
        label: "Subquery Type"
        type: select
        options:
          - "Single Row"
          - "Multiple Row"
          - "Multiple Column"
          - "Correlated"
        placeholder: "Select subquery type"
        help_text: "Type of subquery used."

  - title: "SQL Aggregate Functions"
    category: SQL Queries
    fields:
      - name: aggregate_func
        label: "Aggregate Function"
        type: select
        options:
          - "COUNT"
          - "SUM"
          - "AVG"
          - "MAX"
          - "MIN"
        placeholder: "Select aggregate function"
        help_text: "SQL aggregate function to apply."

      - name: table_name
        label: "Table Name"
        type: text
        placeholder: "e.g., MARKS"
        help_text: "Name of the table."

      - name: column_name
        label: "Column Name"
        type: text
        placeholder: "e.g., Score"
        help_text: "Column on which the aggregate function operates."

      - name: conditions
        label: "Conditions"
        type: text
        placeholder: "Class = 'XII'"
        help_text: "Optional WHERE conditions."

      - name: group_column
        label: "Group By Column"
        type: text
        placeholder: "Subject"
        help_text: "Column to group by (if performing grouped aggregation)."

  - title: "Relational Algebra Translator"
    category: SQL Queries
    fields:
      - name: algebra_expression
        label: "Relational Algebra Expression"
        type: textarea
        placeholder: "π Name, Marks (σ Marks > 40 (Student))"
        help_text: "Relational algebra expression using σ (select), π (project), ⋈ (join), etc."

      - name: description
        label: "Description"
        type: text
        placeholder: "Select Name and Marks of students scoring above 40"
        help_text: "Human-readable description of the query."

      - name: output_format
        label: "Output Format"
        type: select
        options:
          - "Relational Algebra"
          - "Equivalent SQL"
          - "Both"
        placeholder: "Select output format"
        help_text: "Whether to show relational algebra, SQL, or both."