# ── Problem Type Definitions ────────────────────────────────────────
problem_types:
  - problem_type_id: "mcq"
    name: "Multiple Choice Questions"
    description: "Questions with one or more correct options from a list"

  - problem_type_id: "short_answer"
    name: "Short Answer"
    description: "Concise answer in 1-2 sentences"

  - problem_type_id: "long_answer"
    name: "Long Answer"
    description: "Detailed explanation, derivation, or program"

  - problem_type_id: "fill_blank"
    name: "Fill in the Blanks"
    description: "Complete the statement with the correct term/value"

  - problem_type_id: "true_false"
    name: "True / False"
    description: "Statement evaluation with justification"

  - problem_type_id: "match_following"
    name: "Match the Following"
    description: "Pair items from two columns"

  - problem_type_id: "diagram_label"
    name: "Diagram Label"
    description: "Label or draw diagrams (gates, architecture, memory)"

  - problem_type_id: "binary_conversion"
    name: "Binary Conversion"
    description: "Convert decimal to binary or binary to decimal"

  - problem_type_id: "base_conversion"
    name: "Base Conversion"
    description: "Convert between binary, octal, decimal, hexadecimal"

  - problem_type_id: "binary_arithmetic"
    name: "Binary Arithmetic"
    description: "Perform arithmetic operations on binary numbers"

  - problem_type_id: "float_conversion"
    name: "Floating-Point Conversion"
    description: "Convert floating-point numbers between bases"

  - problem_type_id: "truth_table"
    name: "Truth Table"
    description: "Construct or complete truth tables for expressions"

  - problem_type_id: "boolean_logic"
    name: "Boolean Logic Evaluation"
    description: "Evaluate or simplify Boolean expressions"

  - problem_type_id: "boolean_simplification"
    name: "Boolean Simplification"
    description: "Simplify Boolean expressions using laws or Karnaugh maps"

  - problem_type_id: "boolean_expr_java"
    name: "Boolean Expression in Java"
    description: "Write or evaluate Boolean expressions in Java syntax"

  - problem_type_id: "karnaugh_map"
    name: "Karnaugh Map"
    description: "Simplify using Karnaugh maps (K-maps)"

  - problem_type_id: "logic_circuit"
    name: "Logic Circuit Design"
    description: "Design or simplify logic gate circuits"

  - problem_type_id: "array_operations"
    name: "Array Operations"
    description: "Write or trace Java programs using arrays"

  - problem_type_id: "array_searching"
    name: "Array Searching"
    description: "Linear search or binary search programs on arrays"

  - problem_type_id: "array_sorting"
    name: "Array Sorting"
    description: "Write or trace sorting algorithms (bubble, selection, insertion)"

  - problem_type_id: "string_operations"
    name: "String Operations"
    description: "Write or trace Java String programs using methods"