    solver_method: solve_photosynthesis_indian
    misconception_tags: [photorespiration_loss, c3_c4_adaptation]

  - id: C3_C4_PHOTOSYNTHESIS
    display_name: "C3 vs C4 Photosynthesis"
    description: "Compare C3 and C4 pathways and their adaptive significance"
    topics: [c3_c4_photosynthesis, plant_adaptations]
    bloom_levels: [Analyzing, Evaluating]
    competency: standard
    difficulty: hard
    required_params: [plant_type, temperature, water_availability, photorespiration_rate]
    step_sequence: [ST_GIVEN, ST_CRITICAL_ANALYSIS, ST_INFERENCE, ST_PHOTOSYNTHESIS_ANALYSIS]
    solver_method: solve_c3_c4_comparison
    misconception_tags: [kranz_anatomy, pep_carboxylase_vs_rubisco]

  - id: FACTORS_PHOTOSYNTHESIS
    display_name: "Factors Affecting Photosynthesis"
    description: "Analyze effect of light intensity, CO2, and temperature on photosynthesis rate"
    topics: [photosynthesis_factors]
    bloom_levels: [Analyzing]
    competency: standard
    difficulty: medium
    required_params: [factor_name, factor_value, control_value, rate_change]
