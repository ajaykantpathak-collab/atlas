# ISC Class 11 Biology — Problem Type Definitions

problem_types:

  # ── TAXONOMY ──────────────────────────────────────────────────────────────

  - id: TAXONOMY_CLASSIFICATION
    display_name: "Taxonomic Classification"
    description: "Classify organism using dichotomous key through taxonomic hierarchy"
    topics: [taxonomy, five_kingdom, binomial_nomenclature]
    bloom_levels: [Applying, Analyzing]
    competency: standard
    difficulty: medium
    required_params: [organism_name, kingdom, key_traits]
    step_sequence: [ST_GIVEN, ST_CLASSIFY, ST_NUMERICAL_CHECK]
    solver_method: solve_taxonomy_classification
    misconception_tags: [kingdom_vs_phylum, binomial_nomenclature, taxonomic_rank_order]

  - id: TAXONOMY_INDIAN
    display_name: "Taxonomy — Indian Organisms"
    description: "Classify an Indian organism (plant/animal/fungus) into taxonomic groups"
    topics: [taxonomy_india, five_kingdom]
    bloom_levels: [Applying, Creating]
    competency: competency
    difficulty: medium
    required_params: [organism_name, region, key_traits]
    step_sequence: [ST_GIVEN, ST_CLASSIFY, ST_INDIAN_APPLY, ST_INNOVATION]
    solver_method: solve_taxonomy_indian
    misconception_tags: [kingdom_vs_phylum, binomial_nomenclature]

  - id: FUNGI_CLASSIFICATION
    display_name: "Fungi Classification"
    description: "Classify fungi into major groups using morphological features"
    topics: [kingdom_fungi]
    bloom_levels: [Understanding, Applying]
    competency: standard
    difficulty: medium
    required_params: [fungus_type, mycelium, spore_type, fruiting_body]
    step_sequence: [ST_GIVEN, ST_CLASSIFY, ST_CRITICAL_ANALYSIS]
    solver_method: solve_fungi_classification
    misconception_tags: [zygomycetes_vs_ascomycetes, saprophytic_vs_parasitic]

  - id: FUNGI_INDIAN
    display_name: "Fungi of India — Economic Importance"
    description: "Analyze economic importance of fungi in India (mushrooms, antibiotics, diseases)"
    topics: [fungi_india, economic_biology]
    bloom_levels: [Analyzing, Creating]
    competency: competency
    difficulty: medium
    required_params: [fungus_name, economic_use, indian_region, production_data]
    step_sequence: [ST_GIVEN, ST_CRITICAL_ANALYSIS, ST_INDIAN_APPLY, ST_INNOVATION]
    solver_method: solve_fungi_indian
    misconception_tags: [edible_vs_poisonous_mushrooms, antibiotic_production]

  - id: PLANT_KINGDOM_CLASSIFICATION
    display_name: "Plant Kingdom — Major Groups"
    description: "Classify plants into Bryophyta, Pteridophyta, Gymnosperms, Angiosperms"
    topics: [kingdom_plantae]
    bloom_levels: [Understanding, Applying]
    competency: standard
    difficulty: medium
    required_params: [plant_group, vascular_tissue, seed_type, dominant_generation]
    step_sequence: [ST_GIVEN, ST_CLASSIFY, ST_CRITICAL_ANALYSIS]
    solver_method: solve_plant_kingdom
    misconception_tags: [bryophyte_vs_pteridophyte, gymnosperm_vs_angiosperm]

  - id: ANIMALIA_CLASSIFICATION
    display_name: "Animal Kingdom — Phylum Identification"
    description: "Identify phylum of an animal using morphological characteristics"
    topics: [kingdom_animalia]
    bloom_levels: [Understanding, Applying]
    competency: standard
    difficulty: medium
    required_params: [animal_name, phylum_key_features, coelom_type, symmetry]
    step_sequence: [ST_GIVEN, ST_CLASSIFY, ST_CRITICAL_ANALYSIS]
    solver_method: solve_animalia_classification
    misconception_tags: [porifera_vs_coelenterata, chordata_features]

  - id: MONERA_PROTISTA
    display_name: "Monera and Protista Classification"
    description: "Distinguish between Monera and Protista based on key characteristics"
    topics: [kingdom_monera, kingdom_protista]
    bloom_levels: [Understanding]
    competency: standard
    difficulty: easy
