    solver_method: solve_monera_protista
    misconception_tags: [prokaryote_vs_eukaryote, unicellular_vs_multicellular]

  # ── PHOTOSYNTHESIS ────────────────────────────────────────────────────────

  - id: PHOTOSYNTHESIS_RATE
    display_name: "Photosynthesis Rate Calculation"
    description: "Calculate photosynthetic rate under varying light, CO2, temperature"
