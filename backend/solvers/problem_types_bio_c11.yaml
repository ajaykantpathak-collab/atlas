    competency: standard
    difficulty: medium
    required_params: [light_intensity, co2_conc, temperature, plant_type]
    step_sequence: [ST_GIVEN, ST_METABOLIC_EQN, ST_ENERGY_CALC, ST_PHOTOSYNTHESIS_ANALYSIS, ST_NUMERICAL_CHECK]
    solver_method: solve_photosynthesis_rate
    misconception_tags: [light_dependent_vs_independent, atp_nadph_usage]

  - id: PHOTOSYNTHESIS_INDIAN
    display_name: "Photosynthesis and Crop Yield (Indian Context)"
    description: "Analyze how photosynthesis affects crop productivity in Indian farming conditions"
