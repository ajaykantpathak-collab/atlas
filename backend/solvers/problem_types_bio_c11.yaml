    display_name: "Monohybrid Cross (Class 11)"
    description: "Predict offspring from a single-gene cross using Punnett square"
    topics: [monohybrid_cross_c11]
    bloom_levels: [Applying]
    competency: standard
    difficulty: easy
    required_params: [parent1_alleles, parent2_alleles, dominant_allele, trait_name]
    step_sequence: [ST_GIVEN, ST_PUNNETT_SQUARE, ST_RATIO, ST_VERIFY_GENETICS]
    solver_method: solve_monohybrid_cross_c11
    misconception_tags: [homozygous_vs_heterozygous, genotypic_vs_phenotypic]

  - id: HARDY_WEINBERG_C11
