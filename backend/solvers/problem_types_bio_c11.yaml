    bloom_levels: [Applying, Analyzing]
    competency: standard
    difficulty: medium
    required_params: [dominant_phenotype_freq, population_size]
    step_sequence: [ST_GIVEN, ST_HW_SETUP, ST_HW_CALC, ST_NUMERICAL_CHECK]
    solver_method: solve_hardy_weinberg_c11
    misconception_tags: [pq_equals_1, genotype_freq_formula]

