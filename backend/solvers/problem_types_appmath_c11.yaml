# ─── STEP TYPES ───────────────────────────────────────────────────────────────
step_types:
  # Numbers
  - id: "set_relation_identify"
    title: "Identify the Type of Relation"
    description: "Given a set and a relation, list its ordered pairs and determine if it is reflexive, symmetric, transitive, or none."
    template: "For the set A = {set_elements} and relation R = {relation_pairs}, identify the type of relation R."

  - id: "set_operation_complement"
    title: "Find the Complement of a Set"
    description: "Given universal set U and subset A, find A' (complement)."
    template: "Given U = {universal_set} and A = {subset}, find A'."

  - id: "set_operation_intersection"
    title: "Find the Intersection of Two Sets"
    description: "Compute A ∩ B given sets A and B."
    template: "Find A ∩ B where A = {set_a} and B = {set_b}."

  - id: "set_property_proof"
    title: "Verify Set Identities"
    description: "Prove or verify De Morgan's laws or other set identities."
    template: "Prove that (A ∪ B)' = A' ∩ B' using Venn diagram or algebraic method."

  - id: "relation_reflexive_check"
    title: "Check Reflexivity"
    description: "Verify if (a,a) ∈ R for all a ∈ A."
    template: "Check if the relation R is reflexive on set A = {elements}."

  - id: "relation_symmetric_check"
    title: "Check Symmetry"
    description: "Verify if (a,b) ∈ R implies (b,a) ∈ R."
    template: "Check if the relation R is symmetric."

  - id: "relation_transitive_check"
    title: "Check Transitivity"
    description: "Verify if (a,b) ∈ R and (b,c) ∈ R implies (a,c) ∈ R."
    template: "Check if the relation R is transitive."

  - id: "relation_type_classify"
    title: "Classify the Relation"
    description: "Combine checks to classify as equivalence, partial order, or neither."
    template: "Classify the given relation as equivalence, partial order, or neither."

  - id: "function_domain_find"
    title: "Find the Domain of a Function"
    description: "Determine all x-values for which f(x) is defined."
    template: "Find the domain of f(x) = {function_expression}."

  - id: "function_range_find"
    title: "Find the Range of a Function"
    description: "Determine all possible output values of the function."
    template: "Find the range of f(x) = {function_expression}."

  - id: "function_compose"
    title: "Compose Two Functions"
    description: "Find (f∘g)(x) and (g∘f)(x)."
    template: "Given f(x) = {f_expr} and g(x) = {g_expr}, find (f∘g)(x)."

  - id: "function_inverse_find"
    title: "Find the Inverse Function"
    description: "Solve y = f(x) for x to find f⁻¹(x)."
    template: "Find the inverse of f(x) = {function_expression}."

  - id: "ap_term_formula"
    title: "Find nth Term of AP"
    description: "Use Tₙ = a + (n-1)d to find the general term."
    template: "Find the nth term of AP with first term a = {a} and common difference d = {d}."

  - id: "gp_term_formula"
    title: "Find nth Term of GP"
    description: "Use Tₙ = ar^(n-1) to find the general term."
    template: "Find the nth term of GP with first term a = {a} and common ratio r = {r}."

  - id: "ap_to_gp_conversion"
    title: "Convert AP Terms to GP"
    description: "Use arithmetic terms as exponents to form a geometric progression."
    template: "If a, b, c are in AP, then X^a, X^b, X^c are in..."

  - id: "sum_formula_application"
    title: "Apply Sum Formula"
    description: "Use Sₙ = n/2(2a + (n-1)d) for AP or Sₙ = a(rⁿ-1)/(r-1) for GP."
    template: "Find the sum of first n terms of {AP/GP} with parameters..."

  - id: "am_calculate"
    title: "Calculate Arithmetic Mean"
    description: "AM = (a + b)/2 for two numbers."
    template: "Calculate AM of {a} and {b}."

  - id: "gm_calculate"
    title: "Calculate Geometric Mean"
    description: "GM = √(ab) for two numbers."
    template: "Calculate GM of {a} and {b}."

  - id: "hm_calculate"
    title: "Calculate Harmonic Mean"
    description: "HM = 2ab/(a + b) for two numbers."
    template: "Calculate HM of {a} and {b}."

  - id: "inequality_verify"
    title: "Verify AM ≥ GM ≥ HM"
    description: "Show that for positive numbers, arithmetic mean is at least geometric mean."
    template: "Verify that AM ≥ GM ≥ HM for the given numbers."

  - id: "binomial_expansion_general"
    title: "General Term of Binomial Expansion"
    description: "Identify T_{r+1} = C(n,r) a^{n-r} b^r."
    template: "Write the general term in the expansion of (a + b)^n."

  - id: "general_term_identify"
    title: "Identify a Specific Term"
    description: "Substitute appropriate r value in the general term formula."
    template: "Find the term containing x^k in the expansion of..."

  - id: "coefficient_comparison"
    title: "Compare Coefficients"
    description: "Equate coefficients of like powers on both sides."
    template: "Compare the coefficient of x^r in the expansion..."

  - id: "independent_term_find"
    title: "Find the Independent Term"
    description: "Set exponent of x to zero and solve for r."
    template: "Find the term independent of x in the expansion of..."

  # Algebra
  - id: "matrix_multiply_define"
    title: "Define Matrix Multiplication"
    description: "Compute C = AB where C_ij = Σ A_ik · B_kj."
    template: "Multiply matrices A = {matrix_a} and B = {matrix_b}."

  - id: "matrix_order_verify"
    title: "Verify Matrix Order for Multiplication"
    description: "Check if number of columns of A equals number of rows of B."
    template: "Verify if matrix multiplication A × B is possible."

  - id: "transpose_product_property"
    title: "Apply Transpose Property"
    description: "Use (AB)^T = B^T · A^T."
    template: "Prove that (AB)^T = B^T A^T."

  - id: "result_simplify"
    title: "Simplify the Result"
    description: "Perform arithmetic to get the final matrix."
    template: "Simplify the resulting matrix."

  - id: "determinant_order_identify"
    title: "Identify Determinant Order"
    description: "Determine if matrix is 2×2, 3×3, or n×n."
    template: "Find the order of the determinant of matrix A."

  - id: "cofactor_minor_find"
    title: "Find Cofactor of an Element"
    description: "Compute minor M_ij, then C_ij = (-1)^(i+j) M_ij."
    template: "Find the cofactor of element a_ij in the determinant."

  - id: "cofactor_expansion_compute"
    title: "Cofactor Expansion Along Row/Column"
    description: "Expand |A| = Σ a_ij · C_ij along chosen row or column."
    template: "Evaluate the determinant by expanding along row {row_number}."

  - id: "determinant_property_verify"
    description: "Apply properties: |kA| = kⁿ|A|, |A^T| = |A|, etc."
    template: "Verify the determinant property for the given matrix."
    title: "Verify Determinant Properties"

  - id: "determinant_check_nonzero"
    title: "Check Determinant is Non-Zero"
    description: "Compute |A| and confirm it is ≠ 0 for invertibility."
    template: "Check if the matrix is non-singular by computing its determinant."

  - id: "cofactor_matrix_find"
    title: "Build Cofactor Matrix"
    description: "Compute all cofactors C_ij to form the cofactor matrix."
    template: "Construct the cofactor matrix of A."

  - id: "adjoint_form"
    title: "Form the Adjoint Matrix"
    description: "Transpose the cofactor matrix to get adj(A)."
    template: "Find adj(A) from the cofactor matrix."

  - id: "inverse_verify_aa_inv"
    title: "Verify A · A⁻¹ = I"
    description: "Multiply A and its inverse to confirm identity matrix."
    template: "Verify that A · A⁻¹ = I."

  - id: "augmented_matrix_form"
    title: "Form the Augmented Matrix"
    description: "Write [A|B] from the system Ax = B."
    template: "Form the augmented matrix for the system of equations."

  - id: "determinant_check_solution"
    title: "Check for Unique Solution"
    description: "If |A| ≠ 0, unique solution exists via x = A⁻¹B."
    template: "Determine if the system has a unique solution."

  - id: "inverse_method_solve"
    title: "Solve Using Inverse Method"
    description: "Compute x = A⁻¹B."
    template: "Solve the system using x = A⁻¹B."

  - id: "solution_verify_substitution"
    title: "Verify Solution by Substitution"
    description: "Substitute values back into original equations."
    template: "Verify the solution by substituting into the equations."

  - id: "discriminant_compute"
    title: "Compute the Discriminant"
    description: "D = b² - 4ac for ax² + bx + c = 0."
    template: "Find the discriminant of ax² + bx + c = 0."

  - id: "nature_of_roots"
    title: "Determine Nature of Roots"
    description: "D > 0: real and distinct; D = 0: real and equal; D < 0: complex."
    template: "Determine the nature of roots based on discriminant value."

  - id: "sum_and_product_roots"
    title: "Find Sum and Product of Roots"
    description: "Sum = -b/a, Product = c/a (Vieta's formulas)."
    template: "Find sum and product of roots of ax² + bx + c = 0."

  - id: "locus_from_quadratic"
    title: "Find Locus from Quadratic Conditions"
    description: "Eliminate parameters to find locus equation."
    template: "Find the locus satisfying the given quadratic condition."

  - id: "complex_form_identify"
    title: "Identify Complex Number Form"
    description: "Write z in a + bi form."
    template: "Write the complex number z = {expression} in a + bi form."

  - id: "modulus_compute"
    title: "Compute Modulus |z|"
    description: "|z| = √(a² + b²) for z = a + bi."
    template: "Find the modulus of z = {complex_number}."

  - id: "argument_compute"
    title: "Compute Argument arg(z)"
    description: "arg(z) = tan⁻¹(b/a) with appropriate quadrant."
    template: "Find the principal argument of z = {complex_number}."

  - id: "polar_to_cartesian"
    title: "Convert Polar to Cartesian"
    description: "z = r(cos θ + i sin θ) to a + bi."
    template: "Convert z = {polar_form} to rectangular form."

  - id: "polar_form_convert"
    title: "Convert to Polar Form"
    description: "Find r = |z| and θ = arg(z)."
    template: "Convert z = {complex_number} to polar form."

  - id: "de_moivre_apply"
    title: "Apply De Moivre's Theorem"
    description: "(cos θ + i sin θ)^n = cos(nθ) + i sin(nθ)."
    template: "Compute (cos θ + i sin θ)^n using De Moivre's theorem."

  - id: "cube_roots_compute"
    title: "Compute nth Roots of Unity"
    description: "Find all nth roots: ω^k for k = 0, 1, ..., n-1."
    template: "Find all cube roots of unity."

  - id: "sum_of_roots_verify"
    title: "Verify Sum of Roots Property"
    description: "Show that sum of nth roots of unity = 0."
    template: "Verify that the sum of nth roots of unity is 0."

  - id: "inequality_graph_single"
    title: "Graph a Single Linear Inequality"
