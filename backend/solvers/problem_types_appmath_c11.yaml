    description: "Collect terms with dy/dx on one side and solve."
    template: "Isolate dy/dx from the differentiated equation."

  - id: "parametric_chain_rule"
    title: "Apply Parametric Chain Rule"
    description: "dy/dx = (dy/dt) / (dx/dt)."
    template: "Compute dy/dx using parametric differentiation."

  - id: "first_derivative_find"
    title: "Find the First Derivative"
    description: "Compute f'(x)."
    template: "Find the first derivative f'(x)."

  - id: "critical_points_identify"
    title: "Identify Critical Points"
    description: "Set f'(x) = 0 and solve for x."
    template: "Find critical points by solving f'(x) = 0."

  - id: "second_derivative_find"
    title: "Find the Second Derivative"
    description: "Compute f''(x)."
    template: "Find f''(x)."

  - id: "concavity_and_inflection"
    title: "Determine Concavity and Inflection Points"
    description: "f''(x) > 0: concave up; f''(x) < 0: concave down; f''(x) = 0 with sign change: inflection."
    template: "Find intervals of concavity and point of inflection."

  - id: "second_derivative_test"
    title: "Apply Second Derivative Test"
    description: "f''(critical) > 0 → min; f''(critical) < 0 → max."
    template: "Apply the second derivative test at x = {critical_point}."

  - id: "nature_classify"
    title: "Classify the Nature of Critical Points"
    description: "Determine if each critical point is max, min, or point of inflection."
    template: "Classify each critical point as local max, min, or inflection."

  - id: "marginal_cost_derivative"
    title: "Find Marginal Cost"
    description: "MC = dC/dx, the derivative of total cost function."
    template: "Find the marginal cost from C(x) = {function}."

  - id: "marginal_revenue_derivative"
    title: "Find Marginal Revenue"
    description: "MR = dR/dx, the derivative of revenue function."
    template: "Find the marginal revenue from R(x) = {function}."

  - id: "marginal_analysis_interpret"
    title: "Interpret Marginal Analysis"
    description: "Explain what the marginal value represents economically."
    template: "Interpret the marginal value at x = {point}."

  - id: "demand_function_identify"
    title: "Identify Demand Function"
    description: "Express p (price) as a function of x (quantity)."
    template: "Identify the demand function p = f(x)."

  - id: "elasticity_formula_setup"
    title: "Set Up Elasticity Formula"
    description: "E_d = (p/x) · (dx/dp) = -(p/x) · (dp/dx)."
    template: "Set up the elasticity of demand formula."

  - id: "elasticity_evaluate_point"
    title: "Evaluate Elasticity at a Point"
    description: "Substitute values of p and x into the formula."
    template: "Evaluate elasticity at x = {quantity}."

  - id: "elastic_vs_inelastic_classify"
    title: "Classify as Elastic or Inelastic"
    description: "|E_d| > 1: elastic; |E_d| < 1: inelastic; |E_d| = 1: unit elastic."
    template: "Classify the demand as elastic, inelastic, or unit elastic."

  - id: "integrand_identify_pattern"
    title: "Identify Substitution Pattern"
    description: "Look for function and its derivative in the integrand."
    template: "Identify the inner function for u-substitution."

  - id: "substitution_choice"
    title: "Choose Substitution Variable"
    description: "Let u = inner function and compute du."
    template: "Choose u = {inner_function} and find du."

  - id: "change_limits_or_constant"
    title: "Change Limits or Add Constant"
    description: "For definite: change limits; for indefinite: add +C."
    template: "Apply the appropriate limits or add the constant of integration."

  - id: "integral_evaluate"
    title: "Evaluate the Integral"
    description: "Compute the antiderivative."
    template: "Evaluate the integral."

  - id: "u_and_dv_choose"
    title: "Choose u and dv"
    description: "Use LIATE rule: Logarithmic > Inverse trig > Algebraic > Trigonometric > Exponential."
    template: "Choose u (to differentiate) and dv (to integrate)."

  - id: "du_and_v_compute"
    title: "Compute du and v"
    description: "Differentiate u and integrate dv."
    template: "Find du and v."

  - id: "parts_formula_apply"
    title: "Apply Integration by Parts Formula"
    description: "∫u dv = uv - ∫v du."
    template: "Apply ∫u dv = uv - ∫v du."

  - id: "antiderivative_find"
    title: "Find the Antiderivative"
    description: "Compute F(x) such that F'(x) = f(x)."
    template: "Find the antiderivative of f(x) = {function}."

  - id: "limits_apply_fundamental"
    title: "Apply Fundamental Theorem of Calculus"
    description: "∫ₐᵇ f(x) dx = F(b) - F(a)."
    template: "Evaluate F(b) - F(a)."

  - id: "intersection_points_find"
    title: "Find Intersection Points of Curves"
    description: "Solve f(x) = g(x) to find x-coordinates of intersections."
    template: "Find where the curves y = {f(x)} and y = {g(x)} intersect."

  - id: "upper_lower_function"
    title: "Identify Upper and Lower Functions"
    description: "Determine which curve is above the other in the interval."
    template: "Determine which function is upper and which is lower."

  - id: "definite_integral_setup"
    title: "Set Up Area Integral"
    description: "Area = ∫ₐᵇ (upper - lower) dx."
    template: "Set up the integral for area between curves."

  - id: "area_evaluate"
    title: "Evaluate the Area"
    description: "Compute the definite integral value."
    template: "Evaluate the area integral."

  # Statistics
  - id: "data_organization"
    title: "Organize the Data"
    description: "Arrange data in ascending/descending order or frequency table."
    template: "Organize the given data into a frequency distribution."

  - id: "mean_direct_or_shortcut"
    title: "Calculate Mean (Direct or Shortcut Method)"
    description: "Use direct formula or assumed-mean method."
    template: "Calculate the mean of the given data."

  - id: "median_position"
    title: "Find Median Using Position Formula"
    description: "Median = L + [(N/2 - cf) / f] · h."
    template: "Find the median using the position formula for grouped data."

  - id: "mode_estimation"
    title: "Estimate Mode"
    description: "Mode = L + [f₁ - f₀] / [(f₁ - f₀) + (f₁ - f₂)] · h."
    template: "Estimate the mode of the grouped data."

  - id: "quartile_position_formula"
    title: "Apply Quartile Position Formula"
    description: "Q₁ at N/4th position, Q₃ at 3N/4th position."
    template: "Find the quartile position and compute Q₁ or Q₃."

  - id: "interpolation_if_needed"
    title: "Apply Interpolation"
    description: "Interpolate within a class when the quartile falls inside it."
    template: "Interpolate to find the exact quartile value."

  - id: "quartile_deviation_compute"
    title: "Compute Quartile Deviation"
    description: "QD = (Q₃ - Q₁) / 2."
    template: "Calculate the quartile deviation."

  - id: "mean_deviation_calc"
    title: "Calculate Mean Deviation"
    description: "MD = Σ|x - μ| / N."
    template: "Calculate the mean deviation from the mean."

  - id: "standard_deviation_calc"
    title: "Calculate Standard Deviation"
    description: "σ = √[Σ(x - μ)² / N]."
    template: "Calculate the standard deviation."

  - id: "group_statistics_identify"
    title: "Identify Group Statistics"
    description: "Note n₁, x̄₁, σ₁ for group 1 and n₂, x̄₂, σ₂ for group 2."
    template: "Identify the parameters of both groups."

  - id: "combined_mean_formula"
    title: "Apply Combined Mean Formula"
    description: "x̄ = (n₁x̄₁ + n₂x̄₂) / (n₁ + n₂)."
    template: "Calculate the combined mean of two groups."

  - id: "combined_variance"
    title: "Apply Combined Variance Formula"
    description: "Use pooled variance formula for combined SD."
    template: "Calculate the combined variance."

  - id: "combined_std_deviation"
    title: "Compute Combined Standard Deviation"
    description: "Take square root of combined variance."
    template: "Find the combined standard deviation."

  - id: "cv_formula_compute"
    title: "Compute Coefficient of Variation"
    description: "CV = (σ / μ) × 100%."
    template: "Calculate CV = (σ / μ) × 100%."

  - id: "comparison_interpret"
    title: "Interpret the Comparison"
    description: "Higher CV means more variability relative to mean."
    template: "Compare the variability of the given datasets."

  - id: "mean_median_mode_find"
    title: "Find Mean, Median, and Mode"
    description: "Compute all three measures of central tendency."
    template: "Find μ, M, and Mo for the given data."

  - id: "pearson_skewness"
    title: "Compute Pearson's Coefficient of Skewness"
    description: "Sk_p = 3(μ - Mo) / σ or Sk_p = (μ - M) / σ."
    template: "Calculate Pearson's coefficient of skewness."

  - id: "bowley_skewness"
    title: "Compute Bowley's Coefficient"
    description: "Sk_b = (Q₃ + Q₁ - 2Q₂) / (Q₃ - Q₁)."
    template: "Calculate Bowley's coefficient of skewness."

  - id: "skewness_type_interpret"
    title: "Interpret Skewness"
    description: "Positive: right tail; Negative: left tail; Zero: symmetric."
    template: "Interpret the sign of the skewness coefficient."

  - id: "raw_moments_formula"
    title: "Compute Raw Moments"
    description: "μ'_r = Σ xᵣ / N."
    template: "Compute raw moments μ'_1, μ'_2, μ'_3, μ'_4."

  - id: "central_moments_compute"
    title: "Compute Central Moments"
    description: "μ_r = Σ(x - μ)ʳ / N."
    template: "Compute central moments μ_2, μ_3, μ_4."

  - id: "beta1_and_beta2"
    title: "Compute β₁ and β₂"
    description: "β₁ = μ₃² / μ₂³, β₂ = μ₄ / μ₂²."
    template: "Calculate β₁ and β₂ from central moments."

  - id: "kurtosis_interpret"
    title: "Interpret Kurtosis"
    description: "β₂ = 3: mesokurtic; β₂ > 3: leptokurtic; β₂ < 3: platykurtic."
    template: "Classify the distribution based on kurtosis."

  - id: "scatter_diagram_sketch"
    title: "Sketch Scatter Diagram"
    description: "Plot (x, y) pairs on a graph to visualize relationship."
    template: "Draw the scatter diagram for the bivariate data."

  - id: "covariance_compute"
    title: "Compute Covariance"
    description: "Cov(X,Y) = [Σ(x - x̄)(y - ȳ)] / N."
    template: "Calculate Cov(X,Y)."

  - id: "correlation_relation"
    title: "Relate Covariance and Correlation"
    description: "r = Cov(X,Y) / (σ_X · σ_Y)."
    template: "Find the correlation coefficient from covariance."

  - id: "positive_or_negative"
    title: "Determine Sign of Correlation"
    description: "Positive Cov → positive correlation; Negative Cov → negative."
    template: "Determine if the correlation is positive or negative."

  - id: "standard_deviation_each"
    title: "Find σ_X and σ_Y"
    description: "Compute standard deviation for each variable."
    template: "Calculate σ_X and σ_Y separately."

  - id: "pearson_r_calculate"
    title: "Calculate Pearson's r"
    description: "r = Cov(X,Y) / (σ_X · σ_Y)."
    template: "Compute Pearson's correlation coefficient r."

  - id: "ranks_assign"
    title: "Assign Ranks to Data"
    description: "Rank the data values in ascending or descending order."
    template: "Assign ranks to the given paired data."

  - id: "rank_differences_find"
    title: "Find Rank Differences"
    description: "Compute d = R_X - R_Y and d² for each pair."
    template: "Calculate rank differences d and d²."

  - id: "spearman_formula_apply"
    title: "Apply Spearman's Rank Formula"
    description: "ρ = 1 - [6Σd² / (n(n² - 1))] (with tie correction)."
    template: "Apply Spearman's rank correlation formula."

  - id: "tied_ranks_correction"
    title: "Apply Tie Correction"
    description: "Use correction factor for tied ranks: Σ(t³ - t) / 12."
    template: "Apply the tie correction formula."

  - id: "regression_y_on_x"
    title: "Find Regression Line y on x"
    description: "y - ȳ = r(σ_Y/σ_X)(x - x̄)."
    template: "Find the regression line of y on x."

  - id: "regression_x_on_y"
    title: "Find Regression Line x on y"
    description: "x - x̄ = r(σ_X/σ_Y)(y - ȳ)."
    template: "Find the regression line of x on y."

  - id: "intersection_point"
    title: "Find Intersection of Regression Lines"
    description: "Both regression lines pass through (x̄, ȳ)."
    template: "Find the point of intersection of the two regression lines."

  - id: "angle_between_regression"
    title: "Find Angle Between Regression Lines"
    description: "tan θ = ±√[(1-r²)/r²] · (σ_Y/σ_X + σ_X/σ_Y)."
    template: "Find the angle between the two regression lines."

  - id: "base_and_current_identify"
    title: "Identify Base and Current Period"
    description: "Note base year prices (p₀) and quantities (q₀) vs current (p₁, q₁)."
    template: "Identify base period and current period data."

  - id: "laspeyres_index"
    title: "Compute Laspeyres Price Index"
    description: "L = Σ(p₁q₀) / Σ(p₀q₀) × 100."
    template: "Calculate Laspeyres price index."

  - id: "paasche_index"
    title: "Compute Paasche Price Index"
    description: "P = Σ(p₁q₁) / Σ(p₀q₁) × 100."
    template: "Calculate Paasche price index."

  - id: "fishers_ideal_index"
    title: "Compute Fisher's Ideal Index"
    description: "F = √(L · P) = geometric mean of L and P."
    template: "Calculate Fisher's Ideal Index."

  # Probability
  - id: "sample_space_list"
    title: "List the Sample Space"
    description: "Enumerate all possible outcomes of the experiment."
    template: "List all outcomes in the sample space S."

  - id: "favourable_outcomes_count"
    title: "Count Favourable Outcomes"
    description: "Identify outcomes satisfying the event condition."
    template: "Count the number of favourable outcomes for event A."

  - id: "probability_formula"
    title: "Apply Classical Probability Formula"
    description: "P(A) = n(A) / n(S)."
    template: "Calculate P(A) using the classical probability formula."

  - id: "result_interpret"
    title: "Interpret the Probability Result"
    description: "Express the result as fraction, decimal, or percentage."
    template: "Express P(A) as a decimal and percentage."

  - id: "mutually_exclusive_check"
    title: "Check Mutual Exclusivity"
    description: "Verify A ∩ B = ∅."
    template: "Verify if events A and B are mutually exclusive."

  - id: "exhaustive_check"
    title: "Check Exhaustiveness"
    description: "Verify A ∪ B = S (sample space)."
    template: "Verify if events are collectively exhaustive."

  - id: "probability_add_rule"
    title: "Apply Addition Rule"
    description: "P(A ∪ B) = P(A) + P(B) - P(A ∩ B). For mutually exclusive: P(A ∪ B) = P(A) + P(B)."
    template: "Apply the addition rule to find P(A ∪ B)."

  - id: "independence_definition_verify"
    title: "Verify Independence Definition"
    description: "A and B independent iff P(A ∩ B) = P(A)·P(B)."
    template: "Verify if events A and B are independent."

  - id: "multiplication_rule_apply"
    title: "Apply Multiplication Rule"
    description: "P(A ∩ B) = P(A)·P(B|A) for dependent, P(A)·P(B) for independent."
    template: "Find P(A ∩ B) using the multiplication rule."

  - id: "conditional_probability_check"
    title: "Check Conditional Probability"
    description: "P(A|B) = P(A ∩ B) / P(B)."
    template: "Find the conditional probability P(A|B)."

  - id: "compound_probability"
    title: "Compute Compound Probability"
    description: "Find probability of compound events involving 'and' or 'or'."
    template: "Find the compound probability."

  - id: "conditional_probability_formula"
    title: "Set Up Conditional Probability Formula"
    description: "P(A|B) = P(A ∩ B) / P(B)."
    template: "Set up the conditional probability formula."

  - id: "prior_probabilities"
    title: "Identify Prior Probabilities"
    description: "Note P(E₁), P(E₂), ... P(Eₙ) as prior probabilities."
    template: "Identify the prior probabilities of the partition events."

  - id: "likelihoods_identify"
    title: "Identify Likelihoods"
    description: "Note P(A|E₁), P(A|E₂), ... as conditional probabilities."
    template: "Identify the likelihoods P(A|E_i)."

  - id: "bayes_formula_setup"
    title: "Set Up Bayes' Formula"
    description: "P(E_i|A) = P(E_i)·P(A|E_i) / Σ P(E_j)·P(A|E_j)."
    template: "Apply Bayes' theorem to find the posterior probability."

  - id: "posterior_probability"
    title: "Compute Posterior Probability"
    description: "Substitute values into Bayes' formula and compute."
    template: "Calculate the posterior probability P(E_i|A)."

  - id: "random_variable_identify"
    title: "Identify the Random Variable"
    description: "Determine if RV is discrete or continuous and its possible values."
    template: "Identify the type of the random variable X and its range."

  - id: "pmf_list_probabilities"
    title: "List Probabilities from PMF"
    description: "Tabulate P(X = x) for each value of X."
    template: "List all probabilities from the given PMF."

  - id: "cdf_build_from_pmf"
    title: "Build Cumulative Distribution Function"
    description: "F(x) = P(X ≤ x) = Σ P(X = t) for t ≤ x."
    template: "Construct the CDF F(x) from the PMF."

  - id: "expectation_compute"
    title: "Compute Expected Value"
    description: "E(X) = Σ x · P(X = x)."
    template: "Calculate E(X) and E(X²)."

  - id: "binomial_parameters_identify"
    title: "Identify Binomial Parameters"
    description: "Note n (trials) and p (success probability)."
    template: "Identify n and p for the binomial distribution."

  - id: "pmf_write"
    title: "Write Binomial PMF"
    description: "P(X = r) = C(n,r) pʳ (1-p)^(n-r)."
    template: "Write the PMF for the binomial distribution."

  - id: "mean_variance_formula"
    title: "Apply Mean and Variance Formula"
    description: "Mean = np, Variance = npq."
    template: "Calculate mean and variance of the binomial distribution."

  - id: "probability_compute"
    title: "Compute Specific Probability"
    description: "Evaluate P(X = r) using the PMF."
    template: "Find P(X = {value})."

  - id: "poisson_parameter_lambda"
    title: "Identify Poisson Parameter λ"
    description: "λ = mean = np for approximation from binomial."
    template: "Identify λ for the Poisson distribution."

  - id: "pmf_apply"
    title: "Apply Poisson PMF"
    description: "P(X = r) = e^(-λ) λ^r / r!."
    template: "Apply the Poisson probability mass function."

  - id: "mean_variance_equal"
    title: "Verify Mean = Variance for Poisson"
    description: "Both equal λ."
    template: "Verify that mean = variance = λ."

  - id: "probability_sum_compute"
    title: "Compute Sum of Probabilities"
    description: "Find P(X ≤ k) or P(X ≥ k) using cumulative sum."
    template: "Calculate P(X ≤ {k}) or P(X ≥ {k})."

  - id: "z_score_transform"
    title: "Transform to Z-Score"
    description: "Z = (X - μ) / σ for standardization."
    template: "Convert X = {value} to z-score: Z = (X - μ) / σ."

  - id: "standard_normal_table"
    title: "Use Standard Normal Table"
    description: "Look up probabilities from Z-table."
    template: "Find P(Z < {z_value}) from the standard normal table."

  - id: "probability_area_find"
    title: "Find Probability as Area"
    description: "Shade the area under the normal curve."
    template: "Find the probability corresponding to the shaded area."

  - id: "reverse_z_to_original"
    title: "Convert Z Back to Original Scale"
    description: "X = μ + zσ."
    template: "Find the value X corresponding to a given z-score."

  - id: "normal_parameters_identify"
    title: "Identify Normal Parameters"
    description: "Note μ (mean) and σ (standard deviation)."
    template: "Identify μ and σ for the given normal distribution."

  - id: "z_scores_compute"
    title: "Compute Z-Scores for Values"
    description: "Transform values to standard normal using Z = (X - μ)/σ."
    template: "Compute z-scores for X = {values}."

  - id: "probability_in_range"
    title: "Find Probability in a Range"
    description: "Find P(a ≤ X ≤ b) using z-scores."
    template: "Find P({lower} ≤ X ≤ {upper})."

  - id: "tolerance_limits"
    title: "Find Tolerance Limits"
    description: "Determine acceptable range for quality control."
    template: "Find the tolerance limits for the given specifications."