    template: "Classify the discontinuity at x = {a}."

  - id: "difference_quotient_write"
    title: "Write the Difference Quotient"
    description: "Set up [f(x+h) - f(x)] / h."
    template: "Write the difference quotient for f(x) = {function}."

  - id: "limit_definition_setup"
    title: "Set Up the Limit Definition"
    description: "Express f'(x) = lim(h→0) [f(x+h) - f(x)] / h."
    template: "Set up the limit definition of the derivative."

  - id: "algebraic_simplification"
    title: "Algebraic Simplification"
    description: "Expand f(x+h) and simplify the numerator."
    template: "Simplify the expression by expanding and combining terms."

  - id: "derivative_obtain"
    title: "Obtain the Derivative"
    description: "Evaluate the limit to get the derivative formula."
    template: "Evaluate the limit to obtain f'(x)."

  - id: "function_composite_identify"
