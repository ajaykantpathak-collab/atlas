    description: "Determine if limit is indeterminate (0/0, ∞/∞, etc.) or direct."
    template: "Identify the form of lim(x→{a}) {expression}."

  - id: "substitution_attempt"
    title: "Direct Substitution Attempt"
    description: "Try plugging in the limit value directly."
    template: "Attempt direct substitution at x = {limit_point}."

  - id: "algebraic_rationalization"
    title: "Rationalize the Expression"
    description: "Multiply by conjugate for radical expressions."
    template: "Rationalize the expression to remove the indeterminate form."

  - id: "trig_limit_formula_apply"
