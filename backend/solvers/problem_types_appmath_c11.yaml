  - id: "corner_points_find"
    title: "Find Corner Points of Feasible Region"
    description: "Solve pairs of boundary equations at intersection."
    template: "Find all corner points of the feasible region."

  - id: "objective_function_optimize"
    title: "Optimize Objective Function"
    description: "Evaluate Z at each corner point to find max/min."
    template: "Maximize/Minimize Z = {objective_function} subject to constraints."

  - id: "problem_formulation"
    title: "Formulate LPP"
    description: "Identify decision variables, objective function, and constraints."
    template: "Formulate the LPP for the given word problem."

  - id: "constraints_convert_inequalities"
    title: "Convert Constraints to Inequalities"
    description: "Translate word problem conditions into mathematical inequalities."
    template: "Convert the given conditions into inequality constraints."

  - id: "feasible_region_draw"
    title: "Draw Feasible Region"
    description: "Plot all constraints on the same coordinate plane."
    template: "Draw the feasible region for the formulated LPP."

  - id: "optimal_solution_determine"
    title: "Determine Optimal Solution"
    description: "Evaluate objective function at corner points."
    template: "Determine the optimal solution from the feasible region."

  - id: "boolean_expression_identify"
    title: "Identify Boolean Expression"
    description: "Parse and simplify the given Boolean expression."
    template: "Simplify the Boolean expression: {expression}."

  - id: "karnaugh_map_draw"
    title: "Draw Karnaugh Map"
    description: "Create K-map for 2, 3, or 4 variables."
    template: "Draw the Karnaugh map for {n} variables."

  - id: "prime_implicants_find"
    title: "Find Prime Implicants"
