problem_types_cs_c12:
  - id: bool_circuit_chain
    title: Boolean Expression to Logic Circuit Conversion
    steps:
      - boolean_simplify
      - boolean_truth_table
      - logic_gate_convert
      - circuit_design
    marks: 10
    difficulty: medium
    thinking_question:
      text: "In a full adder circuit, the carry output is generated by which Boolean expression?"
      options:
        - "A AND B"
        - "A XOR B"
        - "(A AND B) OR ((A XOR B) AND Cin)"
        - "A OR B OR Cin"
      correct_answer: 2

  - id: bool_verify_circuit
    title: Boolean Verification and Circuit Equivalence
    steps:
      - boolean_evaluate
      - boolean_truth_table
      - circuit_verify
    marks: 8
    difficulty: medium
    thinking_question:
      text: "Two Boolean expressions are equivalent if and only if:"
      options:
        - "They use the same number of variables"
        - "Their truth tables are identical for all input combinations"
        - "They have the same number of minterms"
        - "Both use only AND and NOT gates"
      correct_answer: 1

  - id: bool_kmap_simplify
    title: Boolean Expression Simplification via K-Map
    steps:
      - boolean_truth_table
      - boolean_simplify
      - boolean_verify
    marks: 10
    difficulty: hard
    thinking_question:
      text: "The minimum number of prime implicants required to cover a K-map is determined by:"
      options:
        - "The number of don't-care conditions"
        - "Petrick's method"
        - "Quine-McCluskey tabulation"
        - "Count of all 1s in the truth table"
      correct_answer: 1

  - id: stack_queue_infix
    title: Stack and Queue-Based Expression Evaluation
    steps:
      - stack_operation
      - queue_operation
      - code_analysis
    marks: 10
    difficulty: medium
    thinking_question:
      text: "When converting an infix expression to postfix using a stack, an operator is popped from the stack when:"
      options:
        - "Its precedence is higher than the incoming operator"
        - "Its precedence is lower than the incoming operator (unless '(' is on top)"
        - "The stack becomes empty"
        - "A closing parenthesis is encountered only"
      correct_answer: 1

  - id: ds_array_search_sort
    title: Array Operations: Searching and Sorting
    steps:
      - array_operation
      - algorithm_trace
      - sorting_visualize
    marks: 8
    difficulty: easy
    thinking_question:
      text: "Binary search on a sorted array is preferred over linear search because it has:"
      options:
        - "O(n) time complexity"
        - "O(n²) time complexity"
        - "O(log n) time complexity"
        - "O(1) time complexity"
      correct_answer: 2

  - id: ds_ll_stack
    title: Linked List Operations Using Stack Principles
    steps:
      - linked_list_operation
      - stack_operation
      - code_analysis
    marks: 10
    difficulty: medium
    thinking_question:
      text: "Reversing a singly linked list using a stack requires:"
      options:
        - "O(1) time and O(1) auxiliary space"
        - "O(n) time and O(1) auxiliary space (in-place reversal)"
        - "O(n) time and O(n) auxiliary space"
        - "O(n²) time and O(1) auxiliary space"
      correct_answer: 2

  - id: alg_merge_sort_trace
    title: Merge Sort: Tracing and Complexity Analysis
    steps:
      - algorithm_trace
      - sorting_visualize
      - complexity_calc
    marks: 10
    difficulty: medium
    thinking_question:
      text: "In the worst case, how many comparisons does merge sort perform to sort n elements?"
      options:
        - "n(n-1)/2"
        - "n log₂ n - n + 1"
        - "n²"
        - "log₂ n"
      correct_answer: 1

  - id: alg_search_tree_trace
    title: Binary Search Tree: Insertion, Traversal, and Search
    steps:
      - tree_operation
      - algorithm_trace
      - complexity_calc
    marks: 10
    difficulty: hard
    thinking_question:
      text: "The worst-case height of a BST with n nodes occurs when the tree is:"
      options:
        - "Perfectly balanced"
        - "Complete"
        - "Skewed (like a linked list)"
        - "Full"
      correct_answer: 2

  - id: oop_inheritance_chain
    title: OOP Inheritance Hierarchy and Method Resolution
    steps:
      - class_design
      - inherit_calc
      - constructor_trace
    marks: 10
    difficulty: medium
    thinking_question:
      text: "In Java, if a child class overrides a parent method, which version is called at runtime?"
      options:
        - "The parent's version"
        - "The child's version (dynamic polymorphism)"
        - "Depends on the reference type at compile time"
        - "A compile-time error occurs"
      correct_answer: 1

  - id: oop_class_visibility
    title: Visibility Specifiers and Class Interaction
    steps:
      - class_design
      - inherit_calc
      - code_analysis
    marks: 8
    difficulty: easy
    thinking_question:
      text: "Which access modifier in Java allows members to be accessible only within the same package?"
      options:
        - "private"
        - "protected"
        - "public"
        - "default (package-private)"
      correct_answer: 3

  - id: oop_abs_interface
    title: Abstract Classes vs Interfaces: Design and Usage
    steps:
      - class_design
      - inherit_calc
      - code_analysis
    marks: 10
    difficulty: hard
    thinking_question:
      text: "Which of the following is TRUE about abstract classes compared to interfaces in Java?"
      options:
        - "An abstract class can have only abstract methods"
        - "An interface can have non-abstract (default/static) methods"
        - "A class can extend multiple abstract classes"
        - "Abstract classes cannot have constructors"
      correct_answer: 1

  - id: db_normalize_chain
    title: Database Normalization: From ER to 3NF
    steps:
      - er_diagram
      - normalization
      - dbms_concept
    marks: 10
    difficulty: hard
    thinking_question:
      text: "A relation is in 2NF if it is in 1NF and:"
      options:
        - "It has no repeating groups"
        - "Every non-prime attribute is fully functionally dependent on the primary key (no partial dependency)"
        - "It has no transitive dependencies"
        - "All attributes are atomic"
      correct_answer: 1

  - id: db_er_to_table
    title: ER Diagram to Relational Schema Mapping
    steps:
      - er_diagram
      - dbms_concept
      - normalization
    marks: 10
    difficulty: medium
    thinking_question:
      text: "When mapping an ER diagram with a many-to-many relationship to a relational schema, the relationship is represented as:"
      options:
        - "A foreign key in one of the entity tables"
        - "A separate relation (table) with foreign keys from both entities as composite keys"
        - "A column in the primary entity table"
        - "Merged into one of the entity tables"
      correct_answer: 1

  - id: sql_select_join
    title: SQL Queries: SELECT with JOINs and Aggregation
    steps:
      - sql_write
      - sql_join
      - sql_output
    marks: 10
    difficulty: medium
    thinking_question:
      text: "What is the primary difference between INNER JOIN and LEFT JOIN in SQL?"
      options:
        - "INNER JOIN returns all rows from both tables; LEFT JOIN returns only matching rows"
        - "INNER JOIN returns only matching rows; LEFT JOIN returns all rows from the left table plus matches from the right"
        - "INNER JOIN supports aggregation; LEFT JOIN does not"
        - "There is no difference — they are synonymous"
      correct_answer: 1

  - id: sql_group_aggregate
    title: SQL Aggregation: GROUP BY, HAVING, and Subqueries
    steps:
      - sql_write
      - sql_join
      - sql_output
    marks: 10
    difficulty: hard
    thinking_question:
      text: "The HAVING clause in SQL is used to:"
      options:
        - "Filter individual rows before grouping"
        - "Filter groups after GROUP BY has been applied"
        - "Replace the WHERE clause entirely"
        - "Sort the result set"
      correct_answer: 1

  - id: sql_ddl_dml_integrated
    title: Integrated SQL: DDL, DML, and Integrity Constraints
    steps:
      - sql_write
      - sql_output
      - dbms_concept
    marks: 10
    difficulty: medium
    thinking_question:
      text: "In SQL, the UNIQUE constraint differs from the PRIMARY KEY constraint in that:"
      options:
        - "UNIQUE allows NULL values (depending on DBMS), while PRIMARY KEY does not"
        - "PRIMARY KEY allows multiple NULLs"
        - "UNIQUE does not create an index"
        - "PRIMARY KEY can be composite but UNIQUE cannot"
      correct_answer: 0