step_types:
  consumer_equilibrium_law_of_demand:
    title: Consumer Equilibrium — Law of Demand
    category: microeconomics
    fields:
      - name: income
        label: Consumer Income
        type: number
        placeholder: 1000
        help_text: Income available to the consumer in currency units
      - name: price_x
        label: Price of Good X
        type: number
        placeholder: 10
        help_text: Market price per unit of Good X
      - name: quantity_x
        label: Quantity Demanded of X
        type: number
        placeholder: 50
        help_text: Quantity of Good X demanded at given price
      - name: price_y
        label: Price of Good Y
        type: number
        placeholder: 20
        help_text: Market price per unit of Good Y
      - name: quantity_y
        label: Quantity Demanded of Y
        type: number
        placeholder: 25
        help_text: Quantity of Good Y demanded at given price
      - name: price_change_pct
        label: Percentage Change in Price
        type: number
        placeholder: 10
        help_text: Percentage increase or decrease in the price of Good X

  utility_maximization:
    title: Utility Maximization — Law of Equi-Marginal Utility
    category: microeconomics
    fields:
      - name: price_a
        label: Price of Commodity A
        type: number
        placeholder: 5
        help_text: Price per unit of Commodity A
      - name: mu_a
        label: Marginal Utility of A
        type: number
        placeholder: 20
        help_text: Marginal utility derived from last unit consumed of A
      - name: price_b
        label: Price of Commodity B
        type: number
        placeholder: 4
        help_text: Price per unit of Commodity B
      - name: mu_b
        label: Marginal Utility of B
        type: number
        placeholder: 16
        help_text: Marginal utility derived from last unit consumed of B
      - name: income
        label: Consumer Income
        type: number
        placeholder: 100
        help_text: Total income available for spending

  price_elasticity_demand:
    title: Price Elasticity of Demand (PED)
    category: microeconomics
    fields:
      - name: original_quantity
        label: Original Quantity Demanded (Q1)
        type: number
        placeholder: 200
        help_text: Initial quantity demanded of the commodity
      - name: new_quantity
        label: New Quantity Demanded (Q2)
        type: number
        placeholder: 220
        help_text: Quantity demanded after price change
      - name: original_price
        label: Original Price (P1)
        type: number
        placeholder: 10
        help_text: Initial market price of the commodity
      - name: new_price
        label: New Price (P2)
        type: number
        placeholder: 11
        help_text: New market price after change
      - name: method
        label: Calculation Method
        type: select
        options:
          - proportion
          - percentage
          - arc
        placeholder: proportion
        help_text: Method for calculating elasticity: proportion (point), percentage (arc), or arc (midpoint)

  income_elasticity_demand:
    title: Income Elasticity of Demand (YED)
    category: microeconomics
    fields:
      - name: original_quantity
        label: Original Quantity Demanded (Q1)
        type: number
        placeholder: 500
        help_text: Initial quantity demanded
      - name: new_quantity
        label: New Quantity Demanded (Q2)
        type: number
        placeholder: 550
        help_text: Quantity demanded after income change
      - name: original_income
        label: Original Income (Y1)
        type: number
        placeholder: 10000
        help_text: Initial consumer income
      - name: new_income
        label: New Income (Y2)
        type: number
        placeholder: 10500
        help_text: New consumer income after change
      - name: good_type
        label: Type of Good
        type: select
        options:
          - normal
          - inferior
          - luxury
          - necessity
        placeholder: normal
        help_text: Classify the good based on elasticity result

  cross_elasticity_demand:
    title: Cross Elasticity of Demand (XED)
    category: microeconomics
    fields:
      - name: original_quantity_a
        label: Original Quantity of A (Qa1)
        type: number
        placeholder: 100
        help_text: Initial quantity demanded of Good A
      - name: new_quantity_a
        label: New Quantity of A (Qa2)
        type: number
        placeholder: 120
        help_text: Quantity demanded of Good A after price change of B
      - name: original_price_b
        label: Original Price of B (Pb1)
        type: number
        placeholder: 20
        help_text: Initial price of Good B
      - name: new_price_b
        label: New Price of B (Pb2)
        type: number
        placeholder: 22
        help_text: New price of Good B
      - name: relation
        label: Relationship between Goods
        type: select
        options:
          - substitutes
          - complements
          - unrelated
        placeholder: substitutes
        help_text: Identify whether goods A and B are substitutes, complements, or unrelated

  elasticity_of_supply:
    title: Elasticity of Supply
    category: microeconomics
    fields:
      - name: original_quantity
        label: Original Quantity Supplied (Qs1)
        type: number
        placeholder: 500
        help_text: Initial quantity supplied
      - name: new_quantity
        label: New Quantity Supplied (Qs2)
        type: number
        placeholder: 600
        help_text: Quantity supplied after price change
      - name: original_price
        label: Original Price (P1)
        type: number
        placeholder: 50
        help_text: Initial price of the commodity
      - name: new_price
        label: New Price (P2)
        type: number
        placeholder: 55
        help_text: New price of the commodity

  returns_to_scale:
    title: Returns to Scale — Production Function
    category: microeconomics
    fields:
      - name: output_original
        label: Original Output
        type: number
        placeholder: 1000
        help_text: Initial level of output
      - name: output_new
        label: New Output
        type: number
        placeholder: 2500
        help_text: Output after all inputs are increased proportionally
      - name: input_scale
        label: Input Scale Factor
        type: number
        placeholder: 2
        help_text: Factor by which all inputs were increased
      - name: production_type
        label: Production Function Form
        type: select
        options:
          - cobb_douglas
          - linear
          - leontief
        placeholder: cobb_douglas
        help_text: Functional form of the production function

  law_of_variable_proportions:
    title: Law of Variable Proportions — TP, AP, MP
    category: microeconomics
    fields:
      - name: total_product
        label: Total Product (TP)
        type: number
        placeholder: 200
        help_text: Total output produced by given labour units
      - name: variable_input
        label: Units of Variable Input
        type: number
        placeholder: 10
        help_text: Number of labour units employed
      - name: marginal_product
        label: Marginal Product (MP)
        type: number
        placeholder: 25
        help_text: Additional output from one more unit of input
      - name: stage
        label: Stage of Production
        type: select
        options:
          - stage_one
          - stage_two
          - stage_three
        placeholder: stage_two
        help_text: Stage of production based on MP and AP relationship

  cost_function_solver:
    title: Cost Functions — TFC, TVC, TC, AFC, AVC, AC, MC
    category: microeconomics
    fields:
      - name: tfc
        label: Total Fixed Cost (TFC)
        type: number
        placeholder: 500
        help_text: Cost that does not vary with output level
      - name: tvc
        label: Total Variable Cost (TVC)
        type: number
        placeholder: 300
        help_text: Cost that varies with output level
      - name: quantity
        label: Output Quantity
        type: number
        placeholder: 50
        help_text: Number of units produced
      - name: mc
        label: Marginal Cost (MC)
        type: number
        placeholder: 12
        help_text: Additional cost of producing one more unit
      - name: cost_type
        label: Cost Type to Calculate
        type: select
        options:
          - tc
          - ac
          - afc
          - avc
          - mc
        placeholder: ac
        help_text: Select which cost concept to compute

  market_equilibrium:
    title: Market Equilibrium — Price Determination
    category: microeconomics
    fields:
      - name: demand_schedule
        label: Demand Schedule (Qd)
        type: text
        placeholder: 100,80,60,40,20
        help_text: Comma-separated quantities demanded at different prices
      - name: supply_schedule
        label: Supply Schedule (Qs)
        type: text
        placeholder: 20,40,60,80,100
        help_text: Comma-separated quantities supplied at different prices
      - name: price_schedule
        label: Price Schedule
        type: text
        placeholder: 10,20,30,40,50
        help_text: Comma-separated prices corresponding to the schedules
      - name: equilibrium_type
        label: Type of Analysis
        type: select
        options:
          - equilibrium_price
          - simultaneous_shift
          - price_floor
          - price_ceiling
        placeholder: equilibrium_price
        help_text: Type of market analysis to perform

  national_income_expenditure:
    title: National Income — Expenditure Method
    category: macroeconomics
    fields:
      - name: consumption
        label: Private Final Consumption Expenditure
        type: number
        placeholder: 500000
        help_text: Total spending by households on goods and services
      - name: govt_expenditure
        label: Government Final Consumption Expenditure
        type: number
        placeholder: 100000
        help_text: Government spending on goods and services
      - name: gross_capital_formation
        label: Gross Capital Formation
        type: number
        placeholder: 150000
        help_text: Investment in fixed assets plus inventory changes
      - name: net_exports
        label: Net Exports
        type: number
        placeholder: -20000
        help_text: Exports minus imports (X - M)
      - name: factor_income_from_abroad
        label: Net Factor Income from Abroad
        type: number
        placeholder: 5000
        help_text: Income earned by residents abroad minus foreign income earned domestically
      - name: depreciation
        label: Depreciation
        type: number
        placeholder: 25000
        help_text: Wear and tear of capital assets during the period

  national_income_income_method:
    title: National Income — Income Method
    category: macroeconomics
    fields:
      - name: compensation_employees
        label: Compensation to Employees
        type: number
        placeholder: 400000
        help_text: Wages, salaries, and employee benefits
      - name: operating_surplus
        label: Operating Surplus
        type: number
        placeholder: 200000
        help_text: Rent, interest, profit, and mixed income
      - name: mixed_income
        label: Mixed Income of Self-Employed
        type: number
        placeholder: 80000
        help_text: Income of self-employed combining labour and capital
      - name: depreciation
        label: Consumption of Fixed Capital
        type: number
        placeholder: 25000
        help_text: Depreciation allowance
      - name: nfia
        label: Net Factor Income from Abroad
        type: number
        placeholder: 5000
        help_text: Net earnings from abroad

  national_income_value_added:
    title: National Income — Value Added Method
    category: macroeconomics
    fields:
      - name: primary_sector
        label: Primary Sector Value Added
        type: number
        placeholder: 80000
        help_text: Value added in agriculture, mining, forestry
      - name: secondary_sector
        label: Secondary Sector Value Added
        type: number
        placeholder: 250000
        help_text: Value added in manufacturing and construction
      - name: tertiary_sector
        label: Tertiary Sector Value Added
        type: number
        placeholder: 300000
        help_text: Value added in services sector
      - name: indirect_taxes
        label: Indirect Taxes Minus Subsidies
        type: number
        placeholder: 30000
        help_text: Net indirect taxes (indirect taxes - subsidies)
      - name: depreciation
        label: Consumption of Fixed Capital
        type: number
        placeholder: 25000
        help_text: Depreciation of capital assets

  money_multiplier:
    title: Money Multiplier and Credit Creation
    category: macroeconomics
    fields:
      - name: lrr
        label: Legal Reserve Ratio (LRR)
        type: number
        placeholder: 0.20
        help_text: Percentage of deposits that banks must hold as reserves (as decimal)
      - name: initial_deposit
        label: Initial Deposit
        type: number
        placeholder: 10000
        help_text: Primary deposit received by the banking system
      - name: cash_reserve_ratio
        label: Cash Reserve Ratio (CRR)
        type: number
        placeholder: 0.05
        help_text: Portion of deposits banks hold with RBI (as decimal)
      - name: statutory_liquidity_ratio
        label: Statutory Liquidity Ratio (SLR)
        type: number
        placeholder: 0.185
        help_text: Percentage of deposits to be kept in liquid assets (as decimal)

  investment_multiplier:
    title: Investment Multiplier
    category: macroeconomics
    fields:
      - name: mpc
        label: Marginal Propensity to Consume (MPC)
        type: number
        placeholder: 0.75
        help_text: Proportion of additional income spent on consumption (as decimal)
      - name: autonomous_investment
        label: Autonomous Investment
        type: number
        placeholder: 200
        help_text: Investment independent of income level
      - name: initial_income
        label: Initial Income Level
        type: number
        placeholder: 1000
        help_text: Starting level of national income
      - name: multiplier_type
        label: Multiplier Type
        type: select
        options:
          - investment
          - government
          - tax
        placeholder: investment
        help_text: Type of multiplier to calculate

  aggregate_demand_supply:
    title: Aggregate Demand and Supply
    category: macroeconomics
    fields:
      - name: consumption_autonomous
        label: Autonomous Consumption (C̄)
        type: number
        placeholder: 100
        help_text: Consumption when income is zero
      - name: mpc
        label: Marginal Propensity to Consume
        type: number
        placeholder: 0.80
        help_text: Slope of the consumption function (as decimal)
      - name: autonomous_investment
        label: Autonomous Investment (Ī)
        type: number
        placeholder: 150
        help_text: Investment independent of income level
      - name: government_spending
        label: Government Spending (G)
        type: number
        placeholder: 200
        help_text: Government expenditure on goods and services
      name: tax_rate
        label: Tax Rate (t)
        type: number
        placeholder: 0.10
        help_text: Proportional tax rate as a decimal
      - name: price_level
        label: Price Level (P)
        type: number
        placeholder: 100
        help_text: Current price level (index)

  fiscal_deficit_analysis:
    title: Fiscal Deficit and Budget Analysis
    category: macroeconomics
    fields:
      - name: revenue_receipts
        label: Revenue Receipts
        type: number
        placeholder: 500000
        help_text: Tax and non-tax revenue receipts (do not create liability)
      - name: revenue_expenditure
        label: Revenue Expenditure
        type: number
        placeholder: 550000
        help_text: Expenditure that does not create assets
      - name: capital_receipts
        label: Capital Receipts
        type: number
        placeholder: 100000
        help_text: Receipts that create liabilities or reduce assets
      - name: capital_expenditure
        label: Capital Expenditure
        type: number
        placeholder: 120000
        help_text: Expenditure that creates assets
      - name: interest_payments
        label: Interest Payments
        type: number
        placeholder: 30000
        help_text: Interest paid on accumulated debt
      - name: borrowings
        label: Borrowings (Net)
        type: number
        placeholder: 80000
        help_text: Net borrowings during the fiscal year

  balance_of_payments:
    title: Balance of Payments
    category: macroeconomics
    fields:
      - name: exports_goods
        label: Exports of Goods
        type: number
        placeholder: 300000
        help_text: Value of merchandise exports
      - name: imports_goods
        label: Imports of Goods
        type: number
        placeholder: 350000
        help_text: Value of merchandise imports
      - name: exports_services
        label: Exports of Services
        type: number
        placeholder: 150000
        help_text: Value of service exports (IT, tourism, etc.)
      - name: imports_services
        label: Imports of Services
        type: number
        placeholder: 100000
        help_text: Value of service imports
      - name: private_transfers_in
        label: Private Transfers In
        type: number
        placeholder: 25000
        help_text: Remittances received from abroad
      - name: private_transfers_out
        label: Private Transfers Out
        type: number
        placeholder: 15000
        help_text: Remittances sent abroad
      - name: official_transfers_in
        label: Official Transfers In
        type: number
        placeholder: 5000
        help_text: Grants and donations received from abroad
      - name: investment_income_in
        label: Investment Income In
        type: number
        placeholder: 10000
        help_text: Dividends and interest received from abroad
      - name: investment_income_out
        label: Investment Income Out
        type: number
        placeholder: 20000
        help_text: Dividends and interest paid to foreign investors

  forex_exchange_rate:
    title: Foreign Exchange Rate
    category: macroeconomics
    fields:
      - name: base_currency
        label: Base Currency Amount
        type: number
        placeholder: 1
        help_text: Amount in base currency (e.g., 1 USD)
      - name: quote_currency
        label: Quote Currency Amount
        type: number
        placeholder: 83
        help_text: Equivalent amount in quote currency (e.g., 83 INR)
      - name: exchange_type
        label: Exchange Rate System
        type: select
        options:
          - fixed
          - flexible
          - managed_float
        placeholder: managed_float
        help_text: Type of exchange rate system
      - name: demand_forex
        label: Demand for Foreign Exchange
        type: number
        placeholder: 50000
        help_text: Quantity of foreign exchange demanded (in crores)
      - name: supply_forex
        label: Supply of Foreign Exchange
        type: number
        placeholder: 45000
        help_text: Quantity of foreign exchange supplied (in crores)