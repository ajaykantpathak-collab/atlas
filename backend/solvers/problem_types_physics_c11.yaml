step_types:
  - id: step_identify_dimensions
    title: Identify the dimensions of physical quantities
    description: "Break down each physical quantity into its fundamental dimensions [M, L, T, I, Θ, N, J]"

  - id: step_convert_units
    title: Convert between unit systems
    description: "Convert given quantities from one unit system to another (SI, CGS, or practical units)"

  - id: step_verify_consistency
    title: Verify dimensional consistency
    description: "Check whether both sides of an equation are dimensionally consistent"

  - id: step_identify_vector_components
    title: Identify vector magnitude and direction
    description: "Extract magnitude and direction information for each vector in the problem"

  - id: step_resolve_vectors
    title: Resolve vectors into components
    description: "Decompose vectors into x and y components using trigonometry"

  - id: step_compute_resultant
    title: Compute resultant vector
    description: "Add vector components and find the magnitude and direction of the resultant"

  - id: step_list_given_quantities
    title: List all known quantities
    description: "Organize all given values with their proper symbols and units"

  - id: step_select_kinematic_equation
    title: Select appropriate kinematic equation
    description: "Choose from the SUVAT equations based on the quantities involved"

  - id: step_compute_displacement
    title: Compute displacement
    description: "Calculate the displacement using the selected equation"

  - id: step_compute_final_velocity
    title: Compute final velocity
    description: "Calculate the final velocity using kinematic relationships"

  - id: step_resolve_initial_velocity
    title: Resolve initial velocity into components
    description: "Split the initial velocity into horizontal (u cos θ) and vertical (u sin θ) components"

  - id: step_compute_time_of_flight
    title: Compute time of flight
    description: "Calculate the total time the projectile remains in the air"

  - id: step_compute_max_height
    title: Compute maximum height
    description: "Calculate the peak vertical displacement of the projectile"

  - id: step_compute_horizontal_range
    title: Compute horizontal range
    description: "Calculate the total horizontal distance traveled by the projectile"

  - id: step_define_reference_frame
    title: Define the reference frame
    description: "Establish the observer's frame and the object's frame of reference"

  - id: step_compute_relative_velocity
    title: Compute relative velocity
    description: "Apply vector subtraction to find the velocity of one body relative to another"

  - id: step_track_displacement
    title: Track displacement over time
    description: "Calculate the relative displacement using relative velocity and time"

  - id: step_draw_free_body_diagram
    title: Draw free body diagram
    description: "Isolate each body and represent all forces acting on it with arrows"

  - id: step_apply_newton_second_law
    title: Apply Newton's Second Law
    description: "Write F = ma for each body in the direction of motion"

  - id: step_solve_for_acceleration
    title: Solve for acceleration
    description: "Solve the system of equations to find the common acceleration"

  - id: step_compute_tension_or_contact_force
    title: Compute tension or contact force
    description: "Substitute the acceleration back to find internal forces"

  - id: step_compute_normal_force
    title: Compute normal force
    description: "Calculate the reaction force perpendicular to the contact surface"

  - id: step_calculate_max_static_friction
    title: Calculate maximum static friction
    description: "Apply f_s(max) = μ_s N to find the threshold for motion"

  - id: step_apply_kinetic_friction
    title: Apply kinetic friction
    description: "Use f_k = μ_k N to compute the retarding force during motion"

  - id: step_compute_acceleration_or_distance
    title: Compute acceleration or distance
    description: "Use Newton's laws with friction to find the resulting motion"

  - id: step_identify_centripetal_force
    title: Identify centripetal force
    description: "Determine which force or component provides the centripetal acceleration"

  - id: step_analyze_banking_angle
    title: Analyze banking angle
    description: "Use tan θ = v²/(Rg) to relate banking angle, speed, and radius"

  - id: step_compute_optimum_speed
    title: Compute optimum speed
    description: "Calculate the ideal speed for the given banking angle where no friction is needed"

  - id: step_apply_conservation_of_momentum
    title: Apply conservation of linear momentum
    description: "Use the principle that total momentum before equals total momentum after collision"

  - id: step_compute_velocity_after_collision
    title: Compute velocity after collision
    description: "Solve for unknown velocities using momentum equations"

  - id: step_determine_collision_type
    title: Determine collision type
    description: "Identify whether the collision is elastic, inelastic, or perfectly inelastic"

  - id: step_set_up_integral_for_work
    title: Set up integral for variable force work
    description: "Express work as W = ∫ F·dx for the given force function"

  - id: step_identify_limits
    title: Identify integration limits
    description: "Determine the start and end positions for the integral"

  - id: step_evaluate_integral
    title: Evaluate the integral
    description: "Perform the integration to find the numerical value of work done"

  - id: step_identify_initial_and_final_states
    title: Identify initial and final states
    description: "Clearly define the starting and ending configurations of the system"

  - id: step_compute_total_mechanical_energy
    title: Compute total mechanical energy
    description: "Calculate KE + PE at each state (energy is conserved if only conservative forces act)"

  - id: step_apply_conservation_principle
    title: Apply conservation principle
    description: "Set initial total energy equal to final total energy"

  - id: step_solve_for_unknown
    title: Solve for the unknown quantity
    description: "Rearrange the equation and compute the required physical quantity"

  - id: step_define_power
    title: Define power
    description: "Express power as the rate of doing work: P = dW/dt or P = F·v"

  - id: step_express_power_in_terms_of_force_and_velocity
    title: Express power in terms of force and velocity
    description: "Convert the power expression to P = Fv cos θ form"

  - id: step_compute_average_power
    title: Compute average power
    description: "Calculate P_avg = Total Work / Total Time"

  - id: step_identify_particle_positions
    title: Identify particle positions and masses
    description: "List coordinates (xᵢ, yᵢ) and masses mᵢ of each particle in the system"

  - id: step_apply_centre_of_mass_formula
    title: Apply centre of mass formula
    description: "Use X_cm = Σmᵢxᵢ / Σmᵢ and Y_cm = Σmᵢyᵢ / Σmᵢ"

  - id: step_compute_resultant_coordinates
    title: Compute resultant coordinates
    description: "Substitute values and calculate the numerical coordinates of the centre of mass"

  - id: step_look_up_or_compute_MOI
    title: Look up or compute moment of inertia
    description: "Identify the standard formula for the moment of inertia of the given body about the given axis"

  - id: step_apply_parallel_axis_theorem
    title: Apply parallel axis theorem
    description: "Use I = I_cm + Md² to find MOI about a parallel axis at distance d"

  - id: step_compute_rotational_KE
    title: Compute rotational kinetic energy
    description: "Calculate K = (1/2)Iω² using the computed moment of inertia"

  - id: step_compute_torque
    title: Compute torque
    description: "Calculate τ = r × F = rF sin θ"

  - id: step_apply_angular_momentum_principle
    title: Apply angular momentum principle
    description: "Use τ = dL/dt to relate torque and rate of change of angular momentum"

  - id: step_solve_for_angular_acceleration
    title: Solve for angular acceleration
    description: "Use τ = Iα to find the angular acceleration produced by the torque"

  - id: step_identify_rolling_condition
    title: Identify rolling without slipping condition
    description: "Apply v = Rω to relate linear and angular quantities"

  - id: step_compute_total_KE
    title: Compute total kinetic energy for rolling body
    description: "Calculate K = (1/2)mv² + (1/2)Iω² = (1/2)mv²(1 + k²/R²)"

  - id: step_compute_acceleration_down_incline
    title: Compute acceleration down an incline
    description: "Apply energy conservation or torque equation for the rolling body"

  - id: step_identify_external_torque
    title: Identify external torque
    description: "Check whether any external torque acts on the system"

  - id: step_apply_angular_momentum_conservation
    title: Apply conservation of angular momentum
    description: "Use L_initial = L_final when external torque is zero"

  - id: step_compute_new_angular_velocity
    title: Compute new angular velocity
    description: "From I₁ω₁ = I₂ω₂, calculate the final angular speed"

  - id: step_identify_mass_distribution
    title: Identify mass distribution geometry
    description: "Determine the shape and symmetry of the mass producing the field"

  - id: step_compute_gravitational_field
    title: Compute gravitational field strength
    description: "Apply g = GM/r² for the given geometry"

  - id: step_compute_gravitational_potential
    title: Compute gravitational potential
    description: "Calculate V = -GM/r at the point of interest"

  - id: step_apply_kepler_third_law
    title: Apply Kepler's Third Law
    description: "Use T² ∝ r³ to relate the orbital period to the mean distance"

  - id: step_compute_orbital_period
    title: Compute orbital period
    description: "Calculate the time for one complete revolution using Kepler's laws"

  - id: step_compute_orbital_speed
    title: Compute orbital speed
    description: "Calculate v = √(GM/r) for a circular orbit"

  - id: step_apply_conservation_of_energy
    title: Apply conservation of mechanical energy
    description: "Use (1/2)mv² - GMm/r = constant for orbital and escape calculations"

  - id: step_compute_escape_velocity
    title: Compute escape velocity
    description: "Calculate v_esc = √(2GM/R) from the surface of the body"

  - id: step_compute_binding_energy
    title: Compute binding energy
    description: "Calculate the minimum energy needed to remove a body to infinity"

  - id: step_apply_hookes_law
    title: Apply Hooke's Law
    description: "Use F = kx or stress = Y × strain for elastic deformation"

  - id: step_compute_youngs_modulus
    title: Compute Young's modulus
    description: "Calculate Y = (F/A) / (ΔL/L) = (FL)/(AΔL)"

  - id: step_compute_elastic_potential_energy
    title: Compute elastic potential energy
    description: "Calculate U = (1/2)kx² for a stretched or compressed spring"

  - id: step_compute_work_done
    title: Compute work done in stretching
    description: "Calculate the area under the force-extension graph"

  - id: step_apply_pascals_law
    title: Apply Pascal's Law
    description: "Use P₁ = P₂ => F₁/A₁ = F₂/A₂ for confined fluids"

  - id: step_compute_pressure
    title: Compute pressure
    description: "Calculate P = F/A for the applied force on the fluid"

  - id: step_compute_output_force
    title: Compute output force
    description: "Find the force at the second piston using the area ratio"

  - id: step_apply_bernoulli_equation
    title: Apply Bernoulli's equation
    description: "Use P + (1/2)ρv² + ρgh = constant along a streamline"

  - id: step_compute_pressure_difference
    title: Compute pressure difference
    description: "Calculate ΔP from Bernoulli's equation for two points"

  - id: step_compute_flow_speed
    title: Compute flow speed at constriction
    description: "Apply continuity equation A₁v₁ = A₂v₂"

  - id: step_apply_stokes_law
    title: Apply Stokes' Law
    description: "Use F_viscous = 6πηrv for a sphere moving through a viscous fluid"

  - id: step_set_terminal_velocity_condition
    title: Set terminal velocity condition
    description: "At terminal velocity: Weight = Buoyant force + Viscous drag"

  - id: step_compute_viscous_force
    title: Compute viscous force at terminal velocity
    description: "Calculate F_η = 6πηr v_t from the terminal velocity condition"

  - id: step_identify_process_type
    title: Identify the thermodynamic process type
    description: "Determine if the process is isothermal, adiabatic, isochoric, isobaric, or cyclic"

  - id: step_compute_heat_work_and_internal_energy_change
    title: Compute heat, work and internal energy change
    description: "Apply ΔU = Q - W with appropriate sign conventions"

  - id: step_identify_source_and_sink_temperatures
    title: Identify source and sink temperatures
    description: "Extract T_hot and T_cold from the problem statement (in Kelvin)"

  - id: step_compute_carnot_efficiency
    title: Compute Carnot efficiency
    description: "Calculate η = 1 - T_c/T_h for the ideal Carnot cycle"

  - id: step_compute_work_output
    title: Compute work output
    description: "Calculate W = ηQ_h for the given heat input"

  - id: step_count_degrees_of_freedom
    title: Count degrees of freedom
    description: "Determine f for the gas type: monatomic f=3, diatomic f=5 (at ordinary temp)"

  - id: step_apply_equipartition_theorem
    title: Apply equipartition theorem
    description: "Use (1/2)kT energy per degree of freedom per molecule"

  - id: step_compute_internal_energy_and_specific_heat
    title: Compute internal energy and specific heat
    description: "Calculate U = (f/2)nRT and C_v = (f/2)R, C_p = ((f+2)/2)R"

  - id: step_compute_rms_speed
    title: Compute rms speed
    description: "Calculate v_rms = √(3RT/M) for the given gas and temperature"

  - id: step_identify_type_of_motion
    title: Identify the type of motion
    description: "Verify that the motion satisfies the SHM differential equation: d²x/dt² + ω²x = 0"

  - id: step_compute_time_period
    title: Compute time period
    description: "Calculate T = 2π/ω for the oscillating system"

  - id: step_compute_max_velocity_and_acceleration
    title: Compute maximum velocity and acceleration
    description: "Calculate v_max = Aω and a_max = Aω²"

  - id: step_compute_energy_at_given_displacement
    title: Compute energy at a given displacement
    description: "Calculate KE and PE using E = (1/2)kA², KE = (1/2)k(A²-x²), PE = (1/2)kx²"

  - id: step_derive_time_period_formula
    title: Derive time period formula
    description: "Apply T = 2π√(L/g) for a simple pendulum"

  - id: step_compute_length_for_seconds_pendulum
    title: Compute length for seconds pendulum
    description: "Set T = 2s and solve for L"

  - id: step_account_for_buoyancy_if_required
    title: Account for buoyancy if required
    description: "Adjust effective g for pendulum in a fluid: g' = g(1 - ρ_fluid/ρ_bob)"

  - id: step_classify_vibration_type
    title: Classify vibration type
    description: "Distinguish between free, forced and resonant vibrations"

  - id: step_analyze_resonance_condition
    title: Analyze resonance condition
    description: "Identify when driving frequency equals natural frequency"

  - id: step_compare_amplitudes
    title: Compare amplitudes
    description: "Analyze how amplitude varies with driving frequency near resonance"

  - id: step_compute_wavelength_or_frequency
    title: Compute wavelength or frequency
    description: "Use v = fλ to find the unknown wave property"

  - id: step_apply_principle_of_superposition
    title: Apply principle of superposition
    description: "Add the displacements of two waves: y = y₁ + y₂"

  - id: step_compute_node_and_antinode_positions
    title: Compute node and antinode positions
    description: "Identify points of zero displacement (nodes) and maximum displacement (antinodes)"

  - id: step_compute_beat_frequency
    title: Compute beat frequency
    description: "Calculate f_beat = |f₁ - f₂| for two waves of slightly different frequencies"

  - id: step_apply_doppler_formula
    title: Apply Doppler effect formula
    description: "Use f' = f(v ± v_observer)/(v ∓ v_source) with proper sign conventions"

  - id: step_compute_observed_frequency
    title: Compute observed frequency
    description: "Substitute values into the Doppler formula to find the shifted frequency"