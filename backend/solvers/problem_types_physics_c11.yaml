      - step_verify_consistency
    marks: 6
    difficulty: Medium
    thinking_question:
      question: "A physical quantity X is related to four variables a, b, c, and d as: X = (a²b)/(c³d). If the percentage errors in the measurement of a, b, c, and d are 1%, 3%, 4%, and 2% respectively, what is the percentage error in X?"
