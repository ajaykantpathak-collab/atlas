step_types:
  matrix_addition:
    id: "ST-AM-M1"
    template:
      - rule: "Matrix Addition Rule"
        action: "Add corresponding elements: C[i][j] = A[i][j] + B[i][j]"
        verify: "Dimensions must match; sum of row and column sums"
  matrix_multiplication:
    id: "ST-AM-M2"
    template:
      - rule: "Matrix Multiplication Rule"
        action: "C[i][j] = sum_k(A[i][k] * B[k][j])"
        verify: "Inner dimensions must match; verify C*A vs A*C"
  matrix_inverse_2x2:
    id: "ST-AM-M3"
    template:
      - rule: "Inverse of 2×2 Matrix"
        action: "A⁻¹ = (1/det) * [[d, -b], [-c, a]] for [[a,b],[c,d]]"
        verify: "A * A⁻¹ = I (identity matrix)"
  matrix_inverse_elementary:
    id: "ST-AM-M4"
    template:
      - rule: "Elementary Row Operations (Gauss-Jordan)"
        action: "Augment [A|I], reduce left to I → right becomes A⁻¹"
        verify: "A * A⁻¹ = I"
  determinant_2x2:
    id: "ST-AM-D1"
    template:
      - rule: "2×2 Determinant"
        action: "det = ad - bc"
        verify: "det(A) = 0 implies singular matrix"
  determinant_3x3:
    id: "ST-AM-D2"
    template:
      - rule: "3×3 Determinant (Sarrus' Rule or Cofactor Expansion)"
        action: "det = a(ei−fh)−b(di−fg)+c(dh−eg)"
        verify: "det(Aᵀ) = det(A)"
  determinant_properties:
    id: "ST-AM-D3"
    template:
      - rule: "Properties of Determinants"
        action: "Apply row swap sign change, row scaling, row addition"
        verify: "det(kA) = kⁿ det(A) for n×n matrix"
  linear_system_solve:
    id: "ST-AM-LS"
    template:
      - rule: "Cramer's Rule / Matrix Inverse Method"
        action: "X = A⁻¹B or x_i = det(A_i)/det(A)"
        verify: "Substitute solution back: AX = B"
  diff_power_rule:
    id: "ST-AM-DR1"
    template:
      - rule: "Power Rule of Differentiation"
        action: "d/dx(xⁿ) = n·x^(n−1)"
        verify: "Numerical check at x=2: h→0 limit"
  diff_product_rule:
    id: "ST-AM-DR2"
    template:
      - rule: "Product Rule"
        action: "d/dx(uv) = u'v + uv'"
        verify: "Symbolic simplification of result"
  diff_quotient_rule:
    id: "ST-AM-DR3"
    template:
      - rule: "Quotient Rule"
        action: "d/dx(u/v) = (u'v − uv')/v²"
        verify: "Symbolic simplification of result"
  diff_chain_rule:
    id: "ST-AM-DR4"
    template:
      - rule: "Chain Rule"
        action: "d/dx(f(g(x))) = f'(g(x)) · g'(x)"
        verify: "Symbolic simplification"
  diff_trig:
    id: "ST-AM-DR5"
    template:
      - rule: "Trigonometric Differentiation"
        action: "Apply standard derivative formulas for sin, cos, tan, etc."
        verify: "Numerical check at sample point"
  diff_log_exp:
    id: "ST-AM-DR6"
    template:
      - rule: "Logarithmic and Exponential Differentiation"
        action: "d/dx(ln x) = 1/x, d/dx(eˣ) = eˣ"
        verify: "Numerical check"
  implicit_diff:
    id: "ST-AM-DR7"
    template:
      - rule: "Implicit Differentiation"
        action: "Differentiate both sides w.r.t. x, solve for dy/dx"
        verify: "Substitute a point satisfying the equation"
  diff_parametric:
    id: "ST-AM-DR8"
    template:
      - rule: "Parametric Differentiation"
        action: "dy/dx = (dy/dt) / (dx/dt)"
        verify: "Numerical check at parameter value"
  second_derivative:
    id: "ST-AM-DR9"
    template:
      - rule: "Second Order Derivative"
        action: "d²y/dx² = d/dx(dy/dx)"
        verify: "Numerical second derivative check"
  rate_of_change:
    id: "ST-AM-ROC"
    template:
      - rule: "Rate of Change Application"
        action: "dy/dt = (dy/dx) * (dx/dt) — related rates"
        verify: "Substitute given values into final expression"
  tangent_normal:
    id: "ST-AM-TN"
    template:
      template:
      - rule: "Equation of Tangent and Normal"
        action: "Tangent: y−y₁ = m(x−x₁), Normal: y−y₁ = (−1/m)(x−x₁)"
        verify: "Check slope at point numerically"
  maxima_minima:
    id: "ST-AM-MM"
    template:
      - rule: "Maxima and Minima (First/Second Derivative Test)"
        action: "f'(x)=0 gives critical points; f''(x)>0 → min, f''(x)<0 → max"
        verify: "Sign change of f' around critical point"
  integrand_power:
    id: "ST-AM-INT1"
    template:
      - rule: "Power Rule of Integration"
        action: "∫xⁿdx = x^(n+1)/(n+1) + C  (n≠−1)"
        verify: "Differentiate the result to recover integrand"
  integrand_trig:
    id: "ST-AM-INT2"
    template:
      - rule: "Integration of Standard Functions"
        action: "Apply standard integral formulas for trig, exp, log"
        verify: "Differentiate the result to recover integrand"
  integrand_by_substitution:
    id: "ST-AM-INT3"
    template:
      - rule: "Integration by Substitution"
        action: "Let u = g(x), du = g'(x)dx, then ∫f(g(x))g'(x)dx = ∫f(u)du"
        verify: "Differentiate the result to recover integrand"
  integrand_by_parts:
    id: "ST-AM-INT4"
    template:
      - rule: "Integration by Parts (ILATE)"
        action: "∫u dv = uv − ∫v du"
        verify: "Differentiate the result to recover integrand"
  integrand_definite:
    id: "ST-AM-INT5"
    template:
      - rule: "Definite Integral"
        action: "∫[a→b] f(x)dx = F(b) − F(a)"
        verify: "Numerical quadrature for comparison"
  integrand_area:
    id: "ST-AM-INT6"
    template:
      - rule: "Area Under Curve"
        action: "Area = ∫[a→b] |f(x)−g(x)| dx"
        verify: "Monte Carlo numerical area check"
  bayes_basic:
    id: "ST-AM-PB1"
    template:
      - rule: "Bayes' Theorem"
        action: "P(A|B) = P(B|A)·P(A) / Σ P(B|Hᵢ)·P(Hᵢ)"
        verify: "All posterior probabilities sum to 1"
  bayes_medical:
    id: "ST-AM-PB2"
    template:
      - rule: "Bayes' Theorem — Medical Test Application"
        action: "P(Disease|Positive) = P(+|D)·P(D) / [P(+|D)·P(D)+P(+|¬D)·P(¬D)]"
        verify: "Posterior sum check"
  binomial_dist:
    id: "ST-AM-PD1"
    template:
      - rule: "Binomial Distribution"
        action: "P(X=k) = C(n,k) pᵏ (1−p)^(n−k)"
        verify: "Sum over all k from 0 to n equals 1"
  poisson_dist:
    id: "ST-AM-PD2"
    template:
      - rule: "Poisson Distribution"
        action: "P(X=k) = (λᵏ e^(−λ)) / k!"
        verify: "Sum ≈ 1 for large n; mean = variance = λ"
  normal_dist:
    id: "ST-AM-PD3"
    template:
      - rule: "Normal Distribution"
        action: "f(x) = (1/(σ√(2π))) exp(−(x−μ)²/(2σ²))"
        verify: "∫[−∞→∞] f(x)dx = 1"
  lpp_formulation:
    id: "ST-AM-LP1"
    template:
      - rule: "Linear Programming Formulation"
        action: "Define decision variables, objective function, constraints"
        verify: "All constraints are linear; check feasible region non-empty"
  lpp_graphical:
    id: "ST-AM-LP2"
    template:
      - rule: "Graphical Method"
        action: "Plot constraints, find corner points, evaluate objective at each"
        verify: "Optimal solution at corner point of feasible region"
  lpp_special_cases:
    id: "ST-AM-LP3"
    template:
      - rule: "Special LPP Cases: Unbounded, Infeasible, Multiple Optimal"
        action: "Analyze corner points and feasible region boundary"
        verify: "Check if feasible region is bounded and non-empty"
  perpetuity:
    id: "ST-AM-FP1"
    template:
      - rule: "Perpetuity Formula"
        action: "PV = C / r  (ordinary),  PV = C + C/r  (due)"
        verify: "Verify with Python Decimal arithmetic"
  annuity_immediate:
    id: "ST-AM-FP2"
    template:
      - rule: "Ordinary Annuity (Immediate)"
        action: "PV = R * [1 − (1+i)^(−n)] / i,  FV = R * [(1+i)ⁿ − 1] / i"
        verify: "Verify with Python Decimal arithmetic"
  annuity_due:
    id: "ST-AM-FP3"
    template:
      - rule: "Annuity Due"
        action: "PV_due = PV_immediate * (1+i),  FV_due = FV_immediate * (1+i)"
        verify: "Verify with Python Decimal arithmetic"
  sinking_fund:
    id: "ST-AM-FP4"
    template:
      - rule: "Sinking Fund"
        action: "SF payment: R = S * i / [(1+i)ⁿ − 1]"
        verify: "Verify accumulated value matches target S"
  emi_calculation:
    id: "ST-AM-FP5"
    template:
      - rule: "EMI Formula"
        action: "EMI = P * r * (1+r)ⁿ / [(1+r)ⁿ − 1]  where r = annual rate/12/100"
        verify: "Total EMI × n must exceed principal by total interest"
  loan_amortization:
    id: "ST-AM-FP6"
    template:
      - rule: "Loan Amortization Schedule"
        action: "Each period: Interest = Balance * r, Principal = EMI − Interest, New Balance = Balance − Principal"
        verify: "Final balance ≈ 0 (rounding allowed)"
  depreciation_wdv:
    id: "ST-AM-FP7"
    template:
      - rule: "Written Down Value (Diminishing Balance) Method"
        action: "DV_n = Cost * (1 − r/100)ⁿ"
        verify: "DV decreases each year; check sequence"
  depreciation_slm:
    id: "ST-AM-FP8"
    template:
      - rule: "Straight Line Method"
        action: "Annual Depreciation = (Cost − Scrap Value) / Useful Life"
        verify: "Sum of depreciations = Cost − Scrap Value"
  measures_central_tendency:
    id: "ST-AM-ST1"
    template:
      - rule: "Mean, Median, Mode Formulas"
        action: "Apply appropriate formula for grouped/ungrouped data"
        verify: "Mean ≈ Median for symmetric distributions"
  measures_dispersion:
    id: "ST-AM-ST2"
    template:
      - rule: "Range, Variance, Standard Deviation, IQR"
        action: "SD = sqrt(Σ(x−x̄)²/n), Coefficient of Variation = SD/|Mean|×100"
        verify: "SD ≥ 0; CV for comparing relative dispersion"
  correlation_pearson:
    id: "ST-AM-ST3"
    template:
      - rule: "Pearson Correlation Coefficient"
        action: "r = Σ[(x−x̄)(y−ȳ)] / sqrt[Σ(x−x̄)² · Σ(y−ȳ)²]"
        verify: "−1 ≤ r ≤ 1"
  regression_lines:
    id: "ST-AM-ST4"
    template:
      - rule: "Regression Lines"
        action: "y on x: (y−ȳ)/sy = r(x−x̄)/sx;  x on y: (x−x̄)/sx = r(y−ȳ)/sy"
        verify: "Both lines pass through (x̄, ȳ)"
  index_number_laaspeyres:
    id: "ST-AM-IN1"
    template:
      - rule: "Laspeyres Price Index"
        action: "P₀₁ᴸ = (Σp₁q₀ / Σp₀q₀) × 100"
        verify: "Index = 100 in base year"
  index_number_paasche:
    id: "ST-AM-IN2"
    template:
      - rule: "Paasche Price Index"
        action: "P₀₁ᴾ = (Σp₁q₁ / Σp₀q₁) × 100"
        verify: "Index = 100 in base year"
  index_number_fisher:
    id: "ST-AM-IN3"
    template:
      - rule: "Fisher's Ideal Index"
        action: "P₀₁ᶠ = sqrt(P₀₁ᴸ × P₀₁ᴾ)"
        verify: "Satisfies time reversal and factor reversal tests"
  time_series_trend:
    id: "ST-AM-TS1"
    template:
      - rule: "Least Squares Trend Line"
        action: "y = a + bx,  b = [nΣxy−ΣxΣy]/[nΣx²−(Σx)²]"
        verify: "Regression line passes through centroid (x̄, ȳ)"
  time_series_moving_avg:
    id: "ST-AM-TS2"
    template:
      - rule: "Moving Average"
        action: "MA of period m: average of m consecutive values centered"
        verify: "MA smooths fluctuations; preserves overall trend direction"
  time_series_seasonal:
    id: "ST-AM-TS3"
    template:
      - rule: "Seasonal Index via Additive Method"
        action: "SI = Average of (Actual − Trend) for that period"
        verify: "Average of seasonal indices ≈ 0 (additive) or 100 (multiplicative)"