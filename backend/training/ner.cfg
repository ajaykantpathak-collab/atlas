[paths]
train = "D:/platform/deploy/backend/training/ner_train.spacy"
dev = "D:/platform/deploy/backend/training/ner_dev.spacy"

[system]
seed = 20261004
gpu_allocator = null

[nlp]
lang = "en"
pipeline = ["ner"]
batch_size = 2000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers": "spacy.Tokenizer.v1"}

[components]

[components.ner]
factory = "ner"
moves = null
update_with_oracle_cut_size = 100

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "ner"
extra_state_tokens = false
hidden_width = 64
maxout_pieces = 3
use_upper = false
nO = null
tok2vec = {"@architectures": "spacy.Tok2Vec.v2", "embed": {"@architectures": "spacy.MultiHashEmbed.v2", "width": 96, "attrs": ["NORM", "PREFIX", "SUFFIX", "SHAPE"], "rows": [5000, 1000, 1000, 1000], "include_static_vectors": false}, "encode": {"@architectures": "spacy.MaxoutWindowEncoder.v2", "width": 96, "depth": 4, "window_size": 1, "maxout_pieces": 3}}

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
limit = 0
gold_preproc = false

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
limit = 0
gold_preproc = false

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = 20261004
gpu_allocator = null
dropout = 0.1
accumulate_gradient = 1
patience = 600
max_epochs = 12
max_steps = 0
eval_frequency = 500
eval_batch_size = 512
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 256
stop = 1024
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.score_weights]
ents_f = 1.0

[initialize]

[initialize.tokenizer]

[initialize.components]

[initialize.vectors]
