# ── Nginx Load Balancer Config ─────────────────────────────────
# Distributes traffic across multiple backend uvicorn workers
# and serves the frontend. Single entry point on port 80.

upstream backend_pool {
    # Multiple backend instances for horizontal scaling
    # Add/remove backend-N entries to scale horizontally
    server backend-1:8000 max_fails=3 fail_timeout=30s;
    server backend-2:8000 max_fails=3 fail_timeout=30s backup;
    
    # Connection settings
    keepalive 32;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    
    # Client body size for file uploads (solver expressions, etc.)
    client_max_body_size 10m;
    
    # Timeout settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # ── API routes → backend pool ──────────────────────────────
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # WebSocket support (for real-time tutor sessions)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Rate limiting zone
        limit_req zone=api burst=20 nodelay;
    }
    
    # ── Health check endpoint ──────────────────────────────────
    location /health {
        proxy_pass http://backend_pool/health;
        access_log off;
    }
    
    # ── Metrics endpoint (internal only) ───────────────────────
    location /metrics {
        # Restrict to internal network
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend_pool/metrics;
        access_log off;
    }
    
    # ── API docs ───────────────────────────────────────────────
    location /docs {
        proxy_pass http://backend_pool/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_pool/openapi.json;
        proxy_set_header Host $host;
    }
    
    # ── Frontend (catch-all) ───────────────────────────────────
    location / {
        proxy_pass http://frontend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Next.js HMR (dev only, harmless in prod)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Rate limiting zones (defined at http level in nginx.conf) ──
# Add to nginx.conf http block:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
