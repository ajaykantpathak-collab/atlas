<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Graph Visualizer — DREAM_APP</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #controls {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(15,15,35,0.95); padding: 12px 20px;
    border-bottom: 1px solid rgba(100,100,255,0.2);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  #controls label { font-size: 13px; color: #8888cc; }
  #controls select, #controls button {
    background: #1a1a3a; color: #e0e0e0; border: 1px solid #333366;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #controls select:hover, #controls button:hover { border-color: #5555aa; }
  #stats { margin-left: auto; font-size: 12px; color: #6666aa; }
  svg { width: 100vw; height: 100vh; }
  .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; transition: r 0.2s; }
  .node:hover circle { stroke-width: 3px; }
  .node text { font-size: 10px; fill: #ccc; pointer-events: none; text-shadow: 0 0 4px #000; }
  .link { stroke: #333366; stroke-opacity: 0.4; stroke-width: 1px; }
  .link.highlighted { stroke: #ff6b6b; stroke-opacity: 1; stroke-width: 2px; }
  #tooltip {
    position: fixed; display: none; z-index: 20;
    background: rgba(20,20,50,0.95); border: 1px solid #4444aa;
    border-radius: 8px; padding: 12px 16px; max-width: 350px;
    font-size: 12px; line-height: 1.5; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #tooltip h3 { color: #aaaaff; margin-bottom: 6px; font-size: 14px; }
  #tooltip .meta { color: #888; font-size: 11px; margin-bottom: 4px; }
  #tooltip .reason { color: #ffaa66; font-style: italic; margin-top: 6px; }
  .legend { position: fixed; bottom: 20px; left: 20px; z-index: 10; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>

<div id="controls">
  <label>Class:</label>
  <select id="classSelect">
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
  </select>
  <label>Subject:</label>
  <select id="subjectSelect">
    <option value="all">All Subjects</option>
    <option value="sci">Science</option>
    <option value="phy">Physics</option>
    <option value="chem">Chemistry</option>
    <option value="bio">Biology</option>
    <option value="math">Mathematics</option>
    <option value="eng">English</option>
    <option value="soc">Social Science</option>
  </select>
  <button onclick="loadGraph()">Load Graph</button>
  <button onclick="resetZoom()">Reset View</button>
  <span id="stats"></span>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div> Root node (no prerequisites)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6b9eff"></div> Regular node</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffd93d"></div> Selected / hovered</div>
</div>

<div id="tooltip"></div>
<svg id="graph"></svg>

<script>
const SUBJECT_COLORS = {
  sci: '#6b9eff', phy: '#4ecdc4', chem: '#ff8c42', bio: '#95e1a3',
  math: '#c44dff', eng: '#ff6b9d', hin: '#ffa500', soc: '#ff6b6b',
  geo: '#52c41a', hist: '#d4a574', polsci: '#728fce', econ: '#36cfc9',
  cs: '#13c2c2', pe: '#73d13d', art: '#ff85c0', evs: '#95de64',
};

let simulation, svg, g, linkGroup, nodeGroup, zoom;
let currentNodes = [], currentLinks = [];

function init() {
  svg = d3.select('#graph');
  const width = window.innerWidth;
  const height = window.innerHeight;

  zoom = d3.zoom()
    .scaleExtent([0.1, 8])
    .on('zoom', (event) => g.attr('transform', event.transform));

  svg.call(zoom);

  g = svg.append('g');
  linkGroup = g.append('g').attr('class', 'links');
  nodeGroup = g.append('g').attr('class', 'nodes');
}

function resetZoom() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}

async function loadGraph() {
  const cls = document.getElementById('classSelect').value;
  const subj = document.getElementById('subjectSelect').value;
  let url;
  if (subj === 'all') {
    url = `/graph_c${cls}_all.json`;
  } else {
    url = `/graph_c${cls}_${subj}.json`;
  }

  // Try fetching from public folder
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Not found');
    const data = await response.json();
    renderGraph(data);
  } catch (e) {
    document.getElementById('stats').textContent = `File ${url} not found. Available: graph_c10_sci.json, graph_c10_all.json, graph_c11_phy.json`;
  }
}

function renderGraph(data) {
  currentNodes = data.nodes.map(d => ({ ...d }));
  currentLinks = data.links.map(d => ({ ...d }));

  document.getElementById('stats').textContent =
    `${currentNodes.length} nodes | ${currentLinks.length} prerequisite edges`;

  // Clear old
  linkGroup.selectAll('*').remove();
  nodeGroup.selectAll('*').remove();

  if (simulation) simulation.stop();

  const width = window.innerWidth;
  const height = window.innerHeight;

  // Links
  const link = linkGroup.selectAll('line')
    .data(currentLinks)
    .enter().append('line')
    .attr('class', 'link')
    .attr('marker-end', 'url(#arrowhead)');

  // Arrowhead marker
  svg.append('defs').selectAll('marker')
    .data(['arrowhead']).enter().append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 18).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#333366');

  // Nodes
  const node = nodeGroup.selectAll('g')
    .data(currentNodes)
    .enter().append('g')
    .attr('class', 'node')
    .call(drag(simulation));

  node.append('circle')
    .attr('r', d => d.root ? 8 : 5)
    .attr('fill', d => d.root ? '#ff6b6b' : (SUBJECT_COLORS[d.subject] || '#6b9eff'));

  node.append('text')
    .attr('dx', 12)
    .attr('dy', '.35em')
    .text(d => d.topic.length > 40 ? d.topic.substring(0, 40) + '...' : d.topic);

  // Tooltip
  node.on('mouseover', (event, d) => {
    highlightNode(d);
    const tooltip = document.getElementById('tooltip');
    const prereqs = currentLinks.filter(l => l.source === d.id || l.source.id === d.id);
    let html = `<h3>${d.topic}</h3>`;
    html += `<div class="meta">ID: ${d.id}</div>`;
    html += `<div class="meta">Subject: ${d.subject} | Class: ${d.class}</div>`;
    html += `<div class="meta">Chapter: ${d.chapter || 'N/A'}</div>`;
    html += `<div class="meta">Root: ${d.root ? 'Yes' : 'No'}</div>`;
    if (prereqs.length > 0) {
      html += `<div class="meta" style="margin-top:8px"><b>Prerequisites (${prereqs.length}):</b></div>`;
      prereqs.slice(0, 5).forEach(p => {
        const target = typeof p.target === 'object' ? p.target.id : p.target;
        html += `<div class="reason">← ${target}: ${p.reason ? p.reason.substring(0, 80) : ''}</div>`;
      });
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
  })
  .on('mousemove', (event) => {
    const tooltip = document.getElementById('tooltip');
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
  })
  .on('mouseout', () => {
    document.getElementById('tooltip').style.display = 'none';
    unhighlight();
  });

  // Simulation
  simulation = d3.forceSimulation(currentNodes)
    .force('link', d3.forceLink(currentLinks).id(d => d.id).distance(80).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2 + 30))
    .force('collision', d3.forceCollide().radius(20))
    .on('tick', ticked);

  function ticked() {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  }
}

function highlightNode(d) {
  const connected = new Set([d.id]);
  currentLinks.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === d.id) connected.add(t);
    if (t === d.id) connected.add(s);
  });

  linkGroup.selectAll('line')
    .attr('class', l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === d.id || t === d.id) ? 'link highlighted' : 'link';
    })
    .attr('stroke-opacity', l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      return (s === d.id || t === d.id) ? 1 : 0.1;
    });

  nodeGroup.selectAll('circle')
    .attr('r', n => connected.has(n.id) ? (n.root ? 10 : 7) : (n.root ? 8 : 5))
    .attr('opacity', n => connected.has(n.id) ? 1 : 0.3);
}

function unhighlight() {
  linkGroup.selectAll('line')
    .attr('class', 'link')
    .attr('stroke-opacity', 0.4);
  nodeGroup.selectAll('circle')
    .attr('r', d => d.root ? 8 : 5)
    .attr('opacity', 1);
}

function drag(simulation) {
  return d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
}

init();
loadGraph();
</script>
</body>
</html>
