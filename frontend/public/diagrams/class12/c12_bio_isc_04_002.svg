<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Mendel's Monohybrid Cross</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Tall × dwarf pea — one gene pair, clean 3:1</text>
<rect x='330' y='100' width='300' height='46' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='480' y='128.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>T T (tall)  ×  t t (dwarf)</text>
<line x1='360' y1='150' x2='360' y2='169' stroke='#334155' stroke-width='2.2'/>
<polygon points='360,178 364.5,169 355.5,169' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='256.8' y='152' width='94.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='304' y='166' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>gametes T, T</text>
<line x1='600' y1='150' x2='600' y2='169' stroke='#334155' stroke-width='2.2'/>
<polygon points='600,178 604.5,169 595.5,169' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='608.8' y='152' width='94.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='656' y='166' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>gametes t, t</text>
<rect x='380' y='182' width='200' height='42' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='208.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>F1:  T t — ALL tall</text>
<text x='480' y='240' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>t allele masked but NOT lost — recessive</text>
<line x1='480' y1='254' x2='480' y2='273' stroke='#334155' stroke-width='2.2'/>
<polygon points='480,282 484.5,273 475.5,273' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='418.4' y='248' width='123.2' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='480' y='262' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>self-pollination</text>
<text x='320' y='300' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gametes T, t</text>
<text x='640' y='300' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gametes T, t</text>
<text x='290' y='400' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>T</text>
<text x='290' y='560' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>t</text>
<text x='400' y='304' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>T</text>
<text x='560' y='304' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>t</text>
<rect x='324' y='318' width='152' height='72' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='400' y='359.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>TT</text>
<text x='400' y='404' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tall</text>
<rect x='484' y='318' width='152' height='72' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='560' y='359.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Tt</text>
<text x='560' y='404' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tall</text>
<rect x='324' y='478' width='152' height='72' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='400' y='519.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>tT</text>
<text x='400' y='564' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tall</text>
<rect x='484' y='478' width='152' height='72' rx='8' fill='#fee2e2' stroke='#334155' stroke-width='1.8'/>
<text x='560' y='519.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>tt</text>
<text x='560' y='564' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>dwarf</text>
<text x='480' y='508' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Phenotype 3 tall : 1 dwarf · Genotype 1 TT : 2 Tt : 1 tt</text>
<text x='480' y='545' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Law of dominance (F1 shows one form) and law of segregation (alleles separate in gametes)</text>
<text x='480' y='600' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Test-cross proof: F1 tall × dwarf gives 1 tall : 1 dwarf — proving F1 was Tt, not pure tall</text>
</svg>
