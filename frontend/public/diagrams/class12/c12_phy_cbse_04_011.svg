<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Converting a Galvanometer: Ammeter &amp; Voltmeter</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Ammeter: tiny shunt in parallel · Voltmeter: big resistor in series</text>
<text x='240' y='130' font-size='16' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>AMMETER</text>
<line x1='100' y1='230' x2='100' y2='320' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='100' y1='320' x2='380' y2='320' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='380' y1='320' x2='380' y2='239' stroke='#334155' stroke-width='2.2'/>
<polygon points='380,230 375.5,239 384.5,239' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='100' y1='230' x2='100' y2='170' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='100' y1='170' x2='380' y2='170' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='380' y1='170' x2='380' y2='221' stroke='#334155' stroke-width='2.2'/>
<polygon points='380,230 384.5,221 375.5,221' fill='#334155' stroke='#334155' stroke-width='1'/>
<circle cx='240' cy='170' r='34' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<text x='240' y='176' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>G</text>
<rect x='195' y='300' width='90' height='36' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='2.2'/>
<text x='240' y='324' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>shunt S</text>
<text x='240' y='380' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>S &lt;&lt; G → almost ALL current</text>
<text x='240' y='398' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>bypasses the coil (I = I_g·(G+S)/S)</text>
<text x='240' y='425' font-size='12.5' fill='#2563eb' text-anchor='middle' font-weight='600' font-style='normal'>ideal ammeter: ZERO resistance</text>
<text x='700' y='130' font-size='16' fill='#059669' text-anchor='middle' font-weight='700' font-style='normal'>VOLTMETER</text>
<circle cx='700' cy='220' r='34' fill='#d1fae5' stroke='#059669' stroke-width='2.4'/>
<text x='700' y='226' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>G</text>
<rect x='655' y='300' width='90' height='36' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='700' y='324' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>high R</text>
<line x1='700' y1='254' x2='700' y2='300' stroke='#334155' stroke-width='2.2'/>
<line x1='655' y1='180' x2='620' y2='180' stroke='#334155' stroke-width='2.2'/>
<line x1='745' y1='180' x2='780' y2='180' stroke='#334155' stroke-width='2.2'/>
<text x='700' y='380' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>R &gt;&gt; circuit R → draws almost</text>
<text x='700' y='398' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>no current (V = I_g(G+R))</text>
<text x='700' y='425' font-size='12.5' fill='#059669' text-anchor='middle' font-weight='600' font-style='normal'>ideal voltmeter: INFINITE resistance</text>
<rect x='120' y='470' width='720' height='100' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='506.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why the fuss? A meter must steal as little as possible from the circuit: an ammeter in series</text>
<text x='480' y='524.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>should not throttle the current; a voltmeter in parallel should not leak it away. Range extension:</text>
<text x='480' y='542.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>shunt multiplier n = IG/(n−1) for n× ammeter; series R = (n−1)G for n× voltmeter</text>
<text x='480' y='620' font-size='13.5' fill='#dc2626' text-anchor='middle' font-weight='600' font-style='normal'>Common error: connecting an ammeter in parallel — near-short circuit! It would carry the whole supply current</text>
</svg>
