<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Web 1.0 vs Web 2.0</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>From read-only pages to a read-write, social, interactive web</text>
<rect x='100' y='120' width='340' height='300' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='270' y='231.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Web 1.0 (≈1990–2004)</text>
<text x='270' y='253.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>static pages, updated by webmasters</text>
<text x='270' y='275.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>user = reader only</text>
<text x='270' y='297.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>personal home pages</text>
<text x='270' y='319.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>one-way publishing</text>
<rect x='520' y='120' width='340' height='300' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='690' y='231.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Web 2.0 (today)</text>
<text x='690' y='253.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>user-generated content</text>
<text x='690' y='275.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>users read AND write</text>
<text x='690' y='297.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>social networks, wikis, blogs, videos</text>
<text x='690' y='319.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>rich interactive applications</text>
<line x1='445' y1='270' x2='506' y2='270' stroke='#334155' stroke-width='2.2'/>
<polygon points='515,270 506,265.5 506,274.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='443.6' y='250' width='72.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='480' y='264' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>evolution</text>
<text x='480' y='480' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Same Internet transport underneath — what changed is how people use the Web</text>
</svg>
