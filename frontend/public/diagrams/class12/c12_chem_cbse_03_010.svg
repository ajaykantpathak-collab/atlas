<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Collision Theory: Why Reactions Need a Barrier</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Collide with enough energy AND the right orientation</text>
<line x1='120' y1='420' x2='300' y2='420' stroke='#334155' stroke-width='2.6'/>
<line x1='300' y1='420' x2='400' y2='190' stroke='#334155' stroke-width='2.6' fill='none'/>
<line x1='400' y1='190' x2='520' y2='190' stroke='#334155' stroke-width='2.6' fill='none'/>
<line x1='520' y1='190' x2='620' y2='300' stroke='#334155' stroke-width='2.6' fill='none'/>
<line x1='620' y1='300' x2='831' y2='300' stroke='#334155' stroke-width='2.6'/>
<polygon points='840,300 831,295.5 831,304.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='840' y1='300' x2='843' y2='300' stroke='#334155' stroke-width='2.6'/>
<polygon points='852,300 843,295.5 843,304.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='200' y='400' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>reactants</text>
<text x='760' y='280' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>products</text>
<text x='460' y='170' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>activated complex (transition state)</text>
<line x1='370' y1='420' x2='370' y2='259' stroke='#dc2626' stroke-width='2.4'/>
<polygon points='370,250 365.5,259 374.5,259' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='352' y='340' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>Ea</text>
<line x1='660' y1='420' x2='660' y2='325' stroke='#059669' stroke-width='2.4'/>
<polygon points='660,316 655.5,325 664.5,325' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='676' y='370' font-size='12.5' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>Ea'(reverse)</text>
<line x1='200' y1='460' x2='751' y2='460' stroke='#d97706' stroke-width='2.2'/>
<polygon points='760,460 751,455.5 751,464.5' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<text x='350' y='484' font-size='12.5' fill='#d97706' text-anchor='middle' font-weight='normal' font-style='normal'>ΔH = H(prod) − H(react) &lt; 0 (exothermic)</text>
<rect x='560' y='480' width='340' height='90' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='730' y='511.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Second condition — orientation:</text>
<text x='730' y='529.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>A–B + C must meet as A–B–C (right way round),</text>
<text x='730' y='546.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>not A–B · C sideways</text>
<text x='480' y='600' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Fraction of molecules with E &gt; Ea ≈ e^(−Ea/RT) — small Ea or high T → exponentially more successful collisions</text>
<text x='480' y='628' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Catalyst = alternative path with LOWER Ea; ΔH and the endpoint stay exactly the same</text>
</svg>
