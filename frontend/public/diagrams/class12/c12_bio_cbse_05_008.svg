<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Sex-linked Inheritance: X-linked Recessive</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Colour blindness — the classic case (mother carrier × normal father)</text>
<text x='300' y='110' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Carrier mother × Normal father</text>
<rect x='190' y='130' width='220' height='46' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='300' y='158.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>XC Xc   ×   XC Y</text>
<line x1='300' y1='200' x2='300' y2='223' stroke='#334155' stroke-width='2.2'/>
<polygon points='300,232 304.5,223 295.5,223' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='300' y='222' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gametes: XC, Xc  /  XC, Y</text>
<text x='360' y='230' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>XC</text>
<text x='480' y='230' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Y</text>
<text x='156' y='306' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>XC</text>
<text x='156' y='426' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Xc</text>
<rect x='184' y='244' width='112' height='52' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='240' y='275.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>XC XC</text>
<text x='240' y='308' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>normal daughter</text>
<rect x='304' y='244' width='112' height='52' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='360' y='275.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>XC Y</text>
<text x='360' y='308' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>normal son</text>
<rect x='184' y='364' width='112' height='52' rx='8' fill='#fef3c7' stroke='#334155' stroke-width='1.8'/>
<text x='240' y='395.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>XC Xc</text>
<text x='240' y='428' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>carrier daughter</text>
<rect x='304' y='364' width='112' height='52' rx='8' fill='#fee2e2' stroke='#334155' stroke-width='1.8'/>
<text x='360' y='395.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Xc Y</text>
<text x='360' y='428' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>COLOUR-BLIND son</text>
<text x='300' y='508' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1 of 4 children (all sons) affected = 25%</text>
<rect x='560' y='240' width='340' height='240' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='730' y='317.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why sons suffer more:</text>
<text x='730' y='336.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>sons get their only X from mother —</text>
<text x='730' y='355.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>one recessive allele shows.</text>
<text x='730' y='374.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Daughters need BOTH X's faulty.</text>
<text x='730' y='393.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Affected father → ALL daughters carriers,</text>
<text x='730' y='412.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>NEVER his sons (Y goes to sons).</text>
<text x='480' y='570' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>XC = normal vision allele · Xc = recessive colour-blind allele · Y carries no counterpart</text>
</svg>
