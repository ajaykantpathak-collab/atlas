<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Nuclear Power Station: From Fission to Grid</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Heat from controlled fission → steam → turbine → electricity</text>
<rect x='80' y='180' width='250' height='170' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='205' y='241.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1. REACTOR</text>
<text x='205' y='260.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>fuel: enriched uranium; fission</text>
<text x='205' y='279.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>releases heat; control rods</text>
<text x='205' y='298.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>absorb neutrons to set the rate</text>
<rect x='400' y='180' width='240' height='170' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='520' y='241.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2. STEAM GENERATOR</text>
<text x='520' y='260.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>reactor heat boils water</text>
<text x='520' y='279.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(pressurised loop keeps</text>
<text x='520' y='298.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>radioactivity inside)</text>
<rect x='700' y='180' width='210' height='170' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='805' y='241.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3. TURBINE +</text>
<text x='805' y='260.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ALTERNATOR</text>
<text x='805' y='279.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>steam spins blades →</text>
<text x='805' y='298.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>generator makes AC</text>
<line x1='330' y1='260' x2='387' y2='260' stroke='#334155' stroke-width='3'/>
<polygon points='396,260 387,255.5 387,264.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='344.6' y='240' width='36.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='363' y='254' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>heat</text>
<line x1='640' y1='260' x2='687' y2='260' stroke='#334155' stroke-width='3'/>
<polygon points='696,260 687,255.5 687,264.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='646' y='240' width='44' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='668' y='254' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>steam</text>
<line x1='805' y1='354' x2='805' y2='421' stroke='#334155' stroke-width='3'/>
<polygon points='805,430 809.5,421 800.5,421' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='690' y='435' width='230' height='50' rx='25' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='805' y='464.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>electricity → grid</text>
<rect x='400' y='420' width='240' height='100' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='520' y='456.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>4. CONDENSER</text>
<text x='520' y='474.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>spent steam cooled back</text>
<text x='520' y='493.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>to water and recycled</text>
<line x1='700' y1='330' x2='660' y2='400' stroke='#7c3aed' stroke-width='2.4' fill='none'/>
<line x1='660' y1='400' x2='648.235' y2='422.059' stroke='#7c3aed' stroke-width='2.4'/>
<polygon points='644,430 652.206,424.176 644.265,419.941' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<rect x='80' y='420' width='250' height='100' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='205' y='446.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>5. COOLING TOWERS</text>
<text x='205' y='465.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>waste heat to air — the</text>
<text x='205' y='483.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>famous white clouds are</text>
<text x='205' y='502.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>just steam</text>
<text x='480' y='575' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>India's reactors: Tarapur, Rawatbhata, Kalpakkam, Kaiga, Narora, Kakrapar (NPCIL)</text>
<text x='480' y='607' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Pros: tiny fuel, no CO2 at stack · Cons: radioactive waste storage, high capital cost, accident risk</text>
<text x='480' y='639' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>India's three-stage plan: PHWR → FBRs (Kalpakkam prototype) → thorium reactors (vast thorium reserves)</text>
</svg>
