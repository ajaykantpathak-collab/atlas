<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>PAN · LAN · MAN · WAN</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>network types by geographical span</text>
<rect x='120' y='110' width='90' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/>
<text x='165' y='143' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>PAN</text>
<text x='165' y='167' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Personal Area Network</text>
<text x='220' y='154' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>a few metres — one person's devices (phone ↔ headset)</text>
<rect x='120' y='200' width='220' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/>
<text x='230' y='233' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>LAN</text>
<text x='230' y='257' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Local Area Network</text>
<text x='350' y='244' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>a room, building or campus — Ethernet / Wi-Fi</text>
<rect x='120' y='290' width='350' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/>
<text x='295' y='323' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>MAN</text>
<text x='295' y='347' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Metropolitan Area Network</text>
<text x='480' y='334' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>a city — cable TV, city Wi-Fi backbones</text>
<rect x='120' y='380' width='480' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/>
<text x='360' y='413' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>WAN</text>
<text x='360' y='437' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Wide Area Network</text>
<text x='610' y='424' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>country / world — leased lines, the Internet</text>
<line x1='100' y1='480' x2='831' y2='480' stroke='#334155' stroke-width='2.2'/>
<polygon points='840,480 831,475.5 831,484.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='365.2' y='460' width='209.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='470' y='474' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>increasing geographical span</text>
</svg>
