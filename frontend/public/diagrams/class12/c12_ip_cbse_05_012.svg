<text x='725' y='300' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>FTP server
(file store)</text>
<line x1='215' y1='240' x2='676' y2='240' stroke='#334155' stroke-width='2.2'/>
<polygon points='685,240 676,235.5 676,244.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='309.2' y='220' width='281.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='450' y='234' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>control connection (commands: port 21)</text>
<line x1='685' y1='300' x2='224' y2='300' stroke='#059669' stroke-width='2.2'/>
<polygon points='215,300 224,304.5 224,295.5' fill='#059669' stroke='#059669' stroke-width='1'/>
