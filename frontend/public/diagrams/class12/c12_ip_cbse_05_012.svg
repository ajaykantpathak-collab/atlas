<text x='450' y='294' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>data connection (file contents: port 20)</text>
<rect x='160' y='420' width='640' height='88' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='459.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Commands: login → navigate directories → upload (PUT) / download (GET)</text>
<text x='480' y='479.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Anonymous FTP allows public downloads without an account</text>
