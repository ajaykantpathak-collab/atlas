<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>IPv6 Address Structure</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>128 bits — eight groups of four hexadecimal digits, separated by colons</text>
<rect x='92' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='134' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2001</text>
<text x='180' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='134' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>1–16</text>
<rect x='184' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='226' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0db8</text>
<text x='272' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='226' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>17–16</text>
<rect x='276' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='318' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0000</text>
<text x='364' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='318' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>33–16</text>
<rect x='368' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='410' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>130f</text>
<text x='456' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='410' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>49–16</text>
<rect x='460' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='502' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0000</text>
<text x='548' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='502' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>65–16</text>
<rect x='552' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='594' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0000</text>
<text x='640' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='594' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>81–16</text>
<rect x='644' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='686' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>09c0</text>
<text x='732' y='184' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>:</text>
<text x='686' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>97–16</text>
<rect x='736' y='150' width='84' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='778' y='184.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>876a</text>
<text x='778' y='224' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>113–16</text>
<text x='480' y='268' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>16 bits per group × 8 groups = 128 bits</text>
<rect x='150' y='300' width='660' height='64' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='338.65' font-size='19' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2001:db8:0:130f::9c0:876a</text>
<text x='480' y='392' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Leading zeros of a group may be dropped, and one run of all-zero groups</text>
<text x='480' y='414' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>may be replaced by a double colon (::) — read as 'fill with zero groups'</text>
<text x='480' y='470' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Hexadecimal digits: 0–9 and A–F (one hex digit = 4 binary bits)</text>
</svg>
