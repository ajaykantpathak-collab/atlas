<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Transcription: DNA → mRNA</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>RNA polymerase reads the template strand 3'→5', builds RNA 5'→3'</text>
<rect x='100' y='200' width='400' height='26' rx='6' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
<text x='112' y='218' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>coding (sense) strand 5'→3'</text>
<rect x='100' y='282' width='400' height='26' rx='6' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/>
<text x='112' y='300' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>template (antisense) strand 3'→5'</text>
<line x1='140' y1='226' x2='140' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='184' y1='226' x2='184' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='228' y1='226' x2='228' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='272' y1='226' x2='272' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='316' y1='226' x2='316' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='360' y1='226' x2='360' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='404' y1='226' x2='404' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='448' y1='226' x2='448' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<line x1='492' y1='226' x2='492' y2='282' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='3,3'/>
<text x='300' y='340' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>A–T · G–C base pairs hold the duplex together</text>
<rect x='400' y='240' width='130' height='118' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='465' y='284.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>RNA</text>
<text x='465' y='304.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>poly-</text>
<text x='465' y='324.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>merase</text>
<line x1='530' y1='246' x2='601' y2='246' stroke='#059669' stroke-width='2.8'/>
<polygon points='610,246 601,241.5 601,250.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='530' y='222' width='80' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='570' y='236' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>mRNA 5'→3'</text>
<rect x='610' y='232' width='210' height='28' rx='6' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='715' y='285' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>new RNA strand, complementary</text>
<text x='715' y='303' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>to the template, U in place of T</text>
<rect x='100' y='380' width='330' height='160' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='265' y='426.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Base rules while copying:</text>
<text x='265' y='445.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>template A → RNA U</text>
<text x='265' y='464.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>template T → RNA A</text>
<text x='265' y='483.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>template G → RNA C</text>
<text x='265' y='502.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>template C → RNA G</text>
<rect x='480' y='380' width='380' height='70' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='670' y='410.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Only ONE DNA strand is copied — copying both</text>
<text x='670' y='429.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>would give opposite, useless RNAs</text>
<rect x='100' y='566' width='250' height='54' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='225' y='588.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Promoter (start signal)</text>
<text x='225' y='606.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>polymerase binds here first</text>
<line x1='356' y1='592' x2='371' y2='592' stroke='#334155' stroke-width='2.2'/>
<polygon points='380,592 371,587.5 371,596.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='384' y='566' width='250' height='54' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='509' y='588.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Terminator (stop signal)</text>
<text x='509' y='606.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>polymerase falls off, RNA freed</text>
<rect x='660' y='566' width='240' height='54' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='780' y='588.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>In eukaryotes:</text>
<text x='780' y='606.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>happens in the nucleus</text>
</svg>
