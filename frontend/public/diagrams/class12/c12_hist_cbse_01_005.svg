<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Mohenjodaro: Citadel and Lower Town</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Planned dual-sector layout on the grid — one of the earliest urban plans</text>
<rect x='120' y='150' width='300' height='240' rx='8' fill='#fef3c7' stroke='#b45309' stroke-width='2.6'/>
<text x='270' y='180' font-size='14' fill='#92400e' text-anchor='middle' font-weight='700' font-style='normal'>CITADEL (west, elevated)</text>
<rect x='150' y='200' width='110' height='80' rx='8' fill='#fde68a' stroke='#b45309' stroke-width='1.8'/>
<text x='205' y='245' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Great Bath</text>
<rect x='290' y='200' width='110' height='80' rx='8' fill='#fde68a' stroke='#b45309' stroke-width='1.8'/>
<text x='345' y='242' font-size='11.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>warehouse +</text>
<text x='345' y='258' font-size='11.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>granary</text>
<text x='270' y='315' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>rulers / elite; public buildings</text>
<rect x='470' y='150' width='370' height='240' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='2.6'/>
<text x='655' y='180' font-size='14' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>LOWER TOWN (east)</text>
<line x1='490' y1='205' x2='820' y2='205' stroke='#6b7280' stroke-width='2.2'/>
<line x1='490' y1='260' x2='820' y2='260' stroke='#6b7280' stroke-width='2.2'/>
<line x1='490' y1='315' x2='820' y2='315' stroke='#6b7280' stroke-width='2.2'/>
<line x1='540' y1='195' x2='540' y2='370' stroke='#6b7280' stroke-width='2.2'/>
<line x1='620' y1='195' x2='620' y2='370' stroke='#6b7280' stroke-width='2.2'/>
<line x1='700' y1='195' x2='700' y2='370' stroke='#6b7280' stroke-width='2.2'/>
<line x1='780' y1='195' x2='780' y2='370' stroke='#6b7280' stroke-width='2.2'/>
<text x='655' y='375' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>grid streets, residential blocks, wells and drains in every house</text>
<rect x='100' y='130' width='760' height='20' rx='8' fill='#9ca3af' stroke='#6b7280' stroke-width='1.6'/>
<text x='480' y='120' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>fortification wall</text>
<path d='M 890 140 Q 860 300 890 460' fill='none' stroke='#2563eb' stroke-width='16' stroke-opacity='0.5'/>
<text x='905' y='300' font-size='12.5' fill='#2563eb' text-anchor='start' font-weight='600' font-style='normal'>Indus</text>
<rect x='120' y='430' width='720' height='110' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='471.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Covered drains ran along the streets; every house connected to them — sanitation as city</text>
<text x='480' y='489.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>infrastructure. Standardised bricks (1:2:4) everywhere = central planning without visible palaces or</text>
<text x='480' y='508.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>weapons — a puzzle archaeologists still debate</text>
<text x='480' y='580' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Settlements followed a GRID: streets at right angles, north-south and east-west</text>
<text x='480' y='612' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The citadel's height came from solid platforms of mud brick — built UP deliberately</text>
<text x='480' y='644' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Great Bath: watertight tank, steps on sides — likely ritual bathing on a grand scale</text>
</svg>
