<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Boolean Laws — Commutative · Associative · Distributive</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Rearranging operands or factoring never changes the output</text>
<rect x='120' y='120' width='200' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='220' y='162.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Commutative</text>
<text x='350' y='151' font-size='16.5' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A + B = B + A      A · B = B · A</text>
<text x='350' y='177' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>order of operands does not matter</text>
<rect x='120' y='250' width='200' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='220' y='292.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Associative</text>
<text x='350' y='281' font-size='16.5' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A + (B + C) = (A + B) + C</text>
<text x='350' y='307' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>grouping does not matter</text>
<rect x='120' y='380' width='200' height='74' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='220' y='422.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Distributive</text>
<text x='350' y='411' font-size='16.5' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A · (B + C) = A·B + A·C   and   A + (B · C) = (A + B) · (A + C)</text>
<text x='350' y='437' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>expansion and factoring</text>
<rect x='150' y='490' width='660' height='66' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='528.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Every law can be proved by writing the truth table for both sides — columns match</text>
</svg>
