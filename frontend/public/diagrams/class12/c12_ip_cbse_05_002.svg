<text x='480' y='520' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Packets may take different paths and arrive out of order — sequence numbers put</text>
<text x='480' y='542' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>them back together; lost packets are retransmitted (TCP)</text>
