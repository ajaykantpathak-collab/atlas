<text x='240' y='145' font-size='12.5' fill='#2563eb' text-anchor='middle' font-weight='600' font-style='normal'>P1</text>
<rect x='210' y='168' width='60' height='24' rx='4' fill='white' stroke='#d97706' stroke-width='2'/>
<text x='240' y='185' font-size='12.5' fill='#d97706' text-anchor='middle' font-weight='600' font-style='normal'>P2</text>
<rect x='210' y='208' width='60' height='24' rx='4' fill='white' stroke='#7c3aed' stroke-width='2'/>
<text x='240' y='225' font-size='12.5' fill='#7c3aed' text-anchor='middle' font-weight='600' font-style='normal'>P3</text>
