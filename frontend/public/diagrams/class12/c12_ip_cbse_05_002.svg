<line x1='150' y1='268' x2='210' y2='200' stroke='#334155' stroke-width='1.8'/>
<line x1='150' y1='275' x2='210' y2='300' stroke='#334155' stroke-width='1.8'/>
<line x1='270' y1='152' x2='383' y2='170' stroke='#334155' stroke-width='1.8'/>
