<text x='415' y='305' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>R2</text>
<circle cx='400' cy='430' r='17' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/>
<text x='400' y='435' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>R3</text>
<circle cx='600' cy='220' r='17' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/>
<text x='600' y='225' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>R4</text>
