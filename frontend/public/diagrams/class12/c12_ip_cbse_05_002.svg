<rect x='816.4' y='308.4' width='19.8' height='9.9' rx='8' fill='#6b7280' stroke='none' stroke-width='1.6'/>
<rect x='803.2' y='318.3' width='46.2' height='6.6' rx='2' fill='#334155' stroke='none' stroke-width='1.6'/>
<text x='826.3' y='341.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Receiver</text>
