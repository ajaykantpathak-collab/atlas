<rect x='300' y='250' width='500' height='130' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='550' y='289.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>F = A'·B'·C + A'·B·C + A·B·C</text>
<text x='550' y='310.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>each term is a MINTERM:</text>
<text x='550' y='331.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>every variable appears exactly once,</text>
<text x='550' y='352.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>complemented (0) or true (1)</text>
