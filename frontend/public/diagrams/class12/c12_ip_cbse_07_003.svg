<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Malware — Types and Entry Points</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>how malicious software spreads and what it does</text>
<rect x='130' y='104' width='300' height='72' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='280' y='145.775' font-size='16.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Antivirus / anti-malware</text>
<text x='460' y='147' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>scan files, quarantine threats, keep definitions updated</text>
<rect x='130' y='188' width='300' height='72' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='280' y='229.775' font-size='16.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>OS &amp; app updates</text>
<text x='460' y='231' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>patches close the holes malware exploits</text>
<rect x='130' y='272' width='300' height='72' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='280' y='313.775' font-size='16.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Careful email habits</text>
<text x='460' y='315' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>never open unexpected attachments or links</text>
<rect x='130' y='356' width='300' height='72' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='280' y='397.775' font-size='16.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Official download sources</text>
<text x='460' y='399' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>avoid pirated software and cracked installers</text>
<rect x='130' y='440' width='300' height='72' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='280' y='481.775' font-size='16.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Regular backups</text>
<text x='460' y='483' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>offline copies defeat ransomware</text>
</svg>
