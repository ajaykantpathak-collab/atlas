<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Bt Cotton: From Crystal Gene to Dead Bollworm</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>How a soil bacterium's protein becomes a plant's shield</text>
<rect x='150' y='120' width='420' height='76' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='360' y='153.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Bacillus thuringiensis</text>
<text x='360' y='173.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>soil bacterium carries cry genes making protein crystals</text>
<line x1='360' y1='196' x2='360' y2='215' stroke='#334155' stroke-width='3'/>
<polygon points='360,224 364.5,215 355.5,215' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='224' width='420' height='76' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='360' y='257.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>cry gene → plant</text>
<text x='360' y='277.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>gene transferred into cotton genome (insect-resistant transgenic crop)</text>
<line x1='360' y1='300' x2='360' y2='319' stroke='#334155' stroke-width='3'/>
<polygon points='360,328 364.5,319 355.5,319' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='328' width='420' height='76' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='360' y='361.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>inactive protoxin in plant</text>
<text x='360' y='381.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>crystal protein harmless UNTIL eaten — no toxin in soil/nectar</text>
<line x1='360' y1='404' x2='360' y2='423' stroke='#334155' stroke-width='3'/>
<polygon points='360,432 364.5,423 355.5,423' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='432' width='420' height='76' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='360' y='465.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>insect gut: protoxin → toxin</text>
<text x='360' y='485.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>alkaline gut juice dissolves crystal; epithelial cells activated</text>
<line x1='360' y1='508' x2='360' y2='527' stroke='#334155' stroke-width='3'/>
<polygon points='360,536 364.5,527 355.5,527' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='536' width='420' height='76' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='360' y='569.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>gut cells swell, lyse</text>
<text x='360' y='589.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>larva stops feeding and dies — specific to insect alkaline guts</text>
<rect x='640' y='150' width='280' height='120' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='780' y='177.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why selective?</text>
<text x='780' y='196.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>human gut is ACIDIC — the</text>
<text x='780' y='214.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>crystal never activates; the</text>
<text x='780' y='233.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>toxin binds insect-gut-</text>
<text x='780' y='251.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>specific receptors only</text>
<rect x='640' y='320' width='280' height='110' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='780' y='351.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Resistance management:</text>
<text x='780' y='370.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>refuges of non-Bt cotton keep</text>
<text x='780' y='388.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>susceptible insects alive to</text>
<text x='780' y='407.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>dilute resistant mutations</text>
<text x='480' y='632' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Bt = Bacillus thuringiensis · cry genes named by insect target (cryIAc → bollworms)</text>
</svg>
