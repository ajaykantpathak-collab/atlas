<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Three Levels of Biodiversity</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Variety at every scale — genes, species, ecosystems</text>
<rect x='60' y='130' width='270' height='60' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='195' y='155.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>GENETIC diversity</text>
<text x='195' y='174.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>variation WITHIN one species</text>
<rect x='60' y='210' width='270' height='190' rx='8' fill='white' stroke='#7c3aed' stroke-width='1.8'/>
<text x='195' y='283.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>e.g. 1000+ rice landraces in India;</text>
<text x='195' y='300.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Rauwolfia strains differ in</text>
<text x='195' y='318.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>reserpine content; breeders use this</text>
<text x='195' y='335.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>variation to fight new diseases</text>
<rect x='360' y='130' width='270' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='495' y='155.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SPECIES diversity</text>
<text x='495' y='174.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>variety OF species in a region</text>
<rect x='360' y='210' width='270' height='190' rx='8' fill='white' stroke='#2563eb' stroke-width='1.8'/>
<text x='495' y='274.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Western Ghats: amphibian hotspot;</text>
<text x='495' y='291.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>more species = more ecological</text>
<text x='495' y='309.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>roles filled = more stable community;</text>
<text x='495' y='326.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>India is one of 17 mega-diverse</text>
<text x='495' y='344.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>countries</text>
<rect x='660' y='130' width='270' height='60' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='795' y='155.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>ECOSYSTEM diversity</text>
<text x='795' y='174.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>variety OF habitats / communities</text>
<rect x='660' y='210' width='270' height='190' rx='8' fill='white' stroke='#059669' stroke-width='1.8'/>
<text x='795' y='283.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>India: deserts, rain forests,</text>
<text x='795' y='300.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>mangroves, coral reefs, alpine</text>
<text x='795' y='318.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>meadows — each community plus</text>
<text x='795' y='335.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>its physical environment</text>
<text x='480' y='460' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why it matters: loss is irreversible at every level — an extinct species takes its unique genes forever</text>
<text x='480' y='510' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Conservation maps to the levels: gene banks / tissue culture (genetic), sanctuaries &amp; biosphere reserves</text>
<text x='480' y='536' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(species + ecosystem), seed and pollen banks, in-vitro storage</text>
<text x='480' y='600' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Remember the gradient: biodiversity ↑ from poles → equator (tropics hold the bulk of it)</text>
</svg>
