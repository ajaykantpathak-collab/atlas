<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Network Security Goals</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Protect infrastructure and data from unauthorised access, misuse and denial</text>
<rect x='370' y='120' width='220' height='84' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='480' y='156.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Confidentiality</text>
<text x='480' y='178.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>only authorised eyes can read</text>
<rect x='190' y='330' width='220' height='84' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='300' y='366.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Integrity</text>
<text x='300' y='388.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>data is not altered undetected</text>
<rect x='550' y='330' width='220' height='84' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='660' y='366.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Availability</text>
<text x='660' y='388.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>services stay reachable when needed</text>
<line x1='480' y1='204' x2='300' y2='330' stroke='#334155' stroke-width='1.8'/>
<line x1='480' y1='204' x2='660' y2='330' stroke='#334155' stroke-width='1.8'/>
<line x1='300' y1='330' x2='660' y2='330' stroke='#334155' stroke-width='1.8'/>
<rect x='280' y='480' width='400' height='60' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='515.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Threats: eavesdropping · tampering · DoS · malware · phishing</text>
</svg>
