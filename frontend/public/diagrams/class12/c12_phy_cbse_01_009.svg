<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Field of an Infinite Line Charge</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>E = 2kλ/r = λ/(2πε₀ r) — falls as 1/r, not 1/r²</text>
<line x1='280' y1='140' x2='280' y2='520' stroke='#dc2626' stroke-width='5'/>
<text x='302' y='165' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='205' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='245' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='285' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='325' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='365' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='405' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='445' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='302' y='485' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>+</text>
<text x='280' y='120' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>charged wire, λ per metre</text>
<ellipse cx='480' cy='330' rx='40' ry='190' fill='none' stroke='#2563eb' stroke-width='2' stroke-dasharray='8,6'/>
<text x='480' y='555' font-size='12.5' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>coaxial Gaussian cylinder</text>
<line x1='525' y1='330' x2='591' y2='330' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='600,330 591,325.5 591,334.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='480' y1='520' x2='471' y2='520' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='480,520 471,515.5 471,524.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='435' y1='330' x2='369' y2='330' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='360,330 369,334.5 369,325.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='480' y1='140' x2='471' y2='140' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='480,140 471,135.5 471,144.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='610' y='200' font-size='13' fill='#7c3aed' text-anchor='start' font-weight='normal' font-style='normal'>E points radially OUT (λ &gt; 0)</text>
<text x='610' y='224' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>same magnitude all around</text>
<line x1='280' y1='330' x2='440' y2='330' stroke='#6b7280' stroke-width='1.2' stroke-dasharray='3,3'/>
<text x='360' y='318' font-size='14' fill='#6b7280' text-anchor='start' font-weight='700' font-style='normal'>r</text>
<rect x='640' y='300' width='290' height='160' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='785' y='347.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why 1/r?:</text>
<text x='785' y='366.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>field spreads over a CYLINDER</text>
<text x='785' y='384.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(area 2πrL) not a sphere —</text>
<text x='785' y='403.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>area grows slower, so field</text>
<text x='785' y='421.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>weakens slower</text>
<text x='480' y='600' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Gauss + symmetry: E·(2πrL) = λL/ε₀ → E = λ/(2πε₀r) in one line</text>
<text x='480' y='630' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>'Infinite' means the ends are far compared to r — real long wires obey this near their middle</text>
</svg>
