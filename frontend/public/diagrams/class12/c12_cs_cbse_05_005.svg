<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>SQL WHERE — Row Filtering</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The predicate is tested for every row; only True rows survive</text>
<rect x='80' y='150' width='220' height='230' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='190' y='220.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>students</text>
<text x='190' y='240.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>id name marks</text>
<text x='190' y='260.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 Asha 88</text>
<text x='190' y='280.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>2 Rahim 45</text>
<text x='190' y='300.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>3 Meera 72</text>
<text x='190' y='320.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>4 John 33</text>
<line x1='300' y1='265' x2='391' y2='265' stroke='#334155' stroke-width='2.2'/>
<polygon points='400,265 391,260.5 391,269.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='284.8' y='245' width='130.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='350' y='259' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>WHERE marks &gt;= 50</text>
<path d='M 485 210 L 570 265 L 485 320 L 400 265 Z' fill='#ede9fe' stroke='#334155' stroke-width='2'/>
<text x='485' y='270.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>marks &gt;= 50 ?</text>
<line x1='570' y1='240' x2='651.214' y2='221.952' stroke='#059669' stroke-width='2.2'/>
<polygon points='660,220 650.238,217.56 652.191,226.345' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='557' y='210' width='116' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='615' y='224' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>True — keep row</text>
<line x1='570' y1='292' x2='651.175' y2='308.235' stroke='#dc2626' stroke-width='2.2'/>
<polygon points='660,310 652.057,303.822 650.292,312.648' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='557' y='281' width='116' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='615' y='295' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>False — discard</text>
<rect x='660' y='150' width='220' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='770' y='200.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>result</text>
<text x='770' y='220.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 Asha 88</text>
<text x='770' y='240.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>3 Meera 72</text>
<rect x='660' y='300' width='220' height='70' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='770' y='330.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2 Rahim 45</text>
<text x='770' y='349.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>4 John 33</text>
<text x='480' y='430' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>WHERE can combine conditions with AND / OR / NOT and IN / BETWEEN / LIKE</text>
</svg>
