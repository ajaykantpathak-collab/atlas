<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Human Evolution: A Branching Bush</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Not a ladder — overlapping species, one African origin</text>
<line x1='120' y1='470' x2='860' y2='470' stroke='#334155' stroke-width='2.6'/>
<line x1='860' y1='470' x2='863' y2='470' stroke='#334155' stroke-width='2.6'/>
<polygon points='872,470 863,465.5 863,474.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='845' y='492' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>time →</text>
<circle cx='170' cy='470' r='9' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='170' y='383' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Dryopithecus /</text>
<text x='170' y='400' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Ramapithecus</text>
<text x='170' y='512' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ape ancestors, ~15 mya</text>
<circle cx='320' cy='470' r='9' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='320' y='400' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Australopithecus</text>
<text x='320' y='512' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>bipedal, ~2–3 mya,</text>
<text x='320' y='527' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>~400 cc brain</text>
<circle cx='490' cy='470' r='9' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='490' y='400' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Homo habilis</text>
<text x='490' y='512' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tool maker, ~2 mya</text>
<circle cx='640' cy='470' r='9' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='640' y='400' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Homo erectus</text>
<text x='640' y='512' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>fire + bigger brain,</text>
<text x='640' y='527' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>~1.5 mya, left Africa</text>
<circle cx='800' cy='470' r='9' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='800' y='400' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Homo sapiens</text>
<text x='800' y='512' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>≈ 100,000 years ago,</text>
<text x='800' y='527' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>~1350 cc brain</text>
<line x1='170' y1='448' x2='320' y2='444' stroke='#7c3aed' stroke-width='2.4' fill='none' stroke-dasharray='7,5'/>
<line x1='320' y1='444' x2='490' y2='438' stroke='#7c3aed' stroke-width='2.4' fill='none' stroke-dasharray='7,5'/>
<line x1='490' y1='438' x2='640' y2='430' stroke='#7c3aed' stroke-width='2.4' fill='none' stroke-dasharray='7,5'/>
<line x1='640' y1='430' x2='791.025' y2='418.673' stroke='#7c3aed' stroke-width='2.4' stroke-dasharray='7,5'/>
<polygon points='800,418 790.689,414.186 791.362,423.161' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='905' y='420' font-size='12.5' fill='#7c3aed' text-anchor='start' font-weight='normal' font-style='normal'>brain</text>
<text x='905' y='436' font-size='12.5' fill='#7c3aed' text-anchor='start' font-weight='normal' font-style='normal'>volume</text>
<rect x='120' y='556' width='350' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='295' y='572.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Key idea: Neanderthal man — close cousin,</text>
<text x='295' y='590.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>lived in east/central Asia, NOT our</text>
<text x='295' y='607.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>direct ancestor</text>
<rect x='500' y='556' width='350' height='60' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='675' y='572.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Key idea: agriculture ~10,000 years ago and</text>
<text x='675' y='590.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>civilisation are a blink next to 15 million</text>
<text x='675' y='607.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>years of primate evolution</text>
<text x='480' y='638' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>All dates approximate; the fossil record shows divergence and co-existence, never a single file</text>
</svg>
