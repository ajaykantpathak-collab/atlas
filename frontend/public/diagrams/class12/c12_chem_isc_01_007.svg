<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Osmotic Pressure (π)</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The push needed to STOP pure solvent flowing into a solution through a semipermeable membrane</text>
<rect x='200' y='200' width='560' height='300' rx='10' fill='none' stroke='#334155' stroke-width='2.6'/>
<rect x='480' y='200' width='12' height='300' rx='8' fill='#d9c9a3' stroke='#334155' stroke-width='1.6'/>
<text x='486' y='530' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>semipermeable membrane (only water passes)</text>
<rect x='212' y='300' width='256' height='188' rx='4' fill='#dbeafe' stroke='none' stroke-width='1.6'/>
<rect x='504' y='300' width='244' height='188' rx='4' fill='#c7dbf7' stroke='none' stroke-width='1.6'/>
<circle cx='652.038' cy='433.686' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='689.943' cy='465.792' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='677.778' cy='462.572' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='521.381' cy='389.5' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='722.538' cy='418.836' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='713.198' cy='333.113' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='618.195' cy='354.452' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='634.627' cy='406.831' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='517.885' cy='349.677' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='576.486' cy='461.615' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='683.46' cy='340.537' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='690.372' cy='337.203' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='650.84' cy='335.272' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<circle cx='515.39' cy='454.425' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.4'/>
<text x='340' y='280' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>pure solvent</text>
<text x='626' y='280' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>solution</text>
<line x1='400' y1='340' x2='531' y2='340' stroke='#2563eb' stroke-width='2.4'/>
<polygon points='540,340 531,335.5 531,344.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<line x1='400' y1='400' x2='531' y2='400' stroke='#2563eb' stroke-width='2.4'/>
<polygon points='540,400 531,395.5 531,404.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<line x1='400' y1='460' x2='531' y2='460' stroke='#2563eb' stroke-width='2.4'/>
<polygon points='540,460 531,455.5 531,464.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='392' y='320' font-size='12.5' fill='#2563eb' text-anchor='start' font-weight='normal' font-style='normal'>net solvent flow →</text>
<rect x='504' y='258' width='244' height='26' rx='4' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<line x1='626' y1='180' x2='626' y2='243' stroke='#dc2626' stroke-width='3'/>
<polygon points='626,252 630.5,243 621.5,243' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='589.6' y='196' width='72.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='626' y='210' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>applied π</text>
<text x='626' y='165' font-size='12.5' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>pressure that just stops the flow = osmotic pressure</text>
<text x='340' y='180' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>π = (n2 R T) / V = c R T</text>
<text x='340' y='204' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>same form as pV = nRT — molarity replaces pressure</text>
<text x='480' y='570' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Colligative: π depends on the NUMBER of solute particles, not their identity — i × c for electrolytes</text>
<text x='480' y='598' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Best colligative property for big molecules (proteins, polymers): measurable even at tiny concentrations</text>
<text x='480' y='626' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Isotonic solutions: equal π — that is why IV fluids are 0.9% saline</text>
</svg>
