<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Sewage Treatment: Screens → Sludge → Microbes</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Physical, then biological, then chemical polishing</text>
<rect x='70' y='150' width='250' height='200' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='195' y='208.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1. PRIMARY — physical</text>
<text x='195' y='226.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='195' y='245.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>bar screens remove large rags;</text>
<text x='195' y='263.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>grit settled in tank;</text>
<text x='195' y='282.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>solids sink as primary sludge;</text>
<text x='195' y='300.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>effluent still has organics</text>
<line x1='320' y1='250' x2='361' y2='250' stroke='#334155' stroke-width='3'/>
<polygon points='370,250 361,245.5 361,254.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='370' y='150' width='250' height='200' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='495' y='208.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2. SECONDARY — biological</text>
<text x='495' y='226.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='495' y='245.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>effluent aeration: aerobic microbes</text>
<text x='495' y='263.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>eat organic matter (BOD falls);</text>
<text x='495' y='282.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>floc settles as activated sludge;</text>
<text x='495' y='300.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>part recycled as inoculum</text>
<line x1='620' y1='250' x2='661' y2='250' stroke='#334155' stroke-width='3'/>
<polygon points='670,250 661,245.5 661,254.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='670' y='150' width='250' height='200' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='795' y='217.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3. ANOXIC / TERTIARY</text>
<text x='795' y='236.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='795' y='254.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>denitrifying bacteria remove nitrates;</text>
<text x='795' y='273.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>phosphate and final polishing;</text>
<text x='795' y='291.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>chlorination where required</text>
<rect x='720' y='400' width='250' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='845' y='425.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>treated water →</text>
<text x='845' y='443.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>released to rivers / reuse</text>
<line x1='820' y1='350' x2='840.702' y2='388.092' stroke='#334155' stroke-width='3'/>
<polygon points='845,396 844.656,385.944 836.749,390.241' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='70' y='400' width='280' height='90' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='210' y='431.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Sludge line (separate):</text>
<text x='210' y='449.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>anaerobic sludge digester →</text>
<text x='210' y='468.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>biogas (methane) + digestate</text>
<line x1='195' y1='350' x2='195' y2='396' stroke='#7c3aed' stroke-width='3' fill='none'/>
<line x1='195' y1='350' x2='195' y2='387' stroke='#7c3aed' stroke-width='3'/>
<polygon points='195,396 199.5,387 190.5,387' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='350' y1='445' x2='488.269' y2='362.607' stroke='#7c3aed' stroke-width='2' stroke-dasharray='6,5'/>
<polygon points='496,358 485.965,358.741 490.572,366.473' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='560' y='490' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>BOD (biochemical oxygen demand) = organic load indicator — treatment drives it DOWN</text>
<text x='560' y='525' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Primary removes solids you can see; secondary removes dissolved organics microbes can eat</text>
<text x='560' y='560' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Methanogens in the digester are the same archaea used for biogas plants in villages</text>
</svg>
