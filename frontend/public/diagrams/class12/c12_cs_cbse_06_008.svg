<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Database Connection Lifecycle</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Explicitly release cursor and connection when finished</text>
<rect x='150' y='100' width='220' height='60' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='260' y='135.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>connect()</text>
<text x='400' y='136' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>open a connection to the DB</text>
<line x1='260' y1='160' x2='260' y2='177' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,186 264.5,177 255.5,177' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='186' width='220' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='260' y='221.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>cursor()</text>
<text x='400' y='222' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>create a cursor object</text>
<line x1='260' y1='246' x2='260' y2='263' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,272 264.5,263 255.5,263' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='272' width='220' height='60' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='260' y='307.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>execute()</text>
<text x='400' y='308' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>run SQL through the cursor</text>
<line x1='260' y1='332' x2='260' y2='349' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,358 264.5,349 255.5,349' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='358' width='220' height='60' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='260' y='393.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>commit()</text>
<text x='400' y='394' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>make changes permanent</text>
<line x1='260' y1='418' x2='260' y2='435' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,444 264.5,435 255.5,435' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='150' y='444' width='220' height='60' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='260' y='479.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>close()</text>
<text x='400' y='480' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>release cursor + connection</text>
<line x1='260' y1='504' x2='260' y2='521' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,530 264.5,521 255.5,521' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='620' y='200' width='240' height='150' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='740' y='259.925' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why close?</text>
<text x='740' y='280.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>connections are limited;</text>
<text x='740' y='300.925' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>leaks exhaust the database</text>
<text x='480' y='540' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>with connection: ... closes automatically — even when errors occur</text>
</svg>
