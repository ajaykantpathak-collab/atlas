<g><ellipse cx='232' cy='161.5' rx='39' ry='23.8' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/></g>
<text x='205' y='170' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SUN</text>
<line x1='205' y1='175' x2='293.293' y2='253.999' stroke='#d97706' stroke-width='3'/>
<polygon points='300,260 296.293,250.645 290.292,257.352' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<rect x='205.3' y='197.5' width='94.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='252.5' y='211.5' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>solar energy</text>
<rect x='185' y='318' width='280' height='112' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='325' y='359.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Producers (T1)</text>
<text x='325' y='379.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='325' y='399.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>grass — traps ~1–5% of sunlight</text>
<line x1='410' y1='318' x2='436.021' y2='288.727' stroke='#dc2626' stroke-width='2' stroke-dasharray='5,4'/>
<polygon points='442,282 432.657,285.737 439.384,291.716' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='465' y='208' width='280' height='112' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='605' y='249.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Herbivores (T2)</text>
<text x='605' y='269.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='605' y='289.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>grasshopper</text>
<line x1='420' y1='340' x2='451.393' y2='268.245' stroke='#334155' stroke-width='3'/>
<polygon points='455,260 447.27,266.442 455.515,270.049' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='690' y1='208' x2='716.021' y2='178.727' stroke='#dc2626' stroke-width='2' stroke-dasharray='5,4'/>
<polygon points='722,172 712.657,175.737 719.384,181.716' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='665' y='103' width='280' height='112' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='805' y='144.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Carnivores (T3)</text>
<text x='805' y='164.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='805' y='184.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>frog → hawk chain ends here</text>
<line x1='700' y1='230' x2='659.63' y2='162.717' stroke='#334155' stroke-width='3'/>
<polygon points='655,155 655.772,165.033 663.489,160.402' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='890' y1='103' x2='916.021' y2='73.7267' stroke='#dc2626' stroke-width='2' stroke-dasharray='5,4'/>
