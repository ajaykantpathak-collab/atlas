<text x='480' y='555' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>heat lost at every step (respiration)</text>
<rect x='470' y='405' width='189.2' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='564.6' y='421' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>~10% of energy passes on</text>
<rect x='745' y='300' width='116.2' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='803.1' y='316' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>~10% passes on</text>
<line x1='320' y1='450' x2='320' y2='491' stroke='#6b7280' stroke-width='2'/>
<polygon points='320,500 324.5,491 315.5,491' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<text x='480' y='525' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>decomposers recycle MATTER back — but energy never returns</text>
<text x='480' y='585' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Lindeman's 10% law: food chains rarely exceed 4–5 trophic levels because the energy runs out</text>
<text x='480' y='615' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>That is why a forest can feed only a few hawks but millions of insects</text>
</svg>
