<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Equipotential Surfaces</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Same potential everywhere on the surface; field always crosses at 90°</text>
<circle cx='400' cy='300' r='70' fill='none' stroke='#059669' stroke-width='2'/>
<text x='444' y='292' font-size='12' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>V1</text>
<circle cx='400' cy='300' r='120' fill='none' stroke='#059669' stroke-width='2'/>
<text x='494' y='292' font-size='12' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>V2</text>
<circle cx='400' cy='300' r='175' fill='none' stroke='#059669' stroke-width='2'/>
<text x='549' y='292' font-size='12' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>V3</text>
<circle cx='400' cy='300' r='18' fill='#fee2e2' stroke='#dc2626' stroke-width='2.2'/>
<text x='400' y='305' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>+</text>
<line x1='430' y1='300' x2='586' y2='300' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='595,300 586,295.5 586,304.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='421.213' y1='321.213' x2='531.522' y2='431.522' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='537.886,437.886 534.704,428.34 528.34,434.704' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='400' y1='330' x2='400' y2='486' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='400,495 404.5,486 395.5,486' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='378.787' y1='321.213' x2='268.478' y2='431.522' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='262.114,437.886 271.66,434.704 265.296,428.34' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='370' y1='300' x2='214' y2='300' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='205,300 214,304.5 214,295.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='378.787' y1='278.787' x2='268.478' y2='168.478' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='262.114,162.114 265.296,171.66 271.66,165.296' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='400' y1='270' x2='400' y2='114' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='400,105 395.5,114 404.5,114' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='421.213' y1='278.787' x2='531.522' y2='168.478' stroke='#7c3aed' stroke-width='1.8'/>
<polygon points='537.886,162.114 528.34,165.296 534.704,171.66' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='610' y='110' font-size='13' fill='#7c3aed' text-anchor='start' font-weight='normal' font-style='normal'>field lines ⊥ surfaces</text>
<rect x='660' y='150' width='280' height='170' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='800' y='202.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Properties:</text>
<text x='800' y='221.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>no work to move a charge</text>
<text x='800' y='239.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ALONG a surface (ΔV = 0)</text>
<text x='800' y='258.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>surfaces never touch or cross</text>
<text x='800' y='276.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>closely spaced = STRONG field</text>
<rect x='660' y='350' width='280' height='130' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='800' y='391.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>E from V:</text>
<text x='800' y='410.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>E = −(slope of V)</text>
<text x='800' y='428.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>= −dV/dr</text>
<text x='800' y='447.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>field points 'downhill'</text>
<text x='480' y='545' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Why perpendicular? Any component of E along the surface would push charges along it — contradicting equilibrium</text>
<text x='480' y='577' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Conductor surface is always equipotential — that is why field meets it at 90°</text>
<text x='480' y='609' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Analogy: contour lines on a map — walking along a line takes no effort; crossing lines climbs</text>
<text x='480' y='639' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Work between two surfaces: W = q(V1 − V2) — path-independent</text>
</svg>
