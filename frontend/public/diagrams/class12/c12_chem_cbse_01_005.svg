<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Raoult's Law in a Closed Flask</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Each volatile liquid contributes vapour pressure ∝ its mole fraction</text>
<rect x='300' y='220' width='360' height='280' rx='16' fill='none' stroke='#334155' stroke-width='2.6'/>
<rect x='312' y='380' width='336' height='108' rx='8' fill='#dbeafe' stroke='none' stroke-width='1.6'/>
<text x='480' y='440' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>solution: A + B</text>
<circle cx='401.389' cy='304.865' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='440.987' cy='311.431' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='517.716' cy='252.208' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='333.95' cy='337.122' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='407.806' cy='270.776' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='628.693' cy='296.729' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='580.938' cy='297.399' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='521.72' cy='261.568' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<circle cx='520.458' cy='340.485' r='7' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.6'/>
<text x='480' y='260' font-size='13' fill='#7c3aed' text-anchor='middle' font-weight='normal' font-style='normal'>vapour phase</text>
<line x1='380' y1='395' x2='380' y2='339' stroke='#6b7280' stroke-width='2' stroke-dasharray='4,3'/>
<polygon points='380,330 375.5,339 384.5,339' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<line x1='470' y1='395' x2='470' y2='339' stroke='#6b7280' stroke-width='2' stroke-dasharray='4,3'/>
<polygon points='470,330 465.5,339 474.5,339' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<line x1='560' y1='395' x2='560' y2='339' stroke='#6b7280' stroke-width='2' stroke-dasharray='4,3'/>
<polygon points='560,330 555.5,339 564.5,339' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<text x='480' y='520' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>evaporation ⇌ condensation at equilibrium</text>
<rect x='80' y='150' width='190' height='170' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='175' y='192.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>pA = xA · pA°</text>
<text x='175' y='211.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='175' y='230.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>pA: partial pressure</text>
<text x='175' y='249.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>xA: mole fraction</text>
<text x='175' y='268.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>pA°: pure vapour</text>
<text x='175' y='287.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>pressure</text>
<rect x='690' y='150' width='190' height='170' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='785' y='211.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Total:</text>
<text x='785' y='230.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>p(total) = pA + pB</text>
<text x='785' y='249.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(ideal solution)</text>
<text x='785' y='268.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>= xA·pA° + xB·pB°</text>
<text x='480' y='570' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Ideal-solution picture: A–B interactions ≈ A–A ≈ B–B (e.g. benzene + toluene) → law holds exactly</text>
<text x='480' y='598' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Non-ideal: strong A–B attraction → negative deviation (lower vapour pressure than predicted)</text>
<text x='480' y='626' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Mole-fraction bookkeeping: xA + xB = 1, so the two partial pressures rise and fall in lockstep</text>
</svg>
