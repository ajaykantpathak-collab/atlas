<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Standard Electrode Potential via SHE</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Every electrode is measured against ONE reference: 0.00 V by definition</text>
<rect x='150' y='240' width='180' height='220' rx='12' fill='none' stroke='#334155' stroke-width='2.4'/>
<rect x='160' y='330' width='160' height='120' rx='6' fill='#dbeafe' stroke='none' stroke-width='1.6'/>
<text x='240' y='480' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1 M H+</text>
<rect x='230' y='170' width='14' height='180' rx='8' fill='#6b7280' stroke='#334155' stroke-width='1.6'/>
<text x='237' y='158' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Pt electrode</text>
<circle cx='215' cy='300' r='5' fill='white' stroke='#6b7280' stroke-width='1.4'/>
<circle cx='255' cy='320' r='5' fill='white' stroke='#6b7280' stroke-width='1.4'/>
<circle cx='230' cy='350' r='5' fill='white' stroke='#6b7280' stroke-width='1.4'/>
<text x='155' y='230' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>H2 gas, 1 bar</text>
<text x='155' y='212' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>bubbled in</text>
<rect x='620' y='240' width='180' height='220' rx='12' fill='none' stroke='#334155' stroke-width='2.4'/>
<rect x='630' y='330' width='160' height='120' rx='6' fill='#e0f2fe' stroke='none' stroke-width='1.6'/>
<text x='710' y='480' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1 M Cu²⁺</text>
<rect x='700' y='190' width='16' height='170' rx='8' fill='#b87333' stroke='#7c4a1e' stroke-width='1.6'/>
<text x='708' y='178' font-size='12' fill='#7c4a1e' text-anchor='middle' font-weight='normal' font-style='normal'>Cu strip</text>
<line x1='240' y1='170' x2='240' y2='120' stroke='#334155' stroke-width='2' fill='none'/>
<line x1='240' y1='120' x2='475' y2='120' stroke='#334155' stroke-width='2' fill='none'/>
<line x1='475' y1='120' x2='475' y2='109' stroke='#334155' stroke-width='2'/>
<polygon points='475,100 470.5,109 479.5,109' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='708' y1='190' x2='708' y2='120' stroke='#334155' stroke-width='2' fill='none'/>
<line x1='708' y1='120' x2='504' y2='120' stroke='#334155' stroke-width='2'/>
<polygon points='495,120 504,124.5 504,115.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<circle cx='485' cy='120' r='22' fill='white' stroke='#334155' stroke-width='2'/>
<text x='485' y='126' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>V</text>
<rect x='430' y='460' width='120' height='30' rx='8' fill='#d9c9a3' stroke='#334155' stroke-width='1.6'/>
<text x='490' y='480' font-size='11.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>salt bridge</text>
<text x='485' y='200' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>measured EMF = E°(cell)</text>
<text x='485' y='220' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>E°(SHE) ≡ 0.00 V → voltmeter reads E°(Cu)</text>
<rect x='120' y='530' width='360' height='70' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='300' y='560.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cu²⁺/Cu measured: +0.34 V → copper is the</text>
<text x='300' y='578.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>cathode (reduction happens there)</text>
<rect x='520' y='530' width='330' height='70' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='685' y='560.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Zn²⁺/Zn: −0.76 V → zinc is the</text>
<text x='685' y='578.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>anode; more negative = stronger reducer</text>
<text x='480' y='630' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Standard conditions: 1 M solutions, 1 bar gases, 298 K — the electrochemical series is just these numbers, sorted</text>
</svg>
