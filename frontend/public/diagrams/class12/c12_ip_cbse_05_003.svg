<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Anatomy of a URL</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Every web resource has one unique address</text>
<rect x='60' y='170' width='128' height='52' rx='6' fill='white' stroke='#059669' stroke-width='2.4'/>
<text x='124' y='202' font-size='17.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>https://</text>
<line x1='124' y1='222' x2='124' y2='262' stroke='#059669' stroke-width='1.4' stroke-dasharray='3 3'/>
<text x='124' y='282' font-size='12.5' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>scheme (protocol)</text>
<rect x='188' y='170' width='250' height='52' rx='6' fill='white' stroke='#2563eb' stroke-width='2.4'/>
<text x='313' y='202' font-size='17.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>www.example.com</text>
<line x1='313' y1='222' x2='313' y2='262' stroke='#2563eb' stroke-width='1.4' stroke-dasharray='3 3'/>
<text x='313' y='282' font-size='12.5' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>host (server domain name)</text>
<rect x='438' y='170' width='70' height='52' rx='6' fill='white' stroke='#d97706' stroke-width='2.4'/>
<text x='473' y='202' font-size='17.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>:443</text>
<line x1='473' y1='222' x2='473' y2='262' stroke='#d97706' stroke-width='1.4' stroke-dasharray='3 3'/>
<text x='473' y='282' font-size='12.5' fill='#d97706' text-anchor='middle' font-weight='normal' font-style='normal'>port (optional)</text>
<rect x='508' y='170' width='216' height='52' rx='6' fill='white' stroke='#7c3aed' stroke-width='2.4'/>
<text x='616' y='202' font-size='17.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>/learn/physics</text>
<line x1='616' y1='222' x2='616' y2='262' stroke='#7c3aed' stroke-width='1.4' stroke-dasharray='3 3'/>
<text x='616' y='282' font-size='12.5' fill='#7c3aed' text-anchor='middle' font-weight='normal' font-style='normal'>path to resource</text>
<rect x='724' y='170' width='190' height='52' rx='6' fill='white' stroke='#dc2626' stroke-width='2.4'/>
<text x='819' y='202' font-size='17.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>?topic=light</text>
<line x1='819' y1='222' x2='819' y2='262' stroke='#dc2626' stroke-width='1.4' stroke-dasharray='3 3'/>
<text x='819' y='282' font-size='12.5' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>query string (optional)</text>
<rect x='150' y='350' width='660' height='90' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='390.175' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Type the scheme, host and path in order — the browser resolves</text>
<text x='480' y='410.675' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the host name to an IP address via DNS, then requests the path</text>
</svg>
