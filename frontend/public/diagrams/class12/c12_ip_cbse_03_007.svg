<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>MAC Address — the Hardware ID</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>48-bit burned-in address: OUI + NIC serial</text>
<rect x='170' y='140' width='290' height='58' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='315' y='176.7' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>00:1A:2B</text>
<rect x='470' y='140' width='290' height='58' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='615' y='176.7' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3C:4D:5E</text>
<text x='315' y='226' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Organisationally Unique Identifier (OUI)</text>
<text x='315' y='246' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>first 24 bits — identifies the manufacturer</text>
<text x='615' y='226' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>NIC-specific serial (NIC ID)</text>
<text x='615' y='246' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>last 24 bits — unique to this interface</text>
<text x='470' y='300' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>6 octets × 8 bits = 48 bits</text>
<rect x='210' y='330' width='520' height='46' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='470' y='358.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Layer 2 (data-link) address — works inside one local network</text>
<text x='480' y='416' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Written as hex pairs separated by ':' or '-'</text>
</svg>
