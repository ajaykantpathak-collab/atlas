<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Insertion &amp; Deletion in a Linked List</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Only pointers change — elements never move in memory</text>
<text x='120' y='110' font-size='16' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>insert 20 after 10:</text>
<rect x='120' y='130' width='100' height='54' rx='8' fill='white' stroke='#334155' stroke-width='2'/>
<text x='170' y='164' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>10</text>
<rect x='280' y='130' width='100' height='54' rx='8' fill='white' stroke='#334155' stroke-width='2'/>
<text x='330' y='164' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>30</text>
<rect x='440' y='130' width='100' height='54' rx='8' fill='white' stroke='#334155' stroke-width='2'/>
<text x='490' y='164' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>40</text>
<line x1='220' y1='157' x2='271' y2='157' stroke='#334155' stroke-width='2.2'/>
<polygon points='280,157 271,152.5 271,161.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='380' y1='157' x2='431' y2='157' stroke='#334155' stroke-width='2.2'/>
<polygon points='440,157 431,152.5 431,161.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='280' y='220' width='100' height='54' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='330' y='254' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>20</text>
<line x1='170' y1='184' x2='170' y2='247' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='170' y1='247' x2='271' y2='247' stroke='#059669' stroke-width='2.2'/>
<polygon points='280,247 271,242.5 271,251.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<line x1='380' y1='247' x2='410' y2='247' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='410' y1='247' x2='410' y2='193' stroke='#059669' stroke-width='2.2'/>
<polygon points='410,184 405.5,193 414.5,193' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='560' y='247' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>new node points to 30;</text>
<text x='560' y='265' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>10 now points to the new node</text>
<text x='120' y='360' font-size='16' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>delete 30:</text>
<rect x='120' y='380' width='100' height='54' rx='8' fill='white' stroke='#334155' stroke-width='2'/>
<text x='170' y='414' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>10</text>
<rect x='280' y='380' width='100' height='54' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/>
<text x='330' y='414' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>30</text>
<rect x='440' y='380' width='100' height='54' rx='8' fill='white' stroke='#334155' stroke-width='2'/>
<text x='490' y='414' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>40</text>
<line x1='220' y1='430' x2='250' y2='430' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='250' y1='430' x2='250' y2='470' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='250' y1='470' x2='480' y2='470' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='480' y1='470' x2='480' y2='434' stroke='#059669' stroke-width='2.2' fill='none'/>
<line x1='480' y1='434' x2='449' y2='434' stroke='#059669' stroke-width='2.2'/>
<polygon points='440,434 449,438.5 449,429.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='560' y='430' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>predecessor now skips</text>
<text x='560' y='448' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>the deleted node</text>
<text x='120' y='520' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Order matters on insert: link the new node FIRST, then update the predecessor</text>
</svg>
