<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Pickle — Object Serialization</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Turn a live Python object into bytes, and back again</text>
<rect x='80' y='200' width='200' height='80' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='180' y='225.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Python object</text>
<text x='180' y='245.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>{'name': 'Asha',</text>
<text x='180' y='265.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'> 'marks': [88, 92]}</text>
<line x1='280' y1='240' x2='391' y2='240' stroke='#d97706' stroke-width='2.2'/>
<polygon points='400,240 391,235.5 391,244.5' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<rect x='267.6' y='220' width='144.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='340' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>pickle.dump(obj, f)</text>
<rect x='400' y='200' width='180' height='80' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='490' y='235.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>byte stream</text>
<text x='490' y='255.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>in a binary file</text>
<line x1='580' y1='240' x2='691' y2='240' stroke='#059669' stroke-width='2.2'/>
<polygon points='700,240 691,235.5 691,244.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='585.6' y='220' width='108.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='640' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>pickle.load(f)</text>
<rect x='700' y='200' width='180' height='80' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='790' y='235.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Python object</text>
<text x='790' y='255.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>identical copy</text>
<text x='480' y='140' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>serialization (pickling) → bytes</text>
<text x='480' y='330' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>deserialization (unpickling) → object</text>
<rect x='170' y='400' width='620' height='76' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='433.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Open pickle files in 'wb' / 'rb' modes</text>
<text x='480' y='453.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Never unpickle data from an untrusted source — it can execute code</text>
</svg>
