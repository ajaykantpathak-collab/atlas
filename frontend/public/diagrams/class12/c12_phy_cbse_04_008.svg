<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Force Between Parallel Currents</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>F/L = μ₀ I1 I2 / 2πd — same direction: ATTRACT</text>
<circle cx='380' cy='300' r='9' fill='#dc2626' stroke='#334155' stroke-width='1.6'/>
<text x='380' y='255' font-size='15' fill='#dc2626' text-anchor='middle' font-weight='700' font-style='normal'>I1</text>
<circle cx='580' cy='300' r='9' fill='#2563eb' stroke='#334155' stroke-width='1.6'/>
<text x='580' y='255' font-size='15' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>I2</text>
<text x='380' y='345' font-size='12' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>current OUT (⊙)</text>
<text x='580' y='345' font-size='12' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>current IN (⊗)</text>
<line x1='368' y1='220' x2='443' y2='220' stroke='#059669' stroke-width='3'/>
<polygon points='452,220 443,215.5 443,224.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<line x1='592' y1='220' x2='517' y2='220' stroke='#059669' stroke-width='3'/>
<polygon points='508,220 517,224.5 517,215.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='480' y='200' font-size='13.5' fill='#059669' text-anchor='middle' font-weight='600' font-style='normal'>opposite currents REPEL</text>
<text x='480' y='415' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>d apart</text>
<line x1='380' y1='400' x2='580' y2='400' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='3,3'/>
<circle cx='300' cy='560' r='8' fill='#dc2626' stroke='#334155' stroke-width='1.6'/>
<circle cx='430' cy='560' r='8' fill='#dc2626' stroke='#334155' stroke-width='1.6'/>
<line x1='315' y1='530' x2='386' y2='530' stroke='#7c3aed' stroke-width='2.6'/>
<polygon points='395,530 386,525.5 386,534.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='415' y1='530' x2='344' y2='530' stroke='#7c3aed' stroke-width='2.6'/>
<polygon points='335,530 344,534.5 344,525.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='365' y='600' font-size='12.5' fill='#7c3aed' text-anchor='middle' font-weight='600' font-style='normal'>same direction: attract</text>
<rect x='640' y='480' width='300' height='150' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='790' y='531.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Units trick:</text>
<text x='790' y='550.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the ampere is DEFINED by this</text>
<text x='790' y='568.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>force: 1 A each, 1 m apart,</text>
<text x='790' y='587.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 m of wire: F = 2 × 10⁻⁷ N</text>
<text x='480' y='650' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Field of wire 1 at wire 2 (B = μ₀I1/2πd) times its current gives the force — action-reaction pair, equal magnitudes</text>
</svg>
