<polygon points='581.421,158.579 571.875,161.761 578.239,168.125' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<circle cx='740' cy='340' r='22' fill='#fee2e2' stroke='#dc2626' stroke-width='2.2'/>
<text x='740' y='345' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>+q'</text>
<text x='740' y='390' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>outside: lines IN = lines OUT</text>
<line x1='680' y1='310' x2='635' y2='340' stroke='#6b7280' stroke-width='1.6' fill='none'/>
<line x1='680' y1='310' x2='642.488' y2='335.008' stroke='#6b7280' stroke-width='1.6'/>
<polygon points='635,340 644.985,338.752 639.992,331.263' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<line x1='635' y1='360' x2='680' y2='380' stroke='#6b7280' stroke-width='1.6' fill='none'/>
<line x1='635' y1='360' x2='671.776' y2='376.345' stroke='#6b7280' stroke-width='1.6'/>
<polygon points='680,380 673.603,372.233 669.948,380.457' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<rect x='120' y='500' width='400' height='110' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='320' y='531.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Read it twice:</text>
<text x='320' y='550.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>net flux counts only ENCLOSED charge</text>
<text x='320' y='568.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>but the FIELD at the surface is made by ALL</text>
<text x='320' y='587.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>charges (inside + outside)</text>
<rect x='560' y='500' width='320' height='110' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='720' y='531.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Superpower:</text>
<text x='720' y='550.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>symmetry → E constant on the</text>
<text x='720' y='568.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>surface → Φ = E·A → solve E instantly</text>
<text x='720' y='587.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(wire, sheet, sphere)</text>
<text x='480' y='645' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Flux is independent of size and shape — double the sphere and the same total pokes through</text>
</svg>
