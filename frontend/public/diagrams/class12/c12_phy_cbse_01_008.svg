<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Gauss's Law</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Φ through ANY closed surface = q_enclosed / ε₀ — charges OUTSIDE contribute zero net</text>
<circle cx='440' cy='300' r='150' fill='none' stroke='#2563eb' stroke-width='2.4'/>
<circle cx='440' cy='300' r='150' fill='none' stroke='#2563eb' stroke-width='2.4' stroke-dasharray='8,6'/>
<text x='440' y='125' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>Gaussian surface (imaginary, any shape)</text>
<circle cx='440' cy='300' r='26' fill='#fee2e2' stroke='#dc2626' stroke-width='2.2'/>
<text x='440' y='305' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>+q</text>
