<text x='480' y='450' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>random thermal motion + slow drift opposite to E</text>
<line x1='480' y1='200' x2='691' y2='200' stroke='#7c3aed' stroke-width='2.6'/>
<polygon points='700,200 691,195.5 691,204.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<rect x='553.6' y='180' width='72.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='590' y='194' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>E (field)</text>
<text x='480' y='172' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>drift velocity vd ~ 10⁻⁴ m/s (vs thermal ~10⁵ m/s!)</text>
<rect x='120' y='490' width='380' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='310' y='522.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Current:</text>
<text x='310' y='541.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>I = q n A vd</text>
<text x='310' y='559.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>n = free-electron density</text>
<text x='310' y='578.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>A = cross-section area</text>
<text x='310' y='596.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 A = 1 C/s past a point</text>
<rect x='540' y='490' width='320' height='130' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='700' y='522.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why instant light?</text>
<text x='700' y='541.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the electric</text>
<text x='700' y='559.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>field reaches the whole wire</text>
<text x='700' y='578.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>at ~light speed; EVERY</text>
<text x='700' y='596.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>electron starts drifting at once</text>
<text x='480' y='650' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Drift happens because collisions with ions reset the motion every ~10⁻¹⁴ s — a stop-start average creep</text>
</svg>
