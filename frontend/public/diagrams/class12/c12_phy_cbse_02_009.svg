<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>The Parallel-Plate Capacitor</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Two plates, one insulator gap — charge separated, field trapped, energy stored</text>
<rect x='300' y='200' width='20' height='220' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='2.4'/>
<rect x='560' y='200' width='20' height='220' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<text x='310' y='185' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='700' font-style='normal'>+ + + + +</text>
<text x='570' y='185' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>− − − − −</text>
<text x='480' y='235' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Q</text>
<text x='480' y='260' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>+Q on one plate,</text>
<text x='480' y='278' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>−Q on the other</text>
<line x1='340' y1='230' x2='531' y2='230' stroke='#7c3aed' stroke-width='2'/>
<polygon points='540,230 531,225.5 531,234.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='340' y1='268' x2='531' y2='268' stroke='#7c3aed' stroke-width='2'/>
<polygon points='540,268 531,263.5 531,272.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='340' y1='306' x2='531' y2='306' stroke='#7c3aed' stroke-width='2'/>
<polygon points='540,306 531,301.5 531,310.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='340' y1='344' x2='531' y2='344' stroke='#7c3aed' stroke-width='2'/>
<polygon points='540,344 531,339.5 531,348.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='340' y1='382' x2='531' y2='382' stroke='#7c3aed' stroke-width='2'/>
<polygon points='540,382 531,377.5 531,386.5' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='480' y='445' font-size='13' fill='#7c3aed' text-anchor='middle' font-weight='normal' font-style='normal'>uniform field E = σ/ε₀ between the plates</text>
<line x1='290' y1='480' x2='290' y2='540' stroke='#334155' stroke-width='2.2'/>
<line x1='590' y1='480' x2='590' y2='540' stroke='#334155' stroke-width='2.2'/>
<line x1='290' y1='540' x2='290' y2='560' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='290' y1='560' x2='431' y2='560' stroke='#334155' stroke-width='2.2'/>
<polygon points='440,560 431,555.5 431,564.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='590' y1='540' x2='590' y2='560' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='590' y1='560' x2='529' y2='560' stroke='#334155' stroke-width='2.2'/>
<polygon points='520,560 529,564.5 529,555.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='440' y1='540' x2='440' y2='580' stroke='#334155' stroke-width='2.4'/>
<line x1='520' y1='540' x2='520' y2='580' stroke='#334155' stroke-width='2.4'/>
<text x='480' y='545' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>V</text>
<rect x='660' y='200' width='280' height='180' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='800' y='248.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Capacitance:</text>
<text x='800' y='266.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>C = Q / V</text>
<text x='800' y='285.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>C = ε₀ A / d (parallel plate)</text>
<text x='800' y='303.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>farad = coulomb/volt</text>
<text x='800' y='322.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>bigger area or smaller gap</text>
<text x='800' y='340.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ more storage</text>
<text x='400' y='620' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The dielectric (K) between plates multiplies C by K and raises the breakdown voltage</text>
<text x='400' y='648' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Capacitor = charge bucket: it opposes sudden voltage changes (used in every filter and flash lamp)</text>
</svg>
