<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Magnetic Field on the Axis of a Current Loop</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>B = μ₀ N I R² / [2(R² + x²)^(3/2)] — strongest at the centre</text>
<ellipse cx='330' cy='320' rx='40' ry='150' fill='#fef3c7' fill-opacity='0.4' stroke='#d97706' stroke-width='3'/>
<text x='330' y='145' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>current loop (current I)</text>
<line x1='330' y1='320' x2='791' y2='320' stroke='#334155' stroke-width='2.2' stroke-dasharray='2,4'/>
<polygon points='800,320 791,315.5 791,324.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='810' y='325' font-size='13' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>axis, x</text>
<line x1='390' y1='320' x2='390' y2='235.512' stroke='#7c3aed' stroke-width='3'/>
<polygon points='390,235.512 393.894,244.723 386.106,244.723' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='490' y1='320' x2='490' y2='263' stroke='#7c3aed' stroke-width='3'/>
<polygon points='490,263 493.894,272.211 486.106,272.211' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='590' y1='320' x2='590' y2='278.771' stroke='#7c3aed' stroke-width='3'/>
<polygon points='590,278.771 593.894,287.982 586.106,287.982' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='690' y1='320' x2='690' y2='287.82' stroke='#7c3aed' stroke-width='3'/>
<polygon points='690,287.82 693.894,297.03 686.106,297.03' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='770' y1='320' x2='770' y2='292.19' stroke='#7c3aed' stroke-width='3'/>
<polygon points='770,292.19 773.894,301.401 766.106,301.401' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='480' y='130' font-size='12.5' fill='#7c3aed' text-anchor='start' font-weight='normal' font-style='normal'>B points along the axis (right-hand grip)</text>
<text x='350' y='525' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>x = 0 (centre):</text>
<text x='350' y='543' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>B_max = μ₀ N I / 2R</text>
<text x='580' y='525' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>far away (x &gt;&gt; R):</text>
<text x='580' y='543' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>B ≈ μ₀ N I R² / 2x³</text>
<rect x='640' y='400' width='300' height='140' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='790' y='437.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Right-hand grip rule:</text>
<text x='790' y='456.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>curl fingers with the current —</text>
<text x='790' y='474.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>thumb gives B through the loop;</text>
<text x='790' y='493.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>loop acts like a short bar</text>
<text x='790' y='511.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>magnet (magnetic moment NIA)</text>
<text x='480' y='590' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Stack many loops → a solenoid: near-uniform field inside, B = μ₀ n I</text>
<text x='480' y='620' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>This is the physics inside electromagnets, MRI coils and Helmholtz pairs</text>
<text x='480' y='648' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Symmetry: off-axis components cancel, leaving only the axial part — that is why the formula is clean</text>
</svg>
