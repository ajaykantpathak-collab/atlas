<rect x='150' y='420' width='660' height='76' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='453.175' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A web page = hypertext: text plus hyperlinks to other pages</text>
