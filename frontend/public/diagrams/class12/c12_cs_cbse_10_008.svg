<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Text Files vs Binary Files</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Text: human-readable, encoded · Binary: raw bytes, exact</text>
<rect x='100' y='100' width='340' height='56' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='270' y='123.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>TEXT FILE</text>
<text x='270' y='144.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>e.g. .txt, .csv, .py</text>
<text x='110' y='200' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>'A' stored as bytes for UTF-8 code 65</text>
<rect x='110' y='220' width='320' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='270' y='250.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0100 0001  ...  0110 0001</text>
<text x='110' y='310' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>newlines translated (\n ↔ OS convention)</text>
<text x='110' y='336' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>readable in any editor</text>
<rect x='530' y='100' width='340' height='56' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='700' y='123.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>BINARY FILE</text>
<text x='700' y='144.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>e.g. .jpg, .exe, .pickle</text>
<text x='540' y='200' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>int 123456 stored as its exact 4 bytes</text>
<rect x='540' y='220' width='320' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='700' y='250.2' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0000 0000 0000 0001 1110 0010 0100 0000</text>
<text x='540' y='310' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>no encoding, no newline translation</text>
<text x='540' y='336' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>compact + fast, unreadable directly</text>
<text x='480' y='420' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Choose binary when the exact bytes matter (images, serialized objects)</text>
</svg>
