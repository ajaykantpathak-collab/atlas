<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Karnaugh Map (K-Map)</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Minterms arranged so adjacent cells differ in one variable — group 1s to simplify</text>
<rect x='300' y='130' width='330' height='126' rx='8' fill='white' stroke='#334155' stroke-width='1.6'/>
<text x='355' y='151' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'></text>
<text x='465' y='151' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>C=0</text>
<line x1='410' y1='130' x2='410' y2='256' stroke='#6b7280' stroke-width='1'/>
<text x='575' y='151' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>C=1</text>
<line x1='520' y1='130' x2='520' y2='256' stroke='#6b7280' stroke-width='1'/>
<line x1='300' y1='160' x2='630' y2='160' stroke='#334155' stroke-width='1.8'/>
<text x='355' y='180' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>AB=00</text>
<text x='465' y='180' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='575' y='180' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='355' y='204' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>AB=01</text>
<text x='465' y='204' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='575' y='204' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='355' y='228' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>AB=11</text>
<text x='465' y='228' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='575' y='228' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='355' y='252' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>AB=10</text>
<text x='465' y='252' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='575' y='252' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='302' y='159' width='106' height='50' rx='4' fill='none' stroke='#059669' stroke-width='3.4'/>
<rect x='410' y='159' width='110' height='98' rx='4' fill='none' stroke='#d97706' stroke-width='3.4'/>
<rect x='120' y='160' width='94.3' height='22' rx='11' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/>
<text x='167.15' y='176' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>pair → A'C'</text>
<rect x='570' y='170' width='116.2' height='22' rx='11' fill='#fef3c7' stroke='#d97706' stroke-width='1.2'/>
<text x='628.1' y='186' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>group of 4 → C</text>
<text x='480' y='340' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>A group of 2 drops one variable · a group of 4 drops two — larger groups simplify more</text>
<rect x='240' y='380' width='480' height='70' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='480' y='409.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Result:  F = A'C' + C</text>
<text x='480' y='431.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>read each group as a product term, OR them</text>
<text x='480' y='490' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Wrap-around counts as adjacency (map is a torus) — bigger groups simplify more</text>
</svg>
