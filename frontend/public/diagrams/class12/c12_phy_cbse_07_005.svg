<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Series LCR Circuit: The Impedance Triangle</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Z = √(R² + (XL − XC)²) — resistances and reactances combine at right angles</text>
<text x='160' y='130' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>circuit:</text>
<line x1='100' y1='180' x2='420' y2='180' stroke='#334155' stroke-width='2' fill='none'/>
<line x1='420' y1='180' x2='420' y2='251' stroke='#334155' stroke-width='2'/>
<polygon points='420,260 424.5,251 415.5,251' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='140' y1='180' x2='140' y2='148' stroke='#334155' stroke-width='3'/>
<line x1='164' y1='180' x2='164' y2='148' stroke='#334155' stroke-width='3'/>
<text x='152' y='132' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>R</text>
<line x1='240' y1='158' x2='240' y2='202' stroke='#334155' stroke-width='3'/>
<line x1='268' y1='158' x2='268' y2='202' stroke='#334155' stroke-width='3'/>
<text x='254' y='132' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>L</text>
<line x1='330' y1='158' x2='330' y2='202' stroke='#334155' stroke-width='3'/>
<line x1='378' y1='158' x2='378' y2='202' stroke='#334155' stroke-width='3'/>
<text x='354' y='132' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>C</text>
<text x='480' y='130' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>source: V = V₀ sin ωt</text>
<line x1='300' y1='500' x2='620' y2='500' stroke='#059669' stroke-width='3'/>
<polygon points='620,500 610.789,503.894 610.789,496.106' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='634' y='490' font-size='15' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>R</text>
<line x1='620' y1='500' x2='620' y2='330' stroke='#dc2626' stroke-width='3'/>
<polygon points='620,330 623.894,339.211 616.106,339.211' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='634' y='320' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>XL − XC</text>
<line x1='300' y1='500' x2='620' y2='330' stroke='#2563eb' stroke-width='3'/>
<polygon points='620,330 613.693,337.76 610.039,330.882' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='634' y='320' font-size='15' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>Z (impedance)</text>
<text x='390' y='484' font-size='16' fill='#7c3aed' text-anchor='start' font-weight='700' font-style='normal'>φ</text>
<path d='M 370 500 A 70 70 0 0 0 363 470' fill='none' stroke='#7c3aed' stroke-width='2'/>
<rect x='660' y='300' width='280' height='170' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='800' y='352.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Key results:</text>
<text x='800' y='371.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>cos φ = R / Z (power factor)</text>
<text x='800' y='389.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>V and I differ in phase by φ</text>
<text x='800' y='408.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>resonance: XL = XC →</text>
<text x='800' y='426.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Z minimum = R, I maximum</text>
<text x='480' y='580' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Why a triangle? Same current through all; voltages add as phasors — VL and VC are 180° apart, VR in phase with I</text>
<text x='480' y='610' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>XL = ωL grows with frequency; XC = 1/ωC shrinks — they fight, and only their DIFFERENCE matters</text>
<text x='480' y='640' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>At resonance the circuit is purely resistive: radio tuning picks one station out of the air</text>
</svg>
