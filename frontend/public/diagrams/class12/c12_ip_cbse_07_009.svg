<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Data Backup — the 3-2-1 Rule</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Copies of data protect against hardware failure, malware and accidents</text>
<rect x='370' y='100' width='220' height='50' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='480' y='130.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>YOUR DATA</text>
<line x1='480' y1='150' x2='228.4' y2='246.769' stroke='#059669' stroke-width='2.2'/>
<polygon points='220,250 230.016,250.969 226.785,242.569' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='130' y='250' width='180' height='44' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='220' y='277.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Copy 1</text>
<text x='220' y='318' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>primary device</text>
<text x='220' y='334' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(laptop / phone)</text>
<line x1='480' y1='150' x2='480' y2='241' stroke='#059669' stroke-width='2.2'/>
<polygon points='480,250 484.5,241 475.5,241' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='390' y='250' width='180' height='44' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='277.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Copy 2</text>
<text x='480' y='318' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>different media</text>
<text x='480' y='334' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>external drive / NAS</text>
<line x1='480' y1='150' x2='731.6' y2='246.769' stroke='#059669' stroke-width='2.2'/>
<polygon points='740,250 733.215,242.569 729.984,250.969' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='650' y='250' width='180' height='44' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='740' y='277.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Copy 3</text>
<text x='740' y='318' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>offsite / cloud</text>
<text x='740' y='334' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>survives fire &amp; theft</text>
<rect x='190' y='400' width='580' height='84' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='437.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3 copies · 2 different media · 1 offsite</text>
<text x='480' y='458.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Back up regularly — a backup older than your latest work is not a backup</text>
</svg>
