<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Phishing — The Fake Website</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Clone of a real site built to capture what you type</text>
<text x='120' y='114' font-size='15' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>Real URL</text>
<rect x='250' y='92' width='470' height='36' rx='6' fill='white' stroke='#059669' stroke-width='1.6'/>
<text x='485' y='116' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>https://www.bankofindia.co.in/login</text>
<text x='250' y='154' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>padlock + correct domain</text>
<text x='120' y='206' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>Fake URL</text>
<rect x='250' y='184' width='470' height='36' rx='6' fill='white' stroke='#dc2626' stroke-width='1.6'/>
<text x='485' y='208' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>http://bankofindia.secure-verify.ru/login</text>
<text x='250' y='246' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>different domain after the first '.'</text>
<rect x='150' y='300' width='660' height='100' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='345.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Signs of a fake: no HTTPS padlock · misspelled domain · pages that ask</text>
<text x='480' y='365.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>again for OTP/passwords · offers too good to be true</text>
<text x='480' y='450' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Check the DOMAIN itself (just before the first single '/') — not the words around it</text>
</svg>
