<polygon points='630,250 634.5,241 625.5,241' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='210' y='145' font-size='13' fill='#7c3aed' text-anchor='start' font-weight='600' font-style='normal'>uniform E</text>
<line x1='480' y1='390' x2='480' y2='490' stroke='#dc2626' stroke-width='3'/>
<polygon points='480,490 476.106,480.789 483.894,480.789' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='494' y='480' font-size='13' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>normal n̂</text>
<text x='480' y='340' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>θ between E and n̂</text>
<rect x='120' y='545' width='380' height='70' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='310' y='575.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Maximum flux: surface ⊥ field (θ = 0) → Φ = EA</text>
<text x='310' y='593.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Zero flux: surface parallel to field (θ = 90°)</text>
<rect x='540' y='545' width='300' height='70' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='690' y='575.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Units: N m²/C (or V·m)</text>
<text x='690' y='593.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>flux is a SCALAR (signed)</text>
<text x='480' y='645' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Mental model: rain through a window — tilt the window and fewer drops come through</text>
