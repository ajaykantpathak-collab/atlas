<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Electric Flux: Counting Field Lines Through a Surface</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Φ = E·A cosθ — how much field PIERCES the area</text>
<path d='M 300 420 L 560 300 L 660 360 L 400 480 Z' fill='#dbeafe' fill-opacity='0.55' stroke='#2563eb' stroke-width='2.4'/>
<text x='480' y='505' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>area A (loop)</text>
<line x1='260' y1='150' x2='260' y2='231' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='260,240 264.5,231 255.5,231' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='760' y1='150' x2='760' y2='231' stroke='#7c3aed' stroke-width='2.2'/>
