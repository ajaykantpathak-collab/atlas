<polygon points='260,400 264.5,391 255.5,391' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='760' y1='310' x2='760' y2='391' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='760,400 764.5,391 755.5,391' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='330' y1='130' x2='330' y2='241' stroke='#7c3aed' stroke-width='2.2'/>
<polygon points='330,250 334.5,241 325.5,241' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<line x1='480' y1='130' x2='480' y2='241' stroke='#7c3aed' stroke-width='2.2'/>
