<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Network Devices</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Hardware that moves data between computers and networks</text>
<rect x='120' y='100' width='190' height='62' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='215' y='137.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Modem</text>
<text x='340' y='137' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>converts digital ↔ analog signals for the carrier line</text>
<rect x='120' y='182' width='190' height='62' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='215' y='219.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Router</text>
<text x='340' y='219' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>forwards packets between different networks; chooses the best path</text>
<rect x='120' y='264' width='190' height='62' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='215' y='301.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Switch</text>
<text x='340' y='301' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>connects devices inside one LAN; forwards frames by MAC address</text>
<rect x='120' y='346' width='190' height='62' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='215' y='383.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Hub</text>
<text x='340' y='383' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>older device — repeats a signal to every port (no filtering)</text>
<rect x='120' y='428' width='190' height='62' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='215' y='465.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Repeater</text>
<text x='340' y='465' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>regenerates a weakened signal to extend range</text>
<rect x='120' y='510' width='190' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='215' y='547.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Gateway</text>
<text x='340' y='547' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>connects networks using different protocols ('protocol translator')</text>
</svg>
