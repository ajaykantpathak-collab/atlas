<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Cyberbullying — Recognise and Respond</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Repeated, deliberate harm through digital technologies</text>
<rect x='110' y='108' width='230' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='225' y='144.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Harassment</text>
<text x='360' y='145' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>abusive messages, name-calling</text>
<rect x='110' y='182' width='230' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='225' y='218.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Exclusion</text>
<text x='360' y='219' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>deliberately leaving someone out online</text>
<rect x='110' y='256' width='230' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='225' y='292.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Impersonation</text>
<text x='360' y='293' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>fake accounts posing as the victim</text>
<rect x='110' y='330' width='230' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='225' y='366.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Outing / doxxing</text>
<text x='360' y='367' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>sharing private info or photos</text>
<rect x='110' y='404' width='230' height='62' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='225' y='440.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Spreading rumours</text>
<text x='360' y='441' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>false content about someone</text>
<rect x='620' y='120' width='260' height='260' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='750' y='192.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Respond:</text>
<text x='750' y='213.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• do not reply or forward</text>
<text x='750' y='234.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• save the evidence</text>
<text x='750' y='255.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• block the bully</text>
<text x='750' y='276.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• tell a trusted adult</text>
<text x='750' y='297.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• report to the platform</text>
<text x='750' y='318.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>• cybercrime.gov.in</text>
<text x='390' y='500' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>It is the bully who is wrong — asking for help is the strong move</text>
</svg>
