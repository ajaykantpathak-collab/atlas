<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Ethical Hacking — Penetration Test Lifecycle</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Authorised, documented attempts to find weaknesses before criminals do</text>
<rect x='70' y='150' width='150' height='84' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='145' y='197.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1. Reconnaissance</text>
<text x='145' y='258' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gather public info</text>
<text x='145' y='274' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>about the target</text>
<line x1='220' y1='192' x2='239' y2='192' stroke='#334155' stroke-width='2.2'/>
<polygon points='248,192 239,187.5 239,196.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='248' y='150' width='150' height='84' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='323' y='197.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2. Scanning</text>
<text x='323' y='258' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>map systems, ports,</text>
<text x='323' y='274' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>services</text>
<line x1='398' y1='192' x2='417' y2='192' stroke='#334155' stroke-width='2.2'/>
<polygon points='426,192 417,187.5 417,196.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='426' y='150' width='150' height='84' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='501' y='197.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3. Gaining access</text>
<text x='501' y='258' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>try exploits against</text>
<text x='501' y='274' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>known weaknesses</text>
<line x1='576' y1='192' x2='595' y2='192' stroke='#334155' stroke-width='2.2'/>
<polygon points='604,192 595,187.5 595,196.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='604' y='150' width='150' height='84' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='679' y='197.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>4. Maintaining access</text>
<text x='679' y='258' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>measure how deep</text>
<text x='679' y='274' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>a breach could go</text>
<line x1='754' y1='192' x2='773' y2='192' stroke='#334155' stroke-width='2.2'/>
<polygon points='782,192 773,187.5 773,196.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='782' y='150' width='150' height='84' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='857' y='197.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>5. Reporting</text>
<text x='857' y='258' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>document findings; fix</text>
<text x='857' y='274' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>and re-test</text>
<line x1='932' y1='192' x2='951' y2='192' stroke='#334155' stroke-width='2.2'/>
<polygon points='960,192 951,187.5 951,196.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='200' y='330' width='560' height='92' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='371.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Ethical hackers work with written permission (scope agreement),</text>
<text x='480' y='391.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>report every vulnerability responsibly, and cause no damage</text>
<text x='480' y='470' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Same skills as a criminal attacker — the difference is authorisation and intent</text>
</svg>
