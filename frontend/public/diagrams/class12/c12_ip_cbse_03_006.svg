<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>IPv4 Addressing</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>32 bits in dotted-decimal notation</text>
<rect x='130' y='130' width='150' height='64' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='205' y='170.4' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>192</text>
<text x='205' y='214' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Octet 1</text>
<text x='205' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>8 bits</text>
<text x='288' y='172' font-size='30' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>.</text>
<rect x='296' y='130' width='150' height='64' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='371' y='170.4' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>168</text>
<text x='371' y='214' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Octet 2</text>
<text x='371' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>8 bits</text>
<text x='454' y='172' font-size='30' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>.</text>
<rect x='462' y='130' width='150' height='64' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='537' y='170.4' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>10</text>
<text x='537' y='214' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Octet 3</text>
<text x='537' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>8 bits</text>
<text x='620' y='172' font-size='30' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>.</text>
<rect x='628' y='130' width='150' height='64' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='703' y='170.4' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>25</text>
<text x='703' y='214' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Octet 4</text>
<text x='703' y='234' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>8 bits</text>
<rect x='130' y='268' width='630' height='54' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/>
<rect x='130' y='268' width='378' height='54' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.6'/>
<text x='319' y='300' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Network portion</text>
<text x='609' y='300' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Host portion</text>
<text x='480' y='360' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Example: 192.168.10.25 /24 → first 24 bits identify the network, last 8 bits the host</text>
<text x='480' y='420' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Values in each octet range from 0 to 255 (one byte = 8 binary digits)</text>
</svg>
