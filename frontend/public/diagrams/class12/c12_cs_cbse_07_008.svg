<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Principle of Duality</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Swap + ↔ ·  and 0 ↔ 1 in a valid identity — it stays valid</text>
<rect x='160' y='120' width='280' height='52' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='151.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A + 0 = A</text>
<rect x='520' y='120' width='280' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='660' y='151.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A · 1 = A</text>
<text x='480' y='152' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>⇄</text>
<rect x='160' y='192' width='280' height='52' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='223.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A + 1 = 1</text>
<rect x='520' y='192' width='280' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='660' y='223.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A · 0 = 0</text>
<text x='480' y='224' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>⇄</text>
<rect x='160' y='264' width='280' height='52' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='295.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A + A' = 1</text>
<rect x='520' y='264' width='280' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='660' y='295.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A · A' = 0</text>
<text x='480' y='296' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>⇄</text>
<rect x='160' y='336' width='280' height='52' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='367.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>(A + B)' = A' · B'</text>
<rect x='520' y='336' width='280' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='660' y='367.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>(A · B)' = A' + B'</text>
<text x='480' y='368' font-size='22' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>⇄</text>
<text x='480' y='440' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>NOT is left unchanged; only +, · , 0, 1 are interchanged</text>
</svg>
