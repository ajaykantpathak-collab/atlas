<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>The Galvanic (Daniell) Cell</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Chemical energy → electrical energy: Zn gives electrons, Cu takes them</text>
<rect x='150' y='260' width='220' height='220' rx='12' fill='none' stroke='#334155' stroke-width='2.4'/>
<rect x='160' y='340' width='200' height='130' rx='6' fill='#e8f4ea' stroke='none' stroke-width='1.6'/>
<text x='260' y='500' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ZnSO4 solution</text>
<rect x='590' y='260' width='220' height='220' rx='12' fill='none' stroke='#334155' stroke-width='2.4'/>
<rect x='600' y='340' width='200' height='130' rx='6' fill='#e0f2fe' stroke='none' stroke-width='1.6'/>
<text x='700' y='500' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>CuSO4 solution</text>
<rect x='240' y='180' width='20' height='190' rx='8' fill='#6b7280' stroke='#334155' stroke-width='1.6'/>
<text x='250' y='168' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Zn anode (−)</text>
<rect x='640' y='180' width='20' height='190' rx='8' fill='#b87333' stroke='#7c4a1e' stroke-width='1.6'/>
<text x='650' y='168' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cu cathode (+)</text>
<line x1='250' y1='180' x2='250' y2='110' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='250' y1='110' x2='470' y2='110' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='470' y1='110' x2='470' y2='131' stroke='#334155' stroke-width='2.2'/>
<polygon points='470,140 474.5,131 465.5,131' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='650' y1='180' x2='650' y2='110' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='650' y1='110' x2='499' y2='110' stroke='#334155' stroke-width='2.2'/>
<polygon points='490,110 499,114.5 499,105.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<circle cx='480' cy='105' r='26' fill='#fef3c7' stroke='#d97706' stroke-width='2.4'/>
<text x='480' y='111' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>e−</text>
<line x1='300' y1='110' x2='411' y2='110' stroke='#dc2626' stroke-width='2.4'/>
<polygon points='420,110 411,105.5 411,114.5' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='360' y='96' font-size='12' fill='#dc2626' text-anchor='start' font-weight='normal' font-style='normal'>electron flow</text>
<rect x='430' y='320' width='40' height='110' rx='10' fill='#d9c9a3' stroke='#334155' stroke-width='1.6'/>
<text x='450' y='450' font-size='11.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>salt bridge</text>
<text x='450' y='468' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>KCl</text>
<line x1='428' y1='360' x2='309' y2='360' stroke='#2563eb' stroke-width='2' stroke-dasharray='5,4'/>
<polygon points='300,360 309,364.5 309,355.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='365' y='348' font-size='11' fill='#2563eb' text-anchor='start' font-weight='normal' font-style='normal'>anions →</text>
<line x1='472' y1='420' x2='591' y2='420' stroke='#059669' stroke-width='2' stroke-dasharray='5,4'/>
<polygon points='600,420 591,415.5 591,424.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='540' y='440' font-size='11' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>cations →</text>
<rect x='100' y='545' width='360' height='70' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='280' y='575.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Anode (oxidation):</text>
<text x='280' y='593.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Zn → Zn²⁺ + 2e−  (metal dissolves)</text>
<rect x='500' y='545' width='360' height='70' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='680' y='575.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cathode (reduction):</text>
<text x='680' y='593.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Cu²⁺ + 2e− → Cu  (metal deposits)</text>
<text x='480' y='632' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>E°cell = E°cathode − E°anode = 0.34 − (−0.76) = +1.10 V — the salt bridge keeps BOTH solutions electrically neutral</text>
</svg>
