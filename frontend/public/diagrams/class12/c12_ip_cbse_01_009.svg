<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Subquery — a Query Inside a Query</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The inner SELECT runs first; its result feeds the outer one</text>
<rect x='100' y='100' width='760' height='130' rx='10' fill='white' stroke='#2563eb' stroke-width='2.2'/>
<text x='130' y='134' font-size='16' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>SELECT name FROM students</text>
<text x='130' y='162' font-size='16' fill='#d97706' text-anchor='start' font-weight='700' font-style='normal'>WHERE marks &gt; ( SELECT AVG(marks) FROM students )</text>
<text x='130' y='200' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>outer query — uses the inner result as a value</text>
<rect x='480' y='150' width='350' height='62' rx='8' fill='none' stroke='#d97706' stroke-width='2.2'/>
<text x='498' y='178' font-size='13.5' fill='#d97706' text-anchor='start' font-weight='600' font-style='normal'>inner query runs first</text>
<text x='498' y='200' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>e.g. returns 59.5</text>
<line x1='480' y1='181' x2='461' y2='181' stroke='#d97706' stroke-width='2.2'/>
<polygon points='452,181 461,185.5 461,176.5' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<rect x='150' y='300' width='660' height='90' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='340.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Equivalent to comparing every row against 59.5</text>
<text x='480' y='360.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Subqueries may also appear in FROM (derived tables) and HAVING</text>
</svg>
