<text x='422.862' y='335.811' font-size='13.5' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>F = qvB</text>
<text x='400' y='324' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>centre</text>
<rect x='640' y='200' width='300' height='190' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='790' y='244.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Radius (the star formula):</text>
<text x='790' y='262.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>r = mv / qB</text>
<text x='790' y='281.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>faster or heavier → bigger circle</text>
<text x='790' y='299.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>stronger B or bigger q → tighter</text>
<text x='790' y='318.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>circle</text>
<text x='790' y='336.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>period T = 2πm/qB (speed-/</text>
<text x='790' y='355.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>independent — cyclotron trick!)</text>
<text x='480' y='545' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>F ⊥ v always → magnetic force does NO work: it changes direction only, kinetic energy stays fixed</text>
<text x='480' y='577' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Right-hand rule (positive q): fingers v, curl to B, thumb F — flip for negative charge</text>
<text x='480' y='609' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Uses: cyclotrons, mass spectrometers (r sorts m/q), TV tubes, Earth's van Allen belts</text>
<text x='480' y='639' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>v parallel to B → no force at all (sinθ = 0): helix when v has both parts</text>
</svg>
