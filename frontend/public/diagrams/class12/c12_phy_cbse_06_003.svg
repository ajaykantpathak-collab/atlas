<text x='720' y='550.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Flux bookkeeping:</text>
<text x='720' y='569.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>area swept per second = lv</text>
<text x='720' y='588.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ dΦ/dt = Blv = ε (Faraday's law)</text>
<text x='480' y='640' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Conservation check: push harder (bigger v) → more current → stronger brake. Energy comes from YOUR arm.</text>
