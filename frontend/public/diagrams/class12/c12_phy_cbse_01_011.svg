<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>The Electric Dipole</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>+q and −q separated by 2a; p = q × 2a points − → +</text>
<circle cx='300' cy='300' r='30' fill='#fee2e2' stroke='#dc2626' stroke-width='2.2'/>
<text x='300' y='305' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>+q</text>
<circle cx='660' cy='300' r='30' fill='#dbeafe' stroke='#2563eb' stroke-width='2.2'/>
<text x='660' y='305' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>−q</text>
<line x1='336' y1='300' x2='624' y2='300' stroke='#6b7280' stroke-width='1.4'/>
<text x='480' y='285' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>2a</text>
<line x1='400' y1='350' x2='560' y2='350' stroke='#7c3aed' stroke-width='3'/>
<polygon points='560,350 550.789,353.894 550.789,346.106' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='574' y='340' font-size='13.5' fill='#7c3aed' text-anchor='start' font-weight='700' font-style='normal'>dipole moment p</text>
<text x='400' y='374' font-size='12' fill='#7c3aed' text-anchor='middle' font-weight='normal' font-style='normal'>from − to +</text>
<circle cx='830' cy='300' r='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='2.2'/>
<line x1='824' y1='300' x2='769' y2='300' stroke='#059669' stroke-width='3'/>
<polygon points='769,300 778.211,296.106 778.211,303.894' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='755' y='290' font-size='12' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>axial: E ∥ p</text>
<circle cx='480' cy='160' r='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='2.2'/>
<line x1='480' y1='160' x2='480' y2='210' stroke='#d97706' stroke-width='3'/>
<polygon points='480,210 476.106,200.789 483.894,200.789' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<text x='494' y='200' font-size='12' fill='#d97706' text-anchor='start' font-weight='700' font-style='normal'>equatorial: E anti-∥ p</text>
<rect x='120' y='440' width='360' height='130' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='472.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Field formulas:</text>
<text x='300' y='491.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>axial: E = 2kp/r³ (stronger)</text>
<text x='300' y='509.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>equatorial: E = kp/r³</text>
<text x='300' y='528.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>both fall as 1/r³ — faster than</text>
<text x='300' y='546.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>a point charge's 1/r²</text>
<rect x='520' y='440' width='320' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='680' y='481.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>In a uniform field:</text>
<text x='680' y='500.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>τ = pE sinθ — torque aligns</text>
<text x='680' y='518.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>p with E; net force zero</text>
<text x='680' y='537.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(net FORCE zero, net TWIST not)</text>
<text x='480' y='615' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Dipoles matter because molecules (H2O!) are charge-separated even when fully neutral</text>
<text x='480' y='645' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Ideal dipole: separation 2a → 0 while q → ∞ with p fixed</text>
</svg>
