<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Thomson's Measurement of e/m</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Crossed electric and magnetic fields — balance them and the beam stays straight</text>
<rect x='120' y='240' width='560' height='160' rx='14' fill='#f6f6ef' stroke='#334155' stroke-width='2.4'/>
<rect x='70' y='280' width='50' height='80' rx='6' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<text x='95' y='326' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>e− gun</text>
<line x1='122' y1='320' x2='651' y2='320' stroke='#dc2626' stroke-width='2.4' stroke-dasharray='7,5'/>
<polygon points='660,320 651,315.5 651,324.5' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='390' y='300' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='600' font-style='normal'>electron beam</text>
<rect x='300' y='220' width='200' height='12' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/>
<rect x='300' y='408' width='200' height='12' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.6'/>
<text x='400' y='210' font-size='12.5' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>+ plate</text>
<text x='400' y='440' font-size='12.5' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>− plate</text>
<line x1='470' y1='262' x2='470' y2='291' stroke='#2563eb' stroke-width='2'/>
<polygon points='470,300 474.5,291 465.5,291' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='505' y='272' font-size='12' fill='#2563eb' text-anchor='start' font-weight='normal' font-style='normal'>E force up</text>
<circle cx='280' cy='470' r='10' fill='white' stroke='#6b7280' stroke-width='1.6'/>
<text x='280' y='475' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='700' font-style='normal'>×</text>
<circle cx='400' cy='470' r='10' fill='white' stroke='#6b7280' stroke-width='1.6'/>
<text x='400' y='475' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='700' font-style='normal'>×</text>
<circle cx='520' cy='470' r='10' fill='white' stroke='#6b7280' stroke-width='1.6'/>
<text x='520' y='475' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='700' font-style='normal'>×</text>
<text x='400' y='500' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>B into the page (×) → magnetic force down on the beam</text>
<rect x='720' y='200' width='200' height='140' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='820' y='255.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>BALANCE:</text>
<text x='820' y='275.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>eE = evB</text>
<text x='820' y='295.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→  e/m = E / (B²r)</text>
<text x='820' y='370' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>measured value</text>
<text x='820' y='390' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>e/m ≈ 1.76 × 10¹¹ C/kg</text>
<text x='820' y='412' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(same for ANY cathode</text>
<text x='820' y='428' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>material — a universal</text>
<text x='820' y='444' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>particle!)</text>
<text x='480' y='570' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Physics: electric force qE and magnetic force qvB oppose each other; when they cancel, deflection is zero</text>
<text x='480' y='598' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Same e/m for every metal and every gas → electrons are a universal ingredient of all atoms</text>
<text x='480' y='626' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Millikan later measured e alone; combining the two gave the electron's tiny mass</text>
</svg>
