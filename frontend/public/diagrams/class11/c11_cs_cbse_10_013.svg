<text x='266.863' y='439.137' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>—</text>
<circle cx='220' cy='320' r='34' fill='#dbeafe' stroke='#334155' stroke-width='1.6'/>
<text x='220' y='326' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>70</text>
