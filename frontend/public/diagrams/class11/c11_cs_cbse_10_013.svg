<text x='380' y='306' font-size='14.5' fill='#059669' text-anchor='middle' font-weight='600' font-style='normal'>front → dequeues</text>
<text x='380' y='334' font-size='14.5' fill='#dc2626' text-anchor='middle' font-weight='600' font-style='normal'>rear ← enqueues</text>
<rect x='620' y='170' width='254.9' height='22' rx='11' fill='#d1fae5' stroke='#059669' stroke-width='1.2'/>
<text x='747.45' y='186' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>enqueue: rear = (rear + 1) % size</text>
<rect x='620' y='210' width='269.5' height='22' rx='11' fill='#dbeafe' stroke='#2563eb' stroke-width='1.2'/>
<text x='754.75' y='226' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>dequeue: front = (front + 1) % size</text>
<text x='700' y='300' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>When rear reaches the end it</text>
<text x='700' y='320' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>wraps to slot 0 — freed cells</text>
<text x='700' y='340' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>get reused (no overflow while</text>
<text x='700' y='360' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>space really remains)</text>
