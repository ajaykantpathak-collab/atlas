<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Calorimetry: Measuring Heat</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>q = m × c × ΔT — trap the heat, watch the thermometer</text>
<rect x='260' y='260' width='160' height='200' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='2.6'/>
<rect x='272' y='300' width='136' height='150' rx='4' fill='#dbeafe' stroke='none' stroke-width='1.6'/>
<rect x='300' y='180' width='20' height='240' rx='8' fill='#e8e8e8' stroke='#334155' stroke-width='1.6'/>
<circle cx='310' cy='175' r='14' fill='white' stroke='#dc2626' stroke-width='2'/>
<line x1='310' y1='162' x2='310' y2='195' stroke='#dc2626' stroke-width='2'/>
<text x='310' y='132' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>thermometer</text>
<rect x='240' y='240' width='200' height='22' rx='4' fill='#c9a86a' stroke='#334155' stroke-width='1.6'/>
<text x='340' y='256' font-size='11' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>lid</text>
<text x='340' y='380' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>known mass of water</text>
<rect x='180' y='480' width='320' height='30' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/>
<text x='340' y='500' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>insulated container (no heat leaks)</text>
<line x1='480' y1='300' x2='408.427' y2='326.84' stroke='#dc2626' stroke-width='3'/>
<polygon points='400,330 410.007,331.053 406.847,322.626' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='320.8' y='293' width='238.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='440' y='307' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>exothermic: heat OUT of reaction</text>
<text x='480' y='150' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>reaction happens inside; water absorbs (or gives) the heat</text>
<rect x='560' y='380' width='340' height='140' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='730' y='426.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>q(water) = m × c × ΔT</text>
<text x='730' y='445.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>c(water) = 4.18 J g⁻¹ K⁻¹</text>
<text x='730' y='463.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>at constant volume: q = ΔU</text>
<text x='730' y='482.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>at constant pressure: q = ΔH</text>
<text x='480' y='560' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔT read from the thermometer BEFORE vs AFTER; sign tells you exo (water warms) or endo (water cools)</text>
<text x='480' y='590' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Bomb calorimeter (steel 'bomb', constant volume) → measures ΔU; coffee-cup at constant P → measures ΔH</text>
<text x='480' y='618' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Assumption: heat lost to the container itself is calibrated away (calorimeter constant)</text>
</svg>
