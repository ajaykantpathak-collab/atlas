<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Malware — Types of Malicious Software</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Programs designed to infiltrate, damage or take over computers</text>
<rect x='400' y='90' width='160' height='44' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='480' y='118.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>MALWARE</text>
<line x1='480' y1='134' x2='150' y2='210' stroke='#334155' stroke-width='1.8'/>
<rect x='90' y='210' width='120' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='150' y='235.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Virus</text>
<text x='150' y='272' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>attaches to files; spreads</text>
<text x='150' y='288' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>when the file is run</text>
<line x1='480' y1='134' x2='330' y2='210' stroke='#334155' stroke-width='1.8'/>
<rect x='270' y='210' width='120' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='330' y='235.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Worm</text>
<text x='330' y='272' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>self-copies across networks without</text>
<text x='330' y='288' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>a host</text>
<line x1='480' y1='134' x2='510' y2='210' stroke='#334155' stroke-width='1.8'/>
<rect x='450' y='210' width='120' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='510' y='235.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Trojan horse</text>
<text x='510' y='272' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>pretends to be useful</text>
<text x='510' y='288' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>software; opens a backdoor</text>
<line x1='480' y1='134' x2='690' y2='210' stroke='#334155' stroke-width='1.8'/>
<rect x='630' y='210' width='120' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='690' y='235.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Spyware</text>
<text x='690' y='272' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>secretly records your activity</text>
<text x='690' y='288' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>and keystrokes</text>
<line x1='480' y1='134' x2='870' y2='210' stroke='#334155' stroke-width='1.8'/>
<rect x='810' y='210' width='120' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='870' y='235.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Ransomware</text>
<text x='870' y='272' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>encrypts your files and</text>
<text x='870' y='288' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>demands payment</text>
<rect x='150' y='340' width='660' height='64' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='377.075' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Spreads via: email attachments · pirated downloads · infected USB drives · unsafe links</text>
<text x='480' y='440' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Symptoms: slowdowns · crashes · pop-ups · missing files · ransom messages</text>
</svg>
