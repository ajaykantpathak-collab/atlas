<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>habits and tools that keep threats out</text>
<circle cx='480' cy='320' r='260' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
<circle cx='480' cy='320' r='195' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<circle cx='480' cy='320' r='130' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
