<text x='711' y='428' font-size='12' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>your data (encrypted, backed up)</text>
<text x='480' y='610' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>One weak layer is survivable when the others hold</text>
