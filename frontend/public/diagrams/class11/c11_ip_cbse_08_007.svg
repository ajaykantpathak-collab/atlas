<text x='710.95' y='126' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>2-factor authentication</text>
<rect x='60' y='480' width='130.8' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='125.4' y='496' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>software updates</text>
<rect x='700' y='480' width='123.5' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='761.75' y='496' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>regular backups</text>
