<text x='480' y='325' font-size='11.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>think before
you click</text>
<rect x='150' y='110' width='130.8' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
