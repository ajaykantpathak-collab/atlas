<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Reading a Truth Table</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>n variables → 2ⁿ rows; every combination is listed once</text>
<rect x='180' y='120' width='360' height='126' rx='8' fill='white' stroke='#334155' stroke-width='1.6'/>
<text x='225' y='141' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>A</text>
<text x='315' y='141' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>B</text>
<line x1='270' y1='120' x2='270' y2='246' stroke='#6b7280' stroke-width='1'/>
<text x='405' y='141' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>A + B</text>
<line x1='360' y1='120' x2='360' y2='246' stroke='#6b7280' stroke-width='1'/>
<text x='495' y='141' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>A · B</text>
<line x1='450' y1='120' x2='450' y2='246' stroke='#6b7280' stroke-width='1'/>
<line x1='180' y1='150' x2='540' y2='150' stroke='#334155' stroke-width='1.8'/>
<text x='225' y='170' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='315' y='170' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='405' y='170' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='495' y='170' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='225' y='194' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='315' y='194' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='405' y='194' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='495' y='194' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='225' y='218' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='315' y='218' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='405' y='218' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='495' y='218' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0</text>
<text x='225' y='242' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='315' y='242' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='405' y='242' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<text x='495' y='242' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='130' y='300' width='298.7' height='22' rx='11' fill='white' stroke='#2563eb' stroke-width='1.2'/>
<text x='279.35' y='316' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>inputs: all 2ⁿ = 4 combinations of A, B</text>
<rect x='240' y='300' width='379' height='22' rx='11' fill='white' stroke='#059669' stroke-width='1.2'/>
<text x='429.5' y='316' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>output columns: evaluate the expression row by row</text>
<rect x='340' y='300' width='240.3' height='22' rx='11' fill='white' stroke='#d97706' stroke-width='1.2'/>
<text x='460.15' y='316' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>row 3: (1,0) → A+B = 1, A·B = 0</text>
<rect x='180' y='380' width='560' height='60' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='460' y='415.425' font-size='15.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Two inputs → 4 rows · three inputs → 8 rows · n inputs → 2ⁿ rows</text>
<text x='480' y='480' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Truth tables are the standard way to prove two expressions equivalent</text>
</svg>
