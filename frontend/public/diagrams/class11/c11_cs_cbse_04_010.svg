<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Mutable vs Immutable</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Can the object's contents change after creation?</text>
<rect x='100' y='100' width='330' height='56' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='265' y='123.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>MUTABLE — yes</text>
<text x='265' y='144.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>list, dict, set</text>
<text x='110' y='200' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>nums = [1, 2, 3]</text>
<rect x='110' y='220' width='300' height='48' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='260' y='249.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>[1, 2, 3]</text>
<text x='110' y='310' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>nums[0] = 9   # in-place</text>
<rect x='110' y='330' width='300' height='48' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='260' y='359.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>[9, 2, 3]  ← same object</text>
<rect x='530' y='100' width='330' height='56' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='695' y='123.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>IMMUTABLE — no</text>
<text x='695' y='144.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>int, float, str, tuple</text>
<text x='540' y='200' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>s = 'cat'</text>
<rect x='540' y='220' width='300' height='48' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='690' y='249.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'cat'</text>
<text x='540' y='310' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>s = s + 's'   # rebuild</text>
<rect x='540' y='330' width='300' height='48' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='690' y='359.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'cats'  ← new object</text>
<rect x='180' y='430' width='600' height='76' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='463.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'cat' is never edited — s simply binds to a fresh string</text>
<text x='480' y='483.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>This is why immutables are safe as dict keys</text>
</svg>
