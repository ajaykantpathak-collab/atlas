<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Coordinate (Dative) Bond</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Both shared electrons come from the SAME atom — donor gives, acceptor takes</text>
<text x='200' y='180' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>NH3 (lone pair donor)</text>
<circle cx='200' cy='280' r='46' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
<text x='200' y='286.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>N</text>
<circle cx='132.45' cy='310' r='24' fill='#f3f4f6' stroke='#6b7280' stroke-width='2'/>
<text x='132.45' y='314.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>H</text>
<line x1='165.359' y1='295' x2='148.038' y2='303' stroke='#334155' stroke-width='2.6'/>
<circle cx='267.55' cy='310' r='24' fill='#f3f4f6' stroke='#6b7280' stroke-width='2'/>
<text x='267.55' y='314.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>H</text>
<line x1='234.641' y1='295' x2='251.962' y2='303' stroke='#334155' stroke-width='2.6'/>
<circle cx='200' cy='220' r='24' fill='#f3f4f6' stroke='#6b7280' stroke-width='2'/>
<text x='200' y='224.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>H</text>
<line x1='200' y1='250' x2='200' y2='234' stroke='#334155' stroke-width='2.6'/>
<circle cx='226' cy='236' r='11' fill='#d97706' stroke='#1e2430' stroke-width='1.6'/>
<text x='262' y='232' font-size='12' fill='#d97706' text-anchor='start' font-weight='600' font-style='normal'>lone pair</text>
<circle cx='420' cy='280' r='34' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/>
<text x='420' y='285.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>H+</text>
<line x1='330' y1='280' x2='371' y2='280' stroke='#d97706' stroke-width='2.8'/>
<polygon points='380,280 371,275.5 371,284.5' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<rect x='297' y='256' width='116' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='355' y='270' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>e− pair donated</text>
<text x='480' y='400' font-size='24' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>→</text>
<text x='200' y='430' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>NH4+ : all four N–H bonds IDENTICAL</text>
<text x='200' y='452' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(once formed, you cannot tell which</text>
<text x='200' y='468' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>bond was the dative one)</text>
<rect x='620' y='150' width='300' height='130' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='770' y='191.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Donor: has a lone pair</text>
<text x='770' y='210.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(NH3, H2O, CO, NH2−)</text>
<text x='770' y='228.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Acceptor: has an empty</text>
<text x='770' y='247.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>orbital (H+, BF3, metal ions)</text>
<rect x='620' y='310' width='300' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='770' y='342.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Same family:</text>
<text x='770' y='361.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Lewis acids (acceptors)</text>
<text x='770' y='379.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>and Lewis bases (donors) —</text>
<text x='770' y='398.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the dative bond IS the</text>
<text x='770' y='416.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Lewis acid-base bond</text>
<text x='480' y='560' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>More examples: H3O+ (H2O → H+), NH3·BF3 adduct, O2 bonding to haem iron</text>
<text x='480' y='592' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Count check in NH4+: N shares 4 pairs but 'owns' only 3 of them — formal charge +1 sits on N</text>
<text x='480' y='620' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Not a different KIND of bond — just a different origin story for the electron pair</text>
</svg>
