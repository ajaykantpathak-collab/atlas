<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Variables Bind Names to Objects</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Assignment stores a reference to a value in memory — the name labels the object</text>
<text x='150' y='150' font-size='19' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>score = 42</text>
<rect x='110' y='190' width='110' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='165' y='217.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>score</text>
<line x1='220' y1='212' x2='321' y2='212' stroke='#334155' stroke-width='2.2'/>
<polygon points='330,212 321,207.5 321,216.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='238.6' y='192' width='72.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='275' y='206' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>refers to</text>
<rect x='330' y='186' width='190' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='425' y='207.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>int object</text>
<text x='425' y='226.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>value 42</text>
<text x='640' y='212' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>in memory</text>
<text x='150' y='300' font-size='19' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>score = 57</text>
<rect x='110' y='336' width='110' height='44' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='165' y='363.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>score</text>
<line x1='220' y1='358' x2='321' y2='358' stroke='#334155' stroke-width='2.2'/>
<polygon points='330,358 321,353.5 321,362.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='330' y='332' width='190' height='52' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='425' y='353.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>int object</text>
<text x='425' y='372.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>value 57</text>
<rect x='330' y='408' width='190' height='44' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='425' y='434.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>42 (now unused)</text>
<line x1='330' y1='420' x2='300' y2='420' stroke='#334155' stroke-width='2.2' fill='none' stroke-dasharray='5 4'/>
<line x1='300' y1='420' x2='300' y2='380' stroke='#334155' stroke-width='2.2' fill='none' stroke-dasharray='5 4'/>
<line x1='300' y1='380' x2='291' y2='380' stroke='#334155' stroke-width='2.2' stroke-dasharray='5 4'/>
<polygon points='300,380 291,375.5 291,384.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='300' y='445' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>rebinding the name does not change 42 — it points the name at a new object</text>
<text x='480' y='510' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>dynamic typing: the object carries its type; the name can bind to any type</text>
</svg>
