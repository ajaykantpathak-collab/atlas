<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>First Law of Thermodynamics</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔU = q + w — energy is conserved; you can only convert it</text>
<rect x='400' y='150' width='200' height='90' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='500' y='189.5' font-size='20' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>ΔU</text>
<text x='500' y='214.5' font-size='20' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>internal energy change</text>
<line x1='250' y1='240' x2='387.248' y2='207.098' stroke='#2563eb' stroke-width='3'/>
<polygon points='396,205 386.199,202.722 388.297,211.474' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<rect x='272.2' y='202.5' width='101.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='323' y='216.5' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>q: heat added</text>
<line x1='250' y1='340' x2='387.248' y2='307.098' stroke='#059669' stroke-width='3'/>
<polygon points='396,305 386.199,302.722 388.297,311.474' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='265' y='302.5' width='116' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='323' y='316.5' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>w: work done on</text>
<text x='250' y='430' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>the only two ways to change U</text>
<rect x='700' y='220' width='90' height='150' rx='6' fill='#f6f6ef' stroke='#334155' stroke-width='2.4'/>
<rect x='700' y='250' width='90' height='120' rx='8' fill='#dbeafe' stroke='none' stroke-width='1.6'/>
<rect x='688' y='226' width='114' height='16' rx='3' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<line x1='745' y1='180' x2='745' y2='205' stroke='#059669' stroke-width='2.8'/>
<polygon points='745,214 749.5,205 740.5,205' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='745' y='165' font-size='12' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>compression: w &gt; 0</text>
<text x='745' y='400' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gas pushed in = work done ON system</text>
<rect x='120' y='460' width='360' height='130' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='300' y='493.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Sign bookkeeping:</text>
<text x='300' y='511.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>q + (absorbed) / q − (released)</text>
<text x='300' y='529.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>w + (on system) / w − (by system)</text>
<text x='300' y='547.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>isothermal: ΔU = 0 → q = −w</text>
<text x='300' y='565.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>adiabatic: q = 0 → ΔU = w</text>
<rect x='520' y='460' width='320' height='130' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='680' y='502.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>State function:</text>
<text x='680' y='520.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ΔU depends only on start</text>
<text x='680' y='538.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>and end states — but q and w</text>
<text x='680' y='556.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>are PATH dependent</text>
<text x='480' y='630' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Energy cannot be created or destroyed — the first law forbids perpetual motion machines</text>
</svg>
