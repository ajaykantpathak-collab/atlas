<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Converting Between Number Systems</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>division-remainder for integers; doubling for fractions</text>
<text x='150' y='110' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>25 ÷ 2 = 12  remainder 1  ← LSB</text>
<text x='150' y='142' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>12 ÷ 2 =  6  remainder 0</text>
<text x='150' y='174' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>6 ÷ 2  =  3  remainder 0</text>
<text x='150' y='206' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>3 ÷ 2  =  1  remainder 1</text>
<text x='150' y='238' font-size='15' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>1 ÷ 2  =  0  remainder 1  ← MSB</text>
<line x1='140' y1='120' x2='140' y2='241' stroke='#334155' stroke-width='2.2'/>
<polygon points='140,250 144.5,241 135.5,241' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='56.8' y='165' width='166.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='140' y='179' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>read remainders upward</text>
<rect x='430' y='150' width='200' height='56' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='530' y='184.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>25₁₀ = 11001₂</text>
<text x='150' y='320' font-size='15' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>11001₂ → decimal: weights</text>
<rect x='150' y='340' width='56' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='178' y='368.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1</text>
<text x='178' y='404' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>×16</text>
<rect x='214' y='340' width='56' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='242' y='368.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1</text>
<text x='242' y='404' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>×8</text>
<rect x='278' y='340' width='56' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='306' y='368.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0</text>
<text x='306' y='404' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>×4</text>
<rect x='342' y='340' width='56' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='370' y='368.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0</text>
<text x='370' y='404' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>×2</text>
<rect x='406' y='340' width='56' height='46' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='434' y='368.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>1</text>
<text x='434' y='404' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>×1</text>
<text x='500' y='364' font-size='15' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>= 16 + 8 + 1 = 25 ✓</text>
<text x='480' y='470' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Hex ↔ binary: regroup bits in fours (11001 → 0001 1001 → 19₁₆)</text>
</svg>
