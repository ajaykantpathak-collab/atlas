<g font-size="15" fill="#233">
<text x="120" y="520">Red = thin (actin) filament;</text>
<text x="120" y="544">blue = thick (myosin) filament</text>
<text x="120" y="568">with myosin heads.</text>
<text x="400" y="520">During contraction the thin filaments slide inward:</text>
<text x="400" y="544">the I bands and H zone shorten, the A band stays the</text>
<text x="400" y="568">same, and the Z lines are pulled closer together</text>
<text x="400" y="592">(the sarcomere shortens).</text>
</g>
<text x="470" y="640" text-anchor="middle" font-size="13" fill="#667">Original diagram created from node curriculum content (CC0), Atlas wave-T 2026-09-29</text>
