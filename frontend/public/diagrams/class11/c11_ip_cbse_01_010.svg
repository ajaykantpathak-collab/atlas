<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Number Systems and Radices</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>decimal, binary, octal, hexadecimal — same value, different bases</text>
<rect x='120' y='110' width='200' height='60' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='220' y='135.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Decimal</text>
<text x='220' y='156.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>base 10</text>
<text x='350' y='137' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>digits: 0–9</text>
<text x='350' y='159' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='600' font-style='normal'>257₁₀ = 257</text>
<rect x='120' y='188' width='200' height='60' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='220' y='213.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Binary</text>
<text x='220' y='234.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>base 2</text>
<text x='350' y='215' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>digits: 0, 1</text>
<text x='350' y='237' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='600' font-style='normal'>257₁₀ = 100000001</text>
<rect x='120' y='266' width='200' height='60' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='220' y='291.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Octal</text>
<text x='220' y='312.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>base 8</text>
<text x='350' y='293' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>digits: 0–7</text>
<text x='350' y='315' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='600' font-style='normal'>257₁₀ = 401</text>
<rect x='120' y='344' width='200' height='60' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='220' y='369.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Hexadecimal</text>
<text x='220' y='390.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>base 16</text>
<text x='350' y='371' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>digits: 0–9, A–F</text>
<text x='350' y='393' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='600' font-style='normal'>257₁₀ = 101</text>
<text x='480' y='440' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Positional value: each digit multiplies its base raised to the place power</text>
<text x='480' y='468' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>101₂ = 1·4 + 0·2 + 1·1 = 5₁₀</text>
</svg>
