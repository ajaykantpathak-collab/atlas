<text x='480' y='150' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Range R = u² sin2θ / g    ·    Max height H = u² sin²θ / 2g    ·    T = 2u sinθ / g</text>
<rect x='120' y='510' width='350' height='110' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='295' y='551.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Horizontal (no force):</text>
<text x='295' y='569.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ax = 0 → x = (u cosθ) t</text>
<text x='295' y='588.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>— covers equal distances in equal times</text>
<rect x='510' y='510' width='330' height='110' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='675' y='551.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Vertical (gravity only):</text>
<text x='675' y='569.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ay = −g → vy = u sinθ − gt</text>
<text x='675' y='588.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>slows going up, speeds up coming down</text>
<text x='480' y='645' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>45° maximises range; complementary angles (30°, 60°) give the SAME range; path is a parabola</text>
