<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>System, Surroundings, Boundary</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Define what you study; everything else is the surroundings</text>
<rect x='340' y='150' width='280' height='260' rx='14' fill='#fef3c7' stroke='#d97706' stroke-width='3'/>
<text x='480' y='210' font-size='18' fill='#92400e' text-anchor='middle' font-weight='700' font-style='normal'>SYSTEM</text>
<text x='480' y='238' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the part of the universe</text>
<text x='480' y='256' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>under study</text>
<text x='480' y='290' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>e.g. water in a beaker,</text>
<text x='480' y='308' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gas in a cylinder,</text>
<text x='480' y='326' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>reacting mixture</text>
<rect x='200' y='110' width='560' height='340' rx='18' fill='none' stroke='#6b7280' stroke-width='2' stroke-dasharray='9,6'/>
<text x='480' y='475' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>boundary = real or imaginary wall (the beaker glass)</text>
<text x='480' y='95' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SURROUNDINGS = everything outside the boundary (rest of the universe)</text>
<line x1='250' y1='200' x2='327' y2='200' stroke='#2563eb' stroke-width='2.8'/>
<polygon points='336,200 327,195.5 327,204.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<rect x='260.2' y='180' width='65.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='293' y='194' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>q (heat)</text>
<line x1='336' y1='300' x2='259' y2='300' stroke='#059669' stroke-width='2.8'/>
<polygon points='250,300 259,304.5 259,295.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='260.2' y='280' width='65.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='293' y='294' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>w (work)</text>
<rect x='80' y='520' width='260' height='90' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='210' y='551.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>OPEN: exchanges</text>
<text x='210' y='569.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>both matter and energy</text>
<text x='210' y='588.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(open beaker)</text>
<rect x='350' y='520' width='260' height='90' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='551.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>CLOSED: energy yes,</text>
<text x='480' y='569.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>matter no</text>
<text x='480' y='588.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(sealed flask)</text>
<rect x='620' y='520' width='260' height='90' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='750' y='560.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>ISOLATED: neither</text>
<text x='750' y='578.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(thermos flask, idealised)</text>
<text x='480' y='640' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Sign convention: heat gained by system q &gt; 0; work done ON the system w &gt; 0 (chemistry convention)</text>
</svg>
