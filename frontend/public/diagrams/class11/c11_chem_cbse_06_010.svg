<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>ΔG° = −RT ln K</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>One equation links the thermodynamic verdict to the equilibrium composition</text>
<rect x='100' y='150' width='300' height='150' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='250' y='191.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>K &gt;&gt; 1 (large)</text>
<text x='250' y='210.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ln K positive</text>
<text x='250' y='229.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ ΔG° negative</text>
<text x='250' y='248.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>products DOMINATE at equilibrium</text>
<text x='250' y='267.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>reaction goes nearly to completion</text>
<rect x='100' y='330' width='300' height='150' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='250' y='371.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>K &lt;&lt; 1 (small)</text>
<text x='250' y='390.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ln K negative</text>
<text x='250' y='409.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ ΔG° positive</text>
<text x='250' y='428.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>reactants DOMINATE at equilibrium</text>
<text x='250' y='447.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>barely proceeds</text>
<line x1='500' y1='300' x2='900' y2='300' stroke='#334155' stroke-width='2.4'/>
<line x1='900' y1='300' x2='903' y2='300' stroke='#334155' stroke-width='2.4'/>
<polygon points='912,300 903,295.5 903,304.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='700' y='270' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>ΔG° (kJ/mol) →</text>
<line x1='540' y1='292' x2='540' y2='308' stroke='#334155' stroke-width='2.4'/>
<text x='540' y='330' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>−50</text>
<text x='540' y='350' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>K ≈ 6×10⁸</text>
<line x1='700' y1='292' x2='700' y2='308' stroke='#334155' stroke-width='2.4'/>
<text x='700' y='330' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>0</text>
<text x='700' y='350' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>K = 1</text>
<line x1='860' y1='292' x2='860' y2='308' stroke='#334155' stroke-width='2.4'/>
<text x='860' y='330' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>+50</text>
<text x='860' y='350' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>K ≈ 2×10⁻⁹</text>
<text x='560' y='390' font-size='12.5' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>products favoured</text>
<text x='840' y='390' font-size='12.5' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>reactants favoured</text>
<text x='480' y='510' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Every 5.7 kJ/mol of ΔG° at 298 K changes K by a factor of 10</text>
<text x='480' y='542' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔG° = 0 exactly means K = 1 — half-way reaction</text>
<text x='480' y='572' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Careful: ΔG° is for STANDARD conditions; the actual ΔG = ΔG° + RT ln Q decides real-time direction</text>
<text x='480' y='600' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Q &lt; K → forward, Q &gt; K → backward, Q = K → equilibrium</text>
</svg>
