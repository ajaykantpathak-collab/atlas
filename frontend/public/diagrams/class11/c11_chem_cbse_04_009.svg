<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Bond Order from Molecular Orbitals</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Counting electrons above and below the gap</text>
<line x1='280' y1='180' x2='340' y2='180' stroke='#2563eb' stroke-width='3'/>
<line x1='460' y1='180' x2='520' y2='180' stroke='#2563eb' stroke-width='3'/>
<text x='310' y='204' font-size='12' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>atom A 2p</text>
<text x='490' y='204' font-size='12' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>atom B 2p</text>
<line x1='360' y1='320' x2='440' y2='320' stroke='#059669' stroke-width='3'/>
<text x='452' y='325' font-size='12.5' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>σ (bonding, lower)</text>
<line x1='360' y1='120' x2='440' y2='120' stroke='#dc2626' stroke-width='3'/>
<text x='452' y='125' font-size='12.5' fill='#dc2626' text-anchor='start' font-weight='normal' font-style='normal'>σ* (antibonding, higher)</text>
<line x1='370' y1='344' x2='370' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='370,324 365.5,333 374.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='382' y1='344' x2='382' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='382,324 377.5,333 386.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='394' y1='344' x2='394' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='394,324 389.5,333 398.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='406' y1='344' x2='406' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='406,324 401.5,333 410.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='418' y1='344' x2='418' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='418,324 413.5,333 422.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='430' y1='344' x2='430' y2='333' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='430,324 425.5,333 434.5,333' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='394' y1='144' x2='394' y2='133' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='394,124 389.5,133 398.5,133' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<line x1='406' y1='144' x2='406' y2='133' stroke='#1e2430' stroke-width='1.6'/>
<polygon points='406,124 401.5,133 410.5,133' fill='#1e2430' stroke='#1e2430' stroke-width='1'/>
<text x='270' y='160' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>Na = electrons in</text>
<text x='270' y='180' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>antibonding MOs (top)</text>
<text x='270' y='290' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>Nb = electrons in</text>
<text x='270' y='310' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>bonding MOs (bottom)</text>
<rect x='640' y='180' width='280' height='90' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='780' y='220.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Bond order</text>
<text x='780' y='241.1' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>= (Nb − Na) / 2</text>
<rect x='640' y='300' width='280' height='150' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='780' y='342.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Read-out:</text>
<text x='780' y='361.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>BO 1 → single bond</text>
<text x='780' y='379.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>BO 2 → double bond</text>
<text x='780' y='398.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>BO 3 → triple bond</text>
<text x='780' y='416.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>higher BO = shorter, stronger</text>
<text x='480' y='560' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Example: N2 has Nb = 10, Na = 4 → BO = 3 (triple bond) · O2: Nb = 10, Na = 6 → BO = 2</text>
<text x='480' y='590' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Stability check: BO &gt; 0 → molecule exists; BO = 0 → no bond (as in He2)</text>
<text x='480' y='618' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>MO theory's triumph: correctly predicts O2 is PARAMAGNETIC (2 unpaired e− in π*), which Lewis structures miss</text>
</svg>
