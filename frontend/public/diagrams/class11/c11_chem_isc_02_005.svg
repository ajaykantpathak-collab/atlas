<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>s and p Orbitals: Probability Pictures</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>An orbital is a 90% probability cloud, not a racetrack</text>
<circle cx='220' cy='300' r='90' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<circle cx='220' cy='300' r='55' fill='#bfd7f7' stroke='none' stroke-width='1.6'/>
<text x='220' y='305' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>1s</text>
<text x='220' y='430' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>spherical — same in every</text>
<text x='220' y='448' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>direction; holds max 2 e−</text>
<g transform='rotate(0 520 300)'><path d='M 520 274 C 554 204 486 204 520 274 Z' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/></g>
<g transform='rotate(0 520 300)'><path d='M 520 326 C 554 396 486 396 520 326 Z' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/></g>
<circle cx='520' cy='300' r='4' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='520' y='430' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2px</text>
<g transform='rotate(90 730 300)'><path d='M 730 274 C 764 204 696 204 730 274 Z' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/></g>
<g transform='rotate(90 730 300)'><path d='M 730 326 C 764 396 696 396 730 326 Z' fill='#ede9fe' stroke='#7c3aed' stroke-width='2'/></g>
<circle cx='730' cy='300' r='4' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='730' y='430' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>2py</text>
<text x='520' y='452' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>dumb-bell along x-axis</text>
<text x='730' y='452' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>dumb-bell along y-axis</text>
<text x='625' y='190' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>three p orbitals (px, py, pz) at 90° — together hold 6 e−</text>
<rect x='120' y='500' width='720' height='70' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='530.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Nodes: 1s has 0 radial nodes, 2s has 1 — higher n means bigger clouds with more nodes</text>
<text x='480' y='548.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>· Each orbital = one 'slot' for a pair of opposite-spin electrons</text>
<text x='480' y='610' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Quantum numbers: n (size/energy), l (shape: s=0, p=1), m (orientation), s (spin ±½)</text>
<text x='480' y='636' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The dense inner shading shows where the electron probability is highest</text>
</svg>
