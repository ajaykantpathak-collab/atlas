<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>File Modes</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The mode decides what the open file may do and where writes go</text>
<rect x='120' y='110' width='90' height='52' rx='8' fill='#dbeafe' stroke='#334155' stroke-width='1.8'/>
<text x='165' y='142.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'r'</text>
<text x='240' y='141' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>read only — file must exist; pointer at start</text>
<rect x='120' y='178' width='90' height='52' rx='8' fill='#fee2e2' stroke='#334155' stroke-width='1.8'/>
<text x='165' y='210.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'w'</text>
<text x='240' y='209' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>write — creates/truncates (ERASES!) to empty</text>
<rect x='120' y='246' width='90' height='52' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='1.8'/>
<text x='165' y='278.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'a'</text>
<text x='240' y='277' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>append — writes always go at the end</text>
<rect x='120' y='314' width='90' height='52' rx='8' fill='#ede9fe' stroke='#334155' stroke-width='1.8'/>
<text x='165' y='346.3' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>'r+'</text>
<text x='240' y='345' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>read and write; pointer at start</text>
<text x='140' y='410' font-size='14' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>'w' mode:</text>
<rect x='240' y='388' width='240' height='36' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='360' y='410.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>[old data] → [ ]</text>
<text x='500' y='410' font-size='14' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>'a' mode:</text>
<rect x='600' y='388' width='280' height='36' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='740' y='410.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>[old data] + [new]</text>
<text x='480' y='480' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Binary modes add 'b': 'rb', 'wb' — no text encoding translation</text>
</svg>
