<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>One-Dimensional Collision: Before and After</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Total momentum is conserved: m1u1 + m2u2 = m1v1 + m2v2</text>
<text x='250' y='130' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>BEFORE</text>
<line x1='90' y1='360' x2='460' y2='360' stroke='#334155' stroke-width='2.4'/>
<line x1='102' y1='360' x2='93' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='128' y1='360' x2='119' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='154' y1='360' x2='145' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='180' y1='360' x2='171' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='206' y1='360' x2='197' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='232' y1='360' x2='223' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='258' y1='360' x2='249' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='284' y1='360' x2='275' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='310' y1='360' x2='301' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='336' y1='360' x2='327' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='362' y1='360' x2='353' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='388' y1='360' x2='379' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='414' y1='360' x2='405' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='440' y1='360' x2='431' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<circle cx='170' cy='335' r='26' fill='#dbeafe' stroke='#2563eb' stroke-width='2.2'/>
<text x='170' y='340' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m1</text>
<line x1='196' y1='335' x2='276' y2='335' stroke='#2563eb' stroke-width='3'/>
<polygon points='276,335 266.789,338.894 266.789,331.106' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='290' y='325' font-size='13' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>u1</text>
<circle cx='370' cy='340' r='20' fill='#d1fae5' stroke='#059669' stroke-width='2.2'/>
<text x='370' y='345' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m2</text>
<text x='370' y='385' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>at rest (u2 = 0)</text>
<line x1='220' y1='300' x2='331' y2='300' stroke='#6b7280' stroke-width='2'/>
<polygon points='340,300 331,295.5 331,304.5' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<text x='280' y='285' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>approach</text>
<text x='700' y='130' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>AFTER</text>
<line x1='540' y1='360' x2='900' y2='360' stroke='#334155' stroke-width='2.4'/>
<line x1='552' y1='360' x2='543' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='578' y1='360' x2='569' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='604' y1='360' x2='595' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='630' y1='360' x2='621' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='656' y1='360' x2='647' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='682' y1='360' x2='673' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='708' y1='360' x2='699' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='734' y1='360' x2='725' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='760' y1='360' x2='751' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='786' y1='360' x2='777' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='812' y1='360' x2='803' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='838' y1='360' x2='829' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='864' y1='360' x2='855' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<line x1='890' y1='360' x2='881' y2='369' stroke='#6b7280' stroke-width='1.6'/>
<circle cx='620' cy='335' r='26' fill='#dbeafe' stroke='#2563eb' stroke-width='2.2'/>
<text x='620' y='340' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m1</text>
<line x1='646' y1='335' x2='696' y2='335' stroke='#2563eb' stroke-width='3'/>
<polygon points='696,335 686.789,338.894 686.789,331.106' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='710' y='325' font-size='13' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>v1</text>
<circle cx='810' cy='340' r='20' fill='#d1fae5' stroke='#059669' stroke-width='2.2'/>
<text x='810' y='345' font-size='12' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m2</text>
<line x1='830' y1='340' x2='890' y2='340' stroke='#059669' stroke-width='3'/>
<polygon points='890,340 880.789,343.894 880.789,336.106' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='904' y='330' font-size='13' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>v2</text>
<text x='700' y='385' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>both move forward</text>
<rect x='120' y='430' width='360' height='150' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='300' y='472.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Elastic collision:</text>
<text x='300' y='491.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>momentum CONSERVED and kinetic</text>
<text x='300' y='509.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>energy conserved (ideal bouncy balls;</text>
<text x='300' y='528.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>also: relative velocity reverses,</text>
<text x='300' y='546.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>u1 − u2 = v2 − v1)</text>
<rect x='520' y='430' width='340' height='150' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='690' y='472.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Inelastic collision:</text>
<text x='690' y='491.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>momentum conserved (ALWAYS),</text>
<text x='690' y='509.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>kinetic energy partly lost to</text>
<text x='690' y='528.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>heat/deformation; perfectly</text>
<text x='690' y='546.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>inelastic: they stick together</text>
<text x='480' y='615' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Momentum conservation holds even when energy does not — it is the deeper bookkeeping law</text>
<text x='480' y='642' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Sign convention: pick +x once; velocities crossing zero (bouncing back) enter the equation as negatives</text>
</svg>
