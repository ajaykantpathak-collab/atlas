<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Primary vs Secondary Memory</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Primary: CPU works on it directly · Secondary: permanent, high-capacity</text>
<rect x='90' y='100' width='350' height='56' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='265' y='133.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>PRIMARY MEMORY</text>
<rect x='90' y='180' width='120' height='62' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='150' y='216.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>RAM</text>
<text x='230' y='217' font-size='13' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>volatile — contents vanish at power-off; read/write</text>
<rect x='90' y='258' width='120' height='62' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='150' y='294.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>ROM</text>
<text x='230' y='295' font-size='13' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>non-volatile — startup firmware, written at factory</text>
<rect x='520' y='100' width='350' height='56' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='695' y='133.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SECONDARY STORAGE</text>
<rect x='520' y='180' width='150' height='62' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='595' y='215.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SSD / HDD</text>
<text x='690' y='217' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>operating system, applications, user files</text>
<rect x='520' y='258' width='150' height='62' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='595' y='293.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Optical / tape</text>
<text x='690' y='295' font-size='12.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>distribution and long-term archives</text>
<rect x='160' y='360' width='640' height='76' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='480' y='393.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Program must be loaded from secondary storage into RAM before the CPU can run it</text>
<text x='480' y='413.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Secondary media are non-volatile — data survives power loss</text>
</svg>
