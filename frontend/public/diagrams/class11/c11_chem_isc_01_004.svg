<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>The Mole: The Central Conversion Hub</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>One mole = 6.022 × 10²³ particles = molar mass in grams = 22.4 L of any gas at STP</text>
<circle cx='480' cy='300' r='130' fill='#fef3c7' stroke='#d97706' stroke-width='3'/>
<text x='480' y='280' font-size='20' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>MOLE (n)</text>
<text x='480' y='308' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 mol = 6.022 × 10²³</text>
<text x='480' y='332' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(Avogadro number, NA)</text>
<rect x='70' y='90' width='240' height='90' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='190' y='120.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>MASS (g)</text>
<text x='190' y='140.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>n = given mass /</text>
<text x='190' y='160.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>molar mass (M)</text>
<rect x='650' y='90' width='240' height='90' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='770' y='120.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>PARTICLES</text>
<text x='770' y='140.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>n = N / NA</text>
<text x='770' y='160.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(atoms, molecules, ions)</text>
<rect x='70' y='430' width='240' height='90' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='190' y='460.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>VOLUME (gas, STP)</text>
<text x='190' y='480.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>n = V / 22.4</text>
<text x='190' y='500.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(V in litres)</text>
<rect x='650' y='430' width='240' height='90' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='770' y='460.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>SOLUTION CONC.</text>
<text x='770' y='480.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>n = M × V(L)</text>
<text x='770' y='500.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(molarity)</text>
<line x1='310' y1='135' x2='353.239' y2='204.362' stroke='#334155' stroke-width='2.6'/>
<polygon points='358,212 357.058,201.982 349.42,206.743' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='602' y1='212' x2='645.239' y2='142.638' stroke='#334155' stroke-width='2.6'/>
<polygon points='650,135 641.42,140.257 649.058,145.018' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='310' y1='475' x2='353.652' y2='395.88' stroke='#334155' stroke-width='2.6'/>
<polygon points='358,388 349.712,393.706 357.592,398.054' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='602' y1='388' x2='645.652' y2='467.12' stroke='#334155' stroke-width='2.6'/>
<polygon points='650,475 649.592,464.946 641.712,469.294' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='480' y='470' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>every road goes THROUGH the mole</text>
<text x='480' y='560' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Worked: 8 g O2 → n = 8/32 = 0.25 mol → 0.25 × 6.022 × 10²³ = 1.5 × 10²³ molecules</text>
<text x='480' y='590' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Gay-Lussac link: 1 mol of ANY ideal gas occupies 22.4 L at STP (0 °C, 1 bar) regardless of identity</text>
<text x='480' y='618' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Molar mass trick: numerically equal to molecular/atomic mass in u — H2O: 18 u ↔ 18 g/mol</text>
</svg>
