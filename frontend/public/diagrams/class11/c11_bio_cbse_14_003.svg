<line x1='452' y1='240' x2='469' y2='240' stroke='#2563eb' stroke-width='3.4'/>
<polygon points='478,240 469,235.5 469,244.5' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<rect x='453.8' y='220' width='22.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='465' y='234' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>O2</text>
<line x1='478' y1='350' x2='461' y2='350' stroke='#6b7280' stroke-width='3.4'/>
<polygon points='452,350 461,354.5 461,345.5' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<rect x='450.2' y='330' width='29.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='465' y='344' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>CO2</text>
<rect x='120' y='430' width='189.2' height='22' rx='11' fill='#dbeafe' stroke='#6b7280' stroke-width='1.2'/>
<text x='214.6' y='446' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>alveoli: PO2 ≈ 104 mm Hg</text>
<rect x='120' y='462' width='233' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='236.5' y='478' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>blood arriving: PO2 ≈ 40 mm Hg</text>
<rect x='120' y='494' width='189.2' height='22' rx='11' fill='#d1fae5' stroke='#6b7280' stroke-width='1.2'/>
<text x='214.6' y='510' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ O2 diffuses INTO blood</text>
<rect x='640' y='430' width='189.2' height='22' rx='11' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.2'/>
<text x='734.6' y='446' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>alveoli: PCO2 ≈ 40 mm Hg</text>
<rect x='640' y='462' width='240.3' height='22' rx='11' fill='#fee2e2' stroke='#6b7280' stroke-width='1.2'/>
<text x='760.15' y='478' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>blood arriving: PCO2 ≈ 45 mm Hg</text>
<rect x='640' y='494' width='218.4' height='22' rx='11' fill='#d1fae5' stroke='#6b7280' stroke-width='1.2'/>
<text x='749.2' y='510' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ CO2 diffuses INTO alveolus</text>
<text x='480' y='560' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Thickness of the barrier ≈ 0.5 micrometre — short distance, huge surface (~70 m²) = fast exchange</text>
<text x='480' y='590' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Solubility matters: CO2 diffuses ~20x faster than O2 even with a smaller gradient</text>
</svg>
