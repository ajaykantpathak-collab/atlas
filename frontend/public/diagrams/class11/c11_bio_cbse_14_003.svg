<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Alveolar Gas Exchange</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Diffusion only — gases move down their own partial-pressure gradients</text>
<path d='M 300 151.6 Q 343.597 167.697 387.194 183.794 Q 411.774 214.611 436.355 245.428 Q 444.494 281.745 452.634 318.063 Q 418.241 350.527 383.848 382.99 Q 341.924 388.967 300 394.943 Q 253.484 383.586 206.967 372.228 Q 187.068 345.675 167.168 319.122 Q 159.643 280.356 152.118 241.59 Q 181.089 215.373 210.061 189.156 Q 255.03 170.378 300 151.6 Z' fill='#dbeafe' stroke='#2563eb' stroke-width='2.6'/>
<text x='300' y='270' font-size='17' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>ALVEOLUS</text>
<text x='300' y='294' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>air sac, one-cell-thick wall</text>
<rect x='470' y='160' width='60' height='320' rx='30' fill='#fee2e2' stroke='#dc2626' stroke-width='1.6'/>
<text x='500' y='140' font-size='14' fill='#dc2626' text-anchor='middle' font-weight='600' font-style='normal'>pulmonary capillary</text>
