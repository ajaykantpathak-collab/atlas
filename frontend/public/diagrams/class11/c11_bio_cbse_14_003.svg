<polygon points='500,190 495.5,199 504.5,199' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='526' y='318' width='80' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='566' y='332' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>blood flow</text>
<path d='M 500 216.35 Q 508.532 219.148 517.065 221.947 Q 518.918 227.35 520.771 232.753 Q 515.397 237.343 510.022 241.934 Q 500.405 242.078 490.789 242.222 Q 484.706 237.514 478.623 232.806 Q 480.372 227.495 482.122 222.184 Q 491.061 219.267 500 216.35 Z' fill='#fecaca' stroke='#dc2626' stroke-width='1.8'/>
