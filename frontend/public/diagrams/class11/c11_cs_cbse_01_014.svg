<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Boolean Algebra — the System</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Two values, three operators, laws, and their realisation as gates</text>
<rect x='110' y='110' width='330' height='110' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='275' y='148.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Values</text>
<text x='275' y='170.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>0 (false) · 1</text>
<text x='275' y='192.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(true)</text>
<rect x='520' y='110' width='330' height='110' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='685' y='148.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Operators</text>
<text x='685' y='170.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>AND (·) · OR</text>
<text x='685' y='192.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(+) · NOT (')</text>
<rect x='110' y='330' width='330' height='110' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='275' y='368.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Laws</text>
<text x='275' y='390.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>commutative · associative ·</text>
<text x='275' y='412.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>distributive · complement · De Morgan</text>
<rect x='520' y='330' width='330' height='110' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='685' y='368.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Realisation</text>
<text x='685' y='390.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>logic gates wired into</text>
<text x='685' y='412.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>digital circuits</text>
<line x1='440' y1='165' x2='511' y2='165' stroke='#334155' stroke-width='2.2'/>
<polygon points='520,165 511,160.5 511,169.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='770' y1='220' x2='770' y2='321' stroke='#334155' stroke-width='2.2'/>
<polygon points='770,330 774.5,321 765.5,321' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='440' y1='385' x2='511' y2='385' stroke='#334155' stroke-width='2.2'/>
<polygon points='520,385 511,380.5 511,389.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='275' y1='220' x2='275' y2='321' stroke='#334155' stroke-width='2.2'/>
<polygon points='275,330 279.5,321 270.5,321' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='480' y='500' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Any switching circuit can be described by a Boolean expression and minimised with the laws</text>
</svg>
