<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Graphical Vector Addition</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Triangle law: place head to tail; the resultant closes the triangle</text>
<line x1='200' y1='420' x2='460' y2='280' stroke='#2563eb' stroke-width='3'/>
<polygon points='460,280 453.737,287.795 450.044,280.938' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='474' y='270' font-size='15' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>A</text>
<line x1='460' y1='280' x2='640' y2='370' stroke='#059669' stroke-width='3'/>
<polygon points='640,370 630.02,369.364 633.503,362.398' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='654' y='360' font-size='15' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>B</text>
<line x1='200' y1='420' x2='640' y2='370' stroke='#dc2626' stroke-width='3'/>
<polygon points='640,370 631.288,374.909 630.409,367.171' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='654' y='360' font-size='15' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>R = A + B</text>
<circle cx='200' cy='420' r='4' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='180' y='448' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>start</text>
<line x1='200' y1='420' x2='380' y2='510' stroke='#94a3b8' stroke-width='1.8'/>
<polygon points='380,510 370.02,509.364 373.503,502.398' fill='#94a3b8' stroke='#94a3b8' stroke-width='1'/>
<line x1='460' y1='280' x2='720' y2='140' stroke='#94a3b8' stroke-width='1.8'/>
<polygon points='720,140 713.737,147.795 710.044,140.938' fill='#94a3b8' stroke='#94a3b8' stroke-width='1'/>
<text x='700' y='340' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>same answer by the</text>
<text x='700' y='358' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>parallelogram law:</text>
<text x='700' y='376' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>both vectors from one</text>
<text x='700' y='394' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>point; R is the diagonal</text>
<rect x='120' y='520' width='340' height='80' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='290' y='546.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Order does not matter:</text>
<text x='290' y='564.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>A + B = B + A (commutative)</text>
<text x='290' y='583.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>— vectors add like numbers</text>
<rect x='510' y='520' width='330' height='80' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='675' y='536.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Subtraction:</text>
<text x='675' y='555.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>A − B = A + (−B):</text>
<text x='675' y='573.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>reverse B, then add head-</text>
<text x='675' y='592.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>to-tail as usual</text>
<text x='480' y='630' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Vectors carry magnitude AND direction — displacements 3 m east + 4 m north = 5 m at 53° (not 7 m!)</text>
</svg>
