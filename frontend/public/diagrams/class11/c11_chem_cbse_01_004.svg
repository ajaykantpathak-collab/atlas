<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Gay-Lussac's Law of Combining Volumes</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Gases react in SIMPLE whole-number volume ratios (same T, P)</text>
<rect x='80' y='200' width='200' height='120' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='180' y='244.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>100 mL</text>
<text x='180' y='265.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>hydrogen</text>
<text x='180' y='286.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(H2)</text>
<rect x='80' y='350' width='200' height='120' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='180' y='394.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>50 mL</text>
<text x='180' y='415.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>oxygen</text>
<text x='180' y='436.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(O2)</text>
<text x='115' y='190' font-size='13' fill='#2563eb' text-anchor='middle' font-weight='normal' font-style='normal'>2 volumes</text>
<text x='115' y='340' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>1 volume</text>
<line x1='300' y1='280' x2='371' y2='280' stroke='#334155' stroke-width='3'/>
<polygon points='380,280 371,275.5 371,284.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='318' y='260' width='44' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='340' y='274' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>spark</text>
<rect x='390' y='200' width='200' height='120' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='490' y='244.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>100 mL</text>
<text x='490' y='265.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>steam</text>
<text x='490' y='286.6' font-size='16' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(H2O vapour)</text>
<text x='490' y='350' font-size='13' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>2 volumes</text>
<text x='490' y='372' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(measured back at same T, P)</text>
<rect x='640' y='160' width='280' height='200' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='780' y='201.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>The ratio 2 : 1 : 2 is also the</text>
<text x='780' y='219.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>coefﬁcient ratio of the balanced</text>
<text x='780' y='237.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>equation:</text>
<text x='780' y='255.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>2H2(g) + O2(g) → 2H2O(g)</text>
<text x='780' y='273.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<text x='780' y='291.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Volumes of GASES combine like</text>
<text x='780' y='309.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>counting molecules — equal volumes</text>
<text x='780' y='327.55' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>hold equal molecules (Avogadro)</text>
<text x='480' y='560' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why this law was shocking: it implies equal volumes of all gases contain equal numbers of molecules</text>
<text x='480' y='590' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>That is Avogadro's hypothesis — the missing piece that made atomic masses measurable</text>
<text x='480' y='620' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Ratios are of volumes at the SAME temperature and pressure (usually measured after cooling to common conditions)</text>
</svg>
