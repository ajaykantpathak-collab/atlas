<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Operating System — Resource Manager</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The OS sits between applications and hardware, allocating every resource</text>
<rect x='200' y='110' width='560' height='96' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='480' y='141.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Users &amp; application software</text>
<text x='480' y='163.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>browser, games, editors</text>
<text x='480' y='185.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'></text>
<rect x='200' y='230' width='560' height='96' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='480' y='261.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Operating system</text>
<text x='480' y='283.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>CPU scheduling · memory</text>
<text x='480' y='305.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>allocation · file system · device drivers · security</text>
<rect x='200' y='350' width='560' height='96' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='480' y='381.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Hardware</text>
<text x='480' y='403.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>CPU · RAM ·</text>
<text x='480' y='425.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>disks · keyboard · display</text>
<line x1='150' y1='170' x2='150' y2='241' stroke='#334155' stroke-width='2.2'/>
<polygon points='150,250 154.5,241 145.5,241' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='117.2' y='190' width='65.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='150' y='204' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>services</text>
<line x1='810' y1='250' x2='810' y2='179' stroke='#059669' stroke-width='2.2'/>
<polygon points='810,170 805.5,179 814.5,179' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='780.8' y='190' width='58.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='810' y='204' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>results</text>
<text x='480' y='490' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The OS controls and coordinates hardware use; applications request resources through it</text>
</svg>
