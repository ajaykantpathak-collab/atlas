<text x='700' y='130' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>Reading order:</text>
<text x='700' y='156' font-size='13.5' fill='#d97706' text-anchor='start' font-weight='600' font-style='normal'>1s 2s 2p 3s 3p 4s 3d</text>
<text x='700' y='176' font-size='13.5' fill='#d97706' text-anchor='start' font-weight='600' font-style='normal'>4p 5s 4d 5p 6s 4f ...</text>
<rect x='660' y='220' width='260' height='120' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='790' y='256.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Surprise to remember:</text>
<text x='790' y='275.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>4s fills BEFORE 3d</text>
<text x='790' y='293.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>(lower energy despite</text>
<text x='790' y='312.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>higher n)</text>
<text x='480' y='500' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Example: Fe (Z = 26) → 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶</text>
<text x='480' y='534' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Cr and Cu exceptions: half-filled/filled d shells (3d⁵ 4s¹, 3d¹⁰ 4s¹) are extra stable</text>
<text x='480' y='564' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Hund's rule: within one p/d/f set, electrons spread singly before pairing</text>
<text x='480' y='594' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Pauli rule: max 2 electrons per orbital, opposite spins only</text>
