<text x='500' y='160' font-size='15' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>X + X'·Y</text>
<text x='500' y='194' font-size='15' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>= (X + X') · (X + Y)   distributive</text>
<text x='500' y='228' font-size='15' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>= 1 · (X + Y)              complement (X + X' = 1)</text>
