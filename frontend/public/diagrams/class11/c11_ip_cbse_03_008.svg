<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>The `while` Loop</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>repeat the body while the condition stays True</text>
<rect x='390' y='80' width='180' height='50' rx='25' fill='#dbeafe' stroke='#334155' stroke-width='2'/>
<text x='480' y='110.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>start</text>
<line x1='480' y1='130' x2='480' y2='145' stroke='#334155' stroke-width='2.2'/>
<polygon points='480,154 484.5,145 475.5,145' fill='#334155' stroke='#334155' stroke-width='1'/>
<path d='M 480 154 L 570 209 L 480 264 L 390 209 Z' fill='#ede9fe' stroke='#334155' stroke-width='2'/>
<text x='480' y='214.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>condition True?</text>
<line x1='480' y1='264' x2='480' y2='291' stroke='#059669' stroke-width='2.2'/>
<polygon points='480,300 484.5,291 475.5,291' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='422' y='262' width='116' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='480' y='276' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>True — run body</text>
<rect x='360' y='300' width='240' height='60' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='2'/>
<text x='480' y='335.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>loop body</text>
<line x1='600' y1='330' x2='740' y2='330' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='740' y1='330' x2='740' y2='209' stroke='#334155' stroke-width='2.2' fill='none'/>
<line x1='740' y1='209' x2='579' y2='209' stroke='#334155' stroke-width='2.2'/>
<polygon points='570,209 579,213.5 579,204.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='750' y='280' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>loop back —</text>
<text x='750' y='296' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>test again</text>
<line x1='390' y1='209' x2='259' y2='209' stroke='#dc2626' stroke-width='2.2'/>
<polygon points='250,209 259,213.5 259,204.5' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='272.8' y='189' width='94.4' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='320' y='203' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>False — exit</text>
<rect x='120' y='184' width='130' height='50' rx='25' fill='#dbeafe' stroke='#334155' stroke-width='2'/>
<text x='185' y='214.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>next</text>
<text x='480' y='420' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>The body must change something the condition uses — otherwise the loop never ends</text>
<text x='480' y='448' font-size='14' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>(infinite loop)</text>
</svg>
