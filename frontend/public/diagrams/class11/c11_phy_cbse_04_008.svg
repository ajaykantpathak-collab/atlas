<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Free-Body Diagram of a Block on a Table</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>One object, ALL forces acting ON it, drawn from its centre</text>
<line x1='80' y1='400' x2='420' y2='400' stroke='#334155' stroke-width='2.4'/>
<line x1='92' y1='400' x2='83' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='118' y1='400' x2='109' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='144' y1='400' x2='135' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='170' y1='400' x2='161' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='196' y1='400' x2='187' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='222' y1='400' x2='213' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='248' y1='400' x2='239' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='274' y1='400' x2='265' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='300' y1='400' x2='291' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='326' y1='400' x2='317' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='352' y1='400' x2='343' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='378' y1='400' x2='369' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<line x1='404' y1='400' x2='395' y2='409' stroke='#6b7280' stroke-width='1.6'/>
<rect x='160' y='340' width='120' height='60' rx='6' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='220' y='375' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>block m</text>
<text x='250' y='424' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>table</text>
<line x1='280' y1='370' x2='370' y2='370' stroke='#7c3aed' stroke-width='3'/>
<polygon points='370,370 360.789,373.894 360.789,366.106' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='384' y='360' font-size='13' fill='#7c3aed' text-anchor='start' font-weight='700' font-style='normal'>F (pull)</text>
<circle cx='660' cy='300' r='34' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='660' y='305' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m</text>
<line x1='660' y1='266' x2='660' y2='156' stroke='#059669' stroke-width='3'/>
<polygon points='660,156 663.894,165.211 656.106,165.211' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='674' y='146' font-size='13.5' fill='#059669' text-anchor='start' font-weight='700' font-style='normal'>N (normal)</text>
<line x1='660' y1='334' x2='660' y2='444' stroke='#dc2626' stroke-width='3'/>
<polygon points='660,444 656.106,434.789 663.894,434.789' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='674' y='434' font-size='13.5' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>W = mg</text>
<line x1='694' y1='300' x2='804' y2='300' stroke='#7c3aed' stroke-width='3'/>
<polygon points='804,300 794.789,303.894 794.789,296.106' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='818' y='290' font-size='13.5' fill='#7c3aed' text-anchor='start' font-weight='700' font-style='normal'>F</text>
<line x1='626' y1='300' x2='516' y2='300' stroke='#2563eb' stroke-width='3'/>
<polygon points='516,300 525.211,296.106 525.211,303.894' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='502' y='290' font-size='13.5' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>f (friction)</text>
<rect x='80' y='470' width='380' height='120' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='270' y='506.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Read the FBD:</text>
<text x='270' y='525.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>vertical balance: N = W (no vertical motion)</text>
<text x='270' y='543.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>horizontal: F − f = ma (it speeds up)</text>
<text x='270' y='562.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>friction OPPOSES relative sliding</text>
<rect x='500' y='470' width='380' height='120' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='690' y='506.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Force families:</text>
<text x='690' y='525.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>contact: normal, friction, tension</text>
<text x='690' y='543.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>long-range: weight (gravity),</text>
<text x='690' y='562.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>electrostatic, magnetic</text>
<text x='480' y='625' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Newton's third law pairs never appear together in one FBD — N and W act on DIFFERENT bodies</text>
</svg>
