<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>ΔG Decides: Spontaneous or Not?</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔG = ΔH − TΔS — the sign of ΔG is the verdict</text>
<line x1='120' y1='300' x2='840' y2='300' stroke='#334155' stroke-width='2.6'/>
<line x1='840' y1='300' x2='843' y2='300' stroke='#334155' stroke-width='2.6'/>
<polygon points='852,300 843,295.5 843,304.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='860' y='305' font-size='15' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>ΔG</text>
<circle cx='480' cy='300' r='6' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='480' y='330' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔG = 0 → equilibrium</text>
<text x='300' y='270' font-size='16' fill='#059669' text-anchor='middle' font-weight='700' font-style='normal'>ΔG &lt; 0</text>
<text x='300' y='292' font-size='13' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>SPONTANEOUS</text>
<text x='660' y='270' font-size='16' fill='#dc2626' text-anchor='middle' font-weight='700' font-style='normal'>ΔG &gt; 0</text>
<text x='660' y='292' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='normal' font-style='normal'>NON-SPONTANEOUS</text>
<line x1='300' y1='240' x2='371' y2='240' stroke='#059669' stroke-width='2.4'/>
<polygon points='380,240 371,235.5 371,244.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<text x='340' y='226' font-size='12' fill='#059669' text-anchor='start' font-weight='normal' font-style='normal'>happens by itself</text>
<line x1='660' y1='240' x2='589' y2='240' stroke='#dc2626' stroke-width='2.4' stroke-dasharray='6,5'/>
<polygon points='580,240 589,244.5 589,235.5' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='620' y='226' font-size='12' fill='#dc2626' text-anchor='start' font-weight='normal' font-style='normal'>needs continuous input</text>
<rect x='100' y='380' width='360' height='130' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='280' y='412.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Four outcomes:</text>
<text x='280' y='431.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ΔH −, ΔS + → always spontaneous</text>
<text x='280' y='449.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ΔH +, ΔS − → never spontaneous</text>
<text x='280' y='468.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ΔH −, ΔS − and ΔH +, ΔS + →</text>
<text x='280' y='486.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>temperature decides!</text>
<rect x='520' y='380' width='340' height='130' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='690' y='412.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Example of T-decides:</text>
<text x='690' y='431.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ice melting: ΔH +, ΔS +</text>
<text x='690' y='449.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>below 0 °C → ΔG + (stays frozen)</text>
<text x='690' y='468.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>above 0 °C → ΔG − (melts)</text>
<text x='690' y='486.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>crossover: ΔG = 0 = equilibrium</text>
<text x='480' y='560' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>ΔH = heat content change (order/disorder of bonds) · ΔS = entropy change (spread of energy)</text>
<text x='480' y='590' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>'Spontaneous' means thermodynamically allowed — NOT necessarily fast (diamond → graphite is spontaneous, but slow)</text>
<text x='480' y='618' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Standard state reminder: ΔG° values use 1 bar, 298 K, 1 M solutions</text>
</svg>
