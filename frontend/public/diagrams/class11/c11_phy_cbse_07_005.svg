<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>How g Changes with Height</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>g(h) = GM / (R + h)² — falls as the SQUARE of distance from the centre</text>
<circle cx='330' cy='330' r='130' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<text x='330' y='336' font-size='16' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>Earth</text>
<text x='330' y='358' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>mass M, radius R</text>
<circle cx='330' cy='330' r='260' fill='none' stroke='#6b7280' stroke-width='1.4'/>
<circle cx='542.98' cy='180.87' r='13' fill='#f3f4f6' stroke='#6b7280' stroke-width='2.2'/>
<text x='542.98' y='185.87' font-size='11' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m</text>
<line x1='330' y1='330' x2='532.98' y2='172.87' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='4,4'/>
<text x='500' y='206.87' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>R + h</text>
<line x1='542.98' y1='180.87' x2='493.83' y2='215.285' stroke='#dc2626' stroke-width='3'/>
<polygon points='493.83,215.285 499.142,206.812 503.609,213.192' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='479.83' y='205.285' font-size='13' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>g(h)</text>
<text x='568.98' y='220.87' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>h above surface</text>
<rect x='640' y='150' width='290' height='150' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='785' y='192.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Numbers to feel:</text>
<text x='785' y='211.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>g surface = 9.8 m/s²</text>
<text x='785' y='229.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>at h = R (2R from centre):</text>
<text x='785' y='248.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>g = 9.8/4 ≈ 2.45</text>
<text x='785' y='266.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>at h = 3R: g = 9.8/16</text>
<rect x='640' y='330' width='290' height='140' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='785' y='376.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Compare — same idea:</text>
<text x='785' y='395.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>depth d below surface:</text>
<text x='785' y='413.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>g decreases LINEARLY:</text>
<text x='785' y='432.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>g(d) = g (1 − d/R)</text>
<text x='480' y='530' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Inverse-square logic: the same field lines spread over area 4πr² — double the distance, one quarter the strength</text>
<text x='480' y='562' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>g at height NEVER becomes zero (only tends to zero) — gravity has infinite range</text>
<text x='480' y='594' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Weightlessness in orbit is free-fall, NOT absence of gravity: at ISS height g ≈ 8.7 m/s²</text>
<text x='480' y='624' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Assumption: Earth is a uniform sphere; g also varies slightly with latitude (rotation, shape)</text>
</svg>
