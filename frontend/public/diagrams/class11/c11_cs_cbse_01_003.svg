<polygon points='480,500 484.5,491 475.5,491' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='321.2' y='450' width='317.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='480' y='464' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>digitised input → CPU → processing → output</text>
