<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Inflorescence: Racemose vs Cymose</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Two arrangement plans of flowers on the floral axis</text>
<rect x='60' y='90' width='380' height='470' rx='12' fill='white' stroke='#6b7280' stroke-width='1.6'/>
<text x='250' y='122' font-size='19' fill='#059669' text-anchor='middle' font-weight='700' font-style='normal'>RACEMOSE</text>
<text x='250' y='144' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>axis keeps growing; flowers open bottom-up</text>
<line x1='250' y1='530' x2='250' y2='175' stroke='#334155' stroke-width='3.2'/>
<line x1='250' y1='178' x2='250' y2='175' stroke='#334155' stroke-width='3.2'/>
<polygon points='250,166 245.5,175 254.5,175' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='268' y='168' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>growing point</text>
<line x1='250' y1='500' x2='250' y2='482' stroke='#334155' stroke-width='1.8'/>
<line x1='250' y1='482' x2='188' y2='454' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='188' cy='448' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<text x='154' y='460' font-size='12' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>older (open first)</text>
<line x1='250' y1='430' x2='250' y2='412' stroke='#334155' stroke-width='1.8'/>
<line x1='250' y1='412' x2='312' y2='384' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='312' cy='378' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='250' y1='360' x2='250' y2='342' stroke='#334155' stroke-width='1.8'/>
<line x1='250' y1='342' x2='188' y2='314' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='188' cy='308' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='250' y1='290' x2='250' y2='272' stroke='#334155' stroke-width='1.8'/>
<line x1='250' y1='272' x2='312' y2='244' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='312' cy='238' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='250' y1='225' x2='250' y2='207' stroke='#334155' stroke-width='1.8'/>
<line x1='250' y1='207' x2='188' y2='179' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='188' cy='173' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<text x='154' y='185' font-size='12' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>younger bud</text>
<rect x='520' y='90' width='380' height='470' rx='12' fill='white' stroke='#6b7280' stroke-width='1.6'/>
<text x='710' y='122' font-size='19' fill='#dc2626' text-anchor='middle' font-weight='700' font-style='normal'>CYMOSE</text>
<text x='710' y='144' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>main axis ends in a flower; side branches take over</text>
<line x1='710' y1='530' x2='710' y2='260' stroke='#334155' stroke-width='3.2'/>
<g><circle cx='710' cy='245' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<text x='760' y='240' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>oldest flower first</text>
<line x1='710' y1='400' x2='610' y2='330' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='610' cy='318' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='610' y1='330' x2='610' y2='430' stroke='#334155' stroke-width='1.8'/>
<line x1='610' y1='430' x2='570' y2='480' stroke='#334155' stroke-width='1.8'/>
<line x1='610' y1='430' x2='650' y2='480' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='570' cy='490' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<g><circle cx='650' cy='490' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='710' y1='400' x2='810' y2='330' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='810' cy='318' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<line x1='810' y1='330' x2='810' y2='430' stroke='#334155' stroke-width='1.8'/>
<line x1='810' y1='430' x2='770' y2='480' stroke='#334155' stroke-width='1.8'/>
<line x1='810' y1='430' x2='850' y2='480' stroke='#334155' stroke-width='1.8'/>
<g><circle cx='770' cy='490' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<g><circle cx='850' cy='490' r='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/></g>
<text x='480' y='590' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Key contrast: racemose = unlimited (indeterminate) axis · cymose = limited (determinate) axis</text>
</svg>
