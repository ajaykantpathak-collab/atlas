<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Flowchart Symbols</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Standard shapes for every step kind</text>
<rect x='130' y='100' width='150' height='56' rx='28' fill='#dbeafe' stroke='#334155' stroke-width='2'/>
<text x='205' y='133.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>START</text>
<text x='320' y='125' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>Terminator</text>
<text x='320' y='146' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>START / STOP — entry and exit points</text>
<rect x='130' y='182' width='150' height='56' rx='8' fill='#d1fae5' stroke='#334155' stroke-width='2'/>
<text x='205' y='215.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Process</text>
<text x='320' y='207' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>Process</text>
<text x='320' y='228' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>an action or computation</text>
<path d='M 151.538 264 L 280 264 L 258.462 320 L 130 320 Z' fill='#fef3c7' stroke='#334155' stroke-width='2'/>
<text x='205' y='297.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Input/Output</text>
<text x='320' y='289' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>Input/Output</text>
<text x='320' y='310' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>read data or display results</text>
<path d='M 205 346 L 280 374 L 205 402 L 130 374 Z' fill='#ede9fe' stroke='#334155' stroke-width='2'/>
<text x='205' y='379.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Decision</text>
<text x='320' y='371' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>Decision</text>
<text x='320' y='392' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>a yes/no question — two exits</text>
<line x1='150' y1='456' x2='251' y2='456' stroke='#334155' stroke-width='2.2'/>
<polygon points='260,456 251,451.5 251,460.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='320' y='453' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>Flow line</text>
<text x='320' y='474' font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>arrow showing the order of steps</text>
<text x='480' y='540' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Every flowchart begins and ends with a terminator; decisions always have exactly two labelled exits</text>
</svg>
