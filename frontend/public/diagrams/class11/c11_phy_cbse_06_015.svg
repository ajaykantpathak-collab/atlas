<line x1='560' y1='339.474' x2='552' y2='348.474' stroke='#6b7280' stroke-width='1.4'/>
<line x1='600' y1='334.211' x2='592' y2='343.211' stroke='#6b7280' stroke-width='1.4'/>
<line x1='640' y1='328.947' x2='632' y2='337.947' stroke='#6b7280' stroke-width='1.4'/>
<line x1='680' y1='323.684' x2='672' y2='332.684' stroke='#6b7280' stroke-width='1.4'/>
