<line x1='840' y1='302.632' x2='832' y2='311.632' stroke='#6b7280' stroke-width='1.4'/>
<text x='150' y='430' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>incline θ</text>
<circle cx='470' cy='315' r='55' fill='#dbeafe' stroke='#2563eb' stroke-width='2.6'/>
<line x1='470' y1='315' x2='521.683' y2='296.189' stroke='#2563eb' stroke-width='2.4'/>
<circle cx='470' cy='315' r='5' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='470' y='240' font-size='13' fill='#2563eb' text-anchor='start' font-weight='600' font-style='normal'>v_cm = ωR down the slope</text>
<line x1='540' y1='355' x2='630' y2='343' stroke='#2563eb' stroke-width='3'/>
<polygon points='630,343 621.385,348.077 620.356,340.357' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='644' y='333' font-size='13' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>v_cm</text>
<path d='M 440 277 A 48 48 0 0 1 504 281' fill='none' stroke='#d97706' stroke-width='2'/>
<polygon points='504,281 496.04,281.799 497.881,275.846' fill='#d97706' stroke='#d97706' stroke-width='1'/>
<text x='532' y='273' font-size='15' fill='#d97706' text-anchor='start' font-weight='700' font-style='normal'>ω</text>
<circle cx='462.821' cy='260.471' r='5' fill='#dc2626' stroke='#334155' stroke-width='1.6'/>
<text x='448.821' y='284.471' font-size='12.5' fill='#dc2626' text-anchor='end' font-weight='normal' font-style='normal'>contact point: momentarily AT REST</text>
<rect x='600' y='430' width='330' height='160' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='765' y='477.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Energy split:</text>
<text x='765' y='496.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>KE = ½Mv² + ½Iω²</text>
<text x='765' y='514.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>solid sphere: KE = (7/10)Mv²</text>
<text x='765' y='533.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>→ rolling bodies beat sliding ones</text>
<text x='765' y='551.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>down the same slope</text>
<text x='330' y='500' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>a = g sinθ / (1 + I/MR²)</text>
<text x='330' y='526' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>sphere 5/7 · disc 2/3 · ring 1/2 of g sinθ</text>
<text x='480' y='580' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Rolling = pure rotation about the contact point INSTANT by instant (same physics, two views)</text>
<text x='480' y='610' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Static friction supplies the torque — it does NO work, which is why mechanical energy is conserved</text>
<text x='480' y='638' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>v = ωR fails when the object slips: then friction is kinetic and energy leaks as heat</text>
</svg>
