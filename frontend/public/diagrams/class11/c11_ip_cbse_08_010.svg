<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Safe Browsing — HTTP vs HTTPS</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Encrypted traffic protects what you send from eavesdroppers</text>
<rect x='110' y='180' width='75.9' height='50.6' rx='4' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<rect x='137.6' y='230.6' width='20.7' height='10.35' rx='8' fill='#6b7280' stroke='none' stroke-width='1.6'/>
<rect x='123.8' y='240.95' width='48.3' height='6.9' rx='2' fill='#334155' stroke='none' stroke-width='1.6'/>
<text x='147.95' y='265.1' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>You</text>
<rect x='680' y='170' width='67.2' height='19.2' rx='3' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<circle cx='692' cy='179.6' r='2.88' fill='#059669' stroke='none' stroke-width='1.6'/>
<rect x='680' y='194' width='67.2' height='19.2' rx='3' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<circle cx='692' cy='203.6' r='2.88' fill='#059669' stroke='none' stroke-width='1.6'/>
<rect x='680' y='218' width='67.2' height='19.2' rx='3' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<circle cx='692' cy='227.6' r='2.88' fill='#059669' stroke='none' stroke-width='1.6'/>
<text x='713.6' y='256.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>Website</text>
<line x1='215' y1='215' x2='666' y2='215' stroke='#dc2626' stroke-width='2.2'/>
<polygon points='675,215 666,210.5 666,219.5' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<rect x='264.6' y='195' width='360.8' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='445' y='209' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>HTTP: plain text — anyone on the path can read it</text>
<line x1='675' y1='290' x2='224' y2='290' stroke='#059669' stroke-width='2.2'/>
<polygon points='215,290 224,294.5 224,285.5' fill='#059669' stroke='#059669' stroke-width='1'/>
<rect x='257.4' y='270' width='375.2' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='445' y='284' font-size='12' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>HTTPS: encrypted (TLS) — unreadable to interceptors</text>
<rect x='170' y='360' width='280' height='90' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='310' y='400.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Look for:</text>
<text x='310' y='420.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>padlock icon + https:// in the address bar</text>
<rect x='510' y='360' width='290' height='90' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='655' y='400.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Still verify:</text>
<text x='655' y='420.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the domain name — encryption does not mean trustworthy</text>
<text x='480' y='490' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Also: keep the browser updated, avoid saving passwords on shared computers</text>
</svg>
