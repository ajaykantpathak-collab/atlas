<g font-size="17" fill="#233">
<line x1="255" y1="150" x2="80" y2="120" stroke="#555"/><text x="20" y="112">Lamina (leaf blade)</text>
<line x1="288" y1="230" x2="80" y2="230" stroke="#555"/><text x="20" y="224">Midrib</text>
<line x1="360" y1="180" x2="560" y2="140" stroke="#555"/><text x="566" y="134">Veins (reticulate venation)</text>
<line x1="322" y1="452" x2="560" y2="360" stroke="#555"/><text x="566" y="356">Petiole (leaf stalk)</text>
<line x1="268" y1="470" x2="560" y2="420" stroke="#555"/><text x="566" y="416">Leaf base with stipules</text>
<line x1="352" y1="436" x2="560" y2="474" stroke="#555"/><text x="566" y="470">Axillary bud (in the axil)</text>
</g>
<!-- insets: venation + phyllotaxy -->
<g font-size="15" fill="#233">
