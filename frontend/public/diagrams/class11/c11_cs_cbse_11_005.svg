<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Transmission Media</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Guided media carry signals through a solid conductor; unguided media travel through air/space</text>
<rect x='90' y='100' width='300' height='48' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='240' y='129.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Guided (wired) media</text>
<rect x='570' y='100' width='300' height='48' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='720' y='129.95' font-size='17' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Unguided (wireless) media</text>
<rect x='90' y='178' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='240' y='212.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Twisted pair</text>
<text x='240' y='232.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>two insulated copper wires twisted together — cheap, short range</text>
<rect x='90' y='274' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='240' y='308.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Coaxial cable</text>
<text x='240' y='328.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>central copper core with braided shield — TV / older LANs</text>
<rect x='90' y='370' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='240' y='404.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Optical fibre</text>
<text x='240' y='424.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>light pulses in glass core — fastest, long distance, no EMI</text>
<rect x='570' y='178' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='720' y='212.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Radio</text>
<text x='720' y='232.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>omnidirectional — FM, Wi-Fi, mobile networks</text>
<rect x='570' y='274' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='720' y='308.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Microwave</text>
<text x='720' y='328.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>line-of-sight point-to-point links and satellites</text>
<rect x='570' y='370' width='300' height='78' rx='8' fill='#f3f4f6' stroke='#334155' stroke-width='1.8'/>
<text x='720' y='404.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Infrared</text>
<text x='720' y='424.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>very short range — TV remotes, device pairing</text>
<text x='480' y='500' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Bandwidth: fibre &gt; coaxial &gt; twisted pair   ·   Unguided media are exposed to interference and eavesdropping</text>
</svg>
