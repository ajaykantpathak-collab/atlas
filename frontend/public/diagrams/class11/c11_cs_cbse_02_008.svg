<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Complement Laws</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>A + A' = 1  (always true)   ·   A · A' = 0  (always false)</text>
<rect x='100' y='140' width='340' height='200' rx='10' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<line x1='150' y1='200' x2='210' y2='200' stroke='#334155' stroke-width='1.8'/>
<line x1='150' y1='280' x2='210' y2='280' stroke='#334155' stroke-width='1.8'/>
<text x='130' y='192' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A</text>
<text x='130' y='272' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A'</text>
<circle cx='240' cy='240' r='26' fill='white' stroke='#334155' stroke-width='1.6'/>
<text x='240' y='246' font-size='10.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>LAMP</text>
<line x1='210' y1='200' x2='210' y2='224' stroke='#334155' stroke-width='1.8'/>
<line x1='210' y1='256' x2='210' y2='280' stroke='#334155' stroke-width='1.8'/>
<line x1='210' y1='240' x2='214' y2='240' stroke='#334155' stroke-width='1.8'/>
<text x='270' y='220' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>OR: one of A, A'</text>
<text x='270' y='240' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>is always closed</text>
<text x='270' y='262' font-size='13.5' fill='#059669' text-anchor='start' font-weight='600' font-style='normal'>→ lamp always ON (1)</text>
<rect x='520' y='140' width='340' height='200' rx='10' fill='#f3f4f6' stroke='#334155' stroke-width='1.6'/>
<line x1='570' y1='200' x2='630' y2='200' stroke='#334155' stroke-width='1.8'/>
<line x1='570' y1='280' x2='630' y2='280' stroke='#334155' stroke-width='1.8'/>
<text x='550' y='192' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A</text>
<text x='550' y='272' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>A'</text>
<circle cx='660' cy='240' r='26' fill='white' stroke='#334155' stroke-width='1.6'/>
<text x='660' y='246' font-size='10.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>LAMP</text>
<line x1='630' y1='200' x2='630' y2='224' stroke='#334155' stroke-width='1.8'/>
<line x1='630' y1='256' x2='630' y2='280' stroke='#334155' stroke-width='1.8'/>
<line x1='630' y1='240' x2='634' y2='240' stroke='#334155' stroke-width='1.8'/>
<text x='690' y='220' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>AND: A and A'</text>
<text x='690' y='240' font-size='13.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>can never both close</text>
<text x='690' y='262' font-size='13.5' fill='#dc2626' text-anchor='start' font-weight='600' font-style='normal'>→ lamp always OFF (0)</text>
<text x='480' y='400' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>A variable and its complement cover all cases — together they are the whole universe</text>
</svg>
