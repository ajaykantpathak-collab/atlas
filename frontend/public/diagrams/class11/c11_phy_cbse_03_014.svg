<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Uniform Circular Motion</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Speed constant, velocity turning — acceleration points to the CENTRE</text>
<circle cx='400' cy='330' r='170' fill='none' stroke='#6b7280' stroke-width='2'/>
<circle cx='400' cy='330' r='5' fill='#1e2430' stroke='#334155' stroke-width='1.6'/>
<text x='400' y='354' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>centre</text>
<circle cx='485' cy='182.776' r='15' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='485' y='187.776' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m</text>
<line x1='485' y1='182.776' x2='545.622' y2='217.776' stroke='#2563eb' stroke-width='3'/>
<polygon points='545.622,217.776 535.698,216.543 539.592,209.798' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='559.622' y='207.776' font-size='13' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>v (tangent)</text>
<line x1='485' y1='182.776' x2='442.5' y2='256.388' stroke='#dc2626' stroke-width='3'/>
<polygon points='442.5,256.388 443.733,246.464 450.478,250.358' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='428.5' y='246.388' font-size='13' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>a = v²/r</text>
<line x1='400' y1='330' x2='479' y2='193.168' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='4,4'/>
<circle cx='252.776' cy='415' r='15' fill='#fef3c7' stroke='#d97706' stroke-width='2.2'/>
<text x='252.776' y='420' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m</text>
<line x1='252.776' y1='415' x2='217.776' y2='354.378' stroke='#2563eb' stroke-width='3'/>
<polygon points='217.776,354.378 225.753,360.408 219.009,364.302' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<line x1='252.776' y1='415' x2='326.388' y2='372.5' stroke='#dc2626' stroke-width='3'/>
<polygon points='326.388,372.5 320.358,380.478 316.464,373.733' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='150' y='130' font-size='14' fill='#1e2430' text-anchor='start' font-weight='600' font-style='normal'>v ⊥ a at every instant</text>
<rect x='640' y='200' width='290' height='170' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='785' y='243.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>The formulas:</text>
<text x='785' y='261.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>a = v² / r = ω² r</text>
<text x='785' y='280.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>F = m v² / r (centripetal force)</text>
<text x='785' y='298.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>period T = 2πr / v</text>
<text x='785' y='317.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>'centrifugal force' is the pseudo-</text>
<text x='785' y='335.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>force felt in the rotating frame</text>
<text x='480' y='545' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>No outward force acts on the ball — the NET inward force (string tension, friction, gravity) bends the path</text>
<text x='480' y='577' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Examples: stone on a string, car on a flat curve (friction), planets (gravity), electron orbits (electric force)</text>
<text x='480' y='609' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Doubling speed quadruples the needed force — why speeding into curves is dangerous</text>
<text x='480' y='638' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>v is tangential because the ball continuously falls toward the centre but keeps missing</text>
</svg>
