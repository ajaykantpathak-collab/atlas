<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Bank Reconciliation Statement (BRS)</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Cash book and bank statement disagree — BRS finds and explains every gap</text>
<rect x='150' y='130' width='280' height='90' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='290' y='160.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cash Book (bank column)</text>
<text x='290' y='179.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>our record of what WE think</text>
<text x='290' y='198.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the bank balance is</text>
<rect x='530' y='130' width='280' height='90' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='670' y='160.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Bank Statement</text>
<text x='670' y='179.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the bank's record of the SAME</text>
<text x='670' y='198.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>account</text>
<line x1='300' y1='240' x2='411.95' y2='295.975' stroke='#334155' stroke-width='2.6'/>
<polygon points='420,300 413.963,291.95 409.938,300' fill='#334155' stroke='#334155' stroke-width='1'/>
<line x1='660' y1='240' x2='548.05' y2='295.975' stroke='#334155' stroke-width='2.6'/>
<polygon points='540,300 550.062,300 546.037,291.95' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='360' y='305' width='240' height='70' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='480' y='335.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>differences?</text>
<text x='480' y='354.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>time the BRS</text>
<rect x='120' y='380' width='330' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='285' y='392.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cheques issued but not</text>
<text x='285' y='410.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>yet presented (we subtracted,</text>
<text x='285' y='427.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>bank hasn't paid)</text>
<rect x='120' y='442' width='330' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='285' y='454.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Cheques deposited but</text>
<text x='285' y='472.375' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>not yet collected (bank</text>
<text x='285' y='489.875' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>credit pending)</text>
<rect x='120' y='504' width='330' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='285' y='525.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Bank charges / interest,</text>
<text x='285' y='543.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>direct debits unknown to us</text>
<rect x='120' y='566' width='330' height='52' rx='8' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.8'/>
<text x='285' y='587.625' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Direct deposits by</text>
<text x='285' y='605.125' font-size='12.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>customers into the bank</text>
<text x='700' y='420' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>BRS: start from one balance,</text>
<text x='700' y='442' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>adjust for every timing gap /</text>
<text x='700' y='464' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>unrecorded item, arrive at the</text>
<text x='700' y='486' font-size='14' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>other balance — both must</text>
<text x='700' y='508' font-size='14' fill='#1e2430' text-anchor='start' font-weight='700' font-style='normal'>RECONCILE (match)</text>
<text x='700' y='540' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>prepared periodically,</text>
<text x='700' y='558' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>not a ledger account</text>
<text x='480' y='630' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why it matters: detects errors EARLY (ours or the bank's), updates unrecorded charges, keeps fraud visible</text>
</svg>
