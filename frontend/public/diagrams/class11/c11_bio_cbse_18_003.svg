<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Helvetica,Arial,sans-serif">
<rect width="940" height="520" fill="#ffffff"/>
<text x="470" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#233">Structure of a synapse (chemical transmission)</text>
<!-- presynaptic terminal -->
<path d="M60 90 C 240 60, 420 70, 560 140 C 600 165, 620 200, 620 240 L 620 300 L 60 300 C 30 240, 30 150, 60 90 Z" fill="#fbe8d8" stroke="#c77b3a" stroke-width="4"/>
<text x="200" y="120" font-size="16" font-weight="bold" fill="#8a5a20">Axon terminal (pre-synaptic neuron)</text>
<!-- vesicles -->
<g stroke="#c77b3a" stroke-width="2.5" fill="#fff">
<circle cx="360" cy="200" r="26"/><circle cx="450" cy="170" r="26"/><circle cx="430" cy="250" r="26"/><circle cx="520" cy="215" r="26"/><circle cx="320" cy="252" r="26"/>
</g>
<g fill="#5a8fd6">
<circle cx="352" cy="196" r="5"/><circle cx="368" cy="206" r="5"/><circle cx="360" cy="210" r="5"/>
<circle cx="442" cy="166" r="5"/><circle cx="458" cy="176" r="5"/><circle cx="450" cy="182" r="5"/>
<circle cx="422" cy="246" r="5"/><circle cx="438" cy="256" r="5"/><circle cx="430" cy="262" r="5"/>
<circle cx="512" cy="211" r="5"/><circle cx="528" cy="221" r="5"/><circle cx="520" cy="227" r="5"/>
<circle cx="312" cy="248" r="5"/><circle cx="328" cy="258" r="5"/><circle cx="320" cy="264" r="5"/>
</g>
<text x="330" y="345" font-size="15" fill="#233">Synaptic vesicles (store neurotransmitter)</text>
<ellipse cx="150" cy="240" rx="52" ry="30" fill="#f6c6c6" stroke="#b04a4a" stroke-width="2.5"/>
<text x="150" y="245" text-anchor="middle" font-size="13" fill="#7a2f2f">Mitochondrion</text>
<!-- membrane + cleft -->
<rect x="620" y="140" width="16" height="160" fill="#8a5fbf"/>
<rect x="700" y="140" width="16" height="160" fill="#4a9ab5"/>
<text x="668" y="122" text-anchor="middle" font-size="15" fill="#233">Synaptic cleft</text>
<!-- neurotransmitters crossing -->
<g fill="#5a8fd6">
<circle cx="645" cy="170" r="6"/><circle cx="662" cy="195" r="6"/><circle cx="648" cy="225" r="6"/><circle cx="668" cy="252" r="6"/><circle cx="655" cy="280" r="6"/>
</g>
<text x="560" y="415" font-size="15" fill="#36a">Neurotransmitter molecules diffuse across the cleft</text>
<!-- postsynaptic membrane + receptors -->
<path d="M716 120 C 800 130, 850 170, 880 220 L 880 340 C 800 330, 760 320, 716 300 Z" fill="#e2f0e2" stroke="#3f8a3f" stroke-width="4"/>
<g stroke="#3f8a3f" stroke-width="4" fill="#bfe3bf">
<path d="M740 180 a 14 14 0 1 1 0.1 0 Z"/>
<path d="M760 240 a 14 14 0 1 1 0.1 0 Z"/>
<path d="M780 200 a 14 14 0 1 1 0.1 0 Z"/>
</g>
<text x="800" y="388" font-size="15" fill="#233">Post-synaptic neuron:</text>
<line x1="752" y1="192" x2="700" y2="430" stroke="#555"/>
<text x="420" y="448" font-size="15" fill="#233">Receptor proteins on post-synaptic membrane</text>
<text x="470" y="502" text-anchor="middle" font-size="13" fill="#667">Original diagram created from node curriculum content (CC0), Atlas wave-T 2026-09-29</text>
</svg>
