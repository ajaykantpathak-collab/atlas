<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Boolean Expression as a Tree</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Y = (A + B)' · C — operators are nodes, variables are leaves</text>
<rect x='410' y='110' width='70' height='40' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='445' y='134.9' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>· AND</text>
<rect x='240' y='220' width='90' height='40' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='285' y='244.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>NOR (A+B)'</text>
<rect x='600' y='220' width='60' height='40' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='630' y='245.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>C</text>
<rect x='130' y='330' width='60' height='40' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='160' y='355.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>A</text>
<rect x='320' y='330' width='60' height='40' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='350' y='355.25' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>B</text>
<line x1='445' y1='150' x2='285' y2='220' stroke='#334155' stroke-width='1.8'/>
<line x1='445' y1='150' x2='630' y2='220' stroke='#334155' stroke-width='1.8'/>
<line x1='285' y1='260' x2='160' y2='330' stroke='#334155' stroke-width='1.8'/>
<line x1='285' y1='260' x2='350' y2='330' stroke='#334155' stroke-width='1.8'/>
<text x='480' y='430' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Evaluate bottom-up: A OR B → invert → AND with C</text>
<text x='480' y='462' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The tree shows operator precedence: parentheses (deepest) bind first</text>
</svg>
