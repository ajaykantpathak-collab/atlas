<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Relief of the Ocean Floor</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The seabed has mountains, plains and trenches like land does</text>
<line x1='80' y1='160' x2='880' y2='160' stroke='#2563eb' stroke-width='2'/>
<text x='890' y='165' font-size='12' fill='#2563eb' text-anchor='start' font-weight='normal' font-style='normal'>sea level</text>
<line x1='80' y1='260' x2='200' y2='300' stroke='#8a6d3b' stroke-width='4'/>
<line x1='200' y1='300' x2='320' y2='380' stroke='#8a6d3b' stroke-width='4'/>
<line x1='320' y1='380' x2='420' y2='430' stroke='#8a6d3b' stroke-width='4'/>
<line x1='420' y1='430' x2='520' y2='445' stroke='#8a6d3b' stroke-width='4'/>
<line x1='520' y1='445' x2='600' y2='430' stroke='#8a6d3b' stroke-width='4'/>
<line x1='600' y1='430' x2='660' y2='380' stroke='#8a6d3b' stroke-width='4'/>
<line x1='660' y1='380' x2='720' y2='470' stroke='#8a6d3b' stroke-width='4'/>
<line x1='720' y1='470' x2='780' y2='500' stroke='#8a6d3b' stroke-width='4'/>
<line x1='780' y1='500' x2='880' y2='480' stroke='#8a6d3b' stroke-width='4'/>
<path d='M 80 260 L 200 300 320 380 420 430 520 445 600 430 660 380 720 470 780 500 880 480 L 880 480 L 880 560 L 80 560 Z' fill='#8a6d3b' fill-opacity='0.35' stroke='none'/>
<text x='140' y='240' font-size='13' fill='#5b4632' text-anchor='middle' font-weight='700' font-style='normal'>CONTINENTAL SHELF</text>
<text x='140' y='257' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>gentle submerged edge, richest fisheries</text>
<text x='330' y='355' font-size='13' fill='#5b4632' text-anchor='middle' font-weight='700' font-style='normal'>CONTINENTAL SLOPE</text>
<text x='330' y='372' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>steep drop to the deep</text>
<text x='520' y='480' font-size='13' fill='#5b4632' text-anchor='middle' font-weight='700' font-style='normal'>ABYSSAL PLAIN</text>
<text x='520' y='497' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>vast flat deep floor</text>
<text x='655' y='350' font-size='13' fill='#5b4632' text-anchor='middle' font-weight='700' font-style='normal'>SEAMOUNT / ISLAND</text>
<text x='655' y='367' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>volcanic peak</text>
<text x='760' y='530' font-size='13' fill='#5b4632' text-anchor='middle' font-weight='700' font-style='normal'>TRENCH</text>
<text x='760' y='547' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>deepest zones</text>
<text x='480' y='100' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>The shelf holds most marine life; the slope funnels sediment; trenches mark plate collisions</text>
<text x='480' y='610' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Mapping tools: echo-sounding (sonar depth), satellite altimetry (gravity bumps), submersibles</text>
<text x='480' y='640' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Mariana Trench ≈ 11 km deep — Everest (8.8 km) would sink inside it with 2 km of water above</text>
</svg>
