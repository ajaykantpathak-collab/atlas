<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Law of Conservation of Mass</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Lavoisier: matter is only rearranged — total mass never changes in a closed system</text>
<rect x='120' y='180' width='300' height='120' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='270' y='215.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>REACTANTS</text>
<text x='270' y='235.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>sodium carbonate solution</text>
<text x='270' y='254.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>+ calcium chloride solution</text>
<text x='270' y='274.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>mass = 100.00 g</text>
<line x1='430' y1='240' x2='521' y2='240' stroke='#334155' stroke-width='3.4'/>
<polygon points='530,240 521,235.5 521,244.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<rect x='447.2' y='220' width='65.6' height='19' rx='4' fill='white' stroke='none' stroke-width='1.6'/>
<text x='480' y='234' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>reaction</text>
<rect x='540' y='180' width='300' height='120' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='690' y='215.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>PRODUCTS</text>
<text x='690' y='235.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>calcium carbonate (ppt)</text>
<text x='690' y='254.825' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>+ sodium chloride solution</text>
<text x='690' y='274.325' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>mass = 100.00 g</text>
<rect x='90' y='120' width='780' height='220' rx='14' fill='none' stroke='#6b7280' stroke-width='2' stroke-dasharray='8,6'/>
<text x='480' y='148' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>CLOSED SYSTEM — nothing enters, nothing escapes</text>
<text x='480' y='380' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Balance reading identical before and after — atoms are only regrouped, never created or destroyed</text>
<rect x='120' y='430' width='340' height='120' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='290' y='466.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>When is it MISSED?</text>
<text x='290' y='485.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>open flask: gas escapes (candle</text>
<text x='290' y='503.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>burning, vinegar + baking soda) — the</text>
<text x='290' y='522.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>law still holds; the SET-UP fails</text>
<rect x='500' y='430' width='340' height='120' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='1.8'/>
<text x='670' y='466.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why it matters:</text>
<text x='670' y='485.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>every balanced equation is this law</text>
<text x='670' y='503.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>written in symbols — same atom counts of</text>
<text x='670' y='522.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>each element on both sides</text>
<text x='480' y='600' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Example check: 2H2 + O2 → 2H2O — 4 H and 2 O atoms before, 4 H and 2 O atoms after</text>
</svg>
