<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Conservation of Angular Momentum</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>No external torque → Iω stays constant: spin faster as I shrinks</text>
<circle cx='250' cy='300' r='40' fill='#f3f4f6' stroke='#334155' stroke-width='2'/>
<circle cx='250' cy='220' r='16' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<line x1='250' y1='236' x2='250' y2='262' stroke='#334155' stroke-width='3'/>
<line x1='210' y1='250' x2='290' y2='250' stroke='#334155' stroke-width='3'/>
<text x='250' y='380' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>arms OUT: I large,</text>
<text x='250' y='398' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ω small — slow spin</text>
<line x1='380' y1='300' x2='471' y2='300' stroke='#334155' stroke-width='3'/>
<polygon points='480,300 471,295.5 471,304.5' fill='#334155' stroke='#334155' stroke-width='1'/>
<text x='430' y='282' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>pull arms in</text>
<circle cx='620' cy='300' r='28' fill='#f3f4f6' stroke='#334155' stroke-width='2'/>
<circle cx='620' cy='236' r='16' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<line x1='620' y1='252' x2='620' y2='272' stroke='#334155' stroke-width='3'/>
<line x1='600' y1='262' x2='640' y2='262' stroke='#334155' stroke-width='3'/>
<path d='M 660 260 A 45 45 0 1 1 655 285' fill='none' stroke='#2563eb' stroke-width='2.2'/>
<polygon points='655,285 653.64,277.116 659.708,278.532' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='620' y='380' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>arms IN: I small,</text>
<text x='620' y='398' font-size='13' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ω large — fast spin</text>
<rect x='100' y='440' width='360' height='140' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='280' y='477.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>The ledger:</text>
<text x='280' y='496.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>L = I ω = constant</text>
<text x='280' y='514.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>½Iω² (rotation KE) actually</text>
<text x='280' y='533.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>INCREASES — the skater does work</text>
<text x='280' y='551.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>pulling mass inward</text>
<rect x='500' y='440' width='380' height='140' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='1.8'/>
<text x='690' y='477.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Same physics, huge scale:</text>
<text x='690' y='496.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>collapsing gas cloud spins into</text>
<text x='690' y='514.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>a disc; neutron stars rotate hundreds</text>
<text x='690' y='533.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>of times per second; planets keep</text>
<text x='690' y='551.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>their spin in vacuum</text>
<text x='480' y='620' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Condition: NO EXTERNAL TORQUE about the rotation axis — internal forces can redistribute I freely</text>
<text x='480' y='650' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Vector version: direction of L also conserved — a spinning top refuses to tip (gyroscopic stability)</text>
</svg>
