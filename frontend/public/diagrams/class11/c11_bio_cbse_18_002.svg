<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="Helvetica,Arial,sans-serif">
<rect width="940" height="520" fill="#ffffff"/>
<text x="470" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#233">Conduction of a nerve impulse along an axon</text>
<g font-size="14" fill="#233">
<!-- segment 1 polarised -->
<text x="200" y="74" text-anchor="middle" font-weight="bold">1. Polarised (resting)</text>
<rect x="70" y="120" width="260" height="46" rx="22" fill="#fbe3ec" stroke="#c26"/>
<rect x="70" y="166" width="260" height="34" rx="6" fill="#ddeefc" stroke="#47c"/>
<text x="200" y="147" text-anchor="middle" fill="#a34">inside: negative</text>
<g fill="#47a" font-size="13">
<text x="95" y="114">+</text><text x="140" y="114">+</text><text x="185" y="114">+</text><text x="230" y="114">+</text><text x="275" y="114">+</text><text x="315" y="114">+</text>
</g>
<text x="200" y="216" text-anchor="middle" fill="#36a">outside: positive (Na+ outside)</text>
<!-- segment 2 depolarised -->
<text x="480" y="74" text-anchor="middle" font-weight="bold">2. Depolarised (impulse site A)</text>
<rect x="350" y="120" width="260" height="46" rx="22" fill="#d9f0d9" stroke="#4a4"/>
<rect x="350" y="166" width="260" height="34" rx="6" fill="#ddeefc" stroke="#47c"/>
<text x="480" y="147" text-anchor="middle" fill="#383">inside: positive (Na+ in)</text>
<g fill="#a34" font-size="13">
<text x="375" y="114">-</text><text x="420" y="114">-</text><text x="465" y="114">-</text><text x="510" y="114">-</text><text x="555" y="114">-</text><text x="595" y="114">-</text>
</g>
<text x="480" y="216" text-anchor="middle" fill="#36a">outside: negative</text>
<!-- segment 3 repolarised -->
<text x="760" y="74" text-anchor="middle" font-weight="bold">3. Repolarising (behind the impulse)</text>
<rect x="630" y="120" width="260" height="46" rx="22" fill="#fbe3ec" stroke="#c26"/>
<rect x="630" y="166" width="260" height="34" rx="6" fill="#ddeefc" stroke="#47c"/>
<text x="760" y="147" text-anchor="middle" fill="#a34">K+ out; restoring rest</text>
<g fill="#47a" font-size="13">
<text x="655" y="114">+</text><text x="700" y="114">+</text><text x="745" y="114">+</text><text x="790" y="114">+</text><text x="835" y="114">+</text>
</g>
<text x="760" y="216" text-anchor="middle" fill="#36a">outside: becoming positive</text>
</g>
<!-- impulse arrow -->
<path d="M110 250 L 850 250" stroke="#e67" stroke-width="5"/>
<path d="M850 250 L 826 240 L 826 260 Z" fill="#e67"/>
<text x="480" y="276" text-anchor="middle" font-size="16" fill="#a45">direction of impulse conduction</text>
<!-- potential graph -->
<g transform="translate(80,320)">
<rect x="0" y="0" width="780" height="150" fill="#f7f9fc" stroke="#bbb"/>
<line x1="40" y1="120" x2="760" y2="120" stroke="#666"/>
<line x1="40" y1="120" x2="40" y2="14" stroke="#666"/>
<path d="M40 105 L 180 105 C 220 105, 215 22, 260 22 C 300 22, 295 22, 330 60 C 350 88, 356 100, 400 102 C 440 104, 450 88, 480 88 C 510 88, 520 100, 560 104 L 760 105" stroke="#e67" stroke-width="4" fill="none"/>
<g font-size="13.5" fill="#233">
<text x="8" y="70" transform="rotate(-90 20 70)">potential</text>
<text x="80" y="140">resting</text>
<text x="240" y="140">depolarisation</text>
<text x="420" y="140">repolarisation</text>
<text x="600" y="140">restored rest</text>
</g>
</g>
<text x="470" y="502" text-anchor="middle" font-size="13" fill="#667">Original diagram created from node curriculum content (CC0), Atlas wave-T 2026-09-29</text>
</svg>
