<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Satellites: Falling Forever, Missing Always</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Orbital speed from gravity doing the bending</text>
<circle cx='330' cy='320' r='110' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<text x='330' y='325' font-size='15' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>Earth</text>
<circle cx='330' cy='320' r='240' fill='none' stroke='#6b7280' stroke-width='1.8'/>
<circle cx='513.851' cy='165.731' r='13' fill='#f3f4f6' stroke='#6b7280' stroke-width='2.2'/>
<text x='513.851' y='170.731' font-size='11' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>m</text>
<line x1='513.851' y1='165.731' x2='565.274' y2='227.015' stroke='#2563eb' stroke-width='3'/>
<polygon points='565.274,227.015 556.37,222.462 562.336,217.456' fill='#2563eb' stroke='#2563eb' stroke-width='1'/>
<text x='579.274' y='217.015' font-size='13' fill='#2563eb' text-anchor='start' font-weight='700' font-style='normal'>v₀</text>
<line x1='513.851' y1='165.731' x2='460.228' y2='210.726' stroke='#dc2626' stroke-width='3'/>
<polygon points='460.228,210.726 464.78,201.823 469.786,207.789' fill='#dc2626' stroke='#dc2626' stroke-width='1'/>
<text x='446.228' y='200.726' font-size='13' fill='#dc2626' text-anchor='start' font-weight='700' font-style='normal'>g</text>
<text x='450' y='119.731' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>v₀ ⊥ g</text>
<rect x='620' y='140' width='320' height='190' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='780' y='184.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Orbital speed (close orbit):</text>
<text x='780' y='202.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>v = √(GM/r) ≈ 7.9 km/s</text>
<text x='780' y='221.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>period T² ∝ r³ (Kepler's 3rd)</text>
<text x='780' y='239.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>higher orbit → slower speed,</text>
<text x='780' y='258.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>LONGER period</text>
<text x='780' y='276.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>geostationary: r ≈ 42,000 km,</text>
<text x='780' y='295.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>T = 24 h</text>
<rect x='620' y='360' width='320' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='780' y='392.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why not fall?</text>
<text x='780' y='411.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>it DOES — but the</text>
<text x='780' y='429.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>surface curves away as fast</text>
<text x='780' y='448.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>as it falls: perpetual free</text>
<text x='780' y='466.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>fall = orbit</text>
<text x='480' y='545' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Launch eccentricity: v &lt; 7.9 km/s → spirals back; 7.9 &lt; v &lt; 11.2 → ellipse; v ≥ 11.2 km/s (escape) → leaves forever</text>
<text x='480' y='577' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Orbit is energy-cheap: kinetic + potential stays constant; rockets fire only to change orbits</text>
<text x='480' y='609' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Astronauts float because they AND the station fall together, not because gravity is gone</text>
<text x='480' y='639' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Polar vs geostationary: imaging satellites scan the whole globe; TV/communication satellites hover fixed</text>
</svg>
