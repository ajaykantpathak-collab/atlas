<text x='167' y='352' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>F1 — all tall (Tt)</text>
<text x='167' y='372' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>dominant T shows; recessive t hidden</text>
<line x1='167' y1='384' x2='167' y2='410' stroke='#6b7280' stroke-width='1.6' marker-end='url(#arw)'/>
<text x='196' y='402' font-size='14' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>self-pollination</text>
<text x='560' y='82' font-size='16' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>F2 — self-pollinate F1 (Tt × Tt)</text>
<text x='608' y='120' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>T</text>
<text x='544' y='156' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>T</text>
<text x='700' y='120' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>t</text>
<text x='544' y='248' font-size='18' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>t</text>
<rect x='560' y='96' width='92' height='92' fill='#d1fae5' stroke='#94a3b8' stroke-width='1.4'/>
<text x='606' y='136' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>TT</text>
<text x='606' y='160' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tall</text>
<rect x='652' y='96' width='92' height='92' fill='#d1fae5' stroke='#94a3b8' stroke-width='1.4'/>
<text x='698' y='136' font-size='21' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>Tt</text>
<text x='698' y='160' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>tall</text>
<rect x='560' y='188' width='92' height='92' fill='#d1fae5' stroke='#94a3b8' stroke-width='1.4'/>
