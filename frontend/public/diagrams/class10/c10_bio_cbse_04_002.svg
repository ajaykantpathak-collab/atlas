<rect x='682' y='344' width='28' height='20' rx='6' fill='#fee2e2' stroke='#dc2626' stroke-width='1.4'/>
<text x='578' y='396' font-size='17' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Genotypic ratio  1 TT : 2 Tt : 1 tt</text>
<rect x='578' y='410' width='62' height='24' rx='6' fill='#dbeafe' stroke='#334155' stroke-width='1.4'/>
<text x='609' y='427' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 TT</text>
<rect x='650' y='410' width='62' height='24' rx='6' fill='#d1fae5' stroke='#334155' stroke-width='1.4'/>
<text x='681' y='427' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>2 Tt</text>
<rect x='722' y='410' width='62' height='24' rx='6' fill='#fee2e2' stroke='#334155' stroke-width='1.4'/>
<text x='753' y='427' font-size='14.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 tt</text>
<rect x='560' y='452' width='372' height='128' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.4'/>
<text x='578' y='484' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Rules seen here</text>
<text x='590' y='508' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>• F1 shows only the dominant trait</text>
<text x='590' y='532' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>• F2 recessive trait reappears (3:1)</text>
<text x='590' y='556' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>• Alleles separate; each gamete gets one</text>
<text x='30' y='470' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Each parent passes ONE allele of the pair to every offspring:</text>
<text x='30' y='490' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>TT × tt → all Tt;  Tt × Tt → TT, Tt, Tt, tt.</text>
