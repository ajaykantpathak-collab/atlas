<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Nitrogen: The Triple Bond</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>N≡N — three shared pairs, one reason the gas is so unreactive</text>
<circle cx='330' cy='260' r='46' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
<text x='330' y='267' font-size='20' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>N</text>
<circle cx='630' cy='260' r='46' fill='#dbeafe' stroke='#2563eb' stroke-width='2'/>
<text x='630' y='267' font-size='20' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>N</text>
<line x1='376' y1='234' x2='584' y2='234' stroke='#334155' stroke-width='3.2'/>
<line x1='376' y1='260' x2='584' y2='260' stroke='#334155' stroke-width='3.2'/>
<line x1='376' y1='286' x2='584' y2='286' stroke='#334155' stroke-width='3.2'/>
<text x='480' y='180' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>3 shared pairs = triple bond</text>
<text x='480' y='340' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>each N contributes 3 electrons → 6 shared in total</text>
<text x='330' y='350' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>5 valence e−: 3 shared, 1 lone pair left</text>
<text x='630' y='350' font-size='12.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>5 valence e−: 3 shared, 1 lone pair left</text>
<rect x='150' y='420' width='300' height='110' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='300' y='451.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why N2 barely reacts:</text>
<text x='300' y='470.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>bond energy ≈ 946 kJ/mol — the</text>
<text x='300' y='488.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>strongest common diatomic bond;</text>
<text x='300' y='507.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>breaking it needs huge input</text>
<rect x='510' y='420' width='300' height='110' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='660' y='451.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>How nature does it anyway:</text>
<text x='660' y='470.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>nitrogen-fixing bacteria use</text>
<text x='660' y='488.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>nitrogenase (Rhizobium in root</text>
<text x='660' y='507.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>nodules) at ordinary temperatures</text>
<text x='480' y='580' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Lewis dot check: each atom ends with an octet (3 bond pairs + 1 lone pair)</text>
<text x='480' y='610' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Compare: O2 double bond (498 kJ/mol) is weaker → O2 is far more reactive than N2</text>
</svg>
