<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Reaction of a Metal with Dilute Acid</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Zn + 2HCl → ZnCl2 + H2 ↑ — test the gas by burning pop</text>
