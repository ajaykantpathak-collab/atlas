<circle cx='560' cy='355' r='14' fill='white' stroke='#2563eb' stroke-width='1.2'/>
<text x='620' y='350' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>gas fills soap bubbles</text>
<rect x='760' y='300' width='12' height='160' rx='4' fill='#d1a054' stroke='#334155' stroke-width='1.6'/>
<path d='M 766 300 q -16 -26 0 -44 q 16 18 0 44 Z' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/>
<text x='810' y='290' font-size='13' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>burning splint</text>
<text x='810' y='310' font-size='13' fill='#dc2626' text-anchor='start' font-weight='600' font-style='normal'>→ 'pop' sound</text>
<line x1='745' y1='320' x2='769' y2='320' stroke='#6b7280' stroke-width='2'/>
<polygon points='778,320 769,315.5 769,324.5' fill='#6b7280' stroke='#6b7280' stroke-width='1'/>
<text x='480' y='590' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Observations: bubbles rise (gas), flask warms (exothermic), metal dissolves — a displacement reaction</text>
<text x='480' y='618' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Only metals ABOVE hydrogen in the reactivity series displace H2 from acids (Cu, Ag do not react)</text>
