<text x='570' y='397' font-size='13' fill='#6b7280' text-anchor='middle' font-weight='600' font-style='normal'>stroke ONE direction, lift, repeat 20-30×</text>
<text x='430' y='480' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>AFTER: domains aligned → needle becomes a magnet</text>
