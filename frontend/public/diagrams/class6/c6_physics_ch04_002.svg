<text x='480' y='604.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Key rules: stroke with ONE pole, ONE direction, many times · check with iron filings · dropping/heating DEMAGNETISES</text>
<text x='480' y='655' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Steel keeps magnetism (permanent); soft iron loses it quickly (temporary — used in electromagnets)</text>
