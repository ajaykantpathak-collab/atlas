<text x='420' y='320' font-size='15' fill='#d97706' text-anchor='middle' font-weight='700' font-style='normal'>Ursa Major — the Big Dipper (Saptarshi)</text>
<line x1='650' y1='150' x2='712.186' y2='114.465' stroke='#7c3aed' stroke-width='2.4'/>
<polygon points='720,110 709.953,110.558 714.418,118.372' fill='#7c3aed' stroke='#7c3aed' stroke-width='1'/>
<text x='700' y='95' font-size='12.5' fill='#7c3aed' text-anchor='start' font-weight='600' font-style='normal'>pointer stars → Polaris (north)</text>
<rect x='120' y='380' width='340' height='150' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='1.8'/>
<text x='290' y='431.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>What a constellation is:</text>
<text x='290' y='450.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>a RECOGNISED GROUP of stars forming</text>
<text x='290' y='468.975' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>a pattern — 88 official ones</text>
<text x='290' y='487.475' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>used to map the whole sky</text>
<rect x='500' y='380' width='340' height='150' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='1.8'/>
<text x='670' y='422.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>The catch:</text>
<text x='670' y='441.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>the pattern is a line-of-sight</text>
<text x='670' y='459.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>ACCIDENT — its stars sit at hugely</text>
<text x='670' y='478.225' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>different distances and drift apart</text>
<text x='670' y='496.725' font-size='13.5' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>over millions of years</text>
<text x='480' y='570' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Ancient sailors used the Big Dipper to find north; farmers used Orion's return to time crops</text>
<text x='480' y='602' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Constellations also NAME regions of the sky — every object is catalogued inside one</text>
<text x='480' y='634' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>They appear to wheel around Polaris nightly because EARTH rotates — the stars are not moving</text>
</svg>
