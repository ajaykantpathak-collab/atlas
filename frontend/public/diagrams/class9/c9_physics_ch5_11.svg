<path d='M 92 370 C 85.6667 319 82 335 86 334 C 113 321 106 326.667 110 328 C 142 336.333 135 330.333 134 336 C 131 377 127.333 361 128 370 C 131.667 438.667 139.333 424 132 424 C 81.3333 433 87.3333 433 88 424 C 85.3333 361 92 370 92 370 Z' fill='#93c5fd' stroke='#1d4ed8' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>
<line x1='130' y1='316' x2='420' y2='250' stroke='#2563eb' stroke-width='2.6' marker-end='url(#arw)'/>
<line x1='420' y1='250' x2='130' y2='316' stroke='#059669' stroke-width='2.6' marker-end='url(#arw)'/>
<line x1='420' y1='250' x2='330' y2='250' stroke='#6b7280' stroke-width='1.6' stroke-dasharray='6 4'/>
<text x='324' y='240' font-size='13.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>normal</text>
<path d='M 358 250 A 62 62 0 0 0 362 230' fill='none' stroke='#d97706' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>
<path d='M 358 250 A 62 62 0 0 1 362 270' fill='none' stroke='#d97706' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>
<text x='350' y='294' font-size='14.5' fill='#d97706' text-anchor='start' font-weight='bold' font-style='normal'>i = r</text>
<circle cx='190' cy='330' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='190' y1='330' x2='300' y2='116' stroke='#6b7280' stroke-width='1.2'/>
<text x='306' y='121' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>echo returns to the listener</text>
<circle cx='122' cy='324' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='122' y1='324' x2='84' y2='210' stroke='#6b7280' stroke-width='1.2'/>
<text x='90' y='215' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>sound from source</text>
<line x1='110' y1='448' x2='420' y2='448' stroke='#6b7280' stroke-width='1.4'/>
<line x1='110' y1='442' x2='110' y2='454' stroke='#6b7280' stroke-width='1.4'/>
<line x1='420' y1='442' x2='420' y2='454' stroke='#6b7280' stroke-width='1.4'/>
<text x='266' y='444' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='bold' font-style='normal'>d &gt; 17.2 m</text>
<text x='58' y='480' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>The reflection is heard separately only if it arrives</text>
<text x='58' y='500' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>≥ 0.1 s after the original — hence the 17.2 m rule.</text>
<rect x='506' y='54' width='424' height='470' rx='12' fill='white' stroke='#cbd5e1' stroke-width='1.4'/>
<text x='520' y='80' font-size='16' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Reverberation — reflections that blend</text>
<rect x='540' y='116' width='356' height='234' rx='4' fill='#fafaf9' stroke='#a8a29e' stroke-width='2'/>
<path d='M 540 350 Q 718 320 896 350' fill='none' stroke='#d6d3d1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
<circle cx='600' cy='226' r='12' fill='#fcd9b8' stroke='#b45309' stroke-width='1.4'/>
<path d='M 589 274 C 583.667 224.333 581.333 238.333 584 238 C 601.833 229.667 597.5 235.333 600 236 C 620.167 240.333 615.667 234.333 615 240 C 612.833 280.333 610.5 266.333 611 274 C 613.833 333.333 618.667 320 614 320 C 581.833 327.667 585.5 327.667 586 320 C 584.833 266.333 589 274 589 274 Z' fill='#fda4af' stroke='#be123c' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/>
<path d='M 612 220 L 876 150 L 566 196 L 860 300' fill='none' stroke='#2563eb' stroke-width='2.2' stroke-opacity='0.90'/>
<path d='M 612 224 L 868 176 L 578 230 L 852 296' fill='none' stroke='#2563eb' stroke-width='2.2' stroke-opacity='0.60'/>
<path d='M 612 228 L 858 202 L 592 262 L 844 292' fill='none' stroke='#2563eb' stroke-width='2.2' stroke-opacity='0.38'/>
<text x='890' y='98' font-size='14' fill='#1e2430' text-anchor='end' font-weight='normal' font-style='normal'>walls keep bouncing the</text>
<text x='890' y='116' font-size='14' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>sound until it blends</text>
<text x='552' y='382' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>Many rapid reflections in an enclosed space persist</text>
<text x='552' y='402' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>and overlap: the sound seems prolonged.</text>
<text x='540' y='446' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Fix: curtains, carpets, cushioned seats, acoustic boards</text>
<text x='540' y='466' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>absorb the excess reflections.</text>
<text x='30' y='556' font-size='15' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Both follow the law of reflection: angle of incidence = angle of reflection.</text>
</svg>
