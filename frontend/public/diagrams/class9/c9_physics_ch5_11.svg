<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<defs><marker id='arw' markerWidth='9' markerHeight='7' refX='7.5' refY='3.5' orient='auto'><polygon points='0 0, 9 3.5, 0 7' fill='#334155'/></marker></defs>
<rect width='960' height='640' fill='white'/>
<text x='30' y='34' font-size='21' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Reflection of sound — echo and reverberation</text>
<rect x='30' y='54' width='452' height='470' rx='12' fill='white' stroke='#cbd5e1' stroke-width='1.4'/>
<text x='44' y='80' font-size='16' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Echo — a distinct reflected sound</text>
<path d='M 420 480 L 420 100 L 448 92 L 448 480 Z' fill='#e7e5e4' stroke='#a8a29e' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>
<line x1='426' y1='122' x2='442' y2='118' stroke='#a8a29e' stroke-width='1.2'/>
<line x1='426' y1='162' x2='442' y2='158' stroke='#a8a29e' stroke-width='1.2'/>
<line x1='426' y1='202' x2='442' y2='198' stroke='#a8a29e' stroke-width='1.2'/>
<line x1='426' y1='242' x2='442' y2='238' stroke='#a8a29e' stroke-width='1.2'/>
<line x1='426' y1='282' x2='442' y2='278' stroke='#a8a29e' stroke-width='1.2'/>
