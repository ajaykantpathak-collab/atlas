<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<rect width='960' height='640' fill='white'/>
<text x='480' y='34' font-size='23' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>Algebra Tiles: Seeing (x + 2)(x + 3)</text>
<text x='480' y='58' font-size='15' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Areas multiply: x-strip times x-strip makes x², sides make x's, corners make units</text>
<rect x='200' y='170' width='130' height='130' rx='8' fill='#dbeafe' stroke='#2563eb' stroke-width='2.4'/>
<text x='265' y='241' font-size='22' fill='#2563eb' text-anchor='middle' font-weight='700' font-style='normal'>x²</text>
<rect x='330' y='170' width='42' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='351' y='241' font-size='16' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>x</text>
<rect x='372' y='170' width='42' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='393' y='241' font-size='16' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>x</text>
