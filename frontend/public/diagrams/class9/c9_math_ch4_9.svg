<text x='265' y='326' font-size='16' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>x</text>
<rect x='200' y='342' width='130' height='42' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='265' y='368' font-size='16' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>x</text>
<rect x='200' y='384' width='130' height='42' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='2'/>
<text x='265' y='410' font-size='16' fill='#059669' text-anchor='middle' font-weight='normal' font-style='normal'>x</text>
<rect x='330' y='300' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='351' y='326' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='330' y='342' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='351' y='368' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='330' y='384' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='351' y='410' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='372' y='300' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='393' y='326' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='372' y='342' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='393' y='368' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='372' y='384' width='42' height='42' rx='8' fill='#fef3c7' stroke='#d97706' stroke-width='2'/>
<text x='393' y='410' font-size='13' fill='#92400e' text-anchor='middle' font-weight='normal' font-style='normal'>1</text>
<rect x='200' y='132' width='130' height='28' rx='5' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/>
<text x='265' y='151' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>x</text>
<rect x='162' y='170' width='28' height='130' rx='5' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/>
<text x='176' y='240' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='700' font-style='normal'>x</text>
<text x='480' y='130' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>one x by one x → x²  ·  x by unit → x  ·  unit by unit → 1</text>
<rect x='620' y='200' width='300' height='130' rx='8' fill='#d1fae5' stroke='#059669' stroke-width='1.8'/>
<text x='770' y='241.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Read the rectangle:</text>
<text x='770' y='260.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>1 x² + 5 x + 6</text>
<text x='770' y='279.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>= (x + 2)(x + 3)</text>
<text x='770' y='298.4' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>factoring = finding the side lengths</text>
<text x='480' y='400' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Same idea with negatives: red tiles = −1, and zero-pairs (+1 with −1) cancel</text>
<text x='480' y='450' font-size='14' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Solving x + 3 = 7: take 3 unit tiles from BOTH sides — the balance survives</text>
<text x='480' y='500' font-size='14' fill='#1e2430' text-anchor='middle' font-weight='600' font-style='normal'>Why tiles help: 'like terms' are literally the same SHAPE — x-stacks stack with x-stacks only</text>
<text x='480' y='550' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Extends to completing the square: rearrange x² + bx into a square with a missing corner</text>
<text x='480' y='600' font-size='13.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>Algebra tiles are a concrete bridge from 'moving letters' to 'counting areas'</text>
</svg>
