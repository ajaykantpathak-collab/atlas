<text x='102' y='91' font-size='15' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>nuclear envelope (pores)</text>
<circle cx='442' cy='250' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='442' y1='250' x2='726' y2='120' stroke='#6b7280' stroke-width='1.2'/>
<text x='732' y='125' font-size='15' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>rough ER — flattened sacs</text>
<circle cx='532' cy='312' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='532' y1='312' x2='748' y2='168' stroke='#6b7280' stroke-width='1.2'/>
<text x='754' y='173' font-size='14.5' fill='#1e3a8a' text-anchor='start' font-weight='normal' font-style='normal'>ribosomes on its surface:</text>
<text x='754' y='188' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>makes and processes proteins</text>
<circle cx='608' cy='486' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='608' y1='486' x2='744' y2='380' stroke='#6b7280' stroke-width='1.2'/>
<text x='750' y='385' font-size='15' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>smooth ER — branching tubules</text>
<text x='750' y='400' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>no ribosomes: makes lipids,</text>
<text x='750' y='419' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>detoxifies, stores calcium</text>
<circle cx='226' cy='268' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='226' y1='268' x2='620' y2='560' stroke='#6b7280' stroke-width='1.2'/>
<text x='626' y='565' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>ER is continuous with the nuclear envelope</text>
<text x='626' y='580' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>and spreads through the cytoplasm</text>
