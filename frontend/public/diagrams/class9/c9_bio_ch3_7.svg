<line x1='360' y1='200' x2='138' y2='226' stroke='#6b7280' stroke-width='1.2'/>
<text x='144' y='231' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>micropyle</text>
<circle cx='364' cy='422' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='364' y1='422' x2='214' y2='470' stroke='#6b7280' stroke-width='1.2'/>
<text x='220' y='475' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>synergids</text>
<circle cx='416' cy='440' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='416' y1='440' x2='500' y2='500' stroke='#6b7280' stroke-width='1.2'/>
<text x='506' y='505' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>egg cell (n)</text>
<rect x='620' y='70' width='316' height='250' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.4'/>
<text x='636' y='100' font-size='16' fill='#be185d' text-anchor='start' font-weight='bold' font-style='normal'>Fusion 1 — SYNGAMY</text>
<text x='636' y='126' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>male gamete (n) + egg (n)</text>
<text x='636' y='148' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>→ ZYGOTE (2n) → embryo</text>
<line x1='630' y1='164' x2='920' y2='164' stroke='#cbd5e1' stroke-width='1.2'/>
<text x='636' y='192' font-size='16' fill='#7e22ce' text-anchor='start' font-weight='bold' font-style='normal'>Fusion 2 — TRIPLE FUSION</text>
<text x='636' y='218' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>male gamete (n) + 2 polar nuclei (2n)</text>
<text x='636' y='240' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>→ ENDOSPERM (3n) → food store</text>
<text x='636' y='288' font-size='14' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Two fusions, one event — 'double'</text>
<text x='636' y='306' font-size='14' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>fertilisation.</text>
<circle cx='478' cy='300' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='478' y1='300' x2='614' y2='330' stroke='#6b7280' stroke-width='1.2'/>
<text x='620' y='335' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>central cell,</text>
<text x='620' y='352' font-size='14.5' fill='#6b21a8' text-anchor='start' font-weight='normal' font-style='normal'>2 polar nuclei (2n)</text>
<text x='620' y='396' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>The ovule becomes the seed;</text>
<text x='620' y='416' font-size='14.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>the ovary becomes the fruit.</text>
</svg>
