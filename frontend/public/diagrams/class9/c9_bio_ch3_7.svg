<text x='214' y='105' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>pollen tube (2 male gametes)</text>
<circle cx='392' cy='222' r='2.2' fill='#6b7280' stroke='#6b7280' stroke-width='0.5'/>
<line x1='392' y1='222' x2='150' y2='156' stroke='#6b7280' stroke-width='1.2'/>
<text x='156' y='161' font-size='14.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>antipodal cells</text>
