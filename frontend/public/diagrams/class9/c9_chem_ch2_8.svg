<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640' font-family='Segoe UI, Arial, sans-serif'>
<defs><marker id='arw' markerWidth='9' markerHeight='7' refX='7.5' refY='3.5' orient='auto'><polygon points='0 0, 9 3.5, 0 7' fill='#334155'/></marker></defs>
<rect width='960' height='640' fill='white'/>
<text x='30' y='34' font-size='21' fill='#1e2430' text-anchor='start' font-weight='bold' font-style='normal'>Isotopes of hydrogen — same protons, different neutrons</text>
<circle cx='190' cy='300' r='96' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.6' stroke-dasharray='6 4'/>
<circle cx='190' cy='300' r='17' fill='#fca5a5' stroke='#b91c1c' stroke-width='1.8'/>
<text x='190' y='306' font-size='15' fill='#7f1d1d' text-anchor='middle' font-weight='bold' font-style='normal'>p</text>
<circle cx='240.872' cy='218.587' r='9' fill='#38bdf8' stroke='#0369a1' stroke-width='1.4'/>
<text x='210.872' y='223.587' font-size='14' fill='#0369a1' text-anchor='start' font-weight='normal' font-style='normal'>e⁻</text>
<text x='190' y='448' font-size='17' fill='#2563eb' text-anchor='middle' font-weight='bold' font-style='normal'>Protium</text>
<text x='190' y='474' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>¹H   Z = 1, N = 0</text>
<text x='190' y='498' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>mass number A = 1</text>
<circle cx='482' cy='300' r='96' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.6' stroke-dasharray='6 4'/>
<circle cx='476' cy='300' r='17' fill='#fca5a5' stroke='#b91c1c' stroke-width='1.8'/>
<text x='476' y='306' font-size='15' fill='#7f1d1d' text-anchor='middle' font-weight='bold' font-style='normal'>p</text>
<circle cx='501' cy='288' r='15' fill='#d4d4d8' stroke='#71717a' stroke-width='1.6'/>
<text x='501' y='294' font-size='15' fill='#3f3f46' text-anchor='middle' font-weight='bold' font-style='normal'>n</text>
<circle cx='532.872' cy='218.587' r='9' fill='#38bdf8' stroke='#0369a1' stroke-width='1.4'/>
<text x='502.872' y='223.587' font-size='14' fill='#0369a1' text-anchor='start' font-weight='normal' font-style='normal'>e⁻</text>
<text x='482' y='448' font-size='17' fill='#059669' text-anchor='middle' font-weight='bold' font-style='normal'>Deuterium</text>
<text x='482' y='474' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>²H   Z = 1, N = 1</text>
<text x='482' y='498' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>mass number A = 2</text>
<circle cx='774' cy='300' r='96' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.6' stroke-dasharray='6 4'/>
<circle cx='768' cy='300' r='17' fill='#fca5a5' stroke='#b91c1c' stroke-width='1.8'/>
<text x='768' y='306' font-size='15' fill='#7f1d1d' text-anchor='middle' font-weight='bold' font-style='normal'>p</text>
<circle cx='793' cy='288' r='15' fill='#d4d4d8' stroke='#71717a' stroke-width='1.6'/>
<text x='793' y='294' font-size='15' fill='#3f3f46' text-anchor='middle' font-weight='bold' font-style='normal'>n</text>
<circle cx='796' cy='314' r='15' fill='#d4d4d8' stroke='#71717a' stroke-width='1.6'/>
<text x='796' y='320' font-size='15' fill='#3f3f46' text-anchor='middle' font-weight='bold' font-style='normal'>n</text>
<circle cx='824.872' cy='218.587' r='9' fill='#38bdf8' stroke='#0369a1' stroke-width='1.4'/>
<text x='794.872' y='223.587' font-size='14' fill='#0369a1' text-anchor='start' font-weight='normal' font-style='normal'>e⁻</text>
<text x='774' y='448' font-size='17' fill='#d97706' text-anchor='middle' font-weight='bold' font-style='normal'>Tritium</text>
<text x='774' y='474' font-size='15' fill='#1e2430' text-anchor='middle' font-weight='normal' font-style='normal'>³H   Z = 1, N = 2</text>
<text x='774' y='498' font-size='14.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>mass number A = 3</text>
<rect x='60' y='522' width='840' height='92' rx='10' fill='white' stroke='#cbd5e1' stroke-width='1.4'/>
<text x='80' y='552' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>Same atomic number Z = 1 (one proton, one electron) — they are all hydrogen;</text>
<text x='80' y='580' font-size='15.5' fill='#1e2430' text-anchor='start' font-weight='normal' font-style='normal'>different neutrons change the mass number A = p + n. Chemistry stays the same; mass differs.</text>
</svg>
