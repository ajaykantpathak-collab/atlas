<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoodleCard export template</title>
<!--
  Mirrors frontend/components/doodle/DoodleCard.tsx exactly (same DOM
  structure, class names, inline SVG doodles, fit ladder). Uses the same
  font families via locally bundled TTFs so screenshots are deterministic
  and offline-safe (Caveat + Patrick Hand + Baloo 2 for Devanagari).
-->
<style>
  @font-face {
    font-family: 'Caveat';
    src: url('../components/doodle/fonts/caveat.ttf') format('truetype');
    font-weight: 400 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Patrick Hand';
    src: url('../components/doodle/fonts/patrickhand.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Baloo 2';
    src: url('../components/doodle/fonts/baloo2.ttf') format('truetype');
    font-weight: 400 800;
    font-display: block;
  }

  html, body { margin: 0; padding: 0; background: #ffffff; }

  .dc-card {
    --dc-fit: 1;
    --dc-paper: #FDF6E3;
    --dc-ink: #3B322C;
    --dc-ink-soft: #6B5D4F;
    --dc-amber: #E8A020;
    --dc-amber-soft: #FBE8B8;
    --dc-teal: #2A9D8F;
    --dc-teal-soft: #D9F0EB;
    --dc-rose: #E76F51;
    --dc-rose-soft: #FBE3D9;
    --dc-font-head: 'Caveat', 'Comic Sans MS', cursive;
    --dc-font-body: 'Patrick Hand', 'Baloo 2', 'Nirmala UI', sans-serif;

    position: relative;
    width: 1080px;
    height: 1350px;
    box-sizing: border-box;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 8%, rgba(232, 160, 32, 0.07), transparent 42%),
      radial-gradient(ellipse at 88% 96%, rgba(42, 157, 143, 0.06), transparent 40%),
      var(--dc-paper);
    color: var(--dc-ink);
    font-family: var(--dc-font-body);
    font-size: calc(19px * var(--dc-fit));
    line-height: 1.4;
  }
  .dc-card::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent 46px,
      rgba(107, 93, 79, 0.08) 46px, rgba(107, 93, 79, 0.08) 47px);
    z-index: 0;
  }
  .dc-card::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 54px; width: 2px;
    background: rgba(231, 111, 81, 0.18);
    pointer-events: none;
    z-index: 0;
  }
  .dc-inner {
    position: relative;
    z-index: 1;
    height: 100%;
    box-sizing: border-box;
    padding: 34px 44px 26px 78px;
    display: flex;
    flex-direction: column;
  }
  .dc-banner {
    position: relative;
    flex: 0 0 auto;
    background: linear-gradient(100deg, var(--dc-amber-soft) 0%, #F7D98A 100%);
    border: 2.5px solid var(--dc-ink);
    border-radius: 22px 130px 24px 110px / 100px 22px 120px 22px;
    padding: 16px 66px 18px 84px;
    box-shadow: 4px 5px 0 rgba(59, 50, 44, 0.16);
  }
  .dc-banner-star { position: absolute; left: 18px; top: 14px; width: 52px; height: 52px; }
  .dc-banner-spark { position: absolute; right: 16px; top: -14px; width: 44px; height: 44px; }
  .dc-banner-kicker {
    font-family: var(--dc-font-body);
    font-size: calc(15px * var(--dc-fit));
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--dc-ink-soft);
    margin: 0 0 2px;
  }
  .dc-title {
    font-family: var(--dc-font-head);
    font-weight: 700;
    font-size: calc(52px * var(--dc-fit));
    line-height: 1.04;
    margin: 0;
    color: var(--dc-ink);
  }
  .dc-quote {
    position: relative;
    flex: 0 0 auto;
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.55);
    border: 2px dashed rgba(59, 50, 44, 0.55);
    border-radius: 26px 14px 28px 12px / 14px 30px 12px 26px;
    padding: 20px 26px 18px 66px;
  }
  .dc-quote-mark { position: absolute; left: 14px; top: 2px; width: 44px; height: 44px; }
  .dc-quote-label {
    font-family: var(--dc-font-head);
    font-weight: 600;
    font-size: calc(24px * var(--dc-fit));
    color: var(--dc-teal);
    margin: 0 0 4px;
    letter-spacing: 1px;
  }
  .dc-quote-text { margin: 0; font-size: calc(19px * var(--dc-fit)); line-height: 1.42; }
  .dc-hl {
    background: linear-gradient(100deg,
      rgba(251, 232, 184, 0) 1%,
      rgba(247, 217, 138, 0.9) 3%,
      rgba(247, 217, 138, 0.75) 97%,
      rgba(251, 232, 184, 0) 99%);
    padding: 0 4px;
    border-radius: 4px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .dc-section-head { flex: 0 0 auto; display: flex; align-items: baseline; gap: 10px; margin: 22px 0 6px; }
  .dc-section-title {
    font-family: var(--dc-font-head);
    font-weight: 700;
    font-size: calc(34px * var(--dc-fit));
    margin: 0;
    color: var(--dc-ink);
    letter-spacing: 1px;
  }
  .dc-section-sub { font-size: calc(15px * var(--dc-fit)); color: var(--dc-ink-soft); }
  .dc-squiggle { flex: 0 0 auto; width: 130px; height: 14px; align-self: center; }
  .dc-steps { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin-top: 4px; }
  .dc-step { display: flex; align-items: flex-start; gap: 16px; }
  .dc-step-num {
    flex: 0 0 auto;
    width: calc(42px * var(--dc-fit) + 8px);
    height: calc(42px * var(--dc-fit) + 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dc-teal);
    color: #ffffff;
    font-family: var(--dc-font-head);
    font-weight: 700;
    font-size: calc(26px * var(--dc-fit));
    border: 2px solid var(--dc-ink);
    border-radius: 46% 54% 52% 48% / 55% 46% 54% 45%;
    box-shadow: 2px 2px 0 rgba(59, 50, 44, 0.25);
  }
  .dc-step-text { margin: 2px 0 0; font-size: calc(19px * var(--dc-fit)); line-height: 1.36; }
  .dc-step-arrow {
    flex: 0 0 auto;
    width: calc(42px * var(--dc-fit) + 8px);
    height: calc(26px * var(--dc-fit) + 6px);
    display: flex;
    justify-content: center;
  }
  .dc-step-arrow .dc-arrow-svg { width: 100%; height: 100%; }
  .dc-remember {
    flex: 0 0 auto;
    margin-top: 20px;
    background: rgba(251, 227, 217, 0.5);
    border: 2.5px solid var(--dc-ink);
    border-radius: 18px 120px 20px 100px / 90px 20px 110px 18px;
    padding: 16px 26px 14px 24px;
    box-shadow: 4px 4px 0 rgba(231, 111, 81, 0.22);
  }
  .dc-remember-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dc-remember-star { width: calc(26px * var(--dc-fit) + 4px); height: calc(26px * var(--dc-fit) + 4px); }
  .dc-remember-title {
    font-family: var(--dc-font-head);
    font-weight: 700;
    font-size: calc(30px * var(--dc-fit));
    margin: 0;
    color: var(--dc-rose);
    letter-spacing: 1.5px;
  }
  .dc-remember-list { list-style: none; margin: 0; padding: 0; }
  .dc-remember-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .dc-remember-item:last-child { margin-bottom: 0; }
  .dc-check {
    flex: 0 0 auto;
    width: calc(20px * var(--dc-fit) + 4px);
    height: calc(20px * var(--dc-fit) + 4px);
    margin-top: 3px;
  }
  .dc-remember-text { margin: 0; font-size: calc(18px * var(--dc-fit)); line-height: 1.36; }
  .dc-mis-label {
    font-family: var(--dc-font-head);
    font-weight: 700;
    color: var(--dc-rose);
    font-size: calc(20px * var(--dc-fit));
    white-space: nowrap;
  }
  .dc-mis-text {
    background: linear-gradient(100deg,
      rgba(251, 227, 217, 0) 1%,
      rgba(244, 172, 145, 0.75) 3%,
      rgba(244, 172, 145, 0.6) 97%,
      rgba(251, 227, 217, 0) 99%);
    border-radius: 4px;
    padding: 0 4px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .dc-footer { flex: 0 0 auto; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; }
  .dc-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--dc-font-body);
    font-size: calc(17px * var(--dc-fit));
    background: var(--dc-teal-soft);
    border: 2px solid var(--dc-ink);
    border-radius: 40px 60px 46px 56px / 56px 44px 60px 40px;
    padding: 4px 20px;
    box-shadow: 2px 2px 0 rgba(59, 50, 44, 0.18);
  }
  .dc-chip-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dc-amber); border: 1.5px solid var(--dc-ink); }
  .dc-node-id { font-size: calc(13px * var(--dc-fit)); color: var(--dc-ink-soft); letter-spacing: 0.5px; }
  .dc-corner-spiral { position: absolute; left: 6px; bottom: 26px; width: 42px; height: 42px; z-index: 1; }
</style>
</head>
<body>
<div class="dc-card" id="card"><div class="dc-inner" id="inner"></div></div>

<script>
'use strict';

/* ---- inline SVG doodles (identical paths to DoodleCard.tsx) ---- */
var SVG = {
  star: '<path d="M30 4 L36.5 21.5 L55 22.5 L40.5 34 L45.5 52 L30 41.5 L14.5 52 L19.5 34 L5 22.5 L23.5 21.5 Z" fill="#F7D98A" stroke="#3B322C" stroke-width="2.6" stroke-linejoin="round"/>' +
        '<path d="M24 28 L28.5 33 L37 22" stroke="#3B322C" stroke-width="2.2" stroke-linecap="round" fill="none"/>',
  spark: '<path d="M22 3 C23 12 26 17 34 19 C26 22 23 27 22 39 C21 27 18 22 9 19 C18 17 21 12 22 3 Z" fill="#2A9D8F" stroke="#3B322C" stroke-width="2" stroke-linejoin="round"/>',
  quote: '<path d="M10 26 C10 15 16 9 24 7 L25 12 C20 14 17 17 17 22 L24 22 L24 36 L10 36 Z" fill="#E8A020" stroke="#3B322C" stroke-width="2" stroke-linejoin="round"/>',
  squiggle: '<path d="M3 9 C14 3 22 12 34 7 C46 2 54 11 66 7 C78 3 86 11 98 7 C110 3 118 10 127 6" stroke="#E76F51" stroke-width="3" stroke-linecap="round" fill="none"/>',
  arrow: '<path d="M25 2 C18 8 14 14 16 24" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round" fill="none"/>' +
         '<path d="M9 18 C12 21 14 23 16 26 C19 23 22 21 25 19" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  check: '<path d="M4 13 C7 15 9 18 10 20 C13 14 17 8 21 4" stroke="#2A9D8F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  spiral: '<path d="M23 23 C23 20 27 20 27 24 C27 29 20 30 17 25 C13 19 20 12 27 15 C35 18 34 30 26 33 C22 35 17 34 14 31" stroke="#E8A020" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.8"/>'
};

function svgEl(viewBox, cls, inner) {
  var wrap = document.createElement('span');
  wrap.style.display = 'contents';
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', viewBox);
  s.setAttribute('class', cls);
  s.setAttribute('fill', 'none');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = inner;
  wrap.appendChild(s);
  return s;
}

/* deterministic key-term pick (longest token, earliest on tie)
   Same explicit ranges as DoodleCard.tsx (Latin, Cyrillic, Devanagari, CJK). */
var TOKEN_RANGE = 'A-Za-z0-9\\u00C0-\\u024F\\u0370-\\u04FF\\u0900-\\u097F\\u0E00-\\u0E7F\\u3040-\\u30FF\\u4E00-\\u9FFF\\uAC00-\\uD7AF';
var TOKEN_START = new RegExp('[' + TOKEN_RANGE + ']');
var TOKEN_BODY = new RegExp('[' + TOKEN_RANGE + '\u2019-]');

function keyTerm(text) {
  var best = null;
  var i = 0;
  while (i < text.length) {
    if (TOKEN_START.test(text[i])) {
      var j = i + 1;
      while (j < text.length && TOKEN_BODY.test(text[j])) j += 1;
      if (j - i >= 5 && (!best || j - i > best.term.length)) {
        best = { term: text.slice(i, j), start: i };
      }
      i = j;
    } else {
      i += 1;
    }
  }
  if (!best) return { pre: text, term: '', post: '' };
  return { pre: text.slice(0, best.start), term: best.term, post: text.slice(best.start + best.term.length) };
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

/* Build the card DOM from card data — same structure as the React component. */
function renderDoodleCard(data) {
  var inner = document.getElementById('inner');
  inner.textContent = '';
  var card = document.getElementById('card');
  card.setAttribute('data-node-id', data.node_id || '');
  card.style.setProperty('--dc-fit', '1');

  /* title banner */
  var banner = el('header', 'dc-banner');
  banner.appendChild(svgEl('0 0 60 60', 'dc-banner-star', SVG.star));
  banner.appendChild(svgEl('0 0 44 44', 'dc-banner-spark', SVG.spark));
  banner.appendChild(el('p', 'dc-banner-kicker', 'Concept Card'));
  banner.appendChild(el('h1', 'dc-title', data.title || ''));
  inner.appendChild(banner);

  /* definition quote box */
  var quote = el('section', 'dc-quote');
  quote.appendChild(svgEl('0 0 44 44', 'dc-quote-mark', SVG.quote));
  quote.appendChild(el('h2', 'dc-quote-label', 'What it means'));
  quote.appendChild(el('p', 'dc-quote-text', data.definition || ''));
  inner.appendChild(quote);

  /* how it works */
  var head = el('div', 'dc-section-head');
  head.appendChild(el('h2', 'dc-section-title', 'HOW IT WORKS'));
  var n = (data.steps || []).length;
  head.appendChild(el('span', 'dc-section-sub', n + (n === 1 ? ' step' : ' steps')));
  head.appendChild(svgEl('0 0 130 14', 'dc-squiggle', SVG.squiggle));
  inner.appendChild(head);

  var steps = el('div', 'dc-steps');
  (data.steps || []).forEach(function (step, i) {
    var row = el('div', 'dc-step');
    row.appendChild(el('span', 'dc-step-num', String(i + 1)));
    row.appendChild(el('p', 'dc-step-text', step));
    steps.appendChild(row);
    if (i < n - 1) {
      var aw = el('div', 'dc-step-arrow');
      aw.appendChild(svgEl('0 0 50 30', 'dc-arrow-svg', SVG.arrow));
      steps.appendChild(aw);
    }
  });
  inner.appendChild(steps);

  /* remember box */
  var points = (data.remember || []).slice(0, 3);
  if (data.misconception || points.length > 0) {
    var rem = el('section', 'dc-remember');
    var rh = el('div', 'dc-remember-head');
    rh.appendChild(svgEl('0 0 60 60', 'dc-remember-star', SVG.star));
    rh.appendChild(el('h2', 'dc-remember-title', 'REMEMBER'));
    rem.appendChild(rh);
    var list = el('ul', 'dc-remember-list');
    if (data.misconception) {
      var li0 = el('li', 'dc-remember-item');
      li0.appendChild(svgEl('0 0 24 24', 'dc-check', SVG.check));
      var p0 = el('p', 'dc-remember-text');
      var lab = el('span', 'dc-mis-label', 'Common mistake: ');
      var mis = el('span', 'dc-mis-text', data.misconception);
      p0.appendChild(lab);
      p0.appendChild(mis);
      li0.appendChild(p0);
      list.appendChild(li0);
    }
    points.forEach(function (point) {
      var li = el('li', 'dc-remember-item');
      li.appendChild(svgEl('0 0 24 24', 'dc-check', SVG.check));
      var p = el('p', 'dc-remember-text');
      var kt = keyTerm(point);
      if (kt.term) {
        p.appendChild(document.createTextNode(kt.pre));
        p.appendChild(el('mark', 'dc-hl', kt.term));
        p.appendChild(document.createTextNode(kt.post));
      } else {
        p.appendChild(document.createTextNode(point));
      }
      li.appendChild(p);
      list.appendChild(li);
    });
    rem.appendChild(list);
    inner.appendChild(rem);
  }

  /* footer */
  var foot = el('footer', 'dc-footer');
  var chip = el('span', 'dc-chip');
  chip.appendChild(el('span', 'dc-chip-dot'));
  chip.appendChild(document.createTextNode('Class ' + data.classLevel + ' \u00B7 ' + data.subject));
  foot.appendChild(chip);
  foot.appendChild(el('span', 'dc-node-id', data.node_id || ''));
  inner.appendChild(foot);

  var spiral = svgEl('0 0 46 46', 'dc-corner-spiral', SVG.spiral);
  card.appendChild(spiral);

  return card;
}

/* Deterministic fit ladder: 100 -> 55 in steps of 5. Returns final fit %x100.
   Checks BOTH the card outline and the steps column: the steps flex row may
   overflow internally (behind the Remember box) before the card overflows. */
function fitCard() {
  var card = document.getElementById('card');
  var steps = card.querySelector('.dc-steps');
  var f = 100, guard = 0;
  card.style.setProperty('--dc-fit', '1');
  var over = function () {
    if (card.scrollHeight > card.clientHeight + 1) return true;
    return !!(steps && steps.scrollHeight > steps.clientHeight + 1);
  };
  while (over() && f > 55 && guard < 24) {
    f -= 5;
    card.style.setProperty('--dc-fit', String(f / 100));
    guard += 1;
  }
  return f;
}

window.renderDoodleCard = renderDoodleCard;
window.fitCard = fitCard;
</script>
</body>
</html>
