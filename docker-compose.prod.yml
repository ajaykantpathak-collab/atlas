# ── Production Docker Compose ──────────────────────────────────
# Full stack: databases + backend (x2) + frontend + nginx load balancer
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Environment variables (set in .env or .env.production):
#   POSTGRES_PASSWORD, NEO4J_PASSWORD, CLICKHOUSE_PASSWORD
#   UVICORN_WORKERS (default: 4)
#   SENTRY_DSN (optional)
#   LOG_FORMAT=json (optional, for structured logging)

services:
  # ── Databases (reuse from base docker-compose) ──────────────
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  neo4j:
    extends:
      file: docker-compose.yml
      service: neo4j

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  qdrant:
    extends:
      file: docker-compose.yml
      service: qdrant

  # ── Backend instance 1 ──────────────────────────────────────
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dream-backend-1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dream_user:${POSTGRES_PASSWORD:-dream_secure_2024}@postgres:5432/dream_app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dream_neo4j_2024}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SOLVER_POOL_SIZE: ${SOLVER_POOL_SIZE:-8}
      SOLVER_TIMEOUT_S: ${SOLVER_TIMEOUT_S:-12}
      FREE_TEXT_TIMEOUT_S: ${FREE_TEXT_TIMEOUT_S:-10}
      IDENTIFY_TIMEOUT_S: ${IDENTIFY_TIMEOUT_S:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - dream-net

  # ── Backend instance 2 (horizontal scaling) ─────────────────
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dream-backend-2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dream_user:${POSTGRES_PASSWORD:-dream_secure_2024}@postgres:5432/dream_app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dream_neo4j_2024}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SOLVER_POOL_SIZE: ${SOLVER_POOL_SIZE:-8}
      SOLVER_TIMEOUT_S: ${SOLVER_TIMEOUT_S:-12}
      FREE_TEXT_TIMEOUT_S: ${FREE_TEXT_TIMEOUT_S:-10}
      IDENTIFY_TIMEOUT_S: ${IDENTIFY_TIMEOUT_S:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - dream-net

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dream-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      backend-1:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - dream-net

  # ── Nginx Load Balancer ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dream-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - dream-net

networks:
  dream-net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
