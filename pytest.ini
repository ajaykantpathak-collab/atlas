# Minimal pytest configuration (there was none before batch 1).
#
# `-p no:faulthandler` is load-bearing, not cosmetic. Importing the backend
# API chain pulls in the solver stack (backend/solvers/core_calculus_engine
# imports scipy), and pytest's built-in faulthandler plugin then kills the
# interpreter with:
#
#     Windows fatal exception: code 0xc0000139   (STATUS_ENTRYPOINT_NOT_FOUND)
#
# before a single test is collected, and with no traceback -- the run looks
# like a silent crash. Disabling faulthandler makes the suite runnable:
# `backend/tests/test_idor_guards.py` goes from 0 tests collected to 34
# passing. Re-enabling it means the native conflict has to be fixed first.
#
# Keep this file small: it defines the repo rootdir for pytest, so anything
# added here applies to every future `pytest` invocation, including CI.
[pytest]
addopts = -p no:faulthandler
